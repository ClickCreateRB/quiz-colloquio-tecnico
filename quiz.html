lice test @WebMvcTest?","en":"What is the @WebMvcTest slice test suited for?"},"code":"","options":[{"it":"Testare il layer web (controller) in isolamento, con MockMvc e i @Service mockati","en":"Testing the web layer (controllers) in isolation, with MockMvc and the @Service beans mocked"},{"it":"Testare il layer di persistenza JPA con un database in-memory","en":"Testing the JPA persistence layer with an in-memory database"},{"it":"Testare l\u0027intera applicazione end-to-end con un server reale","en":"Testing the entire application end-to-end with a real server"},{"it":"Testare classi di pura utilita\u0027 senza alcun contesto Spring","en":"Testing pure utility classes without any Spring context"}],"correct":0,"explanation":{"it":"In sintesi: `@WebMvcTest` carica solo il layer MVC (controller, filtri, converter, `@ControllerAdvice`) e mette a disposizione `MockMvc`, mentre le dipendenze di servizio si forniscono come mock (`@MockBean`); e\u0027 lo slice giusto per testare routing, serializzazione e validazione delle richieste.\nLe altre opzioni: la persistenza JPA e\u0027 `@DataJpaTest`; l\u0027E2E con server reale e\u0027 `@SpringBootTest` con `RANDOM_PORT`; per classi pure senza Spring basta un plain unit test.","en":"In summary: `@WebMvcTest` loads only the MVC layer (controllers, filters, converters, `@ControllerAdvice`) and provides `MockMvc`, while the service dependencies are supplied as mocks (`@MockBean`); it is the right slice for testing routing, serialization and request validation.\nThe other options: JPA persistence is `@DataJpaTest`; E2E with a real server is `@SpringBootTest` with `RANDOM_PORT`; for pure classes without Spring a plain unit test is enough."}},{"type":"code","prompt":{"it":"Ogni chiamata a service.process() invoca logger.log(...) una volta. Qual e\u0027 l\u0027esito del test?","en":"Each call to service.process() invokes logger.log(...) once. What is the outcome of the test?"},"code":"service.process();\nservice.process();\nverify(logger, times(1)).log(anyString());","options":[{"it":"Il test fallisce: log e\u0027 stato invocato 2 volte ma se ne attendeva 1","en":"The test fails: log was invoked 2 times but 1 was expected"},{"it":"Il test passa: verify controlla solo che ci sia almeno una chiamata","en":"The test passes: verify only checks that there is at least one call"},{"it":"Il codice non compila per l\u0027uso di anyString()","en":"The code does not compile because of the use of anyString()"},{"it":"Il test passa: verify ignora il numero effettivo di invocazioni","en":"The test passes: verify ignores the actual number of invocations"}],"correct":0,"explanation":{"it":"In sintesi: `process()` chiamato due volte produce due invocazioni di `logger.log(...)`, ma `times(1)` pretende esattamente una chiamata, quindi Mockito fallisce segnalando \u0027Wanted 1 time but was 2 times\u0027.\nLe altre opzioni: \u0027almeno una\u0027 sarebbe `atLeastOnce()`, non `times(1)`; `anyString()` e\u0027 un matcher valido e compila; `times(n)` verifica il conteggio esatto, non lo ignora.","en":"In summary: `process()` called twice produces two invocations of `logger.log(...)`, but `times(1)` demands exactly one call, so Mockito fails, reporting \u0027Wanted 1 time but was 2 times\u0027.\nThe other options: \u0027at least one\u0027 would be `atLeastOnce()`, not `times(1)`; `anyString()` is a valid matcher and compiles; `times(n)` verifies the exact count, it does not ignore it."}},{"type":"mcq","prompt":{"it":"Cosa misura effettivamente la line/branch coverage?","en":"What does line/branch coverage actually measure?"},"code":"","options":[{"it":"Quali righe e rami del codice vengono eseguiti dai test, non la correttezza delle asserzioni","en":"Which lines and branches of the code are executed by the tests, not the correctness of the assertions"},{"it":"Il numero stimato di bug ancora presenti nel codice","en":"The estimated number of bugs still present in the code"},{"it":"La qualita\u0027 e la significativita\u0027 delle asserzioni scritte","en":"The quality and significance of the assertions written"},{"it":"Il tempo di esecuzione complessivo della suite di test","en":"The overall execution time of the test suite"}],"correct":0,"explanation":{"it":"In sintesi: la coverage misura quali istruzioni (line) e quali diramazioni condizionali (branch) sono state percorse durante l\u0027esecuzione dei test; e\u0027 un indicatore di cosa e\u0027 stato esercitato, non se il test verifica il risultato corretto ne\u0027 se coglie il caso limite giusto.\nLe altre opzioni: non stima i bug residui; non giudica la bonta\u0027 delle asserzioni (posso avere 100% senza un solo assert); non ha a che vedere col tempo di esecuzione.","en":"In summary: coverage measures which statements (line) and which conditional branches (branch) were traversed during the execution of the tests; it is an indicator of what was exercised, not of whether the test verifies the correct result or catches the right edge case.\nThe other options: it does not estimate the remaining bugs; it does not judge the quality of the assertions (you can have 100% without a single assert); it has nothing to do with execution time."}},{"type":"truefalse","prompt":{"it":"Uno unit test ben scritto dovrebbe poter essere eseguito senza database, rete o filesystem.","en":"A well-written unit test should be able to run without a database, network or filesystem."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027affermazione e\u0027 vera perche\u0027 lo unit test isola l\u0027unita\u0027 sostituendo le risorse esterne (DB, rete, disco) con doppi di test; questo lo rende veloce, deterministico e indipendente dall\u0027ambiente, coerente con i principi FIRST.\nLe altre opzioni: l\u0027errore tipico e\u0027 chiamare \u0027unit test\u0027 qualcosa che tocca il DB reale; quel test esiste ma e\u0027 un integration test, con velocita\u0027 e isolamento diversi.","en":"In summary: the statement is true because a unit test isolates the unit by replacing external resources (DB, network, disk) with test doubles; this makes it fast, deterministic and independent of the environment, in line with the FIRST principles.\nThe other options: the typical mistake is to call \u0027unit test\u0027 something that touches the real DB; that test exists but is an integration test, with different speed and isolation."}},{"type":"code","prompt":{"it":"Senza alcuno stubbing, quale valore ha result?","en":"Without any stubbing, what value does result have?"},"code":"UserRepository repo = mock(UserRepository.class);\n// firma: Optional\u003cUser\u003e findByEmail(String email)\nOptional\u003cUser\u003e result = repo.findByEmail(\"x@y.z\");","options":[{"it":"Optional.empty(): di default Mockito ritorna un Optional vuoto, non null","en":"Optional.empty(): by default Mockito returns an empty Optional, not null"},{"it":"null, che provochera\u0027 NullPointerException al primo utilizzo","en":"null, which will cause a NullPointerException on first use"},{"it":"Lancia un\u0027eccezione perche\u0027 il metodo non e\u0027 stato stubbato","en":"It throws an exception because the method was not stubbed"},{"it":"Un Optional contenente un oggetto User vuoto","en":"An Optional containing an empty User object"}],"correct":0,"explanation":{"it":"In sintesi: con l\u0027answer di default `RETURNS_DEFAULTS`, Mockito per i tipi \u0027contenitore\u0027 restituisce valori vuoti sensati, quindi per un metodo che ritorna `Optional\u003cUser\u003e` da\u0027 `Optional.empty()`, non `null`; allo stesso modo darebbe liste/insiemi vuoti per le collezioni.\nLe altre opzioni: non e\u0027 null (proprio per evitare NPE su Optional/collections); un metodo non stubbato non lancia, ritorna il default; non c\u0027e\u0027 alcun User avvolto, l\u0027Optional e\u0027 vuoto.","en":"In summary: with the default answer `RETURNS_DEFAULTS`, Mockito returns sensible empty values for \u0027container\u0027 types, so for a method returning `Optional\u003cUser\u003e` it gives `Optional.empty()`, not `null`; likewise it would give empty lists/sets for collections.\nThe other options: it is not null (precisely to avoid NPEs on Optional/collections); an unstubbed method does not throw, it returns the default; there is no wrapped User, the Optional is empty."}},{"type":"mcq","prompt":{"it":"Perche\u0027 i campi annotati @Mock restano null se non si fa altro?","en":"Why do fields annotated @Mock stay null if nothing else is done?"},"code":"","options":[{"it":"Vanno inizializzati con MockitoAnnotations.openMocks(this) o abilitando @ExtendWith(MockitoExtension.class)","en":"They must be initialized with MockitoAnnotations.openMocks(this) or by enabling @ExtendWith(MockitoExtension.class)"},{"it":"@Mock non esiste in Mockito, e\u0027 un\u0027annotazione di JUnit","en":"@Mock does not exist in Mockito, it is a JUnit annotation"},{"it":"Manca l\u0027annotazione @Autowired sopra i campi","en":"The @Autowired annotation is missing above the fields"},{"it":"Perche\u0027 i campi @Mock devono essere dichiarati static","en":"Because @Mock fields must be declared static"}],"correct":0,"explanation":{"it":"In sintesi: `@Mock` e\u0027 dichiarativa: i mock vengono creati e iniettati solo quando qualcosa processa le annotazioni, cioe\u0027 `MockitoAnnotations.openMocks(this)` (di solito in `@BeforeEach`) oppure l\u0027estensione JUnit 5 `@ExtendWith(MockitoExtension.class)`; senza uno dei due i campi restano null.\nLe altre opzioni: `@Mock` esiste ed e\u0027 di Mockito; `@Autowired` riguarda Spring, non l\u0027inizializzazione dei mock; non devono essere static.","en":"In summary: `@Mock` is declarative: the mocks are created and injected only when something processes the annotations, i.e. `MockitoAnnotations.openMocks(this)` (usually in `@BeforeEach`) or the JUnit 5 extension `@ExtendWith(MockitoExtension.class)`; without one of the two the fields stay null.\nThe other options: `@Mock` exists and is Mockito\u0027s; `@Autowired` concerns Spring, not the initialization of mocks; they do not have to be static."}},{"type":"code","prompt":{"it":"Cosa verifica esattamente questo blocco di test?","en":"What exactly does this block of test code verify?"},"code":"Exception ex = assertThrows(\n    IllegalArgumentException.class,\n    () -\u003e service.withdraw(-10));\nassertEquals(\"Amount must be positive\", ex.getMessage());","options":[{"it":"Che venga lanciata IllegalArgumentException e che il suo messaggio sia esattamente quello atteso","en":"That IllegalArgumentException is thrown and that its message is exactly the expected one"},{"it":"Solo che il metodo withdraw non lanci alcuna eccezione","en":"Only that the withdraw method does not throw any exception"},{"it":"Che il metodo withdraw restituisca il valore -10","en":"That the withdraw method returns the value -10"},{"it":"Nulla di utile: assertThrows non restituisce l\u0027eccezione, quindi non compila","en":"Nothing useful: assertThrows does not return the exception, so it does not compile"}],"correct":0,"explanation":{"it":"In sintesi: `assertThrows` verifica che l\u0027esecuzione del lambda lanci `IllegalArgumentException` e restituisce l\u0027istanza catturata, cosi\u0027 con `getMessage()` e un secondo assert si controlla anche che il messaggio sia esattamente \u0027Amount must be positive\u0027; e\u0027 il pattern per validare tipo e contenuto dell\u0027errore.\nLe altre opzioni: non verifica l\u0027assenza di eccezioni, anzi ne pretende una; non controlla alcun valore di ritorno; `assertThrows` restituisce eccome l\u0027eccezione, quindi compila.","en":"In summary: `assertThrows` verifies that the execution of the lambda throws `IllegalArgumentException` and returns the captured instance, so with `getMessage()` and a second assert you also check that the message is exactly \u0027Amount must be positive\u0027; it is the pattern for validating both the type and the content of the error.\nThe other options: it does not verify the absence of exceptions, on the contrary it demands one; it does not check any return value; `assertThrows` does return the exception, so it compiles."}},{"type":"mcq","prompt":{"it":"Cosa consente di fare InOrder in Mockito?","en":"What does InOrder allow you to do in Mockito?"},"code":"","options":[{"it":"Verificare che alcune interazioni siano avvenute in un ordine specifico","en":"Verify that certain interactions occurred in a specific order"},{"it":"Ordinare alfabeticamente i mock prima dell\u0027esecuzione","en":"Sort the mocks alphabetically before execution"},{"it":"Eseguire i test in parallelo su piu\u0027 thread","en":"Run the tests in parallel across multiple threads"},{"it":"Sostituire @InjectMocks nell\u0027assemblaggio delle dipendenze","en":"Replace @InjectMocks in assembling the dependencies"}],"correct":0,"explanation":{"it":"In sintesi: `InOrder` permette la verifica ordinata delle interazioni: creo `InOrder inOrder = inOrder(mockA, mockB)` e poi chiamo i `verify` nella sequenza attesa, cosi\u0027 il test fallisce se le chiamate avvengono in ordine diverso da quello dichiarato.\nLe altre opzioni: non ordina i mock; non gestisce parallelismo; non c\u0027entra con l\u0027iniezione delle dipendenze di `@InjectMocks`.","en":"In summary: `InOrder` allows ordered verification of interactions: you create `InOrder inOrder = inOrder(mockA, mockB)` and then call the `verify` methods in the expected sequence, so the test fails if the calls occur in a different order from the one declared.\nThe other options: it does not sort the mocks; it does not handle parallelism; it has nothing to do with the dependency injection of `@InjectMocks`."}},{"type":"truefalse","prompt":{"it":"Con @SpringBootTest(webEnvironment = RANDOM_PORT) viene avviato un servlet container reale su una porta casuale, utile per test di integrazione con TestRestTemplate/WebTestClient.","en":"With @SpringBootTest(webEnvironment = RANDOM_PORT) a real servlet container is started on a random port, useful for integration tests with TestRestTemplate/WebTestClient."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027affermazione e\u0027 vera perche\u0027 `webEnvironment = RANDOM_PORT` fa partire un embedded server reale su una porta libera casuale (iniettabile con `@LocalServerPort`), permettendo test HTTP end-to-end sul contesto completo tramite `TestRestTemplate` o `WebTestClient`.\nLe altre opzioni: l\u0027errore tipico e\u0027 confonderlo con `MOCK`, che invece non avvia un server reale ma un ambiente web fittizio da usare con `MockMvc`; `RANDOM_PORT` serve proprio quando si vuole il traffico HTTP vero.","en":"In summary: the statement is true because `webEnvironment = RANDOM_PORT` starts a real embedded server on a random free port (injectable with `@LocalServerPort`), enabling end-to-end HTTP tests against the full context via `TestRestTemplate` or `WebTestClient`.\nThe other options: the typical mistake is to confuse it with `MOCK`, which does not start a real server but a mock web environment to be used with `MockMvc`; `RANDOM_PORT` is exactly what you want when you need real HTTP traffic."}}]},{"id":"devops","title":"Build \u0026 DevOps (Maven/Gradle/Git/SVN/Jenkins)","questions":[{"type":"mcq","prompt":{"it":"In quale ordine Maven esegue le fasi del default lifecycle quando lanci `mvn install`?","en":"In what order does Maven run the default lifecycle phases when you launch `mvn install`?"},"code":"","options":[{"it":"compile -\u003e validate -\u003e package -\u003e test -\u003e install","en":"compile -\u003e validate -\u003e package -\u003e test -\u003e install"},{"it":"compile -\u003e test -\u003e package -\u003e deploy -\u003e install","en":"compile -\u003e test -\u003e package -\u003e deploy -\u003e install"},{"it":"validate -\u003e compile -\u003e test -\u003e package -\u003e install","en":"validate -\u003e compile -\u003e test -\u003e package -\u003e install"},{"it":"validate -\u003e test -\u003e compile -\u003e package -\u003e install","en":"validate -\u003e test -\u003e compile -\u003e package -\u003e install"}],"correct":2,"explanation":{"it":"In sintesi: il default lifecycle di Maven procede in ordine `validate`, `compile`, `test`, `package`, `install`, `deploy`, e lanciando una fase Maven esegue automaticamente tutte quelle precedenti; quindi `mvn install` passa da validate fino a package prima di installare l\u0027artifact nel repository locale.\nLe altre opzioni: mettere `compile` prima di `validate` o `test` prima di `compile` inverte l\u0027ordine reale, e `deploy` viene dopo `install`, non prima.","en":"In summary: Maven\u0027s default lifecycle runs in the order `validate`, `compile`, `test`, `package`, `install`, `deploy`, and invoking a given phase automatically runs all the preceding ones; so `mvn install` goes from validate through package before installing the artifact into the local repository.\nThe other options: putting `compile` before `validate`, or `test` before `compile`, reverses the real order, and `deploy` comes after `install`, not before."}},{"type":"mcq","prompt":{"it":"Quale scope Maven useresti per una dipendenza come le Servlet API, necessaria in compilazione ma fornita a runtime dall\u0027application server?","en":"Which Maven scope would you use for a dependency such as the Servlet API, needed at compile time but provided at runtime by the application server?"},"code":"","options":[{"it":"compile","en":"compile"},{"it":"runtime","en":"runtime"},{"it":"provided","en":"provided"},{"it":"test","en":"test"}],"correct":2,"explanation":{"it":"In sintesi: lo scope `provided` indica che la dipendenza serve per compilare ma è fornita a runtime dall\u0027ambiente (container/app server), quindi non viene impacchettata nell\u0027artifact finale: è il caso classico delle Servlet API.\nLe altre opzioni: `compile` la includerebbe nel pacchetto duplicandola, `runtime` la esclude dalla compilazione (qui serve compilare), `test` la limiterebbe alla sola fase di test.","en":"In summary: the `provided` scope indicates that the dependency is needed to compile but is supplied at runtime by the environment (container/app server), so it is not packaged into the final artifact: this is the classic case of the Servlet API.\nThe other options: `compile` would bundle it into the package, duplicating it, `runtime` excludes it from compilation (here you need to compile against it), and `test` would limit it to the test phase only."}},{"type":"code","prompt":{"it":"Data questa gerarchia di dipendenze, quale versione di `C` risolve Maven applicando la strategia nearest-wins?","en":"Given this dependency hierarchy, which version of `C` does Maven resolve when applying the nearest-wins strategy?"},"code":"Project\n├── A:1.0\n│   └── C:1.2\n└── B:1.0\n    └── E:1.0\n        └── C:1.5","options":[{"it":"nessuna: build fallita per conflitto","en":"none: build fails due to a conflict"},{"it":"C:1.2","en":"C:1.2"},{"it":"C:1.5","en":"C:1.5"},{"it":"entrambe, una per ciascun ramo","en":"both, one for each branch"}],"correct":1,"explanation":{"it":"In sintesi: Maven risolve i conflitti con la strategia nearest-wins, cioè vince la dipendenza più vicina alla radice nell\u0027albero; `C:1.2` è a profondità 2 mentre `C:1.5` è a profondità 3, quindi prevale `C:1.2`.\nLe altre opzioni: `C:1.5` è più profonda e perde, Maven non tiene due versioni della stessa dipendenza nello stesso classpath, e un conflitto di versioni non blocca la build (a differenza di un enforcer configurato apposta).","en":"In summary: Maven resolves conflicts with the nearest-wins strategy, meaning the dependency closest to the root in the tree wins; `C:1.2` is at depth 2 while `C:1.5` is at depth 3, so `C:1.2` prevails.\nThe other options: `C:1.5` is deeper and loses, Maven does not keep two versions of the same dependency on the same classpath, and a version conflict does not fail the build (unlike a specifically configured enforcer)."}},{"type":"truefalse","prompt":{"it":"Una dipendenza `1.0.0-SNAPSHOT` può cambiare contenuto binario nel tempo mantenendo la stessa versione, mentre una release come `1.0.0` è considerata immutabile.","en":"A `1.0.0-SNAPSHOT` dependency can change its binary content over time while keeping the same version, whereas a release such as `1.0.0` is considered immutable."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027affermazione è vera perché una `-SNAPSHOT` è una versione in sviluppo che Maven ri-scarica periodicamente dal repository remoto potendo cambiare a parità di nome, mentre una release è pubblicata una sola volta e trattata come immutabile.\nLe altre opzioni: dire il contrario è l\u0027errore tipico: confondere il comportamento mutevole degli SNAPSHOT con l\u0027immutabilità delle release.","en":"In summary: the statement is true, because a `-SNAPSHOT` is a development version that Maven periodically re-downloads from the remote repository and that can change under the same name, whereas a release is published only once and treated as immutable.\nThe other options: stating the opposite is the typical mistake: confusing the mutable behaviour of SNAPSHOTs with the immutability of releases."}},{"type":"mcq","prompt":{"it":"Qual è la differenza tra `mvn install` e `mvn deploy`?","en":"What is the difference between `mvn install` and `mvn deploy`?"},"code":"","options":[{"it":"install compila soltanto, deploy esegue anche i test","en":"install only compiles, deploy also runs the tests"},{"it":"install copia l\u0027artifact nel repository locale (~/.m2), deploy lo pubblica anche sul repository remoto","en":"install copies the artifact into the local repository (~/.m2), deploy also publishes it to the remote repository"},{"it":"sono sinonimi con nomi diversi","en":"they are synonyms with different names"},{"it":"deploy installa in locale, install pubblica sul remoto","en":"deploy installs locally, install publishes to the remote"}],"correct":1,"explanation":{"it":"In sintesi: `install` è la fase che copia l\u0027artifact nel repository locale `~/.m2` rendendolo disponibile agli altri progetti sulla stessa macchina, mentre `deploy` è la fase finale che lo pubblica sul repository remoto condiviso (es. Nexus/Artifactory).\nLe altre opzioni: entrambe eseguono compilazione e test come fasi precedenti, non sono sinonimi, e i ruoli locale/remoto non vanno invertiti.","en":"In summary: `install` is the phase that copies the artifact into the local repository `~/.m2`, making it available to other projects on the same machine, whereas `deploy` is the final phase that publishes it to the shared remote repository (e.g. Nexus/Artifactory).\nThe other options: both run compilation and tests as preceding phases, they are not synonyms, and the local/remote roles must not be swapped."}},{"type":"mcq","prompt":{"it":"Una dipendenza dichiarata con scope `test` (es. JUnit) dove è disponibile?","en":"Where is a dependency declared with `test` scope (e.g. JUnit) available?"},"code":"","options":[{"it":"nell\u0027artifact finale distribuito","en":"in the final distributed artifact"},{"it":"a runtime in produzione ma non durante i test","en":"at runtime in production but not during the tests"},{"it":"solo per compilazione ed esecuzione dei test, non nel classpath di produzione","en":"only for compiling and running the tests, not on the production classpath"},{"it":"fornita dal container a runtime","en":"provided by the container at runtime"}],"correct":2,"explanation":{"it":"In sintesi: lo scope `test` limita la dipendenza al classpath di compilazione ed esecuzione dei test e la esclude dall\u0027artifact di produzione, ideale per framework come JUnit o Mockito.\nLe altre opzioni: non finisce nel pacchetto finale né è disponibile a runtime in produzione, e `provided` (non `test`) è lo scope per le dipendenze fornite dal container.","en":"In summary: the `test` scope limits the dependency to the compile and run classpath of the tests and excludes it from the production artifact, ideal for frameworks such as JUnit or Mockito.\nThe other options: it does not end up in the final package nor is it available at runtime in production, and `provided` (not `test`) is the scope for dependencies supplied by the container."}},{"type":"truefalse","prompt":{"it":"Il repository locale Maven (di default `~/.m2/repository`) funge da cache delle dipendenze scaricate dai repository remoti.","en":"The Maven local repository (by default `~/.m2/repository`) acts as a cache for the dependencies downloaded from the remote repositories."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027affermazione è vera: il repository locale in `~/.m2/repository` conserva le dipendenze scaricate e gli artifact installati, così Maven le riusa senza riscaricarle a ogni build.\nLe altre opzioni: negarlo è l\u0027errore tipico di chi pensa che Maven contatti il remoto a ogni build ignorando il ruolo di cache del repository locale.","en":"In summary: the statement is true: the local repository at `~/.m2/repository` holds the downloaded dependencies and installed artifacts, so Maven reuses them without re-downloading on every build.\nThe other options: denying it is the typical mistake of those who think Maven contacts the remote on every build, ignoring the caching role of the local repository."}},{"type":"mcq","prompt":{"it":"Devi impedire che una dipendenza transitiva indesiderata (es. una vecchia `commons-logging` portata da una libreria) finisca nel classpath. Cosa usi nel pom.xml?","en":"You need to prevent an unwanted transitive dependency (e.g. an old `commons-logging` pulled in by a library) from ending up on the classpath. What do you use in the pom.xml?"},"code":"","options":[{"it":"lo scope `provided` sull\u0027intero progetto","en":"the `provided` scope on the whole project"},{"it":"il tag `\u003coptional\u003etrue\u003c/optional\u003e` sul progetto","en":"the `\u003coptional\u003etrue\u003c/optional\u003e` tag on the project"},{"it":"cancellare manualmente il jar dal repository locale","en":"manually deleting the jar from the local repository"},{"it":"il tag `\u003cexclusions\u003e` all\u0027interno della dipendenza che la trascina","en":"the `\u003cexclusions\u003e` tag inside the dependency that pulls it in"}],"correct":3,"explanation":{"it":"In sintesi: per tagliare una dipendenza transitiva indesiderata si usa `\u003cexclusions\u003e` dentro la dipendenza diretta che la porta, indicando `groupId`/`artifactId` da escludere dal grafo.\nLe altre opzioni: `provided` cambia solo dove la dipendenza è disponibile, `\u003coptional\u003e` riguarda ciò che il tuo progetto NON propaga ai consumatori, e cancellare il jar dalla cache locale è inutile perché verrebbe riscaricato.","en":"In summary: to cut off an unwanted transitive dependency you use `\u003cexclusions\u003e` inside the direct dependency that brings it in, specifying the `groupId`/`artifactId` to exclude from the graph.\nThe other options: `provided` only changes where the dependency is available, `\u003coptional\u003e` concerns what your project does NOT propagate to consumers, and deleting the jar from the local cache is pointless because it would just be re-downloaded."}},{"type":"mcq","prompt":{"it":"Quale affermazione descrive correttamente una differenza tra Gradle e Maven?","en":"Which statement correctly describes a difference between Gradle and Maven?"},"code":"","options":[{"it":"Gradle non gestisce le dipendenze, ci pensa solo Maven","en":"Gradle does not manage dependencies, only Maven does"},{"it":"Gradle usa uno script basato su DSL (Groovy/Kotlin) con build incrementali e cache, mentre Maven usa un pom.xml dichiarativo in XML","en":"Gradle uses a DSL-based script (Groovy/Kotlin) with incremental builds and caching, whereas Maven uses a declarative pom.xml in XML"},{"it":"Maven supporta build incrementali mentre Gradle ricompila sempre tutto da zero","en":"Maven supports incremental builds while Gradle always rebuilds everything from scratch"},{"it":"Gradle non conosce il concetto di dipendenze transitive","en":"Gradle has no concept of transitive dependencies"}],"correct":1,"explanation":{"it":"In sintesi: Gradle definisce la build con uno script in un DSL Groovy o Kotlin ed è ottimizzato per build incrementali e caching, mentre Maven è dichiarativo con `pom.xml` in XML e un lifecycle a fasi fisse.\nLe altre opzioni: entrambi gestiscono dipendenze e transitività, ed è Gradle (non Maven) a puntare sulle build incrementali evitando di ricompilare ciò che non è cambiato.","en":"In summary: Gradle defines the build with a script in a Groovy or Kotlin DSL and is optimised for incremental builds and caching, whereas Maven is declarative with a `pom.xml` in XML and a fixed, phase-based lifecycle.\nThe other options: both manage dependencies and transitivity, and it is Gradle (not Maven) that focuses on incremental builds, avoiding recompiling what has not changed."}},{"type":"mcq","prompt":{"it":"In Gradle, cosa rappresenta un `task`?","en":"In Gradle, what does a `task` represent?"},"code":"","options":[{"it":"un repository remoto di dipendenze","en":"a remote dependency repository"},{"it":"un file di configurazione in formato XML","en":"a configuration file in XML format"},{"it":"l\u0027unità di lavoro elementare di una build (es. `compileJava`, `test`, `jar`)","en":"the elementary unit of work of a build (e.g. `compileJava`, `test`, `jar`)"},{"it":"un branch del progetto in versione","en":"a versioned branch of the project"}],"correct":2,"explanation":{"it":"In sintesi: in Gradle il `task` è l\u0027unità atomica di lavoro della build, come `compileJava`, `test` o `jar`, e i task compongono un grafo di dipendenze (DAG) che Gradle esegue nell\u0027ordine corretto.\nLe altre opzioni: un repository è la fonte delle dipendenze, il file di build Gradle non è XML ma un DSL, e un branch è un concetto di version control, non di Gradle.","en":"In summary: in Gradle a `task` is the atomic unit of work of the build, such as `compileJava`, `test` or `jar`, and tasks form a dependency graph (DAG) that Gradle runs in the correct order.\nThe other options: a repository is the source of dependencies, the Gradle build file is not XML but a DSL, and a branch is a version-control concept, not a Gradle one."}},{"type":"code","prompt":{"it":"Nel seguente `build.gradle`, dove è disponibile `junit-jupiter`?","en":"In the following `build.gradle`, where is `junit-jupiter` available?"},"code":"dependencies {\n    implementation \u0027org.springframework:spring-core:6.1.0\u0027\n    testImplementation \u0027org.junit.jupiter:junit-jupiter:5.10.0\u0027\n}","options":[{"it":"anche nell\u0027artifact di produzione, come spring-core","en":"also in the production artifact, like spring-core"},{"it":"solo nel classpath di compilazione ed esecuzione dei test","en":"only on the compile and run classpath of the tests"},{"it":"a runtime in produzione ma non nei test","en":"at runtime in production but not in the tests"},{"it":"non è una dichiarazione valida","en":"it is not a valid declaration"}],"correct":1,"explanation":{"it":"In sintesi: la configuration `testImplementation` mette `junit-jupiter` solo nel classpath di compilazione ed esecuzione dei test, senza esporlo al codice di produzione né includerlo nell\u0027artifact; è l\u0027equivalente Gradle dello scope `test` di Maven.\nLe altre opzioni: `spring-core` è in `implementation` quindi disponibile in produzione, ma la dipendenza di test non lo è né a runtime né nel pacchetto, e la sintassi è perfettamente valida.","en":"In summary: the `testImplementation` configuration puts `junit-jupiter` only on the compile and run classpath of the tests, without exposing it to production code or including it in the artifact; it is the Gradle equivalent of Maven\u0027s `test` scope.\nThe other options: `spring-core` is in `implementation`, so it is available in production, but the test dependency is not, neither at runtime nor in the package, and the syntax is perfectly valid."}},{"type":"mcq","prompt":{"it":"A cosa serve l\u0027area di staging (index) in Git?","en":"What is the staging area (index) in Git for?"},"code":"","options":[{"it":"a inviare automaticamente i commit al server remoto","en":"to automatically push commits to the remote server"},{"it":"a memorizzare i branch remoti tracciati","en":"to store the tracked remote branches"},{"it":"a comporre e preparare esattamente l\u0027insieme di modifiche che finiranno nel prossimo commit","en":"to compose and prepare exactly the set of changes that will go into the next commit"},{"it":"a risolvere automaticamente i conflitti di merge","en":"to automatically resolve merge conflicts"}],"correct":2,"explanation":{"it":"In sintesi: l\u0027area di staging (o index) è lo spazio intermedio dove con `git add` selezioni con precisione quali modifiche entreranno nel prossimo commit, separando ciò che è pronto da ciò che è ancora in lavorazione nella working directory.\nLe altre opzioni: l\u0027invio al remoto è `push`, i branch remoti sono tracciati altrove, e la risoluzione dei conflitti è manuale, non un compito dello staging.","en":"In summary: the staging area (or index) is the intermediate space where, with `git add`, you precisely select which changes will go into the next commit, separating what is ready from what is still in progress in the working directory.\nThe other options: sending to the remote is `push`, remote branches are tracked elsewhere, and conflict resolution is manual, not a job of the staging area."}},{"type":"truefalse","prompt":{"it":"`git pull` per default si limita a scaricare i commit dal remoto con `git fetch`, senza fonderli nel branch locale.","en":"By default, `git pull` merely downloads the commits from the remote with `git fetch`, without merging them into the local branch."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027affermazione è falsa: `git pull` di default esegue `git fetch` seguito da `git merge`, quindi scarica E integra nel branch locale i commit del branch remoto tracciato (opzionalmente `rebase` se configurato con `pull.rebase`).\nLe altre opzioni: crederla vera significa confondere `pull` con il solo `git fetch`, che aggiorna i riferimenti remoti senza toccare il branch corrente.","en":"In summary: the statement is false: by default `git pull` runs `git fetch` followed by `git merge`, so it downloads AND integrates the commits of the tracked remote branch into the local branch (optionally `rebase` if configured via `pull.rebase`).\nThe other options: believing it true means confusing `pull` with `git fetch` alone, which updates the remote references without touching the current branch."}},{"type":"mcq","prompt":{"it":"Qual è la differenza principale tra `git merge` e `git rebase`?","en":"What is the main difference between `git merge` and `git rebase`?"},"code":"","options":[{"it":"merge riscrive la storia dei commit, rebase la lascia intatta","en":"merge rewrites the commit history, rebase leaves it untouched"},{"it":"sono identici, cambia solo il nome del comando","en":"they are identical, only the command name changes"},{"it":"rebase va usato solo su branch remoti condivisi","en":"rebase should only be used on shared remote branches"},{"it":"merge crea un commit di merge unendo le storie e preservandole; rebase riapplica i tuoi commit sopra una nuova base ottenendo una storia lineare","en":"merge creates a merge commit joining and preserving the histories; rebase reapplies your commits on top of a new base, giving a linear history"}],"correct":3,"explanation":{"it":"In sintesi: `merge` integra due branch creando un commit di merge e mantiene entrambe le storie così come sono, mentre `rebase` riscrive i tuoi commit riapplicandoli sopra un\u0027altra base per ottenere una storia lineare senza commit di merge.\nLe altre opzioni: è il rebase (non il merge) a riscrivere la storia, i due comandi non sono equivalenti, e il rebase va evitato proprio sui branch già condivisi/pubblicati.","en":"In summary: `merge` integrates two branches by creating a merge commit and keeps both histories as they are, whereas `rebase` rewrites your commits by reapplying them on top of another base to obtain a linear history without merge commits.\nThe other options: it is rebase (not merge) that rewrites history, the two commands are not equivalent, and rebase should be avoided precisely on branches that are already shared/published."}},{"type":"mcq","prompt":{"it":"Quando `git merge` produce un fast-forward?","en":"When does `git merge` produce a fast-forward?"},"code":"","options":[{"it":"sempre: ogni merge è per definizione un fast-forward","en":"always: every merge is by definition a fast-forward"},{"it":"quando il branch corrente non ha commit nuovi rispetto a quello da unire, così Git sposta solo il puntatore in avanti senza commit di merge","en":"when the current branch has no new commits relative to the one being merged in, so Git just moves the pointer forward with no merge commit"},{"it":"quando ci sono conflitti da risolvere manualmente","en":"when there are conflicts to resolve manually"},{"it":"quando si passa l\u0027opzione `--no-ff`","en":"when you pass the `--no-ff` option"}],"correct":1,"explanation":{"it":"In sintesi: il fast-forward avviene quando il branch corrente non è divergente, cioè non ha commit propri oltre al punto di partenza dell\u0027altro branch: Git si limita a spostare il puntatore in avanti senza creare un commit di merge.\nLe altre opzioni: se le storie sono divergenti serve un vero merge, i conflitti implicano proprio divergenza, e `--no-ff` forza l\u0027opposto creando comunque un commit di merge.","en":"In summary: a fast-forward happens when the current branch has not diverged, i.e. it has no commits of its own beyond the starting point of the other branch: Git simply moves the pointer forward without creating a merge commit.\nThe other options: if the histories have diverged a real merge is needed, conflicts imply divergence, and `--no-ff` forces the opposite, creating a merge commit anyway."}},{"type":"mcq","prompt":{"it":"Qual è la differenza tra `git reset` e `git revert`?","en":"What is the difference between `git reset` and `git revert`?"},"code":"","options":[{"it":"sono sinonimi con effetti identici","en":"they are synonyms with identical effects"},{"it":"revert cancella fisicamente i commit, reset li preserva","en":"revert physically deletes the commits, reset preserves them"},{"it":"reset sposta HEAD/branch indietro potendo alterare la storia; revert crea un NUOVO commit che annulla un commit precedente preservando la storia","en":"reset moves HEAD/branch back and can alter history; revert creates a NEW commit that undoes a previous commit while preserving history"},{"it":"revert funziona solo sui repository remoti","en":"revert only works on remote repositories"}],"correct":2,"explanation":{"it":"In sintesi: `reset` riposiziona HEAD e il branch su un commit precedente e può riscrivere la storia locale, mentre `revert` è non distruttivo perché aggiunge un nuovo commit che inverte le modifiche di uno precedente, ideale su branch condivisi.\nLe altre opzioni: non sono sinonimi, è il reset (non il revert) a poter rimuovere commit dalla storia, e revert opera in locale come qualsiasi commit.","en":"In summary: `reset` repositions HEAD and the branch onto an earlier commit and can rewrite local history, whereas `revert` is non-destructive because it adds a new commit that reverses the changes of a previous one, ideal on shared branches.\nThe other options: they are not synonyms, it is reset (not revert) that can remove commits from history, and revert operates locally like any other commit."}},{"type":"mcq","prompt":{"it":"Cosa fa `git cherry-pick \u003ccommit\u003e`?","en":"What does `git cherry-pick \u003ccommit\u003e` do?"},"code":"","options":[{"it":"unisce due branch interi in un solo passaggio","en":"merges two whole branches in a single step"},{"it":"elimina definitivamente un commit dalla storia","en":"permanently deletes a commit from history"},{"it":"crea un nuovo branch a partire dal commit indicato","en":"creates a new branch starting from the given commit"},{"it":"applica al branch corrente le modifiche introdotte da uno specifico commit, creando un nuovo commit","en":"applies to the current branch the changes introduced by a specific commit, creating a new commit"}],"correct":3,"explanation":{"it":"In sintesi: `cherry-pick` prende le modifiche di uno specifico commit e le riapplica sul branch corrente generando un nuovo commit (con un nuovo hash), utile per portare selettivamente una singola fix da un branch all\u0027altro.\nLe altre opzioni: non unisce interi branch (è merge), non elimina commit, e non crea branch (è `git branch`/`checkout -b`).","en":"In summary: `cherry-pick` takes the changes of a specific commit and reapplies them onto the current branch, producing a new commit (with a new hash), useful for selectively bringing a single fix from one branch to another.\nThe other options: it does not merge whole branches (that is merge), it does not delete commits, and it does not create branches (that is `git branch`/`checkout -b`)."}},{"type":"mcq","prompt":{"it":"In Git, cosa rappresenta `HEAD`?","en":"In Git, what does `HEAD` represent?"},"code":"","options":[{"it":"sempre e solo l\u0027ultimo commit del branch main","en":"always and only the latest commit of the main branch"},{"it":"un puntatore al commit corrente, di norma attraverso il branch attualmente in checkout","en":"a pointer to the current commit, normally through the branch currently checked out"},{"it":"il repository remoto configurato di default","en":"the remote repository configured by default"},{"it":"l\u0027area di staging in cui prepari il commit","en":"the staging area where you prepare the commit"}],"correct":1,"explanation":{"it":"In sintesi: `HEAD` è il riferimento al commit su cui sei posizionato, normalmente in modo simbolico puntando al branch corrente; nuovi commit avanzano HEAD e il branch insieme.\nLe altre opzioni: non è legato a main in particolare, non indica il remoto, e lo staging è l\u0027index, non HEAD.","en":"In summary: `HEAD` is the reference to the commit you are positioned on, normally symbolically pointing to the current branch; new commits advance HEAD and the branch together.\nThe other options: it is not tied to main in particular, it does not point to the remote, and the staging area is the index, not HEAD."}},{"type":"code","prompt":{"it":"Hai già committato `config.log` e solo dopo lo aggiungi a `.gitignore`. Cosa mostra l\u0027ultimo `git status`?","en":"You have already committed `config.log` and only afterwards add it to `.gitignore`. What does the final `git status` show?"},"code":"$ git add config.log\n$ git commit -m \"add config\"\n$ echo \"config.log\" \u003e\u003e .gitignore\n$ echo \"new line\" \u003e\u003e config.log\n$ git status","options":[{"it":"Git ignora subito il file e `git status` non mostra alcuna modifica","en":"Git ignores the file right away and `git status` shows no changes"},{"it":"Git rimuove automaticamente il file dal repository","en":"Git automatically removes the file from the repository"},{"it":"Git continua a tracciare `config.log` e ne mostra le modifiche: `.gitignore` non ignora i file già tracciati","en":"Git keeps tracking `config.log` and shows its changes: `.gitignore` does not ignore already-tracked files"},{"it":"`git status` termina con errore per conflitto con `.gitignore`","en":"`git status` fails with an error due to a conflict with `.gitignore`"}],"correct":2,"explanation":{"it":"In sintesi: `.gitignore` agisce solo sui file untracked, quindi un file già tracciato come `config.log` continua a essere versionato e `git status` mostra le sue modifiche; per smettere di tracciarlo servirebbe `git rm --cached config.log`.\nLe altre opzioni: il file non viene ignorato retroattivamente né rimosso automaticamente, e `git status` non va in errore.","en":"In summary: `.gitignore` acts only on untracked files, so an already-tracked file such as `config.log` keeps being versioned and `git status` shows its changes; to stop tracking it you would need `git rm --cached config.log`.\nThe other options: the file is not ignored retroactively nor removed automatically, and `git status` does not error out."}},{"type":"truefalse","prompt":{"it":"Nel modello distribuito di Git ogni clone contiene l\u0027intera storia del repository, permettendo commit e consultazione della storia anche offline.","en":"In Git\u0027s distributed model, every clone contains the entire history of the repository, allowing commits and history browsing even offline."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027affermazione è vera: Git è distribuito, quindi ogni clone è un repository completo con tutta la storia, e puoi committare, creare branch e navigare la history senza connessione al server.\nLe altre opzioni: negarlo confonde Git con un sistema centralizzato come SVN, dove per molte operazioni serve il server.","en":"In summary: the statement is true: Git is distributed, so every clone is a complete repository with the full history, and you can commit, create branches and browse the history without a connection to the server.\nThe other options: denying it confuses Git with a centralised system such as SVN, where many operations require the server."}},{"type":"code","prompt":{"it":"Esegui il comando seguente usando un hash di commit (non un nome di branch). In quale stato si trova il repository?","en":"You run the following command using a commit hash (not a branch name). What state is the repository in?"},"code":"$ git checkout a1b2c3d","options":[{"it":"HEAD punta comunque al branch main","en":"HEAD still points to the main branch"},{"it":"detached HEAD: HEAD punta direttamente a un commit e non a un branch; nuovi commit non apparterrebbero ad alcun branch","en":"detached HEAD: HEAD points directly to a commit and not to a branch; new commits would not belong to any branch"},{"it":"errore: non è possibile fare checkout di un commit specifico","en":"error: you cannot check out a specific commit"},{"it":"Git crea automaticamente un branch chiamato a1b2c3d","en":"Git automatically creates a branch named a1b2c3d"}],"correct":1,"explanation":{"it":"In sintesi: fare checkout diretto di un hash porta in detached HEAD, cioè HEAD punta a quel commit senza passare per un branch; eventuali nuovi commit sarebbero raggiungibili solo dall\u0027hash e rischierebbero di andare persi se non li salvi su un branch.\nLe altre opzioni: HEAD non resta agganciato a main, il checkout di un commit è lecito, e Git non crea alcun branch automatico.","en":"In summary: checking out a hash directly puts you in detached HEAD, i.e. HEAD points to that commit without going through a branch; any new commits would be reachable only by the hash and would risk being lost if you do not save them onto a branch.\nThe other options: HEAD does not stay attached to main, checking out a commit is legitimate, and Git does not create any branch automatically."}},{"type":"mcq","prompt":{"it":"Qual è la differenza tra `git reset --soft`, `--mixed` e `--hard` rispetto a un commit precedente?","en":"What is the difference between `git reset --soft`, `--mixed` and `--hard` relative to an earlier commit?"},"code":"","options":[{"it":"sono tre alias equivalenti dello stesso comportamento","en":"they are three equivalent aliases for the same behaviour"},{"it":"--hard è il più sicuro perché preserva sempre le modifiche non committate","en":"--hard is the safest because it always preserves uncommitted changes"},{"it":"--soft cancella il contenuto della working directory","en":"--soft wipes the content of the working directory"},{"it":"--soft sposta solo HEAD; --mixed (default) resetta anche lo staging ma non il working dir; --hard resetta anche il working dir scartando le modifiche","en":"--soft moves only HEAD; --mixed (default) also resets the staging area but not the working dir; --hard also resets the working dir, discarding the changes"}],"correct":3,"explanation":{"it":"In sintesi: `--soft` sposta solo HEAD lasciando staging e working directory intatti (le modifiche restano in staging), `--mixed` è il default e resetta anche lo staging ma conserva i file di lavoro, `--hard` allinea tutto scartando le modifiche non committate.\nLe altre opzioni: non sono equivalenti, `--hard` è il più distruttivo (non il più sicuro), ed è `--hard` non `--soft` a toccare la working directory.","en":"In summary: `--soft` moves only HEAD, leaving the staging area and working directory intact (the changes stay staged), `--mixed` is the default and also resets the staging area but keeps the working files, `--hard` brings everything into line, discarding uncommitted changes.\nThe other options: they are not equivalent, `--hard` is the most destructive (not the safest), and it is `--hard`, not `--soft`, that touches the working directory."}},{"type":"mcq","prompt":{"it":"In SVN, la convenzione `trunk/branches/tags` cosa rappresenta?","en":"In SVN, what does the `trunk/branches/tags` convention represent?"},"code":"","options":[{"it":"sono tre server SVN distinti da configurare separatamente","en":"three separate SVN servers to configure independently"},{"it":"trunk è la linea principale di sviluppo, branches contiene le linee parallele, tags contiene snapshot immutabili (es. release)","en":"trunk is the main line of development, branches holds the parallel lines, tags holds immutable snapshots (e.g. releases)"},{"it":"trunk contiene i tag e tags contiene i branch","en":"trunk holds the tags and tags holds the branches"},{"it":"è una struttura esclusiva di Git non presente in SVN","en":"it is a structure exclusive to Git and not present in SVN"}],"correct":1,"explanation":{"it":"In sintesi: in SVN `trunk`, `branches` e `tags` sono directory convenzionali del repository: `trunk` è la linea principale di sviluppo, `branches` ospita le linee parallele, e `tags` conserva snapshot immutabili tipicamente usati per le release.\nLe altre opzioni: sono directory dello stesso repository (non server distinti), i ruoli non vanno invertiti, ed è una convenzione tipica di SVN, non di Git.","en":"In summary: in SVN `trunk`, `branches` and `tags` are conventional directories of the repository: `trunk` is the main line of development, `branches` hosts the parallel lines, and `tags` keeps immutable snapshots typically used for releases.\nThe other options: they are directories of the same repository (not separate servers), the roles must not be swapped, and it is a convention typical of SVN, not of Git."}},{"type":"truefalse","prompt":{"it":"In SVN, come in Git, un `commit` è un\u0027operazione locale e serve un comando di `push` separato per inviarlo al server centrale.","en":"In SVN, as in Git, a `commit` is a local operation and a separate `push` command is needed to send it to the central server."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027affermazione è falsa: SVN è centralizzato e il `commit` scrive subito sul repository centrale del server, senza alcun `push`; è Git, distribuito, a separare `commit` (locale) da `push` (invio al remoto).\nLe altre opzioni: crederla vera significa attribuire a SVN il modello distribuito di Git, in cui commit e pubblicazione sono passi distinti.","en":"In summary: the statement is false: SVN is centralised and `commit` writes straight to the server\u0027s central repository, with no `push`; it is Git, being distributed, that separates `commit` (local) from `push` (sending to the remote).\nThe other options: believing it true means attributing to SVN Git\u0027s distributed model, in which commit and publishing are distinct steps."}},{"type":"mcq","prompt":{"it":"Cos\u0027è una pipeline di CI/CD?","en":"What is a CI/CD pipeline?"},"code":"","options":[{"it":"un repository dedicato all\u0027archiviazione degli artifact","en":"a repository dedicated to storing artifacts"},{"it":"un branch protetto su cui è vietato committare direttamente","en":"a protected branch on which committing directly is forbidden"},{"it":"una sequenza automatizzata di fasi (es. build, test, package, deploy) eseguite a ogni cambiamento del codice","en":"an automated sequence of stages (e.g. build, test, package, deploy) run on every code change"},{"it":"un particolare tipo di merge tra branch","en":"a particular type of merge between branches"}],"correct":2,"explanation":{"it":"In sintesi: una pipeline CI/CD è una catena automatizzata di fasi, tipicamente build, test, package e deploy, che si attiva ai cambiamenti del codice per verificare e rilasciare le modifiche in modo ripetibile e rapido.\nLe altre opzioni: un repository di artifact, un branch protetto e un merge sono concetti correlati ma diversi dal flusso automatizzato che definisce una pipeline.","en":"In summary: a CI/CD pipeline is an automated chain of stages, typically build, test, package and deploy, that triggers on code changes to verify and release the changes in a repeatable and fast way.\nThe other options: an artifact repository, a protected branch and a merge are related concepts but different from the automated flow that defines a pipeline."}},{"type":"mcq","prompt":{"it":"Cos\u0027è un `Jenkinsfile`?","en":"What is a `Jenkinsfile`?"},"code":"","options":[{"it":"un plugin da installare sul controller Jenkins","en":"a plugin to install on the Jenkins controller"},{"it":"un file di testo versionato nel repository che definisce la pipeline come codice (pipeline as code)","en":"a text file versioned in the repository that defines the pipeline as code (pipeline as code)"},{"it":"il file di log generato da ogni build","en":"the log file generated by every build"},{"it":"l\u0027artifact binario prodotto dalla build","en":"the binary artifact produced by the build"}],"correct":1,"explanation":{"it":"In sintesi: il `Jenkinsfile` è un file di testo versionato insieme al codice che descrive la pipeline (stage e step) secondo l\u0027approccio pipeline as code, permettendo di tracciare e rivedere la definizione della build come qualsiasi sorgente.\nLe altre opzioni: non è un plugin, non è il log di build, e non è l\u0027artifact prodotto ma la definizione del processo che lo produce.","en":"In summary: the `Jenkinsfile` is a text file versioned together with the code that describes the pipeline (stages and steps) following the pipeline-as-code approach, letting you track and review the build definition like any other source.\nThe other options: it is not a plugin, it is not the build log, and it is not the produced artifact but the definition of the process that produces it."}},{"type":"mcq","prompt":{"it":"Nel contesto di CI/CD, cos\u0027è un artifact?","en":"In the context of CI/CD, what is an artifact?"},"code":"","options":[{"it":"un errore di compilazione registrato nei log","en":"a compilation error recorded in the logs"},{"it":"un branch dedicato ai soli rilasci","en":"a branch dedicated solely to releases"},{"it":"un test che fallisce in modo intermittente","en":"a test that fails intermittently"},{"it":"l\u0027output prodotto da una build (es. un JAR/WAR) archiviato per essere distribuito o deployato","en":"the output produced by a build (e.g. a JAR/WAR) archived to be distributed or deployed"}],"correct":3,"explanation":{"it":"In sintesi: un artifact è il prodotto tangibile di una build, come un JAR o un WAR, che la pipeline archivia (spesso in un artifact repository) per poterlo poi distribuire o deployare negli ambienti.\nLe altre opzioni: non è un errore di compilazione, non è un branch, e non è un test instabile (quello è un test flaky).","en":"In summary: an artifact is the tangible product of a build, such as a JAR or a WAR, which the pipeline archives (often in an artifact repository) so it can then be distributed or deployed to the environments.\nThe other options: it is not a compilation error, it is not a branch, and it is not an unstable test (that is a flaky test)."}},{"type":"truefalse","prompt":{"it":"L\u0027integrazione continua (CI) prevede che le modifiche siano integrate frequentemente nel branch condiviso, con build e test automatici che segnalano rapidamente le regressioni.","en":"Continuous integration (CI) means changes are integrated frequently into the shared branch, with automated builds and tests that quickly flag regressions."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027affermazione è vera: la CI si basa su integrazioni frequenti nel branch condiviso accompagnate da build e test automatici, così le regressioni emergono presto e il feedback verso lo sviluppatore è rapido.\nLe altre opzioni: negarlo trascura il cuore della CI, cioè automazione e integrazione frequente per ridurre il costo di trovare i problemi tardi.","en":"In summary: the statement is true: CI relies on frequent integrations into the shared branch accompanied by automated builds and tests, so regressions surface early and the feedback to the developer is fast.\nThe other options: denying it overlooks the heart of CI, namely automation and frequent integration to reduce the cost of finding problems late."}},{"type":"code","prompt":{"it":"Cosa descrive questa pipeline dichiarativa di Jenkins?","en":"What does this Jenkins declarative pipeline describe?"},"code":"pipeline {\n    agent any\n    stages {\n        stage(\u0027Build\u0027) {\n            steps { sh \u0027mvn clean package\u0027 }\n        }\n        stage(\u0027Test\u0027) {\n            steps { sh \u0027mvn test\u0027 }\n        }\n    }\n}","options":[{"it":"una pipeline che esegue Build e Test in parallelo tra loro","en":"a pipeline that runs Build and Test in parallel with each other"},{"it":"un Jenkinsfile non valido perché manca il blocco `node`","en":"an invalid Jenkinsfile because the `node` block is missing"},{"it":"una pipeline con due stage sequenziali (Build e Test) eseguiti su un agent qualsiasi disponibile","en":"a pipeline with two sequential stages (Build and Test) run on any available agent"},{"it":"una semplice configurazione Maven senza relazione con Jenkins","en":"a plain Maven configuration with no relation to Jenkins"}],"correct":2,"explanation":{"it":"In sintesi: è una declarative pipeline con `agent any` che esegue su un qualsiasi executor disponibile e due `stage`, Build e Test, eseguiti in sequenza; ciascuno lancia il rispettivo comando `mvn` tramite lo step `sh`.\nLe altre opzioni: gli stage sono sequenziali non paralleli (servirebbe un blocco `parallel`), la declarative pipeline non richiede `node` (è tipico della scripted), e il blocco `pipeline {}` è proprio sintassi Jenkins.","en":"In summary: it is a declarative pipeline with `agent any` that runs on any available executor, and two `stage`s, Build and Test, executed in sequence; each launches its respective `mvn` command via the `sh` step.\nThe other options: the stages are sequential, not parallel (a `parallel` block would be needed), the declarative pipeline does not require `node` (that is typical of the scripted one), and the `pipeline {}` block is Jenkins syntax itself."}},{"type":"mcq","prompt":{"it":"Nel Semantic Versioning `MAJOR.MINOR.PATCH`, quando incrementi il numero MAJOR?","en":"In Semantic Versioning `MAJOR.MINOR.PATCH`, when do you increment the MAJOR number?"},"code":"","options":[{"it":"quando correggi un bug in modo retrocompatibile","en":"when you fix a bug in a backward-compatible way"},{"it":"quando introduci modifiche incompatibili con le versioni precedenti (breaking changes)","en":"when you introduce changes incompatible with previous versions (breaking changes)"},{"it":"quando aggiungi una funzionalità retrocompatibile","en":"when you add a backward-compatible feature"},{"it":"a ogni build automatica sul server CI","en":"on every automated build on the CI server"}],"correct":1,"explanation":{"it":"In sintesi: nel semantic versioning si incrementa il MAJOR quando si introducono breaking changes, cioè modifiche incompatibili con l\u0027API precedente che possono rompere i consumatori esistenti.\nLe altre opzioni: un bugfix retrocompatibile alza il PATCH, una nuova funzionalità retrocompatibile alza il MINOR, e il numero di versione non cambia a ogni build.","en":"In summary: in semantic versioning you increment the MAJOR when you introduce breaking changes, i.e. changes incompatible with the previous API that can break existing consumers.\nThe other options: a backward-compatible bugfix bumps the PATCH, a new backward-compatible feature bumps the MINOR, and the version number does not change on every build."}},{"type":"mcq","prompt":{"it":"Secondo il Semantic Versioning, passando da `2.4.1` a `2.5.0`, cosa è cambiato?","en":"According to Semantic Versioning, going from `2.4.1` to `2.5.0`, what has changed?"},"code":"","options":[{"it":"sono state introdotte modifiche incompatibili (breaking changes)","en":"incompatible changes (breaking changes) have been introduced"},{"it":"è stata rilasciata solo una correzione di bug","en":"only a bug fix has been released"},{"it":"è stata aggiunta almeno una funzionalità retrocompatibile (MINOR incrementato) e il PATCH è azzerato","en":"at least one backward-compatible feature has been added (MINOR incremented) and the PATCH is reset to zero"},{"it":"la versione è regredita a uno stato precedente","en":"the version has regressed to a previous state"}],"correct":2,"explanation":{"it":"In sintesi: l\u0027incremento del MINOR da `2.4.1` a `2.5.0` indica l\u0027aggiunta di funzionalità retrocompatibili, e per regola il PATCH si azzera quando cambia il MINOR.\nLe altre opzioni: i breaking changes avrebbero alzato il MAJOR a 3.x, un semplice bugfix avrebbe toccato solo il PATCH, e non c\u0027è alcuna regressione perché il numero cresce.","en":"In summary: the MINOR increment from `2.4.1` to `2.5.0` indicates the addition of backward-compatible features, and by rule the PATCH resets to zero when the MINOR changes.\nThe other options: breaking changes would have raised the MAJOR to 3.x, a plain bugfix would have touched only the PATCH, and there is no regression because the number grows."}},{"type":"code","prompt":{"it":"Durante un merge trovi questo nel file sorgente. Cosa devi fare per completare correttamente il merge?","en":"During a merge you find this in the source file. What must you do to complete the merge correctly?"},"code":"\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD\nint timeout = 30;\n=======\nint timeout = 60;\n\u003e\u003e\u003e\u003e\u003e\u003e\u003e feature-branch","options":[{"it":"Git risolverà da solo scegliendo il valore numerico più grande","en":"Git will resolve it on its own by choosing the larger numeric value"},{"it":"è un conflitto di merge: modifichi il file scegliendo/combinando le versioni, rimuovi i marker, poi `git add` e commit","en":"it is a merge conflict: you edit the file choosing/combining the versions, remove the markers, then `git add` and commit"},{"it":"devi eliminare il file per far procedere il merge","en":"you must delete the file to let the merge proceed"},{"it":"basta eseguire `git push --force` per superare il conflitto","en":"just run `git push --force` to get past the conflict"}],"correct":1,"explanation":{"it":"In sintesi: quei marker `\u003c\u003c\u003c\u003c\u003c\u003c\u003c`, `=======` e `\u003e\u003e\u003e\u003e\u003e\u003e\u003e` segnalano un conflitto di merge che Git non può risolvere da solo; devi editare il file scegliendo o combinando le due versioni, togliere i marker, marcarlo risolto con `git add` e concludere con il commit.\nLe altre opzioni: Git non sceglie automaticamente per valore, non serve eliminare il file, e un `push --force` non c\u0027entra con la risoluzione del conflitto locale.","en":"In summary: those `\u003c\u003c\u003c\u003c\u003c\u003c\u003c`, `=======` and `\u003e\u003e\u003e\u003e\u003e\u003e\u003e` markers signal a merge conflict that Git cannot resolve on its own; you must edit the file choosing or combining the two versions, remove the markers, mark it resolved with `git add`, and finish with the commit.\nThe other options: Git does not choose automatically by value, there is no need to delete the file, and a `push --force` has nothing to do with resolving the local conflict."}}]},{"id":"design-patterns","title":"Design Pattern \u0026 SOLID","questions":[{"type":"mcq","prompt":{"it":"Secondo il Single Responsibility Principle (SRP), quando una classe dovrebbe avere motivo di cambiare?","en":"According to the Single Responsibility Principle (SRP), when should a class have a reason to change?"},"code":"","options":[{"it":"Per una sola ragione, cioè deve rispondere a un solo attore/motivo di cambiamento","en":"For a single reason, meaning it should answer to only one actor/reason for change"},{"it":"Solo quando cambia il database sottostante","en":"Only when the underlying database changes"},{"it":"Mai: una classe ben scritta non cambia più nel tempo","en":"Never: a well-written class never changes over time"},{"it":"Quando i suoi metodi pubblici superano una certa soglia numerica","en":"When its public methods exceed a certain numeric threshold"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027SRP dice che una classe deve avere una sola responsabilità, ovvero un solo motivo per cambiare; nella formulazione di Uncle Bob significa rispondere a un solo attore/stakeholder. Se logiche che servono attori diversi (persistenza, formattazione, regole di business) convivono nella stessa classe, un cambiamento per uno rischia di rompere gli altri: vanno separate.\nLe altre opzioni: il DB è solo uno dei possibili motivi; \"non cambia mai\" è irrealistico; il numero di metodi non c\u0027entra, conta la coesione delle responsabilità.","en":"In summary: the SRP states that a class should have a single responsibility, that is, a single reason to change; in Uncle Bob\u0027s formulation this means answering to a single actor/stakeholder. If logic serving different actors (persistence, formatting, business rules) coexists in the same class, a change for one risks breaking the others: they should be separated.\nThe other options: the DB is just one of the possible reasons; \"never changes\" is unrealistic; the number of methods is irrelevant, what matters is the cohesion of responsibilities."}},{"type":"mcq","prompt":{"it":"Cosa afferma l\u0027Open/Closed Principle (OCP)?","en":"What does the Open/Closed Principle (OCP) state?"},"code":"","options":[{"it":"Le entità software devono essere aperte all\u0027estensione ma chiuse alla modifica","en":"Software entities should be open for extension but closed for modification"},{"it":"Le entità devono essere aperte alla modifica ma chiuse all\u0027estensione","en":"Entities should be open for modification but closed for extension"},{"it":"Ogni classe deve essere `final` per impedire l\u0027ereditarietà","en":"Every class must be `final` to prevent inheritance"},{"it":"Le entità devono essere aperte sia all\u0027estensione sia alla modifica, senza vincoli","en":"Entities should be open both for extension and modification, without constraints"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027OCP dice che si deve poter estendere il comportamento di un modulo senza modificarne il codice già scritto e testato, tipicamente introducendo nuove implementazioni di un\u0027astrazione (interfacce, polimorfismo, `Strategy`) invece di aggiungere `if/switch` alla classe esistente.\nLe altre opzioni: la seconda inverte il principio; `final` ovunque nega proprio l\u0027estensione; \"aperte a tutto senza vincoli\" svuota di significato il principio.","en":"In summary: the OCP states that you should be able to extend a module\u0027s behavior without modifying code that is already written and tested, typically by introducing new implementations of an abstraction (interfaces, polymorphism, `Strategy`) instead of adding `if/switch` statements to the existing class.\nThe other options: the second reverses the principle; `final` everywhere denies extension outright; \"open to everything without constraints\" strips the principle of meaning."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice e quale principio SOLID mette in luce?","en":"What does the following code print, and which SOLID principle does it highlight?"},"code":"class Rectangle {\n    protected int width, height;\n    void setWidth(int w) { this.width = w; }\n    void setHeight(int h) { this.height = h; }\n    int getArea() { return width * height; }\n}\nclass Square extends Rectangle {\n    @Override void setWidth(int w) { this.width = w; this.height = w; }\n    @Override void setHeight(int h) { this.width = h; this.height = h; }\n}\n\nRectangle r = new Square();\nr.setWidth(5);\nr.setHeight(4);\nSystem.out.println(r.getArea());","options":[{"it":"16","en":"16"},{"it":"20","en":"20"},{"it":"25","en":"25"},{"it":"Errore di compilazione","en":"Compilation error"}],"correct":0,"explanation":{"it":"In sintesi: `setWidth(5)` su `Square` porta width e height a 5, poi `setHeight(4)` li porta entrambi a 4, quindi l\u0027area è 4*4 = 16. Il client che usa un `Rectangle` si aspetta area 5*4=20: è il classico esempio di violazione del Liskov Substitution Principle, perché `Square` non è sostituibile a `Rectangle` senza rompere il contratto.\nLe altre opzioni: 20 sarebbe l\u0027area attesa da un vero rettangolo, 25 ignora la seconda `setHeight`, e non c\u0027è alcun errore di compilazione: `Square` estende correttamente `Rectangle`.","en":"In summary: `setWidth(5)` on `Square` sets both width and height to 5, then `setHeight(4)` sets them both to 4, so the area is 4*4 = 16. A client using a `Rectangle` expects an area of 5*4=20: this is the classic example of a Liskov Substitution Principle violation, because `Square` is not substitutable for `Rectangle` without breaking the contract.\nThe other options: 20 would be the area expected from a true rectangle, 25 ignores the second `setHeight`, and there is no compilation error: `Square` correctly extends `Rectangle`."}},{"type":"mcq","prompt":{"it":"Cosa suggerisce l\u0027Interface Segregation Principle (ISP)?","en":"What does the Interface Segregation Principle (ISP) suggest?"},"code":"","options":[{"it":"Preferire molte interfacce piccole e coese invece di una singola interfaccia generica e voluminosa che costringe i client a dipendere da metodi che non usano","en":"Preferring many small, cohesive interfaces instead of a single generic, bulky interface that forces clients to depend on methods they do not use"},{"it":"Usare una sola grande interfaccia marker per tutto il dominio","en":"Using a single large marker interface for the entire domain"},{"it":"Non usare mai interfacce, solo classi astratte","en":"Never using interfaces, only abstract classes"},{"it":"Segregare i dati dell\u0027applicazione in database fisicamente separati","en":"Segregating the application\u0027s data into physically separate databases"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027ISP dice che un client non deve essere costretto a dipendere da metodi che non usa; meglio interfacce piccole e role-specific (es. `Readable`, `Closeable`) che un\u0027unica \"fat interface\", così le implementazioni non sono obbligate a fornire metodi inutili o a lanciare `UnsupportedOperationException`.\nLe altre opzioni: l\u0027interfaccia unica è proprio l\u0027anti-pattern che l\u0027ISP combatte; \"mai interfacce\" è irrilevante; la segregazione dei database è tema di persistenza, non di ISP.","en":"In summary: the ISP states that a client should not be forced to depend on methods it does not use; small, role-specific interfaces (e.g. `Readable`, `Closeable`) are preferable to a single \"fat interface\", so that implementations are not obliged to provide useless methods or to throw `UnsupportedOperationException`.\nThe other options: the single interface is precisely the anti-pattern the ISP fights; \"never use interfaces\" is irrelevant; database segregation is a persistence concern, not an ISP one."}},{"type":"mcq","prompt":{"it":"Quale enunciato descrive correttamente il Dependency Inversion Principle (DIP)?","en":"Which statement correctly describes the Dependency Inversion Principle (DIP)?"},"code":"","options":[{"it":"I moduli di alto livello non devono dipendere da quelli di basso livello: entrambi devono dipendere da astrazioni, e le astrazioni non devono dipendere dai dettagli","en":"High-level modules should not depend on low-level ones: both should depend on abstractions, and abstractions should not depend on details"},{"it":"I moduli di alto livello devono dipendere direttamente dalle implementazioni concrete di basso livello","en":"High-level modules should depend directly on the concrete low-level implementations"},{"it":"Le astrazioni devono dipendere dai dettagli concreti per essere efficienti","en":"Abstractions should depend on concrete details in order to be efficient"},{"it":"Ogni classe deve sempre avere un\u0027interfaccia dedicata, in ogni caso","en":"Every class must always have a dedicated interface, in every case"}],"correct":0,"explanation":{"it":"In sintesi: il DIP inverte la direzione della dipendenza: la logica di alto livello e i dettagli di basso livello dipendono entrambi da un\u0027astrazione (interfaccia) definita in base ai bisogni dell\u0027alto livello, così le implementazioni diventano intercambiabili e testabili.\nLe altre opzioni: la seconda descrive l\u0027accoppiamento tradizionale che il DIP vuole evitare; la terza rovescia la regola \"i dettagli dipendono dalle astrazioni\"; \"un\u0027interfaccia sempre\" è una regola meccanica, non ciò che afferma il DIP.","en":"In summary: the DIP inverts the direction of the dependency: high-level logic and low-level details both depend on an abstraction (interface) defined according to the needs of the high level, so that implementations become interchangeable and testable.\nThe other options: the second describes the traditional coupling that the DIP aims to avoid; the third reverses the rule \"details depend on abstractions\"; \"always an interface\" is a mechanical rule, not what the DIP states."}},{"type":"code","prompt":{"it":"Qual è il problema principale di questo Singleton in un contesto multi-thread?","en":"What is the main problem with this Singleton in a multi-threaded context?"},"code":"public class Config {\n    private static Config instance;\n    private Config() {}\n    public static Config getInstance() {\n        if (instance == null) {\n            instance = new Config();\n        }\n        return instance;\n    }\n}","options":[{"it":"Non è thread-safe: due thread possono superare insieme il check `instance == null` e creare due istanze distinte","en":"It is not thread-safe: two threads can pass the `instance == null` check together and create two distinct instances"},{"it":"Il costruttore privato impedisce del tutto l\u0027istanziazione, quindi non compila","en":"The private constructor prevents instantiation entirely, so it does not compile"},{"it":"`instance` deve essere `final`, altrimenti il codice non compila","en":"`instance` must be `final`, otherwise the code does not compile"},{"it":"Nessun problema: `static` garantisce di per sé la thread-safety","en":"No problem: `static` guarantees thread-safety on its own"}],"correct":0,"explanation":{"it":"In sintesi: è lazy initialization senza sincronizzazione, quindi una race condition: due thread possono valutare `instance == null` come vero contemporaneamente e costruire due oggetti diversi, rompendo l\u0027unicità. Si risolve con metodo `synchronized`, double-checked locking con `volatile`, holder class idiom o `enum`.\nLe altre opzioni: il costruttore privato è proprio il modo con cui il Singleton controlla la creazione; `final` non è richiesto e non c\u0027è errore di compilazione; `static` riguarda lo storage, non la mutua esclusione tra thread.","en":"In summary: this is lazy initialization without synchronization, hence a race condition: two threads can evaluate `instance == null` as true at the same time and construct two different objects, breaking uniqueness. It is fixed with a `synchronized` method, double-checked locking with `volatile`, the holder class idiom, or an `enum`.\nThe other options: the private constructor is precisely how the Singleton controls creation; `final` is not required and there is no compilation error; `static` concerns storage, not mutual exclusion between threads."}},{"type":"mcq","prompt":{"it":"Qual è la differenza chiave tra Factory Method e Abstract Factory?","en":"What is the key difference between Factory Method and Abstract Factory?"},"code":"","options":[{"it":"Factory Method crea un singolo prodotto tramite un metodo sovrascrivibile dalle sottoclassi; Abstract Factory crea famiglie di prodotti correlati tramite un oggetto factory con più metodi di creazione","en":"Factory Method creates a single product through a method that subclasses can override; Abstract Factory creates families of related products through a factory object with multiple creation methods"},{"it":"Sono sinonimi: cambia solo il nome nel catalogo dei pattern","en":"They are synonyms: only the name in the pattern catalog changes"},{"it":"Abstract Factory crea un solo oggetto, mentre Factory Method crea sempre famiglie di oggetti","en":"Abstract Factory creates a single object, while Factory Method always creates families of objects"},{"it":"Factory Method usa la composizione, Abstract Factory usa esclusivamente ereditarietà statica","en":"Factory Method uses composition, Abstract Factory uses exclusively static inheritance"}],"correct":0,"explanation":{"it":"In sintesi: il Factory Method definisce un metodo (spesso astratto) che le sottoclassi sovrascrivono per decidere quale singolo prodotto istanziare; l\u0027Abstract Factory è un oggetto che espone più metodi factory per creare intere famiglie di prodotti coerenti tra loro (es. widget di uno stesso tema).\nLe altre opzioni: non sono sinonimi; la terza inverte i ruoli; la quarta confonde i meccanismi, dato che l\u0027Abstract Factory si basa proprio sulla composizione con l\u0027oggetto factory.","en":"In summary: the Factory Method defines a method (often abstract) that subclasses override to decide which single product to instantiate; the Abstract Factory is an object that exposes multiple factory methods to create entire families of products that are consistent with one another (e.g. widgets of the same theme).\nThe other options: they are not synonyms; the third reverses the roles; the fourth confuses the mechanisms, since the Abstract Factory is based precisely on composition with the factory object."}},{"type":"mcq","prompt":{"it":"Quale problema risolve principalmente il pattern Builder?","en":"Which problem does the Builder pattern mainly solve?"},"code":"","options":[{"it":"La costruzione di oggetti complessi con molti parametri, spesso opzionali, evitando i costruttori telescopici e migliorando la leggibilità","en":"The construction of complex objects with many, often optional, parameters, avoiding telescoping constructors and improving readability"},{"it":"Garantire l\u0027esistenza di una sola istanza della classe nell\u0027applicazione","en":"Ensuring that only one instance of the class exists in the application"},{"it":"Convertire l\u0027interfaccia di una classe in un\u0027altra attesa dal client","en":"Converting the interface of a class into
