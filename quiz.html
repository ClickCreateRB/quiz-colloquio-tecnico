i, non causano sempre errori, e non finiscono nel DOM visibile.","en":"In summary: `key`s are used by reconciliation to establish the stable identity of each element from one render to the next; using the index is fine only for static lists, but if you reorder, insert, or remove, the index→element association changes and React may recycle the wrong component or state (e.g. inputs with swapped values). A stable id is better.\nThe other options: `key`s don\u0027t have to be numbers, they don\u0027t always cause errors, and they don\u0027t end up in the visible DOM."}},{"type":"mcq","prompt":{"it":"Qual è la differenza tra un input controlled e uno uncontrolled in React?","en":"What is the difference between a controlled and an uncontrolled input in React?"},"code":"","options":[{"it":"Il controlled usa un `ref`, l\u0027uncontrolled usa lo state","en":"The controlled one uses a `ref`, the uncontrolled one uses state"},{"it":"Sono sinonimi: cambia solo il nome a seconda della versione di React","en":"They are synonyms: only the name changes depending on the React version"},{"it":"Nel controlled il valore è guidato dallo state React (`value` + `onChange`); nell\u0027uncontrolled è il DOM a tenere il valore, che si legge quando serve tramite un `ref` (o `defaultValue`)","en":"In the controlled one the value is driven by React state (`value` + `onChange`); in the uncontrolled one the DOM holds the value, which is read when needed via a `ref` (or `defaultValue`)"},{"it":"Il controlled funziona solo con `\u003cinput\u003e`, l\u0027uncontrolled solo con `\u003ctextarea\u003e`","en":"The controlled one works only with `\u003cinput\u003e`, the uncontrolled one only with `\u003ctextarea\u003e`"}],"correct":2,"explanation":{"it":"In sintesi: in un componente controlled il valore del campo è la single source of truth nello state e si aggiorna via `value`/`onChange`, così React controlla ogni carattere; in uno uncontrolled è il DOM a possedere il valore (spesso con `defaultValue`) e lo si legge on demand tramite un `ref`.\nLe altre opzioni: invertono ref e state, o inventano vincoli sui tag e sulla versione di React.","en":"In summary: in a controlled component the field\u0027s value is the single source of truth in state and updates via `value`/`onChange`, so React controls every character; in an uncontrolled one the DOM owns the value (often with `defaultValue`) and it is read on demand via a `ref`.\nThe other options: they swap ref and state, or invent constraints on the tags and on the React version."}},{"type":"mcq","prompt":{"it":"Due componenti fratelli devono condividere e sincronizzare lo stesso dato. Qual è l\u0027approccio idiomatico in React?","en":"Two sibling components need to share and keep the same piece of data in sync. What is the idiomatic approach in React?"},"code":"","options":[{"it":"Far scrivere a un fratello direttamente nello state dell\u0027altro tramite un `ref`","en":"Have one sibling write directly into the other\u0027s state via a `ref`"},{"it":"Duplicare lo state in entrambi i fratelli e sincronizzarli manualmente","en":"Duplicate the state in both siblings and sync them manually"},{"it":"Usare una variabile globale mutabile esterna a React","en":"Use a mutable global variable outside of React"},{"it":"Sollevare lo state (lifting state up) nell\u0027antenato comune più vicino e passarlo ai figli via props, con callback per aggiornarlo","en":"Lift the state up to the nearest common ancestor and pass it to the children via props, with callbacks to update it"}],"correct":3,"explanation":{"it":"In sintesi: quando più componenti devono condividere un dato si fa lifting state up: si sposta lo state nell\u0027antenato comune più vicino, che lo passa ai figli come props e fornisce callback per modificarlo, mantenendo un\u0027unica source of truth e il flusso unidirezionale.\nLe altre opzioni: scrivere nello state altrui via ref, duplicare lo state o usare globali mutabili rompono la prevedibilità e portano a stati disallineati.","en":"In summary: when multiple components need to share data you lift state up: you move the state to the nearest common ancestor, which passes it to the children as props and provides callbacks to modify it, keeping a single source of truth and the one-way flow.\nThe other options: writing into another\u0027s state via a ref, duplicating the state, or using mutable globals break predictability and lead to out-of-sync state."}},{"type":"truefalse","prompt":{"it":"Quando il `value` di un Context Provider cambia, tutti i componenti che consumano quel context con `useContext` si ri-renderizzano.","en":"When a Context Provider\u0027s `value` changes, all components that consume that context with `useContext` re-render."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: i consumer registrati con `useContext` si ri-renderizzano quando cambia il `value` del Provider (confronto per identità del valore); per questo conviene memoizzare gli oggetti passati come `value`, per evitare re-render inutili quando il riferimento cambia a ogni render.\nLe altre opzioni: sarebbe falso solo se il context non notificasse i consumer, ma è proprio il suo scopo.","en":"In summary: it\u0027s true: consumers registered with `useContext` re-render when the Provider\u0027s `value` changes (compared by the value\u0027s identity); that\u0027s why it\u0027s advisable to memoize objects passed as `value`, to avoid needless re-renders when the reference changes on every render.\nThe other options: it would be false only if the context didn\u0027t notify the consumers, but that\u0027s exactly its purpose."}},{"type":"mcq","prompt":{"it":"Quando `useMemo`/`useCallback` sono davvero utili?","en":"When are `useMemo`/`useCallback` genuinely useful?"},"code":"","options":[{"it":"Per evitare ricalcoli costosi e per preservare l\u0027identità referenziale di valori/funzioni passati a figli memoizzati (`React.memo`) o usati come dipendenze di altri hook","en":"To avoid expensive recalculations and to preserve the referential identity of values/functions passed to memoized children (`React.memo`) or used as dependencies of other hooks"},{"it":"Sempre, su ogni funzione e valore, perché rendono l\u0027app più veloce a prescindere","en":"Always, on every function and value, because they make the app faster regardless"},{"it":"Per impedire del tutto i re-render del componente in cui sono usati","en":"To completely prevent re-renders of the component in which they are used"},{"it":"Per sostituire `useState` quando non si vuole un re-render","en":"To replace `useState` when you don\u0027t want a re-render"}],"correct":0,"explanation":{"it":"In sintesi: `useMemo` memoizza il risultato di un calcolo costoso e `useCallback` memoizza l\u0027identità di una funzione; servono davvero quando quel valore/funzione è passato a un figlio avvolto in `React.memo` o è una dipendenza di `useEffect`/`useMemo`, dove l\u0027identità referenziale conta. Usarli ovunque aggiunge overhead senza guadagno.\nLe altre opzioni: non velocizzano a prescindere, non bloccano il re-render del componente che li ospita e non sostituiscono `useState`.","en":"In summary: `useMemo` memoizes the result of an expensive computation and `useCallback` memoizes a function\u0027s identity; they are genuinely useful when that value/function is passed to a child wrapped in `React.memo` or is a dependency of `useEffect`/`useMemo`, where referential identity matters. Using them everywhere adds overhead without any gain.\nThe other options: they don\u0027t speed things up regardless, they don\u0027t block the re-render of the component that hosts them, and they don\u0027t replace `useState`."}},{"type":"code","prompt":{"it":"Cosa succede cliccando ripetutamente il bottone?","en":"What happens when you click the button repeatedly?"},"code":"function Box() {\n  const countRef = useRef(0);\n  const handleClick = () =\u003e {\n    countRef.current += 1;\n    console.log(countRef.current);\n  };\n  return \u003cbutton onClick={handleClick}\u003e{countRef.current}\u003c/button\u003e;\n}","options":[{"it":"Il bottone si aggiorna a ogni click mostrando 1, 2, 3, come con `useState`","en":"The button updates on every click, showing 1, 2, 3, as with `useState`"},{"it":"La console logga 1, 2, 3... ma il testo del bottone resta 0 finché non avviene un re-render per altri motivi, perché mutare `ref.current` non provoca un re-render","en":"The console logs 1, 2, 3... but the button text stays 0 until a re-render happens for other reasons, because mutating `ref.current` does not trigger a re-render"},{"it":"Viene lanciato un errore perché non si può mutare `ref.current`","en":"An error is thrown because you cannot mutate `ref.current`"},{"it":"Il valore si resetta a 0 a ogni click perché `useRef(0)` rigira","en":"The value resets to 0 on every click because `useRef(0)` re-runs"}],"correct":1,"explanation":{"it":"In sintesi: `useRef` restituisce un oggetto mutabile e persistente tra i render il cui `.current` si può cambiare, ma mutarlo NON schedula un re-render; quindi la console mostra i valori incrementati mentre il testo del bottone, renderizzato con il valore precedente, resta 0 finché un re-render causato da altro non lo rilegge.\nLe altre opzioni: non si comporta come `useState` (che ri-renderizza), mutare `.current` è lecito, e `useRef(0)` non re-inizializza a ogni render.","en":"In summary: `useRef` returns a mutable object that persists across renders whose `.current` can be changed, but mutating it does NOT schedule a re-render; so the console shows the incremented values while the button text, rendered with the previous value, stays 0 until a re-render caused by something else reads it again.\nThe other options: it doesn\u0027t behave like `useState` (which re-renders), mutating `.current` is legitimate, and `useRef(0)` doesn\u0027t re-initialize on every render."}},{"type":"mcq","prompt":{"it":"Cos\u0027è il Virtual DOM e come lo usa React nella reconciliation?","en":"What is the Virtual DOM and how does React use it in reconciliation?"},"code":"","options":[{"it":"Una copia del DOM reale che React aggiorna elemento per elemento a ogni keystroke, senza confronti","en":"A copy of the real DOM that React updates element by element on every keystroke, without any comparison"},{"it":"Un secondo DOM del browser, più veloce, fornito dalle API native","en":"A second, faster browser DOM provided by the native APIs"},{"it":"Una rappresentazione in memoria dell\u0027UI; a ogni render React costruisce il nuovo albero, lo confronta (diffing) con il precedente e applica al DOM reale solo le differenze minime","en":"An in-memory representation of the UI; on each render React builds the new tree, compares it (diffing) with the previous one, and applies only the minimal differences to the real DOM"},{"it":"Un meccanismo che elimina completamente la necessità di manipolare il DOM reale","en":"A mechanism that completely eliminates the need to manipulate the real DOM"}],"correct":2,"explanation":{"it":"In sintesi: il Virtual DOM è una struttura leggera in memoria che descrive l\u0027UI; a ogni render React genera il nuovo albero e nella reconciliation lo confronta con il precedente (diffing, guidato da tipo di elemento e `key`), calcolando il set minimo di mutazioni da applicare al DOM reale, che è l\u0027operazione costosa.\nLe altre opzioni: non è una API del browser né un secondo DOM nativo, non aggiorna tutto senza confronto, e alla fine il DOM reale va comunque toccato.","en":"In summary: the Virtual DOM is a lightweight in-memory structure that describes the UI; on each render React generates the new tree and, during reconciliation, compares it with the previous one (diffing, guided by element type and `key`), computing the minimal set of mutations to apply to the real DOM, which is the expensive operation.\nThe other options: it\u0027s not a browser API nor a second native DOM, it doesn\u0027t update everything without comparison, and in the end the real DOM still has to be touched."}},{"type":"truefalse","prompt":{"it":"Quando un componente si ri-renderizza, di default React ri-renderizza anche tutti i suoi figli, indipendentemente dal fatto che le loro props siano cambiate.","en":"When a component re-renders, by default React also re-renders all of its children, regardless of whether their props have changed."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: per default il re-render di un componente propaga il re-render ai suoi discendenti anche se le loro props non sono cambiate; per saltare questo lavoro si può avvolgere un figlio in `React.memo`, che lo rende \u0027puro\u0027 facendogli confrontare le props (shallow compare) ed evitare il re-render quando sono uguali.\nLe altre opzioni: sarebbe falso solo se React memoizzasse tutto di default, ma la memoizzazione è opt-in.","en":"In summary: it\u0027s true: by default a component\u0027s re-render propagates the re-render to its descendants even if their props haven\u0027t changed; to skip this work you can wrap a child in `React.memo`, which makes it \u0027pure\u0027 by having it compare its props (shallow compare) and skip the re-render when they\u0027re equal.\nThe other options: it would be false only if React memoized everything by default, but memoization is opt-in."}},{"type":"mcq","prompt":{"it":"Cosa significa \u0027unidirectional data flow\u0027 in React?","en":"What does \u0027unidirectional data flow\u0027 mean in React?"},"code":"","options":[{"it":"I dati fluiscono liberamente in entrambe le direzioni tra genitori e figli tramite two-way binding automatico","en":"Data flows freely in both directions between parents and children via automatic two-way binding"},{"it":"Ogni componente può modificare direttamente lo state di qualsiasi altro componente","en":"Every component can directly modify the state of any other component"},{"it":"I dati fluiscono solo dai figli verso i genitori","en":"Data flows only from children to parents"},{"it":"I dati scendono dai genitori ai figli tramite props; i figli comunicano verso l\u0027alto invocando callback ricevute come props, senza modificare direttamente i dati del genitore","en":"Data flows down from parents to children via props; children communicate upward by invoking callbacks received as props, without directly modifying the parent\u0027s data"}],"correct":3,"explanation":{"it":"In sintesi: unidirectional data flow significa che i dati viaggiano in una sola direzione, dall\u0027alto verso il basso via props; quando un figlio deve provocare un cambiamento non tocca lo state del genitore ma chiama una callback ricevuta come prop, e il genitore aggiorna il proprio state (single source of truth). Questo rende il flusso prevedibile e tracciabile.\nLe altre opzioni: React non ha two-way binding automatico, i componenti non modificano lo state altrui, e il flusso principale dei dati è verso il basso, non verso l\u0027alto.","en":"In summary: unidirectional data flow means data travels in a single direction, top-down via props; when a child needs to cause a change it doesn\u0027t touch the parent\u0027s state but calls a callback received as a prop, and the parent updates its own state (single source of truth). This makes the flow predictable and traceable.\nThe other options: React has no automatic two-way binding, components don\u0027t modify each other\u0027s state, and the main data flow is downward, not upward."}}]}]}</script>

<script>
(function(){
  const el = document.getElementById('quiz-data');
  let DATA;
  try { DATA = JSON.parse(el.textContent); } catch(e){ DATA = {modules:[]}; }
  const MODULES = DATA.modules || [];
  const app = document.getElementById('app');

  const settings = { mode:'esame', shuffleQuestions:true, shuffleOptions:true, count:'all' };
  let session = null;
  let resultsFilter = 'all';

  // --- lingua ---
  const LANGS = [ {code:'it',label:'Italiano'}, {code:'en',label:'English'}, {code:'fr',label:'Français'}, {code:'de',label:'Deutsch'} ];
  let lang = (function(){ try { const s=localStorage.getItem('quizLang'); return LANGS.some(l=>l.code===s)?s:'en'; } catch(e){ return 'en'; } })();
  function tr(v){ if(v && typeof v==='object' && !Array.isArray(v)) return (v[lang]!=null?v[lang]:(v.it!=null?v.it:'')); return v; }
  const UI = {
    it:{ appTitle:'Quiz Colloquio Tecnico', subtitle:'Preparazione a colloqui tecnici — Java / Full-stack', mode:'Modalità', examMode:'Esame (spiegazioni a fine test)', studyMode:'Studio (feedback immediato)', nq:'N. domande', all:'Tutte', shuffleQ:'Mescola domande', shuffleO:'Mescola opzioni', mixed:'Esame misto (tutti i moduli)', questions:'domande', foot:'I risultati restano solo sul tuo dispositivo.', noModules:'Nessun modulo caricato.', language:'Lingua', home:'Home', back:'Indietro', next:'Avanti', finish:'Termina', typeCode:'Codice', typeTF:'Vero / Falso', typeSingle:'Risposta singola', correct:'Corretto', wrong:'Sbagliato', yourAnswer:'La tua risposta:', noAnswer:'Nessuna risposta', correctAnswer:'Risposta corretta:', showAll:'Mostra tutte', showWrong:'Mostra solo sbagliate', retryWrong:'Rifai solo le sbagliate', retryModule:'Rifai il modulo', nothingToShow:'Nessuna domanda da mostrare.', reviewErrors:'(ripasso errori)', sCorrect:'corrette', sWrong:'sbagliate', sTotal:'totali', mixedTitle:'Esame misto' },
    en:{ appTitle:'Technical Interview Quiz', subtitle:'Technical interview prep — Java / Full-stack', mode:'Mode', examMode:'Exam (explanations at the end)', studyMode:'Study (instant feedback)', nq:'Questions', all:'All', shuffleQ:'Shuffle questions', shuffleO:'Shuffle options', mixed:'Mixed exam (all modules)', questions:'questions', foot:'Results stay only on your device.', noModules:'No modules loaded.', language:'Language', home:'Home', back:'Back', next:'Next', finish:'Finish', typeCode:'Code', typeTF:'True / False', typeSingle:'Single answer', correct:'Correct', wrong:'Wrong', yourAnswer:'Your answer:', noAnswer:'No answer', correctAnswer:'Correct answer:', showAll:'Show all', showWrong:'Show wrong only', retryWrong:'Retry wrong only', retryModule:'Retry module', nothingToShow:'Nothing to show.', reviewErrors:'(error review)', sCorrect:'correct', sWrong:'wrong', sTotal:'total', mixedTitle:'Mixed exam' },
    fr:{ appTitle:'Quiz d’entretien technique', subtitle:'Préparation aux entretiens techniques — Java / Full-stack', mode:'Mode', examMode:'Examen (explications à la fin)', studyMode:'Étude (retour immédiat)', nq:'Questions', all:'Toutes', shuffleQ:'Mélanger les questions', shuffleO:'Mélanger les options', mixed:'Examen mixte (tous les modules)', questions:'questions', foot:'Les résultats restent uniquement sur votre appareil.', noModules:'Aucun module chargé.', language:'Langue', home:'Accueil', back:'Précédent', next:'Suivant', finish:'Terminer', typeCode:'Code', typeTF:'Vrai / Faux', typeSingle:'Réponse unique', correct:'Correct', wrong:'Faux', yourAnswer:'Votre réponse :', noAnswer:'Aucune réponse', correctAnswer:'Bonne réponse :', showAll:'Tout afficher', showWrong:'Afficher les erreurs', retryWrong:'Refaire les erreurs', retryModule:'Refaire le module', nothingToShow:'Rien à afficher.', reviewErrors:'(révision des erreurs)', sCorrect:'correctes', sWrong:'fausses', sTotal:'au total', mixedTitle:'Examen mixte' },
    de:{ appTitle:'Technisches Interview-Quiz', subtitle:'Vorbereitung auf technische Interviews — Java / Full-Stack', mode:'Modus', examMode:'Prüfung (Erklärungen am Ende)', studyMode:'Lernen (sofortiges Feedback)', nq:'Fragen', all:'Alle', shuffleQ:'Fragen mischen', shuffleO:'Optionen mischen', mixed:'Gemischte Prüfung (alle Module)', questions:'Fragen', foot:'Die Ergebnisse bleiben nur auf deinem Gerät.', noModules:'Keine Module geladen.', language:'Sprache', home:'Start', back:'Zurück', next:'Weiter', finish:'Beenden', typeCode:'Code', typeTF:'Wahr / Falsch', typeSingle:'Einzelantwort', correct:'Richtig', wrong:'Falsch', yourAnswer:'Deine Antwort:', noAnswer:'Keine Antwort', correctAnswer:'Richtige Antwort:', showAll:'Alle anzeigen', showWrong:'Nur falsche anzeigen', retryWrong:'Nur falsche wiederholen', retryModule:'Modul wiederholen', nothingToShow:'Nichts anzuzeigen.', reviewErrors:'(Fehlerüberprüfung)', sCorrect:'richtig', sWrong:'falsch', sTotal:'gesamt', mixedTitle:'Gemischte Prüfung' },
  };
  function L(k){ return (UI[lang] && UI[lang][k]!=null) ? UI[lang][k] : UI.it[k]; }
  const TITLES = {
    'java-modern':{en:'Modern Java (8-21)',fr:'Java moderne (8-21)',de:'Modernes Java (8-21)'},
    'sql':{fr:'Bases de données & SQL',de:'Datenbanken & SQL'},
    'collections':{fr:'Collections & Génériques'},
    'concurrency':{en:'Concurrency & Multithreading',fr:'Concurrence & Multithreading',de:'Nebenläufigkeit & Multithreading'},
    'jvm':{en:'JVM, Memory & Exceptions',fr:'JVM, Mémoire & Exceptions',de:'JVM, Speicher & Ausnahmen'},
    'design-patterns':{en:'Design Patterns & SOLID',fr:'Design Patterns & SOLID',de:'Entwurfsmuster & SOLID'},
  };
  function ttl(m){ const o=TITLES[m.id]; return (o && o[lang]) ? o[lang] : m.title; }

  // storage
  function getBest(){ try { return JSON.parse(localStorage.getItem('quizBest')||'{}'); } catch(e){ return {}; } }
  function setBest(id,pct){ const b=getBest(); if(!(id in b)||pct>b[id]){ b[id]=pct; localStorage.setItem('quizBest',JSON.stringify(b)); } }

  // utils
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
  function fmt(s){ let t=esc(s); t=t.replace(/`([^`]+)`/g,'<code class="ic">$1</code>'); t=t.replace(/\n/g,'<br>'); t=t.replace(/(In sintesi:|In summary:|En résumé ?:|Kurz gesagt:|Le altre opzioni:|The other options:|Les autres options ?:|Die anderen Optionen:)/g,'<strong>$1</strong>'); return t; }
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  function buildItems(questions){
    return questions.map(q=>{
      const base = q.options.map((_,i)=>i);
      const order = settings.shuffleOptions ? shuffle(base) : base;
      return { q, order, selected:null };
    });
  }

  function startModule(m){
    let qs = m.questions.slice();
    if(settings.shuffleQuestions) qs = shuffle(qs);
    if(settings.count!=='all') qs = qs.slice(0, settings.count);
    resultsFilter='all';
    session = { title:ttl(m), id:m.id, items:buildItems(qs), index:0 };
    renderQuiz();
  }
  function startMixed(){
    let all=[]; MODULES.forEach(m=>{ all=all.concat(m.questions); });
    all = shuffle(all);
    const n = settings.count==='all' ? Math.min(30, all.length) : Math.min(settings.count, all.length);
    resultsFilter='all';
    session = { title:L('mixedTitle'), id:'__mixed__', items:buildItems(all.slice(0,n)), index:0 };
    renderQuiz();
  }

  function renderHome(){
    session=null;
    if(!MODULES.length){ app.innerHTML='<p class="empty">'+esc(L('noModules'))+'</p>'; return; }
    const best=getBest();
    const cards = MODULES.map(m=>{
      const b = best[m.id]!=null ? `<span class="badge">best ${best[m.id]}%</span>` : '';
      return `<button class="card" data-id="${esc(m.id)}"><div class="card-t">${esc(ttl(m))}</div><div class="card-m">${m.questions.length} ${esc(L('questions'))} ${b}</div></button>`;
    }).join('');
    const langOpts = LANGS.map(l=>`<option value="${l.code}">${l.label}</option>`).join('');
    app.innerHTML = `
      <div class="hero"><h1>${esc(L('appTitle'))}</h1><p class="sub">${esc(L('subtitle'))}</p></div>
      <div class="panel"><div class="opt-row">
        <label>${esc(L('language'))}<select id="s-lang">${langOpts}</select></label>
        <label>${esc(L('mode'))}<select id="s-mode">
          <option value="esame">${esc(L('examMode'))}</option>
          <option value="studio">${esc(L('studyMode'))}</option>
        </select></label>
        <label>${esc(L('nq'))}<select id="s-count">
          <option value="all">${esc(L('all'))}</option><option value="10">10</option><option value="20">20</option><option value="30">30</option>
        </select></label>
        <label class="chk"><input type="checkbox" id="s-sq"> ${esc(L('shuffleQ'))}</label>
        <label class="chk"><input type="checkbox" id="s-so"> ${esc(L('shuffleO'))}</label>
      </div></div>
      <div class="cards">${cards}</div>
      <div class="mixed"><button class="btn-mixed" id="mixed">${esc(L('mixed'))}</button></div>
      <div class="foot">${esc(L('foot'))}</div>`;
    const lg=document.getElementById('s-lang'); lg.value=lang; lg.onchange=()=>{ lang=lg.value; try{localStorage.setItem('quizLang',lang);}catch(e){} renderHome(); };
    const mode=document.getElementById('s-mode'); mode.value=settings.mode; mode.onchange=()=>settings.mode=mode.value;
    const cnt=document.getElementById('s-count'); cnt.value=String(settings.count); cnt.onchange=()=>settings.count=(cnt.value==='all'?'all':parseInt(cnt.value,10));
    const sq=document.getElementById('s-sq'); sq.checked=settings.shuffleQuestions; sq.onchange=()=>settings.shuffleQuestions=sq.checked;
    const so=document.getElementById('s-so'); so.checked=settings.shuffleOptions; so.onchange=()=>settings.shuffleOptions=so.checked;
    document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{ const m=MODULES.find(x=>x.id===c.dataset.id); if(m) startModule(m); });
    document.getElementById('mixed').onclick=startMixed;
  }

  function renderQuiz(){
    const it=session.items[session.index], q=it.q, n=session.items.length;
    const reveal = settings.mode==='studio' && it.selected!=null;
    const opts = it.order.map((orig,disp)=>{
      const sel = it.selected===disp;
      let cls='opt'; if(sel) cls+=' sel';
      if(reveal){ if(orig===q.correct) cls+=' correct'; else if(sel) cls+=' wrong'; }
      return `<button class="${cls}" data-i="${disp}" ${reveal?'disabled':''}><span class="mark">${String.fromCharCode(65+disp)}</span><span class="otext">${esc(tr(q.options[orig]))}</span></button>`;
    }).join('');
    const code = q.code && q.code.trim() ? `<pre class="code"><code>${esc(q.code)}</code></pre>` : '';
    const expl = reveal ? `<div class="expl"><strong>${it.order[it.selected]===q.correct?'✓ '+esc(L('correct')):'✗ '+esc(L('wrong'))}</strong><p>${fmt(tr(q.explanation))}</p></div>` : '';
    const answered = session.items.filter(x=>x.selected!=null).length;
    const typeLbl = q.type==='code'?L('typeCode'):(q.type==='truefalse'?L('typeTF'):L('typeSingle'));
    app.innerHTML = `
      <div class="quiz-top"><button class="link" id="home">&larr; ${esc(L('home'))}</button><div class="qtitle">${esc(session.title)}</div><div class="qcount">${session.index+1} / ${n}</div></div>
      <div class="bar"><div class="bar-fill" style="width:${((session.index+1)/n)*100}%"></div></div>
      <div class="qcard">
        <span class="qtype">${esc(typeLbl)}</span>
        <div class="qprompt">${fmt(tr(q.prompt))}</div>
        ${code}
        <div class="opts">${opts}</div>
        ${expl}
      </div>
      <div class="nav">
        <button class="btn" id="prev" ${session.index===0?'disabled':''}>&larr; ${esc(L('back'))}</button>
        <div class="spacer"></div>
        ${session.index<n-1 ? `<button class="btn primary" id="next">${esc(L('next'))} &rarr;</button>` : `<button class="btn primary" id="finish">${esc(L('finish'))} (${answered}/${n})</button>`}
      </div>`;
    document.getElementById('home').onclick=()=>{ renderHome(); };
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ it.selected=parseInt(b.dataset.i,10); renderQuiz(); });
    const prev=document.getElementById('prev'); if(prev) prev.onclick=()=>{ session.index--; renderQuiz(); };
    const next=document.getElementById('next'); if(next) next.onclick=()=>{ session.index++; renderQuiz(); };
    const fin=document.getElementById('finish'); if(fin) fin.onclick=finish;
  }

  function finish(){
    const n=session.items.length;
    const correct = session.items.filter(x=>x.selected!=null && x.order[x.selected]===x.q.correct).length;
    const pct = Math.round((correct/n)*100);
    if(session.id!=='__mixed__') setBest(session.id,pct);
    renderResults(correct,n,pct);
  }

  function renderResults(correct,n,pct){
    const wrong=n-correct;
    const rows = session.items.map((it,idx)=>({it,idx})).filter(({it})=>{
      const ok = it.selected!=null && it.order[it.selected]===it.q.correct;
      return resultsFilter==='wrong' ? !ok : true;
    }).map(({it,idx})=>{
      const q=it.q;
      const userIdx = it.selected!=null ? it.order[it.selected] : null;
      const ok = userIdx===q.correct;
      const userTxt = it.selected==null ? '<em>'+esc(L('noAnswer'))+'</em>' : esc(tr(q.options[userIdx]));
      const code = q.code && q.code.trim() ? `<pre class="code"><code>${esc(q.code)}</code></pre>` : '';
      const your = ok ? `<div class="r-line ok">${esc(L('yourAnswer'))} ${userTxt} ✓</div>` : `<div class="r-line ko">${esc(L('yourAnswer'))} ${userTxt} ✗</div>`;
      const corr = !ok ? `<div class="r-line good">${esc(L('correctAnswer'))} ${esc(tr(q.options[q.correct]))}</div>` : '';
      return `<div class="rev ${ok?'is-ok':'is-ko'}"><div class="rev-h"><span class="rev-n">${idx+1}</span><span class="rev-q">${fmt(tr(q.prompt))}</span></div>${code}${your}${corr}<div class="r-expl">${fmt(tr(q.explanation))}</div></div>`;
    }).join('');
    const cls = pct>=70?'good':(pct>=50?'mid':'bad');
    app.innerHTML = `
      <div class="res-hero"><div class="score ${cls}">${pct}%</div><div class="score-d">${correct} ${esc(L('sCorrect'))} &middot; ${wrong} ${esc(L('sWrong'))} &middot; ${n} ${esc(L('sTotal'))}</div></div>
      <div class="res-actions">
        <button class="btn" id="filter">${resultsFilter==='wrong'?esc(L('showAll')):esc(L('showWrong'))}</button>
        ${wrong>0?`<button class="btn" id="retry">${esc(L('retryWrong'))}</button>`:''}
        <button class="btn" id="again">${esc(L('retryModule'))}</button>
        <button class="btn primary" id="home">${esc(L('home'))}</button>
      </div>
      <div class="review">${rows||'<p class="empty">'+esc(L('nothingToShow'))+'</p>'}</div>`;
    document.getElementById('filter').onclick=()=>{ resultsFilter=resultsFilter==='wrong'?'all':'wrong'; renderResults(correct,n,pct); };
    const rt=document.getElementById('retry'); if(rt) rt.onclick=()=>{
      const wq = session.items.filter(x=>!(x.selected!=null && x.order[x.selected]===x.q.correct)).map(x=>x.q);
      resultsFilter='all';
      session = { title:session.title+' '+L('reviewErrors'), id:session.id, items:buildItems(settings.shuffleQuestions?shuffle(wq):wq), index:0 };
      renderQuiz();
    };
    document.getElementById('again').onclick=()=>{ const m=MODULES.find(x=>x.id===session.id); resultsFilter='all'; if(m) startModule(m); else startMixed(); };
    document.getElementById('home').onclick=()=>{ resultsFilter='all'; renderHome(); };
  }

  renderHome();
})();
</script>
