 another one expected by the client"},{"it":"Notificare automaticamente più osservatori al cambiare dello stato","en":"Automatically notifying multiple observers when the state changes"}],"correct":0,"explanation":{"it":"In sintesi: il Builder separa la costruzione di un oggetto dalla sua rappresentazione e permette di assemblarlo passo-passo con un\u0027API fluente, risolvendo il problema dei costruttori telescopici e dei tanti parametri opzionali/obbligatori; spesso produce oggetti immutabili con validazione nel metodo `build()`.\nLe altre opzioni: l\u0027unicità è del `Singleton`, la conversione di interfaccia è dell\u0027`Adapter`, la notifica agli osservatori è dell\u0027`Observer`.","en":"In summary: the Builder separates the construction of an object from its representation and lets you assemble it step by step with a fluent API, solving the problem of telescoping constructors and of numerous optional/mandatory parameters; it often produces immutable objects with validation in the `build()` method.\nThe other options: uniqueness belongs to the `Singleton`, interface conversion to the `Adapter`, and observer notification to the `Observer`."}},{"type":"code","prompt":{"it":"Cosa stampa il codice? (attenzione al tipo di clonazione)","en":"What does the code print? (mind the type of cloning)"},"code":"class Address { String city; Address(String c){ this.city = c; } }\nclass Person implements Cloneable {\n    String name;\n    Address address;\n    Person(String n, Address a){ this.name = n; this.address = a; }\n    @Override protected Person clone() throws CloneNotSupportedException {\n        return (Person) super.clone();\n    }\n}\n\nAddress a = new Address(\"Roma\");\nPerson p1 = new Person(\"Anna\", a);\nPerson p2 = p1.clone();\np2.address.city = \"Milano\";\nSystem.out.println(p1.address.city);","options":[{"it":"Milano","en":"Milano"},{"it":"Roma","en":"Roma"},{"it":"null","en":"null"},{"it":"Errore a runtime","en":"Runtime error"}],"correct":0,"explanation":{"it":"In sintesi: `super.clone()` (che invoca `Object.clone()`) esegue una shallow copy: `p1` e `p2` sono oggetti distinti ma condividono lo stesso riferimento ad `Address`, quindi modificare `p2.address.city` cambia anche quello visto da `p1` e stampa \"Milano\". Nel `Prototype`, per campi mutabili serve una deep copy clonando anche gli oggetti annidati.\nLe altre opzioni: \"Roma\" varrebbe solo con una deep copy; non c\u0027è `null` perché l\u0027address è inizializzato; nessuna eccezione perché `Person` implementa `Cloneable`.","en":"In summary: `super.clone()` (which invokes `Object.clone()`) performs a shallow copy: `p1` and `p2` are distinct objects but share the same reference to `Address`, so modifying `p2.address.city` also changes the one seen by `p1` and prints \"Milano\". In the `Prototype`, mutable fields require a deep copy that also clones the nested objects.\nThe other options: \"Roma\" would hold only with a deep copy; there is no `null` because the address is initialized; no exception because `Person` implements `Cloneable`."}},{"type":"mcq","prompt":{"it":"A cosa serve il pattern Adapter?","en":"What is the Adapter pattern used for?"},"code":"","options":[{"it":"A far collaborare due interfacce incompatibili, convertendo l\u0027interfaccia di una classe esistente in quella attesa dal client","en":"Making two incompatible interfaces work together, converting the interface of an existing class into the one expected by the client"},{"it":"Ad aggiungere responsabilità a un oggetto dinamicamente, a runtime","en":"Adding responsibilities to an object dynamically, at runtime"},{"it":"A fornire un\u0027interfaccia semplificata a un sottosistema complesso","en":"Providing a simplified interface to a complex subsystem"},{"it":"A controllare e mediare l\u0027accesso a un altro oggetto","en":"Controlling and mediating access to another object"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027Adapter fa da \"traduttore\" tra due interfacce incompatibili, avvolgendo una classe esistente (adaptee) ed esponendo l\u0027interfaccia che il client si aspetta (target), utile per integrare librerie o codice legacy senza modificarli.\nLe altre opzioni: aggiungere responsabilità a runtime è il `Decorator`; semplificare un sottosistema è la `Facade`; controllare l\u0027accesso è il `Proxy`.","en":"In summary: the Adapter acts as a \"translator\" between two incompatible interfaces, wrapping an existing class (adaptee) and exposing the interface the client expects (target), useful for integrating libraries or legacy code without modifying them.\nThe other options: adding responsibilities at runtime is the `Decorator`; simplifying a subsystem is the `Facade`; controlling access is the `Proxy`."}},{"type":"code","prompt":{"it":"Quanto vale il costo stampato da questa catena di Decorator?","en":"What is the cost printed by this chain of Decorators?"},"code":"interface Coffee { double cost(); }\nclass SimpleCoffee implements Coffee {\n    public double cost() { return 2.0; }\n}\nclass MilkDecorator implements Coffee {\n    private final Coffee c;\n    MilkDecorator(Coffee c) { this.c = c; }\n    public double cost() { return c.cost() + 0.5; }\n}\nclass SugarDecorator implements Coffee {\n    private final Coffee c;\n    SugarDecorator(Coffee c) { this.c = c; }\n    public double cost() { return c.cost() + 0.2; }\n}\n\nCoffee coffee = new SugarDecorator(new MilkDecorator(new SimpleCoffee()));\nSystem.out.println(coffee.cost());","options":[{"it":"2.7","en":"2.7"},{"it":"2.5","en":"2.5"},{"it":"2.2","en":"2.2"},{"it":"2.0","en":"2.0"}],"correct":0,"explanation":{"it":"In sintesi: i Decorator si compongono \"a cipolla\" delegando al wrappato: `SimpleCoffee` è 2.0, `MilkDecorator` aggiunge 0.5, `SugarDecorator` aggiunge 0.2, quindi 2.0 + 0.5 + 0.2 = 2.7. Ogni decorator implementa la stessa interfaccia e ne estende il comportamento senza toccare la classe base.\nLe altre opzioni: 2.5 e 2.2 considerano un solo decorator, 2.0 ignora entrambi i wrapper.","en":"In summary: Decorators are composed \"like an onion\", delegating to the wrapped object: `SimpleCoffee` is 2.0, `MilkDecorator` adds 0.5, `SugarDecorator` adds 0.2, so 2.0 + 0.5 + 0.2 = 2.7. Each decorator implements the same interface and extends its behavior without touching the base class.\nThe other options: 2.5 and 2.2 account for only one decorator, 2.0 ignores both wrappers."}},{"type":"mcq","prompt":{"it":"Cosa fornisce il pattern Facade?","en":"What does the Facade pattern provide?"},"code":"","options":[{"it":"Un\u0027interfaccia unificata e semplificata verso un insieme di interfacce di un sottosistema complesso","en":"A unified, simplified interface to a set of interfaces in a complex subsystem"},{"it":"La creazione di famiglie di oggetti correlati e intercambiabili","en":"The creation of families of related, interchangeable objects"},{"it":"La possibilità di trattare in modo uniforme oggetti singoli e loro composizioni","en":"The ability to treat individual objects and their compositions uniformly"},{"it":"L\u0027incapsulamento di una richiesta come oggetto per accodarla o annullarla","en":"The encapsulation of a request as an object so it can be queued or undone"}],"correct":0,"explanation":{"it":"In sintesi: la Facade offre un punto d\u0027accesso di alto livello che nasconde la complessità di più classi/sottosistemi, riducendo l\u0027accoppiamento del client con i dettagli interni; non impedisce di usare le API di basso livello, ne semplifica solo l\u0027uso comune.\nLe altre opzioni: le famiglie di oggetti sono l\u0027`Abstract Factory`, il trattamento uniforme di singoli e composizioni è il `Composite`, l\u0027incapsulamento della richiesta è il `Command`.","en":"In summary: the Facade offers a high-level entry point that hides the complexity of multiple classes/subsystems, reducing the client\u0027s coupling to the internal details; it does not prevent the use of the low-level APIs, it only simplifies their common use.\nThe other options: families of objects are the `Abstract Factory`, uniform treatment of individual objects and compositions is the `Composite`, and encapsulating the request is the `Command`."}},{"type":"mcq","prompt":{"it":"Quale delle seguenti NON è una variante/uso tipico del pattern Proxy?","en":"Which of the following is NOT a typical variant/use of the Proxy pattern?"},"code":"","options":[{"it":"Aggiungere dinamicamente nuove responsabilità impilando più wrapper sullo stesso oggetto","en":"Dynamically adding new responsibilities by stacking multiple wrappers on the same object"},{"it":"Virtual proxy per il lazy loading di un oggetto costoso da creare","en":"Virtual proxy for lazy loading of an object that is expensive to create"},{"it":"Protection proxy per il controllo degli accessi","en":"Protection proxy for access control"},{"it":"Remote proxy per rappresentare localmente un oggetto remoto","en":"Remote proxy to locally represent a remote object"}],"correct":0,"explanation":{"it":"In sintesi: aggiungere responsabilità impilando wrapper è l\u0027intento del `Decorator`, non del Proxy; il Proxy mantiene la stessa interfaccia dell\u0027oggetto reale per controllarne l\u0027accesso (virtual, protection, remote, caching) senza cambiarne le funzionalità visibili.\nLe altre opzioni: virtual, protection e remote proxy sono tutte varianti canoniche descritte dal GoF.","en":"In summary: adding responsibilities by stacking wrappers is the intent of the `Decorator`, not of the Proxy; the Proxy keeps the same interface as the real object in order to control access to it (virtual, protection, remote, caching) without changing its visible functionality.\nThe other options: virtual, protection, and remote proxy are all canonical variants described by the GoF."}},{"type":"mcq","prompt":{"it":"Quando è indicato il pattern Composite?","en":"When is the Composite pattern appropriate?"},"code":"","options":[{"it":"Quando si vogliono trattare in modo uniforme oggetti singoli (foglie) e loro composizioni (nodi) in una struttura ad albero","en":"When you want to treat individual objects (leaves) and their compositions (nodes) uniformly in a tree structure"},{"it":"Quando si vuole garantire una sola istanza globale condivisa","en":"When you want to guarantee a single shared global instance"},{"it":"Quando si vuole scambiare a runtime l\u0027algoritmo usato da un oggetto","en":"When you want to swap the algorithm used by an object at runtime"},{"it":"Quando si vuole convertire un\u0027interfaccia in un\u0027altra incompatibile","en":"When you want to convert one interface into another, incompatible one"}],"correct":0,"explanation":{"it":"In sintesi: il Composite rappresenta gerarchie parte-tutto con un\u0027interfaccia comune tra foglie e contenitori, così il client tratta un singolo elemento e un\u0027intera composizione allo stesso modo (es. file/cartelle, componenti UI, voci di menu).\nLe altre opzioni: l\u0027unicità è del `Singleton`, lo scambio di algoritmo è lo `Strategy`, la conversione di interfaccia è l\u0027`Adapter`.","en":"In summary: the Composite represents part-whole hierarchies with a common interface shared between leaves and containers, so the client treats a single element and an entire composition in the same way (e.g. files/folders, UI components, menu items).\nThe other options: uniqueness belongs to the `Singleton`, swapping the algorithm is the `Strategy`, and interface conversion is the `Adapter`."}},{"type":"code","prompt":{"it":"Cosa stampa questo codice che usa il pattern Strategy?","en":"What does this code using the Strategy pattern print?"},"code":"interface DiscountStrategy { double apply(double amount); }\nclass NoDiscount implements DiscountStrategy {\n    public double apply(double a) { return a; }\n}\nclass PercentDiscount implements DiscountStrategy {\n    private final double pct;\n    PercentDiscount(double pct) { this.pct = pct; }\n    public double apply(double a) { return a * (1 - pct); }\n}\nclass Cart {\n    private DiscountStrategy strategy = new NoDiscount();\n    void setStrategy(DiscountStrategy s) { this.strategy = s; }\n    double checkout(double amount) { return strategy.apply(amount); }\n}\n\nCart cart = new Cart();\ncart.setStrategy(new PercentDiscount(0.2));\nSystem.out.println(cart.checkout(100));","options":[{"it":"80.0","en":"80.0"},{"it":"100.0","en":"100.0"},{"it":"20.0","en":"20.0"},{"it":"120.0","en":"120.0"}],"correct":0,"explanation":{"it":"In sintesi: dopo `setStrategy` il `Cart` delega a `PercentDiscount(0.2)`, quindi `apply(100)` calcola 100 * (1 - 0.2) = 80.0. È l\u0027essenza dello Strategy: il comportamento è cambiato a runtime per composizione, senza `if` sul tipo di sconto e senza modificare `Cart`.\nLe altre opzioni: 100.0 sarebbe la strategia `NoDiscount` iniziale, 20.0 è l\u0027importo scontato (non il totale), 120.0 sommerebbe invece di sottrarre.","en":"In summary: after `setStrategy` the `Cart` delegates to `PercentDiscount(0.2)`, so `apply(100)` computes 100 * (1 - 0.2) = 80.0. This is the essence of the Strategy: behavior is changed at runtime through composition, without an `if` on the discount type and without modifying `Cart`.\nThe other options: 100.0 would be the initial `NoDiscount` strategy, 20.0 is the discounted amount (not the total), 120.0 would add instead of subtract."}},{"type":"mcq","prompt":{"it":"Come funziona il pattern Observer?","en":"How does the Observer pattern work?"},"code":"","options":[{"it":"Un Subject mantiene una lista di Observer e li notifica automaticamente quando il suo stato cambia, realizzando una relazione uno-a-molti a basso accoppiamento","en":"A Subject keeps a list of Observers and notifies them automatically when its state changes, realizing a loosely coupled one-to-many relationship"},{"it":"Un oggetto delega un algoritmo a una strategia intercambiabile fornita per composizione","en":"An object delegates an algorithm to an interchangeable strategy supplied through composition"},{"it":"Si garantisce che esista una sola istanza condivisa del soggetto","en":"It guarantees that only one shared instance of the subject exists"},{"it":"Si incapsula una richiesta come comando eseguibile e annullabile","en":"It encapsulates a request as an executable and undoable command"}],"correct":0,"explanation":{"it":"In sintesi: nell\u0027Observer un Subject (observable) tiene un elenco di subscriber e, quando cambia stato, invoca il loro metodo di aggiornamento; gli observer dipendono dall\u0027interfaccia di notifica e non l\u0027uno dall\u0027altro, restando debolmente accoppiati e aggiungibili/removibili a runtime.\nLe altre opzioni: la delega dell\u0027algoritmo è lo `Strategy`, l\u0027istanza unica è il `Singleton`, l\u0027incapsulamento della richiesta è il `Command`.","en":"In summary: in the Observer a Subject (observable) keeps a list of subscribers and, when its state changes, invokes their update method; the observers depend on the notification interface and not on one another, remaining loosely coupled and able to be added/removed at runtime.\nThe other options: delegating the algorithm is the `Strategy`, the single instance is the `Singleton`, and encapsulating the request is the `Command`."}},{"type":"mcq","prompt":{"it":"Cosa definisce il pattern Template Method?","en":"What does the Template Method pattern define?"},"code":"","options":[{"it":"Lo scheletro di un algoritmo in un metodo della classe base, delegando alcuni passi variabili all\u0027override delle sottoclassi","en":"The skeleton of an algorithm in a method of the base class, delegating some variable steps to overrides in the subclasses"},{"it":"Una famiglia di algoritmi intercambiabili incapsulati e scelti per composizione a runtime","en":"A family of interchangeable algorithms encapsulated and chosen through composition at runtime"},{"it":"Un meccanismo per aggiungere responsabilità a un oggetto a runtime","en":"A mechanism for adding responsibilities to an object at runtime"},{"it":"Il disaccoppiamento tra mittente e ricevente di una richiesta lungo una catena","en":"The decoupling of the sender and receiver of a request along a chain"}],"correct":0,"explanation":{"it":"In sintesi: il Template Method fissa in un metodo (spesso `final`) la sequenza invariante di un algoritmo e lascia alle sottoclassi il compito di implementare i passi \"hook\" che variano; sfrutta l\u0027ereditarietà e il principio di Hollywood \"non chiamarci, ti chiamiamo noi\".\nLe altre opzioni: gli algoritmi intercambiabili per composizione sono lo `Strategy`, l\u0027aggiunta di responsabilità è il `Decorator`, la catena mittente-ricevente è il `Chain of Responsibility`.","en":"In summary: the Template Method fixes the invariant sequence of an algorithm in a method (often `final`) and leaves the subclasses to implement the varying \"hook\" steps; it leverages inheritance and the Hollywood principle \"don\u0027t call us, we\u0027ll call you\".\nThe other options: interchangeable algorithms through composition are the `Strategy`, adding responsibilities is the `Decorator`, and the sender-receiver chain is the `Chain of Responsibility`."}},{"type":"mcq","prompt":{"it":"Qual è l\u0027intento del pattern Command?","en":"What is the intent of the Command pattern?"},"code":"","options":[{"it":"Incapsulare una richiesta come oggetto, così da parametrizzare, accodare, loggare le operazioni e supportare l\u0027undo","en":"To encapsulate a request as an object, so as to parameterize, queue, and log operations and support undo"},{"it":"Fornire un\u0027interfaccia semplificata verso un sottosistema complesso","en":"To provide a simplified interface to a complex subsystem"},{"it":"Garantire una sola istanza della classe di comando","en":"To guarantee a single instance of the command class"},{"it":"Adattare interfacce reciprocamente incompatibili","en":"To adapt mutually incompatible interfaces"}],"correct":0,"explanation":{"it":"In sintesi: il Command trasforma un\u0027azione in un oggetto con un metodo `execute()` (ed eventualmente `undo()`), disaccoppiando chi invoca l\u0027azione (invoker) da chi la esegue (receiver); abilita code di comandi, logging, macro e annullamento.\nLe altre opzioni: la semplificazione del sottosistema è la `Facade`, l\u0027istanza unica è il `Singleton`, l\u0027adattamento di interfacce è l\u0027`Adapter`.","en":"In summary: the Command turns an action into an object with an `execute()` method (and possibly `undo()`), decoupling the one who invokes the action (invoker) from the one who performs it (receiver); it enables command queues, logging, macros, and undo.\nThe other options: simplifying the subsystem is the `Facade`, the single instance is the `Singleton`, and adapting interfaces is the `Adapter`."}},{"type":"mcq","prompt":{"it":"Come opera il pattern Chain of Responsibility?","en":"How does the Chain of Responsibility pattern operate?"},"code":"","options":[{"it":"Una richiesta viene passata lungo una catena di handler finché uno la gestisce, oppure la catena si esaurisce","en":"A request is passed along a chain of handlers until one handles it, or the chain is exhausted"},{"it":"Ogni richiesta viene sempre gestita in parallelo da tutti gli handler della catena","en":"Every request is always handled in parallel by all the handlers in the chain"},{"it":"Si garantisce che esista un solo handler istanziato a livello globale","en":"It guarantees that only one handler is instantiated globally"},{"it":"Si converte l\u0027interfaccia di un handler in quella attesa dal client","en":"It converts a handler\u0027s interface into the one expected by the client"}],"correct":0,"explanation":{"it":"In sintesi: il Chain of Responsibility disaccoppia mittente e ricevente facendo scorrere la richiesta tra handler concatenati; ciascuno decide se gestirla o passarla al successore. È il modello dei filter chain (es. servlet filter) e degli interceptor.\nLe altre opzioni: gli handler non lavorano in parallelo ma in sequenza; l\u0027istanza unica è il `Singleton`; la conversione di interfaccia è l\u0027`Adapter`.","en":"In summary: the Chain of Responsibility decouples sender and receiver by letting the request flow through chained handlers; each one decides whether to handle it or pass it to its successor. It is the model behind filter chains (e.g. servlet filters) and interceptors.\nThe other options: the handlers do not work in parallel but in sequence; the single instance is the `Singleton`; interface conversion is the `Adapter`."}},{"type":"truefalse","prompt":{"it":"Il pattern Iterator permette di accedere sequenzialmente agli elementi di una collezione senza esporne la rappresentazione interna.","en":"The Iterator pattern allows sequential access to the elements of a collection without exposing its internal representation."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: l\u0027Iterator fornisce un modo uniforme (`hasNext()`/`next()`) per scorrere gli elementi di un aggregato senza rivelare se sotto c\u0027è un array, una lista collegata o un albero; in Java è incarnato da `Iterator` e dall\u0027interfaccia `Iterable` usata dal for-each.\nLe altre opzioni: l\u0027affermazione è vera; l\u0027errore tipico è pensare che l\u0027Iterator obblighi a conoscere la struttura interna, mentre proprio la incapsula.","en":"In summary: this is true: the Iterator provides a uniform way (`hasNext()`/`next()`) to traverse the elements of an aggregate without revealing whether an array, a linked list, or a tree lies underneath; in Java it is embodied by `Iterator` and by the `Iterable` interface used by the for-each loop.\nThe other options: the statement is true; the typical mistake is thinking that the Iterator forces you to know the internal structure, whereas it actually encapsulates it."}},{"type":"mcq","prompt":{"it":"Quando è preferibile un Builder rispetto a un Factory Method?","en":"When is a Builder preferable to a Factory Method?"},"code":"","options":[{"it":"Quando l\u0027oggetto richiede molti passi di costruzione o molti parametri opzionali e si vuole un\u0027API fluente e leggibile, spesso per creare istanze immutabili","en":"When the object requires many construction steps or many optional parameters and you want a fluent, readable API, often to create immutable instances"},{"it":"Quando serve solo scegliere quale sottotipo istanziare in base a un parametro di input","en":"When you only need to choose which subtype to instantiate based on an input parameter"},{"it":"Quando si deve garantire una singola istanza condivisa","en":"When you must guarantee a single shared instance"},{"it":"Builder e Factory sono equivalenti, la scelta è puramente stilistica","en":"Builder and Factory are equivalent; the choice is purely stylistic"}],"correct":0,"explanation":{"it":"In sintesi: il Builder brilla quando la costruzione è complessa e configurabile (molti campi opzionali, validazione finale, immutabilità), offrendo leggibilità con la fluent API; il Factory Method invece si concentra sul decidere quale tipo/sottotipo creare, tipicamente in un solo passo.\nLe altre opzioni: la seconda descrive esattamente il caso d\u0027uso del Factory; l\u0027istanza unica è il `Singleton`; non sono equivalenti perché risolvono problemi di costruzione diversi.","en":"In summary: the Builder shines when construction is complex and configurable (many optional fields, final validation, immutability), offering readability through the fluent API; the Factory Method, on the other hand, focuses on deciding which type/subtype to create, typically in a single step.\nThe other options: the second describes exactly the Factory\u0027s use case; the single instance is the `Singleton`; they are not equivalent because they solve different construction problems."}},{"type":"mcq","prompt":{"it":"Qual è la differenza chiave tra Strategy e Template Method?","en":"What is the key difference between Strategy and Template Method?"},"code":"","options":[{"it":"Strategy fa variare il comportamento per composizione, con delega a un oggetto scambiabile a runtime; Template Method lo fa variare per ereditarietà, con l\u0027override dei passi nelle sottoclassi","en":"Strategy varies behavior through composition, delegating to a swappable object at runtime; Template Method varies it through inheritance, by overriding steps in the subclasses"},{"it":"Strategy usa l\u0027ereditarietà, Template Method usa la composizione","en":"Strategy uses inheritance, Template Method uses composition"},{"it":"Sono identici: cambia solo il nome del pattern","en":"They are identical: only the pattern name changes"},{"it":"Solo Template Method può cambiare algoritmo a runtime, Strategy no","en":"Only Template Method can change the algorithm at runtime, Strategy cannot"}],"correct":0,"explanation":{"it":"In sintesi: entrambi variano un algoritmo, ma con meccanismi diversi: lo Strategy incapsula l\u0027algoritmo in un oggetto iniettato e sostituibile a runtime (composition over inheritance), mentre il Template Method fissa lo scheletro nella superclasse e delega i passi alle sottoclassi tramite override (ereditarietà, scelta a compile-time).\nLe altre opzioni: la seconda inverte i meccanismi; non sono identici; è lo `Strategy`, non il Template Method, a permettere il cambio a runtime.","en":"In summary: both vary an algorithm, but through different mechanisms: the Strategy encapsulates the algorithm in an injected object that can be replaced at runtime (composition over inheritance), whereas the Template Method fixes the skeleton in the superclass and delegates the steps to the subclasses through overriding (inheritance, chosen at compile-time).\nThe other options: the second reverses the mechanisms; they are not identical; it is the `Strategy`, not the Template Method, that allows the change at runtime."}},{"type":"mcq","prompt":{"it":"In che rapporto stanno Dependency Injection (DI) e Dependency Inversion Principle (DIP)?","en":"What is the relationship between Dependency Injection (DI) and the Dependency Inversion Principle (DIP)?"},"code":"","options":[{"it":"La DI è una tecnica per realizzare il DIP: le dipendenze (astrazioni) sono fornite dall\u0027esterno, invertendo il controllo sulla loro creazione","en":"DI is a technique for realizing the DIP: the dependencies (abstractions) are supplied from the outside, inverting the control over their creation"},{"it":"Sono esattamente la stessa cosa con due nomi diversi","en":"They are exactly the same thing under two different names"},{"it":"La DI viola il DIP perché accoppia le classi alle implementazioni concrete","en":"DI violates the DIP because it couples classes to concrete implementations"},{"it":"Il DIP è un framework, mentre la DI è un principio teorico","en":"The DIP is a framework, while DI is a theoretical principle"}],"correct":0,"explanation":{"it":"In sintesi: il DIP è il principio (dipendere da astrazioni), la DI è una delle tecniche che lo attuano: invece di creare con `new` le proprie dipendenze concrete, una classe le riceve dall\u0027esterno (costruttore/setter), tipicamente tramite un container IoC come Spring, riferendosi a interfacce.\nLe altre opzioni: non sono la stessa cosa (uno è principio, l\u0027altra tecnica); la DI ben fatta riduce l\u0027accoppiamento anziché aumentarlo; l\u0027inversione di ruoli tra framework e principio è errata.","en":"In summary: the DIP is the principle (depend on abstractions), DI is one of the techniques that implement it: instead of creating its own concrete dependencies with `new`, a class receives them from the outside (constructor/setter), typically through an IoC container such as Spring, referring to interfaces.\nThe other options: they are not the same thing (one is a principle, the other a technique); well-done DI reduces coupling rather than increasing it; the swapping of roles between framework and principle is wrong."}},{"type":"truefalse","prompt":{"it":"Favorire la composizione rispetto all\u0027ereditarietà aiuta a evitare gerarchie rigide e il fragile base class problem, aumentando la flessibilità del comportamento a runtime.","en":"Favoring composition over inheritance helps avoid rigid hierarchies and the fragile base class problem, increasing the flexibility of behavior at runtime."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: la composizione delega a collaboratori intercambiabili (come in `Strategy` o `Decorator`) permettendo di combinare e sostituire comportamenti a runtime, mentre l\u0027ereditarietà lega la sottoclasse ai dettagli della superclasse e può rompersi quando la base cambia (fragile base class).\nLe altre opzioni: l\u0027affermazione è vera; l\u0027errore tipico è credere che l\u0027ereditarietà sia sempre la via di riuso preferibile, quando spesso introduce accoppiamento rigido.","en":"In summary: this is true: composition delegates to interchangeable collaborators (as in `Strategy` or `Decorator`), allowing behaviors to be combined and replaced at runtime, whereas inheritance ties the subclass to the details of the superclass and can break when the base changes (fragile base class).\nThe other options: the statement is true; the typical mistake is believing that inheritance is always the preferable path to reuse, when it often introduces rigid coupling."}},{"type":"mcq","prompt":{"it":"Perché il \u0027God Object\u0027 è considerato un anti-pattern?","en":"Why is the \u0027God Object\u0027 considered an anti-pattern?"},"code":"","options":[{"it":"Concentra troppe responsabilità e troppo stato in un\u0027unica classe, violando l\u0027SRP e rendendo il codice difficile da capire, testare e mantenere","en":"It concentrates too many responsibilities and too much state in a single class, violating the SRP and making the code hard to understand, test, and maintain"},{"it":"Usa troppe interfacce minuscole, violando l\u0027ISP","en":"It uses too many tiny interfaces, violating the ISP"},{"it":"Clona gli oggetti invece di crearli da zero, sprecando memoria","en":"It clones objects instead of creating them from scratch, wasting memory"},{"it":"Espone un\u0027interfaccia troppo semplice verso un sottosistema","en":"It exposes an overly simple interface to a subsystem"}],"correct":0,"explanation":{"it":"In sintesi: il God Object (o God Class) accentra logica, dati e responsabilità che dovrebbero stare in più classi coese; viola l\u0027SRP, crea alto accoppiamento, diventa un collo di bottiglia per le modifiche e ostacola i test. Si bonifica scomponendolo per responsabilità.\nLe altre opzioni: le interfacce troppo piccole non sono il difetto qui; la clonazione riguarda il `Prototype`; l\u0027interfaccia semplice verso un sottosistema è una `Facade`, che è un pattern utile, non l\u0027anti-pattern descritto.","en":"In summary: the God Object (or God Class) centralizes logic, data, and responsibilities that should be spread across several cohesive classes; it violates the SRP, creates high coupling, becomes a bottleneck for changes, and hinders testing. It is remedied by breaking it down by responsibility.\nThe other options: overly small interfaces are not the flaw here; cloning concerns the `Prototype`; a simple interface to a subsystem is a `Facade`, which is a useful pattern, not the anti-pattern described."}},{"type":"truefalse","prompt":{"it":"Usare il Singleton in modo pervasivo è spesso considerato un anti-pattern perché introduce stato globale, nasconde le dipendenze e ostacola i test (ad esempio il mocking).","en":"Using the Singleton pervasively is often considered an anti-pattern because it introduces global state, hides dependencies, and hinders testing (for example, mocking)."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: il Singleton usato ovunque diventa una variabile globale mascherata, crea dipendenze implicite non visibili nella firma dei metodi, complica i test perché è difficile sostituirlo con un mock e introduce accoppiamento nascosto. Spesso è meglio un normale bean a scope singleton gestito dal container e iniettato via DI.\nLe altre opzioni: l\u0027affermazione è vera; l\u0027errore tipico è considerare il Singleton sempre innocuo, ignorando l\u0027impatto su testabilità e stato globale.","en":"In summary: this is true: a Singleton used everywhere becomes a disguised global variable, creates implicit dependencies that are not visible in method signatures, complicates testing because it is hard to replace with a mock, and introduces hidden coupling. Often a plain singleton-scoped bean managed by the container and injected via DI is preferable.\nThe other options: the statement is true; the typical mistake is considering the Singleton always harmless, ignoring its impact on testability and global state."}},{"type":"mcq","prompt":{"it":"Come implementa Spring, di default, l\u0027AOP (ad esempio `@Transactional`) sui bean?","en":"How does Spring implement AOP (for example `@Transactional`) on beans by default?"},"code":"","options":[{"it":"Tramite Proxy (JDK dynamic proxy se il bean implementa un\u0027interfaccia, altrimenti CGLIB) che intercetta le chiamate ai metodi e applica gli advice","en":"Through a Proxy (JDK dynamic proxy if the bean implements an interface, otherwise CGLIB) that intercepts method calls and applies the advice"},{"it":"Riscrivendo obbligatoriamente il bytecode di ogni classe a compile-time","en":"By mandatorily rewriting the bytecode of every class at compile-time"},{"it":"Applicando il pattern Observer a ogni metodo del bean","en":"By applying the Observer pattern to every method of the bean"},{"it":"Copiando manualmente il codice transazionale dentro ciascun metodo","en":"By manually copying the transactional code into each method"}],"correct":0,"explanation":{"it":"In sintesi: Spring AOP è proxy-based: crea un proxy del bean e intercetta le invocazioni per eseguire gli advice, come apertura/commit di transazione in `@Transactional`. Nello Spring Framework classico il default è JDK dynamic proxy quando il bean implementa un\u0027interfaccia e CGLIB altrimenti (Spring Boot invece forza CGLIB per default anche con interfacce). Da qui deriva anche il noto limite delle chiamate self-invocation che bypassano il proxy.\nLe altre opzioni: il weaving a compile-time è di AspectJ, non il default di Spring; l\u0027Observer non c\u0027entra; l\u0027idea di duplicare il codice è proprio ciò che l\u0027AOP evita.","en":"In summary: Spring AOP is proxy-based: it creates a proxy of the bean and intercepts invocations to run the advice, such as opening/committing a transaction in `@Transactional`. In the classic Spring Framework the default is a JDK dynamic proxy when the bean implements an interface and CGLIB otherwise (Spring Boot, instead, forces CGLIB by default even with interfaces). This also gives rise to the well-known limitation of self-invocation calls that bypass the proxy.\nThe other options: compile-time weaving belongs to AspectJ, not Spring\u0027s default; the Observer is unrelated; the idea of duplicating the code is precisely what AOP avoids."}},{"type":"mcq","prompt":{"it":"Quale pattern applica principalmente l\u0027ApplicationContext di Spring per creare e fornire i bean?","en":"Which pattern does Spring\u0027s ApplicationContext mainly apply to create and provide the beans?"},"code":"","options":[{"it":"Un pattern Factory (creazione centralizzata degli oggetti) combinato con Inversion of Control / Dependency Injection","en":"A Factory pattern (centralized object creation) combined with Inversion of Control / Dependency Injection"},{"it":"Il pattern Decorator applicato a ogni bean","en":"The Decorator pattern applied to every bean"},{"it":"Il pattern Chain of Responsibility per istanziare i bean","en":"The Chain of Responsibility pattern to instantiate the beans"},{"it":"Il pattern Prototype come unica strategia di creazione possibile","en":"The Prototype pattern as the only possible creation strategy"}],"correct":0,"explanation":{"it":"In sintesi: il container Spring (`BeanFactory`/`ApplicationContext`) è essenzialmente una factory centralizzata che istanzia, configura e assembla i bean e ne inietta le dipendenze, applicando l\u0027Inversion of Control: è il framework a creare e collegare gli oggetti, non il codice applicativo.\nLe altre opzioni: il `Decorator` non è il meccanismo di creazione; il `Chain of Responsibility` non descrive l\u0027istanziazione; il prototype è solo uno degli scope disponibili, non l\u0027unica strategia (il default è singleton).","en":"In summary: the Spring container (`BeanFactory`/`ApplicationContext`) is essentially a centralized factory that instantiates, configures, and assembles the beans and injects their dependencies, applying Inversion of Control: it is the framework that creates and wires the objects, not the application code.\nThe other options: the `Decorator` is not the creation mechanism; the `Chain of Responsibility` does not describe instantiation; the prototype is just one of the available scopes, not the only strategy (the default is singleton)."}},{"type":"mcq","prompt":{"it":"`JdbcTemplate` di Spring è un esempio classico di quale pattern?","en":"Spring\u0027s `JdbcTemplate` is a classic example of which pattern?"},"code":"","options":[{"it":"Template Method: gestisce il boilerplate (connessione, statement, chiusura risorse, traduzione delle eccezioni) e delega i passi variabili tramite callback","en":"Template Method: it handles the boilerplate (connection, statement, resource closing, exception translation) and delegates the variable steps through callbacks"},{"it":"Singleton puro, senza altri pattern coinvolti","en":"A pure Singleton, with no other patterns involved"},{"it":"Adapter tra due database differenti","en":"An Adapter between two different databases"},{"it":"Observer applicato all\u0027esecuzione delle query","en":"The Observer applied to query execution"}],"correct":0,"explanation":{"it":"In sintesi: `JdbcTemplate` incarna il Template Method: fissa la sequenza invariante di accesso ai dati (ottieni connessione, prepara statement, esegui, chiudi, traduci le `SQLException` in `DataAccessException`) e lascia al chiamante solo i passi variabili tramite callback come `RowMapper` o `PreparedStatementCreator`, eliminando il boilerplate JDBC.\nLe altre opzioni: pur essendo usato come bean singleton, il pattern che lo caratterizza è il Template Method; non adatta database né notifica osservatori.","en":"In summary: `JdbcTemplate` embodies the Template Method: it fixes the invariant sequence of data access (obtain connection, prepare statement, execute, close, translate `SQLException` into `DataAccessException`) and leaves the caller only the variable steps through callbacks such as `RowMapper` or `PreparedStatementCreator`, eliminating the JDBC boilerplate.\nThe other options: although it is used as a singleton bean, the pattern that characterizes it is the Template Method; it neither adapts databases nor notifies observers."}},{"type":"mcq","prompt":{"it":"Decorator e Proxy hanno struttura simile (entrambi avvolgono un oggetto con la stessa interfaccia): qual è la differenza concettuale principale?","en":"Decorator and Proxy have a similar structure (both wrap an object with the same interface): what is the main conceptual difference?"},"code":"","options":[{"it":"Il Decorator aggiunge/estende responsabilità all\u0027oggetto; il Proxy ne controlla l\u0027accesso (lazy loading, sicurezza, oggetto remoto) mantenendone l\u0027interfaccia","en":"The Decorator adds/extends responsibilities to the object; the Proxy controls access to it (lazy loading, security, remote object) while keeping its interface"},{"it":"Il Proxy aggiunge sempre nuove funzionalità, mentre il Decorator serve solo per il logging","en":"The Proxy always adds new functionality, while the Decorator is only for logging"},{"it":"Sono lo stesso identico pattern con due nomi diversi","en":"They are the exact same pattern with two different names"},{"it":"Il Decorator controlla l\u0027accesso all\u0027oggetto, mentre il Proxy ne estende le funzionalità","en":"The Decorator controls access to the object, while the Proxy extends its functionality"}],"correct":0,"explanation":{"it":"In sintesi: strutturalmente simili, differiscono per intento: il Decorator arricchisce dinamicamente il comportamento (aggiunge responsabilità componibili), mentre il Proxy fa da intermediario per gestire l\u0027accesso all\u0027oggetto reale senza alterarne le funzionalità (virtual/protection/remote proxy).\nLe altre opzioni: la seconda riduce il Decorator al solo logging ed è imprecisa; non sono lo stesso pattern; la quarta inverte esattamente i due intenti.","en":"In summary: structurally similar, they differ in intent: the Decorator dynamically enriches behavior (adding composable responsibilities), whereas the Proxy acts as an intermediary to manage access to the real object without altering its functionality (virtual/protection/remote proxy).\nThe other options: the second reduces the Decorator to logging alone and is inaccurate; they are not the same pattern; the fourth reverses the two intents exactly."}},{"type":"code","prompt":{"it":"Questa implementazione di double-checked locking del Singleton è corretta in Java? Perché?","en":"Is this double-checked locking implementation of the Singleton correct in Java? Why?"},"code":"public class Registry {\n    private static Registry instance;   // NB: non volatile\n    private Registry() {}\n    public static Registry getInstance() {\n        if (instance == null) {\n            synchronized (Registry.class) {\n                if (instance == null) {\n                    instance = new Registry();\n                }\n            }\n        }\n        return instance;\n    }\n}","options":[{"it":"No: senza `volatile` su `instance`, per via del riordino delle istruzioni un thread può leggere un riferimento a un oggetto non ancora completamente inizializzato","en":"No: without `volatile` on `instance`, due to instruction reordering a thread may read a reference to an object that is not yet fully initialized"},{"it":"Sì, così com\u0027è è pienamente corretta e thread-safe","en":"Yes, as it stands it is fully correct and thread-safe"},{"it":"No, perché `synchronized` su un oggetto `Class` non è consentito dal linguaggio","en":"No, because `synchronized` on a `Class` object is not allowed by the language"},{"it":"No, perché il costruttore deve essere `public` per funzionare","en":"No, because the constructor must be `public` to work"}],"correct":0,"explanation":{"it":"In sintesi: il double-checked locking è corretto solo se `instance` è `volatile`. `instance = new Registry()` non è atomico (allocazione, costruzione, assegnazione del riferimento) e senza `volatile` il JMM permette che l\u0027assegnazione del riferimento diventi visibile prima del completamento del costruttore, così un altro thread vede un oggetto parzialmente costruito. `volatile` impedisce quel riordino e garantisce la visibilità.\nLe altre opzioni: non è corretta com\u0027è; `synchronized` su `Registry.class` è perfettamente lecito; il costruttore privato è anzi necessario al Singleton.","en":"In summary: double-checked locking is correct only if `instance` is `volatile`. `instance = new Registry()` is not atomic (allocation, construction, assignment of the reference) and without `volatile` the JMM allows the assignment of the reference to become visible before the constructor completes, so another thread sees a partially constructed object. `volatile` prevents that reordering and guarantees visibility.\nThe other options: it is not correct as it stands; `synchronized` on `Registry.class` is perfectly legal; the private constructor is in fact required for the Singleton."}},{"type":"code","prompt":{"it":"Perché questo design viola il Liskov Substitution Principle (LSP)?","en":"Why does this design violate the Liskov Substitution Principle (LSP)?"},"code":"class Bird {\n    void fly() { /* vola */ }\n}\nclass Ostrich extends Bird {\n    @Override\n    void fly() {\n        throw new UnsupportedOperationException(\"Gli struzzi non volano\");\n    }\n}\n\nvoid makeItFly(Bird b) {\n    b.fly();   // il client si aspetta un Bird che vola\n}","options":[{"it":"Perché `Ostrich`, sostituito a `Bird`, rompe il contratto: dove il client si aspetta un `fly()` valido riceve invece un\u0027eccezione a runtime","en":"Because `Ostrich`, when substituted for `Bird`, breaks the contract: where the client expects a valid `fly()` it instead gets a runtime exception"},{"it":"Perché `Ostrich` non sovrascrive un numero sufficiente di metodi della superclasse","en":"Because `Ostrich` does not override a sufficient number of the superclass\u0027s methods"},{"it":"Perché il metodo `fly()` dovrebbe essere dichiarato `static`","en":"Because the `fly()` method should be declared `static`"},{"it":"Non lo viola affatto: lanciare un\u0027eccezione in un override è sempre lecito","en":"It does not violate it at all: throwing an exception in an override is always legitimate"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027LSP richiede che un sottotipo sia usabile ovunque al posto del supertipo senza rompere le aspettative del client; qui `Ostrich` indebolisce/annulla il contratto di `fly()` lanciando `UnsupportedOperationException`, quindi `makeItFly(new Ostrich())` fallisce a runtime. Il fix è ripensare la gerarchia, ad esempio separando `FlyingBird` da `Bird` (segnale di ISP/composizione).\nLe altre opzioni: il numero di metodi sovrascritti è irrilevante; `static` non c\u0027entra con la sostituibilità; lanciare eccezioni non previste dal contratto del supertipo è proprio ciò che viola l\u0027LSP.","en":"In summary: the LSP requires that a subtype be usable anywhere in place of the supertype without breaking the client\u0027s expectations; here `Ostrich` weakens/nullifies the contract of `fly()` by throwing `UnsupportedOperationException`, so `makeItFly(new Ostrich())` fails at runtime. The fix is to rethink the hierarchy, for example by separating `FlyingBird` from `Bird` (a hint toward ISP/composition).\nThe other options: the number of overridden methods is irrelevant; `static` has nothing to do with substitutability; throwing exceptions not foreseen by the supertype\u0027s contract is precisely what violates the LSP."}}]},{"id":"frontend","title":"Front-end (JavaScript \u0026 React)","questions":[{"type":"code","prompt":{"it":"Qual è l\u0027output di questo snippet?","en":"What is the output of this snippet?"},"code":"for (var i = 0; i \u003c 3; i++) {\n  setTimeout(() =\u003e console.log(i), 0);\n}","options":[{"it":"0 1 2","en":"0 1 2"},{"it":"0 0 0","en":"0 0 0"},{"it":"3 3 3","en":"3 3 3"},{"it":"1 2 3","en":"1 2 3"}],"correct":2,"explanation":{"it":"In sintesi: `var` ha function scope, non block scope, quindi esiste una sola variabile `i` condivisa da tutte le callback; i `setTimeout` sono asincroni e girano dopo la fine del loop, quando `i` vale già 3, perciò stampano 3 3 3. Con `let`, che ha block scope, si crea un binding per iterazione e stamperebbe 0 1 2.\nLe altre opzioni: 0 1 2 vale solo con `let` (binding per iterazione); 0 0 0 e 1 2 3 ignorano la natura asincrona o il valore finale di `i`.","en":"In summary: `var` has function scope, not block scope, so there is a single `i` variable shared by all the callbacks; the `setTimeout` calls are asynchronous and run after the loop finishes, when `i` is already 3, so they print 3 3 3. With `let`, which has block scope, a new binding is created per iteration and it would print 0 1 2.\nThe other options: 0 1 2 only holds with `let` (per-iteration binding); 0 0 0 and 1 2 3 ignore the asynchronous nature or the final value of `i`."}},{"type":"code","prompt":{"it":"Cosa stampano le due `console.log`?","en":"What do the two `console.log` calls print?"},"code":"console.log(foo);\nconsole.log(bar);\nvar foo = 1;\nfunction bar() { return 2; }","options":[{"it":"`ReferenceError` su `foo`","en":"`ReferenceError` on `foo`"},{"it":"`undefined` e la funzione `bar`","en":"`undefined` and the `bar` function"},{"it":"`undefined` e `undefined`","en":"`undefined` and `undefined`"},{"it":"`1` e la funzione `bar`","en":"`1` and the `bar` function"}],"correct":1,"explanation":{"it":"In sintesi: le dichiarazioni `var` sono hoisted ma inizializzate a `undefined`, quindi `foo` esiste ma vale `undefined`; le function declaration sono hoisted per intero, corpo compreso, perciò `bar` è già la funzione.\nLe altre opzioni: nessun `ReferenceError` perché `var foo` è dichiarata (la TDZ vale solo per `let`/`const`); `foo` non è ancora 1 perché l\u0027assegnazione resta alla sua riga; `bar` non è `undefined` perché la function declaration è completamente hoisted.","en":"In summary: `var` declarations are hoisted but initialized to `undefined`, so `foo` exists but is `undefined`; function declarations are hoisted in full, body included, so `bar` is already the function.\nThe other options: there is no `ReferenceError` because `var foo` is declared (the TDZ only applies to `let`/`const`); `foo` is not 1 yet because the assignment stays on its own line; `bar` is not `undefined` because the function declaration is fully hoisted."}},{"type":"code","prompt":{"it":"Qual è l\u0027output?","en":"What is the output?"},"code":"function makeCounter() {\n  let count = 0;\n  return () =\u003e ++count;\n}\nconst c = makeCounter();\nconsole.log(c(), c(), c());","options":[{"it":"3 3 3","en":"3 3 3"},{"it":"1 1 1","en":"1 1 1"},{"it":"0 1 2","en":"0 1 2"},{"it":"1 2 3","en":"1 2 3"}],"correct":3,"explanation":{"it":"In sintesi: la funzione ritornata è una closure che cattura la variabile `count` dello scope di `makeCounter`, che persiste tra le chiamate; `++count` la pre-incrementa e restituisce 1, poi 2, poi 3 (gli argomenti di `console.log` sono valutati da sinistra a destra).\nLe altre opzioni: 3 3 3 confonde con il caso `var`/`setTimeout`; 1 1 1 assumerebbe un `count` re-inizializzato a ogni chiamata; 0 1 2 userebbe il post-incremento `count++`.","en":"In summary: the returned function is a closure that captures the `count` variable from `makeCounter`\u0027s scope, which persists across calls; `++count` pre-increments it and returns 1, then 2, then 3 (the arguments of `console.log` are evaluated left to right).\nThe other options: 3 3 3 confuses it with the `var`/`setTimeout` case; 1 1 1 would assume a `count` re-initialized on every call; 0 1 2 would use the post-increment `count++`."}},{"type":"code","prompt":{"it":"Cosa stampa `console.log(obj.getValue())`?","en":"What does `console.log(obj.getValue())` print?"},"code":"const obj = {\n  value: 42,\n  getValue: function () {\n    const inner = () =\u003e this.value;\n    return inner();\n  }\n};\nconsole.log(obj.getValue());","options":[{"it":"42","en":"42"},{"it":"undefined","en":"undefined"},{"it":"TypeError","en":"TypeError"},{"it":"la funzione inner","en":"the inner function"}],"correct":0,"explanation":{"it":"In sintesi: `inner` è una arrow function e non ha un proprio `this`: lo eredita lessicalmente da `getValue`, che essendo chiamata come metodo `obj.getValue()` ha `this` uguale a `obj`; quindi `this.value` è 42.\nLe altre opzioni: sarebbe `undefined` (o `TypeError` in strict mode) solo se `inner` fosse una funzione normale chiamata senza receiver, perché lì `this` non punterebbe a `obj`.","en":"In summary: `inner` is an arrow function and has no `this` of its own: it inherits it lexically from `getValue`, which—being called as the method `obj.getValue()`—has `this` equal to `obj`; so `this.value` is 42.\nThe other options: it would be `undefined` (or a `TypeError` in strict mode) only if `inner` were a regular function called without a receiver, because there `this` would not point to `obj`."}},{"type":"code","prompt":{"it":"Qual è l\u0027output?","en":"What is the output?"},"code":"console.log(0 == \u0027\u0027);\nconsole.log(null == undefined);\nconsole.log(NaN === NaN);","options":[{"it":"false, true, false","en":"false, true, false"},{"it":"true, false, true","en":"true, false, true"},{"it":"true, true, false","en":"true, true, false"},{"it":"false, false, false","en":"false, false, false"}],"correct":2,"explanation":{"it":"In sintesi: `0 == \u0027\u0027` è `true` perché con `==` entrambi vengono coerciti a numero (`\u0027\u0027` diventa 0); `null == undefined` è `true` per una regola speciale della loose equality; `NaN === NaN` è `false` perché `NaN` non è uguale a nulla, nemmeno a sé stesso.\nLe altre opzioni: invertono la coercion di `0 == \u0027\u0027` o assumono erroneamente che `NaN === NaN` sia `true`.","en":"In summary: `0 == \u0027\u0027` is `true` because with `==` both are coerced to a number (`\u0027\u0027` becomes 0); `null == undefined` is `true` because of a special loose-equality rule; `NaN === NaN` is `false` because `NaN` is not equal to anything, not even itself.\nThe other options: they invert the coercion of `0 == \u0027\u0027` or wrongly assume that `NaN === NaN` is `true`."}},{"type":"code","prompt":{"it":"Cosa stampa lo snippet?","en":"What does the snippet print?"},"code":"const vals = [0, \u0027\u0027, \u0027false\u0027, [], null, undefined, NaN];\nconsole.log(vals.filter(Boolean).length);","options":[{"it":"3","en":"3"},{"it":"2","en":"2"},{"it":"4","en":"4"},{"it":"7","en":"7"}],"correct":1,"explanation":{"it":"In sintesi: `filter(Boolean)` tiene solo i valori truthy; qui restano `\u0027false\u0027` (stringa non vuota, quindi truthy) e `[]` (ogni oggetto/array è truthy), mentre `0`, `\u0027\u0027`, `null`, `undefined` e `NaN` sono falsy e vengono scartati: totale 2.\nLe altre opzioni: 3 o 4 contano per errore qualche falsy come `0` o `\u0027\u0027`, dimenticando che `\u0027false\u0027` e `[]` sono truthy.","en":"In summary: `filter(Boolean)` keeps only the truthy values; here `\u0027false\u0027` (a non-empty string, therefore truthy) and `[]` (every object/array is truthy) remain, while `0`, `\u0027\u0027`, `null`, `undefined` and `NaN` are falsy and get discarded: total 2.\nThe other options: 3 or 4 wrongly count some falsy value such as `0` or `\u0027\u0027`, forgetting that `\u0027false\u0027` and `[]` are truthy."}},{"type":"truefalse","prompt":{"it":"In JavaScript ogni oggetto ha un collegamento interno (`[[Prototype]]`) a un altro oggetto da cui eredita proprietà, e la ricerca di una proprietà risale la prototype chain finché la trova o raggiunge `null`.","en":"In JavaScript every object has an internal link (`[[Prototype]]`) to another object from which it inherits properties, and a property lookup walks up the prototype chain until it finds the property or reaches `null`."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: ogni oggetto ha un link interno `[[Prototype]]` (accessibile via `Object.getPrototypeOf`) e l\u0027accesso a una proprietà risale la prototype chain finché la trova o raggiunge `null`; questa è l\u0027ereditarietà prototipale, diversa dalle classi basate su copia.\nLe altre opzioni: sarebbe falso solo se JS copiasse le proprietà nelle istanze, ma la ricerca è dinamica lungo la catena.","en":"In summary: it\u0027s true: every object has an internal `[[Prototype]]` link (accessible via `Object.getPrototypeOf`) and accessing a property walks up the prototype chain until it finds it or reaches `null`; this is prototypal inheritance, different from copy-based classes.\nThe other options: it would be false only if JS copied the properties into the instances, but the lookup is dynamic along the chain."}},{"type":"code","prompt":{"it":"In quale ordine vengono stampati i log?","en":"In what order are the logs printed?"},"code":"console.log(\u0027A\u0027);\nsetTimeout(() =\u003e console.log(\u0027B\u0027), 0);\nPromise.resolve().then(() =\u003e console.log(\u0027C\u0027));\nconsole.log(\u0027D\u0027);","options":[{"it":"A B C D","en":"A B C D"},{"it":"A D B C","en":"A D B C"},{"it":"A C D B","en":"A C D B"},{"it":"A D C B","en":"A D C B"}],"correct":3,"explanation":{"it":"In sintesi: prima gira il codice sincrono, quindi `A` e `D`; poi si svuota la coda dei microtask (la callback di `Promise.then`), quindi `C`; infine i macrotask come `setTimeout`, quindi `B`. I microtask hanno priorità sui macrotask alla fine di ogni tick dell\u0027event loop.\nLe altre opzioni: mettere `B` prima di `C` ignora la priorità dei microtask sui macrotask.","en":"In summary: the synchronous code runs first, so `A` and `D`; then the microtask queue is drained (the `Promise.then` callback), so `C`; finally the macrotasks such as `setTimeout`, so `B`. Microtasks take priority over macrotasks at the end of each event-loop tick.\nThe other options: putting `B` before `C` ignores the priority of microtasks over macrotasks."}},{"type":"code","prompt":{"it":"Qual è l\u0027ordine dei log?","en":"What is the order of the logs?"},"code":"async function f() {\n  console.log(1);\n  await null;\n  console.log(2);\n}\nconsole.log(3);\nf();\nconsole.log(4);","options":[{"it":"3 1 2 4","en":"3 1 2 4"},{"it":"3 1 4 2","en":"3 1 4 2"},{"it":"1 2 3 4","en":"1 2 3 4"},{"it":"3 4 1 2","en":"3 4 1 2"}],"correct":1,"explanation":{"it":"In sintesi: `console.log(3)` è sincrono; poi `f()` parte ed esegue in modo sincrono fino a `await`, stampando `1`; l\u0027`await` sospende la funzione e schedula la continuazione come microtask restituendo il controllo, quindi si stampa `4`; a fine tick il microtask riprende e stampa `2`. Ordine: 3 1 4 2.\nLe altre opzioni: il codice dopo `await` non è sincrono (non 3 1 2 4), e `1` esce prima di `4` perché precede l\u0027`await`.","en":"In summary: `console.log(3)` is synchronous; then `f()` starts and runs synchronously up to the `await`, printing `1`; the `await` suspends the function and schedules the continuation as a microtask, handing control back, so `4` is printed; at the end of the tick the microtask resumes and prints `2`. Order: 3 1 4 2.\nThe other options: the code after `await` is not synchronous (not 3 1 2 4), and `1` comes out before `4` because it precedes the `await`."}},{"type":"code","prompt":{"it":"Qual è il valore di `r`?","en":"What is the value of `r`?"},"code":"const r = [1, 2, 3, 4].reduce((acc, n) =\u003e n % 2 === 0 ? acc + n : acc, 0);\nconsole.log(r);","options":[{"it":"6","en":"6"},{"it":"10","en":"10"},{"it":"4","en":"4"},{"it":"0","en":"0"}],"correct":0,"explanation":{"it":"In sintesi: `reduce` accumula partendo da 0; il callback aggiunge `n` solo se `n % 2 === 0`, quindi somma i pari 2 e 4 e ignora 1 e 3: risultato 6.\nLe altre opzioni: 10 somma tutti gli elementi, 4 dimentica un pari, 0 ignora l\u0027accumulo.","en":"In summary: `reduce` accumulates starting from 0; the callback adds `n` only if `n % 2 === 0`, so it sums the even numbers 2 and 4 and ignores 1 and 3: result 6.\nThe other options: 10 sums all the elements, 4 forgets one even number, 0 ignores the accumulation."}},{"type":"code","prompt":{"it":"Cosa stampa lo snippet?","en":"What does the snippet print?"},"code":"const { a, b = 5, c } = { a: 1, c: null };\nconsole.log(a, b, c);","options":[{"it":"1 undefined null","en":"1 undefined null"},{"it":"1 5 undefined","en":"1 5 undefined"},{"it":"1 5 null","en":"1 5 null"},{"it":"undefined 5 null","en":"undefined 5 null"}],"correct":2,"explanation":{"it":"In sintesi: `a` prende 1; `b` non è presente nell\u0027oggetto quindi vale `undefined` e scatta il default 5; `c` è presente con valore `null`, e i default nel destructuring si applicano solo a `undefined`, non a `null`, quindi `c` resta `null`.\nLe altre opzioni: dare `undefined` a `b` ignora il default; dare il default a `c` confonde `null` con `undefined`.","en":"In summary: `a` takes 1; `b` is not present in the object so it is `undefined` and the default 5 kicks in; `c` is present with the value `null`, and defaults in destructuring apply only to `undefined`, not to `null`, so `c` stays `null`.\nThe other options: giving `b` `undefined` ignores the default; giving `c` the default confuses `null` with `undefined`."}},{"type":"code","prompt":{"it":"Qual è l\u0027output?","en":"What is the output?"},"code":"function sum(...args) {\n  return args.reduce((a, b) =\u003e a + b, 0);\n}\nconst arr = [1, 2, 3];\nconsole.log(sum(...arr, 4));","options":[{"it":"6","en":"6"},{"it":"[1, 2, 3, 4]","en":"[1, 2, 3, 4]"},{"it":"NaN","en":"NaN"},{"it":"10","en":"10"}],"correct":3,"explanation":{"it":"In sintesi: lo spread `...arr` espande `[1, 2, 3]` come argomenti separati e vi si aggiunge `4`, quindi `sum` riceve 1, 2, 3, 4; il rest `...args` li raccoglie in un array e `reduce` li somma: 10.\nLe altre opzioni: 6 dimentica il `4` aggiunto dopo lo spread; l\u0027array o `NaN` fraintendono spread e rest.","en":"In summary: the spread `...arr` expands `[1, 2, 3]` into separate arguments and `4` is added to them, so `sum` receives 1, 2, 3, 4; the rest `...args` collects them into an array and `reduce` sums them: 10.\nThe other options: 6 forgets the `4` added after the spread; the array or `NaN` misunderstand spread and rest."}},{"type":"code","prompt":{"it":"Cosa stampano le tre `console.log`?","en":"What do the three `console.log` calls print?"},"code":"const user = { profile: { name: \u0027Ada\u0027 }, age: 0 };\nconsole.log(user.profile?.name ?? \u0027anon\u0027);\nconsole.log(user.contact?.email ?? \u0027no email\u0027);\nconsole.log(user.age ?? 99);","options":[{"it":"Ada, no email, 99","en":"Ada, no email, 99"},{"it":"Ada, no email, 0","en":"Ada, no email, 0"},{"it":"Ada, undefined, 0","en":"Ada, undefined, 0"},{"it":"undefined, no email, 99","en":"undefined, no email, 99"}],"correct":1,"explanation":{"it":"In sintesi: `?.` corto-circuita restituendo `undefined` quando l\u0027oggetto è `null`/`undefined`, quindi `user.contact?.email` è `undefined`; `??` fornisce il fallback solo per `null`/`undefined`, perciò `email` diventa `\u0027no email\u0027`, mentre `age` vale 0 e 0 non è nullish, quindi `??` NON applica il default e resta 0.\nLe altre opzioni: dare 99 ad `age` confonde `??` con `||`, che invece scatterebbe su 0 perché falsy.","en":"In summary: `?.` short-circuits and returns `undefined` when the object is `null`/`undefined`, so `user.contact?.email` is `undefined`; `??` provides the fallback only for `null`/`undefined`, so `email` becomes `\u0027no email\u0027`, while `age` is 0 and 0 is not nullish, so `??` does NOT apply the default and it stays 0.\nThe other options: giving `age` 99 confuses `??` with `||`, which would instead trigger on 0 because it is falsy."}},{"type":"truefalse","prompt":{"it":"L\u0027event delegation sfrutta il bubbling: si registra un solo listener sull\u0027elemento antenato comune invece di uno per ogni figlio, e si usa `event.target` per identificare l\u0027elemento che ha originato l\u0027evento.","en":"Event delegation leverages bubbling: you register a single listener on the common ancestor element instead of one per child, and use `event.target` to identify the element that originated the event."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: l\u0027event delegation sfrutta il bubbling degli eventi, registrando un solo listener sull\u0027antenato comune e usando `event.target` per capire quale figlio ha originato l\u0027evento; è efficiente e funziona anche per elementi aggiunti dinamicamente.\nLe altre opzioni: sarebbe falso solo se gli eventi non risalissero la gerarchia, ma la maggior parte fa bubbling fino al contenitore.","en":"In summary: it\u0027s true: event delegation leverages event bubbling, registering a single listener on the common ancestor and using `event.target` to figure out which child originated the event; it\u0027s efficient and also works for elements added dynamically.\nThe other options: it would be false only if events did not travel up the hierarchy, but most of them bubble up to the container."}},{"type":"code","prompt":{"it":"Qual è l\u0027output?","en":"What is the output?"},"code":"function greet(greeting) {\n  return greeting + \u0027, \u0027 + this.name;\n}\nconst p = { name: \u0027Sam\u0027 };\nconsole.log(greet.call(p, \u0027Hi\u0027));","options":[{"it":"Hi, Sam","en":"Hi, Sam"},{"it":"Hi, undefined","en":"Hi, undefined"},{"it":"undefined, Sam","en":"undefined, Sam"},{"it":"TypeError","en":"TypeError"}],"correct":0,"explanation":{"it":"In sintesi: `call` invoca subito la funzione impostando `this` al primo argomento (`p`) e passando gli altri come argomenti singoli, quindi `greeting` è `\u0027Hi\u0027` e `this.name` è `\u0027Sam\u0027`: risultato `\u0027Hi, Sam\u0027`. Ricorda: `apply` è come `call` ma con gli argomenti in un array, mentre `bind` restituisce una nuova funzione senza chiamarla.\nLe altre opzioni: `Hi, undefined` ignorerebbe il binding di `this` a `p`.","en":"In summary: `call` invokes the function immediately, setting `this` to the first argument (`p`) and passing the others as individual arguments, so `greeting` is `\u0027Hi\u0027` and `this.name` is `\u0027Sam\u0027`: result `\u0027Hi, Sam\u0027`. Remember: `apply` is like `call` but with the arguments in an array, while `bind` returns a new function without calling it.\nThe other options: `Hi, undefined` would ignore the binding of `this` to `p`."}},{"type":"code","prompt":{"it":"Cosa stampano le due righe?","en":"What do the two lines print?"},"code":"console.log(\u00275\u0027 + 2);\nconsole.log(\u00275\u0027 - 2);","options":[{"it":"7 e 3","en":"7 and 3"},{"it":"\"52\" e \"3\"","en":"\"52\" and \"3\""},{"it":"\"52\" e 3","en":"\"52\" and 3"},{"it":"7 e \"52\"","en":"7 and \"52\""}],"correct":2,"explanation":{"it":"In sintesi: con `+`, se un operando è una stringa avviene la concatenazione, quindi `\u00275\u0027 + 2` produce `\u002752\u0027`; l\u0027operatore `-` non ha semantica di stringa e forza la coercion numerica, quindi `\u00275\u0027 - 2` diventa `5 - 2 = 3` (number).\nLe altre opzioni: `7` per la prima confonde `+` con la somma numerica; il risultato di `-` è il number `3`, non la stringa `\u00273\u0027`.","en":"In summary: with `+`, if one operand is a string, concatenation happens, so `\u00275\u0027 + 2` produces `\u002752\u0027`; the `-` operator has no string semantics and forces numeric coercion, so `\u00275\u0027 - 2` becomes `5 - 2 = 3` (a number).\nThe other options: `7` for the first confuses `+` with numeric addition; the result of `-` is the number `3`, not the string `\u00273\u0027`."}},{"type":"mcq","prompt":{"it":"Quale affermazione su JSX è corretta?","en":"Which statement about JSX is correct?"},"code":"","options":[{"it":"JSX è HTML valido interpretato direttamente dal browser senza alcuna compilazione","en":"JSX is valid HTML interpreted directly by the browser without any compilation"},{"it":"In JSX si usa l\u0027attributo `class` esattamente come in HTML","en":"In JSX you use the `class` attribute exactly as in HTML"},{"it":"JSX permette di restituire più elementi fratelli senza alcun wrapper o Fragment","en":"JSX lets you return multiple sibling elements without any wrapper or Fragment"},{"it":"JSX è sintassi che un transpiler compila in chiamate come `React.createElement` (o nel JSX runtime), e un componente deve restituire un singolo nodo radice (eventualmente un Fragment)","en":"JSX is syntax that a transpiler compiles into calls like `React.createElement` (or into the JSX runtime), and a component must return a single root node (possibly a Fragment)"}],"correct":3,"explanation":{"it":"In sintesi: JSX non è HTML: è sintassi che un transpiler (Babel/tsc) trasforma in `React.createElement` o nelle chiamate del JSX runtime; per questo un componente deve avere un unico nodo radice, e per raggruppare fratelli senza aggiungere markup si usa un `Fragment` (`\u003c\u003e...\u003c/\u003e`). In JSX inoltre si scrive `className`, non `class`.\nLe altre opzioni: il browser non capisce JSX senza build; `class` è una keyword riservata in JS; servono un wrapper o un Fragment per più fratelli.","en":"In summary: JSX is not HTML: it\u0027s syntax that a transpiler (Babel/tsc) turns into `React.createElement` or the JSX runtime calls; that\u0027s why a component must have a single root node, and to group siblings without adding markup you use a `Fragment` (`\u003c\u003e...\u003c/\u003e`). In JSX you also write `className`, not `class`.\nThe other options: the browser doesn\u0027t understand JSX without a build step; `class` is a reserved keyword in JS; you need a wrapper or a Fragment for multiple siblings."}},{"type":"truefalse","prompt":{"it":"Le props sono di sola lettura per il componente che le riceve, mentre lo state è gestito internamente e può cambiare nel tempo, provocando un re-render.","en":"Props are read-only for the component that receives them, whereas state is managed internally and can change over time, triggering a re-render."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: le props seguono il flusso unidirezionale dall\u0027alto verso il basso e sono immutabili dentro il componente che le riceve, mentre lo state è locale, mutabile tramite il suo setter, e ogni suo aggiornamento programma un re-render.\nLe altre opzioni: sarebbe falso solo se un componente potesse riassegnare le proprie props, ma modificarle è un anti-pattern e non propaga nulla.","en":"In summary: it\u0027s true: props follow the one-way, top-down flow and are immutable inside the component that receives them, whereas state is local, mutable through its setter, and every update to it schedules a re-render.\nThe other options: it would be false only if a component could reassign its own props, but modifying them is an anti-pattern and propagates nothing."}},{"type":"code","prompt":{"it":"Cliccando UNA sola volta il bottone, quale valore mostra alla fine?","en":"Clicking the button ONCE, what value does it show in the end?"},"code":"function Counter() {\n  const [count, setCount] = useState(0);\n  const handle = () =\u003e {\n    setCount(count + 1);\n    setCount(count + 1);\n    setCount(count + 1);\n  };\n  return \u003cbutton onClick={handle}\u003e{count}\u003c/button\u003e;\n}","options":[{"it":"1","en":"1"},{"it":"3","en":"3"},{"it":"0","en":"0"},{"it":"2","en":"2"}],"correct":0,"explanation":{"it":"In sintesi: le tre `setCount(count + 1)` leggono lo stesso `count` catturato dalla closure di questo render (0), quindi calcolano tutte 1; React fa il batching degli aggiornamenti nello stesso handler e applica l\u0027ultimo valore, perciò dopo il click `count` è 1. Per sommare +3 servirebbe la updater function `setCount(c =\u003e c + 1)`.\nLe altre opzioni: 3 assume che ogni `setCount` veda il valore già aggiornato (non è così con il valore diretto); 0 e 2 fraintendono batching e closure.","en":"In summary: the three `setCount(count + 1)` calls read the same `count` captured by this render\u0027s closure (0), so they all compute 1; React batches the updates within the same handler and applies the last value, so after the click `count` is 1. To add +3 you would need the updater function `setCount(c =\u003e c + 1)`.\nThe other options: 3 assumes each `setCount` sees the already-updated value (it doesn\u0027t, with the direct value); 0 and 2 misunderstand batching and closures."}},{"type":"code","prompt":{"it":"Con questo handler, cliccando UNA volta, di quanto aumenta `count` partendo da 0?","en":"With this handler, clicking ONCE, by how much does `count` increase starting from 0?"},"code":"const handle = () =\u003e {\n  setCount(c =\u003e c + 1);\n  setCount(c =\u003e c + 1);\n  setCount(c =\u003e c + 1);\n};","options":[{"it":"di 1 (da 0 a 1)","en":"by 1 (from 0 to 1)"},{"it":"di 3 (da 0 a 3)","en":"by 3 (from 0 to 3)"},{"it":"di 0","en":"by 0"},{"it":"di 3 ma solo dopo due click","en":"by 3 but only after two clicks"}],"correct":1,"explanation":{"it":"In sintesi: passando una updater function `c =\u003e c + 1`, React invoca ogni aggiornamento sull\u0027ultimo state in coda (non sulla variabile catturata dalla closure), quindi le tre chiamate si compongono: 0→1→2→3; dopo un solo click `count` vale 3. È il pattern corretto quando il nuovo stato dipende dal precedente.\nLe altre opzioni: +1 sarebbe il caso con il valore diretto `count + 1`; 0 o \u0027due click\u0027 ignorano il funzionamento delle updater function.","en":"In summary: by passing an updater function `c =\u003e c + 1`, React invokes each update on the latest queued state (not on the variable captured by the closure), so the three calls compose: 0→1→2→3; after a single click `count` is 3. This is the correct pattern when the new state depends on the previous one.\nThe other options: +1 would be the case with the direct value `count + 1`; 0 or \u0027two clicks\u0027 ignore how updater functions work."}},{"type":"mcq","prompt":{"it":"Cosa determina l\u0027array delle dipendenze di `useEffect`?","en":"What does the dependency array of `useEffect` determine?"},"code":"","options":[{"it":"L\u0027array delle dipendenze decide l\u0027ordine di esecuzione tra più effect","en":"The dependency array decides the execution order among multiple effects"},{"it":"Con `[]` l\u0027effect gira dopo ogni render; senza array gira una sola volta","en":"With `[]` the effect runs after every render; without an array it runs only once"},{"it":"Con `[]` l\u0027effect gira una sola volta dopo il primo render; con `[a, b]` rigira quando `a` o `b` cambiano; senza array gira dopo ogni render","en":"With `[]` the effect runs only once after the first render; with `[a, b]` it re-runs when `a` or `b` change; without an array it runs after every render"},{"it":"Le dipendenze servono solo a evitare i warning del linter, senza effetto sul comportamento","en":"The dependencies only serve to avoid linter warnings, with no effect on behavior"}],"correct":2,"explanation":{"it":"In sintesi: l\u0027array di dipendenze controlla QUANDO l\u0027effect viene rieseguito: `[]` significa solo dopo il mount (con cleanup all\u0027unmount), un array con valori lo rilancia quando una dipendenza cambia (confronto per identità), e l\u0027assenza dell\u0027array lo fa girare dopo ogni render.\nLe altre opzioni: l\u0027ordine degli effect dipende dalla loro posizione nel codice, non dalle deps; le deps hanno un effetto reale sul comportamento, non sono cosmesi del linter.","en":"In summary: the dependency array controls WHEN the effect is re-run: `[]` means only after mount (with cleanup on unmount), an array with values re-runs it when a dependency changes (compared by identity), and the absence of the array makes it run after every render.\nThe other options: the order of effects depends on their position in the code, not on the deps; the deps have a real effect on behavior, they are not linter cosmetics."}},{"type":"code","prompt":{"it":"A cosa serve la funzione ritornata dall\u0027effect e quando viene eseguita?","en":"What is the function returned by the effect for, and when is it executed?"},"code":"useEffect(() =\u003e {\n  const id = setInterval(() =\u003e console.log(\u0027tick\u0027), 1000);\n  return () =\u003e clearInterval(id);\n}, []);","options":[{"it":"Viene eseguita a ogni render, subito dopo il corpo dell\u0027effect","en":"It runs on every render, right after the effect\u0027s body"},{"it":"È un valore restituito a React per calcolare le dipendenze","en":"It is a value returned to React to compute the dependencies"},{"it":"Non viene mai chiamata perché l\u0027array è vuoto","en":"It is never called because the array is empty"},{"it":"È la funzione di cleanup: React la esegue all\u0027unmount del componente (e prima di ogni ri-esecuzione dell\u0027effect) per liberare risorse, qui l\u0027interval","en":"It is the cleanup function: React runs it when the component unmounts (and before every re-run of the effect) to free resources, here the interval"}],"correct":3,"explanation":{"it":"In sintesi: la funzione ritornata è il cleanup dell\u0027effect; React la chiama quando il componente si smonta e, se l\u0027effect si riesegue, anche prima della ri-esecuzione, così da rimuovere subscription o timer ed evitare leak: qui fa `clearInterval`. Con `[]` l\u0027effect gira una volta e il cleanup scatta all\u0027unmount.\nLe altre opzioni: non gira a ogni render (deps vuote), non serve a calcolare le deps, e viene eccome chiamata all\u0027unmount.","en":"In summary: the returned function is the effect\u0027s cleanup; React calls it when the component unmounts and, if the effect re-runs, also before the re-run, so as to remove subscriptions or timers and avoid leaks: here it calls `clearInterval`. With `[]` the effect runs once and the cleanup fires on unmount.\nThe other options: it doesn\u0027t run on every render (empty deps), it isn\u0027t used to compute the deps, and it most certainly is called on unmount."}},{"type":"truefalse","prompt":{"it":"È lecito chiamare `useState` dentro un blocco `if`, purché la condizione cambi raramente.","en":"Is it acceptable to call `useState` inside an `if` block, as long as the condition rarely changes?"},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: è falso: le Rules of Hooks impongono di chiamare gli hook sempre al top level del componente, mai dentro `if`, loop o funzioni annidate, perché React li identifica in base all\u0027ordine di chiamata a ogni render; una chiamata condizionale altera quell\u0027ordine e rompe l\u0027associazione tra hook e stato.\nLe altre opzioni: pensare che basti una condizione \u0027stabile\u0027 è l\u0027errore tipico: anche così l\u0027ordine delle chiamate può cambiare tra i render.","en":"In summary: it\u0027s false: the Rules of Hooks require hooks to always be called at the top level of the component, never inside `if`, loops, or nested functions, because React identifies them by their call order on every render; a conditional call alters that order and breaks the association between hook and state.\nThe other options: thinking that a \u0027stable\u0027 condition is enough is the typical mistake: even so, the order of the calls can change between renders."}},{"type":"mcq","prompt":{"it":"Perché in una lista è sconsigliato usare l\u0027indice dell\u0027array come `key`?","en":"Why is it discouraged to use the array index as the `key` in a list?"},"code":"","options":[{"it":"Perché le `key` devono essere numeri e l\u0027indice è comunque un numero","en":"Because `key`s must be numbers and the index is a number anyway"},{"it":"Perché se la lista viene riordinata, filtrata o riceve inserimenti/rimozioni, gli indici non identificano stabilmente gli elementi e React può riusare i nodi/lo stato sbagliati, causando UI incoerente","en":"Because if the list is reordered, filtered, or has insertions/removals, the indices do not stably identify the elements and React may reuse the wrong nodes/state, causing an inconsistent UI"},{"it":"Perché l\u0027indice come `key` provoca sempre un errore a runtime","en":"Because using the index as a `key` always causes a runtime error"},{"it":"Perché le `key` vengono mostrate nel DOM e l\u0027indice sarebbe visibile all\u0027utente","en":"Because `key`s are shown in the DOM and the index would be visible to the user"}],"correct":1,"explanation":{"it":"In sintesi: le `key` servono alla reconciliation per stabilire l\u0027identità stabile di ogni elemento tra un render e l\u0027altro; usare l\u0027indice va bene solo per liste statiche, ma se si riordina, inserisce o rimuove, l\u0027associazione indice→elemento cambia e React può riciclare il componente o lo stato sbagliato (es. input con valori scambiati). Meglio un id stabile.\nLe altre opzioni: le `key` non devono essere numer
