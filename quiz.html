instrument be non-complex: a `leveraged certificate` is complex, so the exemption does not apply even if the transaction is at the client\u0027s initiative. As there is neither advice nor management, suitability is not triggered, but appropriateness is, which checks knowledge and experience in relation to the product; where the outcome is negative or the information is not provided, the intermediary must warn the client.\nThe other options: it is not correct to do nothing on account of the client\u0027s initiative, the full suitability assessment is not needed (advice and management are absent), and `KYC` `AML` is a separate obligation that does not replace the `MiFID` assessment."}},{"type":"mcq","prompt":{"it":"[Stretch] Un\u0027app fintech vuole trattare i dati di transazione dei clienti per finalità di prevenzione frodi. Qual è, di norma, la base giuridica più solida e la considerazione corretta?","en":"[Stretch] A fintech app wants to process customers\u0027 transaction data for fraud prevention purposes. What is, as a rule, the most solid legal basis and the correct consideration?"},"code":"","options":[{"it":"Il consenso, perché è sempre la base giuridica preferibile e più forte in ogni scenario","en":"Consent, because it is always the preferable and strongest legal basis in every scenario"},{"it":"Il legittimo interesse o l\u0027obbligo legale a seconda del contesto, con la considerazione che un consenso revocabile sarebbe una base fragile per un\u0027attività antifrode che deve poter proseguire","en":"Legitimate interest or legal obligation depending on the context, bearing in mind that revocable consent would be a fragile basis for an anti-fraud activity that must be able to continue"},{"it":"I dati di frode non sono dati personali, quindi il GDPR non si applica","en":"Fraud data is not personal data, so the GDPR does not apply"},{"it":"Basta l\u0027anonimizzazione dei dati per non applicare alcuna base giuridica","en":"Anonymising the data is enough to avoid applying any legal basis"}],"correct":1,"explanation":{"it":"In sintesi: per la prevenzione delle frodi la base giuridica piu\u0027 solida e\u0027 di norma il legittimo interesse del titolare o l\u0027obbligo legale, a seconda del contesto. Il consenso sarebbe fragile perche\u0027 revocabile in qualsiasi momento e libero: permetterebbe al potenziale frodatore di disattivare i controlli, vanificando la finalita\u0027; il legittimo interesse per l\u0027antifrode e\u0027 esplicitamente richiamato dal considerando 47 `GDPR`, l\u0027obbligo legale deriva ad esempio dall\u0027antiriciclaggio.\nLe altre opzioni: il consenso non e\u0027 sempre la base preferibile, i dati di transazione riferibili a una persona sono dati personali e il `GDPR` si applica, e l\u0027anonimizzazione escluderebbe il dato dal GDPR ma non e\u0027 praticabile se occorre agire sul singolo cliente.","en":"In summary: for fraud prevention the most solid legal basis is, as a rule, the controller\u0027s legitimate interest or a legal obligation, depending on the context. Consent would be fragile because it is freely given and revocable at any time: it would let a potential fraudster switch off the controls, defeating the purpose; the legitimate interest for anti-fraud activity is expressly referred to in recital 47 of the `GDPR`, and the legal obligation stems, for example, from anti-money-laundering law.\nThe other options: consent is not always the preferable basis, transaction data referable to a person is personal data and the `GDPR` applies, and anonymisation would take the data outside the GDPR but is not workable where action on the individual client is required."}},{"type":"truefalse","prompt":{"it":"[Stretch] Ai fini della valutazione di adeguatezza MiFID II, se il cliente si rifiuta di fornire le informazioni necessarie su conoscenza, situazione finanziaria e obiettivi, l\u0027intermediario può comunque prestare il servizio di consulenza raccomandando il prodotto che ritiene migliore.","en":"[Stretch] For the purposes of the MiFID II suitability assessment, if the client refuses to provide the necessary information on knowledge, financial situation and objectives, the intermediary may still provide the advice service by recommending the product it considers best."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: e\u0027 falso. Nella prestazione di consulenza o gestione di portafogli, se il cliente rifiuta di fornire le informazioni necessarie su conoscenza, situazione finanziaria e obiettivi, l\u0027intermediario non puo\u0027 formulare raccomandazioni personalizzate ne\u0027 prestare il servizio, perche\u0027 non e\u0027 in grado di verificare l\u0027adeguatezza; la `MiFID II` vieta espressamente di aggirare l\u0027assenza di informazioni.\nLe altre opzioni: l\u0027errore tipico e\u0027 confondere questo caso con l\u0027appropriatezza (altri servizi), dove il rifiuto comporta un\u0027avvertenza ma non necessariamente il blocco dell\u0027operazione.","en":"In summary: it is false. When providing advice or portfolio management, if the client refuses to provide the necessary information on knowledge, financial situation and objectives, the intermediary may not make personalised recommendations or provide the service, because it is unable to assess suitability; `MiFID II` expressly prohibits circumventing the absence of information.\nThe other options: the typical mistake is to confuse this case with appropriateness (other services), where a refusal leads to a warning but not necessarily to blocking the transaction."}},{"type":"mcq","prompt":{"it":"[Stretch] Nella product governance MiFID II, un distributore individua che una parte della clientela a cui sta collocando un prodotto ricade nel target market negativo definito dal produttore. Qual è la condotta corretta?","en":"[Stretch] In MiFID II product governance, a distributor identifies that part of the client base to which it is placing a product falls within the negative target market defined by the manufacturer. What is the correct course of action?"},"code":"","options":[{"it":"Procedere comunque, perché il target market negativo è solo indicativo e non vincolante","en":"Proceed anyway, because the negative target market is only indicative and not binding"},{"it":"Vendere il prodotto solo in casi giustificati e documentati che si discostano dal target market, mantenendo la regola generale di non collocarlo alla clientela del target negativo","en":"Sell the product only in justified and documented cases that deviate from the target market, keeping the general rule of not placing it with clients in the negative target market"},{"it":"Ignorare il target market del produttore e definirne uno proprio completamente autonomo","en":"Ignore the manufacturer\u0027s target market and define an entirely independent one"},{"it":"Sospendere ogni attività di distribuzione di qualsiasi prodotto fino a nuova comunicazione dell\u0027autorità","en":"Suspend all distribution of every product until further notice from the authority"}],"correct":1,"explanation":{"it":"In sintesi: la condotta corretta e\u0027 vendere il prodotto alla clientela del target market negativo solo in casi eccezionali, giustificati e documentati che si discostano dal target, mantenendo la regola generale di non collocarlo a quella clientela. Le linee guida `ESMA` ammettono deroghe solo se coerenti con la strategia complessiva, ad esempio a fini di diversificazione in un portafoglio gestito o consulenziato, e adeguatamente documentate.\nLe altre opzioni: il target negativo non e\u0027 meramente indicativo, il distributore deve affinare ma non ignorare quello del produttore e non e\u0027 prevista alcuna sospensione di ogni attivita\u0027 di distribuzione.","en":"In summary: the correct course of action is to sell the product to clients in the negative target market only in exceptional, justified and documented cases that deviate from the target, keeping the general rule of not placing it with those clients. The `ESMA` guidelines allow derogations only where they are consistent with the overall strategy, for example for diversification purposes within a managed or advised portfolio, and are duly documented.\nThe other options: the negative target market is not merely indicative, the distributor must refine but not ignore the manufacturer\u0027s target market, and no suspension of all distribution activity is envisaged."}},{"type":"mcq","prompt":{"it":"[Stretch] Un cliente esercita il diritto di accesso (art. 15 GDPR) chiedendo copia dei propri dati a una banca. La banca detiene anche una segnalazione di operazione sospetta (SOS) relativa al cliente. Come deve comportarsi?","en":"[Stretch] A client exercises the right of access (Article 15 GDPR), asking a bank for a copy of their data. The bank also holds a suspicious transaction report (STR) relating to the client. How must it act?"},"code":"","options":[{"it":"Fornire tutti i dati, inclusa la SOS, per rispettare integralmente il diritto di accesso","en":"Provide all the data, including the STR, in order to fully comply with the right of access"},{"it":"Fornire i dati personali oggetto del diritto di accesso, ma non è tenuta a rivelare l\u0027esistenza e il contenuto della SOS, in virtù del divieto di tipping-off e delle limitazioni previste in materia antiriciclaggio","en":"Provide the personal data covered by the right of access, but it is not required to disclose the existence and content of the STR, by virtue of the tipping-off prohibition and the limitations laid down in anti-money-laundering law"},{"it":"Negare in blocco il diritto di accesso perché esiste una SOS","en":"Refuse the right of access outright because an STR exists"},{"it":"Fornire la SOS solo se il cliente firma una liberatoria","en":"Provide the STR only if the client signs a waiver"}],"correct":1,"explanation":{"it":"In sintesi: la banca deve fornire i dati personali oggetto del diritto di accesso (art. 15 `GDPR`), ma non e\u0027 tenuta a rivelare l\u0027esistenza e il contenuto della `SOS`, in virtu\u0027 del divieto di `tipping-off` e delle limitazioni antiriciclaggio; lo stesso GDPR ammette limitazioni ai diritti dell\u0027interessato quando necessario per prevenire e indagare reati (art. 23, e in Italia la disciplina `AML`).\nLe altre opzioni: non deve fornire la SOS per completezza, non deve negare in blocco l\u0027intero accesso e nessuna liberatoria del cliente potrebbe legittimare la divulgazione della segnalazione.","en":"In summary: the bank must provide the personal data covered by the right of access (Article 15 `GDPR`), but it is not required to disclose the existence and content of the `STR`, by virtue of the `tipping-off` prohibition and the anti-money-laundering limitations; the GDPR itself allows restrictions on the data subject\u0027s rights where necessary to prevent and investigate offences (Article 23, and in Italy the `AML` legislation).\nThe other options: it must not provide the STR for the sake of completeness, it must not refuse the entire access outright, and no waiver from the client could legitimise disclosing the report."}}]},{"id":"collections","title":"Collections \u0026 Generics","questions":[{"type":"mcq","prompt":{"it":"Devi memorizzare una lista su cui esegui frequenti accessi casuali per indice (get(i)) e poche inserzioni/rimozioni in mezzo. Quale implementazione scegli e perché?","en":"You need to store a list on which you frequently perform random access by index (get(i)) and few insertions/removals in the middle. Which implementation do you choose and why?"},"code":"","options":[{"it":"ArrayList, perché get(int) è O(1) grazie all\u0027array interno","en":"ArrayList, because get(int) is O(1) thanks to the backing array"},{"it":"LinkedList, perché get(int) è O(1) grazie ai nodi collegati","en":"LinkedList, because get(int) is O(1) thanks to the linked nodes"},{"it":"ArrayList, perché get(int) è O(log n) grazie alla ricerca binaria","en":"ArrayList, because get(int) is O(log n) thanks to binary search"},{"it":"LinkedList, perché evita il resize dell\u0027array ed è quindi più veloce in lettura","en":"LinkedList, because it avoids the array resize and is therefore faster to read"}],"correct":0,"explanation":{"it":"In sintesi: `ArrayList` è basata su un array dinamico, quindi `get(int)` è accesso diretto per offset in O(1); `LinkedList` deve scorrere i nodi, quindi `get(int)` è O(n). Per un pattern read-heavy con accesso per indice `ArrayList` è la scelta corretta.\nLe altre opzioni: `LinkedList.get` è O(n), non O(1); `ArrayList` non usa ricerca binaria ma accesso diretto; il resize non impatta le letture ed è ammortizzato.","en":"In summary: `ArrayList` is backed by a dynamic array, so `get(int)` is direct access by offset in O(1); `LinkedList` has to walk the nodes, so `get(int)` is O(n). For a read-heavy pattern with access by index, `ArrayList` is the right choice.\nThe other options: `LinkedList.get` is O(n), not O(1); `ArrayList` doesn\u0027t use binary search but direct access; the resize doesn\u0027t affect reads and is amortized."}},{"type":"mcq","prompt":{"it":"Qual è la complessità nel caso medio di LinkedList.get(int index) e di ArrayList.add(E) (append in coda)?","en":"What is the average-case complexity of LinkedList.get(int index) and of ArrayList.add(E) (append at the tail)?"},"code":"","options":[{"it":"LinkedList.get O(n), ArrayList.add O(1) ammortizzato","en":"LinkedList.get O(n), ArrayList.add O(1) amortized"},{"it":"LinkedList.get O(1), ArrayList.add O(n)","en":"LinkedList.get O(1), ArrayList.add O(n)"},{"it":"LinkedList.get O(log n), ArrayList.add O(log n)","en":"LinkedList.get O(log n), ArrayList.add O(log n)"},{"it":"LinkedList.get O(n), ArrayList.add O(n) sempre","en":"LinkedList.get O(n), ArrayList.add O(n) always"}],"correct":0,"explanation":{"it":"In sintesi: `LinkedList.get(int)` deve percorrere la catena di nodi fino all\u0027indice, quindi O(n); `ArrayList.add` in coda scrive nella prima cella libera in O(1) e solo saltuariamente paga il resize, restando O(1) ammortizzato.\nLe altre opzioni: `LinkedList.get` non è O(1) né O(log n) perché non c\u0027è accesso diretto; `ArrayList.add` in coda non è O(n) sempre, lo diventa solo al resize.","en":"In summary: `LinkedList.get(int)` has to traverse the chain of nodes up to the index, so O(n); `ArrayList.add` at the tail writes into the first free slot in O(1) and only occasionally pays for a resize, staying O(1) amortized.\nThe other options: `LinkedList.get` is neither O(1) nor O(log n) because there is no direct access; `ArrayList.add` at the tail isn\u0027t always O(n), it only becomes so on a resize."}},{"type":"code","prompt":{"it":"Cosa stampa questo snippet?","en":"What does this snippet print?"},"code":"Set\u003cString\u003e set = new LinkedHashSet\u003c\u003e();\nset.add(\"C\");\nset.add(\"A\");\nset.add(\"B\");\nset.add(\"A\");\nSystem.out.println(set);","options":[{"it":"[C, A, B]","en":"[C, A, B]"},{"it":"[A, B, C]","en":"[A, B, C]"},{"it":"[A, A, B, C]","en":"[A, A, B, C]"},{"it":"[C, A, B, A]","en":"[C, A, B, A]"}],"correct":0,"explanation":{"it":"In sintesi: `LinkedHashSet` mantiene l\u0027ordine di inserzione e, come ogni `Set`, rifiuta i duplicati: il secondo \"A\" viene ignorato, quindi l\u0027output è [C, A, B]. È l\u0027implementazione da usare quando serve unicità ma anche ordine prevedibile.\nLe altre opzioni: [A, B, C] sarebbe un `TreeSet` (ordine naturale); il duplicato \"A\" non viene mai memorizzato due volte; l\u0027ordine non viene alterato rispetto all\u0027inserzione.","en":"In summary: `LinkedHashSet` preserves insertion order and, like every `Set`, rejects duplicates: the second \"A\" is ignored, so the output is [C, A, B]. It\u0027s the implementation to use when you need uniqueness but also a predictable order.\nThe other options: [A, B, C] would be a `TreeSet` (natural order); the duplicate \"A\" is never stored twice; the order isn\u0027t altered relative to insertion."}},{"type":"mcq","prompt":{"it":"Quale implementazione di Set garantisce che l\u0027iterazione avvenga secondo l\u0027ordinamento naturale (o di un Comparator) degli elementi?","en":"Which Set implementation guarantees that iteration happens according to the natural ordering (or a Comparator\u0027s) of the elements?"},"code":"","options":[{"it":"TreeSet","en":"TreeSet"},{"it":"HashSet","en":"HashSet"},{"it":"LinkedHashSet","en":"LinkedHashSet"},{"it":"CopyOnWriteArraySet","en":"CopyOnWriteArraySet"}],"correct":0,"explanation":{"it":"In sintesi: `TreeSet` è basato su un red-black tree e mantiene gli elementi ordinati secondo l\u0027ordinamento naturale (`Comparable`) o un `Comparator` fornito; l\u0027iterazione è quindi sorted, al costo di O(log n) per le operazioni base.\nLe altre opzioni: `HashSet` non dà alcuna garanzia d\u0027ordine; `LinkedHashSet` mantiene l\u0027ordine di inserzione, non quello naturale; `CopyOnWriteArraySet` conserva l\u0027ordine di inserzione.","en":"In summary: `TreeSet` is backed by a red-black tree and keeps the elements sorted according to their natural ordering (`Comparable`) or a supplied `Comparator`; iteration is therefore sorted, at a cost of O(log n) for the basic operations.\nThe other options: `HashSet` gives no ordering guarantee; `LinkedHashSet` preserves insertion order, not natural order; `CopyOnWriteArraySet` preserves insertion order."}},{"type":"mcq","prompt":{"it":"In HashMap (Java 8+), come viene determinato il bucket in cui finisce una chiave?","en":"In HashMap (Java 8+), how is the bucket a key ends up in determined?"},"code":"","options":[{"it":"Si applica uno spreading all\u0027hashCode (h ^ (h \u003e\u003e\u003e 16)) e poi si calcola (n-1) \u0026 hash, dove n è la capacità (potenza di 2)","en":"A spreading is applied to the hashCode (h ^ (h \u003e\u003e\u003e 16)) and then (n-1) \u0026 hash is computed, where n is the capacity (a power of 2)"},{"it":"Si usa direttamente hashCode() % dimensione, senza alcun rimescolamento","en":"hashCode() % size is used directly, without any shuffling"},{"it":"Si usa l\u0027identityHashCode dell\u0027oggetto modulo la capacità","en":"The object\u0027s identityHashCode modulo the capacity is used"},{"it":"Si ordina la chiave con compareTo() e si assegna il bucket per posizione","en":"The key is sorted with compareTo() and the bucket is assigned by position"}],"correct":0,"explanation":{"it":"In sintesi: `HashMap` prende l\u0027`hashCode` della chiave, applica uno spreading (h ^ (h \u003e\u003e\u003e 16)) per mescolare i bit alti sui bassi, e poi indicizza con (n-1) \u0026 hash sfruttando il fatto che la capacità è una potenza di 2. Questo riduce le collisioni quando gli hashCode differiscono solo nei bit alti.\nLe altre opzioni: non usa un modulo sull\u0027hashCode grezzo; non usa `identityHashCode` (userebbe l\u0027`hashCode()` sovrascritto); `compareTo` non entra nell\u0027indicizzazione di un `HashMap`.","en":"In summary: `HashMap` takes the key\u0027s `hashCode`, applies a spreading (h ^ (h \u003e\u003e\u003e 16)) to mix the high bits down into the low ones, and then indexes with (n-1) \u0026 hash, exploiting the fact that the capacity is a power of 2. This reduces collisions when hashCodes differ only in the high bits.\nThe other options: it doesn\u0027t use a modulo on the raw hashCode; it doesn\u0027t use `identityHashCode` (it would use the overridden `hashCode()`); `compareTo` plays no part in a `HashMap`\u0027s indexing."}},{"type":"mcq","prompt":{"it":"Qual è il load factor di default di HashMap e cosa comporta?","en":"What is HashMap\u0027s default load factor and what does it entail?"},"code":"","options":[{"it":"0.75: quando il numero di entry supera capacità * 0.75 la tabella viene raddoppiata (resize/rehash)","en":"0.75: when the number of entries exceeds capacity * 0.75 the table is doubled (resize/rehash)"},{"it":"1.0: il resize avviene solo quando tutti i bucket sono pieni","en":"1.0: the resize happens only when all buckets are full"},{"it":"0.5: la tabella viene raddoppiata a metà riempimento per massimizzare la velocità","en":"0.5: the table is doubled at half full to maximize speed"},{"it":"0.75: è la percentuale di bucket che vengono convertiti in alberi","en":"0.75: it\u0027s the percentage of buckets that get converted into trees"}],"correct":0,"explanation":{"it":"In sintesi: il load factor di default è 0.75, un compromesso tra spazio e tempo: quando size supera capacità * 0.75 (il threshold) `HashMap` raddoppia la tabella e riesegue il rehash delle entry, mantenendo basso il numero di collisioni per bucket.\nLe altre opzioni: 1.0 aumenterebbe troppo le collisioni; 0.5 sprecherebbe memoria e non è il default; il load factor non ha nulla a che vedere con la treeification dei bucket.","en":"In summary: the default load factor is 0.75, a trade-off between space and time: when size exceeds capacity * 0.75 (the threshold), `HashMap` doubles the table and rehashes the entries, keeping the number of collisions per bucket low.\nThe other options: 1.0 would increase collisions too much; 0.5 would waste memory and isn\u0027t the default; the load factor has nothing to do with bucket treeification."}},{"type":"truefalse","prompt":{"it":"In Java 8+, HashMap converte la lista concatenata di un bucket in un albero rosso-nero quando le entry nel bucket raggiungono TREEIFY_THRESHOLD (8), ma solo se la capacità della tabella è almeno 64; altrimenti effettua un resize.","en":"In Java 8+, HashMap converts a bucket\u0027s linked list into a red-black tree when the entries in the bucket reach TREEIFY_THRESHOLD (8), but only if the table capacity is at least 64; otherwise it performs a resize."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero. La treeification scatta a 8 elementi nello stesso bucket, ma con la condizione aggiuntiva MIN_TREEIFY_CAPACITY = 64; sotto quella capacità `HashMap` preferisce fare un resize invece di alberare, perché con poche celle ridistribuire risolve meglio le collisioni. La conversione porta il caso peggiore del bucket da O(n) a O(log n).\nLe altre opzioni: chi risponde Falso di solito ricorda solo la soglia 8 dimenticando il vincolo di capacità 64, o crede che la conversione sia immediata e incondizionata.","en":"In summary: it\u0027s true. Treeification kicks in at 8 elements in the same bucket, but with the additional condition MIN_TREEIFY_CAPACITY = 64; below that capacity `HashMap` prefers to resize rather than treeify, because with few slots redistributing resolves collisions better. The conversion brings the bucket\u0027s worst case down from O(n) to O(log n).\nThe other options: people who answer False usually remember only the threshold of 8 and forget the capacity-64 constraint, or believe the conversion is immediate and unconditional."}},{"type":"code","prompt":{"it":"Cosa succede eseguendo questo codice?","en":"What happens when this code runs?"},"code":"List\u003cInteger\u003e list = new ArrayList\u003c\u003e(List.of(1, 2, 3, 4));\nfor (Integer x : list) {\n    if (x % 2 == 0) {\n        list.remove(x);\n    }\n}","options":[{"it":"Lancia ConcurrentModificationException perché si modifica la lista durante l\u0027iterazione con for-each","en":"It throws ConcurrentModificationException because the list is modified during iteration with for-each"},{"it":"Rimuove i numeri pari e la lista diventa [1, 3] senza errori","en":"It removes the even numbers and the list becomes [1, 3] without errors"},{"it":"Errore di compilazione: remove(Integer) non esiste","en":"Compilation error: remove(Integer) doesn\u0027t exist"},{"it":"Entra in loop infinito","en":"It enters an infinite loop"}],"correct":0,"explanation":{"it":"In sintesi: il for-each usa l\u0027`Iterator` dell\u0027`ArrayList`, che è fail-fast: confronta `modCount` con `expectedModCount` e, vedendo che `list.remove` ha modificato la struttura senza passare dall\u0027iteratore, lancia `ConcurrentModificationException`. La via corretta è `iterator.remove()` oppure `removeIf`.\nLe altre opzioni: non produce [1, 3] perché fallisce prima; `remove(Object)` esiste e compila (qui rimuove per valore, non per indice); non è un loop infinito ma un\u0027eccezione.","en":"In summary: the for-each uses the `ArrayList`\u0027s `Iterator`, which is fail-fast: it compares `modCount` with `expectedModCount` and, seeing that `list.remove` modified the structure without going through the iterator, it throws `ConcurrentModificationException`. The correct way is `iterator.remove()` or `removeIf`.\nThe other options: it doesn\u0027t produce [1, 3] because it fails first; `remove(Object)` exists and compiles (here it removes by value, not by index); it\u0027s not an infinite loop but an exception."}},{"type":"mcq","prompt":{"it":"Quale collezione permette di iterare mentre viene modificata (anche da un altro thread) senza lanciare ConcurrentModificationException, grazie a un iteratore weakly consistent o su snapshot?","en":"Which collection lets you iterate while it is being modified (even by another thread) without throwing ConcurrentModificationException, thanks to a weakly consistent or snapshot iterator?"},"code":"","options":[{"it":"ConcurrentHashMap e CopyOnWriteArrayList","en":"ConcurrentHashMap and CopyOnWriteArrayList"},{"it":"HashMap e ArrayList","en":"HashMap and ArrayList"},{"it":"Collections.synchronizedList(new ArrayList\u003c\u003e())","en":"Collections.synchronizedList(new ArrayList\u003c\u003e())"},{"it":"TreeMap avvolto in un blocco synchronized","en":"TreeMap wrapped in a synchronized block"}],"correct":0,"explanation":{"it":"In sintesi: le collezioni fail-safe di java.util.concurrent, come `ConcurrentHashMap` (iteratore weakly consistent) e `CopyOnWriteArrayList` (iteratore su snapshot), non lanciano `ConcurrentModificationException` perché non si basano su `modCount`. Il prezzo è che l\u0027iteratore può non riflettere le modifiche più recenti.\nLe altre opzioni: `HashMap`/`ArrayList` sono fail-fast; `synchronizedList` protegge dalle race ma il suo iteratore resta fail-fast e va comunque sincronizzato a mano; un `TreeMap` wrappato in synchronized ha lo stesso iteratore fail-fast.","en":"In summary: the fail-safe collections in java.util.concurrent, such as `ConcurrentHashMap` (weakly consistent iterator) and `CopyOnWriteArrayList` (snapshot iterator), don\u0027t throw `ConcurrentModificationException` because they don\u0027t rely on `modCount`. The price is that the iterator may not reflect the most recent modifications.\nThe other options: `HashMap`/`ArrayList` are fail-fast; `synchronizedList` protects against races but its iterator stays fail-fast and must still be synchronized by hand; a `TreeMap` wrapped in synchronized has the same fail-fast iterator."}},{"type":"mcq","prompt":{"it":"Qual è la differenza corretta tra Comparable e Comparator?","en":"What is the correct difference between Comparable and Comparator?"},"code":"","options":[{"it":"Comparable definisce l\u0027ordinamento naturale nella classe stessa (compareTo, un solo criterio); Comparator è esterno e permette di definire più criteri di ordinamento (compare)","en":"Comparable defines the natural ordering within the class itself (compareTo, a single criterion); Comparator is external and lets you define multiple ordering criteria (compare)"},{"it":"Comparable è esterno alla classe, Comparator è implementato dalla classe stessa","en":"Comparable is external to the class, Comparator is implemented by the class itself"},{"it":"Sono sinonimi: entrambi dichiarano compareTo()","en":"They\u0027re synonyms: both declare compareTo()"},{"it":"Comparable serve per le Map, Comparator solo per le List","en":"Comparable is for Maps, Comparator only for Lists"}],"correct":0,"explanation":{"it":"In sintesi: `Comparable` si implementa nella classe dell\u0027oggetto e definisce l\u0027ordinamento naturale con `compareTo` (un unico criterio); `Comparator` è una strategia esterna con `compare`, che consente di definire ordinamenti alternativi e componibili senza toccare la classe.\nLe altre opzioni: i ruoli interno/esterno sono invertiti; non sono sinonimi (`Comparator` usa `compare`, non `compareTo`); la distinzione non ha a che fare con Map vs List.","en":"In summary: `Comparable` is implemented in the object\u0027s own class and defines the natural ordering with `compareTo` (a single criterion); `Comparator` is an external strategy with `compare`, which lets you define alternative, composable orderings without touching the class.\nThe other options: the internal/external roles are swapped; they aren\u0027t synonyms (`Comparator` uses `compare`, not `compareTo`); the distinction has nothing to do with Map vs List."}},{"type":"code","prompt":{"it":"Cosa stampa questo snippet?","en":"What does this snippet print?"},"code":"List\u003cString\u003e words = new ArrayList\u003c\u003e(List.of(\"bb\", \"a\", \"ccc\", \"dd\"));\nwords.sort(Comparator.comparingInt(String::length)\n                     .thenComparing(Comparator.naturalOrder()));\nSystem.out.println(words);","options":[{"it":"[a, bb, dd, ccc]","en":"[a, bb, dd, ccc]"},{"it":"[a, dd, bb, ccc]","en":"[a, dd, bb, ccc]"},{"it":"[ccc, bb, dd, a]","en":"[ccc, bb, dd, a]"},{"it":"[a, bb, ccc, dd]","en":"[a, bb, ccc, dd]"}],"correct":0,"explanation":{"it":"In sintesi: il `Comparator` ordina prima per lunghezza crescente e, a parità di lunghezza, per ordine naturale (alfabetico). Le lunghezze sono a=1, bb=2, dd=2, ccc=3; tra \"bb\" e \"dd\" (stessa lunghezza) vince l\u0027alfabetico \"bb\" prima di \"dd\", quindi [a, bb, dd, ccc].\nLe altre opzioni: [a, dd, bb, ccc] invertirebbe il tie-break alfabetico; [ccc, bb, dd, a] è l\u0027ordine per lunghezza decrescente; [a, bb, ccc, dd] ignora che \"ccc\" ha lunghezza 3.","en":"In summary: the `Comparator` sorts first by increasing length and, for equal lengths, by natural (alphabetical) order. The lengths are a=1, bb=2, dd=2, ccc=3; between \"bb\" and \"dd\" (same length) alphabetical order puts \"bb\" before \"dd\", so [a, bb, dd, ccc].\nThe other options: [a, dd, bb, ccc] would reverse the alphabetical tie-break; [ccc, bb, dd, a] is the order by decreasing length; [a, bb, ccc, dd] ignores that \"ccc\" has length 3."}},{"type":"mcq","prompt":{"it":"Cosa si intende per type erasure nei generics Java?","en":"What is meant by type erasure in Java generics?"},"code":"","options":[{"it":"I parametri di tipo esistono solo a compile-time: dopo la compilazione il tipo viene rimosso e sostituito con il bound (o Object), quindi a runtime List\u003cString\u003e e List\u003cInteger\u003e sono la stessa classe","en":"Type parameters exist only at compile time: after compilation the type is removed and replaced with the bound (or Object), so at runtime List\u003cString\u003e and List\u003cInteger\u003e are the same class"},{"it":"Il compilatore genera una classe distinta per ogni tipo concreto usato, come i template C++","en":"The compiler generates a distinct class for each concrete type used, like C++ templates"},{"it":"I generics vengono conservati nel bytecode e sono ispezionabili a runtime con getClass()","en":"Generics are kept in the bytecode and are inspectable at runtime with getClass()"},{"it":"È il meccanismo con cui la JVM cancella gli oggetti non più referenziati","en":"It\u0027s the mechanism by which the JVM erases objects that are no longer referenced"}],"correct":0,"explanation":{"it":"In sintesi: la type erasure significa che i parametri di tipo servono solo al controllo statico del compilatore e vengono cancellati nel bytecode, sostituiti dal loro bound (o `Object`); a runtime `List\u003cString\u003e` e `List\u003cInteger\u003e` condividono la stessa classe `List`. È una scelta per la compatibilità all\u0027indietro con il codice pre-generics.\nLe altre opzioni: Java non reifica i generics come i template C++; il tipo parametrico non è ispezionabile a runtime via `getClass()`; la cancellazione degli oggetti non referenziati è la garbage collection, non l\u0027erasure.","en":"In summary: type erasure means that type parameters serve only the compiler\u0027s static checking and are erased in the bytecode, replaced by their bound (or `Object`); at runtime `List\u003cString\u003e` and `List\u003cInteger\u003e` share the same `List` class. It\u0027s a choice made for backward compatibility with pre-generics code.\nThe other options: Java doesn\u0027t reify generics like C++ templates; the parametric type isn\u0027t inspectable at runtime via `getClass()`; erasing unreferenced objects is garbage collection, not erasure."}},{"type":"truefalse","prompt":{"it":"A causa della type erasure, in Java non è possibile scrivere new T() né usare l\u0027espressione obj instanceof List\u003cString\u003e.","en":"Because of type erasure, in Java you cannot write new T() nor use the expression obj instanceof List\u003cString\u003e."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero. Poiché il tipo T viene cancellato a runtime, il compilatore non conosce il costruttore da invocare per `new T()`, e `instanceof List\u003cString\u003e` è vietato perché a runtime esiste solo `List` (è ammesso solo `List\u003c?\u003e`). Sono conseguenze dirette dell\u0027erasure.\nLe altre opzioni: chi risponde Falso spesso confonde con linguaggi a generics reificati (come C#), dove queste operazioni sono lecite.","en":"In summary: it\u0027s true. Since the type T is erased at runtime, the compiler doesn\u0027t know which constructor to invoke for `new T()`, and `instanceof List\u003cString\u003e` is forbidden because at runtime only `List` exists (only `List\u003c?\u003e` is allowed). These are direct consequences of erasure.\nThe other options: people who answer False often confuse this with languages that have reified generics (like C#), where these operations are legal."}},{"type":"mcq","prompt":{"it":"Secondo la regola PECS, come dichiari un parametro da cui LEGGI elementi (producer) e uno su cui SCRIVI elementi (consumer)?","en":"According to the PECS rule, how do you declare a parameter you READ elements from (producer) and one you WRITE elements to (consumer)?"},"code":"","options":[{"it":"Producer: ? extends T (leggi come T); Consumer: ? super T (scrivi T)","en":"Producer: ? extends T (read as T); Consumer: ? super T (write T)"},{"it":"Producer: ? super T; Consumer: ? extends T","en":"Producer: ? super T; Consumer: ? extends T"},{"it":"Entrambi con ? extends T","en":"Both with ? extends T"},{"it":"Entrambi con ? super T","en":"Both with ? super T"}],"correct":0,"explanation":{"it":"In sintesi: PECS sta per Producer Extends, Consumer Super. Se una struttura produce/fornisce valori che leggi, usi `? extends T` e li leggi in sicurezza come T; se la consumi scrivendoci dentro, usi `? super T` e puoi aggiungere T (e sottotipi).\nLe altre opzioni: invertire extends e super rompe la type safety; usare solo extends impedisce la scrittura; usare solo super degrada la lettura al tipo `Object`.","en":"In summary: PECS stands for Producer Extends, Consumer Super. If a structure produces/supplies values you read, you use `? extends T` and read them safely as T; if you consume it by writing into it, you use `? super T` and can add T (and its subtypes).\nThe other options: swapping extends and super breaks type safety; using only extends prevents writing; using only super degrades reads to the `Object` type."}},{"type":"code","prompt":{"it":"Quale riga NON compila?","en":"Which line does NOT compile?"},"code":"List\u003c? extends Number\u003e nums = new ArrayList\u003cInteger\u003e(List.of(1, 2, 3));\nNumber n = nums.get(0);   // riga A\nnums.add(4);              // riga B","options":[{"it":"La riga B: su List\u003c? extends Number\u003e non si può fare add (tranne null), perché il tipo esatto è sconosciuto","en":"Line B: on List\u003c? extends Number\u003e you can\u0027t call add (except null), because the exact type is unknown"},{"it":"La riga A: non si può leggere da un wildcard extends","en":"Line A: you can\u0027t read from an extends wildcard"},{"it":"Compila tutto: l\u0027output è 1 e la lista diventa [1, 2, 3, 4]","en":"Everything compiles: the output is 1 and the list becomes [1, 2, 3, 4]"},{"it":"Entrambe le righe falliscono a compile-time","en":"Both lines fail at compile time"}],"correct":0,"explanation":{"it":"In sintesi: con `? extends Number` puoi leggere in sicurezza (ogni elemento è almeno un `Number`, riga A ok), ma non puoi aggiungere nulla di diverso da null, perché il compilatore non sa se la lista concreta sia di `Integer`, `Double` o altro: la riga B non compila. È il lato Producer Extends del PECS.\nLe altre opzioni: la lettura come `Number` è sempre lecita; non compila tutto perché `add` è vietata; non falliscono entrambe, solo la `add`.","en":"In summary: with `? extends Number` you can read safely (every element is at least a `Number`, line A ok), but you can\u0027t add anything other than null, because the compiler doesn\u0027t know whether the concrete list is of `Integer`, `Double` or something else: line B doesn\u0027t compile. This is the Producer Extends side of PECS.\nThe other options: reading as `Number` is always legal; not everything compiles because `add` is forbidden; they don\u0027t both fail, only the `add` does."}},{"type":"code","prompt":{"it":"Quale riga NON compila?","en":"Which line does NOT compile?"},"code":"List\u003c? super Integer\u003e list = new ArrayList\u003cNumber\u003e();\nlist.add(10);            // riga A\nlist.add(20);            // riga B\nInteger x = list.get(0); // riga C","options":[{"it":"La riga C: da List\u003c? super Integer\u003e si legge solo come Object, non come Integer","en":"Line C: from List\u003c? super Integer\u003e you can only read as Object, not as Integer"},{"it":"La riga A: non si può aggiungere a un wildcard super","en":"Line A: you can\u0027t add to a super wildcard"},{"it":"Compila tutto senza errori","en":"Everything compiles without errors"},{"it":"Le righe A e B non compilano","en":"Lines A and B don\u0027t compile"}],"correct":0,"explanation":{"it":"In sintesi: con `? super Integer` puoi aggiungere `Integer` (e suoi sottotipi) in sicurezza, quindi A e B compilano; ma in lettura il compilatore garantisce solo il supertipo comune `Object`, perciò assegnare direttamente a `Integer` (riga C) non compila senza cast. È il lato Consumer Super del PECS.\nLe altre opzioni: aggiungere `Integer` è esattamente ciò che super consente; non compila tutto perché la `get` tipizzata a `Integer` fallisce; A e B sono corrette.","en":"In summary: with `? super Integer` you can add `Integer` (and its subtypes) safely, so A and B compile; but on reading, the compiler guarantees only the common supertype `Object`, so assigning directly to `Integer` (line C) doesn\u0027t compile without a cast. This is the Consumer Super side of PECS.\nThe other options: adding `Integer` is exactly what super allows; not everything compiles because the `get` typed to `Integer` fails; A and B are correct."}},{"type":"mcq","prompt":{"it":"Vuoi scrivere un metodo generico max(List\u003cT\u003e) che funzioni solo con tipi ordinabili tra loro. Quale firma è corretta?","en":"You want to write a generic method max(List\u003cT\u003e) that works only with types that are mutually orderable. Which signature is correct?"},"code":"","options":[{"it":"\u003cT extends Comparable\u003cT\u003e\u003e T max(List\u003cT\u003e list)","en":"\u003cT extends Comparable\u003cT\u003e\u003e T max(List\u003cT\u003e list)"},{"it":"\u003cT super Comparable\u003cT\u003e\u003e T max(List\u003cT\u003e list)","en":"\u003cT super Comparable\u003cT\u003e\u003e T max(List\u003cT\u003e list)"},{"it":"\u003cT extends Comparator\u003cT\u003e\u003e T max(List\u003cT\u003e list)","en":"\u003cT extends Comparator\u003cT\u003e\u003e T max(List\u003cT\u003e list)"},{"it":"\u003c? extends Comparable\u003cT\u003e\u003e T max(List\u003cT\u003e list)","en":"\u003c? extends Comparable\u003cT\u003e\u003e T max(List\u003cT\u003e list)"}],"correct":0,"explanation":{"it":"In sintesi: un bounded type parameter `\u003cT extends Comparable\u003cT\u003e\u003e` vincola T a essere confrontabile con sé stesso, così dentro il metodo puoi chiamare `compareTo`. È la firma canonica per algoritmi come max/min sull\u0027ordinamento naturale.\nLe altre opzioni: `super` non è ammesso sui type parameter (solo sui wildcard); `Comparator` è un oggetto esterno, non l\u0027interfaccia che l\u0027elemento deve implementare; un wildcard non può essere dichiarato come type parameter di un metodo.","en":"In summary: a bounded type parameter `\u003cT extends Comparable\u003cT\u003e\u003e` constrains T to be comparable with itself, so inside the method you can call `compareTo`. It\u0027s the canonical signature for algorithms like max/min based on natural ordering.\nThe other options: `super` isn\u0027t allowed on type parameters (only on wildcards); `Comparator` is an external object, not the interface the element must implement; a wildcard can\u0027t be declared as a method\u0027s type parameter."}},{"type":"code","prompt":{"it":"Cosa stampa questo snippet?","en":"What does this snippet print?"},"code":"List\u003cInteger\u003e list = new ArrayList\u003c\u003e(List.of(1, 2, 3, 4, 5));\nIterator\u003cInteger\u003e it = list.iterator();\nwhile (it.hasNext()) {\n    if (it.next() % 2 == 0) {\n        it.remove();\n    }\n}\nSystem.out.println(list);","options":[{"it":"[1, 3, 5]","en":"[1, 3, 5]"},{"it":"ConcurrentModificationException","en":"ConcurrentModificationException"},{"it":"[1, 2, 3, 4, 5]","en":"[1, 2, 3, 4, 5]"},{"it":"[2, 4]","en":"[2, 4]"}],"correct":0,"explanation":{"it":"In sintesi: rimuovere tramite `Iterator.remove()` è il modo corretto e sicuro di eliminare elementi durante l\u0027iterazione: aggiorna internamente `expectedModCount`, quindi niente `ConcurrentModificationException`, e restano i dispari [1, 3, 5].\nLe altre opzioni: non lancia CME proprio perché si usa `it.remove()` e non `list.remove()`; la lista non resta invariata; [2, 4] sarebbe se si tenessero i pari invece di rimuoverli.","en":"In summary: removing via `Iterator.remove()` is the correct and safe way to delete elements during iteration: it internally updates `expectedModCount`, so no `ConcurrentModificationException`, and the odd numbers [1, 3, 5] remain.\nThe other options: it doesn\u0027t throw CME precisely because `it.remove()` is used and not `list.remove()`; the list doesn\u0027t stay unchanged; [2, 4] would be the result if the even numbers were kept instead of removed."}},{"type":"mcq","prompt":{"it":"Quale struttura è oggi raccomandata per implementare uno stack LIFO in Java, al posto della classe legacy Stack?","en":"Which structure is recommended today for implementing a LIFO stack in Java, instead of the legacy Stack class?"},"code":"","options":[{"it":"Deque (es. ArrayDeque) con push/pop/peek","en":"Deque (e.g. ArrayDeque) with push/pop/peek"},{"it":"Vector, perché thread-safe","en":"Vector, because it\u0027s thread-safe"},{"it":"PriorityQueue, che restituisce sempre l\u0027ultimo inserito","en":"PriorityQueue, which always returns the last element inserted"},{"it":"LinkedHashSet, che mantiene l\u0027ordine di inserzione","en":"LinkedHashSet, which preserves insertion order"}],"correct":0,"explanation":{"it":"In sintesi: la documentazione stessa raccomanda `Deque` (tipicamente `ArrayDeque`) per stack e code: `push`/`pop`/`peek` danno semantica LIFO senza la sincronizzazione inutile e l\u0027eredità di `Vector` che affligge `java.util.Stack`. `ArrayDeque` è più veloce sia come stack sia come queue.\nLe altre opzioni: `Stack`/`Vector` sono legacy e sincronizzate senza motivo; `PriorityQueue` ordina per priorità, non LIFO; un `Set` non è una pila e scarta i duplicati.","en":"In summary: the documentation itself recommends `Deque` (typically `ArrayDeque`) for stacks and queues: `push`/`pop`/`peek` give LIFO semantics without the pointless synchronization and the `Vector` inheritance that plague `java.util.Stack`. `ArrayDeque` is faster both as a stack and as a queue.\nThe other options: `Stack`/`Vector` are legacy and needlessly synchronized; `PriorityQueue` orders by priority, not LIFO; a `Set` isn\u0027t a stack and discards duplicates."}},{"type":"mcq","prompt":{"it":"In java.util.Queue, qual è la differenza tra add/remove e offer/poll quando l\u0027operazione può fallire (coda piena o vuota)?","en":"In java.util.Queue, what is the difference between add/remove and offer/poll when the operation can fail (queue full or empty)?"},"code":"","options":[{"it":"add/remove lanciano un\u0027eccezione in caso di fallimento; offer/poll restituiscono un valore speciale (false o null)","en":"add/remove throw an exception on failure; offer/poll return a special value (false or null)"},{"it":"offer/poll lanciano eccezione; add/remove restituiscono null","en":"offer/poll throw an exception; add/remove return null"},{"it":"Sono identici: differiscono solo nel nome","en":"They\u0027re identical: they differ only in name"},{"it":"add/offer sono solo per le Deque, remove/poll solo per le PriorityQueue","en":"add/offer are only for Deques, remove/poll only for PriorityQueues"}],"correct":0,"explanation":{"it":"In sintesi: `Queue` offre due famiglie di metodi: quelli che lanciano eccezione al fallimento (`add` lancia se piena, `remove` lancia `NoSuchElementException` se vuota) e quelli che restituiscono un valore speciale (`offer` ritorna false, `poll` ritorna null). Si sceglie in base a come si vuole gestire l\u0027insuccesso.\nLe altre opzioni: sono `offer`/`poll` a non lanciare, non il contrario; non sono identici nel comportamento; entrambe le famiglie valgono per tutte le `Queue`, non per tipi specifici.","en":"In summary: `Queue` offers two families of methods: those that throw an exception on failure (`add` throws if full, `remove` throws `NoSuchElementException` if empty) and those that return a special value (`offer` returns false, `poll` returns null). You choose based on how you want to handle failure.\nThe other options: it\u0027s `offer`/`poll` that don\u0027t throw, not the other way around; they aren\u0027t identical in behavior; both families apply to every `Queue`, not to specific types."}},{"type":"code","prompt":{"it":"Cosa succede eseguendo questo codice?","en":"What happens when this code runs?"},"code":"List\u003cString\u003e list = List.of(\"a\", \"b\", \"c\");\nlist.add(\"d\");\nSystem.out.println(list);","options":[{"it":"Lancia UnsupportedOperationException: List.of restituisce una lista immutabile","en":"It throws UnsupportedOperationException: List.of returns an immutable list"},{"it":"Stampa [a, b, c, d]","en":"It prints [a, b, c, d]"},{"it":"Errore di compilazione","en":"Compilation error"},{"it":"Stampa [a, b, c] ignorando l\u0027add","en":"It prints [a, b, c] ignoring the add"}],"correct":0,"explanation":{"it":"In sintesi: `List.of(...)` crea una lista immutabile; qualsiasi operazione di modifica come `add` lancia `UnsupportedOperationException` a runtime. Se serve una lista modificabile occorre copiarla, ad esempio `new ArrayList\u003c\u003e(List.of(...))`.\nLe altre opzioni: non stampa la lista con \"d\" perché la modifica fallisce; compila perfettamente (l\u0027errore è a runtime, non a compile-time); l\u0027`add` non viene silenziosamente ignorata ma solleva l\u0027eccezione.","en":"In summary: `List.of(...)` creates an immutable list; any modifying operation such as `add` throws `UnsupportedOperationException` at runtime. If you need a modifiable list you have to copy it, for example `new ArrayList\u003c\u003e(List.of(...))`.\nThe other options: it doesn\u0027t print the list with \"d\" because the modification fails; it compiles fine (the error is at runtime, not compile time); the `add` isn\u0027t silently ignored but raises the exception."}},{"type":"mcq","prompt":{"it":"Qual è la differenza tra List.of(...) e Collections.unmodifiableList(originale)?","en":"What is the difference between List.of(...) and Collections.unmodifiableList(original)?"},"code":"","options":[{"it":"List.of crea una lista intrinsecamente immutabile; unmodifiableList crea solo una vista non modificabile su una lista sottostante che, se cambiata direttamente, si riflette sulla vista","en":"List.of creates an intrinsically immutable list; unmodifiableList creates only an unmodifiable view over an underlying list which, if changed directly, is reflected in the view"},{"it":"Sono equivalenti: entrambe creano una copia immutabile e indipendente","en":"They\u0027re equivalent: both create an immutable, independent copy"},{"it":"List.of accetta elementi null, unmodifiableList no","en":"List.of accepts null elements, unmodifiableList doesn\u0027t"},{"it":"unmodifiableList è immutabile, mentre List.of restituisce una vista mutabile","en":"unmodifiableList is immutable, whereas List.of returns a mutable view"}],"correct":0,"explanation":{"it":"In sintesi: `List.of` costruisce una collezione realmente immutabile e non ammette null; `Collections.unmodifiableList` è solo un wrapper di sola lettura: se qualcuno mantiene un riferimento alla lista originale e la modifica, i cambiamenti diventano visibili attraverso la vista. Sono due livelli di immutabilità diversi.\nLe altre opzioni: non sono equivalenti proprio per la questione vista vs copia; è `List.of` a rifiutare i null, non il contrario; `List.of` non è affatto una vista mutabile.","en":"In summary: `List.of` builds a genuinely immutable collection and doesn\u0027t allow null; `Collections.unmodifiableList` is only a read-only wrapper: if someone holds a reference to the original list and modifies it, the changes become visible through the view. They are two different levels of immutability.\nThe other options: they aren\u0027t equivalent, precisely because of the view-vs-copy issue; it\u0027s `List.of` that rejects nulls, not the other way around; `List.of` isn\u0027t a mutable view at all."}},{"type":"code","prompt":{"it":"Cosa stampa questo snippet?","en":"What does this snippet print?"},"code":"class Point {\n    int x, y;\n    Point(int x, int y) { this.x = x; this.y = y; }\n    @Override public boolean equals(Object o) {\n        if (!(o instanceof Point)) return false;\n        Point p = (Point) o;\n        return x == p.x \u0026\u0026 y == p.y;\n    }\n    // hashCode NON sovrascritto\n}\n\nSet\u003cPoint\u003e set = new HashSet\u003c\u003e();\nset.add(new Point(1, 2));\nSystem.out.println(set.contains(new Point(1, 2)));","options":[{"it":"false: senza override di hashCode i due Point finiscono (quasi sempre) in bucket diversi, quindi contains non li confronta con equals","en":"false: without overriding hashCode the two Points end up (almost always) in different buckets, so contains doesn\u0027t compare them with equals"},{"it":"true: basta equals per far funzionare HashSet","en":"true: equals alone is enough to make HashSet work"},{"it":"Errore di compilazione perché hashCode è astratto","en":"Compilation error because hashCode is abstract"},{"it":"true, ma solo perché i campi hanno gli stessi valori","en":"true, but only because the fields have the same values"}],"correct":0,"explanation":{"it":"In sintesi: `HashSet` usa prima `hashCode` per scegliere il bucket e solo dopo `equals` per confrontare gli elementi nello stesso bucket. Avendo sovrascritto solo `equals`, i due `Point` ereditano l\u0027`hashCode` di `Object` (basato sull\u0027identità), quindi cadono in bucket diversi e `contains` restituisce false. Il contratto equals/hashCode va rispettato insieme.\nLe altre opzioni: `equals` da solo non basta senza un `hashCode` coerente; `hashCode` non è astratto (`Object` ne fornisce uno); l\u0027uguaglianza dei campi non viene mai valutata perché non si arriva al confronto con equals.","en":"In summary: `HashSet` uses `hashCode` first to pick the bucket and only then `equals` to compare the elements in the same bucket. Having overridden only `equals`, the two `Point`s inherit `Object`\u0027s `hashCode` (identity-based), so they fall into different buckets and `contains` returns false. The equals/hashCode contract must be honored together.\nThe other options: `equals` alone isn\u0027t enough without a consistent `hashCode`; `hashCode` isn\u0027t abstract (`Object` provides one); field equality is never evaluated because the comparison with equals is never reached."}},{"type":"mcq","prompt":{"it":"Su cosa si basa TreeMap per stabilire se due chiavi sono \u0027la stessa chiave\u0027?","en":"What does TreeMap rely on to decide whether two keys are \u0027the same key\u0027?"},"code":"","options":[{"it":"Sul risultato di compareTo/compare uguale a 0, NON su equals/hashCode","en":"On the result of compareTo/compare being equal to 0, NOT on equals/hashCode"},{"it":"Su equals() e hashCode() come HashMap","en":"On equals() and hashCode() like HashMap"},{"it":"Sull\u0027identità dei riferimenti (==)","en":"On reference identity (==)"},{"it":"Su toString() delle chiavi","en":"On the keys\u0027 toString()"}],"correct":0,"explanation":{"it":"In sintesi: `TreeMap` è ordinata e si basa esclusivamente sul confronto: due chiavi sono considerate uguali quando `compareTo` (o il `Comparator`) restituisce 0, ignorando `equals` e `hashCode`. Per questo un ordinamento inconsistente con equals può far collassare chiavi che consideravi distinte.\nLe altre opzioni: `equals`/`hashCode` li usa `HashMap`, non `TreeMap`; non usa l\u0027identità dei riferimenti; `toString` non entra nel confronto.","en":"In summary: `TreeMap` is ordered and relies solely on comparison: two keys are considered equal when `compareTo` (or the `Comparator`) returns 0, ignoring `equals` and `hashCode`. That\u0027s why an ordering inconsistent with equals can collapse keys you thought were distinct.\nThe other options: `equals`/`hashCode` are used by `HashMap`, not `TreeMap`; it doesn\u0027t use reference identity; `toString` plays no part in the comparison."}},{"type":"code","prompt":{"it":"Cosa stampa questo snippet?","en":"What does this snippet print?"},"code":"Map\u003cString, Integer\u003e map = new HashMap\u003c\u003e();\nmap.put(null, 1);\nmap.put(null, 2);\nSystem.out.println(map.get(null) + \" \" + map.size());","options":[{"it":"2 1: HashMap ammette una chiave null e il secondo put la sovrascrive","en":"2 1: HashMap allows a null key and the second put overwrites it"},{"it":"NullPointerException al primo put","en":"NullPointerException on the first put"},{"it":"1 2: entrambe le entry vengono mantenute","en":"1 2: both entries are kept"},{"it":"null 0","en":"null 0"}],"correct":0,"explanation":{"it":"In sintesi: `HashMap` ammette una singola chiave null (indicizzata al bucket 0, senza chiamare `hashCode`) e valori null; il secondo `put(null, 2)` sovrascrive il valore, quindi `get(null)` è 2 e `size` è 1. `TreeMap` e `Hashtable` invece lancerebbero `NullPointerException`.\nLe altre opzioni: nessun NPE su `HashMap`; le due entry non coesistono perché la chiave è identica; `get(null)` non è null perché la mappa contiene quella chiave.","en":"In summary: `HashMap` allows a single null key (indexed to bucket 0, without calling `hashCode`) and null values; the second `put(null, 2)` overwrites the value, so `get(null)` is 2 and `size` is 1. `TreeMap` and `Hashtable`, by contrast, would throw `NullPointerException`.\nThe other options: no NPE on `HashMap`; the two entries don\u0027t coexist because the key is identical; `get(null)` isn\u0027t null because the map contains that key."}},{"type":"mcq","prompt":{"it":"Perché ArrayList.add(E) in coda è considerato O(1) ammortizzato e non O(1) puro?","en":"Why is ArrayList.add(E) at the tail considered O(1) amortized and not pure O(1)?"},"code":"","options":[{"it":"Perché quando l\u0027array interno è pieno serve un resize che copia tutti gli elementi (O(n)), ma accade di rado: distribuendo quel costo sulle molte add O(1) la media resta costante","en":"Because when the internal array is full a resize is needed that copies all the elements (O(n)), but this happens rarely: spreading that cost over the many O(1) adds keeps the average constant"},{"it":"Perché ogni add deve spostare tutti gli elementi a destra","en":"Because every add has to shift all the elements to the right"},{"it":"Perché add usa internamente una ricerca binaria","en":"Because add internally uses a binary search"},{"it":"Perché l\u0027array cresce di un solo elemento a ogni add","en":"Because the array grows by a single element on every add"}],"correct":0,"explanation":{"it":"In sintesi: la maggior parte delle `add` scrive semplicemente nella prima cella libera in O(1); solo quando la capacità è esaurita scatta un resize che copia l\u0027intero array in O(n). Poiché la capacità cresce geometricamente (circa x1.5), i resize sono rari e il costo ammortizzato per add resta O(1).\nLe altre opzioni: l\u0027append in coda non sposta gli elementi (lo shift avviene su `add(index, e)`); non c\u0027è alcuna ricerca binaria; l\u0027array non cresce di uno alla volta ma a blocchi.","en":"In summary: most `add`s simply write into the first free slot in O(1); only when the capacity is exhausted does a resize kick in that copies the entire array in O(n). Since the capacity grows geometrically (about x1.5), resizes are rare and the amortized cost per add stays O(1).\nThe other options: appending at the tail doesn\u0027t shift the elements (the shift happens with `add(index, e)`); there\u0027s no binary search; the array doesn\u0027t grow one at a time but in blocks."}},{"type":"code","prompt":{"it":"Cosa stampa questo snippet?","en":"What does this snippet print?"},"code":"Map\u003cList\u003cInteger\u003e, String\u003e map = new HashMap\u003c\u003e();\nList\u003cInteger\u003e key = new ArrayList\u003c\u003e(List.of(1, 2));\nmap.put(key, \"found\");\nkey.add(3);\nSystem.out.println(map.get(key));","options":[{"it":"null: modificare la chiave dopo l\u0027inserimento ne cambia l\u0027hashCode, così la lookup cerca nel bucket sbagliato","en":"null: modifying the key after insertion changes its hashCode, so the lookup searches in the wrong bucket"},{"it":"found: la mappa mantiene il riferimento all\u0027oggetto chiave","en":"found: the map keeps the reference to the key object"},{"it":"Errore di compilazione: List non può essere una chiave","en":"Compilation error: List can\u0027t be a key"},{"it":"Lancia ConcurrentModificationException","en":"It throws ConcurrentModificationException"}],"correct":0,"explanation":{"it":"In sintesi: la chiave è una `List` mutabile e il suo `hashCode` dipende dal contenuto; dopo `key.add(3)` l\u0027`hashCode` cambia, ma il nodo aveva memorizzato l\u0027hash vecchio, così `map.get` calcola un altro bucket (o comunque non trova un hash coincidente) e restituisce null. Morale: le chiavi di una `Map` devono essere immutabili, o almeno non mutate finché sono chiavi.\nLe altre opzioni: la mappa non ritrova l\u0027entry pur avendone il riferimento, proprio per via dell\u0027hash cambiato; una `List` è una chiave valida; non c\u0027è iterazione, quindi niente CME.","en":"In summary: the key is a mutable `List` and its `hashCode` depends on its content; after `key.add(3)` the `hashCode` changes, but the node had stored the old hash, so `map.get` computes a different bucket (or in any case finds no matching hash) and returns null. Moral: a `Map`\u0027s keys must be immutable, or at least not mutated while they are keys.\nThe other options: the map fails to find the entry even though it holds the reference, precisely because of the changed hash; a `List` is a valid key; there\u0027s no iteration, so no CME."}},{"type":"mcq","prompt":{"it":"Quale caratteristica di LinkedHashMap lo rende adatto a implementare una cache LRU?","en":"Which characteristic of LinkedHashMap makes it suitable for implementing an LRU cache?"},"code":"","options":[{"it":"Il costruttore con accessOrder=true riordina le entry per ordine di accesso e removeEldestEntry consente di rimuovere automaticamente la meno usata","en":"The constructor with accessOrder=true reorders the entries by access order, and removeEldestEntry lets you automatically remove the least recently used one"},{"it":"Ordina sempre le chiavi per hashCode crescente","en":"It always orders the keys by increasing hashCode"},{"it":"È thread-safe ed è quindi adatto a cache concorrenti","en":"It\u0027s thread-safe and is therefore suitable for concurrent caches"},{"it":"Rimuove automaticamente le entry scadute in base al tempo","en":"It automatically removes expired entries based on time"}],"correct":0,"explanation":{"it":"In sintesi: `LinkedHashMap` può essere costruito in access-order (accessOrder=true): ogni `get`/`put` sposta l\u0027entry in coda alla lista di collegamento, e sovrascrivendo `removeEldestEntry` si elimina la testa (la meno recentemente usata) al superamento della capacità. È il pattern classico per una LRU cache.\nLe altre opzioni: non ordina per `hashCode`; non è thread-safe; non ha scadenza temporale (quella è tipica di cache dedicate come Caffeine).","en":"In summary: `LinkedHashMap` can be built in access-order (accessOrder=true): every `get`/`put` moves the entry to the tail of the linked list, and by overriding `removeEldestEntry` you evict the head (the least recently used entry) when the capacity is exceeded. It\u0027s the classic pattern for an LRU cache.\nThe other options: it doesn\u0027t order by `hashCode`; it isn\u0027t thread-safe; it has no time-based expiration (that\u0027s typical of dedicated caches like Caffeine)."}},{"type":"code","prompt":{"it":"Cosa succede eseguendo questo codice?","en":"What happens when this code runs?"},"code":"List\u003cInteger\u003e list = Arrays.asList(1, 2, 3);\nlist.set(0, 99);   // riga A\nlist.add(4);       // riga B\nSystem.out.println(list);","options":[{"it":"La riga A funziona (set è permesso), la riga B lancia UnsupportedOperationException: Arrays.asList restituisce una lista a dimensione fissa","en":"Line A works (set is allowed), line B throws UnsupportedOperationException: Arrays.asList returns a fixed-size list"},{"it":"Entrambe funzionano: stampa [99, 2, 3, 4]","en":"Both work: it prints [99, 2, 3, 4]"},{"it":"La riga A lancia UnsupportedOperationException perché la lista è immutabile","en":"Line A throws UnsupportedOperationException because the list is immutable"},{"it":"Errore di compilazione su Arrays.asList","en":"Compilation error on Arrays.asList"}],"correct":0,"explanation":{"it":"In sintesi: `Arrays.asList` restituisce una lista a dimensione fissa che fa da vista sull\u0027array sottostante: `set(index, e)` è supportato e scrive through nell\u0027array (riga A ok), ma le operazioni strutturali come `add`/`remove` lanciano `UnsupportedOperationException` (riga B). Se serve una lista ridimensionabile occorre `new ArrayList\u003c\u003e(Arrays.asList(...))`.\nLe altre opzioni: non stampa [99, 2, 3, 4] perché l\u0027add fallisce; `set` non lancia perché è supportato (a differenza di `List.of`, che è totalmente immutabile); compila senza problemi, l\u0027eccezione è a runtime.","en":"In summary: `Arrays.asList` returns a fixed-size list that acts as a view over the underlying array: `set(index, e)` is supported and writes through into the array (line A ok), but structural operations like `add`/`remove` throw `UnsupportedOperationException` (line B). If you need a resizable list you have to use `new ArrayList\u003c\u003e(Arrays.asList(...))`.\nThe other options: it doesn\u0027t print [99, 2, 3, 4] because the add fails; `set` doesn\u0027t throw because it\u0027s supported (unlike `List.of`, which is fully immutable); it compiles fine, the exception is at runtime."}},{"type":"code","prompt":{"it":"Cosa succede alla riga X a runtime?","en":"What happens at line X at runtime?"},"code":"List\u003cString\u003e strings = new ArrayList\u003c\u003e();\nList raw = strings;          // raw type\nraw.add(42);                 // warning \"unchecked\"\nString s = strings.get(0);   // riga X","options":[{"it":"ClassCastException: un Integer è stato inserito tramite il raw type e viene recuperato con il cast implicito a String che il compilatore ha inserito su get","en":"ClassCastException: an Integer was inserted via the raw type and is retrieved with the implicit cast to String that the compiler inserted on get"},{"it":"Errore di compilazione su raw.add(42)","en":"Compilation error on raw.add(42)"},{"it":"Stampa/assegna 42 senza problemi","en":"It prints/assigns 42 without problems"},{"it":"NullPointerException","en":"NullPointerException"}],"correct":0,"explanation":{"it":"In sintesi: usare un raw type disabilita i controlli generici (heap pollution): `raw.add(42)` compila con solo un warning unchecked e inserisce un `Integer` in quella che dovrebbe essere una `List\u003cString\u003e`. Alla riga X il compilatore ha inserito un cast implicito a `String` sul valore restituito da `get`, che a runtime fallisce con `ClassCastException`.\nLe altre opzioni: `raw.add(42)` non è un errore ma un warning; non assegna 42 perché il cast a `String` esplode; non è un NPE ma un `ClassCastException`.","en":"In summary: using a raw type disables generic checks (heap pollution): `raw.add(42)` compiles with only an unchecked warning and inserts an `Integer` into what should be a `List\u003cString\u003e`. At line X the compiler has inserted an implicit cast to `String` on the value returned by `get`, which fails at runtime with `ClassCastException`.\nThe other options: `raw.add(42)` isn\u0027t an error but a warning; it doesn\u0027t assign 42 because the cast to `String` blows up; it\u0027s not an NPE but a `ClassCastException`."}},{"type":"mcq","prompt":{"it":"Qual è la differenza principale tra ConcurrentHashMap e Collections.synchronizedMap(new HashMap\u003c\u003e())?","en":"What is the main difference between ConcurrentHashMap and Collections.synchronizedMap(new HashMap\u003c\u003e())?"},"code":"","options":[{"it":"ConcurrentHashMap usa un locking a grana fine (per bin/nodo, con CAS) permettendo scritture concorrenti su parti diverse; synchronizedMap serializza tutte le operazioni su un unico lock","en":"ConcurrentHashMap uses fine-grained locking (per bin/node, with CAS), allowing concurrent writes to different parts; synchronizedMap serializes all operations on a single lock"},{"it":"synchronizedMap è più veloce perché non usa alcun lock","en":"synchronizedMap is faster because it uses no lock at all"},{"it":"ConcurrentHashMap non è thread-safe, serve solo per iterare","en":"ConcurrentHashMap isn\u0027t thread-safe, it\u0027s only for iterating"},{"it":"Sono identici: synchronizedMap restituisce internamente un ConcurrentHashMap","en":"They\u0027re identical: synchronizedMap internally returns a ConcurrentHashMap"}],"correct":0,"explanation":{"it":"In sintesi: `ConcurrentHashMap` ottiene throughput elevato con locking a grana fine (a livello di singolo bin/nodo, più operazioni CAS), così più thread possono scrivere in parti diverse della mappa contemporaneamente; `synchronizedMap` avvolge ogni metodo in un unico monitor, serializzando tutto e creando un collo di bottiglia. Inoltre l\u0027iteratore di `ConcurrentHashMap` è weakly consistent, non fail-fast.\nLe altre opzioni: `synchronizedMap` non è lock-free ed è più lenta sotto contesa; `ConcurrentHashMap` è pienamente thread-safe; non c\u0027è alcuna equivalenza interna tra i due.","en":"In summary: `ConcurrentHashMap` achieves high throughput with fine-grained locking (at the level of a single bin/node, plus CAS operations), so multiple threads can write to different parts of the map at the same time; `synchronizedMap` wraps every method in a single monitor, serializing everything and creating a bottleneck. On top of that, `ConcurrentHashMap`\u0027s iterator is weakly consistent, not fail-fast.\nThe other options: `synchronizedMap` isn\u0027t lock-free and is slower under contention; `ConcurrentHashMap` is fully thread-safe; there\u0027s no internal equivalence between the two."}},{"type":"code","prompt":{"it":"Cosa succede con queste due righe (compilazione e runtime)?","en":"What happens with these two lines (compilation and runtime)?"},"code":"Object[] arr = new String[3];\narr[0] = 42;                              // riga A\nList\u003cObject\u003e list = new ArrayList\u003cString\u003e(); // riga B","options":[{"it":"Riga A compila ma lancia ArrayStoreException a runtime (array covarianti); riga B non compila (i generics sono invarianti)","en":"Line A compiles but throws ArrayStoreException at runtime (covariant arrays); line B doesn\u0027t compile (generics are invariant)"},{"it":"Entrambe compilano ed eseguono senza errori","en":"Both compile and run without errors"},{"it":"Riga A è un errore di compilazione; riga B lancia ArrayStoreException","en":"Line A is a compilation error; line B throws ArrayStoreException"},{"it":"Entrambe sono errori di compilazione","en":"Both are compilation errors"}],"correct":0,"explanation":{"it":"In sintesi: gli array in Java sono covarianti (`String[]` è un `Object[]`), quindi la riga A compila ma inserire un `Integer` in un array di `String` provoca `ArrayStoreException` a runtime. I generics invece sono invarianti: `List\u003cString\u003e` non è un `List\u003cObject\u003e`, perciò la riga B è un errore di compilazione. È proprio questa invarianza a rendere necessari i wildcard.\nLe altre opzioni: non compilano/eseguono entrambe senza errori per i motivi opposti descritti; la riga A non è un errore di compilazione ma di runtime; non sono entrambe errori di compilazione perché A compila.","en":"In summary: arrays in Java are covariant (`String[]` is an `Object[]`), so line A compiles but inserting an `Integer` into an array of `String` causes `ArrayStoreException` at runtime. Generics, on the other hand, are invariant: `List\u003cString\u003e` is not a `List\u003cObject\u003e`, so line B is a compilation error. It\u0027s precisely this invariance that makes wildcards necessary.\nThe other options: they don\u0027t both compile/run without errors, for the opposite reasons described; line A isn\u0027t a compilation error but a runtime one; they aren\u0027t both compilation errors because A compiles."}}]},{"id":"concurrency","title":"Concorrenza \u0026 Multithreading","questions":[{"type":"mcq","prompt":{"it":"Perché implementare Runnable è generalmente preferibile a estendere Thread?","en":"Why is implementing Runnable generally preferable to extending Thread?"},"code":"","options":[{"it":"Perché separa il task dal meccanismo di esecuzione e non consuma l\u0027unica ereditarietà della classe","en":"Because it separates the task from the execution mechanism and doesn\u0027t use up the class\u0027s single inheritance slot"},{"it":"Perché estendere Thread garantisce prestazioni migliori grazie a meno overhead","en":"Because extending Thread guarantees better performance thanks to lower overhead"},{"it":"Perché Runnable rende il task automaticamente thread-safe","en":"Because Runnable makes the task automatically thread-safe"},{"it":"Perché solo estendendo Thread si può invocare start()","en":"Because you can only invoke start() by extending Thread"}],"correct":0,"explanation":{"it":"In sintesi: implementare `Runnable` disaccoppia il \"cosa\" (il task) dal \"come\" viene eseguito (`Thread` o `ExecutorService`); inoltre Java ha ereditarietà singola, quindi non sprechi l\u0027unica `extends` su `Thread` e lo stesso `Runnable` resta riusabile con i thread pool.\nLe altre opzioni: estendere `Thread` non offre vantaggi prestazionali né rende il task thread-safe, e `start()` è comunque disponibile perché è il `Thread` a incapsulare il `Runnable`.","en":"In summary: implementing `Runnable` decouples the \"what\" (the task) from the \"how\" it is executed (`Thread` or `ExecutorService`); moreover Java has single inheritance, so you don\u0027t waste your one `extends` on `Thread`, and the same `Runnable` remains reusable with thread pools.\nThe other options: extending `Thread` offers no performance advantage nor does it make the task thread-safe, and `start()` is available anyway because it is the `Thread` that wraps the `Runnable`."}},{"type":"code","prompt":{"it":"Cosa stampa questo codice?","en":"What does this code print?"},"code":"Thread t = new Thread(() -\u003e\n    System.out.println(Thread.currentThread().getName()));\nt.run();","options":[{"it":"main","en":"main"},{"it":"Thread-0","en":"Thread-0"},{"it":"Lancia IllegalThreadStateException","en":"Throws IllegalThreadStateException"},{"it":"Non compila","en":"Does not compile"}],"correct":0,"explanation":{"it":"In sintesi: `t.run()` è una normale chiamata sincrona eseguita nel thread corrente, non avvia un nuovo thread; quindi `Thread.currentThread().getName()` restituisce `main`. Solo `t.start()` creerebbe un nuovo thread stampando `Thread-0`.\nLe altre opzioni: `Thread-0` richiederebbe `start()`; `IllegalThreadStateException` si ha con un doppio `start()`, non qui; il codice compila regolarmente.","en":"In summary: `t.run()` is an ordinary synchronous call executed on the current thread; it does not start a new thread, so `Thread.currentThread().getName()` returns `main`. Only `t.start()` would create a new thread, printing `Thread-0`.\nThe other options: `Thread-0` would require `start()`; `IllegalThreadStateException` occurs with a double `start()`, not here; the code compiles fine."}},{"type":"mcq","prompt":{"it":"Quale chiamata porta un thread nello stato TIMED_WAITING?","en":"Which call moves a thread into the TIMED_WAITING state?"},"code":"","options":[{"it":"Thread.sleep(1000)","en":"Thread.sleep(1000)"},{"it":"Object.wait() senza timeout","en":"Object.wait() without a timeout"},{"it":"Thread.join() senza timeout","en":"Thread.join() without a timeout"},{"it":"Entrare in un blocco synchronized con lock libero","en":"Entering a synchronized block when the lock is free"}],"correct":0,"explanation":{"it":"In sintesi: `Thread.sleep(1000)` sospende il thread per una durata definita portandolo in `TIMED_WAITING`; lo stesso vale per le varianti con timeout di `wait` e `join`.\nLe altre opzioni: `wait()` e `join()` senza timeout danno `WAITING`, non `TIMED_WAITING`; entrare in un `synchronized` con lock libero lascia il thread `RUNNABLE`.","en":"In summary: `Thread.sleep(1000)` suspends the thread for a defined duration, moving it into `TIMED_WAITING`; the same applies to the timed variants of `wait` and `join`.\nThe other options: `wait()` and `join()` without a timeout produce `WAITING`, not `TIMED_WAITING`; entering a `synchronized` block with a free lock leaves the thread `RUNNABLE`."}},{"type":"mcq","prompt":{"it":"Su quale monitor si sincronizza un metodo di istanza dichiarato synchronized?","en":"On which monitor does a synchronized instance method synchronize?"},"code":"","options":[{"it":"Sull\u0027oggetto this","en":"On the this object"},{"it":"Sull\u0027oggetto Class della classe","en":"On the class\u0027s Class object"},{"it":"Su un monitor globale della JVM","en":"On a global JVM monitor"},{"it":"Su un lock diverso per ogni thread","en":"On a different lock for each thread"}],"correct":0,"explanation":{"it":"In sintesi: un metodo di istanza `synchronized` acquisisce il monitor (lock intrinseco) dell\u0027oggetto `this`; un metodo `static synchronized` usa invece il monitor dell\u0027oggetto `Class` (`NomeClasse.class`), quindi sono lock distinti.\nLe altre opzioni: il monitor di `Class` vale per i metodi statici, non esiste un monitor globale di JVM e il lock è unico e condiviso, non uno per thread.","en":"In summary: a `synchronized` instance method acquires the monitor (intrinsic lock) of the `this` object; a `static synchronized` method instead uses the monitor of the `Class` object (`ClassName.class`), so they are distinct locks.\nThe other options: the `Class` monitor applies to static methods, there is no global JVM monitor, and the lock is single and shared, not one per thread."}},{"type":"mcq","prompt":{"it":"Cosa garantisce la keyword volatile su un campo?","en":"What does the volatile keyword guarantee on a field?"},"code":"","options":[{"it":"Visibilità delle scritture tra thread e ordinamento (happens-before), ma non atomicità delle operazioni composte","en":"Visibility of writes across threads and ordering (happens-before), but not atomicity of compound operations"},{"it":"L\u0027atomicità di operazioni come count++","en":"The atomicity of operations like count++"},{"it":"La mutua esclusione come synchronized","en":"Mutual exclusion, like synchronized"},{"it":"Che la variabile diventi immutabile","en":"That the variable becomes immutable"}],"correct":0,"explanation":{"it":"In sintesi: `volatile` garantisce che le scritture siano immediatamente visibili agli altri thread e stabilisce relazioni happens-before, ma non rende atomiche le operazioni read-modify-write come `count++`.\nLe altre opzioni: non fornisce atomicità né mutua esclusione (servono `synchronized` o le classi `Atomic*`) e non ha alcun legame con l\u0027immutabilità.","en":"In summary: `volatile` guarantees that writes are immediately visible to other threads and establishes happens-before relationships, but it does not make read-modify-write operations like `count++` atomic.\nThe other options: it provides neither atomicity nor mutual exclusion (you need `synchronized` or the `Atomic*` classes), and it has nothing to do with immutability."}},{"type":"code","prompt":{"it":"1000 thread invocano ciascuno inc() una volta. Cosa vale count alla fine?","en":"1000 threads each invoke inc() once. What is the value of count at the end?"},"code":"class Counter {\n    private int count = 0;\n    public void inc() { count++; }\n    public int get() { return count; }\n}","options":[{"it":"Un valore \u003c= 1000, spesso \u003c 1000, per race condition su count++","en":"A value \u003c= 1000, often \u003c 1000, due to a race condition on count++"},{"it":"Sempre esattamente 1000","en":"Always exactly 1000"},{"it":"Sempre 0","en":"Always 0"},{"it":"Lancia ConcurrentModificationException","en":"Throws ConcurrentModificationException"}],"correct":0,"explanation":{"it":"In sintesi: `count++` è una lettura-modifica-scrittura non atomica, quindi con accessi concorrenti si perdono aggiornamenti (lost update) e il totale finale è spesso inferiore a 1000; per correggerlo servono `synchronized`, un `AtomicInteger` o un lock.\nLe altre opzioni: non è mai garantito 1000 proprio per la race condition, non resta 0 (qualche incremento va a buon fine) e `ConcurrentModificationException` riguarda l\u0027iterazione di collezioni, non un `int`.","en":"In summary: `count++` is a non-atomic read-modify-write, so under concurrent access updates are lost (lost updates) and the final total is often below 1000; to fix it you need `synchronized`, an `AtomicInteger`, or a lock.\nThe other options: 1000 is never guaranteed precisely because of the race condition, it does not stay at 0 (some increments succeed), and `ConcurrentModificationException` concerns collection iteration, not an `int`."}},{"type":"code","prompt":{"it":"Due thread eseguono questi blocchi. Qual è il problema?","en":"Two threads run these blocks. What is the problem?"},"code":"// Thread 1\nsynchronized (lockA) {\n    synchronized (lockB) { /* ... */ }\n}\n\n// Thread 2\nsynchronized (lockB) {\n    synchronized (lockA) { /* ... */ }\n}","options":[{"it":"Deadlock: acquisendo i lock in ordine opposto i due thread possono bloccarsi a vicenda","en":"Deadlock: by acquiring the locks in opposite order the two threads can block each other"},{"it":"Livelock: i thread cambiano stato continuamente senza progredire","en":"Livelock: the threads keep changing state without making progress"},{"it":"Race condition benigna, nessun blocco","en":"A benign race condition, no blocking"},{"it
