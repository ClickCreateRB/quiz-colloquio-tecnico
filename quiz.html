ays produces the exact same result as a single request (idempotency)."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: `POST` non è idempotente: due `POST` identici su una collection tipicamente creano due risorse distinte con id diversi. Per proteggersi da doppie sottomissioni (es. click doppio in un flusso di pagamento) si usano idempotency key o si sposta la logica su `PUT` con URI noto.\nLe altre opzioni: l\u0027affermazione è falsa; l\u0027errore tipico è assumere che il retry di un `POST` sia sicuro, mentre in ambito bancario può generare pagamenti o ordini duplicati.","en":"In summary: `POST` is not idempotent: two identical `POST`s to a collection typically create two distinct resources with different ids. To guard against double submissions (e.g. a double click in a payment flow) you use idempotency keys or move the logic to `PUT` with a known URI.\nThe other options: the statement is false; the typical mistake is assuming that retrying a `POST` is safe, whereas in a banking context it can generate duplicate payments or orders."}},{"type":"mcq","prompt":{"it":"Un DELETE che rimuove con successo una risorsa e non restituisce alcun corpo nella risposta dovrebbe usare quale status code?","en":"A DELETE that successfully removes a resource and returns no body in the response should use which status code?"},"code":"","options":[{"it":"200 OK","en":"200 OK"},{"it":"201 Created","en":"201 Created"},{"it":"204 No Content","en":"204 No Content"},{"it":"404 Not Found","en":"404 Not Found"}],"correct":2,"explanation":{"it":"In sintesi: `204 No Content` è la scelta corretta quando l\u0027operazione riesce ma non c\u0027è nulla da restituire nel body, caso tipico di un `DELETE` andato a buon fine. Comunica successo senza payload.\nLe altre opzioni: `200 OK` è appropriato se si restituisce un corpo (es. la risorsa cancellata o un messaggio); `201 Created` è per la creazione; `404` indica che la risorsa non esisteva, non un successo.","en":"In summary: `204 No Content` is the correct choice when the operation succeeds but there is nothing to return in the body, the typical case of a successful `DELETE`. It signals success with no payload.\nThe other options: `200 OK` is appropriate if you return a body (e.g. the deleted resource or a message); `201 Created` is for creation; `404` indicates that the resource did not exist, not success."}},{"type":"code","prompt":{"it":"Quale status code e header ci si aspetta da questo endpoint Spring dopo una creazione riuscita?","en":"What status code and header do you expect from this Spring endpoint after a successful creation?"},"code":"@PostMapping(\"/orders\")\npublic ResponseEntity\u003cOrder\u003e create(@RequestBody Order o) {\n    Order saved = repository.save(o);\n    URI location = URI.create(\"/orders/\" + saved.getId());\n    return ResponseEntity.created(location).body(saved);\n}","options":[{"it":"200 OK senza header Location","en":"200 OK with no Location header"},{"it":"201 Created con header Location che punta alla nuova risorsa","en":"201 Created with a Location header pointing to the new resource"},{"it":"204 No Content con corpo vuoto","en":"204 No Content with an empty body"},{"it":"202 Accepted con header Retry-After","en":"202 Accepted with a Retry-After header"}],"correct":1,"explanation":{"it":"In sintesi: `ResponseEntity.created(location)` imposta lo status `201 Created` e valorizza l\u0027header `Location` con l\u0027URI passato, mentre `.body(saved)` include la rappresentazione della risorsa creata: è il pattern canonico per una creazione REST.\nLe altre opzioni: `200` senza `Location` ignora il metodo `created()`; `204` implicherebbe corpo vuoto ma qui c\u0027è `.body(saved)`; `202 Accepted` con `Retry-After` è per elaborazioni asincrone, non per una creazione già completata.","en":"In summary: `ResponseEntity.created(location)` sets the `201 Created` status and populates the `Location` header with the URI passed in, while `.body(saved)` includes the representation of the created resource: it is the canonical pattern for a REST creation.\nThe other options: `200` with no `Location` ignores the `created()` method; `204` would imply an empty body, but here there is `.body(saved)`; `202 Accepted` with `Retry-After` is for asynchronous processing, not for a creation that is already complete."}},{"type":"mcq","prompt":{"it":"Un client invia un JSON sintatticamente malformato nel body di un POST. Quale status code è più appropriato?","en":"A client sends syntactically malformed JSON in the body of a POST. Which status code is most appropriate?"},"code":"","options":[{"it":"400 Bad Request","en":"400 Bad Request"},{"it":"401 Unauthorized","en":"401 Unauthorized"},{"it":"403 Forbidden","en":"403 Forbidden"},{"it":"422 Unprocessable Entity","en":"422 Unprocessable Entity"}],"correct":0,"explanation":{"it":"In sintesi: `400 Bad Request` è corretto quando la richiesta è malformata a livello sintattico e il server non riesce nemmeno a interpretarla, come un JSON con parentesi non bilanciate. Il problema è nella forma del messaggio, non nell\u0027autorizzazione.\nLe altre opzioni: `401` e `403` riguardano autenticazione e permessi, non la sintassi; `422` si usa quando il JSON è ben formato ma semanticamente invalido (es. validazione di business fallita), non quando è illeggibile.","en":"In summary: `400 Bad Request` is correct when the request is syntactically malformed and the server cannot even parse it, such as JSON with unbalanced brackets. The problem is in the form of the message, not in authorization.\nThe other options: `401` and `403` concern authentication and permissions, not syntax; `422` is used when the JSON is well-formed but semantically invalid (e.g. a failed business validation), not when it is unreadable."}},{"type":"mcq","prompt":{"it":"Un utente correttamente autenticato prova ad accedere a una risorsa per cui non ha i permessi. Cosa restituire?","en":"A correctly authenticated user tries to access a resource for which they lack permissions. What should you return?"},"code":"","options":[{"it":"401 Unauthorized","en":"401 Unauthorized"},{"it":"403 Forbidden","en":"403 Forbidden"},{"it":"404 Not Found","en":"404 Not Found"},{"it":"400 Bad Request","en":"400 Bad Request"}],"correct":1,"explanation":{"it":"In sintesi: `403 Forbidden` è corretto quando l\u0027identità è nota e valida ma non ha i privilegi per l\u0027operazione: l\u0027autenticazione è passata, manca l\u0027autorizzazione. Il server ha capito chi sei e dice esplicitamente che non puoi.\nLe altre opzioni: `401` significa \u0027non autenticato\u0027 o credenziali mancanti/invalide (e implica un header `WWW-Authenticate`); `404` si usa a volte per non rivelare l\u0027esistenza della risorsa, ma non è la risposta canonica; `400` riguarda la forma della richiesta.","en":"In summary: `403 Forbidden` is correct when the identity is known and valid but lacks the privileges for the operation: authentication has passed, authorization is missing. The server has understood who you are and explicitly says you may not.\nThe other options: `401` means \u0027not authenticated\u0027 or missing/invalid credentials (and implies a `WWW-Authenticate` header); `404` is sometimes used to avoid revealing the resource\u0027s existence, but it is not the canonical response; `400` concerns the form of the request."}},{"type":"mcq","prompt":{"it":"Un PUT fallisce perché lo stato attuale della risorsa è in conflitto con l\u0027operazione (es. si aggiorna una versione ormai obsoleta). Quale status code usare?","en":"A PUT fails because the resource\u0027s current state conflicts with the operation (e.g. updating an already outdated version). Which status code should you use?"},"code":"","options":[{"it":"400 Bad Request","en":"400 Bad Request"},{"it":"409 Conflict","en":"409 Conflict"},{"it":"422 Unprocessable Entity","en":"422 Unprocessable Entity"},{"it":"500 Internal Server Error","en":"500 Internal Server Error"}],"correct":1,"explanation":{"it":"In sintesi: `409 Conflict` è il codice giusto quando la richiesta collide con lo stato corrente della risorsa, tipico dell\u0027optimistic locking: il client ha una versione superata e l\u0027aggiornamento entrerebbe in conflitto. Segnala che il client può risolvere e ritentare.\nLe altre opzioni: `400` è sintattico; `422` è per payload semanticamente invalido ma senza conflitto di stato; `500` è un errore lato server, mentre qui il problema è una condizione di concorrenza gestibile dal client.","en":"In summary: `409 Conflict` is the right code when the request collides with the resource\u0027s current state, typical of optimistic locking: the client holds an outdated version and the update would conflict. It signals that the client can resolve and retry.\nThe other options: `400` is syntactic; `422` is for a semantically invalid payload but with no state conflict; `500` is a server-side error, whereas here the problem is a concurrency condition the client can handle."}},{"type":"truefalse","prompt":{"it":"Il codice 422 Unprocessable Entity indica una richiesta sintatticamente valida ma semanticamente errata, per esempio una validazione di business fallita.","en":"The 422 Unprocessable Entity code indicates a syntactically valid but semantically wrong request, for example a failed business validation."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: `422 Unprocessable Entity` è pensato proprio per questo: il body è ben formato e comprensibile (es. JSON valido), ma non supera le regole semantiche o di dominio, come un IBAN formalmente corretto ma non valido per il paese indicato.\nLe altre opzioni: l\u0027affermazione è vera; l\u0027errore tipico è usare `400` per ogni errore di validazione, mentre `400` è per messaggi malformati e `422` distingue il caso \u0027ti ho capito ma non posso elaborarlo\u0027.","en":"In summary: `422 Unprocessable Entity` is designed for exactly this: the body is well-formed and understandable (e.g. valid JSON), but it fails the semantic or domain rules, such as an IBAN that is formally correct but not valid for the specified country.\nThe other options: the statement is true; the typical mistake is using `400` for every validation error, whereas `400` is for malformed messages and `422` captures the case of \u0027I understood you but I cannot process it\u0027."}},{"type":"mcq","prompt":{"it":"Il database è temporaneamente irraggiungibile e prevedi che il servizio tornerà disponibile a breve. Quale status code è più corretto restituire al client?","en":"The database is temporarily unreachable and you expect the service to be back shortly. Which status code is most correct to return to the client?"},"code":"","options":[{"it":"500 Internal Server Error","en":"500 Internal Server Error"},{"it":"502 Bad Gateway","en":"502 Bad Gateway"},{"it":"503 Service Unavailable","en":"503 Service Unavailable"},{"it":"504 Gateway Timeout","en":"504 Gateway Timeout"}],"correct":2,"explanation":{"it":"In sintesi: `503 Service Unavailable` comunica una indisponibilità temporanea del servizio (sovraccarico o dipendenza giù) e può accompagnarsi a un header `Retry-After` per suggerire quando ritentare. È l\u0027informazione più onesta e utile in questo scenario.\nLe altre opzioni: `500` è un errore generico e non transitorio, che non invita al retry; `502` e `504` riguardano specificamente un gateway/proxy che riceve una risposta invalida o va in timeout verso l\u0027upstream, non il caso di una dipendenza temporaneamente giù.","en":"In summary: `503 Service Unavailable` communicates a temporary unavailability of the service (overload or a downstream dependency being down) and can be accompanied by a `Retry-After` header suggesting when to retry. It is the most honest and useful information in this scenario.\nThe other options: `500` is a generic, non-transient error that does not invite a retry; `502` and `504` specifically concern a gateway/proxy that receives an invalid response or times out toward the upstream, not the case of a dependency being temporarily down."}},{"type":"mcq","prompt":{"it":"Quale URI segue meglio le convenzioni REST per ottenere l\u0027utente con id 42?","en":"Which URI best follows REST conventions for retrieving the user with id 42?"},"code":"","options":[{"it":"GET /getUser?id=42","en":"GET /getUser?id=42"},{"it":"GET /users/42","en":"GET /users/42"},{"it":"GET /user/getById/42","en":"GET /user/getById/42"},{"it":"POST /users/42/get","en":"POST /users/42/get"}],"correct":1,"explanation":{"it":"In sintesi: `GET /users/42` è idiomatico: nome della collection al plurale, id come segmento di path e verbo espresso dal metodo HTTP, non dall\u0027URI. È leggibile, gerarchico e coerente con l\u0027uniform interface.\nLe altre opzioni: `getUser`, `getById` e `/get` mettono il verbo nell\u0027URI, cosa che REST demanda al metodo HTTP; inoltre usare `POST` per una lettura viola la semantica safe/idempotente del `GET`.","en":"In summary: `GET /users/42` is idiomatic: plural collection name, id as a path segment, and the verb expressed by the HTTP method rather than the URI. It is readable, hierarchical and consistent with the uniform interface.\nThe other options: `getUser`, `getById` and `/get` put the verb in the URI, which REST delegates to the HTTP method; moreover, using `POST` for a read violates the safe/idempotent semantics of `GET`."}},{"type":"mcq","prompt":{"it":"Quale URI rappresenta correttamente gli ordini appartenenti all\u0027utente 42?","en":"Which URI correctly represents the orders belonging to user 42?"},"code":"","options":[{"it":"GET /orders/users/42","en":"GET /orders/users/42"},{"it":"GET /users/42/orders","en":"GET /users/42/orders"},{"it":"GET /users/orders/42","en":"GET /users/orders/42"},{"it":"GET /getOrdersByUser/42","en":"GET /getOrdersByUser/42"}],"correct":1,"explanation":{"it":"In sintesi: `GET /users/42/orders` esprime correttamente il nesting: la sotto-risorsa orders è annidata sotto la risorsa padre users/42, riflettendo la relazione di appartenenza nella gerarchia dell\u0027URI.\nLe altre opzioni: `/orders/users/42` inverte la gerarchia; `/users/orders/42` mette 42 nel posto sbagliato (sembra l\u0027id di un ordine); `/getOrdersByUser/42` reintroduce un verbo nell\u0027URI, da evitare in REST.","en":"In summary: `GET /users/42/orders` correctly expresses the nesting: the orders sub-resource is nested under the parent resource users/42, reflecting the ownership relationship in the URI hierarchy.\nThe other options: `/orders/users/42` inverts the hierarchy; `/users/orders/42` puts 42 in the wrong place (it looks like an order id); `/getOrdersByUser/42` reintroduces a verb into the URI, which should be avoided in REST."}},{"type":"truefalse","prompt":{"it":"In un buon design REST gli URI dovrebbero contenere verbi come /createUser o /deleteOrder per esprimere l\u0027azione da compiere.","en":"In good REST design, URIs should contain verbs like /createUser or /deleteOrder to express the action to be performed."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: gli URI devono identificare risorse (sostantivi, tipicamente al plurale), mentre l\u0027azione è espressa dal metodo HTTP: si crea con `POST /users` e si cancella con `DELETE /orders/9`, non con `/createUser` o `/deleteOrder`. Questo tiene l\u0027interfaccia uniforme e prevedibile.\nLe altre opzioni: l\u0027affermazione è falsa; l\u0027errore tipico è modellare l\u0027API come RPC mettendo i verbi nel path, duplicando la semantica che HTTP già fornisce con i suoi metodi.","en":"In summary: URIs must identify resources (nouns, typically plural), while the action is expressed by the HTTP method: you create with `POST /users` and delete with `DELETE /orders/9`, not with `/createUser` or `/deleteOrder`. This keeps the interface uniform and predictable.\nThe other options: the statement is false; the typical mistake is modeling the API as RPC by putting verbs in the path, duplicating the semantics that HTTP already provides through its methods."}},{"type":"mcq","prompt":{"it":"Quale affermazione descrive correttamente una differenza tra REST e SOAP?","en":"Which statement correctly describes a difference between REST and SOAP?"},"code":"","options":[{"it":"SOAP è un protocollo con contratto formale (WSDL) e messaggi XML tipizzati; REST è uno stile architetturale che sfrutta HTTP e vari formati, tipicamente JSON","en":"SOAP is a protocol with a formal contract (WSDL) and typed XML messages; REST is an architectural style that leverages HTTP and various formats, typically JSON"},{"it":"REST usa obbligatoriamente XML, mentre SOAP usa JSON","en":"REST mandatorily uses XML, while SOAP uses JSON"},{"it":"SOAP funziona solo su HTTP mentre REST può usare qualsiasi protocollo di trasporto","en":"SOAP works only over HTTP while REST can use any transport protocol"},{"it":"REST prevede un contratto WSDL, mentre SOAP non ne ha uno","en":"REST provides a WSDL contract, while SOAP does not have one"}],"correct":0,"explanation":{"it":"In sintesi: SOAP è un protocollo rigoroso con contratto formale WSDL, envelope e messaggi XML tipizzati, con standard WS-* per sicurezza e transazioni; REST è invece uno stile architetturale che si appoggia alla semantica di HTTP e usa formati flessibili, in pratica quasi sempre JSON.\nLe altre opzioni: REST non impone XML; è SOAP a essere legato all\u0027XML, non a JSON; ed è SOAP (non REST) a poter viaggiare su più trasporti come SMTP, mentre il WSDL appartiene a SOAP, non a REST.","en":"In summary: SOAP is a strict protocol with a formal WSDL contract, an envelope and typed XML messages, with WS-* standards for security and transactions; REST, by contrast, is an architectural style that relies on HTTP semantics and uses flexible formats, in practice almost always JSON.\nThe other options: REST does not mandate XML; it is SOAP that is tied to XML, not to JSON; and it is SOAP (not REST) that can travel over multiple transports such as SMTP, while the WSDL belongs to SOAP, not to REST."}},{"type":"mcq","prompt":{"it":"Quale header HTTP usa il client per indicare in quale formato desidera ricevere la rappresentazione della risorsa?","en":"Which HTTP header does the client use to indicate the format in which it wishes to receive the resource\u0027s representation?"},"code":"","options":[{"it":"Content-Type","en":"Content-Type"},{"it":"Accept","en":"Accept"},{"it":"Content-Encoding","en":"Content-Encoding"},{"it":"Allow","en":"Allow"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027header `Accept` è quello con cui il client dichiara i media type che è disposto a ricevere (es. `Accept: application/json`), guidando la content negotiation lato server sulla rappresentazione della risposta.\nLe altre opzioni: `Content-Type` descrive il formato del corpo effettivamente inviato (in richiesta o risposta), non ciò che si desidera; `Content-Encoding` riguarda la compressione; `Allow` elenca i metodi HTTP supportati da una risorsa.","en":"In summary: the `Accept` header is the one the client uses to declare the media types it is willing to receive (e.g. `Accept: application/json`), driving the server-side content negotiation over the response\u0027s representation.\nThe other options: `Content-Type` describes the format of the body actually sent (in a request or response), not what is desired; `Content-Encoding` concerns compression; `Allow` lists the HTTP methods supported by a resource."}},{"type":"code","prompt":{"it":"Il client invia questa richiesta. Cosa comunica esattamente l\u0027header Content-Type?","en":"The client sends this request. What exactly does the Content-Type header communicate?"},"code":"POST /users HTTP/1.1\nHost: api.bank.com\nAccept: application/json\nContent-Type: application/json\n\n{ \"name\": \"Mario\", \"iban\": \"IT60...\" }","options":[{"it":"Che il client vuole ricevere la risposta in formato JSON","en":"That the client wants to receive the response in JSON format"},{"it":"Che il body della richiesta inviato dal client è in formato JSON","en":"That the request body sent by the client is in JSON format"},{"it":"Che il server deve rispondere con status 200","en":"That the server must respond with status 200"},{"it":"Che la risorsa users accetta solo XML","en":"That the users resource accepts only XML"}],"correct":1,"explanation":{"it":"In sintesi: `Content-Type` descrive il formato del payload effettivamente presente nel messaggio, quindi qui dichiara che il body inviato dal client è `application/json`. È l\u0027informazione che il server usa per scegliere il parser corretto.\nLe altre opzioni: la preferenza sul formato della risposta è espressa da `Accept`, non da `Content-Type`; l\u0027header non impone alcuno status code; e non limita la risorsa all\u0027XML, anzi qui si sta inviando JSON.","en":"In summary: `Content-Type` describes the format of the payload actually present in the message, so here it declares that the body sent by the client is `application/json`. It is the information the server uses to pick the correct parser.\nThe other options: the preference for the response format is expressed by `Accept`, not by `Content-Type`; the header imposes no status code; and it does not restrict the resource to XML, on the contrary JSON is being sent here."}},{"type":"mcq","prompt":{"it":"Qual è la differenza corretta tra PUT e PATCH?","en":"What is the correct difference between PUT and PATCH?"},"code":"","options":[{"it":"PUT applica una modifica parziale, PATCH sostituisce l\u0027intera risorsa","en":"PUT applies a partial modification, PATCH replaces the entire resource"},{"it":"PUT sostituisce l\u0027intera rappresentazione della risorsa, PATCH applica una modifica parziale","en":"PUT replaces the entire representation of the resource, PATCH applies a partial modification"},{"it":"PUT non è idempotente, PATCH lo è sempre","en":"PUT is not idempotent, PATCH always is"},{"it":"PUT crea sempre una nuova risorsa, PATCH la elimina","en":"PUT always creates a new resource, PATCH deletes it"}],"correct":1,"explanation":{"it":"In sintesi: `PUT` sostituisce l\u0027intera rappresentazione della risorsa all\u0027URI indicato (i campi omessi vengono azzerati/sovrascritti), mentre `PATCH` applica una modifica parziale toccando solo i campi specificati. `PUT` è idempotente per definizione; `PATCH` in generale non lo è.\nLe altre opzioni: la prima inverte i due metodi; la terza sbaglia l\u0027idempotenza (è `PUT` a esserlo, non `PATCH` sempre); la quarta confonde `PUT` con un delete e ne travisa la semantica.","en":"In summary: `PUT` replaces the entire representation of the resource at the given URI (omitted fields are cleared/overwritten), whereas `PATCH` applies a partial modification, touching only the specified fields. `PUT` is idempotent by definition; `PATCH` generally is not.\nThe other options: the first swaps the two methods; the third gets idempotency wrong (it is `PUT` that is idempotent, not `PATCH` always); the fourth confuses `PUT` with a delete and misrepresents its semantics."}},{"type":"code","prompt":{"it":"La risorsa vale { \"name\": \"Mario\", \"email\": \"m@x.it\", \"active\": true }. Il client invia questo JSON Merge Patch (RFC 7386). Qual è lo stato risultante della risorsa?","en":"The resource is { \"name\": \"Mario\", \"email\": \"m@x.it\", \"active\": true }. The client sends this JSON Merge Patch (RFC 7386). What is the resulting state of the resource?"},"code":"PATCH /users/42 HTTP/1.1\nContent-Type: application/merge-patch+json\n\n{ \"email\": \"mario@bank.it\", \"active\": null }","options":[{"it":"{ \"email\": \"mario@bank.it\", \"active\": null } — gli altri campi vengono persi","en":"{ \"email\": \"mario@bank.it\", \"active\": null } — the other fields are lost"},{"it":"{ \"name\": \"Mario\", \"email\": \"mario@bank.it\" } — email aggiornata, active rimosso, name invariato","en":"{ \"name\": \"Mario\", \"email\": \"mario@bank.it\" } — email updated, active removed, name unchanged"},{"it":"{ \"name\": \"Mario\", \"email\": \"mario@bank.it\", \"active\": true } — il null viene ignorato","en":"{ \"name\": \"Mario\", \"email\": \"mario@bank.it\", \"active\": true } — the null is ignored"},{"it":"{ \"name\": \"Mario\", \"email\": \"m@x.it\", \"active\": true } — il PATCH non modifica nulla","en":"{ \"name\": \"Mario\", \"email\": \"m@x.it\", \"active\": true } — the PATCH changes nothing"}],"correct":1,"explanation":{"it":"In sintesi: nel JSON Merge Patch un campo presente aggiorna il valore, un campo assente resta invariato e un campo posto a `null` viene rimosso dalla risorsa. Quindi `email` diventa `mario@bank.it`, `active` viene eliminato per via del `null` e `name` resta `Mario`.\nLe altre opzioni: la prima confonde il merge patch con una sostituzione totale (comportamento da `PUT`); la terza ignora la semantica del `null` che invece cancella; la quarta nega qualsiasi effetto, sbagliato per un merge patch valido.","en":"In summary: in a JSON Merge Patch, a present field updates the value, an absent field stays unchanged, and a field set to `null` is removed from the resource. So `email` becomes `mario@bank.it`, `active` is deleted because of the `null`, and `name` stays `Mario`.\nThe other options: the first confuses the merge patch with a full replacement (`PUT` behavior); the third ignores the `null` semantics, which in fact delete the field; the fourth denies any effect, which is wrong for a valid merge patch."}},{"type":"mcq","prompt":{"it":"Quale di questi è un approccio comune e valido per il versioning di un\u0027API REST?","en":"Which of these is a common and valid approach for versioning a REST API?"},"code":"","options":[{"it":"Cambiare la porta TCP a ogni nuova versione","en":"Changing the TCP port for each new version"},{"it":"Versionare nel path (es. /v1/users) oppure tramite header (Accept con un media type versionato)","en":"Versioning in the path (e.g. /v1/users) or via a header (Accept with a versioned media type)"},{"it":"Aggiungere un timestamp casuale a ogni endpoint","en":"Adding a random timestamp to each endpoint"},{"it":"Usare un metodo HTTP diverso per ogni versione","en":"Using a different HTTP method for each version"}],"correct":1,"explanation":{"it":"In sintesi: le strategie diffuse e valide sono il versioning nel path (`/v1/users`), semplice e visibile, oppure la negoziazione via header con un media type versionato (`Accept: application/vnd.bank.v2+json`), più aderente ai principi REST. La scelta bilancia semplicità e pulizia dell\u0027URI.\nLe altre opzioni: cambiare porta, aggiungere timestamp casuali o assegnare un metodo HTTP a ogni versione non sono pratiche riconosciute e romperebbero la semantica di HTTP e la stabilità degli URI.","en":"In summary: the widespread and valid strategies are versioning in the path (`/v1/users`), simple and visible, or negotiation via a header with a versioned media type (`Accept: application/vnd.bank.v2+json`), more in line with REST principles. The choice balances simplicity against URI cleanliness.\nThe other options: changing the port, adding random timestamps, or assigning an HTTP method per version are not recognized practices and would break HTTP semantics and URI stability."}},{"type":"mcq","prompt":{"it":"Quale coppia di parametri implementa una paginazione offset-based classica?","en":"Which pair of parameters implements classic offset-based pagination?"},"code":"","options":[{"it":"?sort=name\u0026order=asc","en":"?sort=name\u0026order=asc"},{"it":"?page=2\u0026size=20 (oppure ?limit=20\u0026offset=20)","en":"?page=2\u0026size=20 (or ?limit=20\u0026offset=20)"},{"it":"?filter=active\u0026fields=id","en":"?filter=active\u0026fields=id"},{"it":"?expand=orders\u0026depth=2","en":"?expand=orders\u0026depth=2"}],"correct":1,"explanation":{"it":"In sintesi: la paginazione offset-based si esprime con `page`/`size` o equivalentemente `limit`/`offset`, dove il client indica quanti elementi vuole e da quale posizione partire. È semplice ma può soffrire su dataset grandi o molto dinamici, dove si preferisce la cursor-based (keyset).\nLe altre opzioni: `sort`/`order` riguardano l\u0027ordinamento; `filter`/`fields` filtrano e selezionano campi (sparse fieldsets); `expand`/`depth` gestiscono l\u0027espansione di risorse correlate: nessuna è paginazione.","en":"In summary: offset-based pagination is expressed with `page`/`size` or equivalently `limit`/`offset`, where the client indicates how many elements it wants and from which position to start. It is simple but can struggle on large or highly dynamic datasets, where cursor-based (keyset) pagination is preferred.\nThe other options: `sort`/`order` concern ordering; `filter`/`fields` filter and select fields (sparse fieldsets); `expand`/`depth` handle the expansion of related resources: none of them is pagination."}},{"type":"mcq","prompt":{"it":"Qual è la buona pratica per il payload di errore di un\u0027API REST?","en":"What is the good practice for the error payload of a REST API?"},"code":"","options":[{"it":"Restituire sempre 200 con un flag success:false nel body","en":"Always return 200 with a success:false flag in the body"},{"it":"Usare lo status HTTP appropriato e un body strutturato con dettagli (codice, messaggio, campi), idealmente secondo lo standard Problem Details (RFC 9457, che aggiorna RFC 7807)","en":"Use the appropriate HTTP status and a structured body with details (code, message, fields), ideally following the Problem Details standard (RFC 9457, which updates RFC 7807)"},{"it":"Restituire al client solo lo stack trace completo dell\u0027eccezione","en":"Return only the full stack trace of the exception to the client"},{"it":"Restituire un body vuoto lasciando al client il compito di interpretare l\u0027errore","en":"Return an empty body, leaving the client to interpret the error"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027errore va segnalato con lo status HTTP corretto (4xx/5xx) e un body machine-readable e coerente, con campi come codice, messaggio ed eventuali dettagli sui campi; lo standard di riferimento è Problem Details, definito da RFC 9457 (che aggiorna e sostituisce RFC 7807), con media type `application/problem+json`. Così il client può gestire l\u0027errore in modo programmabile.\nLe altre opzioni: rispondere sempre `200` con un flag di errore è un anti-pattern che rompe la semantica HTTP; restituire lo stack trace espone dettagli interni ed è un rischio di sicurezza; un body vuoto non dà informazioni utili.","en":"In summary: an error must be signaled with the correct HTTP status (4xx/5xx) and a machine-readable, consistent body, with fields such as code, message and any field-level details; the reference standard is Problem Details, defined by RFC 9457 (which updates and supersedes RFC 7807), with media type `application/problem+json`. This way the client can handle the error programmatically.\nThe other options: always responding `200` with an error flag is an anti-pattern that breaks HTTP semantics; returning the stack trace exposes internal details and is a security risk; an empty body provides no useful information."}},{"type":"mcq","prompt":{"it":"Come si presenta tipicamente un token JWT in una richiesta HTTP verso un\u0027API stateless?","en":"How is a JWT token typically presented in an HTTP request to a stateless API?"},"code":"","options":[{"it":"Come cookie di sessione gestito lato server","en":"As a session cookie managed on the server side"},{"it":"Nell\u0027header Authorization: Bearer \u003ctoken\u003e","en":"In the Authorization: Bearer \u003ctoken\u003e header"},{"it":"Come parametro obbligatorio nel path, es. /token/\u003cjwt\u003e/users","en":"As a mandatory path parameter, e.g. /token/\u003cjwt\u003e/users"},{"it":"Nell\u0027header Content-Type","en":"In the Content-Type header"}],"correct":1,"explanation":{"it":"In sintesi: il pattern standard è l\u0027header `Authorization: Bearer \u003ctoken\u003e`, dove il JWT viaggia come credenziale bearer a ogni richiesta, coerente con l\u0027autenticazione stateless. Il server valida la firma senza mantenere sessione.\nLe altre opzioni: un cookie di sessione lato server implicherebbe stato server, contrario allo statelessness; mettere il token nel path lo espone in log e cronologia ed è insicuro; `Content-Type` descrive il formato del body, non l\u0027autenticazione.","en":"In summary: the standard pattern is the `Authorization: Bearer \u003ctoken\u003e` header, where the JWT travels as a bearer credential on every request, consistent with stateless authentication. The server validates the signature without keeping a session.\nThe other options: a server-side session cookie would imply server state, contrary to statelessness; putting the token in the path exposes it in logs and history and is insecure; `Content-Type` describes the body format, not authentication."}},{"type":"truefalse","prompt":{"it":"Un JWT firmato è auto-contenuto: il server può validarlo verificando la firma senza consultare una sessione lato server, il che è coerente con lo statelessness di REST.","en":"A signed JWT is self-contained: the server can validate it by verifying the signature without consulting a server-side session, which is consistent with REST\u0027s statelessness."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero, il JWT trasporta i claim nel payload e la sua integrità è garantita dalla firma; il server può validarlo con la chiave (segreto HMAC o chiave pubblica) senza guardare uno store di sessione, il che si sposa con l\u0027autenticazione stateless.\nLe altre opzioni: l\u0027affermazione è vera, ma va ricordato il rovescio della medaglia: la revoca è più difficile perché un JWT valido resta valido fino alla scadenza, per questo si usano scadenze brevi, refresh token o blacklist mirate.","en":"In summary: this is true, the JWT carries the claims in its payload and its integrity is guaranteed by the signature; the server can validate it with the key (an HMAC secret or a public key) without looking at a session store, which fits stateless authentication.\nThe other options: the statement is true, but the flip side must be kept in mind: revocation is harder because a valid JWT stays valid until it expires, which is why short lifetimes, refresh tokens or targeted blacklists are used."}},{"type":"mcq","prompt":{"it":"A cosa serve CORS (Cross-Origin Resource Sharing)?","en":"What is CORS (Cross-Origin Resource Sharing) for?"},"code":"","options":[{"it":"A cifrare il traffico tra client e server","en":"To encrypt the traffic between client and server"},{"it":"A permettere, tramite header di risposta del server, che un browser consenta a una pagina di un\u0027origine diversa di chiamare l\u0027API, rilassando in modo controllato la same-origin policy","en":"To allow, through server response headers, a browser to let a page from a different origin call the API, relaxing the same-origin policy in a controlled way"},{"it":"A comprimere le risposte per ridurre la banda","en":"To compress responses to reduce bandwidth"},{"it":"A bilanciare il carico tra più server backend","en":"To balance the load across multiple backend servers"}],"correct":1,"explanation":{"it":"In sintesi: CORS è un meccanismo del browser che, tramite header come `Access-Control-Allow-Origin` inviati dal server, rilassa in modo controllato la same-origin policy, permettendo a una pagina di un\u0027origine diversa di consumare l\u0027API. È una decisione che sta al server, applicata dal browser.\nLe altre opzioni: la cifratura è compito di TLS/HTTPS; la compressione è `Content-Encoding`/gzip; il bilanciamento del carico è responsabilità dell\u0027infrastruttura, non di CORS.","en":"In summary: CORS is a browser mechanism that, through headers such as `Access-Control-Allow-Origin` sent by the server, relaxes the same-origin policy in a controlled way, allowing a page from a different origin to consume the API. It is a decision that rests with the server and is enforced by the browser.\nThe other options: encryption is the job of TLS/HTTPS; compression is `Content-Encoding`/gzip; load balancing is the responsibility of the infrastructure, not of CORS."}},{"type":"mcq","prompt":{"it":"Quando un browser invia una richiesta di preflight CORS con il metodo OPTIONS?","en":"When does a browser send a CORS preflight request with the OPTIONS method?"},"code":"","options":[{"it":"Sempre, prima di ogni richiesta GET semplice","en":"Always, before every simple GET request"},{"it":"Prima di richieste \u0027non semplici\u0027 (es. metodi come PUT/DELETE, o header custom, o Content-Type application/json), per verificare i permessi tramite gli header Access-Control-Allow-*","en":"Before \u0027non-simple\u0027 requests (e.g. methods like PUT/DELETE, or custom headers, or Content-Type application/json), to verify permissions through the Access-Control-Allow-* headers"},{"it":"Solo quando il server ha già risposto con 403","en":"Only when the server has already responded with 403"},{"it":"Solo per richieste effettuate su HTTP non cifrato","en":"Only for requests made over unencrypted HTTP"}],"correct":1,"explanation":{"it":"In sintesi: il browser antepone un preflight `OPTIONS` alle richieste \u0027non semplici\u0027, cioè quelle che usano metodi come `PUT`/`DELETE`, header custom (es. `Authorization` impostato manualmente) o un `Content-Type` come `application/json`; con esso verifica in anticipo, via `Access-Control-Allow-Methods/Headers/Origin`, che l\u0027operazione sia permessa.\nLe altre opzioni: le richieste \u0027semplici\u0027 (GET/HEAD/POST con header e content-type basilari) non fanno preflight; il preflight non dipende da una precedente risposta `403` né dall\u0027uso di HTTP in chiaro.","en":"In summary: the browser prepends a preflight `OPTIONS` to \u0027non-simple\u0027 requests, that is those using methods like `PUT`/`DELETE`, custom headers (e.g. a manually set `Authorization`) or a `Content-Type` such as `application/json`; with it, it checks in advance, via `Access-Control-Allow-Methods/Headers/Origin`, that the operation is permitted.\nThe other options: \u0027simple\u0027 requests (GET/HEAD/POST with basic headers and content type) trigger no preflight; the preflight does not depend on a prior `403` response nor on the use of plain HTTP."}},{"type":"mcq","prompt":{"it":"A cosa serve l\u0027header ETag in una risposta HTTP?","en":"What is the ETag header for in an HTTP response?"},"code":"","options":[{"it":"A indicare la lingua della rappresentazione","en":"To indicate the language of the representation"},{"it":"A fornire un identificatore di versione della rappresentazione, usato dal client con If-None-Match per il caching condizionale","en":"To provide a version identifier for the representation, used by the client with If-None-Match for conditional caching"},{"it":"A specificare la dimensione in byte del corpo","en":"To specify the size in bytes of the body"},{"it":"A firmare crittograficamente la risorsa","en":"To cryptographically sign the resource"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027`ETag` è un identificatore opaco della versione corrente della rappresentazione; il client lo conserva e lo rimanda con `If-None-Match` (per il caching) o `If-Match` (per aggiornamenti condizionali/optimistic locking), evitando trasferimenti inutili o sovrascritture concorrenti.\nLe altre opzioni: la lingua è `Content-Language`, la dimensione è `Content-Length`, e l\u0027ETag non è una firma crittografica ma un semplice token di versione (spesso un hash del contenuto).","en":"In summary: the `ETag` is an opaque identifier of the current version of the representation; the client stores it and sends it back with `If-None-Match` (for caching) or `If-Match` (for conditional updates/optimistic locking), avoiding unnecessary transfers or concurrent overwrites.\nThe other options: the language is `Content-Language`, the size is `Content-Length`, and the ETag is not a cryptographic signature but simply a version token (often a hash of the content)."}},{"type":"code","prompt":{"it":"Il client aveva ricevuto una risorsa con ETag \"abc123\". Invia questa richiesta e nel frattempo la risorsa non è cambiata. Cosa risponde correttamente il server?","en":"The client had received a resource with ETag \"abc123\". It sends this request and in the meantime the resource has not changed. What does the server correctly respond?"},"code":"GET /accounts/42 HTTP/1.1\nHost: api.bank.com\nIf-None-Match: \"abc123\"","options":[{"it":"200 OK ripetendo l\u0027intera rappresentazione nel body","en":"200 OK, repeating the entire representation in the body"},{"it":"304 Not Modified senza body, così il client riusa la copia in cache","en":"304 Not Modified with no body, so the client reuses the cached copy"},{"it":"412 Precondition Failed","en":"412 Precondition Failed"},{"it":"204 No Content","en":"204 No Content"}],"correct":1,"explanation":{"it":"In sintesi: con `If-None-Match` su una `GET`, se l\u0027ETag corrente coincide con quello del client la risorsa non è cambiata e il server risponde `304 Not Modified` senza body, permettendo di riusare la copia in cache e risparmiare banda.\nLe altre opzioni: `200` con l\u0027intero body vanificherebbe il caching condizionale; `412 Precondition Failed` è la risposta tipica di `If-Match` su metodi non-safe quando la precondizione non è soddisfatta, non di una `GET` con `If-None-Match`; `204` non è la semantica del not-modified.","en":"In summary: with `If-None-Match` on a `GET`, if the current ETag matches the client\u0027s, the resource has not changed and the server responds `304 Not Modified` with no body, letting the client reuse the cached copy and save bandwidth.\nThe other options: `200` with the full body would defeat conditional caching; `412 Precondition Failed` is the typical response to `If-Match` on non-safe methods when the precondition is not met, not to a `GET` with `If-None-Match`; `204` is not the not-modified semantics."}}]},{"id":"testing","title":"Testing (JUnit / Mockito / TDD)","questions":[{"type":"mcq","prompt":{"it":"Secondo la piramide dei test, come dovrebbe essere distribuita la suite?","en":"According to the test pyramid, how should the suite be distributed?"},"code":"","options":[{"it":"Molti unit test veloci alla base, meno integration test nel mezzo, pochi E2E in cima","en":"Many fast unit tests at the base, fewer integration tests in the middle, few E2E tests at the top"},{"it":"Molti test E2E alla base, pochi unit test in cima","en":"Many E2E tests at the base, few unit tests at the top"},{"it":"Stesso numero di test a ogni livello per garantire equilibrio","en":"The same number of tests at every level to ensure balance"},{"it":"Solo integration test, perche\u0027 coprono sia le unita\u0027 sia il flusso completo","en":"Only integration tests, because they cover both the units and the full flow"}],"correct":0,"explanation":{"it":"In sintesi: la piramide dice di avere tanti unit test alla base, perche\u0027 sono veloci, isolati ed economici da mantenere, un numero medio di integration test nel mezzo, e pochi E2E in cima, perche\u0027 sono lenti, fragili e costosi. L\u0027obiettivo e\u0027 spostare il grosso della verifica verso il basso, dove il feedback e\u0027 immediato.\nLe altre opzioni: invertire la piramide (tanti E2E) e\u0027 l\u0027anti-pattern del \u0027gelato\u0027; distribuzione uguale ignora costo/velocita\u0027; solo integration test perde granularita\u0027 e feedback rapido.","en":"In summary: the pyramid says to have many unit tests at the base, because they are fast, isolated and cheap to maintain, a moderate number of integration tests in the middle, and few E2E tests at the top, because they are slow, brittle and expensive. The goal is to push the bulk of the verification toward the bottom, where feedback is immediate.\nThe other options: inverting the pyramid (many E2E tests) is the \u0027ice-cream cone\u0027 anti-pattern; an equal distribution ignores cost/speed; integration tests alone lose granularity and fast feedback."}},{"type":"truefalse","prompt":{"it":"Un test end-to-end e\u0027 tipicamente piu\u0027 veloce e piu\u0027 isolato di uno unit test.","en":"An end-to-end test is typically faster and more isolated than a unit test."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027affermazione e\u0027 falsa perche\u0027 un E2E attraversa l\u0027intero sistema (UI, rete, DB, servizi esterni), quindi e\u0027 intrinsecamente lento e poco isolato, esposto a flakiness; lo unit test gira in memoria su una singola unita\u0027 isolata ed e\u0027 l\u0027opposto, veloce e deterministico.\nLe altre opzioni: l\u0027errore tipico e\u0027 confondere \u0027copre piu\u0027 cose\u0027 con \u0027e\u0027 migliore/piu\u0027 veloce\u0027; l\u0027ampiezza di copertura di un E2E si paga proprio in velocita\u0027 e isolamento.","en":"In summary: the statement is false because an E2E test goes through the entire system (UI, network, DB, external services), so it is inherently slow and poorly isolated, exposed to flakiness; a unit test runs in memory against a single isolated unit and is the opposite, fast and deterministic.\nThe other options: the typical mistake is to confuse \u0027covers more\u0027 with \u0027is better/faster\u0027; the broad coverage of an E2E test is paid for precisely in speed and isolation."}},{"type":"mcq","prompt":{"it":"In JUnit 5, con il lifecycle di default (PER_METHOD), come deve essere un metodo annotato con @BeforeAll?","en":"In JUnit 5, with the default lifecycle (PER_METHOD), what must a method annotated with @BeforeAll be?"},"code":"","options":[{"it":"static","en":"static"},{"it":"Eseguito prima di ogni singolo @Test","en":"Executed before every single @Test"},{"it":"Un metodo di istanza qualsiasi, senza configurazione aggiuntiva","en":"Any instance method, with no additional configuration"},{"it":"Eseguito dopo tutti i @Test della classe","en":"Executed after all the class\u0027s @Test methods"}],"correct":0,"explanation":{"it":"In sintesi: con il lifecycle di default `PER_METHOD` JUnit crea una nuova istanza per ogni test, quindi `@BeforeAll` deve essere `static` per girare una sola volta prima di tutti i test; diventa non static solo se attivo `@TestInstance(PER_CLASS)`.\nLe altre opzioni: \u0027prima di ogni test\u0027 descrive `@BeforeEach`, non `@BeforeAll`; il metodo di istanza senza config non compila/e\u0027 rifiutato in PER_METHOD; \u0027dopo tutti i test\u0027 e\u0027 `@AfterAll`.","en":"In summary: with the default `PER_METHOD` lifecycle JUnit creates a new instance for each test, so `@BeforeAll` must be `static` to run only once before all tests; it can be non-static only if you enable `@TestInstance(PER_CLASS)`.\nThe other options: \u0027before every test\u0027 describes `@BeforeEach`, not `@BeforeAll`; a plain instance method with no configuration does not compile / is rejected under PER_METHOD; \u0027after all tests\u0027 is `@AfterAll`."}},{"type":"code","prompt":{"it":"Cosa succede eseguendo questo test?","en":"What happens when this test is run?"},"code":"@Test\nvoid test() {\n    assertThrows(ArithmeticException.class,\n        () -\u003e Integer.parseInt(\"abc\"));\n}","options":[{"it":"Il test passa perche\u0027 parseInt lancia comunque un\u0027eccezione","en":"The test passes because parseInt throws an exception anyway"},{"it":"Il test fallisce: viene lanciata NumberFormatException, non ArithmeticException","en":"The test fails: NumberFormatException is thrown, not ArithmeticException"},{"it":"Il test non compila","en":"The test does not compile"},{"it":"Il test viene ignorato perche\u0027 manca il messaggio atteso","en":"The test is skipped because the expected message is missing"}],"correct":1,"explanation":{"it":"In sintesi: `assertThrows` verifica che l\u0027eccezione lanciata sia del tipo atteso o di una sua sottoclasse; qui `Integer.parseInt(\"abc\")` lancia `NumberFormatException` (sottoclasse di `IllegalArgumentException`), che NON e\u0027 un\u0027`ArithmeticException`, quindi l\u0027assertion fallisce riportando il mismatch di tipo.\nLe altre opzioni: \u0027passa perche\u0027 lancia comunque\u0027 ignora che il tipo deve corrispondere; il codice compila; non c\u0027e\u0027 alcun meccanismo che ignori il test.","en":"In summary: `assertThrows` verifies that the thrown exception is of the expected type or a subclass of it; here `Integer.parseInt(\"abc\")` throws `NumberFormatException` (a subclass of `IllegalArgumentException`), which is NOT an `ArithmeticException`, so the assertion fails, reporting the type mismatch.\nThe other options: \u0027passes because it throws anyway\u0027 ignores that the type must match; the code compiles; there is no mechanism that skips the test."}},{"type":"mcq","prompt":{"it":"Qual e\u0027 la differenza principale tra un mock e uno spy in Mockito?","en":"What is the main difference between a mock and a spy in Mockito?"},"code":"","options":[{"it":"Il mock ha tutti i metodi stubbati e ritorna valori di default; lo spy avvolge un oggetto reale e chiama i metodi reali salvo stubbing esplicito","en":"A mock has all its methods stubbed and returns default values; a spy wraps a real object and calls the real methods unless explicitly stubbed"},{"it":"Lo spy non puo\u0027 mai essere verificato con verify()","en":"A spy can never be verified with verify()"},{"it":"Il mock chiama sempre i metodi reali dell\u0027oggetto originale","en":"A mock always calls the real methods of the original object"},{"it":"Mock e spy sono sinonimi, cambia solo il nome dell\u0027annotazione","en":"Mock and spy are synonyms, only the annotation name changes"}],"correct":0,"explanation":{"it":"In sintesi: un `mock` e\u0027 un doppio completo, tutti i metodi restituiscono i valori di default (null, 0, false, Optional vuoto) finche\u0027 non li stubbo; uno `spy` invece avvolge un\u0027istanza reale e delega ai metodi reali, tranne quelli che stubbo esplicitamente, tipicamente con `doReturn().when()`.\nLe altre opzioni: anche lo spy si verifica con `verify()`; il mock non chiama mai il codice reale; non sono sinonimi, hanno semantiche opposte sulla delega.","en":"In summary: a `mock` is a complete double, all its methods return default values (null, 0, false, empty Optional) until I stub them; a `spy` instead wraps a real instance and delegates to the real methods, except those I explicitly stub, typically with `doReturn().when()`.\nThe other options: a spy is also verified with `verify()`; a mock never calls the real code; they are not synonyms, they have opposite semantics regarding delegation."}},{"type":"code","prompt":{"it":"Cosa accade eseguendo questo codice?","en":"What happens when this code is run?"},"code":"List\u003cString\u003e spy = spy(new ArrayList\u003c\u003e());\nwhen(spy.get(0)).thenReturn(\"A\");","options":[{"it":"spy.get(0) restituira\u0027 correttamente \"A\"","en":"spy.get(0) will correctly return \"A\""},{"it":"Lancia IndexOutOfBoundsException: when(spy.get(0)) chiama il metodo reale get(0) su una lista vuota","en":"It throws IndexOutOfBoundsException: when(spy.get(0)) calls the real get(0) method on an empty list"},{"it":"Il codice non compila","en":"The code does not compile"},{"it":"Restituisce null senza errori","en":"It returns null without errors"}],"correct":1,"explanation":{"it":"In sintesi: con uno `spy` la sintassi `when(spy.get(0))` valuta prima l\u0027argomento, cioe\u0027 invoca davvero `get(0)` sull\u0027`ArrayList` vuoto, lanciando subito `IndexOutOfBoundsException`; e\u0027 il classico tranello dello spy, che si evita con la forma `doReturn(\"A\").when(spy).get(0)` che non esegue il metodo reale.\nLe altre opzioni: non arriva a restituire \"A\" ne\u0027 null perche\u0027 esplode allo stubbing; il codice compila regolarmente.","en":"In summary: with a `spy` the syntax `when(spy.get(0))` first evaluates the argument, i.e. it actually invokes `get(0)` on the empty `ArrayList`, immediately throwing `IndexOutOfBoundsException`; this is the classic spy pitfall, avoided with the `doReturn(\"A\").when(spy).get(0)` form, which does not execute the real method.\nThe other options: it never gets to return \"A\" or null because it blows up at stubbing time; the code compiles fine."}},{"type":"mcq","prompt":{"it":"A quante invocazioni corrisponde verify(mock).save(entity); senza specificare un VerificationMode?","en":"How many invocations does verify(mock).save(entity); correspond to when no VerificationMode is specified?"},"code":"","options":[{"it":"Esattamente una, equivale a verify(mock, times(1)).save(entity)","en":"Exactly one, equivalent to verify(mock, times(1)).save(entity)"},{"it":"Almeno una invocazione","en":"At least one invocation"},{"it":"Qualsiasi numero di invocazioni, incluso zero","en":"Any number of invocations, including zero"},{"it":"Esattamente zero invocazioni","en":"Exactly zero invocations"}],"correct":0,"explanation":{"it":"In sintesi: `verify(mock)` senza modalita\u0027 usa il default `times(1)`, quindi verifica che il metodo sia stato invocato esattamente una volta, ne\u0027 di piu\u0027 ne\u0027 di meno.\nLe altre opzioni: \u0027almeno una\u0027 e\u0027 `atLeastOnce()`; \u0027qualsiasi numero\u0027 non e\u0027 il default e comunque si esprime con `atLeast(0)`; \u0027esattamente zero\u0027 e\u0027 `never()`.","en":"In summary: `verify(mock)` without a mode uses the default `times(1)`, so it verifies that the method was invoked exactly once, no more and no less.\nThe other options: \u0027at least one\u0027 is `atLeastOnce()`; \u0027any number\u0027 is not the default and is in any case expressed with `atLeast(0)`; \u0027exactly zero\u0027 is `never()`."}},{"type":"truefalse","prompt":{"it":"Una code coverage del 100% garantisce che il codice sia privo di bug.","en":"100% code coverage guarantees that the code is bug-free."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027affermazione e\u0027 falsa perche\u0027 la coverage misura solo quali righe/rami vengono eseguiti dai test, non se le asserzioni verificano il comportamento giusto; posso avere 100% di copertura con test senza assert, o che non coprono i casi limite e i dati che scatenano il bug.\nLe altre opzioni: l\u0027errore tipico e\u0027 trattare la coverage come metrica di qualita\u0027 anziche\u0027 di esecuzione; e\u0027 una condizione necessaria ma non sufficiente.","en":"In summary: the statement is false because coverage only measures which lines/branches are executed by the tests, not whether the assertions verify the right behavior; you can have 100% coverage with tests that have no assertions, or that do not cover the edge cases and the data that trigger the bug.\nThe other options: the typical mistake is treating coverage as a quality metric rather than an execution metric; it is a necessary but not sufficient condition."}},{"type":"mcq","prompt":{"it":"Nel pattern AAA (Arrange-Act-Assert), in cosa consiste la fase \u0027Act\u0027?","en":"In the AAA pattern (Arrange-Act-Assert), what does the \u0027Act\u0027 phase consist of?"},"code":"","options":[{"it":"Nell\u0027invocazione del metodo o comportamento sotto test","en":"Invoking the method or behavior under test"},{"it":"Nella preparazione di dati, dipendenze e stubbing","en":"Preparing data, dependencies and stubbing"},{"it":"Nella verifica del risultato atteso","en":"Verifying the expected result"},{"it":"Nella pulizia delle risorse dopo il test","en":"Cleaning up resources after the test"}],"correct":0,"explanation":{"it":"In sintesi: nel pattern AAA la fase \u0027Act\u0027 e\u0027 l\u0027azione centrale del test, cioe\u0027 la singola invocazione del metodo sotto test; idealmente e\u0027 una sola riga, netta e ben separata da preparazione e verifica.\nLe altre opzioni: la preparazione e\u0027 \u0027Arrange\u0027; la verifica del risultato e\u0027 \u0027Assert\u0027; la pulizia risorse e\u0027 teardown (`@AfterEach`), fuori dal ciclo AAA.","en":"In summary: in the AAA pattern the \u0027Act\u0027 phase is the central action of the test, i.e. the single invocation of the method under test; ideally it is a single line, clean and clearly separated from setup and verification.\nThe other options: the setup is \u0027Arrange\u0027; verifying the result is \u0027Assert\u0027; cleaning up resources is teardown (`@AfterEach`), outside the AAA cycle."}},{"type":"code","prompt":{"it":"A cosa serve principalmente ArgumentCaptor in questo test?","en":"What is ArgumentCaptor mainly used for in this test?"},"code":"ArgumentCaptor\u003cUser\u003e captor = ArgumentCaptor.forClass(User.class);\nservice.register(\"mario\");\nverify(repository).save(captor.capture());\nassertEquals(\"mario\", captor.getValue().getName());","options":[{"it":"A catturare l\u0027argomento realmente passato al mock per poterci fare asserzioni","en":"To capture the argument actually passed to the mock so that assertions can be made on it"},{"it":"A definire il valore di ritorno del metodo save","en":"To define the return value of the save method"},{"it":"A contare quante volte save e\u0027 stato invocato","en":"To count how many times save was invoked"},{"it":"A creare automaticamente un nuovo mock del repository","en":"To automatically create a new mock of the repository"}],"correct":0,"explanation":{"it":"In sintesi: `ArgumentCaptor` cattura l\u0027oggetto effettivamente passato al mock durante la verifica, cosi\u0027 con `getValue()` posso ispezionarlo e asserire sui suoi campi; e\u0027 utile quando l\u0027argomento e\u0027 costruito internamente al metodo sotto test e non lo conosco a priori.\nLe altre opzioni: il valore di ritorno si definisce con `thenReturn`; il conteggio si fa con `times(n)`; il captor non crea mock, li crea `mock()`/`@Mock`.","en":"In summary: `ArgumentCaptor` captures the object actually passed to the mock during verification, so with `getValue()` I can inspect it and assert on its fields; it is useful when the argument is built inside the method under test and I don\u0027t know it in advance.\nThe other options: the return value is defined with `thenReturn`; counting is done with `times(n)`; the captor does not create mocks, `mock()`/`@Mock` do."}},{"type":"mcq","prompt":{"it":"Cosa fa l\u0027annotazione @InjectMocks di Mockito?","en":"What does Mockito\u0027s @InjectMocks annotation do?"},"code":"","options":[{"it":"Crea un\u0027istanza della classe sotto test e vi inietta i campi annotati con @Mock","en":"It creates an instance of the class under test and injects into it the fields annotated with @Mock"},{"it":"Trasforma la classe annotata in un mock","en":"It turns the annotated class into a mock"},{"it":"Inietta i mock nel contesto di Spring al posto dei bean reali","en":"It injects the mocks into the Spring context in place of the real beans"},{"it":"Verifica automaticamente tutte le interazioni sui mock","en":"It automatically verifies all interactions on the mocks"}],"correct":0,"explanation":{"it":"In sintesi: `@InjectMocks` istanzia la classe reale sotto test e vi inietta le dipendenze dichiarate con `@Mock`, tramite costruttore, setter o field injection; e\u0027 il modo per assemblare il SUT con i suoi doppi senza wiring manuale.\nLe altre opzioni: non crea un mock della classe, la istanzia davvero; non ha nulla a che fare con il contesto Spring (li\u0027 si usa `@MockBean`); non verifica interazioni, quello e\u0027 `verify`.","en":"In summary: `@InjectMocks` instantiates the real class under test and injects into it the dependencies declared with `@Mock`, via constructor, setter or field injection; it is the way to assemble the SUT with its doubles without manual wiring.\nThe other options: it does not create a mock of the class, it actually instantiates it; it has nothing to do with the Spring context (there you use `@MockBean`); it does not verify interactions, that is `verify`."}},{"type":"truefalse","prompt":{"it":"Un test che dipende da LocalDateTime.now() o da Math.random() rispetta il principio di determinismo/ripetibilita\u0027 dei test.","en":"A test that depends on LocalDateTime.now() or Math.random() respects the determinism/repeatability principle of tests."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027affermazione e\u0027 falsa perche\u0027 `now()` e `random()` introducono non-determinismo: lo stesso test puo\u0027 passare o fallire in run diversi, violando la \u0027R\u0027 di Repeatable in FIRST; la soluzione e\u0027 iniettare un `Clock` o un generatore controllabile cosi\u0027 da fissare l\u0027input.\nLe altre opzioni: l\u0027errore tipico e\u0027 pensare che \u0027di solito passa\u0027 basti; un test deve dare lo stesso esito a ogni esecuzione, indipendentemente da orario o caso.","en":"In summary: the statement is false because `now()` and `random()` introduce non-determinism: the same test can pass or fail on different runs, violating the \u0027R\u0027 for Repeatable in FIRST; the solution is to inject a `Clock` or a controllable generator so as to fix the input.\nThe other options: the typical mistake is thinking that \u0027it usually passes\u0027 is enough; a test must give the same result on every run, regardless of the time or chance."}},{"type":"mcq","prompt":{"it":"Nell\u0027acronimo FIRST dei test, cosa rappresenta la lettera \u0027I\u0027?","en":"In the FIRST acronym for tests, what does the letter \u0027I\u0027 stand for?"},"code":"","options":[{"it":"Isolated/Independent: i test non dipendono l\u0027uno dall\u0027altro ne\u0027 dall\u0027ordine di esecuzione","en":"Isolated/Independent: tests do not depend on one another or on the order of execution"},{"it":"Integrated: ogni test deve integrare piu\u0027 componenti reali","en":"Integrated: each test must integrate several real components"},{"it":"Immutable: i test non devono mai essere modificati","en":"Immutable: tests must never be modified"},{"it":"Interactive: i test richiedono input dall\u0027utente","en":"Interactive: tests require input from the user"}],"correct":0,"explanation":{"it":"In sintesi: in FIRST la \u0027I\u0027 sta per Isolated/Independent, cioe\u0027 ogni test e\u0027 autonomo, non condivide stato con gli altri e da\u0027 lo stesso risultato a prescindere dall\u0027ordine di esecuzione; le altre lettere sono Fast, Repeatable, Self-validating, Timely.\nLe altre opzioni: \u0027Integrated\u0027 e\u0027 l\u0027opposto dell\u0027isolamento voluto; \u0027Immutable\u0027 e \u0027Interactive\u0027 non fanno parte dell\u0027acronimo e contraddicono la natura automatica dei test.","en":"In summary: in FIRST the \u0027I\u0027 stands for Isolated/Independent, meaning each test is self-contained, shares no state with the others and gives the same result regardless of the order of execution; the other letters are Fast, Repeatable, Self-validating, Timely.\nThe other options: \u0027Integrated\u0027 is the opposite of the intended isolation; \u0027Immutable\u0027 and \u0027Interactive\u0027 are not part of the acronym and contradict the automated nature of tests."}},{"type":"mcq","prompt":{"it":"Nel ciclo TDD red-green-refactor, cosa si fa nella fase \u0027green\u0027?","en":"In the TDD red-green-refactor cycle, what do you do in the \u0027green\u0027 phase?"},"code":"","options":[{"it":"Si scrive il codice di produzione minimo necessario per far passare il test","en":"You write the minimal production code needed to make the test pass"},{"it":"Si scrive un nuovo test che fallisce","en":"You write a new test that fails"},{"it":"Si migliora il design del codice senza cambiarne il comportamento","en":"You improve the code\u0027s design without changing its behavior"},{"it":"Si eliminano i test che rallentano la build","en":"You remove the tests that slow down the build"}],"correct":0,"explanation":{"it":"In sintesi: nel ciclo TDD si parte da \u0027red\u0027 scrivendo un test che fallisce, poi in \u0027green\u0027 si aggiunge il codice minimo che lo fa passare (anche brutto), e infine in \u0027refactor\u0027 si migliora il design con la rete di sicurezza dei test verdi.\nLe altre opzioni: scrivere un test che fallisce e\u0027 \u0027red\u0027; migliorare il design a comportamento invariato e\u0027 \u0027refactor\u0027; eliminare test non fa parte del ciclo.","en":"In summary: in the TDD cycle you start from \u0027red\u0027 by writing a test that fails, then in \u0027green\u0027 you add the minimal code that makes it pass (even ugly code), and finally in \u0027refactor\u0027 you improve the design with the safety net of the passing tests.\nThe other options: writing a test that fails is \u0027red\u0027; improving the design with unchanged behavior is \u0027refactor\u0027; removing tests is not part of the cycle."}},{"type":"code","prompt":{"it":"Quante volte viene eseguito questo test e come?","en":"How many times is this test run, and how?"},"code":"@ParameterizedTest\n@ValueSource(ints = {2, 4, 6})\nvoid isEven(int n) {\n    assertTrue(n % 2 == 0);\n}","options":[{"it":"Tre volte, una per ogni valore della sorgente (2, 4, 6)","en":"Three times, once for each value of the source (2, 4, 6)"},{"it":"Una sola volta, usando solo l\u0027ultimo valore","en":"Only once, using only the last value"},{"it":"Non compila perche\u0027 manca anche @Test","en":"It does not compile because @Test is also missing"},{"it":"Tre volte, ma condividendo lo stesso valore per tutte le esecuzioni","en":"Three times, but sharing the same value for all executions"}],"correct":0,"explanation":{"it":"In sintesi: `@ParameterizedTest` con `@ValueSource(ints = {2,4,6})` esegue il metodo una volta per ogni valore, quindi tre invocazioni distinte, ciascuna con il proprio `n`; ogni ripetizione appare come caso separato nel report.\nLe altre opzioni: non usa solo l\u0027ultimo valore; `@ParameterizedTest` sostituisce `@Test`, quindi non serve aggiungerlo (anzi non va messo); i valori non sono condivisi, cambiano a ogni run.","en":"In summary: `@ParameterizedTest` with `@ValueSource(ints = {2,4,6})` runs the method once for each value, so three distinct invocations, each with its own `n`; each repetition appears as a separate case in the report.\nThe other options: it does not use only the last value; `@ParameterizedTest` replaces `@Test`, so there is no need to add it (in fact it must not be added); the values are not shared, they change on each run."}},{"type":"mcq","prompt":{"it":"Secondo la classificazione di Fowler/Meszaros, qual e\u0027 la differenza tra uno stub e un mock?","en":"According to the Fowler/Meszaros classification, what is the difference between a stub and a mock?"},"code":"","options":[{"it":"Lo stub fornisce risposte predefinite (state verification); il mock verifica le interazioni attese (behavior verification)","en":"A stub provides predefined responses (state verification); a mock verifies the expected interactions (behavior verification)"},{"it":"Lo stub verifica le chiamate ricevute, il mock si limita a fornire dati","en":"A stub verifies the calls received, a mock merely provides data"},{"it":"Sono esattamente la stessa cosa con due nomi diversi","en":"They are exactly the same thing under two different names"},{"it":"Lo stub e\u0027 sempre piu\u0027 veloce del mock a runtime","en":"A stub is always faster than a mock at runtime"}],"correct":0,"explanation":{"it":"In sintesi: lo stub e\u0027 un doppio che fornisce risposte \u0027pilotate\u0027 per far procedere il test, e si verifica lo stato del risultato; il mock ha invece aspettative sulle interazioni e fallisce se le chiamate attese non avvengono come previsto, quindi fa behavior verification.\nLe altre opzioni: \u0027stub verifica le chiamate\u0027 inverte i ruoli; non sono sinonimi (sono test double diversi); la differenza e\u0027 concettuale, non di performance.","en":"In summary: a stub is a double that provides \u0027canned\u0027 responses to let the test proceed, and you verify the state of the result; a mock instead has expectations about the interactions and fails if the expected calls do not happen as planned, so it does behavior verification.\nThe other options: \u0027a stub verifies the calls\u0027 reverses the roles; they are not synonyms (they are different test doubles); the difference is conceptual, not one of performance."}},{"type":"truefalse","prompt":{"it":"@DataJpaTest carica l\u0027intero contesto applicativo di Spring Boot, inclusi i bean @Service e @Controller.","en":"@DataJpaTest loads the entire Spring Boot application context, including @Service and @Controller beans."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027affermazione e\u0027 falsa perche\u0027 `@DataJpaTest` e\u0027 uno slice test che configura solo il layer di persistenza JPA (repository, `EntityManager`, DataSource, di default un DB in-memory) e non registra `@Service` o `@Controller`; per l\u0027intero contesto serve `@SpringBootTest`.\nLe altre opzioni: l\u0027errore tipico e\u0027 confondere gli slice test con il full context; gli slice caricano deliberatamente solo una fetta dell\u0027applicazione per restare rapidi e mirati.","en":"In summary: the statement is false because `@DataJpaTest` is a slice test that configures only the JPA persistence layer (repositories, `EntityManager`, DataSource, by default an in-memory DB) and does not register `@Service` or `@Controller` beans; for the full context you need `@SpringBootTest`.\nThe other options: the typical mistake is to confuse slice tests with the full context; slice tests deliberately load only a slice of the application to stay fast and focused."}},{"type":"code","prompt":{"it":"Entrambi i test passano? Il lifecycle e\u0027 quello di default di JUnit 5.","en":"Do both tests pass? The lifecycle is the JUnit 5 default."},"code":"class CounterTest {\n    int counter = 0;\n    @BeforeEach void setup() { counter++; }\n    @Test void a() { assertEquals(1, counter); }\n    @Test void b() { assertEquals(1, counter); }\n}","options":[{"it":"Si\u0027: JUnit crea una nuova istanza per ogni test, quindi counter vale sempre 1","en":"Yes: JUnit creates a new instance for each test, so counter is always 1"},{"it":"No: nel secondo test counter vale 2","en":"No: in the second test counter is 2"},{"it":"No: counter resta 0 perche\u0027 setup non viene eseguito","en":"No: counter stays 0 because setup is not executed"},{"it":"Il codice non compila","en":"The code does not compile"}],"correct":0,"explanation":{"it":"In sintesi: con il lifecycle di default `PER_METHOD` JUnit 5 istanzia una nuova copia della classe di test per ogni metodo, quindi `counter` riparte da 0 e `@BeforeEach` lo porta a 1 prima di ciascun test; entrambe le asserzioni passano. E\u0027 proprio questo isolamento tra istanze a garantire l\u0027indipendenza dei test.\nLe altre opzioni: \u0027counter vale 2\u0027 assume un\u0027istanza condivisa, vero solo con `@TestInstance(PER_CLASS)`; `@BeforeEach` viene eseguito; il codice compila.","en":"In summary: with the default `PER_METHOD` lifecycle JUnit 5 instantiates a fresh copy of the test class for each method, so `counter` starts again from 0 and `@BeforeEach` brings it to 1 before each test; both assertions pass. It is precisely this isolation between instances that guarantees test independence.\nThe other options: \u0027counter is 2\u0027 assumes a shared instance, true only with `@TestInstance(PER_CLASS)`; `@BeforeEach` is executed; the code compiles."}},{"type":"mcq","prompt":{"it":"Vuoi verificare che un metodo del mock NON sia mai stato invocato. Quale forma usi?","en":"You want to verify that a mock\u0027s method was never invoked. Which form do you use?"},"code":"","options":[{"it":"verify(mock, never()).method()","en":"verify(mock, never()).method()"},{"it":"verify(mock, times(1)).method()","en":"verify(mock, times(1)).method()"},{"it":"verifyZero(mock).method()","en":"verifyZero(mock).method()"},{"it":"assertFalse(mock.method())","en":"assertFalse(mock.method())"}],"correct":0,"explanation":{"it":"In sintesi: per asserire zero invocazioni si usa `verify(mock, never()).method()`, equivalente a `times(0)`; in alternativa, per tutto il mock, `verifyNoInteractions(mock)`.\nLe altre opzioni: `times(1)` verifica esattamente una chiamata; `verifyZero(...)` non esiste in Mockito; `assertFalse(mock.method())` invoca davvero il metodo e testa il valore, non l\u0027assenza di interazione.","en":"In summary: to assert zero invocations you use `verify(mock, never()).method()`, equivalent to `times(0)`; alternatively, for the whole mock, `verifyNoInteractions(mock)`.\nThe other options: `times(1)` verifies exactly one call; `verifyZero(...)` does not exist in Mockito; `assertFalse(mock.method())` actually invokes the method and tests its value, not the absence of interaction."}},{"type":"code","prompt":{"it":"Qual e\u0027 il comportamento risultante da questo stubbing?","en":"What is the resulting behavior of this stubbing?"},"code":"when(repo.findById(1L)).thenThrow(new EntityNotFoundException());\n// ...\nOptional\u003cUser\u003e u = repo.findById(1L);","options":[{"it":"La chiamata a repo.findById(1L) lancia EntityNotFoundException","en":"The call to repo.findById(1L) throws EntityNotFoundException"},{"it":"repo.findById(1L) restituisce Optional vuoto senza eccezioni","en":"repo.findById(1L) returns an empty Optional without exceptions"},{"it":"L\u0027eccezione viene lanciata subito alla riga di stubbing, non alla chiamata","en":"The exception is thrown immediately at the stubbing line, not at the call"},{"it":"Non compila: non si possono stubbare eccezioni con thenThrow","en":"It does not compile: exceptions cannot be stubbed with thenThrow"}],"correct":0,"explanation":{"it":"In sintesi: `thenThrow` configura il mock affinche\u0027, quando viene chiamato `findById(1L)` con quell\u0027argomento, lanci l\u0027eccezione indicata; l\u0027eccezione scatta all\u0027invocazione stubbata, non prima. E\u0027 il modo standard per simulare percorsi di errore delle dipendenze.\nLe altre opzioni: non ritorna un Optional vuoto perche\u0027 e\u0027 stubbato a lanciare; l\u0027eccezione non viene lanciata alla riga di setup ma alla chiamata; `thenThrow` esiste ed e\u0027 proprio per questo.","en":"In summary: `thenThrow` configures the mock so that, when `findById(1L)` is called with that argument, it throws the given exception; the exception fires at the stubbed invocation, not before. It is the standard way to simulate the error paths of dependencies.\nThe other options: it does not return an empty Optional because it is stubbed to throw; the exception is not thrown at the setup line but at the call; `thenThrow` exists and is meant precisely for this."}},{"type":"mcq","prompt":{"it":"Quale di questi e\u0027 propriamente uno unit test?","en":"Which of these is properly a unit test?"},"code":"","options":[{"it":"Testa una singola classe isolando le sue dipendenze con dei mock","en":"It tests a single class, isolating its dependencies with mocks"},{"it":"Testa il flusso completo dal controller fino al database reale","en":"It tests the full flow from the controller down to the real database"},{"it":"Avvia l\u0027intero contesto Spring Boot e chiama endpoint REST via HTTP","en":"It starts the entire Spring Boot context and calls REST endpoints over HTTP"},{"it":"Chiama un servizio esterno di terze parti attraverso la rete","en":"It calls an external third-party service over the network"}],"correct":0,"explanation":{"it":"In sintesi: uno unit test esercita una singola unita\u0027 (tipicamente una classe) in isolamento, sostituendo le collaborazioni con doppi come i mock, cosi\u0027 resta veloce, deterministico e mirato sul comportamento di quella logica.\nLe altre opzioni: flusso controller-DB reale e contesto Spring completo sono integration/E2E; la chiamata a un servizio esterno via rete introduce dipendenze non isolate, tipiche dei test di integrazione.","en":"In summary: a unit test exercises a single unit (typically a class) in isolation, replacing its collaborators with doubles such as mocks, so it stays fast, deterministic and focused on the behavior of that logic.\nThe other options: the controller-to-real-DB flow and the full Spring context are integration/E2E tests; calling an external service over the network introduces non-isolated dependencies, typical of integration tests."}},{"type":"truefalse","prompt":{"it":"In Mockito, when(mock.metodoVoid()).thenReturn(...) non compila per un metodo void; per i metodi void si usano forme come doThrow/doNothing/doAnswer.","en":"In Mockito, when(mock.voidMethod()).thenReturn(...) does not compile for a void method; for void methods you use forms such as doThrow/doNothing/doAnswer."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027affermazione e\u0027 vera perche\u0027 `when(...)` richiede un\u0027espressione con valore, ma un metodo `void` non ne produce, quindi non lo si puo\u0027 passare come argomento e il codice non compila; per stubbare i void si usa la famiglia `doNothing()/doThrow()/doAnswer().when(mock).metodo()`.\nLe altre opzioni: l\u0027errore tipico e\u0027 provare la sintassi `when(...).thenReturn()` sui void; per i void serve la forma `do*().when()` che stubba senza invocare realmente il metodo.","en":"In summary: the statement is true because `when(...)` requires an expression that has a value, but a `void` method produces none, so it cannot be passed as an argument and the code does not compile; to stub void methods you use the `doNothing()/doThrow()/doAnswer().when(mock).method()` family.\nThe other options: the typical mistake is to try the `when(...).thenReturn()` syntax on void methods; for void methods you need the `do*().when()` form, which stubs without actually invoking the method."}},{"type":"code","prompt":{"it":"Cosa succede eseguendo questa asserzione in JUnit 5?","en":"What happens when this assertion is run in JUnit 5?"},"code":"@Test\nvoid sum() {\n    assertEquals(0.3, 0.1 + 0.2);\n}","options":[{"it":"Il test fallisce per l\u0027errore di arrotondamento in virgola mobile; serve la variante con delta","en":"The test fails due to floating-point rounding error; the variant with a delta is needed"},{"it":"Il test passa perche\u0027 0.1 + 0.2 e\u0027 esattamente 0.3","en":"The test passes because 0.1 + 0.2 is exactly 0.3"},{"it":"Il codice non compila","en":"The code does not compile"},{"it":"Il test viene ignorato perche\u0027 i double non sono confrontabili","en":"The test is skipped because doubles are not comparable"}],"correct":0,"explanation":{"it":"In sintesi: in aritmetica IEEE 754 `0.1 + 0.2` da\u0027 `0.30000000000000004`, quindi `assertEquals(double, double)` senza tolleranza confronta valori diversi e il test fallisce; per i double si usa l\u0027overload con `delta`, es. `assertEquals(0.3, 0.1 + 0.2, 1e-9)`.\nLe altre opzioni: non passa perche\u0027 la somma non e\u0027 esattamente 0.3; il codice compila (l\u0027overload double esiste); il test non viene affatto ignorato.","en":"In summary: in IEEE 754 arithmetic `0.1 + 0.2` gives `0.30000000000000004`, so `assertEquals(double, double)` without a tolerance compares different values and the test fails; for doubles you use the overload with a `delta`, e.g. `assertEquals(0.3, 0.1 + 0.2, 1e-9)`.\nThe other options: it does not pass because the sum is not exactly 0.3; the code compiles (the double overload exists); the test is not skipped at all."}},{"type":"mcq","prompt":{"it":"Per cosa e\u0027 indicato lo s
