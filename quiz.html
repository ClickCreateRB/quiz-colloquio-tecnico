<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Colloquio Tecnico</title>
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1b2436; --card2:#212c42;
    --ink:#e7ecf5; --mut:#9aa7bd; --line:#2c374e;
    --acc:#4f8cff; --acc2:#3a6fd8;
    --ok:#3ecf8e; --okbg:#123024; --ko:#ff6b6b; --kobg:#331a1c;
    --good:#3ecf8e; --mid:#f7b955; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1a2740 0, transparent 60%), var(--bg);
    color:var(--ink);
    font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:820px;margin:0 auto;padding:28px 18px 80px}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:.3px}
  .sub{color:var(--mut);margin:0}
  .hero{text-align:center;margin:8px 0 22px}
  .res-hero{text-align:center;margin:10px 0 22px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin-bottom:20px}
  .opt-row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
  .opt-row label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .opt-row .chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
  select{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px}
  input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .card{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;color:var(--ink);transition:.15s;font:inherit}
  .card:hover{border-color:var(--acc);transform:translateY(-2px);background:var(--card2)}
  .card-t{font-size:16px;font-weight:600;margin-bottom:6px}
  .card-m{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
  .badge{background:var(--okbg);color:var(--ok);border:1px solid #1f5b41;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}

  .mixed{margin-top:16px}
  .btn-mixed{width:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border:0;color:#fff;font:inherit;font-weight:600;font-size:15px;padding:14px;border-radius:12px;cursor:pointer}
  .btn-mixed:hover{filter:brightness(1.08)}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:26px}

  .quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .qtitle{font-weight:600;flex:1;text-align:center}
  .qcount{color:var(--mut);font-variant-numeric:tabular-nums;font-size:14px}
  .link{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit}
  .bar{height:6px;background:var(--card);border-radius:6px;overflow:hidden;margin-bottom:18px}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .25s}

  .qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .qtype{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--acc);background:#16233f;border:1px solid #294066;padding:3px 10px;border-radius:20px;margin-bottom:12px}
  .qprompt{font-size:17px;line-height:1.5;margin-bottom:14px}
  pre.code{background:#0b1120;border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;margin:0 0 16px}
  pre.code code{font:13px/1.5 "SF Mono",Consolas,Menlo,monospace;color:#d6e2ff;white-space:pre}
  code.ic{background:#0b1120;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font:12px/1.45 "SF Mono",Consolas,Menlo,monospace;color:#d6e2ff}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:flex-start;gap:12px;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit;transition:.12s}
  .opt:hover:not([disabled]){border-color:var(--acc)}
  .opt .mark{flex:0 0 24px;height:24px;border-radius:6px;background:#28324a;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .opt .otext{padding-top:1px}
  .opt.sel{border-color:var(--acc);background:#1c2c4c}
  .opt.correct{border-color:var(--ok);background:var(--okbg)}
  .opt.correct .mark{background:var(--ok);color:#062416}
  .opt.wrong{border-color:var(--ko);background:var(--kobg)}
  .opt.wrong .mark{background:var(--ko);color:#2a0b0b}
  .opt[disabled]{cursor:default;opacity:1}

  .expl{margin-top:16px;background:#0d1526;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:12px 14px}
  .expl strong{display:block;margin-bottom:6px}
  .expl p{margin:0;color:#cdd7ea}

  .nav{display:flex;align-items:center;margin-top:18px}
  .spacer{flex:1}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--ink);font:inherit;padding:11px 18px;border-radius:10px;cursor:pointer}
  .btn:hover:not([disabled]){border-color:var(--acc)}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}

  .score{font-size:54px;font-weight:800;line-height:1}
  .score.good{color:var(--good)} .score.mid{color:var(--mid)} .score.bad{color:var(--bad)}
  .score-d{color:var(--mut);margin-top:6px}
  .res-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:22px}

  .review{display:flex;flex-direction:column;gap:12px}
  .rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;border-left:4px solid var(--line)}
  .rev.is-ok{border-left-color:var(--ok)}
  .rev.is-ko{border-left-color:var(--ko)}
  .rev-h{display:flex;gap:12px;margin-bottom:10px}
  .rev-n{flex:0 0 26px;height:26px;border-radius:7px;background:#28324a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .rev-q{font-size:15px;font-weight:600;padding-top:2px}
  .r-line{padding:7px 11px;border-radius:8px;margin-bottom:7px;font-size:14px}
  .r-line.ok{background:var(--okbg);color:var(--ok)}
  .r-line.ko{background:var(--kobg);color:var(--ko)}
  .r-line.good{background:#0d2a1e;color:var(--ok);border:1px solid #1f5b41}
  .r-expl{color:#cdd7ea;font-size:14px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
  .empty{color:var(--mut);text-align:center;padding:30px}
</style>

<div id="app"></div>

<script id="quiz-data" type="application/json">{"modules":[{"id":"java-core","title":"Java Core \u0026 OOP","questions":[{"type":"code","prompt":{"it":"Cosa stampa il seguente codice?","en":"What does the following code print?"},"code":"Integer a = 127;\nInteger b = 127;\nInteger c = 128;\nInteger d = 128;\nSystem.out.println((a == b) + \" \" + (c == d));","options":[{"it":"true true","en":"true true"},{"it":"true false","en":"true false"},{"it":"false false","en":"false false"},{"it":"false true","en":"false true"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027autoboxing di un `int` letterale passa da `Integer.valueOf`, che mantiene una cache condivisa per i valori da -128 a 127. `a` e `b` valgono 127, quindi puntano allo stesso oggetto in cache e `a == b` e\u0027 `true`; 128 e\u0027 fuori range, percio\u0027 `c` e `d` sono due oggetti distinti sull\u0027heap e `c == d` e\u0027 `false`, perche\u0027 `==` sui wrapper confronta i riferimenti, non il valore numerico. Il risultato e\u0027 quindi `true false`.\nLe altre opzioni: `true true` ignora che 128 esce dalla cache; `false false` ignora la cache; `false true` inverte entrambi i casi.","en":"In summary: autoboxing of an `int` literal goes through `Integer.valueOf`, which keeps a shared cache for values from -128 to 127. `a` and `b` are 127, so they point to the same cached object and `a == b` is `true`; 128 is out of range, so `c` and `d` are two distinct objects on the heap and `c == d` is `false`, because `==` on wrappers compares references, not the numeric value. The result is therefore `true false`.\nThe other options: `true true` overlooks that 128 falls outside the cache; `false false` ignores the cache; `false true` inverts both cases."}},{"type":"code","prompt":{"it":"Cosa succede eseguendo questo codice?","en":"What happens when this code runs?"},"code":"Map\u003cString, Integer\u003e counts = new HashMap\u003c\u003e();\nint total = counts.get(\"missing\");\nSystem.out.println(total);","options":[{"it":"Stampa 0","en":"Prints 0"},{"it":"Stampa null","en":"Prints null"},{"it":"Lancia NullPointerException","en":"Throws NullPointerException"},{"it":"Errore di compilazione","en":"Compilation error"}],"correct":2,"explanation":{"it":"In sintesi: `counts.get(\"missing\")` su una chiave assente restituisce `null` di tipo `Integer`; assegnarlo a un `int` primitivo impone l\u0027unboxing, cioe\u0027 una chiamata implicita a `null.intValue()`, che lancia `NullPointerException` a runtime. E\u0027 il classico bug da autoboxing con le `Map`, evitabile con `getOrDefault(\"missing\", 0)`.\nLe altre opzioni: non stampa 0 (quello e\u0027 il default di un campo, non l\u0027esito dell\u0027unboxing di `null`) ne\u0027 `null` (una variabile `int` non puo\u0027 valere `null`); e compila senza errori, quindi non c\u0027e\u0027 errore di compilazione.","en":"In summary: `counts.get(\"missing\")` on an absent key returns `null` of type `Integer`; assigning it to a primitive `int` forces unboxing, i.e. an implicit call to `null.intValue()`, which throws `NullPointerException` at runtime. This is the classic autoboxing bug with `Map`s, avoidable with `getOrDefault(\"missing\", 0)`.\nThe other options: it doesn\u0027t print 0 (that\u0027s a field\u0027s default, not the result of unboxing `null`) nor `null` (an `int` variable cannot be `null`); and it compiles without errors, so there is no compilation error."}},{"type":"truefalse","prompt":{"it":"In Java gli oggetti String sono immutabili: ogni operazione che sembra \u0027modificare\u0027 una String in realta\u0027 ne produce una nuova, lasciando invariato l\u0027oggetto originale.","en":"In Java, String objects are immutable: every operation that appears to \u0027modify\u0027 a String actually produces a new one, leaving the original object unchanged."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 Vero. `String` e\u0027 immutabile per progettazione, il suo stato interno non e\u0027 alterabile dopo la costruzione; metodi come `substring`, `replace`, `toUpperCase` o `concat` restituiscono sempre una nuova `String` lasciando intatto l\u0027originale. Questa proprieta\u0027 garantisce thread-safety, consente il caching dell\u0027`hashCode` e rende sicuro lo string pool, dove piu\u0027 riferimenti condividono lo stesso letterale; per una sequenza modificabile si usa `StringBuilder`.\nLe altre opzioni: dire Falso e\u0027 l\u0027errore tipico di chi crede che metodi come `replace` modifichino l\u0027oggetto in place, quando invece ne producono uno nuovo.","en":"In summary: it\u0027s True. `String` is immutable by design; its internal state cannot be altered after construction, and methods like `substring`, `replace`, `toUpperCase` or `concat` always return a new `String`, leaving the original intact. This property guarantees thread-safety, allows caching of the `hashCode`, and makes the string pool safe, where multiple references share the same literal; for a mutable sequence you use `StringBuilder`.\nThe other options: saying False is the typical mistake of those who believe methods like `replace` modify the object in place, when in fact they produce a new one."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice?","en":"What does the following code print?"},"code":"String s1 = \"hello\";\nString s2 = \"hello\";\nString s3 = new String(\"hello\");\nSystem.out.println((s1 == s2) + \" \" + (s1 == s3) + \" \" + s1.equals(s3));","options":[{"it":"true false true","en":"true false true"},{"it":"true true true","en":"true true true"},{"it":"false false true","en":"false false true"},{"it":"true false false","en":"true false false"}],"correct":0,"explanation":{"it":"In sintesi: i letterali `\"hello\"` vengono internati nello string pool, quindi `s1` e `s2` riferiscono lo stesso oggetto e `s1 == s2` e\u0027 `true`; `new String(\"hello\")` forza la creazione di un nuovo oggetto sull\u0027heap, distinto da quello in pool, percio\u0027 `s1 == s3` e\u0027 `false` dato che `==` confronta l\u0027identita\u0027 del riferimento; `equals` confronta il contenuto carattere per carattere e da\u0027 `true`. Il risultato e\u0027 `true false true`.\nLe altre opzioni: confondono l\u0027identita\u0027 del riferimento con l\u0027uguaglianza logica, o negano l\u0027internamento dei letterali (`false false true`) o ignorano che `new String` crea un oggetto distinto (`true true true`).","en":"In summary: the `\"hello\"` literals are interned in the string pool, so `s1` and `s2` refer to the same object and `s1 == s2` is `true`; `new String(\"hello\")` forces the creation of a new object on the heap, distinct from the one in the pool, so `s1 == s3` is `false` since `==` compares reference identity; `equals` compares the content character by character and returns `true`. The result is `true false true`.\nThe other options: they confuse reference identity with logical equality, or deny the interning of literals (`false false true`), or ignore that `new String` creates a distinct object (`true true true`)."}},{"type":"mcq","prompt":{"it":"Per due variabili di tipo riferimento a oggetti, cosa confronta l\u0027operatore ==?","en":"For two variables of object reference type, what does the == operator compare?"},"code":"","options":[{"it":"Il contenuto/valore logico dei due oggetti","en":"The content/logical value of the two objects"},{"it":"L\u0027identita\u0027 dei riferimenti, cioe\u0027 se puntano allo stesso oggetto in memoria","en":"Reference identity, i.e. whether they point to the same object in memory"},{"it":"Sempre il risultato di equals()","en":"Always the result of equals()"},{"it":"I valori restituiti da hashCode()","en":"The values returned by hashCode()"}],"correct":1,"explanation":{"it":"In sintesi: sui tipi riferimento `==` confronta l\u0027identita\u0027 dei riferimenti, cioe\u0027 e\u0027 `true` solo se le due variabili puntano esattamente allo stesso oggetto in memoria; il confronto del contenuto logico spetta invece a `equals`. Sui primitivi `==` confronterebbe i valori, ma la domanda riguarda i riferimenti.\nLe altre opzioni: il contenuto/valore logico descrive `equals`, non `==`; `==` non invoca `equals` ne\u0027 confronta gli `hashCode`, che sono un contratto separato usato dalle strutture hash.","en":"In summary: on reference types `==` compares reference identity, i.e. it\u0027s `true` only if the two variables point to exactly the same object in memory; comparing the logical content is instead the job of `equals`. On primitives `==` would compare values, but this question is about references.\nThe other options: content/logical value describes `equals`, not `==`; `==` neither invokes `equals` nor compares `hashCode`s, which are a separate contract used by hash-based structures."}},{"type":"mcq","prompt":{"it":"Secondo il contratto tra equals() e hashCode(), quale affermazione e\u0027 SEMPRE vera?","en":"According to the contract between equals() and hashCode(), which statement is ALWAYS true?"},"code":"","options":[{"it":"Se due oggetti hanno lo stesso hashCode, allora equals() ritorna true","en":"If two objects have the same hashCode, then equals() returns true"},{"it":"Se due oggetti sono uguali secondo equals(), allora devono avere lo stesso hashCode()","en":"If two objects are equal according to equals(), then they must have the same hashCode()"},{"it":"Se due oggetti hanno hashCode diverso, possono comunque essere uguali secondo equals()","en":"If two objects have different hashCodes, they can still be equal according to equals()"},{"it":"hashCode() deve restituire un valore diverso per ogni oggetto distinto","en":"hashCode() must return a different value for every distinct object"}],"correct":1,"explanation":{"it":"In sintesi: il contratto stabilisce che se `a.equals(b)` e\u0027 `true` allora `a.hashCode()` deve essere uguale a `b.hashCode()`; questa e\u0027 la direzione garantita, da cui deriva il contrappositivo per cui `hashCode` diversi implicano oggetti non uguali.\nLe altre opzioni: \"stesso `hashCode` -\u003e `equals` true\" e\u0027 falsa perche\u0027 sono ammesse le collisioni; \"`hashCode` diverso ma `equals` true\" viola il contrappositivo appena visto; \"`hashCode` distinto per ogni oggetto\" e\u0027 impossibile, dato che lo spazio degli `int` e\u0027 finito e il contratto non vieta le collisioni.","en":"In summary: the contract states that if `a.equals(b)` is `true` then `a.hashCode()` must equal `b.hashCode()`; this is the guaranteed direction, from which follows the contrapositive whereby different `hashCode`s imply objects that are not equal.\nThe other options: \"same `hashCode` -\u003e `equals` true\" is false because collisions are allowed; \"different `hashCode` but `equals` true\" violates the contrapositive just seen; \"a distinct `hashCode` for every object\" is impossible, since the space of `int`s is finite and the contract does not forbid collisions."}},{"type":"code","prompt":{"it":"Cosa stampa l\u0027esecuzione di new C()?","en":"What does executing new C() print?"},"code":"class P {\n    static { System.out.print(\"Ps \"); }\n    { System.out.print(\"Pi \"); }\n    P() { System.out.print(\"Pc \"); }\n}\n\nclass C extends P {\n    static { System.out.print(\"Cs \"); }\n    { System.out.print(\"Ci \"); }\n    C() { System.out.print(\"Cc \"); }\n}\n\n// Esecuzione:\nnew C();","options":[{"it":"Ps Cs Pi Pc Ci Cc ","en":"Ps Cs Pi Pc Ci Cc "},{"it":"Ps Pi Pc Cs Ci Cc ","en":"Ps Pi Pc Cs Ci Cc "},{"it":"Cs Ps Ci Pi Cc Pc ","en":"Cs Ps Ci Pi Cc Pc "},{"it":"Ps Cs Ci Cc Pi Pc ","en":"Ps Cs Ci Cc Pi Pc "}],"correct":0,"explanation":{"it":"In sintesi: l\u0027ordine e\u0027 prima i blocchi `static`, eseguiti una sola volta al caricamento delle classi dalla superclasse alla sottoclasse, quindi `Ps Cs`; poi, per l\u0027istanza, `C()` chiama implicitamente `super()`, percio\u0027 si completa `P` con initializer di istanza e corpo del costruttore (`Pi Pc`) e infine si torna a `C` (`Ci Cc`). Il totale e\u0027 `Ps Cs Pi Pc Ci Cc`.\nLe altre opzioni: sbagliano l\u0027ordine static-prima o genitore-prima, oppure invertono initializer di istanza e corpo del costruttore.","en":"In summary: the order is first the `static` blocks, executed only once when the classes are loaded, from superclass to subclass, hence `Ps Cs`; then, for the instance, `C()` implicitly calls `super()`, so `P` is completed with its instance initializer and constructor body (`Pi Pc`) and finally control returns to `C` (`Ci Cc`). The total is `Ps Cs Pi Pc Ci Cc`.\nThe other options: they get the static-first or parent-first order wrong, or they swap the instance initializer and the constructor body."}},{"type":"mcq","prompt":{"it":"Quale dei seguenti NON e\u0027 uno dei quattro pilastri della programmazione orientata agli oggetti?","en":"Which of the following is NOT one of the four pillars of object-oriented programming?"},"code":"","options":[{"it":"Incapsulamento","en":"Encapsulation"},{"it":"Ereditarieta\u0027","en":"Inheritance"},{"it":"Composizione","en":"Composition"},{"it":"Polimorfismo","en":"Polymorphism"}],"correct":2,"explanation":{"it":"In sintesi: i quattro pilastri classici dell\u0027OOP sono incapsulamento, ereditarieta\u0027, polimorfismo e astrazione; la composizione, pur essendo una tecnica di design fondamentale (\"favor composition over inheritance\"), e\u0027 un modo di combinare oggetti tramite riferimenti, non uno dei quattro principi fondanti. Il pilastro effettivamente mancante dall\u0027elenco e\u0027 l\u0027astrazione.\nLe altre opzioni: incapsulamento, ereditarieta\u0027 e polimorfismo sono tutti pilastri autentici e quindi non rispondono alla domanda, che chiede l\u0027intruso.","en":"In summary: the four classic pillars of OOP are encapsulation, inheritance, polymorphism and abstraction; composition, while a fundamental design technique (\"favor composition over inheritance\"), is a way of combining objects through references, not one of the four founding principles. The pillar actually missing from the list is abstraction.\nThe other options: encapsulation, inheritance and polymorphism are all genuine pillars and therefore do not answer the question, which asks for the odd one out."}},{"type":"mcq","prompt":{"it":"Quale affermazione su interface e abstract class (Java 8 e successivi) e\u0027 corretta?","en":"Which statement about interface and abstract class (Java 8 and later) is correct?"},"code":"","options":[{"it":"Un\u0027interface puo\u0027 dichiarare campi di istanza mutabili, una classe astratta no","en":"An interface can declare mutable instance fields, an abstract class cannot"},{"it":"Una classe astratta puo\u0027 avere un costruttore e stato di istanza; un\u0027interface no","en":"An abstract class can have a constructor and instance state; an interface cannot"},{"it":"Una classe puo\u0027 estendere piu\u0027 classi astratte ma implementare una sola interface","en":"A class can extend multiple abstract classes but implement only one interface"},{"it":"Le interface non possono contenere alcuna implementazione di metodo","en":"Interfaces cannot contain any method implementation"}],"correct":1,"explanation":{"it":"In sintesi: una classe astratta puo\u0027 avere un costruttore e mantenere stato di istanza con i propri campi, preservando invarianti; un\u0027interface non ha stato di istanza perche\u0027 i suoi campi sono implicitamente `public static final`, cioe\u0027 costanti. Questa e\u0027 la differenza chiave da citare.\nLe altre opzioni: la prima e\u0027 rovesciata, e\u0027 l\u0027interface a non avere campi di istanza mutabili; l\u0027ereditarieta\u0027 multipla di classi non esiste in Java, si estende una sola classe ma si implementano piu\u0027 interface; e da Java 8 le interface possono avere metodi `default` e `static` (e `private` da Java 9), quindi \"nessuna implementazione\" e\u0027 falsa.","en":"In summary: an abstract class can have a constructor and hold instance state through its own fields, preserving invariants; an interface has no instance state because its fields are implicitly `public static final`, i.e. constants. This is the key difference to cite.\nThe other options: the first is reversed, it\u0027s the interface that has no mutable instance fields; multiple class inheritance does not exist in Java, you extend a single class but implement multiple interfaces; and since Java 8 interfaces can have `default` and `static` methods (and `private` ones since Java 9), so \"no implementation\" is false."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice?","en":"What does the following code print?"},"code":"class Animal {\n    String sound() { return \"...\"; }\n}\n\nclass Cat extends Animal {\n    @Override\n    String sound() { return \"Meow\"; }\n}\n\nAnimal a = new Cat();\nSystem.out.println(a.sound());","options":[{"it":"...","en":"..."},{"it":"Meow","en":"Meow"},{"it":"Errore di compilazione","en":"Compilation error"},{"it":"null","en":"null"}],"correct":1,"explanation":{"it":"In sintesi: il tipo dichiarato della variabile e\u0027 `Animal`, ma il tipo dinamico dell\u0027oggetto e\u0027 `Cat`; i metodi di istanza sono soggetti a dynamic dispatch (late binding), percio\u0027 la JVM sceglie l\u0027implementazione in base al tipo effettivo a runtime e invoca `Cat.sound()`, stampando `Meow`. E\u0027 il cuore del polimorfismo e dell\u0027overriding.\nLe altre opzioni: `...` presuppone erroneamente il binding statico sul tipo dichiarato; non c\u0027e\u0027 errore di compilazione perche\u0027 `Cat` e\u0027 un `Animal`; e la variabile e\u0027 correttamente inizializzata, quindi non stampa `null`.","en":"In summary: the declared type of the variable is `Animal`, but the dynamic type of the object is `Cat`; instance methods are subject to dynamic dispatch (late binding), so the JVM chooses the implementation based on the actual runtime type and invokes `Cat.sound()`, printing `Meow`. This is the heart of polymorphism and overriding.\nThe other options: `...` wrongly assumes static binding on the declared type; there is no compilation error because `Cat` is an `Animal`; and the variable is properly initialized, so it doesn\u0027t print `null`."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice?","en":"What does the following code print?"},"code":"class Base {\n    static String who() { return \"Base\"; }\n}\n\nclass Sub extends Base {\n    static String who() { return \"Sub\"; }\n}\n\nBase ref = new Sub();\nSystem.out.println(ref.who());","options":[{"it":"Sub","en":"Sub"},{"it":"Base","en":"Base"},{"it":"Errore di compilazione","en":"Compilation error"},{"it":"Dipende dalla JVM","en":"Depends on the JVM"}],"correct":1,"explanation":{"it":"In sintesi: i metodi `static` non vengono ridefiniti ma occultati (method hiding) e non partecipano al dynamic dispatch; la risoluzione avviene a compile-time in base al tipo dichiarato della variabile, qui `Base`, quindi `ref.who()` invoca `Base.who()` e stampa `Base` anche se l\u0027oggetto e\u0027 un `Sub`. Invocare uno `static` tramite un riferimento di istanza e\u0027 proprio per questo fuorviante e genera un warning.\nLe altre opzioni: `Sub` sarebbe il risultato solo con metodi di istanza polimorfici; il codice compila senza errori; e il comportamento e\u0027 deterministico, non dipende dalla JVM.","en":"In summary: `static` methods are not overridden but hidden (method hiding) and do not take part in dynamic dispatch; resolution happens at compile-time based on the declared type of the variable, here `Base`, so `ref.who()` invokes `Base.who()` and prints `Base` even though the object is a `Sub`. Calling a `static` method through an instance reference is misleading precisely for this reason and produces a warning.\nThe other options: `Sub` would be the result only with polymorphic instance methods; the code compiles without errors; and the behavior is deterministic, it does not depend on the JVM."}},{"type":"mcq","prompt":{"it":"Qual e\u0027 la differenza corretta tra overloading e overriding?","en":"What is the correct difference between overloading and overriding?"},"code":"","options":[{"it":"Overloading = stessa firma ridefinita nella sottoclasse; overriding = stesso nome ma parametri diversi","en":"Overloading = same signature redefined in the subclass; overriding = same name but different parameters"},{"it":"Overloading = stesso nome ma lista di parametri diversa, risolto a compile-time; overriding = stessa firma ridefinita in una sottoclasse, risolto a runtime","en":"Overloading = same name but a different parameter list, resolved at compile-time; overriding = same signature redefined in a subclass, resolved at runtime"},{"it":"Entrambi sono risolti a runtime tramite dynamic dispatch","en":"Both are resolved at runtime through dynamic dispatch"},{"it":"Overriding richiede parametri diversi; overloading richiede solo un tipo di ritorno diverso","en":"Overriding requires different parameters; overloading requires only a different return type"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027overloading e\u0027 piu\u0027 metodi con lo stesso nome ma lista di parametri diversa, risolti a compile-time in base ai tipi statici degli argomenti (static binding); l\u0027overriding e\u0027 una sottoclasse che ridefinisce un metodo con la stessa firma della superclasse, risolto a runtime in base al tipo dinamico (dynamic dispatch).\nLe altre opzioni: la prima inverte le definizioni; \"entrambi a runtime\" e\u0027 falsa perche\u0027 l\u0027overloading e\u0027 deciso a compile-time; e un tipo di ritorno diverso da solo non fa overloading e non e\u0027 ammesso a firma identica, se non come ritorno covariante nell\u0027override.","en":"In summary: overloading is multiple methods with the same name but a different parameter list, resolved at compile-time based on the static types of the arguments (static binding); overriding is a subclass redefining a method with the same signature as the superclass, resolved at runtime based on the dynamic type (dynamic dispatch).\nThe other options: the first swaps the definitions; \"both at runtime\" is false because overloading is decided at compile-time; and a different return type alone does not make an overload and is not allowed with an identical signature, except as a covariant return type in an override."}},{"type":"mcq","prompt":{"it":"Quale affermazione sull\u0027uso di final e\u0027 corretta?","en":"Which statement about the use of final is correct?"},"code":"","options":[{"it":"Un metodo final non puo\u0027 essere sottoposto a override e una classe final non puo\u0027 essere estesa","en":"A final method cannot be overridden and a final class cannot be extended"},{"it":"Una variabile final non puo\u0027 mai essere assegnata, nemmeno una volta","en":"A final variable can never be assigned, not even once"},{"it":"Un campo static final puo\u0027 essere riassegnato liberamente dai metodi di istanza","en":"A static final field can be freely reassigned by instance methods"},{"it":"final e static sono di fatto sinonimi","en":"final and static are effectively synonyms"}],"correct":0,"explanation":{"it":"In sintesi: un metodo `final` non puo\u0027 essere sottoposto a override nelle sottoclassi e una classe `final` (come `String`) non puo\u0027 essere estesa; sono i due usi principali di `final` sull\u0027ereditarieta\u0027.\nLe altre opzioni: una variabile `final` deve essere assegnata esattamente una volta, non \"mai\" (blank final assegnabile nel costruttore); un campo `static final` e\u0027 una costante e non e\u0027 riassegnabile; e `static` (appartenenza alla classe) e `final` (immutabilita\u0027 del binding) sono concetti ortogonali, non sinonimi.","en":"In summary: a `final` method cannot be overridden in subclasses and a `final` class (like `String`) cannot be extended; these are the two main uses of `final` relating to inheritance.\nThe other options: a `final` variable must be assigned exactly once, not \"never\" (a blank final can be assigned in the constructor); a `static final` field is a constant and cannot be reassigned; and `static` (class membership) and `final` (immutability of the binding) are orthogonal concepts, not synonyms."}},{"type":"mcq","prompt":{"it":"Un membro dichiarato protected e\u0027 accessibile da:","en":"A member declared protected is accessible from:"},"code":"","options":[{"it":"Solo dalla stessa classe","en":"Only from the same class"},{"it":"Dalla stessa classe e dallo stesso package, ma mai dalle sottoclassi in altri package","en":"From the same class and the same package, but never from subclasses in other packages"},{"it":"Dalla stessa classe, dallo stesso package e dalle sottoclassi anche in package diversi","en":"From the same class, the same package, and from subclasses even in different packages"},{"it":"Da qualunque classe, esattamente come public","en":"From any class, exactly like public"}],"correct":2,"explanation":{"it":"In sintesi: `protected` concede la visibilita\u0027 di package (come il default) piu\u0027 l\u0027accesso dalle sottoclassi, anche se collocate in un package diverso, con la nota che l\u0027accesso avvenga tramite un riferimento del tipo della sottoclasse. La scala di visibilita\u0027 e\u0027 `private` \u003c default \u003c `protected` \u003c `public`.\nLe altre opzioni: \"solo stessa classe\" descrive `private`; \"stesso package ma mai sottoclassi in altri package\" descrive il default package-private e nega erroneamente l\u0027accesso ereditato; \"come `public`\" ignora che `protected` non e\u0027 accessibile da qualunque classe esterna.","en":"In summary: `protected` grants package visibility (like the default) plus access from subclasses, even those located in a different package, with the caveat that the access occurs through a reference of the subclass type. The visibility scale is `private` \u003c default \u003c `protected` \u003c `public`.\nThe other options: \"only the same class\" describes `private`; \"same package but never subclasses in other packages\" describes the package-private default and wrongly denies inherited access; \"like `public`\" ignores that `protected` is not accessible from any arbitrary external class."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice?","en":"What does the following code print?"},"code":"static void modify(int[] arr, int val) {\n    arr[0] = 99;\n    val = 99;\n}\n\nint[] data = {1};\nint n = 1;\nmodify(data, n);\nSystem.out.println(data[0] + \" \" + n);","options":[{"it":"99 99","en":"99 99"},{"it":"1 1","en":"1 1"},{"it":"99 1","en":"99 1"},{"it":"1 99","en":"1 99"}],"correct":2,"explanation":{"it":"In sintesi: Java e\u0027 sempre pass-by-value. Per `arr` viene copiato il valore del riferimento, ma la copia punta allo stesso array, quindi `arr[0] = 99` modifica l\u0027oggetto condiviso e il cambiamento e\u0027 visibile al chiamante, portando `data[0]` a 99; per il primitivo `val` viene copiato il valore 1 e riassegnare `val = 99` tocca solo la copia locale, lasciando `n` invariato a 1. L\u0027output e\u0027 `99 1`.\nLe altre opzioni: `99 99` e `1 99` credono erroneamente che riassegnare `val` influisca su `n`; `1 1` ignora che la modifica dell\u0027array condiviso e\u0027 visibile al chiamante.","en":"In summary: Java is always pass-by-value. For `arr` the value of the reference is copied, but the copy points to the same array, so `arr[0] = 99` modifies the shared object and the change is visible to the caller, making `data[0]` 99; for the primitive `val` the value 1 is copied and reassigning `val = 99` touches only the local copy, leaving `n` unchanged at 1. The output is `99 1`.\nThe other options: `99 99` and `1 99` wrongly believe that reassigning `val` affects `n`; `1 1` ignores that the modification of the shared array is visible to the caller."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice?","en":"What does the following code print?"},"code":"static void change(String s) {\n    s = \"world\";\n}\n\nString msg = \"hello\";\nchange(msg);\nSystem.out.println(msg);","options":[{"it":"world","en":"world"},{"it":"hello","en":"hello"},{"it":"null","en":"null"},{"it":"Errore di compilazione","en":"Compilation error"}],"correct":1,"explanation":{"it":"In sintesi: il riferimento `msg` viene passato per valore, quindi `s` e\u0027 una copia del riferimento; l\u0027assegnazione `s = \"world\"` fa puntare a un nuovo oggetto solo la copia locale, senza toccare `msg`, che continua a riferire `\"hello\"`. Per giunta `String` e\u0027 immutabile, quindi non c\u0027e\u0027 comunque modo di alterare l\u0027originale tramite `s`. L\u0027output e\u0027 `hello`.\nLe altre opzioni: `world` presuppone erroneamente il pass-by-reference; `null` non ha ragione d\u0027essere perche\u0027 `msg` resta assegnato; il codice compila regolarmente.","en":"In summary: the reference `msg` is passed by value, so `s` is a copy of the reference; the assignment `s = \"world\"` makes only the local copy point to a new object, without touching `msg`, which keeps referring to `\"hello\"`. Moreover `String` is immutable, so there is no way to alter the original through `s` anyway. The output is `hello`.\nThe other options: `world` wrongly assumes pass-by-reference; `null` has no reason to appear because `msg` stays assigned; the code compiles fine."}},{"type":"mcq","prompt":{"it":"Quale delle seguenti e\u0027 una checked exception, che il compilatore obbliga a dichiarare con throws o a gestire con try/catch?","en":"Which of the following is a checked exception, one that the compiler forces you to declare with throws or handle with try/catch?"},"code":"","options":[{"it":"NullPointerException","en":"NullPointerException"},{"it":"IllegalArgumentException","en":"IllegalArgumentException"},{"it":"IOException","en":"IOException"},{"it":"ArrayIndexOutOfBoundsException","en":"ArrayIndexOutOfBoundsException"}],"correct":2,"explanation":{"it":"In sintesi: `IOException` estende `Exception` ma non `RuntimeException`, quindi e\u0027 una checked exception e il compilatore ne impone la gestione con `try/catch` o la propagazione dichiarata con `throws`. La gerarchia e\u0027 `Throwable` -\u003e `Exception` (checked, tranne il ramo `RuntimeException`) e `Throwable` -\u003e `Error` (unchecked).\nLe altre opzioni: `NullPointerException`, `IllegalArgumentException` e `ArrayIndexOutOfBoundsException` estendono `RuntimeException`, quindi sono unchecked e rappresentano errori di programmazione non obbligatori da dichiarare.","en":"In summary: `IOException` extends `Exception` but not `RuntimeException`, so it is a checked exception and the compiler requires you to handle it with `try/catch` or propagate it with a declared `throws`. The hierarchy is `Throwable` -\u003e `Exception` (checked, except the `RuntimeException` branch) and `Throwable` -\u003e `Error` (unchecked).\nThe other options: `NullPointerException`, `IllegalArgumentException` and `ArrayIndexOutOfBoundsException` extend `RuntimeException`, so they are unchecked and represent programming errors that you are not required to declare."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice?","en":"What does the following code print?"},"code":"class Res implements AutoCloseable {\n    private final String name;\n    Res(String name) { this.name = name; }\n    public void close() { System.out.print(\"close\" + name + \" \"); }\n}\n\ntry (Res a = new Res(\"A\"); Res b = new Res(\"B\")) {\n    System.out.print(\"body \");\n}","options":[{"it":"body closeA closeB ","en":"body closeA closeB "},{"it":"body closeB closeA ","en":"body closeB closeA "},{"it":"closeA closeB body ","en":"closeA closeB body "},{"it":"body closeB ","en":"body closeB "}],"correct":1,"explanation":{"it":"In sintesi: con try-with-resources le risorse vengono chiuse automaticamente all\u0027uscita dal blocco in ordine inverso rispetto alla dichiarazione, come uno stack; quindi si esegue prima il corpo (`body`), poi si chiude `b` (`closeB`) e infine `a` (`closeA`), producendo `body closeB closeA`. L\u0027ordine inverso e\u0027 cruciale quando `b` dipende da `a`.\nLe altre opzioni: `body closeA closeB` sbaglia l\u0027ordine di chiusura; `closeA closeB body` mette la chiusura prima del corpo; `body closeB` dimentica che entrambe le `close()` vengono sempre invocate, anche in caso di eccezione.","en":"In summary: with try-with-resources the resources are closed automatically on exiting the block in reverse order relative to their declaration, like a stack; so the body runs first (`body`), then `b` is closed (`closeB`), and finally `a` (`closeA`), producing `body closeB closeA`. The reverse order is crucial when `b` depends on `a`.\nThe other options: `body closeA closeB` gets the closing order wrong; `closeA closeB body` puts the closing before the body; `body closeB` forgets that both `close()` calls are always invoked, even in case of an exception."}},{"type":"mcq","prompt":{"it":"Quale dei seguenti NON e\u0027 un metodo definito nella classe java.lang.Object?","en":"Which of the following is NOT a method defined in the java.lang.Object class?"},"code":"","options":[{"it":"hashCode()","en":"hashCode()"},{"it":"toString()","en":"toString()"},{"it":"compareTo()","en":"compareTo()"},{"it":"getClass()","en":"getClass()"}],"correct":2,"explanation":{"it":"In sintesi: `compareTo()` non appartiene a `Object`, e\u0027 il metodo dell\u0027interfaccia `Comparable\u003cT\u003e` che una classe implementa per definire un ordinamento naturale, quindi esiste solo se la classe implementa `Comparable`.\nLe altre opzioni: `hashCode()`, `toString()` e `getClass()` sono definiti in `Object` insieme a `equals`, `clone`, `finalize`, `wait`, `notify` e `notifyAll`, ed essendo ereditati da ogni classe sono disponibili ovunque.","en":"In summary: `compareTo()` does not belong to `Object`, it is the method of the `Comparable\u003cT\u003e` interface that a class implements to define a natural ordering, so it exists only if the class implements `Comparable`.\nThe other options: `hashCode()`, `toString()` and `getClass()` are defined in `Object` together with `equals`, `clone`, `finalize`, `wait`, `notify` and `notifyAll`, and being inherited by every class they are available everywhere."}},{"type":"code","prompt":{"it":"Cosa succede eseguendo questo codice?","en":"What happens when this code runs?"},"code":"Object o = \"hello\";\nInteger i = (Integer) o;\nSystem.out.println(i);","options":[{"it":"Stampa hello","en":"Prints hello"},{"it":"Errore di compilazione","en":"Compilation error"},{"it":"Lancia ClassCastException a runtime","en":"Throws ClassCastException at runtime"},{"it":"Stampa null","en":"Prints null"}],"correct":2,"explanation":{"it":"In sintesi: il codice compila perche\u0027 `o` ha tipo statico `Object` e il cast a `Integer` e\u0027 sintatticamente lecito, dato che i due tipi sono compatibili in linea di ereditarieta\u0027 e il compilatore non conosce il tipo dinamico; a runtime, pero\u0027, l\u0027oggetto e\u0027 realmente una `String`, quindi il cast a `Integer` fallisce e lancia `ClassCastException`. Per questo si usa `instanceof` (o il pattern matching) prima di un downcast.\nLe altre opzioni: non stampa `hello` perche\u0027 il cast fallisce prima; non c\u0027e\u0027 errore di compilazione, che si avrebbe solo con tipi non correlati come `String` verso `Integer` diretto; non stampa `null` perche\u0027 l\u0027eccezione interrompe l\u0027esecuzione.","en":"In summary: the code compiles because `o` has static type `Object` and the cast to `Integer` is syntactically legal, since the two types are compatible along the inheritance line and the compiler does not know the dynamic type; at runtime, however, the object is really a `String`, so the cast to `Integer` fails and throws `ClassCastException`. This is why you use `instanceof` (or pattern matching) before a downcast.\nThe other options: it doesn\u0027t print `hello` because the cast fails first; there is no compilation error, which would occur only with unrelated types such as a direct `String` to `Integer`; it doesn\u0027t print `null` because the exception interrupts execution."}},{"type":"mcq","prompt":{"it":"Qual e\u0027 il risultato dell\u0027espressione (null instanceof String)?","en":"What is the result of the expression (null instanceof String)?"},"code":"","options":[{"it":"true","en":"true"},{"it":"false","en":"false"},{"it":"Lancia NullPointerException","en":"Throws NullPointerException"},{"it":"Errore di compilazione","en":"Compilation error"}],"correct":1,"explanation":{"it":"In sintesi: `instanceof` restituisce sempre `false` quando l\u0027operando di sinistra e\u0027 `null`, per qualunque tipo a destra, perche\u0027 `null` non e\u0027 istanza di nulla; l\u0027operatore e\u0027 null-safe e non lancia mai eccezioni, il che lo rende ideale come guardia prima di un cast o di una dereferenziazione. Quindi `null instanceof String` e\u0027 `false`.\nLe altre opzioni: `true` contraddice la semantica di `instanceof`; `NullPointerException` e\u0027 escluso proprio perche\u0027 l\u0027operatore e\u0027 null-safe; il codice compila regolarmente.","en":"In summary: `instanceof` always returns `false` when the left operand is `null`, for any type on the right, because `null` is not an instance of anything; the operator is null-safe and never throws exceptions, which makes it ideal as a guard before a cast or a dereference. So `null instanceof String` is `false`.\nThe other options: `true` contradicts the semantics of `instanceof`; `NullPointerException` is ruled out precisely because the operator is null-safe; the code compiles fine."}},{"type":"truefalse","prompt":{"it":"In Java un enum puo\u0027 estendere (extends) un\u0027altra classe.","en":"In Java, an enum can extend (extends) another class."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: e\u0027 Falso. Ogni enum estende implicitamente `java.lang.Enum\u003cE\u003e` e, poiche\u0027 Java non ammette ereditarieta\u0027 multipla di classi, un enum non puo\u0027 estendere alcuna altra classe. Puo\u0027 pero\u0027 implementare una o piu\u0027 interface, avere campi, costruttori (implicitamente private) e metodi anche astratti con corpo specifico per costante.\nLe altre opzioni: rispondere Vero e\u0027 l\u0027errore di chi confonde la possibilita\u0027 di implementare interface, che e\u0027 concessa, con l\u0027estensione di classi, che invece e\u0027 preclusa dallo slot di ereditarieta\u0027 gia\u0027 occupato da `Enum`.","en":"In summary: it\u0027s False. Every enum implicitly extends `java.lang.Enum\u003cE\u003e` and, since Java does not allow multiple class inheritance, an enum cannot extend any other class. It can, however, implement one or more interfaces, have fields, constructors (implicitly private), and methods, including abstract ones with a body specific to each constant.\nThe other options: answering True is the mistake of those who confuse the ability to implement interfaces, which is allowed, with extending classes, which is precluded by the inheritance slot already occupied by `Enum`."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice?","en":"What does the following code print?"},"code":"enum Status { ACTIVE, INACTIVE, PENDING }\n\nSystem.out.println(Status.values().length + \" \" + Status.PENDING.ordinal());","options":[{"it":"3 2","en":"3 2"},{"it":"2 3","en":"2 3"},{"it":"3 3","en":"3 3"},{"it":"2 2","en":"2 2"}],"correct":0,"explanation":{"it":"In sintesi: `values()` restituisce un array con tutte le costanti nell\u0027ordine di dichiarazione, qui `ACTIVE`, `INACTIVE`, `PENDING`, quindi `length` e\u0027 3; `ordinal()` ritorna la posizione zero-based, percio\u0027 `PENDING.ordinal()` e\u0027 2. Il risultato e\u0027 `3 2`. Da notare che affidarsi a `ordinal()` per la logica di business e\u0027 fragile, perche\u0027 cambia se si riordinano le costanti.\nLe altre opzioni: invertono i due valori (`2 3`), sbagliano l\u0027ordinale (`3 3`) o entrambe le grandezze (`2 2`).","en":"In summary: `values()` returns an array with all the constants in declaration order, here `ACTIVE`, `INACTIVE`, `PENDING`, so `length` is 3; `ordinal()` returns the zero-based position, so `PENDING.ordinal()` is 2. The result is `3 2`. Note that relying on `ordinal()` for business logic is fragile, because it changes if the constants are reordered.\nThe other options: they swap the two values (`2 3`), get the ordinal wrong (`3 3`), or both quantities (`2 2`)."}},{"type":"mcq","prompt":{"it":"Qual e\u0027 la differenza tra una static nested class e una inner class (nested non-static)?","en":"What is the difference between a static nested class and an inner class (non-static nested)?"},"code":"","options":[{"it":"La static nested class mantiene un riferimento implicito a un\u0027istanza della classe esterna, la inner no","en":"The static nested class holds an implicit reference to an instance of the outer class, the inner one does not"},{"it":"La inner class (non-static) mantiene un riferimento implicito a un\u0027istanza della classe esterna e puo\u0027 accederne ai membri di istanza; la static nested no","en":"The inner class (non-static) holds an implicit reference to an instance of the outer class and can access its instance members; the static nested one cannot"},{"it":"Le inner class non possono accedere ai membri privati della classe esterna","en":"Inner classes cannot access the private members of the outer class"},{"it":"Sono sinonimi: non c\u0027e\u0027 alcuna differenza tecnica","en":"They are synonyms: there is no technical difference"}],"correct":1,"explanation":{"it":"In sintesi: una inner class non-static e\u0027 legata a un\u0027istanza della classe esterna, ne detiene un riferimento implicito (`Outer.this`) e puo\u0027 accederne ai membri di istanza, tanto che per crearla serve un\u0027istanza dell\u0027esterna; una static nested class non e\u0027 legata ad alcuna istanza esterna e accede solo ai membri `static`. Il riferimento implicito della inner class puo\u0027 anche causare memory leak se l\u0027istanza esterna resta trattenuta.\nLe altre opzioni: la prima e\u0027 invertita, e\u0027 la inner a trattenere il riferimento; entrambe accedono ai membri privati della classe che le contiene, quindi negare l\u0027accesso ai privati e\u0027 falso; e non sono sinonimi, la differenza tecnica sul legame con l\u0027istanza e\u0027 sostanziale.","en":"In summary: a non-static inner class is tied to an instance of the outer class, holds an implicit reference to it (`Outer.this`), and can access its instance members, so much so that creating one requires an instance of the outer class; a static nested class is not tied to any outer instance and accesses only `static` members. The implicit reference held by the inner class can also cause a memory leak if the outer instance stays retained.\nThe other options: the first is reversed, it\u0027s the inner class that holds the reference; both can access the private members of the class that contains them, so denying access to private members is false; and they are not synonyms, the technical difference regarding the tie to the instance is substantial."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice?","en":"What does the following code print?"},"code":"int factor = 3;\nRunnable r = new Runnable() {\n    public void run() {\n        System.out.println(factor * 2);\n    }\n};\nr.run();","options":[{"it":"Stampa 6","en":"Prints 6"},{"it":"Stampa 3","en":"Prints 3"},{"it":"Errore di compilazione: una classe anonima non puo\u0027 accedere a variabili locali","en":"Compilation error: an anonymous class cannot access local variables"},{"it":"Errore di compilazione: factor deve essere dichiarata static","en":"Compilation error: factor must be declared static"}],"correct":0,"explanation":{"it":"In sintesi: una classe anonima puo\u0027 catturare le variabili locali del metodo che la racchiude purche\u0027 siano `final` o effectively final, cioe\u0027 mai riassegnate dopo l\u0027inizializzazione; qui `factor` vale 3 e non viene riassegnata, quindi e\u0027 effectively final, il codice compila e `run()` stampa 3 * 2 = 6.\nLe altre opzioni: stampare 3 ignora la moltiplicazione; l\u0027errore \"non puo\u0027 accedere a variabili locali\" e\u0027 falso, la cattura e\u0027 proprio consentita per le effectively final; e non serve alcun `static`, si avrebbe errore solo se `factor` fosse stata riassegnata dopo la creazione della classe anonima.","en":"In summary: an anonymous class can capture the local variables of the enclosing method provided they are `final` or effectively final, i.e. never reassigned after initialization; here `factor` is 3 and is not reassigned, so it is effectively final, the code compiles and `run()` prints 3 * 2 = 6.\nThe other options: printing 3 ignores the multiplication; the error \"cannot access local variables\" is false, capture is precisely what\u0027s allowed for effectively final ones; and no `static` is needed, an error would occur only if `factor` had been reassigned after the anonymous class was created."}},{"type":"truefalse","prompt":{"it":"Un campo di istanza di tipo int non inizializzato esplicitamente vale 0, mentre un campo di istanza di tipo Integer non inizializzato vale null.","en":"An instance field of type int that is not explicitly initialized is 0, while an instance field of type Integer that is not initialized is null."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 Vero. I campi di istanza e static ricevono valori di default automatici; i primitivi numerici a 0, `boolean` a `false`, `char` a `\u0027\u0000\u0027`, e tutti i tipi riferimento a `null`. Poiche\u0027 `int` e\u0027 primitivo il default e\u0027 0, mentre `Integer` e\u0027 un wrapper, cioe\u0027 un tipo riferimento, quindi il default e\u0027 `null`.\nLe altre opzioni: dire Falso ignora questa regola; l\u0027errore tipico e\u0027 estenderla anche alle variabili locali, che invece NON hanno default e vanno inizializzate esplicitamente prima dell\u0027uso pena errore di compilazione.","en":"In summary: it\u0027s True. Instance and static fields receive automatic default values; numeric primitives default to 0, `boolean` to `false`, `char` to `\u0027\u0000\u0027`, and all reference types to `null`. Since `int` is a primitive its default is 0, whereas `Integer` is a wrapper, i.e. a reference type, so its default is `null`.\nThe other options: saying False ignores this rule; the typical mistake is to extend it to local variables too, which instead do NOT have defaults and must be explicitly initialized before use, on pain of a compilation error."}},{"type":"mcq","prompt":{"it":"Concatenare stringhe con l\u0027operatore + all\u0027interno di un ciclo con molte iterazioni e\u0027 inefficiente. Perche\u0027?","en":"Concatenating strings with the + operator inside a loop with many iterations is inefficient. Why?"},"code":"","options":[{"it":"String e\u0027 immutabile: ogni concatenazione crea un nuovo oggetto String copiando il contenuto, con costo complessivo O(n^2); e\u0027 preferibile StringBuilder","en":"String is immutable: each concatenation creates a new String object by copying the content, with an overall cost of O(n^2); StringBuilder is preferable"},{"it":"Il compilatore proibisce l\u0027uso di + tra String","en":"The compiler forbids the use of + between Strings"},{"it":"+ tra String non compila: bisogna usare obbligatoriamente il metodo concat()","en":"+ between Strings does not compile: you must use the concat() method"},{"it":"StringBuilder e\u0027 a sua volta immutabile e quindi piu\u0027 lento di String","en":"StringBuilder is itself immutable and therefore slower than String"}],"correct":0,"explanation":{"it":"In sintesi: poiche\u0027 `String` e\u0027 immutabile, ogni `s = s + x` crea una nuova `String` copiando tutti i caratteri gia\u0027 presenti piu\u0027 i nuovi; ripetuto in un ciclo il costo complessivo diventa quadratico O(n^2), con molti oggetti temporanei da raccogliere. `StringBuilder` usa un buffer mutabile e appende in tempo ammortizzato costante, riducendo il costo a O(n); e\u0027 quindi la scelta corretta nei loop.\nLe altre opzioni: l\u0027operatore `+` tra `String` e\u0027 perfettamente valido e per una singola espressione il compilatore lo ottimizza gia\u0027 (via `StringConcatFactory` da Java 9), quindi \"proibito\"/\"non compila\" sono falsi; e `StringBuilder` e\u0027 mutabile, non immutabile, percio\u0027 non e\u0027 piu\u0027 lento di `String`.","en":"In summary: since `String` is immutable, each `s = s + x` creates a new `String` by copying all the characters already present plus the new ones; repeated in a loop the overall cost becomes quadratic O(n^2), with many temporary objects to garbage-collect. `StringBuilder` uses a mutable buffer and appends in amortized constant time, reducing the cost to O(n); it is therefore the right choice in loops.\nThe other options: the `+` operator between `String`s is perfectly valid and for a single expression the compiler already optimizes it (via `StringConcatFactory` since Java 9), so \"forbidden\"/\"does not compile\" are false; and `StringBuilder` is mutable, not immutable, so it is not slower than `String`."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice?","en":"What does the following code print?"},"code":"static void print(Object o) { System.out.println(\"Object\"); }\nstatic void print(String s) { System.out.println(\"String\"); }\n\nprint(null);","options":[{"it":"Object","en":"Object"},{"it":"String","en":"String"},{"it":"Ambiguo: errore di compilazione","en":"Ambiguous: compilation error"},{"it":"Lancia NullPointerException","en":"Throws NullPointerException"}],"correct":1,"explanation":{"it":"In sintesi: la risoluzione dell\u0027overload avviene a compile-time scegliendo il metodo piu\u0027 specifico applicabile; `null` e\u0027 assegnabile sia a `Object` sia a `String`, ma `String` e\u0027 sottotipo di `Object`, quindi `print(String)` e\u0027 strettamente piu\u0027 specifica e viene selezionata, stampando `String`.\nLe altre opzioni: `Object` sceglierebbe il tipo meno specifico; l\u0027ambiguita\u0027 si avrebbe solo con due tipi non correlati come `String` e `Integer`, non qui; e non c\u0027e\u0027 `NullPointerException`, `null` viene semplicemente passato come argomento.","en":"In summary: overload resolution happens at compile-time by choosing the most specific applicable method; `null` is assignable to both `Object` and `String`, but `String` is a subtype of `Object`, so `print(String)` is strictly more specific and is selected, printing `String`.\nThe other options: `Object` would pick the less specific type; ambiguity would arise only with two unrelated types such as `String` and `Integer`, not here; and there is no `NullPointerException`, `null` is simply passed as an argument."}},{"type":"code","prompt":{"it":"Cosa restituisce test()? (domanda stretch)","en":"What does test() return? (stretch question)"},"code":"static int test() {\n    try {\n        return 1;\n    } finally {\n        return 2;\n    }\n}\n\nSystem.out.println(test());","options":[{"it":"1","en":"1"},{"it":"2","en":"2"},{"it":"Errore di compilazione","en":"Compilation error"},{"it":"Lancia un\u0027eccezione a runtime","en":"Throws an exception at runtime"}],"correct":1,"explanation":{"it":"In sintesi: il blocco `finally` viene sempre eseguito prima che il metodo restituisca davvero il controllo; il `try` prepara il valore di ritorno 1, ma il `return 2` dentro `finally` sovrascrive quel valore (e sopprimerebbe anche un\u0027eventuale eccezione pendente), quindi il metodo ritorna 2. E\u0027 legale ma considerato cattiva pratica, perche\u0027 un `return` o `throw` in `finally` maschera silenziosamente il risultato del `try`.\nLe altre opzioni: 1 ignora la sovrascrittura operata dal `finally`; il codice compila senza errori; e non viene lanciata alcuna eccezione a runtime.","en":"In summary: the `finally` block is always executed before the method actually returns control; the `try` prepares the return value 1, but the `return 2` inside `finally` overwrites that value (and would also suppress any pending exception), so the method returns 2. This is legal but considered bad practice, because a `return` or `throw` in `finally` silently masks the result of the `try`.\nThe other options: 1 ignores the overwrite performed by the `finally`; the code compiles without errors; and no exception is thrown at runtime."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice? (domanda stretch)","en":"What does the following code print? (stretch question)"},"code":"class A {\n    int x = 1;\n    int getX() { return x; }\n}\n\nclass B extends A {\n    int x = 2;\n    int getX() { return x; }\n}\n\nA obj = new B();\nSystem.out.println(obj.x + \" \" + obj.getX());","options":[{"it":"1 2","en":"1 2"},{"it":"2 2","en":"2 2"},{"it":"1 1","en":"1 1"},{"it":"2 1","en":"2 1"}],"correct":0,"explanation":{"it":"In sintesi: i campi in Java non sono polimorfici, l\u0027accesso a un campo e\u0027 risolto a compile-time in base al tipo dichiarato del riferimento; `obj` e\u0027 dichiarato `A`, quindi `obj.x` legge il campo `x` di `A` e vale 1 (il campo di `B` lo occulta con field hiding, ma non lo sostituisce). I metodi invece sono polimorfici, percio\u0027 la dynamic dispatch invoca `B.getX()`, che legge il campo `x` di `B` valente 2. L\u0027output e\u0027 `1 2`.\nLe altre opzioni: `2 2` e `1 1` applicano la stessa regola a campi e metodi, ignorando l\u0027asimmetria; `2 1` la inverte, trattando i campi come dinamici e i metodi come statici.","en":"In summary: fields in Java are not polymorphic, field access is resolved at compile-time based on the declared type of the reference; `obj` is declared as `A`, so `obj.x` reads the `x` field of `A` and is 1 (the `B` field hides it with field hiding, but does not replace it). Methods, on the other hand, are polymorphic, so dynamic dispatch invokes `B.getX()`, which reads the `x` field of `B`, worth 2. The output is `1 2`.\nThe other options: `2 2` and `1 1` apply the same rule to fields and methods, ignoring the asymmetry; `2 1` inverts it, treating fields as dynamic and methods as static."}},{"type":"code","prompt":{"it":"Cosa stampa il seguente codice? (domanda stretch)","en":"What does the following code print? (stretch question)"},"code":"long x = 1000;\nLong y = 1000L;\nSystem.out.println(x == y);","options":[{"it":"true","en":"true"},{"it":"false","en":"false"},{"it":"Errore di compilazione","en":"Compilation error"},{"it":"Dipende dalla cache di Long","en":"Depends on the Long cache"}],"correct":0,"explanation":{"it":"In sintesi: quando `==` confronta un primitivo con un wrapper, il wrapper subisce automaticamente unboxing e il confronto diventa numerico tra primitivi, quindi 1000 == 1000 e\u0027 `true`. La cache dei wrapper qui e\u0027 irrilevante, perche\u0027 con l\u0027unboxing non si confrontano riferimenti ma valori.\nLe altre opzioni: `false` sarebbe il risultato solo se ENTRAMBI gli operandi fossero `Long` (due oggetti fuori dal range di cache -128..127, confrontati per riferimento); il codice compila; e la cache di `Long` non entra in gioco proprio grazie all\u0027unboxing.","en":"In summary: when `==` compares a primitive with a wrapper, the wrapper is automatically unboxed and the comparison becomes numeric between primitives, so 1000 == 1000 is `true`. The wrapper cache is irrelevant here, because with unboxing you are not comparing references but values.\nThe other options: `false` would be the result only if BOTH operands were `Long` (two objects outside the cache range -128..127, compared by reference); the code compiles; and the `Long` cache does not come into play precisely because of the unboxing."}},{"type":"code","prompt":{"it":"Dato l\u0027ordine dei catch qui sotto, cosa succede? (domanda stretch)","en":"Given the order of the catch blocks below, what happens? (stretch question)"},"code":"try {\n    // codice che puo\u0027 lanciare IOException\n} catch (Exception e) {\n    // ...\n} catch (IOException e) {\n    // ...\n}","options":[{"it":"Compila: a runtime viene provato prima il catch piu\u0027 specifico","en":"It compiles: at runtime the most specific catch is tried first"},{"it":"Errore di compilazione: IOException e\u0027 gia\u0027 catturata da Exception, quindi il secondo catch e\u0027 irraggiungibile","en":"Compilation error: IOException is already caught by Exception, so the second catch is unreachable"},{"it":"Compila ma IOException non verra\u0027 mai catturata, senza alcun errore","en":"It compiles but IOException will never be caught, without any error"},{"it":"Errore a runtime alla prima eccezione lanciata","en":"Runtime error on the first exception thrown"}],"correct":1,"explanation":{"it":"In sintesi: i blocchi `catch` vengono valutati dall\u0027alto verso il basso ed e\u0027 eseguito il primo assegnabile dall\u0027eccezione; poiche\u0027 `IOException` e\u0027 sottoclasse di `Exception`, qualunque `IOException` sarebbe gia\u0027 intercettata dal primo `catch (Exception e)`, rendendo il secondo `catch (IOException e)` irraggiungibile. Il compilatore lo segnala come errore \"exception has already been caught\", quindi va ordinato dal piu\u0027 specifico al piu\u0027 generale.\nLe altre opzioni: non c\u0027e\u0027 scelta a runtime del catch piu\u0027 specifico; non e\u0027 un errore a runtime ma a compile-time; e non e\u0027 vero che compila senza segnalazioni, il codice irraggiungibile e\u0027 un errore, non un semplice avviso.","en":"In summary: `catch` blocks are evaluated top to bottom and the first one assignable from the exception is executed; since `IOException` is a subclass of `Exception`, any `IOException` would already be intercepted by the first `catch (Exception e)`, making the second `catch (IOException e)` unreachable. The compiler flags it as an \"exception has already been caught\" error, so they must be ordered from most specific to most general.\nThe other options: there is no runtime choice of the most specific catch; it\u0027s not a runtime error but a compile-time one; and it\u0027s not true that it compiles without warnings, unreachable code is an error, not a mere warning."}}]},{"id":"java-modern","title":"Java Moderno (8-21)","questions":[{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"static String compute() {\n    System.out.println(\"compute\");\n    return \"default\";\n}\n\npublic static void main(String[] args) {\n    Optional\u003cString\u003e opt = Optional.of(\"value\");\n    String r = opt.orElse(compute());\n    System.out.println(r);\n}","options":[{"it":"value","en":"value"},{"it":"compute\nvalue","en":"compute\nvalue"},{"it":"compute\ndefault","en":"compute\ndefault"},{"it":"default","en":"default"}],"correct":1,"explanation":{"it":"In sintesi: `orElse` riceve un valore gia\u0027 calcolato, e in Java gli argomenti sono valutati in modo eager prima della chiamata; quindi `compute()` viene eseguita SEMPRE, anche con l\u0027Optional presente. Il side-effect stampa \u0027compute\u0027, ma `orElse` ritorna comunque \u0027value\u0027 perche\u0027 l\u0027Optional non e\u0027 vuoto: output \u0027compute\\nvalue\u0027. Per rendere lazy il fallback si usa `orElseGet(Supplier)`.\nLe altre opzioni: \u0027value\u0027 ignora l\u0027esecuzione eager di `compute()`; \u0027compute\\ndefault\u0027 e \u0027default\u0027 sbagliano perche\u0027 il fallback non viene usato quando il valore e\u0027 presente.","en":"In summary: `orElse` takes an already-computed value, and in Java arguments are evaluated eagerly before the call; therefore `compute()` ALWAYS runs, even when the Optional is present. The side effect prints \u0027compute\u0027, but `orElse` still returns \u0027value\u0027 because the Optional is not empty: output \u0027compute\\nvalue\u0027. To make the fallback lazy, use `orElseGet(Supplier)`.\nThe other options: \u0027value\u0027 ignores the eager execution of `compute()`; \u0027compute\\ndefault\u0027 and \u0027default\u0027 are wrong because the fallback is not used when the value is present."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"static String compute() {\n    System.out.println(\"compute\");\n    return \"default\";\n}\n\npublic static void main(String[] args) {\n    Optional\u003cString\u003e opt = Optional.of(\"value\");\n    String r = opt.orElseGet(() -\u003e compute());\n    System.out.println(r);\n}","options":[{"it":"compute\nvalue","en":"compute\nvalue"},{"it":"value","en":"value"},{"it":"compute\ndefault","en":"compute\ndefault"},{"it":"default","en":"default"}],"correct":1,"explanation":{"it":"In sintesi: `orElseGet(Supplier)` e\u0027 lazy: valuta il `Supplier` SOLO se l\u0027Optional e\u0027 vuoto. Qui l\u0027Optional contiene \u0027value\u0027, quindi la lambda `() -\u003e compute()` non viene mai invocata, \u0027compute\u0027 non si stampa e l\u0027output e\u0027 solo \u0027value\u0027. E\u0027 la differenza chiave con `orElse`, che valuta sempre il suo argomento a prescindere.\nLe altre opzioni: \u0027compute\\nvalue\u0027 e \u0027compute\\ndefault\u0027 assumono l\u0027esecuzione di `compute()` che qui non avviene; \u0027default\u0027 e\u0027 sbagliata perche\u0027 il fallback non serve quando il valore e\u0027 presente.","en":"In summary: `orElseGet(Supplier)` is lazy: it evaluates the `Supplier` ONLY if the Optional is empty. Here the Optional contains \u0027value\u0027, so the lambda `() -\u003e compute()` is never invoked, \u0027compute\u0027 is not printed, and the output is just \u0027value\u0027. This is the key difference from `orElse`, which always evaluates its argument regardless.\nThe other options: \u0027compute\\nvalue\u0027 and \u0027compute\\ndefault\u0027 assume `compute()` runs, which does not happen here; \u0027default\u0027 is wrong because the fallback is not needed when the value is present."}},{"type":"truefalse","prompt":{"it":"Optional.of(null) lancia una NullPointerException; per incapsulare un valore che potrebbe essere null bisogna usare Optional.ofNullable().","en":"Optional.of(null) throws a NullPointerException; to wrap a value that might be null you must use Optional.ofNullable()."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vera. `Optional.of(x)` richiede un valore non-null, internamente fa `Objects.requireNonNull(x)`, quindi lancia `NullPointerException` se x e\u0027 null; per incapsulare un riferimento potenzialmente null si usa `Optional.ofNullable(x)`, che ritorna `Optional.empty()` se x e\u0027 null. Usare `of()` con un null trasformerebbe l\u0027Optional, nato per evitare gli NPE, in una fonte di NPE.\nLe altre opzioni: \u0027Falso\u0027 e\u0027 l\u0027errore tipico di chi confonde `of` e `ofNullable`, ritenendo che `of(null)` produca un Optional vuoto invece di lanciare NPE.","en":"In summary: it is true. `Optional.of(x)` requires a non-null value; internally it calls `Objects.requireNonNull(x)`, so it throws `NullPointerException` if x is null. To wrap a potentially null reference, use `Optional.ofNullable(x)`, which returns `Optional.empty()` if x is null. Using `of()` with a null would turn Optional, designed to prevent NPEs, into a source of NPEs.\nThe other options: \u0027False\u0027 is the typical mistake of those who confuse `of` and `ofNullable`, believing that `of(null)` produces an empty Optional instead of throwing NPE."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"Function\u003cInteger, Integer\u003e f = x -\u003e x + 1;\nFunction\u003cInteger, Integer\u003e g = x -\u003e x * 2;\nSystem.out.println(f.andThen(g).apply(3));","options":[{"it":"7","en":"7"},{"it":"8","en":"8"},{"it":"6","en":"6"},{"it":"9","en":"9"}],"correct":1,"explanation":{"it":"In sintesi: `f.andThen(g)` applica PRIMA f e POI g sul risultato, cioe\u0027 g(f(3)) = g(4) = 8. La regola mnemonica e\u0027 `andThen` = \u0027poi\u0027, `compose` = \u0027prima\u0027.\nLe altre opzioni: 7 e\u0027 il risultato di `f.compose(g)` = f(g(3)) = f(6), il distrattore classico da confusione tra `andThen` e `compose`; 6 e 9 non corrispondono ad alcuna composizione delle due funzioni.","en":"In summary: `f.andThen(g)` applies f FIRST and THEN g on the result, i.e. g(f(3)) = g(4) = 8. The mnemonic is `andThen` = \u0027then\u0027, `compose` = \u0027before\u0027.\nThe other options: 7 is the result of `f.compose(g)` = f(g(3)) = f(6), the classic distractor from confusing `andThen` and `compose`; 6 and 9 do not correspond to any composition of the two functions."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"Predicate\u003cInteger\u003e positive = n -\u003e n \u003e 0;\nPredicate\u003cInteger\u003e even = n -\u003e n % 2 == 0;\nSystem.out.println(positive.and(even).negate().test(4));","options":[{"it":"true","en":"true"},{"it":"false","en":"false"},{"it":"Errore di compilazione","en":"Compilation error"},{"it":"NullPointerException","en":"NullPointerException"}],"correct":1,"explanation":{"it":"In sintesi: `positive.and(even)` e\u0027 vero solo se il numero e\u0027 positivo E pari; per 4 entrambe le condizioni valgono, quindi `and()` da\u0027 true, poi `negate()` lo inverte in false e `test(4)` ritorna false. `and`, `or` e `negate` sono metodi default di `Predicate` che restituiscono nuovi `Predicate` componibili.\nLe altre opzioni: \u0027true\u0027 dimentica la `negate()` finale; \u0027Errore di compilazione\u0027 e \u0027NullPointerException\u0027 sono escluse perche\u0027 il codice compila e non ci sono riferimenti null.","en":"In summary: `positive.and(even)` is true only if the number is positive AND even; for 4 both conditions hold, so `and()` gives true, then `negate()` inverts it to false and `test(4)` returns false. `and`, `or` and `negate` are default methods of `Predicate` that return new composable `Predicate`s.\nThe other options: \u0027true\u0027 forgets the final `negate()`; \u0027Compilation error\u0027 and \u0027NullPointerException\u0027 are ruled out because the code compiles and there are no null references."}},{"type":"mcq","prompt":{"it":"A quale categoria di method reference appartiene String::length quando usato come Function\u003cString, Integer\u003e?","en":"Which category of method reference does String::length belong to when used as a Function\u003cString, Integer\u003e?"},"code":"","options":[{"it":"Riferimento a un metodo statico","en":"Reference to a static method"},{"it":"Riferimento a un costruttore","en":"Reference to a constructor"},{"it":"Riferimento a un metodo di istanza di un oggetto arbitrario di un tipo particolare (unbound)","en":"Reference to an instance method of an arbitrary object of a particular type (unbound)"},{"it":"Riferimento a un metodo di istanza di un oggetto specifico (bound)","en":"Reference to an instance method of a specific object (bound)"}],"correct":2,"explanation":{"it":"In sintesi: `String::length` usato come `Function\u003cString, Integer\u003e` e\u0027 un unbound instance method reference: il ricevente su cui invocare `length()` non e\u0027 fissato, ma viene fornito come primo argomento della `Function` al momento dell\u0027applicazione, ed equivale a `s -\u003e s.length()`. La regola e\u0027 `Tipo::metodoIstanza` = unbound, `oggetto::metodoIstanza` = bound.\nLe altre opzioni: `length()` non e\u0027 statico ne\u0027 un costruttore; non e\u0027 bound perche\u0027 quello sarebbe del tipo `miaStringa::length`, con ricevente gia\u0027 fissato.","en":"In summary: `String::length` used as `Function\u003cString, Integer\u003e` is an unbound instance method reference: the receiver on which to call `length()` is not fixed but is supplied as the first argument of the `Function` at the time of application, and it is equivalent to `s -\u003e s.length()`. The rule is `Type::instanceMethod` = unbound, `object::instanceMethod` = bound.\nThe other options: `length()` is neither static nor a constructor; it is not bound because that would be of the form `myString::length`, with the receiver already fixed."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"List\u003cInteger\u003e nums = List.of(1, 2, 3, 4);\nint sum = nums.stream().reduce(0, Integer::sum);\nSystem.out.println(sum);","options":[{"it":"0","en":"0"},{"it":"10","en":"10"},{"it":"24","en":"24"},{"it":"Errore di compilazione","en":"Compilation error"}],"correct":1,"explanation":{"it":"In sintesi: `reduce(identity, accumulator)` parte da 0 e accumula con `Integer::sum` (il `BinaryOperator` che somma due interi): 0+1+2+3+4 = 10. Passando un identity, questa forma di `reduce` ritorna un `int` (non un `Optional`), quindi compila.\nLe altre opzioni: 0 confonde l\u0027identity con il risultato; 24 e\u0027 il prodotto 1*2*3*4, come se l\u0027accumulatore moltiplicasse; \u0027Errore di compilazione\u0027 e\u0027 escluso proprio perche\u0027 l\u0027identity garantisce il ritorno di un int.","en":"In summary: `reduce(identity, accumulator)` starts from 0 and accumulates with `Integer::sum` (the `BinaryOperator` that adds two integers): 0+1+2+3+4 = 10. By passing an identity, this form of `reduce` returns an `int` (not an `Optional`), so it compiles.\nThe other options: 0 confuses the identity with the result; 24 is the product 1*2*3*4, as if the accumulator multiplied; \u0027Compilation error\u0027 is ruled out precisely because the identity guarantees an int return."}},{"type":"code","prompt":{"it":"Qual e il contenuto della lista flat?","en":"What is the content of the flat list?"},"code":"List\u003cList\u003cInteger\u003e\u003e nested = List.of(\n    List.of(1, 2),\n    List.of(3, 4),\n    List.of(5)\n);\nList\u003cInteger\u003e flat = nested.stream()\n    .flatMap(List::stream)\n    .collect(Collectors.toList());","options":[{"it":"[[1, 2], [3, 4], [5]]","en":"[[1, 2], [3, 4], [5]]"},{"it":"[1, 2, 3, 4, 5]","en":"[1, 2, 3, 4, 5]"},{"it":"[1, 3, 5]","en":"[1, 3, 5]"},{"it":"Errore di compilazione","en":"Compilation error"}],"correct":1,"explanation":{"it":"In sintesi: `flatMap` trasforma ogni elemento in uno stream e poi CONCATENA (appiattisce) tutti gli stream risultanti in uno solo; ogni `List\u003cInteger\u003e` diventa uno `Stream\u003cInteger\u003e` via `List::stream` e i tre stream si uniscono preservando l\u0027ordine, dando [1, 2, 3, 4, 5]. La differenza chiave e\u0027: `map` e\u0027 1-a-1, `flatMap` e\u0027 1-a-molti con appiattimento.\nLe altre opzioni: [[1, 2], [3, 4], [5]] sarebbe il risultato di `map`, che manterrebbe la struttura annidata; [1, 3, 5] e\u0027 sbagliata perche\u0027 `flatMap` non filtra; il codice compila.","en":"In summary: `flatMap` transforms each element into a stream and then CONCATENATES (flattens) all the resulting streams into one; each `List\u003cInteger\u003e` becomes a `Stream\u003cInteger\u003e` via `List::stream` and the three streams merge preserving order, giving [1, 2, 3, 4, 5]. The key difference is: `map` is 1-to-1, `flatMap` is 1-to-many with flattening.\nThe other options: [[1, 2], [3, 4], [5]] would be the result of `map`, which would keep the nested structure; [1, 3, 5] is wrong because `flatMap` does not filter; the code compiles."}},{"type":"code","prompt":{"it":"Quale Map produce questo codice?","en":"Which Map does this code produce?"},"code":"Map\u003cCharacter, List\u003cString\u003e\u003e m = Stream.of(\"apple\", \"banana\", \"avocado\", \"cherry\")\n    .collect(Collectors.groupingBy(s -\u003e s.charAt(0)));\nSystem.out.println(m);","options":[{"it":"{a=apple, b=banana, a=avocado, c=cherry}","en":"{a=apple, b=banana, a=avocado, c=cherry}"},{
