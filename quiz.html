gale","Solo ai dati particolari (categorie speciali) dell\u0027art. 9"],"correct":1,"explanation":"In sintesi: il diritto alla portabilita\u0027 (art. 20 `GDPR`) si applica solo ai trattamenti che soddisfano due condizioni cumulative: la base giuridica e\u0027 il consenso (art. 6.1.a o 9.2.a) oppure un contratto (art. 6.1.b), e il trattamento e\u0027 effettuato con mezzi automatizzati.\nLe altre opzioni: sono quindi esclusi i trattamenti fondati su obbligo legale o legittimo interesse; il diritto non si applica indistintamente a tutti i trattamenti e non e\u0027 ristretto ai soli dati particolari dell\u0027art. 9."},{"type":"mcq","prompt":"Nell\u0027ambito AML/KYC, cosa si intende per \u0027adeguata verifica della clientela rafforzata\u0027 (Enhanced Due Diligence)?","code":"","options":["Un livello di verifica ridotto applicato ai clienti abituali per velocizzare l\u0027onboarding","Un insieme di misure di verifica più stringenti applicate in situazioni a maggior rischio di riciclaggio, come rapporti con PEP o con paesi terzi ad alto rischio","La verifica svolta esclusivamente al momento della chiusura del rapporto","Un controllo che sostituisce del tutto l\u0027identificazione del titolare effettivo"],"correct":1,"explanation":"In sintesi: l\u0027`Enhanced Due Diligence` (adeguata verifica rafforzata) e\u0027 l\u0027insieme di misure piu\u0027 stringenti applicate nelle situazioni a maggior rischio di riciclaggio: approfondimento sull\u0027origine dei fondi e del patrimonio, autorizzazione di livello dirigenziale e monitoraggio rafforzato, in casi come rapporti con `PEP`, clientela di paesi terzi ad alto rischio e operazioni complesse o anomale.\nLe altre opzioni: e\u0027 l\u0027opposto della verifica semplificata, non si svolge solo alla chiusura del rapporto e non sostituisce ma rafforza l\u0027identificazione del titolare effettivo."},{"type":"mcq","prompt":"Chi è una PEP (Persona Esposta Politicamente) nella normativa antiriciclaggio?","code":"","options":["Qualsiasi cliente con un patrimonio elevato","Una persona fisica che occupa o ha occupato importanti cariche pubbliche, e per estensione i suoi familiari e soggetti notoriamente legati","Solo il cliente residente in un paese terzo ad alto rischio","Un dipendente della banca con accesso ai dati dei clienti"],"correct":1,"explanation":"In sintesi: una `PEP` e\u0027 una persona fisica che occupa o ha occupato importanti cariche pubbliche, come capi di Stato, ministri, parlamentari, alti magistrati o vertici di enti e societa\u0027 partecipate, e la definizione si estende ai familiari e ai soggetti notoriamente legati. Lo status comporta un maggior rischio di corruzione e riciclaggio e impone l\u0027adeguata verifica rafforzata.\nLe altre opzioni: non dipende dal solo patrimonio elevato, non coincide con la residenza in un paese terzo ad alto rischio e non riguarda i dipendenti della banca con accesso ai dati."},{"type":"truefalse","prompt":"In caso di segnalazione di operazione sospetta (SOS) di riciclaggio, il soggetto obbligato deve informare il cliente interessato che la segnalazione è stata effettuata, per trasparenza.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: e\u0027 falso. Vige il divieto di divulgazione (`tipping-off`): il soggetto obbligato non deve comunicare al cliente ne\u0027 a terzi che e\u0027 stata effettuata, o e\u0027 in corso di valutazione, una segnalazione di operazione sospetta all\u0027`UIF`, perche\u0027 cio\u0027 comprometterebbe le indagini e consentirebbe l\u0027occultamento dei fondi.\nLe altre opzioni: l\u0027errore tipico e\u0027 scambiare la trasparenza verso il cliente con un obbligo: la riservatezza della `SOS` e\u0027 un principio cardine dell\u0027antiriciclaggio, non un dovere informativo."},{"type":"mcq","prompt":"Qual è l\u0027obiettivo principale delle procedure KYC (Know Your Customer)?","code":"","options":["Massimizzare la vendita di prodotti finanziari al cliente","Identificare e verificare l\u0027identità del cliente e del titolare effettivo, comprendere la natura e lo scopo del rapporto per prevenire riciclaggio e finanziamento del terrorismo","Determinare il rating creditizio del cliente ai fini della concessione di un mutuo","Raccogliere dati di marketing per profilare le abitudini di spesa"],"correct":1,"explanation":"In sintesi: l\u0027obiettivo del `KYC` (`Know Your Customer`) e\u0027 identificare e verificare l\u0027identita\u0027 del cliente e dell\u0027eventuale titolare effettivo e comprendere natura, scopo e profilo di rischio del rapporto, per prevenire il riciclaggio e il finanziamento del terrorismo (`AML/CFT`).\nLe altre opzioni: il KYC non e\u0027 finalizzato a massimizzare le vendite ne\u0027 alla profilazione di marketing, e sebbene alcune informazioni si sovrappongano, resta concettualmente distinto dalla valutazione del merito creditizio (credit scoring)."},{"type":"mcq","prompt":"In finanza, cosa descrive l\u0027asset allocation di un portafoglio?","code":"","options":["La ripartizione del capitale tra diverse classi di attività (es. azioni, obbligazioni, liquidità, immobiliare) in funzione di obiettivi e profilo di rischio","La singola azione con il rendimento più alto degli ultimi 12 mesi","Il numero totale di titoli detenuti, indipendentemente dalla loro tipologia","La commissione applicata dal gestore sul portafoglio"],"correct":0,"explanation":"In sintesi: l\u0027`asset allocation` e\u0027 la ripartizione strategica del capitale tra le diverse classi di attivita\u0027 (azioni, obbligazioni, liquidita\u0027, immobiliare, materie prime), coerente con obiettivi, orizzonte temporale e profilo di rischio del cliente. E\u0027 il principale determinante del profilo rischio/rendimento del portafoglio.\nLe altre opzioni: non coincide con la singola azione piu\u0027 performante, non e\u0027 il mero numero di titoli detenuti e non e\u0027 la commissione applicata dal gestore."},{"type":"mcq","prompt":"Cosa rappresenta il \u0027profilo di rischio\u0027 di un investitore?","code":"","options":["Esclusivamente la percentuale di perdita che ha già subito in passato","La combinazione tra la tolleranza al rischio (propensione soggettiva) e la capacità di sostenere perdite (situazione finanziaria oggettiva), insieme all\u0027orizzonte temporale","Il rendimento medio garantito dai suoi investimenti","La sola età anagrafica del cliente"],"correct":1,"explanation":"In sintesi: il profilo di rischio combina due dimensioni distinte: la tolleranza al rischio, cioe\u0027 la propensione soggettiva e psicologica ad accettare oscillazioni di valore, e la capacita\u0027 di sostenere perdite, cioe\u0027 la situazione finanziaria oggettiva che determina quanto il cliente puo\u0027 permettersi di perdere; vi concorre anche l\u0027orizzonte temporale. E\u0027 un input chiave della valutazione di adeguatezza `MiFID II`.\nLe altre opzioni: non si riduce alle perdite gia\u0027 subite, non e\u0027 un rendimento medio garantito (inesistente) e non coincide con la sola eta\u0027 anagrafica."},{"type":"mcq","prompt":"Perché la diversificazione riduce il rischio complessivo di un portafoglio?","code":"","options":["Perché elimina completamente ogni tipo di rischio, incluso quello di mercato","Perché combinando attività i cui rendimenti non sono perfettamente correlati si riduce il rischio specifico (idiosincratico), pur restando il rischio sistematico di mercato","Perché aumenta automaticamente il rendimento atteso senza alcun costo","Perché concentra gli investimenti sui titoli più performanti"],"correct":1,"explanation":"In sintesi: la diversificazione riduce il rischio perche\u0027, combinando attivita\u0027 i cui rendimenti non sono perfettamente correlati, le oscillazioni tendono a compensarsi e si abbatte il rischio specifico (idiosincratico), legato al singolo emittente. Resta invece il rischio sistematico di mercato, che colpisce l\u0027intero mercato e non e\u0027 diversificabile.\nLe altre opzioni: non elimina ogni tipo di rischio incluso quello di mercato, non aumenta il rendimento atteso a costo zero e per definizione e\u0027 l\u0027opposto della concentrazione sui pochi titoli migliori."},{"type":"truefalse","prompt":"Secondo il principio del rapporto rischio/rendimento (risk-return trade-off), a un maggiore rendimento atteso corrisponde generalmente un maggiore rischio che l\u0027investitore deve essere disposto ad assumere.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero. Il `risk-return trade-off` e\u0027 un principio fondamentale: gli investitori, mediamente avversi al rischio, richiedono un premio per il rischio, cioe\u0027 un extra rendimento atteso, per detenere attivita\u0027 piu\u0027 rischiose, quindi a un rendimento atteso piu\u0027 elevato corrisponde normalmente una maggiore volatilita\u0027 e incertezza dei risultati.\nLe altre opzioni: l\u0027errore tipico e\u0027 leggerlo come garanzia: e\u0027 il rendimento atteso a crescere, non quello garantito, e un rischio elevato non implica automaticamente un rendimento elevato effettivamente realizzato."},{"type":"mcq","prompt":"Cosa introduce la Strong Customer Authentication (SCA) prevista dalla PSD2?","code":"","options":["Un\u0027autenticazione basata su almeno due fattori indipendenti tra le categorie conoscenza, possesso e inerenza (biometria)","Un\u0027unica password complessa condivisa tra banca e cliente","L\u0027obbligo di autenticare il cliente solo tramite impronta digitale","L\u0027eliminazione di qualsiasi autenticazione per i pagamenti sotto i 1000 euro"],"correct":0,"explanation":"In sintesi: la `Strong Customer Authentication` (`SCA`) prevista dalla `PSD2` richiede almeno due fattori indipendenti appartenenti a categorie diverse: conoscenza (qualcosa che l\u0027utente sa, es. il PIN), possesso (qualcosa che l\u0027utente ha, es. lo smartphone o un token) e inerenza (qualcosa che l\u0027utente e\u0027, es. l\u0027impronta o il riconoscimento facciale). L\u0027indipendenza dei fattori garantisce che la compromissione di uno non comprometta gli altri.\nLe altre opzioni: non e\u0027 un\u0027unica password condivisa ne\u0027 un solo fattore biometrico, ed esistono esenzioni per operazioni a basso rischio o importo (es. la soglia dei 30 euro), ma non un\u0027esenzione fissa e generalizzata a 1000 euro."},{"type":"mcq","prompt":"Nella PSD2, qual è la differenza tra un AISP e un PISP?","code":"","options":["L\u0027AISP (Account Information Service Provider) aggrega e fornisce informazioni sui conti; il PISP (Payment Initiation Service Provider) dispone/inizia pagamenti per conto dell\u0027utente","Sono due nomi per lo stesso servizio di custodia titoli","L\u0027AISP emette carte di credito, il PISP gestisce i mutui","Entrambi possono detenere i fondi del cliente sui propri conti"],"correct":0,"explanation":"In sintesi: nella `PSD2` l\u0027`AISP` (`Account Information Service Provider`) aggrega e fornisce informazioni sui conti dell\u0027utente, mentre il `PISP` (`Payment Initiation Service Provider`) dispone e inizia pagamenti dal conto dell\u0027utente per suo conto. Entrambi operano nell\u0027`open banking` come terze parti (`TPP`), previa autorizzazione dell\u0027utente, e non entrano mai in possesso dei fondi del cliente.\nLe altre opzioni: non sono lo stesso servizio di custodia titoli, non riguardano emissione di carte o gestione di mutui e, soprattutto, non possono detenere i fondi del cliente sui propri conti."},{"type":"mcq","prompt":"Un cliente retail acquista, di propria iniziativa e senza consulenza, uno strumento finanziario complesso (es. un certificate a leva) tramite l\u0027home banking. Quale valutazione deve svolgere l\u0027intermediario secondo MiFID II?","code":"","options":["Nessuna valutazione, perché l\u0027operazione è su iniziativa del cliente","La valutazione di adeguatezza completa (conoscenza, situazione finanziaria e obiettivi)","La valutazione di appropriatezza, verificando conoscenza ed esperienza del cliente rispetto allo strumento complesso, con eventuale avvertenza in caso di esito negativo","Solo la verifica antiriciclaggio KYC, senza alcuna valutazione MiFID"],"correct":2,"explanation":"In sintesi: qui va svolta la valutazione di appropriatezza. L\u0027esenzione `execution only` richiede tra l\u0027altro che lo strumento sia non complesso: un `certificate a leva` e\u0027 complesso, quindi l\u0027esenzione non si applica anche se l\u0027operazione e\u0027 su iniziativa del cliente. Non essendoci consulenza ne\u0027 gestione non scatta l\u0027adeguatezza, ma l\u0027appropriatezza, che verifica conoscenza ed esperienza rispetto al prodotto; in caso di esito negativo o di mancata informazione l\u0027intermediario deve avvertire il cliente.\nLe altre opzioni: non e\u0027 corretto non fare nulla per via dell\u0027iniziativa del cliente, non serve l\u0027adeguatezza completa (mancano consulenza e gestione) e il `KYC` `AML` e\u0027 un obbligo distinto che non sostituisce la valutazione `MiFID`."},{"type":"mcq","prompt":"[Stretch] Un\u0027app fintech vuole trattare i dati di transazione dei clienti per finalità di prevenzione frodi. Qual è, di norma, la base giuridica più solida e la considerazione corretta?","code":"","options":["Il consenso, perché è sempre la base giuridica preferibile e più forte in ogni scenario","Il legittimo interesse o l\u0027obbligo legale a seconda del contesto, con la considerazione che un consenso revocabile sarebbe una base fragile per un\u0027attività antifrode che deve poter proseguire","I dati di frode non sono dati personali, quindi il GDPR non si applica","Basta l\u0027anonimizzazione dei dati per non applicare alcuna base giuridica"],"correct":1,"explanation":"In sintesi: per la prevenzione delle frodi la base giuridica piu\u0027 solida e\u0027 di norma il legittimo interesse del titolare o l\u0027obbligo legale, a seconda del contesto. Il consenso sarebbe fragile perche\u0027 revocabile in qualsiasi momento e libero: permetterebbe al potenziale frodatore di disattivare i controlli, vanificando la finalita\u0027; il legittimo interesse per l\u0027antifrode e\u0027 esplicitamente richiamato dal considerando 47 `GDPR`, l\u0027obbligo legale deriva ad esempio dall\u0027antiriciclaggio.\nLe altre opzioni: il consenso non e\u0027 sempre la base preferibile, i dati di transazione riferibili a una persona sono dati personali e il `GDPR` si applica, e l\u0027anonimizzazione escluderebbe il dato dal GDPR ma non e\u0027 praticabile se occorre agire sul singolo cliente."},{"type":"truefalse","prompt":"[Stretch] Ai fini della valutazione di adeguatezza MiFID II, se il cliente si rifiuta di fornire le informazioni necessarie su conoscenza, situazione finanziaria e obiettivi, l\u0027intermediario può comunque prestare il servizio di consulenza raccomandando il prodotto che ritiene migliore.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: e\u0027 falso. Nella prestazione di consulenza o gestione di portafogli, se il cliente rifiuta di fornire le informazioni necessarie su conoscenza, situazione finanziaria e obiettivi, l\u0027intermediario non puo\u0027 formulare raccomandazioni personalizzate ne\u0027 prestare il servizio, perche\u0027 non e\u0027 in grado di verificare l\u0027adeguatezza; la `MiFID II` vieta espressamente di aggirare l\u0027assenza di informazioni.\nLe altre opzioni: l\u0027errore tipico e\u0027 confondere questo caso con l\u0027appropriatezza (altri servizi), dove il rifiuto comporta un\u0027avvertenza ma non necessariamente il blocco dell\u0027operazione."},{"type":"mcq","prompt":"[Stretch] Nella product governance MiFID II, un distributore individua che una parte della clientela a cui sta collocando un prodotto ricade nel target market negativo definito dal produttore. Qual è la condotta corretta?","code":"","options":["Procedere comunque, perché il target market negativo è solo indicativo e non vincolante","Vendere il prodotto solo in casi giustificati e documentati che si discostano dal target market, mantenendo la regola generale di non collocarlo alla clientela del target negativo","Ignorare il target market del produttore e definirne uno proprio completamente autonomo","Sospendere ogni attività di distribuzione di qualsiasi prodotto fino a nuova comunicazione dell\u0027autorità"],"correct":1,"explanation":"In sintesi: la condotta corretta e\u0027 vendere il prodotto alla clientela del target market negativo solo in casi eccezionali, giustificati e documentati che si discostano dal target, mantenendo la regola generale di non collocarlo a quella clientela. Le linee guida `ESMA` ammettono deroghe solo se coerenti con la strategia complessiva, ad esempio a fini di diversificazione in un portafoglio gestito o consulenziato, e adeguatamente documentate.\nLe altre opzioni: il target negativo non e\u0027 meramente indicativo, il distributore deve affinare ma non ignorare quello del produttore e non e\u0027 prevista alcuna sospensione di ogni attivita\u0027 di distribuzione."},{"type":"mcq","prompt":"[Stretch] Un cliente esercita il diritto di accesso (art. 15 GDPR) chiedendo copia dei propri dati a una banca. La banca detiene anche una segnalazione di operazione sospetta (SOS) relativa al cliente. Come deve comportarsi?","code":"","options":["Fornire tutti i dati, inclusa la SOS, per rispettare integralmente il diritto di accesso","Fornire i dati personali oggetto del diritto di accesso, ma non è tenuta a rivelare l\u0027esistenza e il contenuto della SOS, in virtù del divieto di tipping-off e delle limitazioni previste in materia antiriciclaggio","Negare in blocco il diritto di accesso perché esiste una SOS","Fornire la SOS solo se il cliente firma una liberatoria"],"correct":1,"explanation":"In sintesi: la banca deve fornire i dati personali oggetto del diritto di accesso (art. 15 `GDPR`), ma non e\u0027 tenuta a rivelare l\u0027esistenza e il contenuto della `SOS`, in virtu\u0027 del divieto di `tipping-off` e delle limitazioni antiriciclaggio; lo stesso GDPR ammette limitazioni ai diritti dell\u0027interessato quando necessario per prevenire e indagare reati (art. 23, e in Italia la disciplina `AML`).\nLe altre opzioni: non deve fornire la SOS per completezza, non deve negare in blocco l\u0027intero accesso e nessuna liberatoria del cliente potrebbe legittimare la divulgazione della segnalazione."}]},{"id":"collections","title":"Collections \u0026 Generics","questions":[{"type":"mcq","prompt":"Devi memorizzare una lista su cui esegui frequenti accessi casuali per indice (get(i)) e poche inserzioni/rimozioni in mezzo. Quale implementazione scegli e perché?","code":"","options":["ArrayList, perché get(int) è O(1) grazie all\u0027array interno","LinkedList, perché get(int) è O(1) grazie ai nodi collegati","ArrayList, perché get(int) è O(log n) grazie alla ricerca binaria","LinkedList, perché evita il resize dell\u0027array ed è quindi più veloce in lettura"],"correct":0,"explanation":"In sintesi: `ArrayList` è basata su un array dinamico, quindi `get(int)` è accesso diretto per offset in O(1); `LinkedList` deve scorrere i nodi, quindi `get(int)` è O(n). Per un pattern read-heavy con accesso per indice `ArrayList` è la scelta corretta.\nLe altre opzioni: `LinkedList.get` è O(n), non O(1); `ArrayList` non usa ricerca binaria ma accesso diretto; il resize non impatta le letture ed è ammortizzato."},{"type":"mcq","prompt":"Qual è la complessità nel caso medio di LinkedList.get(int index) e di ArrayList.add(E) (append in coda)?","code":"","options":["LinkedList.get O(n), ArrayList.add O(1) ammortizzato","LinkedList.get O(1), ArrayList.add O(n)","LinkedList.get O(log n), ArrayList.add O(log n)","LinkedList.get O(n), ArrayList.add O(n) sempre"],"correct":0,"explanation":"In sintesi: `LinkedList.get(int)` deve percorrere la catena di nodi fino all\u0027indice, quindi O(n); `ArrayList.add` in coda scrive nella prima cella libera in O(1) e solo saltuariamente paga il resize, restando O(1) ammortizzato.\nLe altre opzioni: `LinkedList.get` non è O(1) né O(log n) perché non c\u0027è accesso diretto; `ArrayList.add` in coda non è O(n) sempre, lo diventa solo al resize."},{"type":"code","prompt":"Cosa stampa questo snippet?","code":"Set\u003cString\u003e set = new LinkedHashSet\u003c\u003e();\nset.add(\"C\");\nset.add(\"A\");\nset.add(\"B\");\nset.add(\"A\");\nSystem.out.println(set);","options":["[C, A, B]","[A, B, C]","[A, A, B, C]","[C, A, B, A]"],"correct":0,"explanation":"In sintesi: `LinkedHashSet` mantiene l\u0027ordine di inserzione e, come ogni `Set`, rifiuta i duplicati: il secondo \"A\" viene ignorato, quindi l\u0027output è [C, A, B]. È l\u0027implementazione da usare quando serve unicità ma anche ordine prevedibile.\nLe altre opzioni: [A, B, C] sarebbe un `TreeSet` (ordine naturale); il duplicato \"A\" non viene mai memorizzato due volte; l\u0027ordine non viene alterato rispetto all\u0027inserzione."},{"type":"mcq","prompt":"Quale implementazione di Set garantisce che l\u0027iterazione avvenga secondo l\u0027ordinamento naturale (o di un Comparator) degli elementi?","code":"","options":["TreeSet","HashSet","LinkedHashSet","CopyOnWriteArraySet"],"correct":0,"explanation":"In sintesi: `TreeSet` è basato su un red-black tree e mantiene gli elementi ordinati secondo l\u0027ordinamento naturale (`Comparable`) o un `Comparator` fornito; l\u0027iterazione è quindi sorted, al costo di O(log n) per le operazioni base.\nLe altre opzioni: `HashSet` non dà alcuna garanzia d\u0027ordine; `LinkedHashSet` mantiene l\u0027ordine di inserzione, non quello naturale; `CopyOnWriteArraySet` conserva l\u0027ordine di inserzione."},{"type":"mcq","prompt":"In HashMap (Java 8+), come viene determinato il bucket in cui finisce una chiave?","code":"","options":["Si applica uno spreading all\u0027hashCode (h ^ (h \u003e\u003e\u003e 16)) e poi si calcola (n-1) \u0026 hash, dove n è la capacità (potenza di 2)","Si usa direttamente hashCode() % dimensione, senza alcun rimescolamento","Si usa l\u0027identityHashCode dell\u0027oggetto modulo la capacità","Si ordina la chiave con compareTo() e si assegna il bucket per posizione"],"correct":0,"explanation":"In sintesi: `HashMap` prende l\u0027`hashCode` della chiave, applica uno spreading (h ^ (h \u003e\u003e\u003e 16)) per mescolare i bit alti sui bassi, e poi indicizza con (n-1) \u0026 hash sfruttando il fatto che la capacità è una potenza di 2. Questo riduce le collisioni quando gli hashCode differiscono solo nei bit alti.\nLe altre opzioni: non usa un modulo sull\u0027hashCode grezzo; non usa `identityHashCode` (userebbe l\u0027`hashCode()` sovrascritto); `compareTo` non entra nell\u0027indicizzazione di un `HashMap`."},{"type":"mcq","prompt":"Qual è il load factor di default di HashMap e cosa comporta?","code":"","options":["0.75: quando il numero di entry supera capacità * 0.75 la tabella viene raddoppiata (resize/rehash)","1.0: il resize avviene solo quando tutti i bucket sono pieni","0.5: la tabella viene raddoppiata a metà riempimento per massimizzare la velocità","0.75: è la percentuale di bucket che vengono convertiti in alberi"],"correct":0,"explanation":"In sintesi: il load factor di default è 0.75, un compromesso tra spazio e tempo: quando size supera capacità * 0.75 (il threshold) `HashMap` raddoppia la tabella e riesegue il rehash delle entry, mantenendo basso il numero di collisioni per bucket.\nLe altre opzioni: 1.0 aumenterebbe troppo le collisioni; 0.5 sprecherebbe memoria e non è il default; il load factor non ha nulla a che vedere con la treeification dei bucket."},{"type":"truefalse","prompt":"In Java 8+, HashMap converte la lista concatenata di un bucket in un albero rosso-nero quando le entry nel bucket raggiungono TREEIFY_THRESHOLD (8), ma solo se la capacità della tabella è almeno 64; altrimenti effettua un resize.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero. La treeification scatta a 8 elementi nello stesso bucket, ma con la condizione aggiuntiva MIN_TREEIFY_CAPACITY = 64; sotto quella capacità `HashMap` preferisce fare un resize invece di alberare, perché con poche celle ridistribuire risolve meglio le collisioni. La conversione porta il caso peggiore del bucket da O(n) a O(log n).\nLe altre opzioni: chi risponde Falso di solito ricorda solo la soglia 8 dimenticando il vincolo di capacità 64, o crede che la conversione sia immediata e incondizionata."},{"type":"code","prompt":"Cosa succede eseguendo questo codice?","code":"List\u003cInteger\u003e list = new ArrayList\u003c\u003e(List.of(1, 2, 3, 4));\nfor (Integer x : list) {\n    if (x % 2 == 0) {\n        list.remove(x);\n    }\n}","options":["Lancia ConcurrentModificationException perché si modifica la lista durante l\u0027iterazione con for-each","Rimuove i numeri pari e la lista diventa [1, 3] senza errori","Errore di compilazione: remove(Integer) non esiste","Entra in loop infinito"],"correct":0,"explanation":"In sintesi: il for-each usa l\u0027`Iterator` dell\u0027`ArrayList`, che è fail-fast: confronta `modCount` con `expectedModCount` e, vedendo che `list.remove` ha modificato la struttura senza passare dall\u0027iteratore, lancia `ConcurrentModificationException`. La via corretta è `iterator.remove()` oppure `removeIf`.\nLe altre opzioni: non produce [1, 3] perché fallisce prima; `remove(Object)` esiste e compila (qui rimuove per valore, non per indice); non è un loop infinito ma un\u0027eccezione."},{"type":"mcq","prompt":"Quale collezione permette di iterare mentre viene modificata (anche da un altro thread) senza lanciare ConcurrentModificationException, grazie a un iteratore weakly consistent o su snapshot?","code":"","options":["ConcurrentHashMap e CopyOnWriteArrayList","HashMap e ArrayList","Collections.synchronizedList(new ArrayList\u003c\u003e())","TreeMap avvolto in un blocco synchronized"],"correct":0,"explanation":"In sintesi: le collezioni fail-safe di java.util.concurrent, come `ConcurrentHashMap` (iteratore weakly consistent) e `CopyOnWriteArrayList` (iteratore su snapshot), non lanciano `ConcurrentModificationException` perché non si basano su `modCount`. Il prezzo è che l\u0027iteratore può non riflettere le modifiche più recenti.\nLe altre opzioni: `HashMap`/`ArrayList` sono fail-fast; `synchronizedList` protegge dalle race ma il suo iteratore resta fail-fast e va comunque sincronizzato a mano; un `TreeMap` wrappato in synchronized ha lo stesso iteratore fail-fast."},{"type":"mcq","prompt":"Qual è la differenza corretta tra Comparable e Comparator?","code":"","options":["Comparable definisce l\u0027ordinamento naturale nella classe stessa (compareTo, un solo criterio); Comparator è esterno e permette di definire più criteri di ordinamento (compare)","Comparable è esterno alla classe, Comparator è implementato dalla classe stessa","Sono sinonimi: entrambi dichiarano compareTo()","Comparable serve per le Map, Comparator solo per le List"],"correct":0,"explanation":"In sintesi: `Comparable` si implementa nella classe dell\u0027oggetto e definisce l\u0027ordinamento naturale con `compareTo` (un unico criterio); `Comparator` è una strategia esterna con `compare`, che consente di definire ordinamenti alternativi e componibili senza toccare la classe.\nLe altre opzioni: i ruoli interno/esterno sono invertiti; non sono sinonimi (`Comparator` usa `compare`, non `compareTo`); la distinzione non ha a che fare con Map vs List."},{"type":"code","prompt":"Cosa stampa questo snippet?","code":"List\u003cString\u003e words = new ArrayList\u003c\u003e(List.of(\"bb\", \"a\", \"ccc\", \"dd\"));\nwords.sort(Comparator.comparingInt(String::length)\n                     .thenComparing(Comparator.naturalOrder()));\nSystem.out.println(words);","options":["[a, bb, dd, ccc]","[a, dd, bb, ccc]","[ccc, bb, dd, a]","[a, bb, ccc, dd]"],"correct":0,"explanation":"In sintesi: il `Comparator` ordina prima per lunghezza crescente e, a parità di lunghezza, per ordine naturale (alfabetico). Le lunghezze sono a=1, bb=2, dd=2, ccc=3; tra \"bb\" e \"dd\" (stessa lunghezza) vince l\u0027alfabetico \"bb\" prima di \"dd\", quindi [a, bb, dd, ccc].\nLe altre opzioni: [a, dd, bb, ccc] invertirebbe il tie-break alfabetico; [ccc, bb, dd, a] è l\u0027ordine per lunghezza decrescente; [a, bb, ccc, dd] ignora che \"ccc\" ha lunghezza 3."},{"type":"mcq","prompt":"Cosa si intende per type erasure nei generics Java?","code":"","options":["I parametri di tipo esistono solo a compile-time: dopo la compilazione il tipo viene rimosso e sostituito con il bound (o Object), quindi a runtime List\u003cString\u003e e List\u003cInteger\u003e sono la stessa classe","Il compilatore genera una classe distinta per ogni tipo concreto usato, come i template C++","I generics vengono conservati nel bytecode e sono ispezionabili a runtime con getClass()","È il meccanismo con cui la JVM cancella gli oggetti non più referenziati"],"correct":0,"explanation":"In sintesi: la type erasure significa che i parametri di tipo servono solo al controllo statico del compilatore e vengono cancellati nel bytecode, sostituiti dal loro bound (o `Object`); a runtime `List\u003cString\u003e` e `List\u003cInteger\u003e` condividono la stessa classe `List`. È una scelta per la compatibilità all\u0027indietro con il codice pre-generics.\nLe altre opzioni: Java non reifica i generics come i template C++; il tipo parametrico non è ispezionabile a runtime via `getClass()`; la cancellazione degli oggetti non referenziati è la garbage collection, non l\u0027erasure."},{"type":"truefalse","prompt":"A causa della type erasure, in Java non è possibile scrivere new T() né usare l\u0027espressione obj instanceof List\u003cString\u003e.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero. Poiché il tipo T viene cancellato a runtime, il compilatore non conosce il costruttore da invocare per `new T()`, e `instanceof List\u003cString\u003e` è vietato perché a runtime esiste solo `List` (è ammesso solo `List\u003c?\u003e`). Sono conseguenze dirette dell\u0027erasure.\nLe altre opzioni: chi risponde Falso spesso confonde con linguaggi a generics reificati (come C#), dove queste operazioni sono lecite."},{"type":"mcq","prompt":"Secondo la regola PECS, come dichiari un parametro da cui LEGGI elementi (producer) e uno su cui SCRIVI elementi (consumer)?","code":"","options":["Producer: ? extends T (leggi come T); Consumer: ? super T (scrivi T)","Producer: ? super T; Consumer: ? extends T","Entrambi con ? extends T","Entrambi con ? super T"],"correct":0,"explanation":"In sintesi: PECS sta per Producer Extends, Consumer Super. Se una struttura produce/fornisce valori che leggi, usi `? extends T` e li leggi in sicurezza come T; se la consumi scrivendoci dentro, usi `? super T` e puoi aggiungere T (e sottotipi).\nLe altre opzioni: invertire extends e super rompe la type safety; usare solo extends impedisce la scrittura; usare solo super degrada la lettura al tipo `Object`."},{"type":"code","prompt":"Quale riga NON compila?","code":"List\u003c? extends Number\u003e nums = new ArrayList\u003cInteger\u003e(List.of(1, 2, 3));\nNumber n = nums.get(0);   // riga A\nnums.add(4);              // riga B","options":["La riga B: su List\u003c? extends Number\u003e non si può fare add (tranne null), perché il tipo esatto è sconosciuto","La riga A: non si può leggere da un wildcard extends","Compila tutto: l\u0027output è 1 e la lista diventa [1, 2, 3, 4]","Entrambe le righe falliscono a compile-time"],"correct":0,"explanation":"In sintesi: con `? extends Number` puoi leggere in sicurezza (ogni elemento è almeno un `Number`, riga A ok), ma non puoi aggiungere nulla di diverso da null, perché il compilatore non sa se la lista concreta sia di `Integer`, `Double` o altro: la riga B non compila. È il lato Producer Extends del PECS.\nLe altre opzioni: la lettura come `Number` è sempre lecita; non compila tutto perché `add` è vietata; non falliscono entrambe, solo la `add`."},{"type":"code","prompt":"Quale riga NON compila?","code":"List\u003c? super Integer\u003e list = new ArrayList\u003cNumber\u003e();\nlist.add(10);            // riga A\nlist.add(20);            // riga B\nInteger x = list.get(0); // riga C","options":["La riga C: da List\u003c? super Integer\u003e si legge solo come Object, non come Integer","La riga A: non si può aggiungere a un wildcard super","Compila tutto senza errori","Le righe A e B non compilano"],"correct":0,"explanation":"In sintesi: con `? super Integer` puoi aggiungere `Integer` (e suoi sottotipi) in sicurezza, quindi A e B compilano; ma in lettura il compilatore garantisce solo il supertipo comune `Object`, perciò assegnare direttamente a `Integer` (riga C) non compila senza cast. È il lato Consumer Super del PECS.\nLe altre opzioni: aggiungere `Integer` è esattamente ciò che super consente; non compila tutto perché la `get` tipizzata a `Integer` fallisce; A e B sono corrette."},{"type":"mcq","prompt":"Vuoi scrivere un metodo generico max(List\u003cT\u003e) che funzioni solo con tipi ordinabili tra loro. Quale firma è corretta?","code":"","options":["\u003cT extends Comparable\u003cT\u003e\u003e T max(List\u003cT\u003e list)","\u003cT super Comparable\u003cT\u003e\u003e T max(List\u003cT\u003e list)","\u003cT extends Comparator\u003cT\u003e\u003e T max(List\u003cT\u003e list)","\u003c? extends Comparable\u003cT\u003e\u003e T max(List\u003cT\u003e list)"],"correct":0,"explanation":"In sintesi: un bounded type parameter `\u003cT extends Comparable\u003cT\u003e\u003e` vincola T a essere confrontabile con sé stesso, così dentro il metodo puoi chiamare `compareTo`. È la firma canonica per algoritmi come max/min sull\u0027ordinamento naturale.\nLe altre opzioni: `super` non è ammesso sui type parameter (solo sui wildcard); `Comparator` è un oggetto esterno, non l\u0027interfaccia che l\u0027elemento deve implementare; un wildcard non può essere dichiarato come type parameter di un metodo."},{"type":"code","prompt":"Cosa stampa questo snippet?","code":"List\u003cInteger\u003e list = new ArrayList\u003c\u003e(List.of(1, 2, 3, 4, 5));\nIterator\u003cInteger\u003e it = list.iterator();\nwhile (it.hasNext()) {\n    if (it.next() % 2 == 0) {\n        it.remove();\n    }\n}\nSystem.out.println(list);","options":["[1, 3, 5]","ConcurrentModificationException","[1, 2, 3, 4, 5]","[2, 4]"],"correct":0,"explanation":"In sintesi: rimuovere tramite `Iterator.remove()` è il modo corretto e sicuro di eliminare elementi durante l\u0027iterazione: aggiorna internamente `expectedModCount`, quindi niente `ConcurrentModificationException`, e restano i dispari [1, 3, 5].\nLe altre opzioni: non lancia CME proprio perché si usa `it.remove()` e non `list.remove()`; la lista non resta invariata; [2, 4] sarebbe se si tenessero i pari invece di rimuoverli."},{"type":"mcq","prompt":"Quale struttura è oggi raccomandata per implementare uno stack LIFO in Java, al posto della classe legacy Stack?","code":"","options":["Deque (es. ArrayDeque) con push/pop/peek","Vector, perché thread-safe","PriorityQueue, che restituisce sempre l\u0027ultimo inserito","LinkedHashSet, che mantiene l\u0027ordine di inserzione"],"correct":0,"explanation":"In sintesi: la documentazione stessa raccomanda `Deque` (tipicamente `ArrayDeque`) per stack e code: `push`/`pop`/`peek` danno semantica LIFO senza la sincronizzazione inutile e l\u0027eredità di `Vector` che affligge `java.util.Stack`. `ArrayDeque` è più veloce sia come stack sia come queue.\nLe altre opzioni: `Stack`/`Vector` sono legacy e sincronizzate senza motivo; `PriorityQueue` ordina per priorità, non LIFO; un `Set` non è una pila e scarta i duplicati."},{"type":"mcq","prompt":"In java.util.Queue, qual è la differenza tra add/remove e offer/poll quando l\u0027operazione può fallire (coda piena o vuota)?","code":"","options":["add/remove lanciano un\u0027eccezione in caso di fallimento; offer/poll restituiscono un valore speciale (false o null)","offer/poll lanciano eccezione; add/remove restituiscono null","Sono identici: differiscono solo nel nome","add/offer sono solo per le Deque, remove/poll solo per le PriorityQueue"],"correct":0,"explanation":"In sintesi: `Queue` offre due famiglie di metodi: quelli che lanciano eccezione al fallimento (`add` lancia se piena, `remove` lancia `NoSuchElementException` se vuota) e quelli che restituiscono un valore speciale (`offer` ritorna false, `poll` ritorna null). Si sceglie in base a come si vuole gestire l\u0027insuccesso.\nLe altre opzioni: sono `offer`/`poll` a non lanciare, non il contrario; non sono identici nel comportamento; entrambe le famiglie valgono per tutte le `Queue`, non per tipi specifici."},{"type":"code","prompt":"Cosa succede eseguendo questo codice?","code":"List\u003cString\u003e list = List.of(\"a\", \"b\", \"c\");\nlist.add(\"d\");\nSystem.out.println(list);","options":["Lancia UnsupportedOperationException: List.of restituisce una lista immutabile","Stampa [a, b, c, d]","Errore di compilazione","Stampa [a, b, c] ignorando l\u0027add"],"correct":0,"explanation":"In sintesi: `List.of(...)` crea una lista immutabile; qualsiasi operazione di modifica come `add` lancia `UnsupportedOperationException` a runtime. Se serve una lista modificabile occorre copiarla, ad esempio `new ArrayList\u003c\u003e(List.of(...))`.\nLe altre opzioni: non stampa la lista con \"d\" perché la modifica fallisce; compila perfettamente (l\u0027errore è a runtime, non a compile-time); l\u0027`add` non viene silenziosamente ignorata ma solleva l\u0027eccezione."},{"type":"mcq","prompt":"Qual è la differenza tra List.of(...) e Collections.unmodifiableList(originale)?","code":"","options":["List.of crea una lista intrinsecamente immutabile; unmodifiableList crea solo una vista non modificabile su una lista sottostante che, se cambiata direttamente, si riflette sulla vista","Sono equivalenti: entrambe creano una copia immutabile e indipendente","List.of accetta elementi null, unmodifiableList no","unmodifiableList è immutabile, mentre List.of restituisce una vista mutabile"],"correct":0,"explanation":"In sintesi: `List.of` costruisce una collezione realmente immutabile e non ammette null; `Collections.unmodifiableList` è solo un wrapper di sola lettura: se qualcuno mantiene un riferimento alla lista originale e la modifica, i cambiamenti diventano visibili attraverso la vista. Sono due livelli di immutabilità diversi.\nLe altre opzioni: non sono equivalenti proprio per la questione vista vs copia; è `List.of` a rifiutare i null, non il contrario; `List.of` non è affatto una vista mutabile."},{"type":"code","prompt":"Cosa stampa questo snippet?","code":"class Point {\n    int x, y;\n    Point(int x, int y) { this.x = x; this.y = y; }\n    @Override public boolean equals(Object o) {\n        if (!(o instanceof Point)) return false;\n        Point p = (Point) o;\n        return x == p.x \u0026\u0026 y == p.y;\n    }\n    // hashCode NON sovrascritto\n}\n\nSet\u003cPoint\u003e set = new HashSet\u003c\u003e();\nset.add(new Point(1, 2));\nSystem.out.println(set.contains(new Point(1, 2)));","options":["false: senza override di hashCode i due Point finiscono (quasi sempre) in bucket diversi, quindi contains non li confronta con equals","true: basta equals per far funzionare HashSet","Errore di compilazione perché hashCode è astratto","true, ma solo perché i campi hanno gli stessi valori"],"correct":0,"explanation":"In sintesi: `HashSet` usa prima `hashCode` per scegliere il bucket e solo dopo `equals` per confrontare gli elementi nello stesso bucket. Avendo sovrascritto solo `equals`, i due `Point` ereditano l\u0027`hashCode` di `Object` (basato sull\u0027identità), quindi cadono in bucket diversi e `contains` restituisce false. Il contratto equals/hashCode va rispettato insieme.\nLe altre opzioni: `equals` da solo non basta senza un `hashCode` coerente; `hashCode` non è astratto (`Object` ne fornisce uno); l\u0027uguaglianza dei campi non viene mai valutata perché non si arriva al confronto con equals."},{"type":"mcq","prompt":"Su cosa si basa TreeMap per stabilire se due chiavi sono \u0027la stessa chiave\u0027?","code":"","options":["Sul risultato di compareTo/compare uguale a 0, NON su equals/hashCode","Su equals() e hashCode() come HashMap","Sull\u0027identità dei riferimenti (==)","Su toString() delle chiavi"],"correct":0,"explanation":"In sintesi: `TreeMap` è ordinata e si basa esclusivamente sul confronto: due chiavi sono considerate uguali quando `compareTo` (o il `Comparator`) restituisce 0, ignorando `equals` e `hashCode`. Per questo un ordinamento inconsistente con equals può far collassare chiavi che consideravi distinte.\nLe altre opzioni: `equals`/`hashCode` li usa `HashMap`, non `TreeMap`; non usa l\u0027identità dei riferimenti; `toString` non entra nel confronto."},{"type":"code","prompt":"Cosa stampa questo snippet?","code":"Map\u003cString, Integer\u003e map = new HashMap\u003c\u003e();\nmap.put(null, 1);\nmap.put(null, 2);\nSystem.out.println(map.get(null) + \" \" + map.size());","options":["2 1: HashMap ammette una chiave null e il secondo put la sovrascrive","NullPointerException al primo put","1 2: entrambe le entry vengono mantenute","null 0"],"correct":0,"explanation":"In sintesi: `HashMap` ammette una singola chiave null (indicizzata al bucket 0, senza chiamare `hashCode`) e valori null; il secondo `put(null, 2)` sovrascrive il valore, quindi `get(null)` è 2 e `size` è 1. `TreeMap` e `Hashtable` invece lancerebbero `NullPointerException`.\nLe altre opzioni: nessun NPE su `HashMap`; le due entry non coesistono perché la chiave è identica; `get(null)` non è null perché la mappa contiene quella chiave."},{"type":"mcq","prompt":"Perché ArrayList.add(E) in coda è considerato O(1) ammortizzato e non O(1) puro?","code":"","options":["Perché quando l\u0027array interno è pieno serve un resize che copia tutti gli elementi (O(n)), ma accade di rado: distribuendo quel costo sulle molte add O(1) la media resta costante","Perché ogni add deve spostare tutti gli elementi a destra","Perché add usa internamente una ricerca binaria","Perché l\u0027array cresce di un solo elemento a ogni add"],"correct":0,"explanation":"In sintesi: la maggior parte delle `add` scrive semplicemente nella prima cella libera in O(1); solo quando la capacità è esaurita scatta un resize che copia l\u0027intero array in O(n). Poiché la capacità cresce geometricamente (circa x1.5), i resize sono rari e il costo ammortizzato per add resta O(1).\nLe altre opzioni: l\u0027append in coda non sposta gli elementi (lo shift avviene su `add(index, e)`); non c\u0027è alcuna ricerca binaria; l\u0027array non cresce di uno alla volta ma a blocchi."},{"type":"code","prompt":"Cosa stampa questo snippet?","code":"Map\u003cList\u003cInteger\u003e, String\u003e map = new HashMap\u003c\u003e();\nList\u003cInteger\u003e key = new ArrayList\u003c\u003e(List.of(1, 2));\nmap.put(key, \"found\");\nkey.add(3);\nSystem.out.println(map.get(key));","options":["null: modificare la chiave dopo l\u0027inserimento ne cambia l\u0027hashCode, così la lookup cerca nel bucket sbagliato","found: la mappa mantiene il riferimento all\u0027oggetto chiave","Errore di compilazione: List non può essere una chiave","Lancia ConcurrentModificationException"],"correct":0,"explanation":"In sintesi: la chiave è una `List` mutabile e il suo `hashCode` dipende dal contenuto; dopo `key.add(3)` l\u0027`hashCode` cambia, ma il nodo aveva memorizzato l\u0027hash vecchio, così `map.get` calcola un altro bucket (o comunque non trova un hash coincidente) e restituisce null. Morale: le chiavi di una `Map` devono essere immutabili, o almeno non mutate finché sono chiavi.\nLe altre opzioni: la mappa non ritrova l\u0027entry pur avendone il riferimento, proprio per via dell\u0027hash cambiato; una `List` è una chiave valida; non c\u0027è iterazione, quindi niente CME."},{"type":"mcq","prompt":"Quale caratteristica di LinkedHashMap lo rende adatto a implementare una cache LRU?","code":"","options":["Il costruttore con accessOrder=true riordina le entry per ordine di accesso e removeEldestEntry consente di rimuovere automaticamente la meno usata","Ordina sempre le chiavi per hashCode crescente","È thread-safe ed è quindi adatto a cache concorrenti","Rimuove automaticamente le entry scadute in base al tempo"],"correct":0,"explanation":"In sintesi: `LinkedHashMap` può essere costruito in access-order (accessOrder=true): ogni `get`/`put` sposta l\u0027entry in coda alla lista di collegamento, e sovrascrivendo `removeEldestEntry` si elimina la testa (la meno recentemente usata) al superamento della capacità. È il pattern classico per una LRU cache.\nLe altre opzioni: non ordina per `hashCode`; non è thread-safe; non ha scadenza temporale (quella è tipica di cache dedicate come Caffeine)."},{"type":"code","prompt":"Cosa succede eseguendo questo codice?","code":"List\u003cInteger\u003e list = Arrays.asList(1, 2, 3);\nlist.set(0, 99);   // riga A\nlist.add(4);       // riga B\nSystem.out.println(list);","options":["La riga A funziona (set è permesso), la riga B lancia UnsupportedOperationException: Arrays.asList restituisce una lista a dimensione fissa","Entrambe funzionano: stampa [99, 2, 3, 4]","La riga A lancia UnsupportedOperationException perché la lista è immutabile","Errore di compilazione su Arrays.asList"],"correct":0,"explanation":"In sintesi: `Arrays.asList` restituisce una lista a dimensione fissa che fa da vista sull\u0027array sottostante: `set(index, e)` è supportato e scrive through nell\u0027array (riga A ok), ma le operazioni strutturali come `add`/`remove` lanciano `UnsupportedOperationException` (riga B). Se serve una lista ridimensionabile occorre `new ArrayList\u003c\u003e(Arrays.asList(...))`.\nLe altre opzioni: non stampa [99, 2, 3, 4] perché l\u0027add fallisce; `set` non lancia perché è supportato (a differenza di `List.of`, che è totalmente immutabile); compila senza problemi, l\u0027eccezione è a runtime."},{"type":"code","prompt":"Cosa succede alla riga X a runtime?","code":"List\u003cString\u003e strings = new ArrayList\u003c\u003e();\nList raw = strings;          // raw type\nraw.add(42);                 // warning \"unchecked\"\nString s = strings.get(0);   // riga X","options":["ClassCastException: un Integer è stato inserito tramite il raw type e viene recuperato con il cast implicito a String che il compilatore ha inserito su get","Errore di compilazione su raw.add(42)","Stampa/assegna 42 senza problemi","NullPointerException"],"correct":0,"explanation":"In sintesi: usare un raw type disabilita i controlli generici (heap pollution): `raw.add(42)` compila con solo un warning unchecked e inserisce un `Integer` in quella che dovrebbe essere una `List\u003cString\u003e`. Alla riga X il compilatore ha inserito un cast implicito a `String` sul valore restituito da `get`, che a runtime fallisce con `ClassCastException`.\nLe altre opzioni: `raw.add(42)` non è un errore ma un warning; non assegna 42 perché il cast a `String` esplode; non è un NPE ma un `ClassCastException`."},{"type":"mcq","prompt":"Qual è la differenza principale tra ConcurrentHashMap e Collections.synchronizedMap(new HashMap\u003c\u003e())?","code":"","options":["ConcurrentHashMap usa un locking a grana fine (per bin/nodo, con CAS) permettendo scritture concorrenti su parti diverse; synchronizedMap serializza tutte le operazioni su un unico lock","synchronizedMap è più veloce perché non usa alcun lock","ConcurrentHashMap non è thread-safe, serve solo per iterare","Sono identici: synchronizedMap restituisce internamente un ConcurrentHashMap"],"correct":0,"explanation":"In sintesi: `ConcurrentHashMap` ottiene throughput elevato con locking a grana fine (a livello di singolo bin/nodo, più operazioni CAS), così più thread possono scrivere in parti diverse della mappa contemporaneamente; `synchronizedMap` avvolge ogni metodo in un unico monitor, serializzando tutto e creando un collo di bottiglia. Inoltre l\u0027iteratore di `ConcurrentHashMap` è weakly consistent, non fail-fast.\nLe altre opzioni: `synchronizedMap` non è lock-free ed è più lenta sotto contesa; `ConcurrentHashMap` è pienamente thread-safe; non c\u0027è alcuna equivalenza interna tra i due."},{"type":"code","prompt":"Cosa succede con queste due righe (compilazione e runtime)?","code":"Object[] arr = new String[3];\narr[0] = 42;                              // riga A\nList\u003cObject\u003e list = new ArrayList\u003cString\u003e(); // riga B","options":["Riga A compila ma lancia ArrayStoreException a runtime (array covarianti); riga B non compila (i generics sono invarianti)","Entrambe compilano ed eseguono senza errori","Riga A è un errore di compilazione; riga B lancia ArrayStoreException","Entrambe sono errori di compilazione"],"correct":0,"explanation":"In sintesi: gli array in Java sono covarianti (`String[]` è un `Object[]`), quindi la riga A compila ma inserire un `Integer` in un array di `String` provoca `ArrayStoreException` a runtime. I generics invece sono invarianti: `List\u003cString\u003e` non è un `List\u003cObject\u003e`, perciò la riga B è un errore di compilazione. È proprio questa invarianza a rendere necessari i wildcard.\nLe altre opzioni: non compilano/eseguono entrambe senza errori per i motivi opposti descritti; la riga A non è un errore di compilazione ma di runtime; non sono entrambe errori di compilazione perché A compila."}]},{"id":"concurrency","title":"Concorrenza \u0026 Multithreading","questions":[{"type":"mcq","prompt":"Perché implementare Runnable è generalmente preferibile a estendere Thread?","code":"","options":["Perché separa il task dal meccanismo di esecuzione e non consuma l\u0027unica ereditarietà della classe","Perché estendere Thread garantisce prestazioni migliori grazie a meno overhead","Perché Runnable rende il task automaticamente thread-safe","Perché solo estendendo Thread si può invocare start()"],"correct":0,"explanation":"In sintesi: implementare `Runnable` disaccoppia il \"cosa\" (il task) dal \"come\" viene eseguito (`Thread` o `ExecutorService`); inoltre Java ha ereditarietà singola, quindi non sprechi l\u0027unica `extends` su `Thread` e lo stesso `Runnable` resta riusabile con i thread pool.\nLe altre opzioni: estendere `Thread` non offre vantaggi prestazionali né rende il task thread-safe, e `start()` è comunque disponibile perché è il `Thread` a incapsulare il `Runnable`."},{"type":"code","prompt":"Cosa stampa questo codice?","code":"Thread t = new Thread(() -\u003e\n    System.out.println(Thread.currentThread().getName()));\nt.run();","options":["main","Thread-0","Lancia IllegalThreadStateException","Non compila"],"correct":0,"explanation":"In sintesi: `t.run()` è una normale chiamata sincrona eseguita nel thread corrente, non avvia un nuovo thread; quindi `Thread.currentThread().getName()` restituisce `main`. Solo `t.start()` creerebbe un nuovo thread stampando `Thread-0`.\nLe altre opzioni: `Thread-0` richiederebbe `start()`; `IllegalThreadStateException` si ha con un doppio `start()`, non qui; il codice compila regolarmente."},{"type":"mcq","prompt":"Quale chiamata porta un thread nello stato TIMED_WAITING?","code":"","options":["Thread.sleep(1000)","Object.wait() senza timeout","Thread.join() senza timeout","Entrare in un blocco synchronized con lock libero"],"correct":0,"explanation":"In sintesi: `Thread.sleep(1000)` sospende il thread per una durata definita portandolo in `TIMED_WAITING`; lo stesso vale per le varianti con timeout di `wait` e `join`.\nLe altre opzioni: `wait()` e `join()` senza timeout danno `WAITING`, non `TIMED_WAITING`; entrare in un `synchronized` con lock libero lascia il thread `RUNNABLE`."},{"type":"mcq","prompt":"Su quale monitor si sincronizza un metodo di istanza dichiarato synchronized?","code":"","options":["Sull\u0027oggetto this","Sull\u0027oggetto Class della classe","Su un monitor globale della JVM","Su un lock diverso per ogni thread"],"correct":0,"explanation":"In sintesi: un metodo di istanza `synchronized` acquisisce il monitor (lock intrinseco) dell\u0027oggetto `this`; un metodo `static synchronized` usa invece il monitor dell\u0027oggetto `Class` (`NomeClasse.class`), quindi sono lock distinti.\nLe altre opzioni: il monitor di `Class` vale per i metodi statici, non esiste un monitor globale di JVM e il lock è unico e condiviso, non uno per thread."},{"type":"mcq","prompt":"Cosa garantisce la keyword volatile su un campo?","code":"","options":["Visibilità delle scritture tra thread e ordinamento (happens-before), ma non atomicità delle operazioni composte","L\u0027atomicità di operazioni come count++","La mutua esclusione come synchronized","Che la variabile diventi immutabile"],"correct":0,"explanation":"In sintesi: `volatile` garantisce che le scritture siano immediatamente visibili agli altri thread e stabilisce relazioni happens-before, ma non rende atomiche le operazioni read-modify-write come `count++`.\nLe altre opzioni: non fornisce atomicità né mutua esclusione (servono `synchronized` o le classi `Atomic*`) e non ha alcun legame con l\u0027immutabilità."},{"type":"code","prompt":"1000 thread invocano ciascuno inc() una volta. Cosa vale count alla fine?","code":"class Counter {\n    private int count = 0;\n    public void inc() { count++; }\n    public int get() { return count; }\n}","options":["Un valore \u003c= 1000, spesso \u003c 1000, per race condition su count++","Sempre esattamente 1000","Sempre 0","Lancia ConcurrentModificationException"],"correct":0,"explanation":"In sintesi: `count++` è una lettura-modifica-scrittura non atomica, quindi con accessi concorrenti si perdono aggiornamenti (lost update) e il totale finale è spesso inferiore a 1000; per correggerlo servono `synchronized`, un `AtomicInteger` o un lock.\nLe altre opzioni: non è mai garantito 1000 proprio per la race condition, non resta 0 (qualche incremento va a buon fine) e `ConcurrentModificationException` riguarda l\u0027iterazione di collezioni, non un `int`."},{"type":"code","prompt":"Due thread eseguono questi blocchi. Qual è il problema?","code":"// Thread 1\nsynchronized (lockA) {\n    synchronized (lockB) { /* ... */ }\n}\n\n// Thread 2\nsynchronized (lockB) {\n    synchronized (lockA) { /* ... */ }\n}","options":["Deadlock: acquisendo i lock in ordine opposto i due thread possono bloccarsi a vicenda","Livelock: i thread cambiano stato continuamente senza progredire","Race condition benigna, nessun blocco","Nessun problema: synchronized previene automaticamente il deadlock"],"correct":0,"explanation":"In sintesi: è un classico deadlock da lock ordering: se Thread 1 tiene `lockA` e attende `lockB` mentre Thread 2 tiene `lockB` e attende `lockA`, nessuno dei due procede; la prevenzione standard è acquisire i lock sempre nello stesso ordine globale.\nLe altre opzioni: nel livelock i thread restano attivi ma reagendo l\u0027uno all\u0027altro (qui invece sono bloccati); non è una race benigna e `synchronized` non previene affatto il deadlock, anzi qui lo causa."},{"type":"mcq","prompt":"Perché wait() va invocato dentro un blocco synchronized e tipicamente in un ciclo while sulla condizione?","code":"","options":["Perché richiede di possedere il monitor dell\u0027oggetto e il while protegge da spurious wakeup e ricontrolla la condizione dopo il risveglio","Solo per motivi di performance del context switch","Perché wait() cede la CPU ma non rilascia il lock","Perché notify() sveglia sempre tutti i thread in attesa"],"correct":0,"explanation":"In sintesi: `wait()` deve essere chiamato mentre si detiene il monitor dell\u0027oggetto (altrimenti `IllegalMonitorStateException`), e va racchiuso in un `while` perché al risveglio la condizione va rivalutata: possono verificarsi spurious wakeup o un altro thread può aver già cambiato lo stato.\nLe altre opzioni: non è una questione di performance; `wait()` in realtà rilascia il lock durante l\u0027attesa; `notify()` sveglia un solo thread, è `notifyAll()` a svegliarli tutti."},{"type":"mcq","prompt":"Qual è la differenza tra shutdown() e shutdownNow() su un ExecutorService?","code":"","options":["shutdown() rifiuta nuovi task ma completa quelli già inviati; shutdownNow() tenta di interrompere i task in esecuzione e restituisce quelli pendenti non avviati","Sono sinonimi con lo stesso comportamento","shutdown() interrompe immediatamente tutti i thread in esecuzione","shutdownNow() attende sempre la fine di tutti i task prima di tornare"],"correct":0,"explanation":"In sintesi: `shutdown()` avvia una chiusura ordinata (niente nuovi task, ma quelli in coda vengono eseguiti), mentre `shutdownNow()` prova a interrompere i task attivi via `interrupt()` e ritorna la lista dei task pendenti mai avviati.\nLe altre opzioni: non sono sinonimi, `shutdown()` non interrompe l\u0027esecuzione in corso e `shutdownNow()` non attende il completamento (per attendere serve `awaitTermination`)."},{"type":"mcq","prompt":"Con Executors.newFixedThreadPool(4), cosa succede se vengono inviati più task dei thread disponibili?","code":"","options":["I task in eccesso vengono accodati in una LinkedBlockingQueue non limitata in attesa di un thread libero","Vengono creati nuovi thread senza limite finché servono","I task vengono subito rifiutati con RejectedExecutionException","I task in eccesso vengono eseguiti nel thread chiamante"],"correct":0,"explanation":"In sintesi: un fixed thread pool ha un numero fisso di worker e una coda `LinkedBlockingQueue` di fatto illimitata, quindi i task in più restano accodati finché un thread si libera; il rischio è l\u0027accumulo in memoria della coda sotto carico.\nLe altre opzioni: il numero di thread è fisso (non cresce), il rifiuto avviene solo con code/pool limitati e la CallerRunsPolicy va configurata esplicitamente, non è il default qui."},{"type":"code","prompt":"Cosa stampa questo codice?","code":"ExecutorService ex = Executors.newSingleThreadExecutor();\nFuture\u003cInteger\u003e f = ex.submit(() -\u003e 21 * 2);\nSystem.out.println(f.get());","options":["42","Non compila: submit non accetta una Callable","Stampa un oggetto Future non ancora risolto","Lancia ExecutionException"],"correct":0,"explanation":"In sintesi: la lambda `() -\u003e 21 * 2` è una `Callable\u003cInteger\u003e`; `submit` restituisce un `Future` e `f.get()` blocca finché il risultato non è pronto, restituendo `42`.\nLe altre opzioni: `submit` accetta `Callable`, `get()` restituisce il valore (non l\u0027oggetto `Future`) e non c\u0027è alcuna eccezione perché il task termina normalmente."},{"type":"code","prompt":"1000 thread eseguono ciascuno a.incrementAndGet(). Quale valore ha a alla fine?","code":"AtomicInteger a = new AtomicInteger(0);\n// ogni thread:\na.incrementAndGet();","options":["Sempre 1000: incrementAndGet è atomico grazie al CAS","Spesso meno di 1000 per race condition","Sempre 0","Indefinito, perché manca volatile sul campo"],"correct":0,"explanation":"In sintesi: `incrementAndGet()` è un\u0027operazione atomica implementata con Compare-And-Swap (CAS) lock-free, quindi 1000 incrementi concorrenti danno sempre esattamente 1000, senza aggiornamenti persi.\nLe altre opzioni: il valore non scende sotto 1000 proprio perché il CAS elimina la race, non resta 0 e `AtomicInteger` gestisce internamente la visibilità (nessun `volatile` mancante)."},{"type":"mcq","prompt":"Quale affermazione descrive correttamente ConcurrentHashMap?","code":"","options":["Permette letture concorrenti e aggiornamenti a granularità fine senza bloccare l\u0027intera mappa, e non ammette chiavi o valori null","Sincronizza ogni operazione su un unico lock globale come Hashtable","Ammette chiavi null esattamente come HashMap","Le sue iterazioni lanciano ConcurrentModificationException se la mappa cambia durante l\u0027iterazione"],"correct":0,"explanation":"In sintesi: `ConcurrentHashMap` consente letture non bloccanti e scritture concorrenti a granularità fine (per bin/nodo), offrendo alto throughput multi-thread, e vieta chiavi e valori `null` per evitare ambiguità con `get`.\nLe altre opzioni: non usa un lock globale unico come `Hashtable`, non accetta chiavi `null` e i suoi iteratori sono weakly consistent, quindi non lanciano `ConcurrentModificationException`."},{"type":"mcq","prompt":"A cosa serve tipicamente CountDownLatch?","code":"","options":["Far attendere uno o più thread finché un insieme di operazioni non è completato; il contatore non è riutilizzabile","È riutilizzabile e resetta automaticamente il contatore a ogni ciclo","Limitare il numero di thread che accedono contemporaneamente a una risorsa","Sostituire synchronized fornendo mutua esclusione"],"correct":0,"explanation":"In sintesi: `CountDownLatch` fa attendere i thread su `await()` finché il contatore, decrementato con `countDown()`, non raggiunge zero; è un dispositivo monouso (una volta a zero non si resetta).\nLe altre opzioni: la riusabilità con reset descrive `CyclicBarrier`, il limite di accessi concorrenti descrive `Semaphore` e non fornisce mutua esclusione come `synchronized`."},{"type":"mcq","prompt":"Qual è lo scopo principale di un Semaphore?","code":"","options":["Limitare il numero di thread che accedono contemporaneamente a una risorsa tramite un insieme di permessi","Far attendere un thread su un singolo evento una sola volta","Fornire mutua esclusione utilizzabile da un solo thread e mai da più di uno","Garantire sempre un ordine di sblocco FIFO tra i thread"],"correct":0,"explanation":"In sintesi: un `Semaphore` gestisce un numero di permessi con `acquire()`/`release()`, limitando quanti thread possono accedere insieme a una risorsa (es. un pool di N connessioni); con 1 permesso funge da mutex.\nLe altre opzioni: l\u0027attesa monouso di un evento è di `CountDownLatch`, il semaforo può ammettere più thread contemporaneamente e l\u0027ordine equo (fairness) non è garantito di default."},{"type":"mcq","prompt":"Quale vantaggio offre ReentrantLock rispetto a synchronized?","code":"","options":["tryLock, acquisizione interrompibile, fairness opzionale e più Condition, al costo di un unlock() esplicito da mettere in finally","È sempre più veloce di synchronized in ogni scenario","Non è rientrante, a differenza di synchronized","Rilascia il lock automaticamente all\u0027uscita del metodo"],"correct":0,"explanation":"In sintesi: `ReentrantLock` aggiunge flessibilità che `synchronized` non ha: `tryLock` (anche con timeout), `lockInterruptibly`, fairness configurabile e più `Condition`; in cambio richiede di chiamare `unlock()` in un blocco `finally`.\nLe altre opzioni: non è categoricamente più veloce, è rientrante come il lock intrinseco e non rilascia il lock da solo a fine metodo (a differenza di `synchronized`)."},{"type":"mcq","prompt":"Cosa fornisce ThreadLocal e quale accortezza richiede nei thread pool?","code":"","options":["Una copia della variabile indipendente per ciascun thread; nei pool va ripulita con remove() per evitare leak e valori residui","Una singola variabile condivisa tra tutti i thread in modo sincronizzato","Rende automaticamente volatile la variabile","Serve esclusivamente per costanti immutabili"],"correct":0,"explanation":"In sintesi: `ThreadLocal` dà a ogni thread la propria copia isolata del valore, evitando condivisione e sincronizzazione; nei thread pool i worker vengono riutilizzati, quindi va chiamato `remove()` per evitare memory leak e leakage del valore tra task diversi.\nLe altre opzioni: non condivide un unico valore tra i thread, non ha relazione con `volatile` e non è limitato alle costanti immutabili."},{"type":"mcq","prompt":"Perché un oggetto immutabile è intrinsecamente thread-safe?","code":"","options":["Perché il suo stato non cambia dopo la costruzione, quindi la lettura concorrente non richiede lock né sincronizzazione","Perché la JVM lo sincronizza automaticamente a ogni accesso","Perché internamente rende volatile ogni campo","Perché ogni thread ne riceve una copia separata"],"correct":0,"explanation":"In sintesi: se lo stato è fissato alla costruzione e non muta, non esistono scritture concorrenti da coordinare; tutti i thread osservano lo stesso stato coerente senza bisogno di lock (a patto di pubblicazione sicura, es. campi `final`).\nLe altre opzioni: la JVM non sincronizza automaticamente gli oggetti, l\u0027immutabilità non implica `volatile` sui campi e non viene creata una copia per thread."},{"type":"mcq","prompt":"Quale delle seguenti stabilisce una relazione happens-before nel Java Memory Model?","code":"","options":["Il rilascio di un lock happens-before la successiva acquisizione dello stesso lock","Due letture di variabili diverse effettuate da thread diversi","L\u0027ordine di dichiarazione dei metodi nel file sorgente","L\u0027invocazione di run() al posto di start()"],"correct":0,"explanation":"In sintesi: tra le regole del Java Memory Model, l\u0027`unlock` di un monitor happens-before il successivo `lock` dello stesso monitor, garantendo la visibilità delle scritture fatte nella sezione critica; altre regole sono la scrittura/lettura `volatile` e `start()`/`join()`.\nLe altre opzioni: letture indipendenti in thread diversi non sono ordinate, l\u0027ordine sintattico dei metodi è irrilevante e `run()` esegue nello stesso thread, senza creare relazioni tra thread."},{"type":"truefalse","prompt":"Chiamare start() due volte sullo stesso oggetto Thread lancia IllegalThreadStateException.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: un `Thread` non è riavviabile: dopo il primo `start()` una seconda invocazione lancia `IllegalThreadStateException`; per rieseguire il task occorre creare un nuovo `Thread` o usare un `ExecutorService`.\nLe altre opzioni: è Vero; l\u0027errore tipico è credere che si possa \"riusare\" lo stesso oggetto Thread, oppure confondere `start()` con `run()` (che invece si può chiamare più volte, ma nel thread corrente)."},{"type":"truefalse","prompt":"La keyword volatile garantisce l\u0027atomicità dell\u0027operazione i++.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: l\u0027affermazione è falsa: `volatile` assicura visibilità e ordinamento, ma `i++` è una read-modify-write composta da più passi, quindi resta soggetta a race condition; per l\u0027atomicità servono `AtomicInteger` o la sincronizzazione.\nLe altre opzioni: l\u0027errore classico è pensare che `volatile` renda \"sicuri\" i contatori; in realtà elimina i problemi di visibilità ma non quelli di atomicità."},{"type":"truefalse","prompt":"notifyAll() sveglia tutti i thread in attesa sul monitor, ma solo uno alla volta potrà riacquisire il lock per proseguire.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: `notifyAll()` sposta tutti i waiter dallo stato di attesa a quello di contesa per il monitor, ma il lock è uno solo, quindi lo riacquisiscono in sequenza, uno per volta.\nLe altre opzioni: è Vero; l\u0027errore tipico è immaginare che i thread risvegliati procedano davvero in parallelo, ignorando che devono comunque riottenere il lock intrinseco."},{"type":"truefalse","prompt":"wait() rilascia il lock dell\u0027oggetto durante l\u0027attesa, mentre Thread.sleep() mantiene i lock posseduti.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: `wait()` rilascia il monitor su cui è invocato per permettere ad altri thread di modificare la condizione e notificare; `sleep()` invece non rilascia alcun lock, si limita a sospendere il thread.\nLe altre opzioni: è Vero; l\u0027errore comune è pensare che anche `sleep()` liberi il lock, causando in pratica blocchi e ritardi se usato dentro una sezione critica."},{"type":"truefalse","prompt":"Un ExecutorService creato con la factory Executors, se non viene chiuso, può impedire alla JVM di terminare perché usa thread non-daemon.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: i pool creati da `Executors` usano di default una `ThreadFactory` con thread non-daemon, quindi senza `shutdown()`/`shutdownNow()` questi thread restano vivi e mantengono la JVM in esecuzione.\nLe altre opzioni: è Vero; l\u0027errore tipico è dimenticare la chiusura del pool, lasciando l\u0027applicazione \"appesa\" al termine del main."},{"type":"truefalse","prompt":"HashMap è thread-safe per operazioni concorrenti di put da più thread.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: l\u0027affermazione è falsa: `HashMap` non è thread-safe; put concorrenti possono corrompere la struttura interna (in passato causando cicli infiniti durante il resize) o perdere aggiornamenti; per l\u0027uso concorrente si usa `ConcurrentHashMap`.\nLe altre opzioni: l\u0027errore tipico è confondere `HashMap` con `ConcurrentHashMap` o con una `Collections.synchronizedMap`, oppure assumere che letture/scritture siano protette dalla JVM."},{"type":"code","prompt":"Qual è il difetto di concorrenza in questa classe?","code":"class Worker {\n    private boolean running = true; // senza volatile\n    void loop() {\n        while (running) { /* lavoro */ }\n    }\n    void stop() { running = false; }\n}","options":["Senza volatile, il thread che esegue loop() potrebbe non vedere mai running=false e ciclare all\u0027infinito","Il codice non compila","stop() lancia un\u0027eccezione a runtime","Il ciclo termina sempre correttamente grazie alla cache coerente"],"correct":0,"explanation":"In sintesi: senza `volatile` il JMM non garantisce la visibilità della scrittura `running = false` fatta da un altro thread; il thread del `loop()` può leggere un valore cachato e non uscire mai; dichiarare `running` `volatile` risolve stabilendo l\u0027happens-before.\nLe altre opzioni: il codice compila, `stop()` non lancia nulla e non c\u0027è alcuna garanzia di terminazione senza `volatile` o sincronizzazione."},{"type":"code","prompt":"Un thread è dentro a() su un\u0027istanza, un altro dentro b(). Si escludono a vicenda?","code":"class C {\n    synchronized void a() { /* ... */ }        // lock su this\n    static synchronized void b() { /* ... */ } // lock su C.class\n}","options":["No: usano monitor diversi (this vs C.class), quindi possono eseguire in parallelo","Sì: entrambi acquisiscono lo stesso monitor","No, perché b() in realtà non è sincronizzato","Sì, perché synchronized agisce su un lock globale"],"correct":0,"explanation":"In sintesi: `a()` è un metodo di istanza e blocca il monitor di `this`, mentre `b()` è `static synchronized` e blocca il monitor dell\u0027oggetto `Class` (`C.class`): essendo lock distinti, i due thread non si escludono e procedono in parallelo.\nLe altre opzioni: non condividono lo stesso monitor, `b()` è effettivamente sincronizzato (sul `Class`) e `synchronized` non è un lock globale di JVM."},{"type":"code","prompt":"Più thread eseguono questa istruzione su a. È corretta dal punto di vista della concorrenza?","code":"AtomicInteger a = new AtomicInteger();\n// ogni thread:\na.set(a.get() + 1);","options":["No: get() e set() sono due operazioni separate, quindi c\u0027è race condition; serve incrementAndGet() o un ciclo con compareAndSet","Sì: usando AtomicInteger l\u0027intera espressione è atomica","No, perché il codice non compila","No, perché set() blocca gli altri thread"],"correct":0,"explanation":"In sintesi: sebbene `AtomicInteger` renda atomici `get()` e `set()` singolarmente, la sequenza get-poi-set è un check-then-act non atomico: due thread possono leggere lo stesso valore e sovrascriversi, perdendo incrementi; la forma corretta è `incrementAndGet()` (o un loop di `compareAndSet`).\nLe altre opzioni: l\u0027atomicità vale sulle singole operazioni, non sulla loro composizione; il codice compila e `set()` non è un\u0027operazione bloccante."},{"type":"code","prompt":"Cosa stampa questo blocco?","code":"Future\u003cString\u003e f = executor.submit(() -\u003e {\n    throw new IllegalStateException(\"boom\");\n});\ntry {\n    f.get();\n} catch (Exception e) {\n    System.out.println(e.getClass().getSimpleName());\n}","options":["ExecutionException","IllegalStateException","InterruptedException","RuntimeException"],"correct":0,"explanation":"In sintesi: se il task lanciato via `submit` termina con un\u0027eccezione, questa viene catturata e incapsulata; `Future.get()` la rilancia come `ExecutionException`, e la causa originale è recuperabile con `getCause()`.\nLe altre opzioni: `IllegalStateException` è solo la causa incapsulata; `InterruptedException` si ha se il thread in attesa viene interrotto; `RuntimeException` non è il tipo concreto restituito da `get()`."},{"type":"code","prompt":"Cosa succede invocando outer() da un singolo thread?","code":"class R {\n    synchronized void outer() { inner(); }\n    synchronized void inner() { System.out.println(\"ok\"); }\n}","options":["Stampa \"ok\": il lock intrinseco è rientrante, lo stesso thread può riacquisirlo","Deadlock: outer() detiene il lock e inner() non può acquisirlo","Non compila","Lancia IllegalMonitorStateException"],"correct":0,"explanation":"In sintesi: il monitor intrinseco di Java è rientrante: il thread che possiede già il lock di `this` in `outer()` può rientrare in `inner()` senza bloccarsi, quindi stampa `ok`; la JVM tiene un contatore di rientri.\nLe altre opzioni: proprio per la rientranza non c\u0027è deadlock, il codice compila e `IllegalMonitorStateException` si ha usando `wait/notify` senza possedere il monitor, non qui."},{"type":"code","prompt":"Più thread eseguono questa sequenza su una ConcurrentHashMap. Il conteggio è affidabile?","code":"ConcurrentHashMap\u003cString,Integer\u003e m = new ConcurrentHashMap\u003c\u003e();\n// ogni thread:\nif (!m.containsKey(\"k\")) {\n    m.put(\"k\", 0);\n}\nm.put(\"k\", m.get(\"k\") + 1);","options":["No: le singole operazioni sono thread-safe, ma il check-then-act e il get+put compongono operazioni non atomiche, causando conteggi errati; usare merge/compute o valori atomici","Sì: ConcurrentHashMap rende automaticamente atomica l\u0027intera sequenza","No, perché lancia ConcurrentModificationException","No, perché il codice non compila a causa dei null"],"correct":0,"explanation":"In sintesi: `ConcurrentHashMap` garantisce l\u0027atomicità delle singole operazioni, non della loro composizione: sia il `containsKey`+`put` sia il `get`+`put` sono sequenze read-then-act interlacciabili, quindi si perdono incrementi; la soluzione idiomatica è `merge(\"k\", 1, Integer::sum)` o `compute`, oppure un `AtomicInteger` come valore.\nLe altre opzioni: la mappa non atomizza l\u0027intera sequenza, i suoi iteratori non lanciano `ConcurrentModificationException` e il codice compila correttamente."},{"type":"code","prompt":"Se il Thread B stampa, quale valore di data è garantito dal Java Memory Model?","code":"int data = 0;\nvolatile boolean ready = false;\n\n// Thread A\ndata = 42;\nready = true;\n\n// Thread B\nif (ready) {\n    System.out.println(data);\n}","options":["42: la scrittura di data happens-before la scrittura del volatile ready, che happens-before la sua lettura, rendendo visibile data","Può stampare 0 nonostante ready sia volatile","Nessuna garanzia: serve rendere volatile anche data","Il codice non compila senza synchronized"],"correct":0,"explanation":"In sintesi: la scrittura `volatile` di `ready` funziona da barriera: tutto ciò che A scrive prima (incluso `data = 42`) è visibile a B non appena B legge `ready == true`, per la catena happens-before tra scrittura e lettura del volatile; questo è il pattern di safe publication tramite flag.\nLe altre opzioni: proprio grazie al volatile B non può vedere `data == 0` quando `ready` è vero; non serve rendere `data` volatile e il codice compila senza `synchronized`."}]},{"id":"jvm","title":"JVM, Memoria \u0026 Eccezioni","questions":[{"type":"mcq","prompt":"In un metodo, dove risiedono le variabili locali di tipo primitivo (es. un `int`)?","code":"","options":["Sullo stack, nel frame del metodo","Sull\u0027heap, insieme agli oggetti","Nel metaspace","Nel program counter register"],"correct":0,"explanation":"In sintesi: le variabili locali di tipo primitivo vivono nel frame del metodo sullo stack del thread; ogni invocazione crea un frame che contiene i primitivi e i riferimenti locali, distrutto all\u0027uscita del metodo. Sull\u0027heap finiscono gli oggetti, non i primitivi locali.\nLe altre opzioni: l\u0027heap ospita gli oggetti non i primitivi locali; il metaspace tiene i metadati delle classi; il program counter e\u0027 solo un puntatore all\u0027istruzione corrente."},{"type":"mcq","prompt":"Nel Java moderno (Java 8+), cosa contiene il metaspace?","code":"","options":["I metadati delle classi (strutture runtime, bytecode dei metodi, informazioni sui tipi), in memoria nativa off-heap","Gli oggetti di grandi dimensioni, per evitare la frammentazione dell\u0027heap","Le variabili locali e i frame dei metodi di ogni thread","Il pool delle stringhe interned e nient\u0027altro"],"correct":0,"explanation":"In sintesi: dal Java 8 il metaspace ha sostituito il PermGen e vive in memoria nativa off-heap; contiene i metadati delle classi caricate, cioe\u0027 strutture runtime, bytecode dei metodi e informazioni sui tipi. Cresce dinamicamente ed e\u0027 limitabile con `-XX:MaxMetaspaceSize`.\nLe altre opzioni: gli oggetti grandi stanno comunque sull\u0027heap; frame e variabili locali stanno sullo stack; lo string pool interned dal Java 7 e\u0027 sull\u0027heap, non nel metaspace."},{"type":"truefalse","prompt":"Ogni thread della JVM ha il proprio stack privato, mentre l\u0027heap e\u0027 condiviso tra tutti i thread.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero. Ogni thread ha uno stack privato con i propri frame di metodo, mentre l\u0027heap (e il metaspace) e\u0027 condiviso; per questo l\u0027accesso concorrente all\u0027heap richiede sincronizzazione, mentre le variabili sullo stack sono per definizione thread-confined.\nLe altre opzioni: negarlo significherebbe ignorare che i primitivi/riferimenti locali sono isolati per thread mentre gli oggetti condivisi vivono nell\u0027heap comune."},{"type":"mcq","prompt":"Che cos\u0027e\u0027 il program counter (PC) register nella JVM?","code":"","options":["Un registro per-thread che contiene l\u0027indirizzo dell\u0027istruzione bytecode in esecuzione","Un contatore globale condiviso che conta gli oggetti allocati sull\u0027heap","Il registro che memorizza il valore di ritorno di ogni metodo","Una struttura nel metaspace che conta i riferimenti a ciascuna classe"],"correct":0,"explanation":"In sintesi: il program counter register e\u0027 per-thread e contiene l\u0027indirizzo dell\u0027istruzione bytecode attualmente in esecuzione da quel thread; permette alla JVM di riprendere il thread nel punto giusto dopo uno switch di contesto (per i metodi native il valore e\u0027 indefinito).\nLe altre opzioni: non conta oggetti sull\u0027heap, non memorizza valori di ritorno e non sta nel metaspace."},{"type":"code","prompt":"Considerando questo codice, dove risiedono `x`, il riferimento `s` e l\u0027oggetto `String`?","code":"public class Demo {\n    public static void main(String[] args) {\n        int x = 42;\n        String s = new String(\"hi\");\n    }\n}","options":["`x` e il riferimento `s` stanno sullo stack (frame di `main`); l\u0027oggetto `String` sta sull\u0027heap","Tutto (`x`, `s` e l\u0027oggetto) sta sull\u0027heap perche\u0027 sono dentro un metodo","`x` sta sull\u0027heap, mentre `s` e l\u0027oggetto stanno sullo stack","Tutto sta sullo stack perche\u0027 sono variabili locali"],"correct":0,"explanation":"In sintesi: `x` e\u0027 un primitivo locale e sta nel frame di `main` sullo stack; anche il riferimento `s` e\u0027 una variabile locale sullo stack, ma l\u0027oggetto `String` a cui punta e\u0027 allocato sull\u0027heap. La regola chiave: il riferimento sta sullo stack, l\u0027oggetto sull\u0027heap.\nLe altre opzioni: non tutto sta sull\
