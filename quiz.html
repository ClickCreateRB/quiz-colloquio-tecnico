u0027heap ne\u0027 tutto sullo stack; e `x`, essendo primitivo locale, non finisce sull\u0027heap."},{"type":"truefalse","prompt":"Grazie all\u0027escape analysis, il JIT puo\u0027 allocare sullo stack (o eliminare del tutto tramite scalar replacement) oggetti che non sfuggono all\u0027ambito del metodo.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero, ed e\u0027 una domanda stretch. L\u0027escape analysis del JIT determina se un oggetto \u0027sfugge\u0027 al metodo; se non sfugge, puo\u0027 applicare scalar replacement decomponendone i campi in registri o sullo stack, evitando l\u0027allocazione sull\u0027heap e riducendo la pressione sul GC.\nLe altre opzioni: negarlo ignorerebbe un\u0027ottimizzazione reale di HotSpot; resta vero che, concettualmente, il modello di memoria colloca gli oggetti sull\u0027heap."},{"type":"code","prompt":"Cosa produce l\u0027esecuzione di questo programma?","code":"public class Recurse {\n    static int depth(int n) {\n        return depth(n + 1);\n    }\n    public static void main(String[] args) {\n        System.out.println(depth(0));\n    }\n}","options":["Stampa un numero molto grande","Lancia `StackOverflowError`","Lancia `OutOfMemoryError`","Va in loop infinito senza errori"],"correct":1,"explanation":"In sintesi: `depth` si richiama senza caso base, quindi ogni chiamata aggiunge un frame allo stack finche\u0027 lo spazio si esaurisce: la JVM lancia `StackOverflowError`. E\u0027 il sintomo tipico di ricorsione infinita o troppo profonda.\nLe altre opzioni: non c\u0027e\u0027 un valore stampato perche\u0027 non si ritorna mai; non e\u0027 `OutOfMemoryError` (riguarda l\u0027heap) ne\u0027 un loop silenzioso: lo stack e\u0027 finito e l\u0027errore arriva."},{"type":"mcq","prompt":"Secondo il modello di HotSpot, quando un oggetto diventa idoneo alla garbage collection?","code":"","options":["Quando non e\u0027 piu\u0027 raggiungibile tramite una catena di riferimenti a partire da un GC root","Quando il suo contatore di riferimenti (reference count) arriva a zero","Immediatamente dopo l\u0027uscita dal metodo in cui e\u0027 stato creato","Quando il programmatore chiama esplicitamente `free()` o `delete`"],"correct":0,"explanation":"In sintesi: nel modello di HotSpot un oggetto e\u0027 idoneo al GC quando diventa non raggiungibile, cioe\u0027 non esiste piu\u0027 alcuna catena di riferimenti che parte da un GC root e arriva a lui. Il GC lavora sulla reachability, non sul conteggio dei riferimenti.\nLe altre opzioni: il reference counting non e\u0027 usato da HotSpot (non gestirebbe i cicli); l\u0027uscita dal metodo non basta se l\u0027oggetto e\u0027 ancora riferito; in Java non esiste `free()`/`delete` manuale."},{"type":"mcq","prompt":"Quale dei seguenti NON e\u0027 un GC root?","code":"","options":["Un oggetto raggiungibile solo tramite un altro oggetto a sua volta non raggiungibile","Le variabili locali nello stack di un thread attivo","I riferimenti dai campi statici delle classi caricate","Gli oggetti riferiti da variabili JNI native"],"correct":0,"explanation":"In sintesi: un GC root e\u0027 un punto d\u0027ingresso \u0027vivo\u0027 della reachability: variabili locali sullo stack di thread attivi, campi statici delle classi caricate, riferimenti JNI nativi, thread attivi. Un oggetto raggiungibile solo tramite un altro oggetto gia\u0027 non raggiungibile e\u0027 invece spazzatura, non un root.\nLe altre opzioni: locali sullo stack, campi statici e riferimenti JNI sono GC root autentici."},{"type":"mcq","prompt":"Qual e\u0027 la differenza tra minor GC e major/full GC?","code":"","options":["Il minor GC ripulisce la young generation; il major/full GC coinvolge anche la old generation","Il minor GC gira solo in fase di startup, il major GC solo allo shutdown","Il minor GC libera il metaspace, il major GC libera l\u0027heap","Il minor GC e\u0027 manuale via `System.gc()`, il major e\u0027 automatico"],"correct":0,"explanation":"In sintesi: il minor GC ripulisce la young generation (Eden e survivor), dove muoiono in fretta la maggior parte degli oggetti secondo la weak generational hypothesis; il major/full GC coinvolge anche la old generation ed e\u0027 piu\u0027 costoso e con pause maggiori.\nLe altre opzioni: il GC non gira solo a startup/shutdown, il minor non tocca il metaspace e non e\u0027 pilotato manualmente da `System.gc()`."},{"type":"truefalse","prompt":"La chiamata `System.gc()` garantisce l\u0027esecuzione immediata e completa del garbage collector.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: e\u0027 falso. `System.gc()` e\u0027 soltanto un suggerimento (hint) alla JVM: non garantisce quando ne\u0027 se il GC verra\u0027 eseguito, e puo\u0027 essere disabilitato con `-XX:+DisableExplicitGC`. Affidarsi ad esso e\u0027 un anti-pattern.\nLe altre opzioni: crederlo garantito porta a codice fragile che \u0027sembra\u0027 liberare memoria ma dipende dalla politica del collector."},{"type":"code","prompt":"Dopo l\u0027assegnazione `o = null`, l\u0027oggetto creato e\u0027 idoneo alla garbage collection?","code":"class Holder {\n    static Object ref;\n}\npublic class Main {\n    public static void main(String[] args) {\n        Object o = new Object();\n        Holder.ref = o;\n        o = null;\n    }\n}","options":["No: l\u0027oggetto resta raggiungibile tramite il campo statico `Holder.ref` (un GC root), quindi non e\u0027 idoneo","Si\u0027: dopo `o = null` non esistono piu\u0027 riferimenti, quindi e\u0027 immediatamente raccolto","Si\u0027, ma solo dopo aver chiamato `System.gc()`","No, perche\u0027 in Java gli oggetti non vengono mai raccolti finche\u0027 il programma e\u0027 in esecuzione"],"correct":0,"explanation":"In sintesi: no. Dopo `o = null` il riferimento locale sparisce, ma l\u0027oggetto resta raggiungibile tramite il campo statico `Holder.ref`, che e\u0027 un GC root: quindi non e\u0027 idoneo alla raccolta. Per liberarlo bisognerebbe azzerare anche `Holder.ref`.\nLe altre opzioni: non basta annullare la sola variabile locale; `System.gc()` e\u0027 irrilevante finche\u0027 l\u0027oggetto e\u0027 raggiungibile; e gli oggetti irraggiungibili in Java vengono eccome raccolti."},{"type":"code","prompt":"Chiamando `add()` ripetutamente senza mai svuotare la lista, cosa succede?","code":"public class Cache {\n    private static final List\u003cbyte[]\u003e CACHE = new ArrayList\u003c\u003e();\n    public static void add() {\n        CACHE.add(new byte[1024 * 1024]);\n    }\n}","options":["Nessun problema: il GC liberera\u0027 gli array quando la memoria scarseggia, perche\u0027 sono in una cache","Memory leak: gli array restano raggiungibili dalla lista statica e non vengono mai raccolti, fino a `OutOfMemoryError`","`StackOverflowError` dopo molte chiamate ad `add()`","Gli array vengono deallocati automaticamente all\u0027uscita del metodo `add()`"],"correct":1,"explanation":"In sintesi: e\u0027 un memory leak classico. La lista e\u0027 `static` (raggiungibile da un GC root per tutta la vita della classe) e accumula riferimenti forti agli array, che quindi non diventano mai irraggiungibili: la memoria cresce senza limiti fino a `OutOfMemoryError: Java heap space`.\nLe altre opzioni: il GC non puo\u0027 liberare oggetti ancora raggiungibili; non e\u0027 uno `StackOverflowError`; e in Java non c\u0027e\u0027 deallocazione manuale a fine metodo."},{"type":"mcq","prompt":"Registrare un listener/observer su un componente a vita lunga senza mai deregistrarlo, in genere, cosa comporta?","code":"","options":["E\u0027 un classico memory leak: il componente a vita lunga mantiene un riferimento forte al listener, impedendo la raccolta sua e degli oggetti che referenzia","Non puo\u0027 causare leak: i listener sono sempre riferimenti deboli in Java","Causa uno `StackOverflowError` alla prima notifica","Il GC rimuove automaticamente i listener non piu\u0027 usati dal codice applicativo"],"correct":0,"explanation":"In sintesi: e\u0027 il tipico leak da listener/observer. Il componente a vita lunga (il subject) tiene un riferimento forte al listener; se non lo si deregistra, il listener e tutto cio\u0027 che referenzia restano raggiungibili e non vengono raccolti. La soluzione e\u0027 deregistrarlo o usare weak references.\nLe altre opzioni: i listener non sono weak per default; non e\u0027 uno `StackOverflowError`; il GC non \u0027indovina\u0027 quali listener togliere."},{"type":"mcq","prompt":"In un\u0027applicazione con thread pool, usare `ThreadLocal` e non chiamare mai `remove()` cosa comporta?","code":"","options":["Rischio di memory leak: i thread del pool vivono a lungo e trattengono i valori nella `ThreadLocalMap`, non rilasciati finche\u0027 non si chiama `remove()`","Nessun rischio: alla fine di ogni task il valore `ThreadLocal` viene azzerato automaticamente","Causa sempre un `OutOfMemoryError` alla prima esecuzione","I `ThreadLocal` non sono utilizzabili nei thread pool: il compilatore lo impedisce"],"correct":0,"explanation":"In sintesi: si\u0027, e\u0027 un leak insidioso e stretch. Nei thread pool i worker vivono a lungo e riusano gli stessi thread; i valori restano nella `ThreadLocalMap` del thread finche\u0027 non si chiama `remove()`. Va sempre ripulito, tipicamente in un `finally`, a fine task.\nLe altre opzioni: il valore non si azzera da solo a fine task; non causa OOM immediato; e i `ThreadLocal` sono perfettamente usabili nei pool, semplicemente vanno gestiti con cura."},{"type":"mcq","prompt":"Nella gerarchia delle eccezioni, cosa sono `OutOfMemoryError` e `StackOverflowError`?","code":"","options":["Sono entrambi sottoclassi di `Error`: condizioni gravi normalmente non gestibili dall\u0027applicazione","Sono entrambi sottoclassi di `RuntimeException`","`OutOfMemoryError` e\u0027 un `Error`, `StackOverflowError` e\u0027 una `Exception`","Sono entrambi checked exception e vanno dichiarati con `throws`"],"correct":0,"explanation":"In sintesi: `OutOfMemoryError` e `StackOverflowError` sono entrambi sottoclassi di `Error` (via `VirtualMachineError`), quindi condizioni gravi che l\u0027applicazione di norma non dovrebbe tentare di gestire. Il primo riguarda l\u0027esaurimento dell\u0027heap, il secondo l\u0027esaurimento dello stack.\nLe altre opzioni: non sono `RuntimeException` ne\u0027 checked exception, e nessuno dei due e\u0027 una `Exception`."},{"type":"mcq","prompt":"Cosa intercetta un blocco `catch (Throwable t)` e qual e\u0027 la posizione di `Throwable`?","code":"","options":["`Throwable` e\u0027 la radice della gerarchia: `catch (Throwable t)` intercetta sia le `Exception` sia gli `Error`","`Throwable` sta sotto `Exception`, quindi non intercetta gli `Error`","Non e\u0027 possibile fare `catch (Throwable t)`: non compila","`catch (Throwable t)` intercetta solo le unchecked exception"],"correct":0,"explanation":"In sintesi: `Throwable` e\u0027 la radice comune di `Error` ed `Exception`; un `catch (Throwable t)` intercetta davvero entrambi, inclusi gli `Error`. E\u0027 valido sintatticamente ma sconsigliato, perche\u0027 catturare gli `Error` (es. `OutOfMemoryError`) di solito e\u0027 controproducente.\nLe altre opzioni: `Throwable` e\u0027 sopra `Exception`, il catch compila, e non si limita alle unchecked."},{"type":"truefalse","prompt":"In Java, `RuntimeException` e\u0027 una sottoclasse di `Exception`.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero. La gerarchia e\u0027 `Throwable` -\u003e `Exception` -\u003e `RuntimeException`: quindi `RuntimeException` estende `Exception`, ma e\u0027 unchecked. Le altre `Exception` non-runtime sono checked.\nLe altre opzioni: negarlo confonderebbe la posizione di `RuntimeException`, che sta sotto `Exception`, non parallela ad essa."},{"type":"code","prompt":"Cosa stampa questo programma?","code":"public class Catch {\n    public static void main(String[] args) {\n        try {\n            String s = null;\n            s.length();\n        } catch (Exception e) {\n            System.out.println(\"catturata\");\n        }\n    }\n}","options":["Stampa `catturata`","Errore di compilazione","L\u0027eccezione non viene catturata e il programma termina con stack trace","Non stampa nulla e termina normalmente"],"correct":0,"explanation":"In sintesi: stampa `catturata`. Il `NullPointerException` e\u0027 una `RuntimeException`, quindi una `Exception`: il `catch (Exception e)` la intercetta senza problemi. Le unchecked sono catturabili esattamente come le checked.\nLe altre opzioni: non c\u0027e\u0027 errore di compilazione, l\u0027eccezione non sfugge al catch e qualcosa viene stampato."},{"type":"mcq","prompt":"Quale delle seguenti e\u0027 una checked exception?","code":"","options":["`IOException`","`NullPointerException`","`IllegalArgumentException`","`ArrayIndexOutOfBoundsException`"],"correct":0,"explanation":"In sintesi: `IOException` e\u0027 una checked exception: eredita da `Exception` (non da `RuntimeException`), quindi va dichiarata con `throws` o catturata, altrimenti il codice non compila. Le altre tre sono unchecked.\nLe altre opzioni: `NullPointerException`, `IllegalArgumentException` e `ArrayIndexOutOfBoundsException` estendono `RuntimeException` e sono unchecked."},{"type":"truefalse","prompt":"Le `RuntimeException` e le loro sottoclassi (unchecked) non devono essere obbligatoriamente dichiarate con `throws` ne\u0027 catturate.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero. Le `RuntimeException` e sottoclassi sono unchecked: il compilatore non obbliga a dichiararle ne\u0027 a catturarle, perche\u0027 rappresentano tipicamente errori di programmazione. Le checked, invece, vanno gestite o propagate esplicitamente.\nLe altre opzioni: crederlo falso porterebbe a `throws` inutili su NPE e simili, che non sono richiesti."},{"type":"code","prompt":"Qual e\u0027 l\u0027output di questo programma?","code":"public class F {\n    public static void main(String[] args) {\n        try {\n            System.out.println(\"A\");\n            throw new RuntimeException(\"x\");\n        } catch (RuntimeException e) {\n            System.out.println(\"B\");\n        } finally {\n            System.out.println(\"C\");\n        }\n        System.out.println(\"D\");\n    }\n}","options":["A B C D","A B D","A C D (senza B)","A B C (senza D)"],"correct":0,"explanation":"In sintesi: l\u0027output e\u0027 `A B C D`. Si stampa A, l\u0027eccezione viene lanciata e catturata (B), il `finally` esegue sempre (C) e, poiche\u0027 l\u0027eccezione e\u0027 stata gestita, l\u0027esecuzione prosegue dopo il try/catch (D).\nLe altre opzioni: B non viene saltato (l\u0027eccezione e\u0027 catturata), il finally non viene omesso e D viene raggiunto normalmente."},{"type":"code","prompt":"Cosa stampa questo programma?","code":"public class R {\n    static int f() {\n        try {\n            return 1;\n        } finally {\n            return 2;\n        }\n    }\n    public static void main(String[] args) {\n        System.out.println(f());\n    }\n}","options":["2","1","Prima 1 poi 2","Errore di compilazione"],"correct":0,"explanation":"In sintesi: stampa `2`. Un `return` dentro il `finally` sovrascrive il `return 1` del `try`: il valore del try viene scartato. E\u0027 comportamento corretto ma un anti-pattern, perche\u0027 un return (o un throw) nel finally nasconde il flusso.\nLe altre opzioni: non e\u0027 1 (il finally vince), non si stampano due valori e il codice compila (al piu\u0027 con warning)."},{"type":"code","prompt":"Cosa stampa questo programma?","code":"public class S {\n    static int f() {\n        try {\n            throw new RuntimeException(\"boom\");\n        } finally {\n            return 42;\n        }\n    }\n    public static void main(String[] args) {\n        System.out.println(f());\n    }\n}","options":["Stampa `42`; l\u0027eccezione viene scartata (soppressa dal `return` nel finally)","Propaga la `RuntimeException` e il programma termina con stack trace","Errore di compilazione","Stampa `42` e poi lo stack trace dell\u0027eccezione"],"correct":0,"explanation":"In sintesi: stampa `42`. Il `return` nel `finally` prende il sopravvento e fa uscire il metodo normalmente, scartando la `RuntimeException` lanciata nel try: l\u0027eccezione viene silenziosamente soppressa. E\u0027 uno dei motivi per cui non si mette un return nel finally.\nLe altre opzioni: l\u0027eccezione non si propaga proprio perche\u0027 il finally ritorna, il codice compila e non viene stampato alcuno stack trace."},{"type":"truefalse","prompt":"Se nel blocco `try` viene chiamato `System.exit(0)`, il blocco `finally` NON viene eseguito.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero. `System.exit()` termina la JVM invocando l\u0027halt del runtime: i blocchi `finally` in sospeso NON vengono eseguiti perche\u0027 il thread non \u0027esce\u0027 normalmente dal try. E\u0027 l\u0027eccezione classica alla regola \u0027finally esegue sempre\u0027.\nLe altre opzioni: pensare che il finally giri comunque ignora che `System.exit` arresta la VM, saltando lo stack unwinding."},{"type":"code","prompt":"Qual e\u0027 l\u0027output di questo programma?","code":"class Res implements AutoCloseable {\n    final String name;\n    Res(String name) { this.name = name; System.out.println(\"open \" + name); }\n    public void close() { System.out.println(\"close \" + name); }\n}\npublic class T {\n    public static void main(String[] args) {\n        try (Res a = new Res(\"A\"); Res b = new Res(\"B\")) {\n            System.out.println(\"body\");\n        }\n    }\n}","options":["open A / open B / body / close B / close A","open A / open B / body / close A / close B","open A / open B / body (le risorse non vengono chiuse automaticamente)","open A / close A / open B / close B / body"],"correct":0,"explanation":"In sintesi: l\u0027output e\u0027 open A / open B / body / close B / close A. Nel try-with-resources le risorse vengono chiuse in ordine inverso rispetto all\u0027apertura (LIFO), cosi\u0027 le dipendenze aperte per prime si chiudono per ultime.\nLe altre opzioni: la chiusura non e\u0027 nello stesso ordine di apertura, le risorse vengono chiuse automaticamente e il body viene eseguito prima delle close."},{"type":"mcq","prompt":"Cosa deve implementare una risorsa per poter essere usata in un try-with-resources?","code":"","options":["`AutoCloseable` (o `Closeable`); il suo `close()` viene invocato automaticamente a fine blocco","La classe astratta `Resource`","Nulla di particolare: la JVM chiama `finalize()` a fine blocco","L\u0027interfaccia `Serializable`"],"correct":0,"explanation":"In sintesi: per il try-with-resources la risorsa deve implementare `AutoCloseable` (o `Closeable`, che lo estende); il suo `close()` viene invocato automaticamente all\u0027uscita del blocco, anche in caso di eccezione. E\u0027 il pattern moderno che sostituisce il finally manuale.\nLe altre opzioni: non serve una classe `Resource`, non ci si affida a `finalize()`, e `Serializable` non c\u0027entra con la chiusura."},{"type":"code","prompt":"Cosa succede compilando questo multi-catch?","code":"try {\n    // ...\n} catch (IOException | FileNotFoundException e) {\n    // ...\n}","options":["Errore di compilazione: `FileNotFoundException` e\u0027 sottoclasse di `IOException`, quindi e\u0027 ridondante nel multi-catch","Compila e cattura solo `FileNotFoundException`","Compila normalmente: il multi-catch accetta qualsiasi combinazione di tipi","Errore a runtime al primo lancio di `IOException`"],"correct":0,"explanation":"In sintesi: e\u0027 un errore di compilazione. In un multi-catch le alternative non possono essere in relazione di sottotipo: `FileNotFoundException` e\u0027 gia\u0027 una `IOException`, quindi elencarle insieme e\u0027 ridondante e il compilatore lo rifiuta. Basterebbe catturare la sola `IOException`.\nLe altre opzioni: non compila affatto, quindi non cattura selettivamente ne\u0027 va in errore a runtime."},{"type":"mcq","prompt":"Come si preserva l\u0027eccezione originale quando la si rilancia incapsulata in un\u0027altra?","code":"","options":["Passando la causa al costruttore, es. `throw new ServiceException(\"...\", e)`, recuperabile poi con `getCause()`","Concatenando i messaggi con `+` nella nuova eccezione","Chiamando `e.printStackTrace()` prima di rilanciare","Non e\u0027 possibile: la causa originale va sempre persa quando si rilancia"],"correct":0,"explanation":"In sintesi: si preserva la causa con l\u0027exception chaining, passandola al costruttore, es. `throw new ServiceException(\"messaggio\", e)`; l\u0027originale resta accessibile con `getCause()` e compare nello stack trace come \u0027Caused by\u0027. Questo mantiene il contesto senza perdere la radice del problema.\nLe altre opzioni: concatenare messaggi con `+` perde lo stack trace originale; `printStackTrace()` non collega le eccezioni; e la causa non va affatto persa."},{"type":"mcq","prompt":"Qual e\u0027 la differenza tra `throw` e `throws`?","code":"","options":["`throw` lancia effettivamente un\u0027istanza di eccezione; `throws` nella firma dichiara che il metodo puo\u0027 propagare quel tipo","`throw` si usa nella firma del metodo, `throws` dentro il corpo","Sono sinonimi intercambiabili","`throw` e\u0027 per le checked, `throws` per le unchecked"],"correct":0,"explanation":"In sintesi: `throw` e\u0027 l\u0027istruzione che lancia effettivamente un\u0027istanza di eccezione (`throw new IllegalStateException()`); `throws` compare nella firma del metodo e dichiara i tipi di (checked) exception che il metodo puo\u0027 propagare al chiamante. Uno esegue, l\u0027altro documenta/obbliga.\nLe altre opzioni: non sono invertiti, non sono sinonimi e la distinzione non e\u0027 tra checked e unchecked."},{"type":"mcq","prompt":"Progettando eccezioni personalizzate, quando conviene estendere `RuntimeException` invece di `Exception`?","code":"","options":["`RuntimeException` (unchecked) per errori di programmazione/non recuperabili; `Exception` (checked) quando il chiamante puo\u0027 ragionevolmente reagire e vuoi obbligarlo a gestirla","Estendere sempre `Error`, cosi\u0027 l\u0027eccezione e\u0027 piu\u0027 veloce","Estendere sempre `Throwable` direttamente per massima flessibilita\u0027","Non ha alcun impatto: checked e unchecked sono equivalenti a runtime e in compilazione"],"correct":0,"explanation":"In sintesi: la scelta di design e\u0027: estendere `RuntimeException` (unchecked) per errori di programmazione o non recuperabili, evitando di inquinare le firme; estendere `Exception` (checked) quando il chiamante puo\u0027 ragionevolmente reagire e vuoi costringerlo a gestire il caso. La regola e\u0027 checked per condizioni recuperabili e prevedibili.\nLe altre opzioni: estendere `Error` e\u0027 riservato a problemi gravi della VM, `Throwable` diretto e\u0027 sconsigliato, e checked/unchecked non sono equivalenti (cambiano gli obblighi a compile-time)."},{"type":"truefalse","prompt":"Catturare un\u0027eccezione con un blocco `catch` vuoto (swallow) e\u0027 un anti-pattern perche\u0027 nasconde l\u0027errore e complica il debug.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero. Un `catch` vuoto \u0027ingoia\u0027 l\u0027eccezione: nasconde l\u0027errore, rende il bug invisibile e complica enormemente il debug. La best practice e\u0027 almeno loggare con contesto, rilanciare incapsulando (chaining) o gestire davvero il caso.\nLe altre opzioni: considerarlo accettabile porta a fallimenti silenziosi che si manifestano lontano dalla causa reale."}]},{"id":"jpa-hibernate","title":"JPA / Hibernate","questions":[{"type":"mcq","prompt":"Qual e il problema fondamentale che un ORM come Hibernate mira a risolvere?","code":"","options":["L\u0027object-relational impedance mismatch tra modello a oggetti e modello relazionale","L\u0027assenza di un connection pool nel driver JDBC","La generazione automatica degli indici sul database","La replica dei dati tra piu istanze di database"],"correct":0,"explanation":"In sintesi: un ORM colma l\u0027object-relational impedance mismatch, cioe la distanza strutturale tra il mondo a oggetti (ereditarieta, associazioni, identita per riferimento) e quello relazionale (tabelle, righe, foreign key, identita per chiave primaria); mappa entita a tabelle e rende la persistenza trasparente allo sviluppatore.\nLe altre opzioni: connection pool, indici e replica sono responsabilita di driver, DBA o infrastruttura, non il nucleo del problema che un ORM affronta."},{"type":"mcq","prompt":"Quale strategia di @GeneratedValue delega la generazione della chiave primaria a una colonna auto-increment/identity del database?","code":"","options":["GenerationType.IDENTITY","GenerationType.SEQUENCE","GenerationType.TABLE","GenerationType.AUTO"],"correct":0,"explanation":"In sintesi: `GenerationType.IDENTITY` affida la generazione della PK a una colonna auto-increment/identity del database, quindi il valore e disponibile solo dopo l\u0027esecuzione dell\u0027INSERT.\nLe altre opzioni: `SEQUENCE` usa una sequence del DB, `TABLE` una tabella di supporto dedicata, `AUTO` lascia al provider la scelta della strategia in base al dialect."},{"type":"code","prompt":"Le due find vengono eseguite nello stesso EntityManager/transazione. Cosa stampa e quante SELECT vengono eseguite?","code":"Long id = 1L;\nCustomer c1 = em.find(Customer.class, id);\nCustomer c2 = em.find(Customer.class, id);\nSystem.out.println(c1 == c2);","options":["true, ed e stata eseguita una sola SELECT","false, sono due istanze distinte con due SELECT","true, ma sono state eseguite due SELECT","false, la seconda find restituisce null"],"correct":0,"explanation":"In sintesi: il persistence context e una cache di primo livello con garanzia di identita: per una data chiave nello stesso contesto esiste una sola istanza gestita, quindi la seconda `find` la restituisce dalla cache senza andare al DB e `c1 == c2` e true con una sola SELECT.\nLe altre opzioni: presuppongono due istanze o due query, ignorando l\u0027identita garantita dal first-level cache, oppure un null che non ha ragione di esistere se la riga c\u0027e."},{"type":"mcq","prompt":"Un\u0027entita persistent viene rimossa dal persistence context tramite em.detach() oppure alla chiusura dell\u0027EntityManager. In quale stato transita?","code":"","options":["detached","removed","transient","persistent"],"correct":0,"explanation":"In sintesi: un\u0027entita che ha un\u0027identita persistente ma non e piu tracciata da un persistence context e detached; le modifiche successive non vengono piu rilevate dal dirty checking finche non si fa `merge`.\nLe altre opzioni: `removed` si ha dopo `remove`, `transient` e un\u0027istanza nuova mai associata a un contesto e senza identita nel DB, `persistent` e proprio lo stato che si perde detachando."},{"type":"mcq","prompt":"In una relazione bidirezionale @OneToMany/@ManyToOne, dove risiede tipicamente la foreign key nello schema del database?","code":"","options":["Nella tabella del lato @ManyToOne, che e l\u0027owning side","Nella tabella del lato @OneToMany","In una tabella di join dedicata","Duplicata in entrambe le tabelle"],"correct":0,"explanation":"In sintesi: nel classico uno-a-molti bidirezionale l\u0027owning side e il @ManyToOne (il lato molti), ed e li che vive la foreign key; il @OneToMany e il lato inverso e usa `mappedBy`.\nLe altre opzioni: mettere la FK sul lato @OneToMany o duplicarla e strutturalmente sbagliato, e la join table appartiene di norma al @ManyToMany, non a un @OneToMany standard."},{"type":"truefalse","prompt":"In JPA, le associazioni @ManyToOne e @OneToOne hanno fetch EAGER per default, mentre @OneToMany e @ManyToMany sono LAZY.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: la specifica JPA definisce EAGER il default per `@ManyToOne` e `@OneToOne`, LAZY per `@OneToMany` e `@ManyToMany`; per questo si consiglia spesso di forzare `fetch = LAZY` anche sui to-one per evitare caricamenti impliciti.\nLe altre opzioni: dire Falso e l\u0027errore tipico di chi crede che tutto sia LAZY di default, dimenticando che i to-one sono EAGER salvo override esplicito."},{"type":"code","prompt":"La collezione orders di Customer e mappata LAZY. Cosa accade eseguendo loadOrders()?","code":"public List\u003cOrder\u003e loadOrders() {\n    Customer c;\n    try (EntityManager em = emf.createEntityManager()) {\n        c = em.find(Customer.class, 1L);\n    } // persistence context chiuso qui\n    return c.getOrders(); // orders e LAZY\n}","options":["Lancia LazyInitializationException: la collezione LAZY viene acceduta a persistence context chiuso","Carica gli ordini con una SELECT aggiuntiva e li restituisce","Restituisce null","Restituisce una lista vuota"],"correct":0,"explanation":"In sintesi: la collezione LAZY e un proxy che ha bisogno di una sessione aperta per inizializzarsi; qui l\u0027EntityManager e gia chiuso quando si chiama `getOrders()`, quindi Hibernate lancia `LazyInitializationException`. La cura corretta e caricare i dati dentro la transazione con JOIN FETCH, `@EntityGraph` o mappandoli in un DTO.\nLe altre opzioni: senza sessione attiva Hibernate non puo emettere la SELECT tardiva, e non restituisce ne null ne lista vuota: fallisce esplicitamente."},{"type":"mcq","prompt":"Carichi 100 Customer e poi in un ciclo accedi a customer.getOrders() (LAZY). Nel caso peggiore quante query vengono eseguite?","code":"","options":["101: una per i customer piu una per ciascun customer (problema N+1)","1: una sola query con join automatico","100: una query per customer","2: una per i customer e una per tutti gli orders"],"correct":0,"explanation":"In sintesi: e il classico problema N+1: una query per caricare gli N customer piu una query per inizializzare la collezione LAZY di ognuno, per un totale di N+1 (qui 101). Si risolve con JOIN FETCH, `@EntityGraph` o batch fetching.\nLe altre opzioni: una sola query o due query descrivono gia lo scenario ottimizzato, mentre 100 dimentica la query iniziale sui customer."},{"type":"mcq","prompt":"Quale tecnica risolve alla radice il problema N+1 caricando le entita e la loro associazione in un\u0027unica query?","code":"","options":["Usare JOIN FETCH in JPQL (o un @EntityGraph)","Impostare fetch = FetchType.EAGER sulla collezione","Aumentare la dimensione del connection pool","Disabilitare la cache di primo livello"],"correct":0,"explanation":"In sintesi: `JOIN FETCH` (o l\u0027equivalente dichiarativo `@EntityGraph`) istruisce Hibernate a recuperare padre e associazione in una singola query, eliminando le N query aggiuntive.\nLe altre opzioni: EAGER sulla collezione non elimina l\u0027N+1 (spesso lo sposta o genera comunque select multiple), e pool e first-level cache non c\u0027entrano con il numero di query di fetch."},{"type":"mcq","prompt":"Con cascade = CascadeType.PERSIST su un @OneToMany, cosa succede quando persisti l\u0027entita padre contenente figli nuovi (transient) nella collezione?","code":"","options":["Anche i figli vengono persistiti automaticamente insieme al padre","I figli restano transient finche non li persisti singolarmente","Viene lanciata un\u0027eccezione perche i figli sono transient","I figli vengono aggiornati ma non inseriti"],"correct":0,"explanation":"In sintesi: `CascadeType.PERSIST` propaga l\u0027operazione di persist dal padre ai figli, quindi persistendo il padre vengono inseriti anche i figli nuovi presenti nella collezione, senza chiamare `persist` su ciascuno.\nLe altre opzioni: senza cascade i figli transient darebbero errore al flush, ma proprio la presenza del cascade PERSIST evita sia l\u0027eccezione sia la necessita di persist manuale."},{"type":"code","prompt":"L\u0027entita non viene mai passata a persist/merge/save. Cosa accade al commit?","code":"em.getTransaction().begin();\nProduct p = em.find(Product.class, 1L);\np.setPrice(new BigDecimal(\"99.99\"));\n// nessuna chiamata a persist / merge / save\nem.getTransaction().commit();","options":["Al commit Hibernate rileva la modifica con il dirty checking e genera un UPDATE","Nessun UPDATE: serve chiamare em.merge() esplicitamente","Nessun UPDATE: serve chiamare em.persist()","Viene lanciata un\u0027eccezione perche l\u0027entita non e stata salvata"],"correct":0,"explanation":"In sintesi: `p` e un\u0027entita managed; il persistence context ne conserva uno snapshot e al flush/commit confronta lo stato corrente con lo snapshot (dirty checking), rilevando il prezzo cambiato ed emettendo l\u0027UPDATE senza alcuna chiamata esplicita di salvataggio.\nLe altre opzioni: `merge` serve per entita detached e `persist` per le transient; su un\u0027entita gia gestita non servono, e non c\u0027e nessuna eccezione."},{"type":"mcq","prompt":"Con @Transactional di Spring e configurazione di default, per quale tipo di eccezione avviene il rollback automatico?","code":"","options":["Solo per RuntimeException ed Error (unchecked); le checked exception non causano rollback di default","Per qualsiasi eccezione, checked e unchecked","Solo per le checked exception","Per nessuna eccezione: il rollback e sempre manuale"],"correct":0,"explanation":"In sintesi: il default di Spring fa rollback solo su `RuntimeException` ed `Error` (unchecked); per far scattare il rollback anche su una checked exception occorre configurarlo con `rollbackFor`. E una fonte classica di bug: un metodo che lancia una checked exception ma committa comunque.\nLe altre opzioni: rollback su tutto, solo su checked, o mai, descrivono comportamenti diversi da quello di default di Spring."},{"type":"mcq","prompt":"Quale affermazione su JPQL e corretta?","code":"","options":["JPQL opera su entita e loro attributi, non direttamente su tabelle e colonne","JPQL e identico all\u0027SQL nativo e lavora su tabelle e colonne","JPQL non supporta i join","JPQL restituisce sempre dati non gestiti, bypassando il persistence context"],"correct":0,"explanation":"In sintesi: JPQL e un linguaggio orientato all\u0027object model: le query si scrivono su nomi di entita e loro attributi, e il provider le traduce nell\u0027SQL del dialect specifico. Le entita restituite sono gestite dal persistence context.\nLe altre opzioni: non e SQL nativo, supporta pienamente i join (anche JOIN FETCH), e le entita selezionate risultano managed, non detached."},{"type":"mcq","prompt":"In una relazione bidirezionale, dove va posto l\u0027attributo mappedBy e cosa indica?","code":"","options":["Sul lato inverso (non-owning); indica il campo che possiede la relazione sull\u0027owning side","Sull\u0027owning side, per indicare la colonna foreign key","Su entrambi i lati della relazione","Solo nelle relazioni @ManyToMany"],"correct":0,"explanation":"In sintesi: `mappedBy` si mette sul lato inverso (non-owning) e nomina il campo dell\u0027owning side che gestisce la foreign key; cosi si dichiara che quel lato non possiede la relazione e non deve generare una seconda colonna o join table.\nLe altre opzioni: sull\u0027owning side si usa invece `@JoinColumn`, metterlo su entrambi i lati e un errore, e `mappedBy` vale anche per @OneToMany/@OneToOne, non solo @ManyToMany."},{"type":"mcq","prompt":"Perche usare l\u0027ID generato dal database dentro equals() e hashCode() di un\u0027entita e considerato problematico?","code":"","options":["Prima del persist l\u0027ID e null e cambia dopo l\u0027insert, violando il contratto in HashSet/HashMap","Perche l\u0027ID non e mai garantito univoco","Perche Hibernate vieta di usare l\u0027ID in equals","Perche l\u0027ID non e serializzabile"],"correct":0,"explanation":"In sintesi: un ID generato dal DB e null finche l\u0027entita e transient e cambia dopo il persist; se e usato in `hashCode`, l\u0027hash dell\u0027oggetto muta dopo l\u0027inserimento e l\u0027istanza gia messa in un `HashSet` finisce nel bucket sbagliato, rompendo `contains`. Meglio una business key stabile o un hashCode costante.\nLe altre opzioni: l\u0027ID e univoco, Hibernate non lo vieta e la serializzabilita non c\u0027entra: il vero problema e la mutabilita dell\u0027ID nel ciclo di vita."},{"type":"code","prompt":"Tx A e Tx B leggono la stessa riga con version=5. Tx A aggiorna e committa (version diventa 6). Poi Tx B, che aveva letto version=5, prova a committare il proprio update. Cosa accade?","code":"@Entity\nclass Account {\n  @Id Long id;\n  @Version Long version;\n  BigDecimal balance;\n}","options":["Tx B fallisce con OptimisticLockException perche la version attesa non corrisponde a quella su DB","Tx B sovrascrive senza problemi i dati di Tx A","Tx B attende finche Tx A rilascia un lock pessimistico","Entrambe committano e la version diventa 7"],"correct":0,"explanation":"In sintesi: con `@Version` l\u0027UPDATE di Tx B include un WHERE su version=5; poiche Tx A l\u0027ha gia portata a 6, l\u0027UPDATE aggiorna zero righe e Hibernate lancia `OptimisticLockException`, prevenendo il lost update. E locking ottimistico, senza lock fisici sul DB.\nLe altre opzioni: nessuna sovrascrittura silenziosa, nessuna attesa su lock (quello sarebbe pessimistico) e la version non arriva a 7 perche il secondo commit fallisce."},{"type":"mcq","prompt":"[Stretch] Perche GenerationType.IDENTITY puo penalizzare le performance di inserimenti massivi in Hibernate?","code":"","options":["Impedisce il JDBC batch insert: per ottenere la chiave Hibernate deve eseguire subito ogni INSERT","Richiede una SELECT sulla sequence prima di ogni INSERT","Blocca l\u0027intera tabella durante gli insert","Disabilita la cache di secondo livello"],"correct":0,"explanation":"In sintesi: con IDENTITY la chiave e nota solo dopo l\u0027INSERT, quindi Hibernate non puo accodare le INSERT in un batch JDBC (avrebbe bisogno dell\u0027id prima) e le esegue una a una, perdendo il vantaggio del batching. SEQUENCE, potendo pre-allocare gli id, consente il batch.\nLe altre opzioni: la SELECT-prima-dell\u0027insert e semmai il costo (mitigabile) di SEQUENCE, e IDENTITY non blocca la tabella ne tocca la cache di secondo livello."},{"type":"truefalse","prompt":"La cache di primo livello (persistence context) e condivisa tra tutti gli EntityManager/sessioni dell\u0027applicazione.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: l\u0027affermazione e falsa: il first-level cache e strettamente legato al singolo persistence context/sessione e vive quanto quello; e la cache di secondo livello (opzionale) a essere condivisa a livello di SessionFactory tra piu sessioni.\nLe altre opzioni: rispondere Vero e l\u0027errore classico di chi confonde la cache di primo livello con quella di secondo livello."},{"type":"code","prompt":"detached e un\u0027entita staccata con id=1. Quale valore del nome viene salvato sul DB al commit?","code":"Customer detached = ...; // detached, id=1, name=\"Anna\"\ndetached.setName(\"Mario\");\nem.getTransaction().begin();\nCustomer managed = em.merge(detached);\nmanaged.setName(\"Luigi\");\ndetached.setName(\"Peach\");\nem.getTransaction().commit();","options":["Luigi: merge restituisce un\u0027istanza managed distinta e solo le modifiche a quella vengono tracciate","Peach: detached e managed sono lo stesso oggetto","Mario: conta solo lo stato al momento della merge","Viene lanciata un\u0027eccezione per modifica concorrente"],"correct":0,"explanation":"In sintesi: `merge` copia lo stato dell\u0027entita detached in una nuova istanza managed che restituisce; il dirty checking traccia solo quella. `managed.setName(\"Luigi\")` viene quindi persistito, mentre il successivo `detached.setName(\"Peach\")` agisce su un\u0027istanza non gestita e viene ignorato. Il bug tipico e continuare a usare il riferimento originale dopo la merge.\nLe altre opzioni: detached e managed sono oggetti distinti (quindi non Peach), lo stato al momento della merge sarebbe Mario ma poi Luigi lo sovrascrive, e non c\u0027e alcun conflitto di versione."},{"type":"mcq","prompt":"Come viene mappata tipicamente una @ManyToMany bidirezionale a livello di schema del database?","code":"","options":["Con una tabella di join (join table) che contiene le due foreign key","Con una foreign key duplicata in entrambe le tabelle","Con una singola foreign key sull\u0027owning side","Con una colonna di tipo array"],"correct":0,"explanation":"In sintesi: una @ManyToMany richiede una join table intermedia con le due FK verso le tabelle collegate, perche una relazione molti-a-molti non e rappresentabile con una semplice colonna FK.\nLe altre opzioni: la singola FK e la FK duplicata descrivono relazioni to-one, e le colonne array non sono il modello relazionale standard usato da JPA per il many-to-many."},{"type":"mcq","prompt":"Qual e la differenza tra orphanRemoval = true e CascadeType.REMOVE su un @OneToMany?","code":"","options":["orphanRemoval elimina il figlio anche solo rimuovendolo dalla collezione; REMOVE cancella i figli quando si rimuove il padre","Sono sinonimi e producono lo stesso SQL","orphanRemoval agisce sull\u0027owning side, REMOVE sul lato inverso","orphanRemoval disabilita il cascade REMOVE"],"correct":0,"explanation":"In sintesi: `orphanRemoval = true` cancella il figlio quando viene sganciato dalla collezione del padre (diventa orfano), anche senza cancellare il padre; `CascadeType.REMOVE` propaga la cancellazione solo quando si rimuove il padre stesso. Il primo copre quindi anche il de-associamento, il secondo no.\nLe altre opzioni: non sono sinonimi, non si distinguono per owning/inverse side, e orphanRemoval non disabilita il cascade REMOVE: sono comportamenti complementari."},{"type":"mcq","prompt":"A cosa serve @EntityGraph in JPA?","code":"","options":["A definire dichiarativamente quali associazioni caricare EAGER per una specifica query, evitando l\u0027N+1","A creare indici sul database","A sostituire il persistence context con una cache distribuita","A forzare tutte le associazioni globalmente a LAZY"],"correct":0,"explanation":"In sintesi: `@EntityGraph` permette di specificare per singola query quale grafo di associazioni pre-caricare (fetch plan), ottenendo l\u0027effetto di un JOIN FETCH in modo dichiarativo e mitigando l\u0027N+1 senza cambiare il mapping di default.\nLe altre opzioni: non genera indici, non e una cache distribuita e non modifica globalmente le strategie di fetch: agisce a livello di singola operazione."},{"type":"truefalse","prompt":"Con FlushMode AUTO (il default), Hibernate puo eseguire un flush automatico prima di una query per garantire che questa veda le modifiche pendenti nel persistence context.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e vero: con `FlushMode.AUTO` Hibernate, prima di eseguire una query che potrebbe essere influenzata da modifiche in sospeso, effettua un flush automatico sincronizzando lo stato SQL, cosi la query restituisce dati coerenti con le modifiche non ancora committate.\nLe altre opzioni: rispondere Falso ignora questo comportamento del default AUTO, che con `FlushMode.COMMIT` sarebbe invece diverso (flush solo al commit)."},{"type":"truefalse","prompt":"Chiamare em.flush() esegue anche il commit della transazione corrente.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: e falso: `flush()` sincronizza le modifiche pendenti del persistence context con il database emettendo le istruzioni SQL, ma resta tutto dentro la transazione; senza `commit` le modifiche non sono rese definitive e un rollback le annulla comunque.\nLe altre opzioni: rispondere Vero confonde flush con commit, un errore frequente: sono due operazioni distinte."},{"type":"code","prompt":"[Stretch] La query fa JOIN FETCH di una collezione e applica setMaxResults. Qual e il comportamento reale di Hibernate?","code":"List\u003cAuthor\u003e authors = em.createQuery(\n    \"SELECT a FROM Author a JOIN FETCH a.books\", Author.class)\n    .setFirstResult(0)\n    .setMaxResults(10)\n    .getResultList();","options":["Applica la paginazione in memoria (carica tutte le righe e poi taglia), con warning HHH000104","Applica correttamente LIMIT/OFFSET in SQL sulle entita distinte","Lancia un\u0027eccezione a runtime","Ignora silenziosamente setMaxResults"],"correct":0,"explanation":"In sintesi: quando si combina JOIN FETCH di una collezione con la paginazione, Hibernate non puo tradurre `setMaxResults` in un LIMIT SQL affidabile, perche il join moltiplica le righe per elemento della collezione; percio carica l\u0027intero result set e pagina in memoria, emettendo il noto warning HHH000104. Per paginare correttamente si usa un fetch a due step o si pagina sugli id.\nLe altre opzioni: non c\u0027e un LIMIT corretto sulle entita, non viene lanciata un\u0027eccezione e setMaxResults non viene ignorato: viene applicato, ma lato applicazione."},{"type":"truefalse","prompt":"Il campo annotato con @Version deve essere incrementato manualmente dallo sviluppatore a ogni update dell\u0027entita.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: e falso: il campo `@Version` e gestito interamente dal provider, che lo confronta nel WHERE dell\u0027UPDATE e lo incrementa automaticamente a ogni modifica; incrementarlo a mano interferirebbe con il meccanismo di optimistic locking.\nLe altre opzioni: rispondere Vero e l\u0027errore di chi pensa alla version come a un campo applicativo qualunque anziche a un contatore gestito da Hibernate."},{"type":"code","prompt":"[Stretch] hashCode ed equals dell\u0027entita si basano sull\u0027id @GeneratedValue. Quale valore assume found?","code":"@Entity\nclass Tag {\n  @Id @GeneratedValue Long id;\n  @Override public int hashCode() { return Objects.hash(id); }\n  @Override public boolean equals(Object o) {\n    return (o instanceof Tag t) \u0026\u0026 Objects.equals(id, t.id);\n  }\n}\n\nSet\u003cTag\u003e set = new HashSet\u003c\u003e();\nTag t = new Tag();   // id == null\nset.add(t);\nem.persist(t);       // ora id valorizzato dal DB\nboolean found = set.contains(t);","options":["false: dopo il persist l\u0027hashCode cambia (id da null a valore) e l\u0027elemento finisce in un bucket diverso da quello di inserimento","true: HashSet ricalcola automaticamente i bucket","true: contains usa equals che confronta lo stesso riferimento","Lancia NullPointerException"],"correct":0,"explanation":"In sintesi: al momento dell\u0027`add` l\u0027id e null e l\u0027oggetto viene collocato nel bucket corrispondente a quell\u0027hash; dopo il `persist` l\u0027id cambia, quindi cambia l\u0027hashCode, ma l\u0027`HashSet` non ripartiziona gli elementi gia inseriti e `contains` cerca nel bucket sbagliato restituendo false. E esattamente il motivo per cui non si usa un id generato in hashCode.\nLe altre opzioni: l\u0027HashSet non ricalcola i bucket, `contains` usa prima l\u0027hashCode (non solo equals sul riferimento) e `Objects.hash(null)` non lancia NPE."},{"type":"code","prompt":"Il @OneToMany verso lines NON ha cascade. line e un\u0027entita nuova (transient). Cosa accade?","code":"Order order = new Order();\nOrderLine line = new OrderLine();\norder.getLines().add(line); // @OneToMany senza cascade\nem.persist(order);\nem.getTransaction().commit();","options":["Al flush viene lanciata un\u0027eccezione perche line e transient e manca il cascade PERSIST","Sia order sia line vengono inseriti correttamente","Solo order viene inserito e line viene ignorata senza errori","Solo line viene inserita"],"correct":0,"explanation":"In sintesi: persistendo `order` senza `CascadeType.PERSIST`, l\u0027operazione non si propaga a `line`, che resta transient ma e referenziata da un\u0027entita managed; al flush Hibernate lo segnala con una eccezione tipo `TransientObjectException`/`TransientPropertyValueException`. Serve il cascade oppure persistere anche la line.\nLe altre opzioni: senza cascade line non viene inserita ne silenziosamente ignorata, e non e vero che solo line venga salvata: e proprio la line transient a provocare l\u0027errore."},{"type":"code","prompt":"La relazione e @OneToMany(mappedBy=\"customer\") sul lato Customer e @ManyToOne su Order; la colonna customer_id e nullable. Viene aggiornata solo la collezione inversa. Quale valore ha customer_id nella riga order salvata?","code":"Customer c = em.find(Customer.class, 1L);\nOrder o = new Order();\nc.getOrders().add(o);   // solo lato inverso @OneToMany(mappedBy=\"customer\")\n// o.setCustomer(c) NON viene chiamato\nem.persist(o);\nem.getTransaction().commit();","options":["customer_id resta NULL: la FK dipende dall\u0027owning side (Order.customer), non dalla collezione inversa","customer_id viene valorizzato correttamente dalla collezione","Viene lanciata un\u0027eccezione di violazione di vincolo","Vengono inserite due righe order"],"correct":0,"explanation":"In sintesi: la foreign key e gestita dall\u0027owning side, cioe `Order.customer`; poiche non e stato chiamato `o.setCustomer(c)`, Hibernate ignora l\u0027aggiunta alla collezione inversa (`mappedBy`) e persiste `customer_id` a NULL. Per questo nelle relazioni bidirezionali serve un helper che sincronizzi entrambi i lati.\nLe altre opzioni: la collezione inversa non valorizza la FK, non c\u0027e violazione di vincolo perche la colonna e nullable, e non vengono inserite righe duplicate."},{"type":"code","prompt":"Cosa restituisce questa query JPQL?","code":"List\u003cObject[]\u003e rows = em.createQuery(\n    \"SELECT c.name, COUNT(o) FROM Customer c JOIN c.orders o \" +\n    \"GROUP BY c.name HAVING COUNT(o) \u003e 5\").getResultList();","options":["Una lista di Object[] con nome cliente e numero di ordini, per i clienti con piu di 5 ordini","Una lista di entita Customer gestite dal persistence context","Un errore: JPQL non supporta GROUP BY/HAVING","Una lista di Customer con la collezione orders gia inizializzata"],"correct":0,"explanation":"In sintesi: la SELECT proietta due espressioni scalari (`c.name` e `COUNT(o)`), quindi ogni riga e un `Object[]` con nome e conteggio; il JOIN sull\u0027associazione, il GROUP BY e l\u0027HAVING sono JPQL pienamente validi e filtrano i clienti con piu di 5 ordini.\nLe altre opzioni: non si ottengono entita Customer managed perche e una proiezione, JPQL supporta GROUP BY/HAVING, e non c\u0027e alcun fetch della collezione."},{"type":"mcq","prompt":"[Stretch] In un\u0027app Spring a layer ottieni LazyInitializationException nel layer di presentazione (es. serializzazione JSON). Qual e la soluzione architetturalmente piu corretta?","code":"","options":["Caricare i dati necessari dentro la transazione (JOIN FETCH/@EntityGraph/DTO) prima di uscire dal service","Rendere tutte le associazioni EAGER","Aumentare il timeout della transazione","Affidarsi a Open Session In View come pratica di default in produzione"],"correct":0,"explanation":"In sintesi: la soluzione pulita e definire esplicitamente cosa serve e caricarlo entro i confini transazionali del service, con JOIN FETCH, `@EntityGraph` o mappando su DTO, cosi il layer di presentazione riceve dati gia inizializzati e non tocca proxy LAZY.\nLe altre opzioni: EAGER globale genera over-fetch e N+1, il timeout non c\u0027entra con la sessione chiusa, e Open Session In View e generalmente considerato un anti-pattern in produzione perche tiene la sessione aperta fino alla view e nasconde le query."},{"type":"mcq","prompt":"A cosa serve la proprieta hibernate.default_batch_fetch_size (o l\u0027annotazione @BatchSize)?","code":"","options":["A caricare le associazioni LAZY di piu entita in poche query con IN (...), mitigando l\u0027N+1","A limitare il numero di righe restituite da ogni query","A definire la dimensione del connection pool","A impostare la paginazione di default delle query JPQL"],"correct":0,"explanation":"In sintesi: il batch fetching raggruppa l\u0027inizializzazione di piu proxy/collezioni LAZY in poche query che usano una clausola `IN (...)`, riducendo drasticamente il numero di round-trip rispetto al caricamento uno-per-uno: e un rimedio complementare a JOIN FETCH ed `@EntityGraph` contro l\u0027N+1.\nLe altre opzioni: non limita le righe di una query, non dimensiona il pool e non definisce la paginazione: agisce sul modo in cui vengono inizializzate le associazioni pigre."}]},{"id":"rest","title":"REST \u0026 Web Services / API design","questions":[{"type":"truefalse","prompt":"In un\u0027architettura REST il server deve mantenere lo stato di sessione del client tra una richiesta e l\u0027altra.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: uno dei vincoli fondanti di REST è lo statelessness: ogni richiesta è autosufficiente e trasporta tutto il contesto necessario (credenziali, parametri), quindi il server non conserva stato di sessione tra chiamate. Questo abilita scalabilità orizzontale e load balancing perché qualsiasi nodo può servire qualsiasi richiesta.\nLe altre opzioni: l\u0027affermazione è falsa perché conservare la sessione lato server viola lo statelessness; lo stato applicativo vive sul client (es. il token), lo stato delle risorse nel database. L\u0027errore tipico è confondere sessione HTTP e persistenza dei dati."},{"type":"mcq","prompt":"In REST, qual è la relazione corretta tra risorsa e rappresentazione?","code":"","options":["La risorsa è il JSON restituito; la rappresentazione è l\u0027oggetto Java sul server","La risorsa è un concetto/entità identificato da un URI; la rappresentazione è una sua forma concreta serializzata (es. JSON, XML)","Risorsa e rappresentazione sono sinonimi: entrambe indicano il payload della risposta","La rappresentazione è l\u0027URI; la risorsa è l\u0027insieme dei metodi HTTP disponibili"],"correct":1,"explanation":"In sintesi: la risorsa è l\u0027entità astratta identificata da un URI (es. l\u0027utente 42), mentre la rappresentazione è una sua forma concreta e serializzata scambiata sul filo, tipicamente `application/json`. La stessa risorsa può avere più rappresentazioni (JSON, XML) negoziate via content negotiation.\nLe altre opzioni: confondere risorsa e payload JSON, trattarle come sinonimi o invertirle con l\u0027URI sono errori concettuali; l\u0027URI identifica, non rappresenta, e i metodi HTTP definiscono le operazioni, non la risorsa."},{"type":"mcq","prompt":"Cosa intende REST con \u0027uniform interface\u0027 (interfaccia uniforme)?","code":"","options":["Tutti gli endpoint devono usare lo stesso metodo HTTP","Un insieme uniforme di vincoli: identificazione delle risorse via URI, manipolazione tramite rappresentazioni, messaggi self-descriptive e uso dei metodi HTTP standard","Le risposte devono avere sempre lo stesso Content-Type","L\u0027interfaccia utente del client deve essere identica su tutti i dispositivi"],"correct":1,"explanation":"In sintesi: l\u0027uniform interface è il vincolo che dà a REST la sua uniformità: risorse identificate da URI, manipolazione tramite rappresentazioni, messaggi self-descriptive (metodo, header, media type parlano da soli) e, opzionalmente, HATEOAS. È ciò che rende l\u0027API prevedibile e disaccoppia client e server.\nLe altre opzioni: non riguarda usare un solo metodo HTTP né un unico Content-Type (anzi la content negotiation è prevista), e non ha nulla a che vedere con la UI del client, che è un fraintendimento del termine \u0027interface\u0027."},{"type":"mcq","prompt":"Cosa aggiunge HATEOAS a una risposta REST?","code":"","options":["La compressione gzip del payload","Link ipermediali che descrivono le transizioni di stato e le azioni disponibili sulla risorsa, così il client naviga senza URL hard-coded","La firma digitale del payload per garantirne l\u0027integrità","Un header di versione per il controllo di compatibilità"],"correct":1,"explanation":"In sintesi: HATEOAS (Hypermedia As The Engine Of Application State) è il livello più maturo di REST: la risposta include link ipermediali (es. campi `_links` con rel e href) che indicano al client quali transizioni di stato può compiere, riducendo l\u0027accoppiamento e la necessità di URL cablati nel codice.\nLe altre opzioni: gzip è compressione a livello di trasporto, la firma riguarda l\u0027integrità/sicurezza e l\u0027header di versione è versioning: nessuna descrive gli hyperlink che guidano la navigazione dell\u0027applicazione."},{"type":"mcq","prompt":"Quale metodo HTTP è semanticamente corretto per creare una nuova risorsa il cui identificativo è generato dal server?","code":"","options":["GET","POST","PUT","HEAD"],"correct":1,"explanation":"In sintesi: `POST` è il metodo giusto quando si crea una risorsa subordinata a una collection e l\u0027id lo assegna il server; si fa `POST /orders` e la risposta è `201 Created` con header `Location`. `PUT` si usa invece quando è il client a conoscere in anticipo l\u0027URI finale della risorsa.\nLe altre opzioni: `GET` e `HEAD` sono safe e non modificano lo stato, quindi non creano nulla; `PUT` crea/sostituisce a un URI noto, non è il caso di id generato dal server."},{"type":"truefalse","prompt":"Il metodo GET è considerato \u0027safe\u0027 perché non deve produrre effetti collaterali osservabili sullo stato del server.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: `GET` è un metodo safe: la sua semantica è di sola lettura e non deve modificare lo stato osservabile della risorsa. Questo permette a proxy, browser e crawler di ripetere e mettere in cache le GET senza rischio di effetti collaterali.\nLe altre opzioni: l\u0027affermazione è vera; l\u0027errore tipico è nascondere operazioni di scrittura dietro una GET (es. `GET /deleteUser?id=5`), che viola il contratto safe e può causare cancellazioni involontarie da parte di crawler o prefetch."},{"type":"mcq","prompt":"Quale gruppo di metodi HTTP è idempotente?","code":"","options":["GET, POST, DELETE","GET, PUT, DELETE","POST, PATCH, PUT","POST, PUT, DELETE"],"correct":1,"explanation":"In sintesi: `GET`, `PUT` e `DELETE` sono idempotenti: ripetere la stessa richiesta N volte lascia il server nello stesso stato di una singola esecuzione. Idempotente non significa \u0027stessa risposta\u0027, ma \u0027stesso effetto sullo stato\u0027: un secondo `DELETE` può dare `404`, ma la risorsa resta cancellata.\nLe altre opzioni: tutte includono `POST`, che non è idempotente (ogni chiamata crea una nuova risorsa); `PATCH` in generale non è garantito idempotente, quindi va escluso dai gruppi che lo contengono."},{"type":"truefalse","prompt":"Ripetere due volte la stessa richiesta POST per creare una risorsa produce sempre lo stesso identico risultato di una singola richiesta (idempotenza).","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: `POST` non è idempotente: due `POST` identici su una collection tipicamente creano due risorse distinte con id diversi. Per proteggersi da doppie sottomissioni (es. click doppio in un flusso di pagamento) si usano idempotency key o si sposta la logica su `PUT` con URI noto.\nLe altre opzioni: l\u0027affermazione è falsa; l\u0027errore tipico è assumere che il retry di un `POST` sia sicuro, mentre in ambito bancario può generare pagamenti o ordini duplicati."},{"type":"mcq","prompt":"Un DELETE che rimuove con successo una risorsa e non restituisce alcun corpo nella risposta dovrebbe usare quale status code?","code":"","options":["200 OK","201 Created","204 No Content","404 Not Found"],"correct":2,"explanation":"In sintesi: `204 No Content` è la scelta corretta quando l\u0027operazione riesce ma non c\u0027è nulla da restituire nel body, caso tipico di un `DELETE` andato a buon fine. Comunica successo senza payload.\nLe altre opzioni: `200 OK` è appropriato se si restituisce un corpo (es. la risorsa cancellata o un messaggio); `201 Created` è per la creazione; `404` indica che la risorsa non esisteva, non un successo."},{"type":"code","prompt":"Quale status code e header ci si aspetta da questo endpoint Spring dopo una creazione riuscita?","code":"@PostMapping(\"/orders\")\npublic ResponseEntity\u003cOrder\u003e create(@RequestBody Order o) {\n    Order saved = repository.save(o);\n    URI location = URI.create(\"/orders/\" + saved.getId());\n    return ResponseEntity.created(location).body(saved);\n}","options":["200 OK senza header Location","201 Created con header Location che punta alla nuova risorsa","204 No Content con corpo vuoto","202 Accepted con header Retry-After"],"correct":1,"explanation":"In sintesi: `ResponseEntity.created(location)` imposta lo status `201 Created` e valorizza l\u0027header `Location` con l\u0027URI passato, mentre `.body(saved)` include la rappresentazione della risorsa creata: è il pattern canonico per una creazione REST.\nLe altre opzioni: `200` senza `Location` ignora il metodo `created()`; `204` implicherebbe corpo vuoto ma qui c\u0027è `.body(saved)`; `202 Accepted` con `Retry-After` è per elaborazioni asincrone, non per una creazione già completata."},{"type":"mcq","prompt":"Un client invia un JSON sintatticamente malformato nel body di un POST. Quale status code è più appropriato?","code":"","options":["400 Bad Request","401 Unauthorized","403 Forbidden","422 Unprocessable Entity"],"correct":0,"explanation":"In sintesi: `400 Bad Request` è corretto quando la richiesta è malformata a livello sintattico e il server non riesce nemmeno a interpretarla, come un JSON con parentesi non bilanciate. Il problema è nella forma del messaggio, non nell\u0027autorizzazione.\nLe altre opzioni: `401` e `403` riguardano autenticazione e permessi, non la sintassi; `422` si usa quando il JSON è ben formato ma semanticamente invalido (es. validazione di business fallita), non quando è illeggibile."},{"type":"mcq","prompt":"Un utente correttamente autenticato prova ad accedere a una risorsa per cui non ha i permessi. Cosa restituire?","code":"","options":["401 Unauthorized","403 Forbidden","404 Not Found","400 Bad Request"],"correct":1,"explanation":"In sintesi: `403 Forbidden` è corretto quando l\u0027identità è nota e valida ma non ha i privilegi per l\u0027operazione: l\u0027autenticazione è passata, manca l\u0027autorizzazione. Il server ha capito chi sei e dice esplicitamente che non puoi.\nLe altre opzioni: `401` significa \u0027non autenticato\u0027 o credenziali mancanti/invalide (e implica un header `WWW-Authenticate`); `404` si usa a volte per non rivelare l\u0027esistenza della risorsa, ma non è la risposta canonica; `400` riguarda la forma della richiesta."},{"type":"mcq","prompt":"Un PUT fallisce perché lo stato attuale della risorsa è in conflitto con l\u0027operazione (es. si aggiorna una versione ormai obsoleta). Quale status code usare?","code":"","options":["400 Bad Request","409 Conflict","422 Unprocessable Entity","500 Internal Server Error"],"correct":1,"explanation":"In sintesi: `409 Conflict` è il codice giusto quando la richiesta collide con lo stato corrente della risorsa, tipico dell\u0027optimistic locking: il client ha una versione superata e l\u0027aggiornamento entrerebbe in conflitto. Segnala che il client può risolvere e ritentare.\nLe altre opzioni: `400` è sintattico; `422` è per payload semanticamente invalido ma senza conflitto di stato; `500` è un errore lato server, mentre qui il problema è una condizione di concorrenza gestibile dal client."},{"type":"truefalse","prompt":"Il codice 422 Unprocessable Entity indica una richiesta sintatticamente valida ma semanticamente errata, per esempio una validazione di business fallita.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: `422 Unprocessable Entity` è pensato proprio per questo: il body è ben formato e comprensibile (es. JSON valido), ma non supera le regole semantiche o di dominio, come un IBAN formalmente corretto ma non valido per il paese indicato.\nLe altre opzioni: l\u0027affermazione è vera; l\u0027errore tipico è usare `400` per ogni errore di validazione, mentre `400` è per messaggi malformati e `422` distingue il caso \u0027ti ho capito ma non posso elaborarlo\u0027."},{"type":"mcq","prompt":"Il database è temporaneamente irraggiungibile e prevedi che il servizio tornerà disponibile a breve. Quale status code è più corretto restituire al client?","code":"","options":["500 Internal Server Error","502 Bad Gateway","503 Service Unavailable","504 Gateway Timeout"],"correct":2,"explanation":"In sintesi: `503 Service Unavailable` comunica una indisponibilità temporanea del servizio (sovraccarico o dipendenza giù) e può accompagnarsi a un header `Retry-After` per suggerire quando ritentare. È l\u0027informazione più onesta e utile in questo scenario.\nLe altre opzioni: `500` è un errore generico e non transitorio, che non invita al retry; `502` e `504` riguardano specificamente un gateway/proxy che riceve una risposta invalida o va in timeout verso l\u0027upstream, non il caso di una dipendenza temporaneamente giù."},{"type":"mcq","prompt":"Quale URI segue meglio le convenzioni REST per ottenere l\u0027utente con id 42?","code":"","options":["GET /getUser?id=42","GET /users/42","GET /user/getById/42","POST /users/42/get"],"correct":1,"explanation":"In sintesi: `GET /users/42` è idiomatico: nome della collection al plurale, id come segmento di path e verbo espresso dal metodo HTTP, non dall\u0027URI. È leggibile, gerarchico e coerente con l\u0027uniform interface.\nLe altre opzioni: `getUser`, `getById` e `/get` mettono il verbo nell\u0027URI, cosa che REST demanda al metodo HTTP; inoltre usare `POST` per una lettura viola la semantica safe/idempotente del `GET`."},{"type":"mcq","prompt":"Quale URI rappresenta correttamente gli ordini appartenenti all\u0027utente 42?","code":"","options":["GET /orders/users/42","GET /users/42/orders","GET /users/orders/42","GET /getOrdersByUser/42"],"correct":1,"explanation":"In sintesi: `GET /users/42/orders` esprime correttamente il nesting: la sotto-risorsa orders è annidata sotto la risorsa padre users/42, riflettendo la relazione di appartenenza nella gerarchia dell\u0027URI.\nLe altre opzioni: `/orders/users/42` inverte la gerarchia; `/users/orders/42` mette 42 nel posto sbagliato (sembra l\u0027id di un ordine); `/getOrdersByUser/42` reintroduce un verbo nell\u0027URI, da evitare in REST."},{"type":"truefalse","prompt":"In un buon design REST gli URI dovrebbero contenere verbi come /createUser o /deleteOrder per esprimere l\u0027azione da compiere.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: gli URI devono identificare risorse (sostantivi, tipicamente al plurale), mentre l\u0027azione è espressa dal metodo HTTP: si crea con `POST /users` e si cancella con `DELETE /orders/9`, non con `/createUser` o `/deleteOrder`. Questo tiene l\u0027interfaccia uniforme e prevedibile.\nLe altre opzioni: l\u0027affermazione è falsa; l\u0027errore tipico è modellare l\u0027API come RPC mettendo i verbi nel path, duplicando la semantica che HTTP già fornisce con i suoi metodi."},{"type":"mcq","prompt":"Quale affermazione descrive correttamente una differenza tra REST e SOAP?","code":"","options":["SOAP è un protocollo con contratto formale (WSDL) e messaggi XML tipizzati; REST è uno stile architetturale che sfrutta HTTP e vari formati, tipicamente JSON","REST usa obbligatoriamente XML, mentre SOAP usa JSON","SOAP funziona solo su HTTP mentre REST può usare qualsiasi protocollo di trasporto","REST prevede un contratto WSDL, mentre SOAP non ne ha uno"],"correct":0,"explanation":"In sintesi: SOAP è un protocollo rigoroso con contratto formale WSDL, envelope e messaggi XML tipizzati, con standard WS-* per sicurezza e transazioni; REST è invece uno stile architetturale che si appoggia alla semantica di HTTP e usa formati flessibili, in pratica quasi sempre JSON.\nLe altre opzioni: REST non impone XML; è SOAP a essere legato all\u0027XML, non a JSON; ed è SOAP (non REST) a poter viaggiare su più trasporti come SMTP, mentre il WSDL appartiene a SOAP, non a REST."},{"type":"mcq","prompt":"Quale header HTTP usa il client per indicare in quale formato desidera ricevere la rappresentazione della risorsa?","code":"","options":["Content-Type","Accept","Content-Encoding","Allow"],"correct":1,"explanation":"In sintesi: l\u0027header `Accept` è quello con cui il client dichiara i media type che è disposto a ricevere (es. `Accept: application/json`), guidando la content negotiation lato server sulla rappresentazione della risposta.\nLe altre opzioni: `Content-Type` descrive il formato del corpo effettivamente inviato (in richiesta o risposta), non ciò che si desidera; `Content-Encoding` riguarda la compressione; `Allow` elenca i metodi HTTP supportati da una risorsa."},{"type":"code","prompt":"Il client invia questa richiesta. Cosa comunica esattamente l\u0027header Content-Type?","code":"POST /users HTTP/1.1\nHost: api.bank.com\nAccept: application/json\nContent-Type: application/json\n\n{ \"name\": \"Mario\", \"iban\": \"IT60...\" }","options":["Che il client vuole ricevere la risposta in formato JSON","Che il body della richiesta inviato dal client è in formato JSON","Che il server deve rispondere con status 200","Che la risorsa users accetta solo XML"],"correct":1,"explanation":"In sintesi: `Content-Type` descrive il formato del payload effettivamente presente nel messaggio, quindi qui dichiara che il body inviato dal client è `application/json`. È l\u0027informazione che il server usa per scegliere il parser corretto.\nLe altre opzioni: la preferenza sul formato della risposta è espressa da `Accept`, non da `Content-Type`; l\u0027header non impone alcuno status code; e non limita la risorsa all\u0027XML, anzi qui si sta inviando JSON."},{"type":"mcq","prompt":"Qual è la differenza corretta tra PUT e PATCH?","code":"","options":["PUT applica una modifica parziale, PATCH sostituisce l\u0027intera risorsa","PUT sostituisce l\u0027intera rappresentazione della risorsa, PATCH applica una modifica parziale","PUT non è idempotente, PATCH lo è sempre","PUT crea sempre una nuova risorsa, PATCH la elimina"],"correct":1,"explanation":"In sintesi: `PUT` sostituisce l\u0027intera rappresentazione della risorsa all\u0027URI indicato (i campi omessi vengono azzerati/sovrascritti), mentre `PATCH` applica una modifica parziale toccando solo i campi specificati. `PUT` è idempotente per definizione; `PATCH` in generale non lo è.\nLe altre opzioni: la prima inverte i due metodi; la terza sbaglia l\u0027idempotenza (è `PUT` a esserlo, non `PATCH` sempre); la quarta confonde `PUT` con un delete e ne travisa la semantica."},{"type":"code","prompt":"La risorsa vale { \"name\": \"Mario\", \"email\": \"m@x.it\", \"active\": true }. Il client invia questo JSON Merge Patch (RFC 7386). Qual è lo stato risultante della risorsa?","code":"PATCH /users/42 HTTP/1.1\nContent-Type: application/merge-patch+json\n\n{ \"email\": \"mario@bank.it\", \"active\": null }","options":["{ \"email\": \"mario@bank.it\", \"active\": null } — gli altri campi vengono persi","{ \"name\": \"Mario\", \"email\": \"mario@bank.it\" } — email aggiornata, active rimosso, name invariato","{ \"name\": \"Mario\", \"email\": \"mario@bank.it\", \"active\": true } — il null viene ignorato","{ \"name\": \"Mario\", \"email\": \"m@x.it\", \"active\": true } — il PATCH non modifica nulla"],"correct":1,"explanation":"In sintesi: nel JSON Merge Patch un campo presente aggiorna il valore, un campo assente resta invariato e un campo posto a `null` viene rimosso dalla risorsa. Quindi `email` diventa `mario@bank.it`, `active` viene eliminato per via del `null` e `name` resta `Mario`.\nLe altre opzioni: la prima confonde il merge patch con una sostituzione totale (comportamento da `PUT`); la terza ignora la semantica del `null` che invece cancella; la quarta nega qualsiasi effetto, sbagliato per un merge patch valido."},{"type":"mcq","prompt":"Quale di questi è un approccio comune e valido per il versioning di un\u0027API REST?","code":"","options":["Cambiare la porta TCP a ogni nuova versione","Versionare nel path (es. /v1/users) oppure tramite header (Accept con un media type versionato)","Aggiungere un timestamp casuale a ogni endpoint","Usare un metodo HTTP diverso per ogni versione"],"correct":1,"explanation":"In sintesi: le strategie diffuse e valide sono il versioning nel path (`/v1/users`), semplice e visibile, oppure la negoziazione via header con un media type versionato (`Accept: application/vnd.bank.v2+json`), più aderente ai principi REST. La scelta bilancia semplicità e pulizia dell\u0027URI.\nLe altre opzioni: cambiare porta, aggiungere timestamp casuali o assegnare un metodo HTTP a ogni versione non sono pratiche riconosciute e romperebbero la semantica di HTTP e la stabilità degli URI."},{"type":"mcq","prompt":"Quale coppia di parametri implementa una paginazione offset-based classica?","code":"","options":["?sort=name\u0026order=asc","?page=2\u0026size=20 (oppure ?limit=20\u0026offset=20)","?filter=active\u0026fields=id","?expand=orders\u0026depth=2"],"correct":1,"explanation":"In sintesi: la paginazione offset-based si esprime con `page`/`size` o equivalentemente `limit`/`offset`, dove il client indica quanti elementi vuole e da quale posizione partire. È semplice ma può soffrire su dataset grandi o molto dinamici, dove si preferisce la cursor-based (keyset).\nLe altre opzioni: `sort`/`order` riguardano l\u0027ordinamento; `filter`/`fields` filtrano e selezionano campi (sparse fieldsets); `expand`/`depth` gestiscono l\u0027espansione di risorse correlate: nessuna è paginazione."},{"type":"mcq","prompt":"Qual è la buona pratica per il payload di errore di un\u0027API REST?","code":"","options":["Restituire sempre 200 con un flag success:false nel body","Usare lo status HTTP appropriato e un body strutturato con dettagli (codice, messaggio, campi), idealmente secondo lo standard Problem Details (RFC 9457, che aggiorna RFC 7807)","Restituire al client solo lo stack trace completo dell\u0027eccezione","Restituire un body vuoto lasciando al client il compito di interpretare l\u0027errore"],"correct":1,"explanation":"In sintesi: l\u0027errore va segnalato con lo status HTTP corretto (4xx/5xx) e un body machine-readable e coerente, con campi come codice, messaggio ed eventuali dettagli sui campi; lo standard di riferimento è Problem Details, definito da RFC 9457 (che aggiorna e sostituisce RFC 7807), con media type `application/problem+json`. Così il client può gestire l\u0027errore in modo programmabile.\nLe altre opzioni: rispondere sempre `200` con un flag di errore è un anti-pattern che rompe la semantica HTTP; restituire lo stack trace espone dettagli interni ed è un rischio di sicurezza; un body vuoto non dà informazioni utili."},{"type":"mcq","prompt":"Come si presenta tipicamente un token JWT in una richiesta HTTP verso un\u0027API stateless?","code":"","options":["Come cookie di sessione gestito lato server","Nell\u0027header Authorization: Bearer \u003ctoken\u003e","Come parametro obbligatorio nel path, es. /token/\u003cjwt\u003e/users","Nell\u0027header Content-Type"],"correct":1,"explanation":"In sintesi: il pattern standard è l\u0027header `Authorization: Bearer \u003ctoken\u003e`, dove il JWT viaggia come credenziale bearer a ogni richiesta, coerente con l\u0027autenticazione stateless. Il server valida la firma senza mantenere sessione.\nLe altre opzioni: un cookie di sessione lato server implicherebbe stato server, contrario allo statelessness; mettere il token nel path lo espone in log e cronologia ed è insicuro; `Content-Type` descrive il formato del body, non l\u0027autenticazione."},{"type":"truefalse","prompt":"Un JWT firmato è auto-contenuto: il server può validarlo verificando la firma senza consultare una sessione lato server, il che è coerente con lo statelessness di REST.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero, il JWT trasporta i claim nel payload e la sua integrità è garantita dalla firma; il server può validarlo con la chiave (segreto HMAC o chiave pubblica) senza guardare uno store di sessione, il che si sposa con l\u0027autenticazione stateless.\nLe altre opzioni: l\u0027affermazione è vera, ma va ricordato il rovescio della medaglia: la revoca è più difficile perché un JWT valido resta valido fino alla scadenza, per questo si usano scadenze brevi, refresh token o blacklist mirate."},{"type":"mcq","prompt":"A cosa serve CORS (Cross-Origin Resource Sharing)?","code":"","options":["A cifrare il traffico tra client e server","A permettere, tramite header di risposta del server, che un browser consenta a una pagina di un\u0027origine diversa di chiamare l\u0027API, rilassando in modo controllato la same-origin policy","A comprimere le risposte per ridurre la banda","A bilanciare il carico tra più server backend"],"correct":1,"explanation":"In sintesi: CORS è un meccanismo del browser che, tramite header come `Access-Control-Allow-Origin` inviati dal server, rilassa in modo controllato la same-origin policy, permettendo a una pagina di un\u0027origine diversa di consumare l\u0027API. È una decisione che sta al server, applicata dal browser.\nLe altre opzioni: la cifratura è compito di TLS/HTTPS; la compressione è `Content-Encoding`/gzip; il bilanciamento del carico è responsabilità dell\u0027infrastruttura, non di CORS."},{"type":"mcq","prompt":"Quando un browser invia una richiesta di preflight CORS con il metodo OPTIONS?","code":"","options":["Sempre, prima di ogni richiesta GET semplice","Prima di richieste \u0027non semplici\u0027 (es. metodi come PUT/DELETE, o header custom, o Content-Type application/json), per verificare i permessi tramite gli header Access-Control-Allow-*","Solo quando il server ha già risposto con 403","Solo per richieste effettuate su HTTP non cifrato"],"correct":1,"explanation":"In sintesi: il browser antepone un preflight `OPTIONS` alle richieste \u0027non semplici\u0027, cioè quelle che usano metodi come `PUT`/`DELETE`, header custom (es. `Authorization` impostato manualmente) o un `Content-Type` come `application/json`; con esso verifica in anticipo, via `Access-Control-Allow-Methods/Headers/Origin`, che l\u0027operazione sia permessa.\nLe altre opzioni: le richieste \u0027semplici\u0027 (GET/HEAD/POST con header e content-type basilari) non fanno preflight; il preflight non dipende da una precedente risposta `403` né dall\u0027uso di HTTP in chiaro."},{"type":"mcq","prompt":"A cosa serve l\u0027header ETag in una risposta HTTP?","code":"","options":["A indicare la lingua della rappresentazione","A fornire un identificatore di versione della rappresentazione, usato dal client con If-None-Match per il caching condizionale","A specificare la dimensione in byte del corpo","A firmare crittograficamente la risorsa"],"correct":1,"explanation":"In sintesi: l\u0027`ETag` è un identificatore opaco della versione corrente della rappresentazione; il client lo conserva e lo rimanda con `If-None-Match` (per il caching) o `If-Match` (per aggiornamenti condizionali/optimistic locking), evitando trasferimenti inutili o sovrascritture concorrenti.\nLe altre opzioni: la lingua è `Content-Language`, la dimensione è `Content-Length`, e l\u0027ETag non è una firma crittografica ma un semplice token di versione (spesso un hash del contenuto)."},{"type":"code","prompt":"Il client aveva ricevuto una risorsa con ETag \"abc123\". Invia questa richiesta e nel frattempo la risorsa non è cambiata. Cosa risponde correttamente il server?","code":"GET /accounts/42 HTTP/1.1\nHost: api.bank.com\nIf-None-Match: \"abc123\"","options":["200 OK ripetendo l\u0027intera rappresentazione nel body","304 Not Modified senza body, così il client riusa la copia in cache","412 Precondition Failed","204 No Content"],"correct":1,"explanation":"In sintesi: con `If-None-Match` su una `GET`, se l\u0027ETag corrente coincide con quello del client la risorsa non è cambiata e il server risponde `304 Not Modified` senza body, permettendo di riusare la copia in cache e risparmiare banda.\nLe altre opzioni: `200` co
