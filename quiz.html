 base a cio che e presente nel classpath e ai bean gia definiti, valutando condizioni come @ConditionalOnClass e @ConditionalOnMissingBean","Genera il codice sorgente delle classi di configurazione durante la compilazione","Sostituisce sempre i bean definiti dall\u0027utente con quelli di default forniti da Spring","Richiede di elencare manualmente ogni classe di auto-configurazione dentro @SpringBootApplication"],"correct":0,"explanation":"In sintesi: l\u0027auto-configuration attiva classi di configurazione condizionali, dichiarate negli starter (oggi nei file `META-INF/spring/...AutoConfiguration.imports`), che si applicano solo se certe condizioni sono soddisfatte: presenza di una classe nel classpath con `@ConditionalOnClass`, assenza di un bean gia definito con `@ConditionalOnMissingBean`, proprieta impostate, e cosi via.\nLe altre opzioni: non c\u0027e generazione di sorgente a compile-time; non sovrascrive i bean dell\u0027utente, anzi grazie a `@ConditionalOnMissingBean` i tuoi bean hanno la precedenza; e non devi elencare a mano le auto-configurazioni."},{"type":"truefalse","prompt":"Uno starter come spring-boot-starter-web e essenzialmente un insieme coordinato di dipendenze (una sorta di aggregatore), non un modulo che contiene logica di business.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: l\u0027affermazione e vera. Uno starter come `spring-boot-starter-web` e un artifact quasi privo di codice il cui scopo e dichiarare, con versioni gia allineate tra loro, il set di dipendenze necessarie per un certo ambito. Aggiungendone uno solo si portano transitivamente tutte le librerie coordinate, evitando conflitti di versione.\nLe altre opzioni: dire Falso e l\u0027errore tipico, cioe pensare che lo starter contenga la logica applicativa; quella risiede nelle librerie sottostanti e nell\u0027auto-configuration, non nello starter in se."},{"type":"mcq","prompt":"Quale affermazione sui profili e sui file di properties per profilo e corretta?","code":"","options":["application-{profile}.properties viene caricato solo quando quel profilo e attivo e le sue proprieta sovrascrivono quelle di application.properties","I file per profilo vengono sempre caricati tutti insieme, indipendentemente dal profilo attivo","Un bean annotato @Profile(\"prod\") viene comunque creato anche se il profilo prod non e attivo","I profili possono essere definiti solo tramite application.yml, non tramite file .properties"],"correct":0,"explanation":"In sintesi: `application-{profile}.properties` viene caricato solo quando quel profilo e attivo, e i suoi valori hanno precedenza su `application.properties`, che funge da base comune. E il meccanismo standard per differenziare la configurazione tra ambienti.\nLe altre opzioni: non vengono caricati tutti i file per profilo insieme, solo quelli dei profili attivi; un bean `@Profile(\"prod\")` viene registrato esclusivamente se `prod` e attivo; e i profili funzionano identicamente con `.properties` e `.yml`, non solo con YAML."},{"type":"mcq","prompt":"Qual e la differenza tra @RestController e @Controller?","code":"","options":["@RestController equivale a @Controller + @ResponseBody: i valori restituiti dai metodi vengono serializzati nel body della risposta invece di essere interpretati come nomi di view","@RestController serve solo per endpoint che ritornano XML, mentre @Controller solo per HTML","@Controller non puo gestire richieste HTTP: serve solo per registrare bean interni","Non c\u0027e alcuna differenza, sono semplici sinonimi"],"correct":0,"explanation":"In sintesi: `@RestController` equivale a `@Controller` piu `@ResponseBody`: ogni valore restituito dai metodi viene passato agli `HttpMessageConverter` e scritto nel body della risposta, tipicamente come JSON, invece di essere interpretato come nome logico di view. `@Controller` da solo interpreta le `String` restituite come nomi di view da risolvere.\nLe altre opzioni: la distinzione non e XML vs HTML (il formato dipende dai converter e dalla content negotiation); `@Controller` gestisce eccome le richieste HTTP; e le due annotazioni non sono sinonimi."},{"type":"code","prompt":"Cosa rappresenta il valore \"greeting\" restituito da questo metodo?","code":"@Controller\npublic class HomeController {\n\n    @GetMapping(\"/hello\")\n    public String hello() {\n        return \"greeting\";\n    }\n}","options":["Il nome logico di una view, che il ViewResolver risolvera in un template (es. greeting.html)","Il corpo della risposta HTTP, ossia il testo \"greeting\" inviato al client","Un redirect verso l\u0027URL /greeting","Il nome del bean da restituire come body della risposta"],"correct":0,"explanation":"In sintesi: con `@Controller` e senza `@ResponseBody`, la `String` restituita da un handler e interpretata come nome logico di view e passata al `ViewResolver`, che la mappa su un template come `greeting.html`. Non e il contenuto della risposta, ma un riferimento simbolico alla vista.\nLe altre opzioni: per restituire il testo \"greeting\" nel body servirebbe `@ResponseBody` o `@RestController`; non e un redirect, che richiederebbe il prefisso `redirect:`; e non e un nome di bean."},{"type":"code","prompt":"Con la richiesta GET /users/42?full=true, quale stringa viene restituita?","code":"@GetMapping(\"/users/{id}\")\npublic String get(@PathVariable Long id,\n                  @RequestParam(defaultValue = \"false\") boolean full) {\n    return id + \"-\" + full;\n}","options":["\"42-true\"","\"42-false\"","\"null-true\"","Errore 400 perche full non e presente nel path"],"correct":0,"explanation":"In sintesi: viene restituita \"42-true\". `@PathVariable` lega `id` al segmento `{id}` dell\u0027URL, quindi `id` vale 42; `@RequestParam` lega `full` al parametro di query `full=true`, quindi `full` e true. La concatenazione produce \"42-true\".\nLe altre opzioni: il `defaultValue = \"false\"` si applicherebbe solo se `full` mancasse dalla query, ma qui e presente; `full` non deve stare nel path, quindi nessun errore 400; e `id` non e null perche il path lo valorizza."},{"type":"mcq","prompt":"Cosa fa @RequestBody su un parametro di un metodo handler?","code":"","options":["Deserializza il corpo della richiesta (es. JSON) in un oggetto Java tramite un HttpMessageConverter","Legge un singolo parametro dalla query string dell\u0027URL","Estrae un segmento variabile dal path dell\u0027URL","Imposta il corpo della risposta HTTP che verra inviata al client"],"correct":0,"explanation":"In sintesi: `@RequestBody` dice a Spring di prendere il corpo della richiesta in ingresso, per esempio un JSON, e deserializzarlo nell\u0027oggetto del parametro usando l\u0027`HttpMessageConverter` appropriato, tipicamente Jackson. Riguarda l\u0027input della richiesta.\nLe altre opzioni: leggere dalla query string e compito di `@RequestParam`; estrarre un segmento del path e compito di `@PathVariable`; e impostare il corpo della risposta e cio che fa `@ResponseBody`, sul lato output, non `@RequestBody`."},{"type":"code","prompt":"In caso di successo, quale status HTTP restituisce questo metodo?","code":"@PostMapping(\"/orders\")\npublic ResponseEntity\u003cOrder\u003e create(@RequestBody Order o) {\n    Order saved = service.save(o);\n    return ResponseEntity.status(HttpStatus.CREATED).body(saved);\n}","options":["201 Created","200 OK","204 No Content","202 Accepted"],"correct":0,"explanation":"In sintesi: lo status e 201 Created. `ResponseEntity.status(HttpStatus.CREATED)` imposta esplicitamente il codice a 201, che e quello appropriato per un POST che crea una risorsa, e `body(saved)` inserisce la risorsa creata nel corpo della risposta.\nLe altre opzioni: 200 sarebbe il default di un ritorno diretto senza `ResponseEntity`; 204 si usa quando non c\u0027e body; 202 indica una richiesta accettata ma non ancora processata. Qui lo status e quello dichiarato esplicitamente, 201."},{"type":"mcq","prompt":"Un metodo di un @RestController che ritorna direttamente un oggetto (non un ResponseEntity) e non lancia eccezioni, quale status HTTP produce di default?","code":"","options":["200 OK","201 Created","204 No Content","Nessuno status: lo decide il client"],"correct":0,"explanation":"In sintesi: in assenza di `ResponseEntity`, di `@ResponseStatus` o di eccezioni, Spring MVC risponde con lo status di default 200 OK e serializza l\u0027oggetto restituito nel body. E il comportamento standard per un handler che ritorna direttamente un oggetto.\nLe altre opzioni: 201 va impostato esplicitamente, tipicamente per le creazioni; 204 si usa quando non si restituisce alcun body; e lo status non e mai deciso dal client, e sempre il server a impostarlo. Per uno status diverso da 200 servono `ResponseEntity` o `@ResponseStatus`."},{"type":"mcq","prompt":"A cosa servono @ControllerAdvice e @ExceptionHandler?","code":"","options":["@ControllerAdvice centralizza in un unico punto la gestione delle eccezioni (e altri aspetti) per piu controller; @ExceptionHandler mappa un tipo di eccezione al metodo che la gestisce","@ControllerAdvice intercetta solo le eccezioni sollevate all\u0027interno della classe in cui e dichiarato","@ExceptionHandler puo essere usato esclusivamente all\u0027interno di una classe @ControllerAdvice, mai dentro un controller","@ControllerAdvice sostituisce il DispatcherServlet nel gestire il routing delle richieste"],"correct":0,"explanation":"In sintesi: `@ControllerAdvice` centralizza in un unico punto la gestione trasversale delle eccezioni, e di altri aspetti, per piu controller, per default tutti; al suo interno i metodi `@ExceptionHandler` mappano un tipo di eccezione al metodo che lo gestisce. E il modo idiomatico per una gestione degli errori uniforme.\nLe altre opzioni: non e limitato alla singola classe in cui e dichiarato, quello sarebbe un `@ExceptionHandler` locale al controller; `@ExceptionHandler` funziona sia in un `@ControllerAdvice` sia direttamente in un controller; e `@ControllerAdvice` non sostituisce il `DispatcherServlet`, che resta il front controller del routing."},{"type":"code","prompt":"Con questa configurazione, cosa accade quando un qualsiasi controller lancia una EntityNotFoundException?","code":"@RestControllerAdvice\npublic class GlobalHandler {\n\n    @ExceptionHandler(EntityNotFoundException.class)\n    public ResponseEntity\u003cString\u003e handle(EntityNotFoundException ex) {\n        return ResponseEntity.status(HttpStatus.NOT_FOUND)\n                             .body(ex.getMessage());\n    }\n}","options":["Viene invocato handle() e il client riceve una risposta 404 con il messaggio dell\u0027eccezione nel body","L\u0027eccezione si propaga come 500 perche @RestControllerAdvice non e globale","Vengono gestiti solo i controller che si trovano nello stesso package della classe advice","Il body risulta vuoto perche ResponseEntity ignora body() quando lo status e di errore"],"correct":0,"explanation":"In sintesi: viene invocato `handle()` e il client riceve un 404 con il messaggio dell\u0027eccezione nel body. `@RestControllerAdvice`, che equivale a `@ControllerAdvice` piu `@ResponseBody`, applica il gestore a tutti i controller dell\u0027applicazione, quindi qualunque `EntityNotFoundException` non gestita localmente finisce li.\nLe altre opzioni: non diventa un 500 perche l\u0027advice e effettivamente globale; non e limitato al package della classe advice; e `ResponseEntity` scrive regolarmente il body anche con status di errore, quindi `body()` non viene ignorato."},{"type":"mcq","prompt":"Definendo un\u0027interfaccia che estende JpaRepository\u003cUser, Long\u003e, chi ne fornisce l\u0027implementazione?","code":"","options":["Spring Data genera a runtime un proxy che implementa i metodi dell\u0027interfaccia","Devi scrivere manualmente una classe che implementa quell\u0027interfaccia","Hibernate genera una classe concreta a compile-time durante la build","Il metodo resta astratto e lancia UnsupportedOperationException se invocato"],"correct":0,"explanation":"In sintesi: l\u0027implementazione la fornisce Spring Data JPA, che a runtime genera un proxy dinamico dell\u0027interfaccia repository: espone le operazioni CRUD ereditate da `JpaRepository`, delegando a un\u0027implementazione di base come `SimpleJpaRepository`, e deriva le query dai nomi dei metodi. E il vantaggio chiave del pattern, non scrivere codice di implementazione.\nLe altre opzioni: non devi scrivere tu una classe che implementa l\u0027interfaccia; la generazione non avviene a compile-time da parte di Hibernate; e i metodi non restano astratti ne lanciano `UnsupportedOperationException`, li risolve il proxy."},{"type":"code","prompt":"Cosa fa questo metodo di repository derivato dal nome?","code":"public interface UserRepository extends JpaRepository\u003cUser, Long\u003e {\n    List\u003cUser\u003e findByAgeGreaterThanAndActiveTrue(int age);\n}","options":["Restituisce gli User con age strettamente maggiore del valore passato e con active = true","Restituisce gli User con age maggiore o uguale al valore, indipendentemente da active","Va in errore: i query method derivati non supportano condizioni multiple","Restituisce tutti gli User ordinati per age crescente"],"correct":0,"explanation":"In sintesi: il nome del metodo viene interpretato da Spring Data come una query derivata: `GreaterThan` impone `age` strettamente maggiore del valore passato, `And` combina piu condizioni, e `ActiveTrue` e una scorciatoia per `active = true`. Quindi restituisce gli `User` con `age` maggiore del parametro e `active` a true.\nLe altre opzioni: per il maggiore-o-uguale servirebbe `GreaterThanEqual`; i query method supportano piu condizioni con `And`/`Or`, quindi nessun errore; e non c\u0027e ordinamento implicito, servirebbe un suffisso `OrderBy`."},{"type":"mcq","prompt":"Qual e il comportamento della propagazione REQUIRED (default di @Transactional)?","code":"","options":["Se esiste gia una transazione la riutilizza, altrimenti ne crea una nuova","Crea sempre una nuova transazione, sospendendo quella eventualmente in corso","Non apre mai una transazione: si limita a partecipare a una gia esistente, altrimenti fallisce","E equivalente a REQUIRES_NEW e apre sempre una transazione indipendente"],"correct":0,"explanation":"In sintesi: `REQUIRED`, la propagazione di default, riusa la transazione corrente se ne esiste gia una, altrimenti ne avvia una nuova. E il comportamento piu comune: il metodo si aggancia al contesto transazionale esistente per far parte della stessa unita di lavoro.\nLe altre opzioni: creare sempre una transazione nuova sospendendo quella in corso e `REQUIRES_NEW`; partecipare solo a una transazione esistente e fallire se non c\u0027e e `MANDATORY`; e `REQUIRES_NEW` non e equivalente a `REQUIRED`, apre invece una transazione indipendente."},{"type":"code","prompt":"La transazione su save() viene attivata quando process() chiama save() internamente?","code":"@Service\npublic class OrderService {\n\n    public void process() {\n        save();   // chiamata interna allo stesso bean\n    }\n\n    @Transactional\n    public void save() {\n        // ...\n    }\n}","options":["No: la chiamata interna (self-invocation) non passa dal proxy, quindi @Transactional viene ignorata","Si: @Transactional funziona sempre, indipendentemente da chi chiama il metodo","No, ma solo perche save() dovrebbe essere dichiarato private","Si, ma soltanto se anche process() e annotato @Transactional"],"correct":0,"explanation":"In sintesi: no, la transazione su `save()` non si attiva. L\u0027AOP di Spring per `@Transactional` e proxy-based: l\u0027aspetto scatta solo quando la chiamata passa attraverso il proxy, cioe arriva da un chiamante esterno al bean. Nella self-invocation `process()` chiama `save()` tramite `this`, bypassando il proxy, quindi l\u0027annotazione viene ignorata.\nLe altre opzioni: non e vero che `@Transactional` funzioni sempre a prescindere dal chiamante; il problema non e la visibilita, `save()` e gia public; e annotare anche `process()` non risolve la self-invocation su `save()`. Le soluzioni tipiche sono separare i metodi in due bean, auto-iniettare il proxy o usare AspectJ weaving."},{"type":"mcq","prompt":"Su un bean gestito con i proxy standard di Spring, su quali metodi @Transactional viene tipicamente ignorata?","code":"","options":["Sui metodi non public (private, protected, package-private) con la configurazione a proxy di default","Sui metodi public, che non possono essere intercettati","Solo sui metodi static","Su nessuno: @Transactional funziona sempre su qualsiasi visibilita"],"correct":0,"explanation":"In sintesi: con i proxy standard di Spring, `@Transactional` viene rispettata solo sui metodi public; applicarla a metodi non public, quindi private, protected o package-private, di norma non ha effetto perche non vengono intercettati nella semantica prevista.\nLe altre opzioni: e rovesciata l\u0027idea che i public non possano essere intercettati, sono proprio quelli correttamente proxati; non e una questione di `static`; e non e vero che funzioni sempre a qualsiasi visibilita. Per intercettare metodi non public serve una configurazione diversa, come AspectJ weaving."},{"type":"mcq","prompt":"Qual e l\u0027ordine corretto delle fasi di inizializzazione di un bean singleton?","code":"","options":["Istanziazione (costruttore) -\u003e dependency injection delle proprieta -\u003e @PostConstruct -\u003e afterPropertiesSet() di InitializingBean","@PostConstruct -\u003e costruttore -\u003e dependency injection","Dependency injection -\u003e costruttore -\u003e @PostConstruct","@PreDestroy -\u003e costruttore -\u003e @PostConstruct"],"correct":0,"explanation":"In sintesi: l\u0027ordine e istanziazione col costruttore, poi dependency injection delle proprieta, poi `@PostConstruct`, e infine `afterPropertiesSet()` di `InitializingBean`. Il container prima crea l\u0027oggetto, poi ne popola le dipendenze, esegue le callback Aware e i BeanPostProcessor, tra cui quello che invoca `@PostConstruct`, e da ultimo gli hook di inizializzazione.\nLe altre opzioni: `@PostConstruct` non puo precedere il costruttore ne l\u0027iniezione, quindi le opzioni che lo mettono per primo sono errate; e `@PreDestroy` appartiene alla fase di distruzione, non a quella di inizializzazione."},{"type":"code","prompt":"Se la proprieta mail.port non e definita in application.properties, quanto vale il campo port?","code":"@Component\npublic class MailConfig {\n\n    @Value(\"${mail.port:25}\")\n    private int port;\n}","options":["25, grazie al valore di default indicato dopo i due punti nel placeholder","0, il valore di default di un int in Java","null, e viene sollevata una NullPointerException","L\u0027applicazione non si avvia per proprieta mancante"],"correct":0,"explanation":"In sintesi: `port` vale 25, grazie al valore di default indicato dopo i due punti nel placeholder. La sintassi `${chiave:default}` fornisce un fallback usato quando la proprieta non e definita: mancando `mail.port`, viene iniettato 25, convertito in `int`.\nLe altre opzioni: non si applica lo 0 di default del primitivo perche il placeholder fornisce esplicitamente 25; un `int` non puo valere null, quindi nessuna NPE; e l\u0027app parte regolarmente proprio perche il default evita l\u0027errore che si avrebbe con `${mail.port}` senza fallback."},{"type":"code","prompt":"Cosa inietta questa espressione in @Value?","code":"@Value(\"#{systemProperties[\u0027user.name\u0027]}\")\nprivate String user;","options":["Il valore della system property user.name, valutato come espressione SpEL (#{...})","La stringa letterale \"#{systemProperties[\u0027user.name\u0027]}\"","Una proprieta di nome user.name letta da application.properties","Un errore: #{} non e una sintassi valida dentro @Value"],"correct":0,"explanation":"In sintesi: la sintassi `#{...}` in `@Value` indica una Spring Expression Language: qui l\u0027espressione legge la system property `user.name` dalla mappa predefinita `systemProperties` e ne inietta il valore. E il modo per valutare espressioni a runtime, non semplici placeholder.\nLe altre opzioni: non e trattata come stringa letterale perche riconosciuta come SpEL; per leggere da `application.properties` si usa `${...}`, che e cosa diversa da `#{...}`; e la sintassi `#{}` e pienamente valida, quindi nessun errore."},{"type":"mcq","prompt":"Su cosa si basa principalmente l\u0027AOP di Spring per applicare aspetti come @Transactional?","code":"","options":["Su proxy (JDK dynamic proxy o CGLIB) che avvolgono il bean e intercettano le chiamate ai suoi metodi","Sulla modifica del bytecode di tutte le classi a compile-time, come il weaving statico di AspectJ","Sull\u0027ereditarieta multipla delle classi target","Sull\u0027uso della reflection a ogni chiamata di metodo senza alcun proxy"],"correct":0,"explanation":"In sintesi: l\u0027AOP di Spring e proxy-based: il container crea un proxy attorno al bean, un JDK dynamic proxy se il bean implementa interfacce altrimenti una sottoclasse CGLIB, e intercetta le invocazioni dei metodi per applicare gli aspetti prima e dopo l\u0027esecuzione, come apertura e commit della transazione per `@Transactional`.\nLe altre opzioni: non usa il weaving statico del bytecode a compile-time, tipico di AspectJ nativo; non si fonda sull\u0027ereditarieta multipla, che Java non ha; e non e semplice reflection a ogni chiamata. E proprio il meccanismo a proxy a spiegare limiti come la self-invocation."},{"type":"truefalse","prompt":"Con i proxy CGLIB, i metodi dichiarati final non possono essere intercettati dall\u0027AOP di Spring.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: l\u0027affermazione e vera. CGLIB crea il proxy estendendo la classe target e facendo override dei suoi metodi per inserire la logica dell\u0027aspetto. Un metodo `final` non puo essere sottoposto a override, quindi non puo essere intercettato, e eventuali annotazioni AOP come `@Transactional` su metodi `final` vengono di fatto ignorate.\nLe altre opzioni: dire Falso e l\u0027errore tipico; analogamente anche una classe `final` non puo essere proxata da CGLIB. E un limite intrinseco dell\u0027approccio a proxy per sottoclasse."},{"type":"mcq","prompt":"Qual e la differenza corretta tra @Component e @Bean?","code":"","options":["@Component annota una classe rilevata dal component scanning; @Bean annota un metodo dentro una classe di configurazione per registrare un oggetto, utile soprattutto quando la classe e di terze parti e non e annotabile","@Bean si usa sulle classi, mentre @Component si usa sui metodi","@Component e @Bean sono intercambiabili e si applicano entrambi ai metodi","@Bean richiede necessariamente il component scanning attivo per poter funzionare"],"correct":0,"explanation":"In sintesi: `@Component`, e i suoi stereotipi, si mette su una classe di cui abbiamo il sorgente per farla rilevare dal component scanning; `@Bean` si mette su un metodo di una classe di configurazione `@Configuration` per registrare esplicitamente un oggetto come bean. Quest\u0027ultimo e lo scenario tipico quando la classe viene da una libreria di terze parti e non possiamo annotarla.\nLe altre opzioni: le collocazioni sono opposte a quanto dice la seconda opzione, `@Component` va sulle classi e `@Bean` sui metodi; le due annotazioni non sono intercambiabili; e `@Bean` funziona tramite l\u0027elaborazione della classe di configurazione, indipendentemente dal component scanning."},{"type":"code","prompt":"Cosa succede all\u0027avvio dell\u0027applicazione con queste due classi?","code":"@Service\nclass A {\n    A(B b) { }\n}\n\n@Service\nclass B {\n    B(A a) { }\n}","options":["L\u0027avvio fallisce: Spring rileva una dipendenza circolare tra costruttori e solleva un\u0027eccezione (es. BeanCurrentlyInCreationException)","Funziona senza problemi: Spring risolve automaticamente qualsiasi dipendenza circolare","A e B vengono creati ma con i riferimenti null, e l\u0027app parte comunque","Spring crea due container separati per rompere il ciclo"],"correct":0,"explanation":"In sintesi: l\u0027avvio fallisce. Con la constructor injection, per creare `A` serve gia `B` e per creare `B` serve gia `A`: nessuno dei due puo essere istanziato per primo, quindi Spring non riesce a risolvere il ciclo e solleva un\u0027eccezione, tipicamente `BeanCurrentlyInCreationException`.\nLe altre opzioni: non risolve automaticamente qualsiasi ciclo, la risoluzione e possibile solo con field o setter injection tramite riferimenti anticipati, non con i costruttori; i bean non partono con riferimenti null; e non vengono creati container separati. Da Spring Boot 2.6, inoltre, i riferimenti circolari sono vietati per default con `spring.main.allow-circular-references=false`."},{"type":"mcq","prompt":"Per default, su quali tipi di eccezione @Transactional esegue il rollback automatico?","code":"","options":["Solo su RuntimeException (unchecked) ed Error; le checked exception non provocano rollback automatico","Su qualsiasi eccezione lanciata, sia checked sia unchecked","Non esegue mai rollback automatico: va sempre invocato manualmente","Solo sulle checked exception, non sulle RuntimeException"],"correct":0,"explanation":"In sintesi: per default `@Transactional` fa rollback solo sulle eccezioni unchecked, cioe `RuntimeException` e sottoclassi, e sugli `Error`; per le checked exception, invece, esegue comunque il commit. E un default che sorprende chi si aspetta il rollback su qualsiasi errore.\nLe altre opzioni: non fa rollback su qualsiasi eccezione, per le checked serve configurare `rollbackFor`; il comportamento e opposto a quello che limita il rollback alle sole checked; e il rollback avviene automaticamente, non solo manualmente. Per cambiare la regola si usano gli attributi `rollbackFor` e `noRollbackFor`."}]},{"id":"sql","title":"Database \u0026 SQL","questions":[{"type":"mcq","prompt":"Devi restituire tutti i clienti della tabella `customers`, includendo anche quelli che non hanno alcun record in `orders` (con le colonne di `orders` a NULL). Quale operazione e corretta?","code":"","options":["INNER JOIN tra customers e orders","LEFT JOIN con customers come tabella di sinistra","RIGHT JOIN con customers come tabella di sinistra","CROSS JOIN tra customers e orders"],"correct":1,"explanation":"In sintesi: mi serve preservare TUTTE le righe di `customers` anche senza corrispondenza in `orders`, quindi uso un `LEFT JOIN` con `customers` come tabella di sinistra; il join mantiene ogni cliente e riempie con `NULL` le colonne di `orders` dove non c\u0027e match. E il pattern classico per trovare i clienti senza ordini (`WHERE orders.id IS NULL`).\nLe altre opzioni: l\u0027`INNER JOIN` scarta i clienti senza ordini; il `RIGHT JOIN` con `customers` a sinistra preserverebbe `orders` (la destra), perdendo i clienti orfani; il `CROSS JOIN` produce il prodotto cartesiano senza condizione di match."},{"type":"code","prompt":"Quante righe restituisce questa query?","code":"-- t1.id = {1, 2, 3}\n-- t2.id = {2, 2, 4}\n\nSELECT COUNT(*)\nFROM t1\nINNER JOIN t2 ON t1.id = t2.id;","options":["1","2","3","5"],"correct":1,"explanation":"In sintesi: l\u0027`INNER JOIN` accoppia solo le righe con `id` coincidente e MOLTIPLICA in base al numero di corrispondenze. L\u0027unico valore comune e `id=2`: compare una volta in `t1` e due volte in `t2`, quindi genera 1x2 = 2 righe. Gli `id` 1 e 3 non hanno match in `t2`, il 4 non ha match in `t1`.\nLe altre opzioni: `1` ignora la moltiplicazione contando solo la riga di `t1`; `3` conta erroneamente le righe di `t1`; `5` sommerebbe cose senza senso rispetto alla semantica del join."},{"type":"code","prompt":"Cosa restituisce la query, nell\u0027ordine COUNT(*), COUNT(bonus), SUM(bonus)?","code":"-- employees.bonus = {100, NULL, 200, NULL, 50}\n\nSELECT COUNT(*), COUNT(bonus), SUM(bonus)\nFROM employees;","options":["5, 5, 350","5, 3, 350","3, 3, 350","5, 3, NULL"],"correct":1,"explanation":"In sintesi: `COUNT(*)` conta tutte le righe fisiche, `NULL` inclusi, quindi 5; `COUNT(bonus)` conta solo i valori NON NULL della colonna, quindi 3; `SUM(bonus)` ignora i `NULL` e somma 100+200+50 = 350. La regola chiave e che tutte le funzioni di aggregazione TRANNE `COUNT(*)` scartano i `NULL` prima del calcolo.\nLe altre opzioni: `5,5,350` sbaglia `COUNT(bonus)` credendo che conti anche i `NULL`; `3,3,350` sbaglia `COUNT(*)`; `5,3,NULL` presume erroneamente che un `NULL` propaghi `NULL` nella somma."},{"type":"mcq","prompt":"Qual e la differenza corretta tra WHERE e HAVING?","code":"","options":["WHERE filtra le righe PRIMA del raggruppamento; HAVING filtra i gruppi DOPO il GROUP BY e puo usare funzioni di aggregazione","Sono equivalenti, HAVING e solo sintassi piu recente","HAVING filtra le righe prima del GROUP BY, WHERE dopo","WHERE puo usare funzioni di aggregazione come SUM, HAVING no"],"correct":0,"explanation":"In sintesi: `WHERE` filtra a livello di riga PRIMA del raggruppamento, quindi non puo referenziare le aggregazioni; `HAVING` agisce DOPO il `GROUP BY`, sui gruppi gia formati, e puo usare condizioni su aggregati come `HAVING SUM(amount) \u003e 100`. Riflette l\u0027ordine logico della pipeline: `FROM` -\u003e `WHERE` -\u003e `GROUP BY` -\u003e `HAVING` -\u003e `SELECT`.\nLe altre opzioni: non sono equivalenti perche operano in fasi diverse; l\u0027opzione che li inverte sbaglia l\u0027ordine; e attribuire a `WHERE` l\u0027uso di aggregati e falso, e prerogativa esclusiva di `HAVING`."},{"type":"truefalse","prompt":"In SQL standard e lecito scrivere `SELECT region FROM sales WHERE SUM(amount) \u003e 100 GROUP BY region`, cioe usare una funzione di aggregazione nella clausola WHERE.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: Falso. `WHERE` viene valutato riga per riga PRIMA del raggruppamento, quando le aggregazioni non esistono ancora, quindi mettere `SUM()` nella `WHERE` genera errore. La condizione su un aggregato va spostata in `HAVING`: `... GROUP BY region HAVING SUM(amount) \u003e 100`. E l\u0027ordine logico `FROM` -\u003e `WHERE` -\u003e `GROUP BY` -\u003e `HAVING` -\u003e `SELECT` a imporlo.\nLe altre opzioni: l\u0027errore tipico e credere che `WHERE` e `HAVING` siano intercambiabili; in realta solo `HAVING` vede i risultati delle aggregazioni."},{"type":"code","prompt":"Qual e l\u0027output della query (ordinato per region)?","code":"-- sales(region, amount):\n-- (\u0027EU\u0027, 10), (\u0027EU\u0027, 20), (\u0027US\u0027, 30), (\u0027US\u0027, NULL)\n\nSELECT region, SUM(amount) AS tot\nFROM sales\nGROUP BY region\nORDER BY region;","options":["EU 30, US 30","EU 30, US NULL","EU 30, US 30, piu una riga separata per il NULL","EU 30"],"correct":0,"explanation":"In sintesi: il `GROUP BY` crea un gruppo per ogni valore distinto di `region`. Per `EU`: 10+20 = 30. Per `US`: `SUM` ignora il `NULL` e somma il solo 30, dando 30 (non `NULL`). Il `NULL` non forma un gruppo a se: appartiene alla riga con region `US`.\nLe altre opzioni: `US NULL` e l\u0027errore classico di chi crede che un `NULL` nella somma propaghi `NULL`, mentre `SUM` lo scarta; la riga separata per il `NULL` confonde il valore della colonna aggregata con la chiave di raggruppamento; `EU 30` da sola dimentica il gruppo `US`."},{"type":"mcq","prompt":"Quale caratteristica distingue una subquery CORRELATA da una non correlata?","code":"","options":["La subquery correlata referenzia una colonna della query esterna e viene (logicamente) rivalutata per ogni riga esterna","La subquery correlata restituisce sempre una sola riga","La subquery correlata non puo essere usata con EXISTS","La subquery correlata viene eseguita una sola volta prima della query esterna"],"correct":0,"explanation":"In sintesi: una subquery CORRELATA referenzia una colonna della query esterna (es. `WHERE e.dept_id = d.id`), quindi logicamente viene rivalutata per ogni riga esterna; questa dipendenza dall\u0027esterno E la sua definizione. E l\u0027uso tipico di `EXISTS`.\nLe altre opzioni: la subquery NON correlata e autonoma e si valuta una sola volta; `EXISTS` e proprio il costrutto piu usato con le correlate; e il numero di righe restituite non discrimina la correlazione, dipende dalla logica della query."},{"type":"code","prompt":"Cosa stampa la query?","code":"SELECT\n  CASE\n    WHEN NULL = NULL  THEN \u0027uguale\u0027\n    WHEN NULL \u003c\u003e NULL THEN \u0027diverso\u0027\n    ELSE \u0027sconosciuto\u0027\n  END AS risultato;","options":["uguale","diverso","sconosciuto","errore di sintassi"],"correct":2,"explanation":"In sintesi: nella logica a tre valori di SQL qualsiasi confronto con `NULL` tramite `=` o `\u003c\u003e` restituisce `UNKNOWN`, non `TRUE` ne `FALSE`. Percio ne il primo ne il secondo `WHEN` sono soddisfatti (`UNKNOWN` non e `TRUE`) e il `CASE` ricade sull\u0027`ELSE`, dando \u0027sconosciuto\u0027. Per testare i `NULL` si usa `IS NULL` / `IS NOT NULL`.\nLe altre opzioni: \u0027uguale\u0027 e \u0027diverso\u0027 presumono che `NULL = NULL` o `NULL \u003c\u003e NULL` diano `TRUE`, cosa impossibile; non e un errore di sintassi, la query e valida."},{"type":"mcq","prompt":"Cosa restituisce `SELECT * FROM t WHERE id NOT IN (1, 2, NULL)`?","code":"","options":["Le righe con id diverso da 1 e 2, ignorando il NULL","Sempre zero righe: nessuna riga puo soddisfare il predicato","Un errore, perche NULL non e ammesso dentro IN","Tutte le righe della tabella"],"correct":1,"explanation":"In sintesi: `NOT IN (1,2,NULL)` viene espanso in `id \u003c\u003e 1 AND id \u003c\u003e 2 AND id \u003c\u003e NULL`; il termine `id \u003c\u003e NULL` vale sempre `UNKNOWN`, e `qualcosa AND UNKNOWN` non puo mai diventare `TRUE`. Quindi la query non restituisce MAI righe: e il classico bug del `NOT IN` con un `NULL` nella lista (o proveniente da una subquery). La soluzione e filtrare i `NULL` o usare `NOT EXISTS`.\nLe altre opzioni: non ignora il `NULL` come farebbe un `IN` positivo; non e un errore di sintassi, `NULL` e ammesso in `IN`; e non restituisce tutte le righe."},{"type":"code","prompt":"Quali righe restituisce la query?","code":"-- t.val = {1, NULL, 3}\n\nSELECT val FROM t WHERE val \u003c\u003e 1;","options":["3","NULL, 3","1, NULL, 3","nessuna riga"],"correct":0,"explanation":"In sintesi: il predicato `val \u003c\u003e 1` e `TRUE` solo per `val=3`. Per `val=1` e `FALSE`; per `val=NULL` il confronto `NULL \u003c\u003e 1` da `UNKNOWN`, e la `WHERE` conserva solo le righe in cui il predicato e `TRUE`, quindi il `NULL` viene scartato. Risultato: solo 3.\nLe altre opzioni: \u0027NULL, 3\u0027 nasce dal credere che `\u003c\u003e` includa i `NULL`, ma la logica a tre valori li esclude sia da `= 1` sia da `\u003c\u003e 1`; le altre ignorano che `val=1` e escluso o che il `NULL` non passa la `WHERE`."},{"type":"mcq","prompt":"Con un indice composito su `(last_name, first_name)`, quale predicato PUO sfruttare l\u0027indice per la ricerca?","code":"","options":["WHERE first_name = \u0027Mario\u0027","WHERE last_name = \u0027Rossi\u0027","WHERE first_name = \u0027Mario\u0027 AND YEAR(hire_date) = 2020","WHERE last_name LIKE \u0027%ossi\u0027"],"correct":1,"explanation":"In sintesi: vale la regola del prefisso piu a sinistra (leftmost prefix): l\u0027indice composito e ordinato prima per `last_name` e poi per `first_name`, quindi puo essere sfruttato solo se il filtro parte da `last_name`. `WHERE last_name = \u0027Rossi\u0027` usa il prefisso e beneficia dell\u0027indice.\nLe altre opzioni: filtrare solo su `first_name` salta la prima colonna e non permette la ricerca ordinata; combinare `first_name` con `YEAR(hire_date)` ha lo stesso problema; il wildcard iniziale `LIKE \u0027%ossi\u0027` su `last_name` impedisce lo scan del prefisso ordinato."},{"type":"mcq","prompt":"Cosa si intende per covering index rispetto a una specifica query?","code":"","options":["Un indice che contiene tutte le colonne necessarie alla query, permettendo di rispondere senza accedere alla tabella (index-only scan)","Un indice che include tutte le colonne della tabella","Un indice unico che impedisce i duplicati","Un indice che si aggiorna automaticamente a ogni commit"],"correct":0,"explanation":"In sintesi: un covering index e relativo a una query specifica: se l\u0027indice contiene sia le colonne del filtro sia quelle proiettate nella `SELECT`, il motore risponde leggendo SOLO l\u0027indice (index-only scan), evitando il lookup sulla tabella/heap e riducendo l\u0027I/O.\nLe altre opzioni: non significa includere tutte le colonne della tabella (sarebbe uno spreco); l\u0027unicita e un\u0027altra proprieta (indice UNIQUE); e l\u0027aggiornamento automatico a ogni modifica vale per qualsiasi indice, non definisce il covering."},{"type":"truefalse","prompt":"Creare un indice su una colonna a bassissima cardinalita (es. un flag attivo/non attivo con distribuzione circa 50/50) e in genere molto efficace per velocizzare le SELECT che filtrano su quella colonna.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: Falso. Un indice conviene quando ha alta selettivita, cioe filtra una piccola frazione delle righe. Con una colonna a bassa cardinalita che seleziona circa meta tabella, l\u0027ottimizzatore preferisce spesso un full table scan, perche seguire l\u0027indice e poi fare tantissimi lookup costa piu della scansione sequenziale; l\u0027indice aggiunge overhead di scrittura senza reale beneficio in lettura.\nLe altre opzioni: l\u0027errore tipico e assumere che un indice velocizzi SEMPRE le SELECT; conta la selettivita, salvo casi particolari come indici parziali o covering."},{"type":"mcq","prompt":"Perche `WHERE UPPER(email) = \u0027X@Y.COM\u0027` spesso NON usa l\u0027indice B-tree su `email`?","code":"","options":["Applicare una funzione alla colonna rende il predicato non-sargable: l\u0027indice e sui valori di email, non su UPPER(email)","Gli indici B-tree non supportano il tipo stringa","La funzione UPPER disabilita sempre l\u0027ottimizzatore per l\u0027intera query","Un indice B-tree puo essere usato solo con LIKE"],"correct":0,"explanation":"In sintesi: applicare una funzione alla colonna rende il predicato non-sargable. L\u0027indice B-tree memorizza i valori grezzi di `email` in ordine, non i valori di `UPPER(email)`; percio con `WHERE UPPER(email) = \u0027X@Y.COM\u0027` il motore dovrebbe conoscere `UPPER(email)` di ogni riga, informazione che l\u0027indice non contiene, e ripiega sul table scan. Si risolve con un indice funzionale su `UPPER(email)` o una colonna normalizzata.\nLe altre opzioni: i B-tree supportano benissimo le stringhe e funzionano con match esatti e range (non solo `LIKE`); e `UPPER` non disabilita l\u0027ottimizzatore per l\u0027intera query, impedisce solo l\u0027uso di quello specifico indice."},{"type":"code","prompt":"Considerando l\u0027indice B-tree su customers(name), quale affermazione e corretta?","code":"-- indice B-tree su customers(name)\nSELECT * FROM customers WHERE name LIKE \u0027%rossi\u0027;","options":["L\u0027indice B-tree non puo essere usato per una ricerca efficiente: il wildcard iniziale impedisce di sfruttare l\u0027ordinamento del prefisso","L\u0027indice viene usato normalmente, come per un match esatto","L\u0027indice viene usato solo se name e la chiave primaria","La query e sintatticamente invalida"],"correct":0,"explanation":"In sintesi: un B-tree ordina le stringhe da sinistra a destra e puo saltare a un prefisso noto. Con il wildcard INIZIALE (`\u0027%rossi\u0027`) il prefisso e sconosciuto, quindi il motore deve esaminare tutte le voci e ripiega su un full scan: l\u0027indice non e utile per una ricerca efficiente. Al contrario `LIKE \u0027rossi%\u0027` (wildcard finale) usa l\u0027indice come un range sul prefisso.\nLe altre opzioni: non viene usato come per un match esatto proprio per il wildcard iniziale; non dipende dall\u0027essere chiave primaria; e la sintassi e perfettamente valida."},{"type":"mcq","prompt":"Quale situazione viola la Prima Forma Normale (1NF)?","code":"","options":["Una colonna `phone_numbers` che contiene la stringa \u0027333-111, 340-222\u0027 con piu numeri in un solo campo","Una tabella priva di chiave esterna","Una colonna non-chiave che dipende solo da parte di una chiave primaria composita","Una colonna non-chiave che dipende da un\u0027altra colonna non-chiave"],"correct":0,"explanation":"In sintesi: la 1NF richiede valori ATOMICI (indivisibili) in ogni cella e vieta i gruppi ripetuti; una colonna `phone_numbers` che stipa piu numeri come \u0027333-111, 340-222\u0027 in un solo campo la viola, perche il valore non e atomico. La correzione e scomporre i numeri in righe/tabella dedicata.\nLe altre opzioni: l\u0027assenza di chiave esterna non riguarda la normalizzazione; la dipendenza da parte di una chiave composita e una violazione di 2NF; la dipendenza tra colonne non-chiave e una violazione di 3NF, ed entrambe presuppongono la 1NF gia rispettata."},{"type":"mcq","prompt":"In una tabella con chiave primaria composita `(order_id, product_id)`, la colonna `product_name` dipende solo da `product_id`. Quale forma normale e violata?","code":"","options":["2NF: dipendenza parziale dalla chiave primaria","1NF: valori non atomici","3NF: dipendenza transitiva","Nessuna, la tabella e gia in forma normale"],"correct":0,"explanation":"In sintesi: la 2NF richiede che ogni attributo non-chiave dipenda dall\u0027INTERA chiave primaria, non da una sua parte. Qui `product_name` dipende solo da `product_id`, cioe da meta della chiave composita `(order_id, product_id)`: e una dipendenza parziale, la tipica violazione di 2NF. Si risolve spostando `product_name` in una tabella `products`.\nLe altre opzioni: non e 1NF perche i valori sono atomici; non e 3NF perche la dipendenza problematica e da una parte della chiave, non transitiva tra due attributi non-chiave; e una violazione c\u0027e, quindi non e gia normalizzata."},{"type":"mcq","prompt":"Tabella `employees(emp_id PK, dept_id, dept_name)` dove `dept_name` dipende da `dept_id`. Quale problema e quale forma e violata?","code":"","options":["Dipendenza transitiva (emp_id -\u003e dept_id -\u003e dept_name): viola la 3NF","Dipendenza parziale: viola la 2NF","Valori non atomici: viola la 1NF","Nessuna violazione"],"correct":0,"explanation":"In sintesi: la chiave primaria e la sola `emp_id` (non composita), quindi non esistono dipendenze parziali e la 2NF e automaticamente soddisfatta. Il problema e che `dept_name` dipende da `dept_id`, che a sua volta dipende da `emp_id`: una dipendenza TRANSITIVA tra attributi non-chiave (`emp_id -\u003e dept_id -\u003e dept_name`), che viola la 3NF. Si normalizza spostando `dept_id`/`dept_name` in una tabella `departments`, evitando anomalie di update.\nLe altre opzioni: non e 2NF perche la chiave non e composita; non e 1NF perche i valori sono atomici; e una violazione esiste eccome."},{"type":"mcq","prompt":"Un utente riceve la conferma di COMMIT; subito dopo il server subisce un blackout. Al riavvio la transazione confermata e ancora presente e integra. Quale proprieta ACID lo garantisce?","code":"","options":["Durability (Durabilita)","Atomicity (Atomicita)","Isolation (Isolamento)","Consistency (Consistenza)"],"correct":0,"explanation":"In sintesi: e la Durability (Durabilita): una volta confermato il `COMMIT`, gli effetti sopravvivono a crash, riavvii e cadute di corrente, tipicamente grazie al write-ahead log (WAL) persistito su disco prima della conferma. E esattamente lo scenario \u0027commit confermato, poi blackout, dati ancora integri al riavvio\u0027.\nLe altre opzioni: l\u0027Atomicity riguarda il tutto-o-niente dentro la transazione; l\u0027Isolation l\u0027interferenza tra transazioni concorrenti; la Consistency il rispetto di vincoli e invarianti. Nessuna descrive la persistenza dopo il crash."},{"type":"mcq","prompt":"Un bonifico sottrae 100 dal conto A e aggiunge 100 al conto B. Se il secondo UPDATE fallisce, entrambe le modifiche vengono annullate. Quale proprieta ACID e in gioco?","code":"","options":["Atomicity: la transazione e tutto-o-niente, quindi si esegue un rollback completo","Durability","Isolation","Consistency"],"correct":0,"explanation":"In sintesi: e l\u0027Atomicity: una transazione e tutto-o-niente, tutte le operazioni riescono insieme o vengono annullate insieme. Il fallimento del secondo `UPDATE` innesca il rollback anche del primo, evitando lo stato incoerente in cui A e addebitato ma B non accreditato.\nLe altre opzioni: la Durability riguarda la persistenza dopo il commit; l\u0027Isolation la concorrenza; la Consistency il rispetto dei vincoli. Attenzione a non confondere Atomicity con Consistency: qui il punto e il rollback dell\u0027unita atomica, non la validazione di un vincolo."},{"type":"mcq","prompt":"Qual e il livello di isolamento MINIMO che previene il dirty read (lettura di dati non ancora committati da un\u0027altra transazione)?","code":"","options":["READ COMMITTED","READ UNCOMMITTED","SERIALIZABLE, che e l\u0027unico a prevenirlo","Nessun livello previene il dirty read"],"correct":0,"explanation":"In sintesi: e READ COMMITTED. `READ UNCOMMITTED` e l\u0027unico livello standard che PERMETTE il dirty read; salendo a `READ COMMITTED` ogni lettura vede solo dati gia committati, quindi e il livello MINIMO che elimina il dirty read. La gerarchia standard e `READ UNCOMMITTED` \u003c `READ COMMITTED` \u003c `REPEATABLE READ` \u003c `SERIALIZABLE`.\nLe altre opzioni: `READ UNCOMMITTED` lo consente; `SERIALIZABLE` lo previene ma non e ne l\u0027unico ne il minimo; ed e falso che nessun livello lo prevenga."},{"type":"mcq","prompt":"Nello standard SQL, quale anomalia e prevenuta SOLO dal livello SERIALIZABLE e NON garantita da REPEATABLE READ?","code":"","options":["Phantom read","Dirty read","Non-repeatable read","Nessuna: REPEATABLE READ e SERIALIZABLE sono equivalenti"],"correct":0,"explanation":"In sintesi: e il Phantom read. Nello standard SQL `REPEATABLE READ` blocca dirty read e non-repeatable read (le righe gia lette restano stabili), ma consente ancora i phantom: rieseguendo lo stesso predicato di range possono comparire NUOVE righe inserite da un\u0027altra transazione. Solo `SERIALIZABLE` elimina anche questi.\nLe altre opzioni: il dirty read e gia bloccato da `READ COMMITTED`, il non-repeatable read gia da `REPEATABLE READ`, quindi non sono esclusivi di `SERIALIZABLE`; e i due livelli non sono equivalenti. (Nota: InnoDB con next-key lock riduce i phantom gia in `REPEATABLE READ`, ma lo standard non lo garantisce.)"},{"type":"truefalse","prompt":"Un non-repeatable read si verifica quando, all\u0027interno della stessa transazione, due letture della STESSA riga restituiscono valori diversi perche un\u0027altra transazione l\u0027ha modificata e committata nel frattempo.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: Vero. Il non-repeatable read e proprio la ri-lettura della STESSA riga che cambia valore tra due `SELECT` nella medesima transazione, perche un\u0027altra transazione l\u0027ha modificata (`UPDATE`/`DELETE`) e committata nel frattempo. `REPEATABLE READ` lo previene.\nLe altre opzioni: l\u0027errore tipico e confonderlo con il phantom read, che riguarda invece la comparsa/scomparsa di INTERE righe che soddisfano un predicato di range (per `INSERT`/`DELETE`), non la modifica di una riga gia letta; quello lo previene solo `SERIALIZABLE`."},{"type":"code","prompt":"Quali valori assumono le colonne rn (ROW_NUMBER) e rk (RANK) per ogni riga?","code":"-- scores(name, pts):\n-- (\u0027A\u0027, 90), (\u0027B\u0027, 90), (\u0027C\u0027, 80)\n\nSELECT name, pts,\n  ROW_NUMBER() OVER (ORDER BY pts DESC) AS rn,\n  RANK()       OVER (ORDER BY pts DESC) AS rk\nFROM scores;","options":["A(rn1,rk1), B(rn2,rk1), C(rn3,rk3)","A(rn1,rk1), B(rn2,rk2), C(rn3,rk3)","A(rn1,rk1), B(rn1,rk1), C(rn3,rk3)","A(rn1,rk1), B(rn2,rk1), C(rn3,rk2)"],"correct":0,"explanation":"In sintesi: `ROW_NUMBER` assegna un progressivo sempre univoco (1,2,3) anche in caso di parita, mentre `RANK` da lo stesso rango ai pari-merito e poi SALTA i valori consumati. A e B sono entrambi 90, quindi `rk=1` per entrambi, e C (80) riceve `rk=3`, lasciando il buco del 2. I `rn` restano distinti: A(rn1,rk1), B(rn2,rk1), C(rn3,rk3).\nLe altre opzioni: `B(rn2,rk2)` sbaglia perche i pari-merito condividono il rango; `B(rn1,rk1)` e impossibile, `ROW_NUMBER` non produce mai duplicati; `C(rn3,rk2)` darebbe il comportamento di `DENSE_RANK`, non di `RANK`."},{"type":"mcq","prompt":"In presenza di valori a pari merito, qual e la differenza tra RANK e DENSE_RANK?","code":"","options":["RANK lascia un buco dopo i pari-merito (es. 1,1,3), DENSE_RANK no (es. 1,1,2)","Sono funzionalmente identiche","DENSE_RANK lascia il buco, RANK non lo lascia","RANK non ammette la clausola ORDER BY nella window"],"correct":0,"explanation":"In sintesi: entrambe assegnano lo stesso rango alle righe a pari merito, ma differiscono sul valore successivo: `RANK` lascia un BUCO saltando tanti valori quanti sono i pari-merito (es. 1,1,3), mentre `DENSE_RANK` prosegue senza salti (1,1,2). Se serve il conteggio \u0027denso\u0027 delle posizioni si usa `DENSE_RANK`.\nLe altre opzioni: non sono identiche, differiscono proprio sul gap; l\u0027opzione che dice \u0027DENSE_RANK lascia il buco\u0027 inverte i comportamenti; ed entrambe richiedono un `ORDER BY` nella clausola `OVER` per definire l\u0027ordinamento del ranking."},{"type":"code","prompt":"Quante righe restituisce la query e quali?","code":"-- t(a, b):\n-- (1, \u0027x\u0027), (1, \u0027y\u0027), (1, \u0027x\u0027)\n\nSELECT DISTINCT a, b FROM t;","options":["2 righe: (1,\u0027x\u0027) e (1,\u0027y\u0027)","1 riga: (1,\u0027x\u0027)","3 righe: DISTINCT non elimina nulla qui","1 riga con a=1"],"correct":0,"explanation":"In sintesi: `DISTINCT` si applica alla COMBINAZIONE di tutte le colonne proiettate, non alla sola prima. Le tuple distinte sono `(1,\u0027x\u0027)` e `(1,\u0027y\u0027)`; la seconda occorrenza di `(1,\u0027x\u0027)` e un duplicato esatto e viene eliminata, dando 2 righe. Equivale a un `GROUP BY a, b`.\nLe altre opzioni: \u00271 riga con a=1\u0027 e l\u0027errore comune di credere che `DISTINCT` operi solo su `a`; \u00273 righe\u0027 ignora che una tupla e duplicata; e \u00271 riga (1,x)\u0027 collassa erroneamente anche la coppia con `b=\u0027y\u0027`."},{"type":"mcq","prompt":"Che cos\u0027e il problema N+1, tipico degli ORM?","code":"","options":["Si esegue 1 query per caricare N entita padre e poi N query aggiuntive (una per ciascun padre) per caricarne le relazioni, invece di un\u0027unica query con JOIN","Una query che per un errore di JOIN restituisce N+1 righe invece di N","Un indice mancante che raddoppia i tempi di esecuzione","Un deadlock che coinvolge N transazioni concorrenti"],"correct":0,"explanation":"In sintesi: il problema N+1 nasce quando si esegue 1 query per caricare N entita padre e poi, accedendo pigramente (lazy) a un\u0027associazione di ciascuna, si scatena 1 query per ogni padre: totale 1+N query invece di un\u0027unica `SELECT` con `JOIN`. E un forte degrado di performance dovuto all\u0027eccesso di round-trip verso il database.\nLe altre opzioni: non e un errore di conteggio righe da `JOIN`; non e un semplice indice mancante; e non e un deadlock tra transazioni concorrenti."},{"type":"mcq","prompt":"Qual e un rimedio corretto al problema N+1 in un ORM come JPA/Hibernate?","code":"","options":["Usare un fetch join / eager fetch mirato o il batch fetching per caricare le associazioni in una (o poche) query","Aumentare il livello di isolamento a SERIALIZABLE","Rimuovere tutti gli indici dalle tabelle figlie","Disabilitare la cache di primo livello (persistence context)"],"correct":0,"explanation":"In sintesi: il rimedio e ridurre i round-trip caricando padri e associazioni in poche query: un `JOIN FETCH` (JPQL) o un\u0027entity graph le porta in una sola query, oppure il batch fetching (`@BatchSize` / `hibernate.default_batch_fetch_size`) raggruppa i caricamenti in poche `IN`-query.\nLe altre opzioni: alzare l\u0027isolamento a `SERIALIZABLE` riguarda la concorrenza, non il numero di query; rimuovere gli indici peggiora le prestazioni; e disabilitare la cache di primo livello (persistence context) non riduce le query e puo aumentarle."},{"type":"mcq","prompt":"Due transazioni si bloccano a vicenda: T1 detiene un lock su A e attende B, T2 detiene B e attende A. Come si chiama la situazione e qual e una prevenzione comune?","code":"","options":["E un deadlock; una tecnica di prevenzione comune e acquisire i lock sempre nello stesso ordine coerente in tutte le transazioni","E una normale attesa; si risolve solo aumentando il timeout all\u0027infinito","E una race condition risolvibile unicamente con SERIALIZABLE","E un phantom read; si previene con un covering index"],"correct":0,"explanation":"In sintesi: e un deadlock, un ciclo di attese reciproche in cui T1 tiene A e attende B mentre T2 tiene B e attende A, cosi nessuna procede. La maggior parte dei DBMS lo rileva e fa il rollback di una transazione (deadlock victim). Una prevenzione efficace e acquisire i lock SEMPRE nello stesso ordine coerente in tutte le transazioni, spezzando la possibilita del ciclo.\nLe altre opzioni: non e una normale attesa e aumentare il timeout all\u0027infinito peggiora; non e una race condition risolvibile solo con `SERIALIZABLE`; e non e un phantom read, ne si previene con un covering index."},{"type":"code","prompt":"Dato lo schema e i dati, cosa succede eseguendo il DELETE?","code":"CREATE TABLE orders (\n  id INT PRIMARY KEY,\n  customer_id INT REFERENCES customers(id) ON DELETE CASCADE\n);\n-- Esiste customers(id=5) con 3 righe collegate in orders.\n\nDELETE FROM customers WHERE id = 5;","options":["Il cliente 5 e le sue 3 righe in orders vengono eliminati automaticamente","Errore: violazione di foreign key, il DELETE viene rifiutato","Il cliente viene eliminato e le 3 righe orders restano con customer_id orfano","Le 3 righe orders vengono impostate a customer_id = NULL"],"correct":0,"explanation":"In sintesi: la clausola `ON DELETE CASCADE` propaga la cancellazione dal padre ai figli: eliminando `customers` con `id=5`, il database rimuove automaticamente anche le 3 righe di `orders` che lo referenziano, mantenendo l\u0027integrita referenziale.\nLe altre opzioni: l\u0027errore di violazione FK si otterrebbe con `ON DELETE RESTRICT`/`NO ACTION`; le righe orfane non sono possibili proprio grazie alla FK; e il `customer_id` a `NULL` avverrebbe con `ON DELETE SET NULL`, non con `CASCADE`."},{"type":"mcq","prompt":"Qual e una differenza corretta tra PRIMARY KEY e un vincolo UNIQUE?","code":"","options":["La PRIMARY KEY e unica e implicitamente NOT NULL, e ce ne puo essere una sola per tabella; UNIQUE ammette (in genere) valori NULL e possono esserci piu vincoli UNIQUE","Sono identici sotto ogni aspetto","UNIQUE non crea alcun indice, mentre PRIMARY KEY si","La PRIMARY KEY ammette NULL, mentre UNIQUE non lo ammette"],"correct":0,"explanation":"In sintesi: la `PRIMARY KEY` identifica univocamente ogni riga, e implicitamente `NOT NULL` e ne esiste una sola per tabella. Un vincolo `UNIQUE` garantisce anch\u0027esso l\u0027unicita ma, secondo lo standard SQL, ammette valori `NULL` (piu `NULL`, perche un `NULL` non e considerato uguale a un altro) e una tabella puo averne piu di uno.\nLe altre opzioni: non sono identici sotto ogni aspetto; entrambi creano tipicamente un indice, quindi e falso che `UNIQUE` non lo crei; e la regola sui `NULL` va invertita, e la `PRIMARY KEY` a vietarli. (Nota: SQL Server ammette un solo `NULL` in un `UNIQUE`, eccezione allo standard.)"},{"type":"code","prompt":"STRETCH. Quali valori assume la colonna running per le tre righe (ordinate per id)?","code":"-- t(id, val), ordinata per id:\n-- (1, 10), (2, 20), (3, 30)\n\nSELECT id,\n  SUM(val) OVER (\n    ORDER BY id\n    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n  ) AS running\nFROM t;","options":["10, 30, 60","10, 20, 30","60, 60, 60","10, 20, 60"],"correct":0,"explanation":"In sintesi: il frame `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` calcola un totale cumulativo (running total): per ogni riga somma tutti i valori dalla prima fino alla riga corrente. Riga 1: 10; riga 2: 10+20 = 30; riga 3: 10+20+30 = 60. La window function non collassa le righe, a differenza di `SUM` con `GROUP BY`.\nLe altre opzioni: 10,20,30 sarebbe il valore grezzo senza cumulo; 60,60,60 sarebbe la somma su tutta la partizione (frame `UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`); 10,20,60 non corrisponde ad alcun frame coerente."}]},{"id":"banking","title":"Banking \u0026 Fintech (MiFID II, IDD, GDPR)","questions":[{"type":"mcq","prompt":"Qual è uno degli obiettivi principali introdotti dalla MiFID II (Directive 2014/65/EU) rispetto alla MiFID I?","code":"","options":["Rafforzare la protezione dell\u0027investitore e la trasparenza dei mercati, riducendo il trading opaco (dark pools) e migliorando la governance dei prodotti","Abolire l\u0027obbligo di classificazione della clientela per semplificare l\u0027operatività","Consentire alle banche di vendere qualsiasi prodotto senza valutare la conoscenza del cliente","Eliminare l\u0027obbligo di informativa sui costi per i clienti retail"],"correct":0,"explanation":"In sintesi: la `MiFID II` nasce come risposta alla crisi del 2008 e ha come obiettivo cardine rafforzare la protezione dell\u0027investitore e la trasparenza dei mercati, portando in luce il trading opaco delle `dark pools` e degli scambi `OTC`, disciplinando le trading venue e introducendo la `product governance`. La logica di fondo e\u0027 spostare l\u0027onere sull\u0027intermediario perche\u0027 agisca nel miglior interesse del cliente.\nLe altre opzioni: descrivono l\u0027esatto contrario dello spirito della direttiva: la classificazione della clientela resta un pilastro rafforzato, i test di adeguatezza/appropriatezza restano obbligatori e l\u0027informativa sui costi e\u0027 diventata piu\u0027 stringente, non abolita."},{"type":"mcq","prompt":"Qual è la differenza corretta tra valutazione di adeguatezza (suitability) e valutazione di appropriatezza (appropriateness) in MiFID II?","code":"","options":["Sono sinonimi: entrambe valutano solo la situazione finanziaria del cliente","L\u0027adeguatezza si applica a consulenza e gestione di portafoglio e valuta conoscenza/esperienza, situazione finanziaria e obiettivi/tolleranza al rischio; l\u0027appropriatezza si applica ad altri servizi e valuta solo conoscenza ed esperienza","L\u0027adeguatezza valuta solo la conoscenza; l\u0027appropriatezza valuta anche gli obiettivi di investimento","L\u0027appropriatezza è più completa dell\u0027adeguatezza perché include la capacità di sostenere le perdite"],"correct":1,"explanation":"In sintesi: la valutazione di adeguatezza (`suitability`) si applica solo a consulenza e gestione di portafoglio ed e\u0027 la piu\u0027 ampia, perche\u0027 valuta tre dimensioni: conoscenza ed esperienza, situazione finanziaria (inclusa la capacita\u0027 di sostenere perdite) e obiettivi di investimento con la relativa tolleranza al rischio. La valutazione di appropriatezza (`appropriateness`) copre gli altri servizi, tipicamente l\u0027execution su prodotti complessi, e verifica solo conoscenza ed esperienza rispetto al prodotto.\nLe altre opzioni: sbagliano perche\u0027 non sono sinonimi, non si limitano alla situazione finanziaria e invertono l\u0027ampiezza dei due test: e\u0027 l\u0027adeguatezza a includere obiettivi e capacita\u0027 di sostenere le perdite, non l\u0027appropriatezza."},{"type":"truefalse","prompt":"In regime di execution only, per strumenti finanziari non complessi (es. azioni quotate su mercati regolamentati) e su iniziativa del cliente, l\u0027intermediario può non svolgere né la valutazione di adeguatezza né quella di appropriatezza.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero. In regime di `execution only` la `MiFID II` esenta l\u0027intermediario da qualsiasi test al ricorrere congiunto di tre condizioni: strumento finanziario non complesso, servizio prestato su iniziativa del cliente e avvertenza al cliente che l\u0027appropriatezza non viene valutata. L\u0027adeguatezza non entra comunque in gioco perche\u0027 non c\u0027e\u0027 ne\u0027 consulenza ne\u0027 gestione.\nLe altre opzioni: l\u0027errore tipico e\u0027 dimenticare il requisito della non complessita\u0027: se lo strumento fosse complesso, il test di appropriatezza tornerebbe obbligatorio anche su iniziativa del cliente."},{"type":"mcq","prompt":"Nel contesto della product governance MiFID II, cosa si intende per \u0027target market\u0027?","code":"","options":["Il mercato geografico in cui il prodotto può essere venduto","L\u0027insieme dei clienti per cui il prodotto è compatibile in base a bisogni, caratteristiche e obiettivi, individuato dal produttore (manufacturer) e affinato dal distributore","Il rendimento minimo che il prodotto deve garantire al cliente","La quota di mercato che l\u0027emittente punta a raggiungere con il prodotto"],"correct":1,"explanation":"In sintesi: il `target market` e\u0027 l\u0027insieme dei clienti per cui il prodotto e\u0027 compatibile in base a bisogni, caratteristiche e obiettivi. Nella `product governance` il produttore (`manufacturer`) definisce un target market positivo e uno negativo, e il distributore lo affina rispetto alla propria clientela concreta. E\u0027 lo strumento che lega la progettazione del prodotto al cliente finale.\nLe altre opzioni: confondono il target market con concetti commerciali estranei: non e\u0027 un mercato geografico, non e\u0027 un rendimento garantito e non e\u0027 una quota di mercato che l\u0027emittente punta a conquistare."},{"type":"mcq","prompt":"Cosa richiede l\u0027obbligo di best execution in MiFID II?","code":"","options":["Eseguire sempre l\u0027ordine sul mercato con il prezzo più basso, ignorando ogni altro fattore","Adottare tutte le misure sufficienti per ottenere il miglior risultato possibile per il cliente considerando prezzo, costi, rapidità, probabilità di esecuzione e regolamento e altri fattori rilevanti","Garantire contrattualmente al cliente il miglior prezzo di mercato su ogni singolo ordine","Eseguire tutti gli ordini esclusivamente su mercati regolamentati e mai su MTF o internalizzatori"],"correct":1,"explanation":"In sintesi: la `best execution` obbliga l\u0027intermediario ad adottare tutte le misure sufficienti per ottenere il miglior risultato possibile per il cliente, bilanciando piu\u0027 fattori: prezzo, costi, rapidita\u0027, probabilita\u0027 di esecuzione e di regolamento, dimensione e natura dell\u0027ordine. Per il retail il best result si misura sul corrispettivo totale, cioe\u0027 prezzo piu\u0027 costi, ma resta un obbligo di mezzi sulla policy, non un risultato garantito.\nLe altre opzioni: sbagliano perche\u0027 non basta il prezzo piu\u0027 basso ignorando gli altri fattori, non e\u0027 una garanzia contrattuale sul singolo ordine e le sedi ammesse includono mercati regolamentati, `MTF`, `OTF` e internalizzatori sistematici, non solo i mercati regolamentati."},{"type":"mcq","prompt":"Qual è la differenza tra informativa sui costi ex-ante ed ex-post in MiFID II?","code":"","options":["L\u0027ex-ante è fornita prima della prestazione del servizio con costi stimati aggregati; l\u0027ex-post è fornita periodicamente (almeno annualmente) con i costi effettivamente sostenuti","L\u0027ex-ante riguarda solo i costi dello strumento, l\u0027ex-post solo quelli del servizio","L\u0027ex-ante è opzionale, l\u0027ex-post è obbligatoria solo per i clienti professionali","Sono identiche ma con destinatari diversi: ex-ante per il retail, ex-post per le controparti qualificate"],"correct":0,"explanation":"In sintesi: l\u0027informativa `ex-ante` e\u0027 fornita prima della prestazione del servizio e presenta una stima aggregata di tutti i costi e oneri, sia del servizio sia dello strumento, con l\u0027effetto cumulativo sul rendimento; l\u0027informativa `ex-post` e\u0027 fornita periodicamente, almeno annualmente, e riporta i costi effettivamente sostenuti dal cliente. Entrambe aggregano costo del servizio e costo dello strumento.\nLe altre opzioni: sbagliano perche\u0027 non c\u0027e\u0027 una separazione servizio/strumento tra ex-ante ed ex-post, l\u0027ex-ante non e\u0027 opzionale per il retail e la disciplina non riguarda solo i clienti professionali o le controparti qualificate."},{"type":"mcq","prompt":"Come classifica MiFID II le categorie di clientela in ordine crescente di livello di protezione (dalla minore alla maggiore)?","code":"","options":["Cliente al dettaglio (retail), cliente professionale, controparte qualificata","Controparte qualificata, cliente professionale, cliente al dettaglio (retail)","Cliente professionale, cliente al dettaglio, controparte qualificata","Le categorie garantiscono tutte lo stesso livello di protezione"],"correct":1,"explanation":"In sintesi: in ordine crescente di protezione la gerarchia e\u0027 controparte qualificata, cliente professionale, cliente al dettaglio. Il retail gode del massimo grado di tutela, il professionale di una protezione intermedia perche\u0027 si presume abbia esperienza e conoscenze, la controparte qualificata (`eligible counterparty`), tipicamente banche e fondi nell\u0027operativita\u0027 all\u0027ingrosso, ha il livello piu\u0027 basso.\nLe altre opzioni: invertono la gerarchia delle tutele o negano che esista una differenziazione: la prima elenca in ordine decrescente, non crescente."},{"type":"truefalse","prompt":"Un cliente classificato come controparte qualificata può richiedere un trattamento come cliente professionale o retail per ottenere un maggior livello di protezione.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero. La classificazione `MiFID II` non e\u0027 rigida: una controparte qualificata puo\u0027 chiedere di essere trattata come cliente professionale o retail, cosi\u0027 come un professionale puo\u0027 chiedere il trattamento retail, per ottenere maggiori tutele. Esiste anche il movimento inverso, il retail che diventa professionale su richiesta, ma solo al ricorrere di requisiti quantitativi e qualitativi.\nLe altre opzioni: l\u0027errore tipico e\u0027 credere che la categoria sia immodificabile: l\u0027opt-in verso una protezione piu\u0027 elevata e\u0027 un principio cardine della direttiva."},{"type":"mcq","prompt":"Nell\u0027ambito della IDD (Insurance Distribution Directive), cosa indica l\u0027acronimo POG?","code":"","options":["Policy Onboarding Guidelines: le linee guida per l\u0027apertura di una polizza","Product Oversight and Governance: i requisiti di governo e controllo del prodotto assicurativo lungo il suo ciclo di vita","Premium Optimization Grid: la griglia di ottimizzazione del premio","Personal Obligation Guarantee: la garanzia di obbligo personale del distributore"],"correct":1,"explanation":"In sintesi: `POG` sta per `Product Oversight and Governance`, i requisiti introdotti dalla `IDD` che impongono a produttori e distributori di prodotti assicurativi di definire un processo di approvazione del prodotto, individuare un target market, testare il prodotto e monitorarlo lungo tutto il ciclo di vita, in analogia con la product governance della `MiFID II`.\nLe altre opzioni: sono acronimi inventati che non esistono nella normativa IDD: \u0027Policy Onboarding Guidelines\u0027, \u0027Premium Optimization Grid\u0027 e \u0027Personal Obligation Guarantee\u0027 sono distrattori privi di fondamento."},{"type":"mcq","prompt":"Che cos\u0027è l\u0027IPID previsto dalla IDD?","code":"","options":["Un identificativo univoco dell\u0027intermediario assicurativo","L\u0027Insurance Product Information Document: un documento standardizzato e sintetico che illustra le caratteristiche principali di un prodotto assicurativo danni (non-life)","Un registro europeo dei sinistri","Il codice fiscale internazionale del contraente della polizza"],"correct":1,"explanation":"In sintesi: l\u0027`IPID` e\u0027 l\u0027`Insurance Product Information Document`, un documento precontrattuale standardizzato e sintetico introdotto dalla `IDD` per i prodotti assicurativi non-vita (danni), che illustra in modo chiaro e comparabile coperture, esclusioni, obblighi e modalita\u0027. E\u0027 l\u0027analogo, per i danni, del `KID` per i prodotti d\u0027investimento.\nLe altre opzioni: sbagliano perche\u0027 l\u0027IPID non e\u0027 un identificativo dell\u0027intermediario, ne\u0027 un registro europeo dei sinistri, ne\u0027 un codice fiscale del contraente."},{"type":"mcq","prompt":"Cosa impone il \u0027demands and needs test\u0027 (test di richieste ed esigenze) della IDD?","code":"","options":["Che ogni contratto assicurativo proposto sia coerente con le richieste ed esigenze del cliente, individuate prima della conclusione del contratto","Che il cliente compili obbligatoriamente un questionario di gradimento dopo la vendita","Che il distributore verifichi solo la solvibilità economica del cliente","Che venga calcolato il premio minimo di mercato per il prodotto"],"correct":0,"explanation":"In sintesi: il `demands and needs test` impone che, prima della conclusione di qualsiasi contratto assicurativo, il distributore individui, sulla base delle informazioni ottenute dal cliente, le sue richieste ed esigenze e proponga un contratto coerente con esse. E\u0027 un requisito minimo che si applica a ogni vendita, anche in assenza di consulenza, a tutela dell\u0027adeguatezza della copertura.\nLe altre opzioni: non e\u0027 un questionario di gradimento post-vendita, non si limita alla verifica della solvibilita\u0027 del cliente e non e\u0027 un calcolo del premio minimo di mercato."},{"type":"mcq","prompt":"Cosa sono i prodotti IBIP nella normativa assicurativa/finanziaria?","code":"","options":["Prodotti bancari a capitale garantito","Insurance-Based Investment Products: prodotti assicurativi con una componente di investimento il cui valore è esposto a fluttuazioni di mercato (es. polizze unit-linked)","Prodotti interbancari di pagamento istantaneo","Fondi comuni monetari a breve termine"],"correct":1,"explanation":"In sintesi: gli `IBIP` sono gli `Insurance-Based Investment Products`, prodotti assicurativi con una componente di investimento il cui valore a scadenza o di riscatto e\u0027 esposto alle fluttuazioni dei mercati, tipicamente le polizze `unit-linked` e `index-linked`. Per la natura ibrida sono soggetti a regole rafforzate, tra cui test di adeguatezza di derivazione MiFID e `KID PRIIPs`.\nLe altre opzioni: sbagliano perche\u0027 gli IBIP non sono prodotti bancari a capitale garantito, non sono strumenti di pagamento interbancario e non sono fondi comuni monetari."},{"type":"mcq","prompt":"Quale delle seguenti NON è una base giuridica valida per il trattamento di dati personali ai sensi dell\u0027art. 6 GDPR?","code":"","options":["Il consenso dell\u0027interessato","L\u0027esecuzione di un contratto di cui l\u0027interessato è parte","Il legittimo interesse del titolare del trattamento","Il semplice fatto che i dati siano tecnicamente disponibili e accessibili al titolare"],"correct":3,"explanation":"In sintesi: la mera disponibilita\u0027 tecnica del dato NON e\u0027 una base giuridica valida. L\u0027art. 6 `GDPR` elenca in modo tassativo sei basi: consenso, esecuzione di un contratto, obbligo legale, interessi vitali, compito di interesse pubblico e legittimo interesse. Trattare un dato solo perche\u0027 e\u0027 accessibile viola il principio di liceita\u0027.\nLe altre opzioni: consenso, esecuzione del contratto e legittimo interesse sono tre delle sei basi valide espressamente previste dall\u0027art. 6, quindi sono risposte corrette e non l\u0027eccezione cercata."},{"type":"mcq","prompt":"Quale tra i seguenti è un diritto dell\u0027interessato espressamente riconosciuto dal GDPR?","code":"","options":["Il diritto alla portabilità dei dati (art. 20)","Il diritto a ottenere un risarcimento automatico per ogni accesso ai propri dati","Il diritto a impedire a chiunque, incluse le autorità giudiziarie, di trattare i propri dati","Il diritto a essere pagato dal titolare per l\u0027uso commerciale dei propri dati"],"correct":0,"explanation":"In sintesi: il `GDPR` riconosce espressamente il diritto alla portabilita\u0027 dei dati all\u0027art. 20: l\u0027interessato puo\u0027 ricevere i dati che lo riguardano in un formato strutturato, di uso comune e leggibile da dispositivo automatico, e trasmetterli ad altro titolare.\nLe altre opzioni: sbagliano perche\u0027 non esiste un risarcimento automatico (l\u0027art. 82 presuppone un danno), non c\u0027e\u0027 un diritto assoluto di bloccare i trattamenti necessari per obblighi legali o giudiziari e il GDPR non prevede un diritto a essere remunerati per l\u0027uso dei propri dati."},{"type":"mcq","prompt":"In quale caso il GDPR rende obbligatoria la nomina di un DPO (Data Protection Officer)?","code":"","options":["Sempre, per qualunque azienda che tratti anche un solo dato personale","Quando il trattamento è effettuato da un\u0027autorità pubblica, oppure le attività principali del titolare richiedono monitoraggio regolare e sistematico su larga scala, oppure il trattamento su larga scala di categorie particolari di dati","Solo per le aziende con più di 250 dipendenti","Mai: la nomina del DPO è sempre facoltativa"],"correct":1,"explanation":"In sintesi: l\u0027art. 37 `GDPR` rende obbligatoria la nomina del `DPO` in tre casi: trattamento svolto da un\u0027autorita\u0027 o organismo pubblico; attivita\u0027 principali che consistono in un monitoraggio regolare e sistematico degli interessati su larga scala; attivita\u0027 principali che consistono nel trattamento su larga scala di categorie particolari di dati (art. 9) o di dati giudiziari.\nLe altre opzioni: non e\u0027 sempre obbligatorio ne\u0027 sempre facoltativo, e la soglia non e\u0027 il numero di dipendenti: il criterio dei 250 dipendenti riguarda l\u0027art. 30 sul registro dei trattamenti, un obbligo diverso."},{"type":"truefalse","prompt":"Ai sensi del GDPR, in caso di violazione dei dati personali (data breach) che presenti un rischio per i diritti e le libertà delle persone fisiche, il titolare deve notificare l\u0027autorità di controllo senza ingiustificato ritardo e, ove possibile, entro 72 ore da quando ne è venuto a conoscenza.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero. L\u0027art. 33 `GDPR` impone al titolare di notificare il `data breach` all\u0027autorita\u0027 di controllo senza ingiustificato ritardo e, ove possibile, entro 72 ore da quando ne e\u0027 venuto a conoscenza, salvo che sia improbabile un rischio per i diritti e le liberta\u0027 delle persone fisiche. Oltre le 72 ore la notifica va corredata delle ragioni del ritardo.\nLe altre opzioni: l\u0027errore tipico e\u0027 confondere la notifica all\u0027autorita\u0027 con la comunicazione agli interessati (art. 34), che scatta solo in caso di rischio elevato."},{"type":"mcq","prompt":"Cosa stabilisce il principio di minimizzazione dei dati (data minimisation) del GDPR?","code":"","options":["Che i dati vanno conservati per il minor tempo tecnicamente possibile, indipendentemente dalla finalità","Che i dati personali devono essere adeguati, pertinenti e limitati a quanto necessario rispetto alle finalità del trattamento","Che occorre raccogliere il maggior numero di dati possibile per poterli minimizzare in seguito","Che i dati devono essere sempre anonimizzati prima della raccolta"],"correct":1,"explanation":"In sintesi: il principio di minimizzazione (art. 5.1.c `GDPR`) impone che i dati personali siano adeguati, pertinenti e limitati a quanto necessario rispetto alle finalita\u0027 del trattamento: si raccoglie solo cio\u0027 che serve allo scopo.\nLe altre opzioni: il tempo di conservazione e\u0027 oggetto del distinto principio di limitazione della conservazione (art. 5.1.e), raccogliere il massimo dei dati contraddice apertamente la minimizzazione e l\u0027anonimizzazione preventiva non e\u0027 richiesta, perche\u0027 i dati servono proprio identificabili per la finalita\u0027."},{"type":"mcq","prompt":"Quando è obbligatorio svolgere una DPIA (Data Protection Impact Assessment) secondo il GDPR?","code":"","options":["Per ogni trattamento di dati personali, senza eccezioni","Quando un tipo di trattamento, tenuto conto di natura, oggetto, contesto e finalità, può presentare un rischio elevato per i diritti e le libertà delle persone fisiche","Solo dopo che si è verificato un data breach","Solo se lo richiede espressamente l\u0027interessato"],"correct":1,"explanation":"In sintesi: l\u0027art. 35 `GDPR` rende obbligatoria la `DPIA` quando un tipo di trattamento, tenuto conto di natura, oggetto, contesto e finalita\u0027 e spesso in presenza di nuove tecnologie, puo\u0027 presentare un rischio elevato per i diritti e le liberta\u0027 delle persone fisiche: casi tipici sono profilazione su larga scala, trattamento su larga scala di dati particolari e monitoraggio sistematico di zone pubbliche.\nLe altre opzioni: la DPIA e\u0027 una valutazione preventiva, non richiesta per ogni trattamento, non successiva a un breach e non dipendente dalla richiesta dell\u0027interessato."},{"type":"truefalse","prompt":"Ai sensi del GDPR il consenso, per essere valido, deve essere libero, specifico, informato e inequivocabile, e l\u0027interessato deve poterlo revocare in qualsiasi momento con la stessa facilità con cui lo ha prestato.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: e\u0027 vero. Gli artt. 4(11) e 7 `GDPR` definiscono il consenso come manifestazione di volonta\u0027 libera, specifica, informata e inequivocabile, espressa con una dichiarazione o un\u0027azione positiva inequivocabile: niente caselle preselezionate ne\u0027 silenzio. L\u0027art. 7.3 aggiunge il diritto di revoca in qualsiasi momento, con la stessa facilita\u0027 con cui il consenso e\u0027 stato prestato, senza pregiudicare la liceita\u0027 del trattamento gia\u0027 svolto.\nLe altre opzioni: l\u0027errore tipico e\u0027 trattare questi requisiti come alternativi: sono invece cumulativi e devono ricorrere tutti insieme."},{"type":"mcq","prompt":"Il diritto alla cancellazione (\u0027diritto all\u0027oblio\u0027, art. 17 GDPR) è un diritto assoluto?","code":"","options":["Sì, il titolare deve sempre cancellare i dati su richiesta, senza eccezioni","No: incontra eccezioni, ad esempio quando il trattamento è necessario per adempiere un obbligo legale o per l\u0027accertamento/esercizio/difesa di un diritto in sede giudiziaria","Sì, ma solo per i dati trattati sulla base del legittimo interesse","No, perché il diritto all\u0027oblio non è previsto dal GDPR ma solo dalla giurisprudenza"],"correct":1,"explanation":"In sintesi: il diritto alla cancellazione (`diritto all\u0027oblio`, art. 17 `GDPR`) non e\u0027 assoluto. L\u0027art. 17.3 elenca eccezioni in cui non si applica, tra cui l\u0027adempimento di un obbligo legale, rilevante in ambito bancario per la conservazione documentale `AML`, la liberta\u0027 di espressione, motivi di interesse pubblico e l\u0027accertamento, esercizio o difesa di un diritto in sede giudiziaria.\nLe altre opzioni: sbagliano perche\u0027 il titolare non deve cancellare sempre e senza eccezioni, il diritto e\u0027 espressamente codificato nel GDPR e non solo giurisprudenziale, e le eccezioni non si limitano al legittimo interesse."},{"type":"mcq","prompt":"A quali trattamenti si applica il diritto alla portabilità dei dati (art. 20 GDPR)?","code":"","options":["A tutti i trattamenti, qualunque sia la base giuridica e la modalità","Solo ai trattamenti basati sul consenso o su un contratto e effettuati con mezzi automatizzati","Solo ai dati trattati per obbligo le
