ery to load N parent entities and then, by lazily accessing an association on each one, you trigger 1 query per parent: a total of 1+N queries instead of a single `SELECT` with a `JOIN`. It is a serious performance degradation caused by the excess of round-trips to the database.\nThe other options: it is not a row-count error from a `JOIN`; it is not a simple missing index; and it is not a deadlock between concurrent transactions."}},{"type":"mcq","prompt":{"it":"Qual e un rimedio corretto al problema N+1 in un ORM come JPA/Hibernate?","en":"What is a correct remedy for the N+1 problem in an ORM like JPA/Hibernate?"},"code":"","options":[{"it":"Usare un fetch join / eager fetch mirato o il batch fetching per caricare le associazioni in una (o poche) query","en":"Use a targeted fetch join / eager fetch or batch fetching to load the associations in one (or a few) queries"},{"it":"Aumentare il livello di isolamento a SERIALIZABLE","en":"Raise the isolation level to SERIALIZABLE"},{"it":"Rimuovere tutti gli indici dalle tabelle figlie","en":"Remove all indexes from the child tables"},{"it":"Disabilitare la cache di primo livello (persistence context)","en":"Disable the first-level cache (persistence context)"}],"correct":0,"explanation":{"it":"In sintesi: il rimedio e ridurre i round-trip caricando padri e associazioni in poche query: un `JOIN FETCH` (JPQL) o un\u0027entity graph le porta in una sola query, oppure il batch fetching (`@BatchSize` / `hibernate.default_batch_fetch_size`) raggruppa i caricamenti in poche `IN`-query.\nLe altre opzioni: alzare l\u0027isolamento a `SERIALIZABLE` riguarda la concorrenza, non il numero di query; rimuovere gli indici peggiora le prestazioni; e disabilitare la cache di primo livello (persistence context) non riduce le query e puo aumentarle.","en":"In summary: the remedy is to reduce round-trips by loading parents and associations in a few queries: a `JOIN FETCH` (JPQL) or an entity graph brings them in a single query, or batch fetching (`@BatchSize` / `hibernate.default_batch_fetch_size`) groups the loads into a few `IN`-queries.\nThe other options: raising the isolation to `SERIALIZABLE` concerns concurrency, not the number of queries; removing indexes worsens performance; and disabling the first-level cache (persistence context) does not reduce queries and may increase them."}},{"type":"mcq","prompt":{"it":"Due transazioni si bloccano a vicenda: T1 detiene un lock su A e attende B, T2 detiene B e attende A. Come si chiama la situazione e qual e una prevenzione comune?","en":"Two transactions block each other: T1 holds a lock on A and waits for B, T2 holds B and waits for A. What is this situation called, and what is a common way to prevent it?"},"code":"","options":[{"it":"E un deadlock; una tecnica di prevenzione comune e acquisire i lock sempre nello stesso ordine coerente in tutte le transazioni","en":"It is a deadlock; a common prevention technique is to always acquire locks in the same consistent order across all transactions"},{"it":"E una normale attesa; si risolve solo aumentando il timeout all\u0027infinito","en":"It is a normal wait; it is solved only by raising the timeout to infinity"},{"it":"E una race condition risolvibile unicamente con SERIALIZABLE","en":"It is a race condition solvable only with SERIALIZABLE"},{"it":"E un phantom read; si previene con un covering index","en":"It is a phantom read; it is prevented with a covering index"}],"correct":0,"explanation":{"it":"In sintesi: e un deadlock, un ciclo di attese reciproche in cui T1 tiene A e attende B mentre T2 tiene B e attende A, cosi nessuna procede. La maggior parte dei DBMS lo rileva e fa il rollback di una transazione (deadlock victim). Una prevenzione efficace e acquisire i lock SEMPRE nello stesso ordine coerente in tutte le transazioni, spezzando la possibilita del ciclo.\nLe altre opzioni: non e una normale attesa e aumentare il timeout all\u0027infinito peggiora; non e una race condition risolvibile solo con `SERIALIZABLE`; e non e un phantom read, ne si previene con un covering index.","en":"In summary: it is a deadlock, a cycle of mutual waits in which T1 holds A and waits for B while T2 holds B and waits for A, so neither one proceeds. Most DBMSs detect it and roll back one transaction (the deadlock victim). An effective prevention is to ALWAYS acquire locks in the same consistent order across all transactions, breaking the possibility of the cycle.\nThe other options: it is not a normal wait, and raising the timeout to infinity only makes it worse; it is not a race condition solvable only with `SERIALIZABLE`; and it is not a phantom read, nor is it prevented with a covering index."}},{"type":"code","prompt":{"it":"Dato lo schema e i dati, cosa succede eseguendo il DELETE?","en":"Given the schema and the data, what happens when the DELETE is executed?"},"code":"CREATE TABLE orders (\n  id INT PRIMARY KEY,\n  customer_id INT REFERENCES customers(id) ON DELETE CASCADE\n);\n-- Esiste customers(id=5) con 3 righe collegate in orders.\n\nDELETE FROM customers WHERE id = 5;","options":[{"it":"Il cliente 5 e le sue 3 righe in orders vengono eliminati automaticamente","en":"Customer 5 and its 3 rows in orders are deleted automatically"},{"it":"Errore: violazione di foreign key, il DELETE viene rifiutato","en":"Error: foreign key violation, the DELETE is rejected"},{"it":"Il cliente viene eliminato e le 3 righe orders restano con customer_id orfano","en":"The customer is deleted and the 3 orders rows are left with an orphan customer_id"},{"it":"Le 3 righe orders vengono impostate a customer_id = NULL","en":"The 3 orders rows are set to customer_id = NULL"}],"correct":0,"explanation":{"it":"In sintesi: la clausola `ON DELETE CASCADE` propaga la cancellazione dal padre ai figli: eliminando `customers` con `id=5`, il database rimuove automaticamente anche le 3 righe di `orders` che lo referenziano, mantenendo l\u0027integrita referenziale.\nLe altre opzioni: l\u0027errore di violazione FK si otterrebbe con `ON DELETE RESTRICT`/`NO ACTION`; le righe orfane non sono possibili proprio grazie alla FK; e il `customer_id` a `NULL` avverrebbe con `ON DELETE SET NULL`, non con `CASCADE`.","en":"In summary: the `ON DELETE CASCADE` clause propagates the deletion from the parent to the children: deleting `customers` with `id=5`, the database automatically also removes the 3 rows in `orders` that reference it, preserving referential integrity.\nThe other options: a FK violation error would occur with `ON DELETE RESTRICT`/`NO ACTION`; orphan rows are not possible precisely because of the FK; and `customer_id` set to `NULL` would happen with `ON DELETE SET NULL`, not with `CASCADE`."}},{"type":"mcq","prompt":{"it":"Qual e una differenza corretta tra PRIMARY KEY e un vincolo UNIQUE?","en":"What is a correct difference between a PRIMARY KEY and a UNIQUE constraint?"},"code":"","options":[{"it":"La PRIMARY KEY e unica e implicitamente NOT NULL, e ce ne puo essere una sola per tabella; UNIQUE ammette (in genere) valori NULL e possono esserci piu vincoli UNIQUE","en":"The PRIMARY KEY is unique and implicitly NOT NULL, and there can be only one per table; UNIQUE (generally) allows NULL values and there can be multiple UNIQUE constraints"},{"it":"Sono identici sotto ogni aspetto","en":"They are identical in every respect"},{"it":"UNIQUE non crea alcun indice, mentre PRIMARY KEY si","en":"UNIQUE does not create any index, whereas PRIMARY KEY does"},{"it":"La PRIMARY KEY ammette NULL, mentre UNIQUE non lo ammette","en":"The PRIMARY KEY allows NULL, whereas UNIQUE does not"}],"correct":0,"explanation":{"it":"In sintesi: la `PRIMARY KEY` identifica univocamente ogni riga, e implicitamente `NOT NULL` e ne esiste una sola per tabella. Un vincolo `UNIQUE` garantisce anch\u0027esso l\u0027unicita ma, secondo lo standard SQL, ammette valori `NULL` (piu `NULL`, perche un `NULL` non e considerato uguale a un altro) e una tabella puo averne piu di uno.\nLe altre opzioni: non sono identici sotto ogni aspetto; entrambi creano tipicamente un indice, quindi e falso che `UNIQUE` non lo crei; e la regola sui `NULL` va invertita, e la `PRIMARY KEY` a vietarli. (Nota: SQL Server ammette un solo `NULL` in un `UNIQUE`, eccezione allo standard.)","en":"In summary: the `PRIMARY KEY` uniquely identifies each row, is implicitly `NOT NULL`, and there is only one per table. A `UNIQUE` constraint also guarantees uniqueness but, according to the SQL standard, it allows `NULL` values (multiple `NULL`s, because one `NULL` is not considered equal to another) and a table can have more than one.\nThe other options: they are not identical in every respect; both typically create an index, so it is false that `UNIQUE` does not; and the rule about `NULL`s should be reversed, it is the `PRIMARY KEY` that forbids them. (Note: SQL Server allows only a single `NULL` in a `UNIQUE`, an exception to the standard.)"}},{"type":"code","prompt":{"it":"STRETCH. Quali valori assume la colonna running per le tre righe (ordinate per id)?","en":"STRETCH. What values does the running column take for the three rows (ordered by id)?"},"code":"-- t(id, val), ordinata per id:\n-- (1, 10), (2, 20), (3, 30)\n\nSELECT id,\n  SUM(val) OVER (\n    ORDER BY id\n    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n  ) AS running\nFROM t;","options":[{"it":"10, 30, 60","en":"10, 30, 60"},{"it":"10, 20, 30","en":"10, 20, 30"},{"it":"60, 60, 60","en":"60, 60, 60"},{"it":"10, 20, 60","en":"10, 20, 60"}],"correct":0,"explanation":{"it":"In sintesi: il frame `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` calcola un totale cumulativo (running total): per ogni riga somma tutti i valori dalla prima fino alla riga corrente. Riga 1: 10; riga 2: 10+20 = 30; riga 3: 10+20+30 = 60. La window function non collassa le righe, a differenza di `SUM` con `GROUP BY`.\nLe altre opzioni: 10,20,30 sarebbe il valore grezzo senza cumulo; 60,60,60 sarebbe la somma su tutta la partizione (frame `UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`); 10,20,60 non corrisponde ad alcun frame coerente.","en":"In summary: the frame `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` computes a running total: for each row it sums all the values from the first up to the current row. Row 1: 10; row 2: 10+20 = 30; row 3: 10+20+30 = 60. The window function does not collapse the rows, unlike `SUM` with `GROUP BY`.\nThe other options: 10,20,30 would be the raw value with no accumulation; 60,60,60 would be the sum over the entire partition (frame `UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`); 10,20,60 does not correspond to any coherent frame."}}]},{"id":"banking","title":"Banking \u0026 Fintech (MiFID II, IDD, GDPR)","questions":[{"type":"mcq","prompt":{"it":"Qual è uno degli obiettivi principali introdotti dalla MiFID II (Directive 2014/65/EU) rispetto alla MiFID I?","en":"What is one of the main objectives introduced by MiFID II (Directive 2014/65/EU) compared to MiFID I?"},"code":"","options":[{"it":"Rafforzare la protezione dell\u0027investitore e la trasparenza dei mercati, riducendo il trading opaco (dark pools) e migliorando la governance dei prodotti","en":"To strengthen investor protection and market transparency, curbing opaque trading (dark pools) and improving product governance"},{"it":"Abolire l\u0027obbligo di classificazione della clientela per semplificare l\u0027operatività","en":"To abolish the client classification requirement in order to simplify operations"},{"it":"Consentire alle banche di vendere qualsiasi prodotto senza valutare la conoscenza del cliente","en":"To allow banks to sell any product without assessing the client\u0027s knowledge"},{"it":"Eliminare l\u0027obbligo di informativa sui costi per i clienti retail","en":"To eliminate the cost disclosure requirement for retail clients"}],"correct":0,"explanation":{"it":"In sintesi: la `MiFID II` nasce come risposta alla crisi del 2008 e ha come obiettivo cardine rafforzare la protezione dell\u0027investitore e la trasparenza dei mercati, portando in luce il trading opaco delle `dark pools` e degli scambi `OTC`, disciplinando le trading venue e introducendo la `product governance`. La logica di fondo e\u0027 spostare l\u0027onere sull\u0027intermediario perche\u0027 agisca nel miglior interesse del cliente.\nLe altre opzioni: descrivono l\u0027esatto contrario dello spirito della direttiva: la classificazione della clientela resta un pilastro rafforzato, i test di adeguatezza/appropriatezza restano obbligatori e l\u0027informativa sui costi e\u0027 diventata piu\u0027 stringente, non abolita.","en":"In summary: `MiFID II` emerged as a response to the 2008 crisis, and its core objective is to strengthen investor protection and market transparency, bringing to light the opaque trading of `dark pools` and `OTC` transactions, regulating trading venues and introducing `product governance`. The underlying rationale is to shift the burden onto the intermediary so that it acts in the client\u0027s best interest.\nThe other options: describe the exact opposite of the directive\u0027s spirit: client classification remains a reinforced pillar, the suitability/appropriateness tests remain mandatory, and cost disclosure has become more stringent, not abolished."}},{"type":"mcq","prompt":{"it":"Qual è la differenza corretta tra valutazione di adeguatezza (suitability) e valutazione di appropriatezza (appropriateness) in MiFID II?","en":"What is the correct difference between the suitability assessment and the appropriateness assessment under MiFID II?"},"code":"","options":[{"it":"Sono sinonimi: entrambe valutano solo la situazione finanziaria del cliente","en":"They are synonyms: both assess only the client\u0027s financial situation"},{"it":"L\u0027adeguatezza si applica a consulenza e gestione di portafoglio e valuta conoscenza/esperienza, situazione finanziaria e obiettivi/tolleranza al rischio; l\u0027appropriatezza si applica ad altri servizi e valuta solo conoscenza ed esperienza","en":"Suitability applies to advice and portfolio management and assesses knowledge/experience, financial situation and objectives/risk tolerance; appropriateness applies to other services and assesses only knowledge and experience"},{"it":"L\u0027adeguatezza valuta solo la conoscenza; l\u0027appropriatezza valuta anche gli obiettivi di investimento","en":"Suitability assesses only knowledge; appropriateness also assesses investment objectives"},{"it":"L\u0027appropriatezza è più completa dell\u0027adeguatezza perché include la capacità di sostenere le perdite","en":"Appropriateness is more comprehensive than suitability because it includes the ability to bear losses"}],"correct":1,"explanation":{"it":"In sintesi: la valutazione di adeguatezza (`suitability`) si applica solo a consulenza e gestione di portafoglio ed e\u0027 la piu\u0027 ampia, perche\u0027 valuta tre dimensioni: conoscenza ed esperienza, situazione finanziaria (inclusa la capacita\u0027 di sostenere perdite) e obiettivi di investimento con la relativa tolleranza al rischio. La valutazione di appropriatezza (`appropriateness`) copre gli altri servizi, tipicamente l\u0027execution su prodotti complessi, e verifica solo conoscenza ed esperienza rispetto al prodotto.\nLe altre opzioni: sbagliano perche\u0027 non sono sinonimi, non si limitano alla situazione finanziaria e invertono l\u0027ampiezza dei due test: e\u0027 l\u0027adeguatezza a includere obiettivi e capacita\u0027 di sostenere le perdite, non l\u0027appropriatezza.","en":"In summary: the `suitability` assessment applies only to advice and portfolio management and is the broader of the two, because it assesses three dimensions: knowledge and experience, financial situation (including the ability to bear losses) and investment objectives with the related risk tolerance. The `appropriateness` assessment covers the other services, typically execution of complex products, and checks only knowledge and experience in relation to the product.\nThe other options: are wrong because the two are not synonyms, they are not limited to the financial situation, and they reverse the scope of the two tests: it is suitability that includes objectives and the ability to bear losses, not appropriateness."}},{"type":"truefalse","prompt":{"it":"In regime di execution only, per strumenti finanziari non complessi (es. azioni quotate su mercati regolamentati) e su iniziativa del cliente, l\u0027intermediario può non svolgere né la valutazione di adeguatezza né quella di appropriatezza.","en":"Under an execution-only regime, for non-complex financial instruments (e.g. shares listed on regulated markets) and at the client\u0027s initiative, the intermediary may perform neither the suitability assessment nor the appropriateness assessment."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero. In regime di `execution only` la `MiFID II` esenta l\u0027intermediario da qualsiasi test al ricorrere congiunto di tre condizioni: strumento finanziario non complesso, servizio prestato su iniziativa del cliente e avvertenza al cliente che l\u0027appropriatezza non viene valutata. L\u0027adeguatezza non entra comunque in gioco perche\u0027 non c\u0027e\u0027 ne\u0027 consulenza ne\u0027 gestione.\nLe altre opzioni: l\u0027errore tipico e\u0027 dimenticare il requisito della non complessita\u0027: se lo strumento fosse complesso, il test di appropriatezza tornerebbe obbligatorio anche su iniziativa del cliente.","en":"In summary: it is true. Under an `execution only` regime, `MiFID II` exempts the intermediary from any test when three conditions are jointly met: a non-complex financial instrument, a service provided at the client\u0027s initiative, and a warning to the client that appropriateness is not being assessed. Suitability does not come into play in any case because there is neither advice nor management.\nThe other options: the typical mistake is to forget the non-complexity requirement: if the instrument were complex, the appropriateness test would become mandatory again, even at the client\u0027s initiative."}},{"type":"mcq","prompt":{"it":"Nel contesto della product governance MiFID II, cosa si intende per \u0027target market\u0027?","en":"In the context of MiFID II product governance, what is meant by \u0027target market\u0027?"},"code":"","options":[{"it":"Il mercato geografico in cui il prodotto può essere venduto","en":"The geographic market in which the product can be sold"},{"it":"L\u0027insieme dei clienti per cui il prodotto è compatibile in base a bisogni, caratteristiche e obiettivi, individuato dal produttore (manufacturer) e affinato dal distributore","en":"The set of clients for whom the product is compatible based on their needs, characteristics and objectives, identified by the manufacturer and refined by the distributor"},{"it":"Il rendimento minimo che il prodotto deve garantire al cliente","en":"The minimum return that the product must guarantee to the client"},{"it":"La quota di mercato che l\u0027emittente punta a raggiungere con il prodotto","en":"The market share the issuer aims to reach with the product"}],"correct":1,"explanation":{"it":"In sintesi: il `target market` e\u0027 l\u0027insieme dei clienti per cui il prodotto e\u0027 compatibile in base a bisogni, caratteristiche e obiettivi. Nella `product governance` il produttore (`manufacturer`) definisce un target market positivo e uno negativo, e il distributore lo affina rispetto alla propria clientela concreta. E\u0027 lo strumento che lega la progettazione del prodotto al cliente finale.\nLe altre opzioni: confondono il target market con concetti commerciali estranei: non e\u0027 un mercato geografico, non e\u0027 un rendimento garantito e non e\u0027 una quota di mercato che l\u0027emittente punta a conquistare.","en":"In summary: the `target market` is the set of clients for whom the product is compatible based on their needs, characteristics and objectives. In `product governance` the manufacturer defines both a positive and a negative target market, and the distributor refines it against its own actual client base. It is the tool that links product design to the end client.\nThe other options: confuse the target market with unrelated commercial concepts: it is not a geographic market, not a guaranteed return, and not a market share the issuer aims to capture."}},{"type":"mcq","prompt":{"it":"Cosa richiede l\u0027obbligo di best execution in MiFID II?","en":"What does the best execution obligation require under MiFID II?"},"code":"","options":[{"it":"Eseguire sempre l\u0027ordine sul mercato con il prezzo più basso, ignorando ogni altro fattore","en":"To always execute the order on the market with the lowest price, ignoring every other factor"},{"it":"Adottare tutte le misure sufficienti per ottenere il miglior risultato possibile per il cliente considerando prezzo, costi, rapidità, probabilità di esecuzione e regolamento e altri fattori rilevanti","en":"To take all sufficient steps to obtain the best possible result for the client, considering price, costs, speed, likelihood of execution and settlement, and other relevant factors"},{"it":"Garantire contrattualmente al cliente il miglior prezzo di mercato su ogni singolo ordine","en":"To contractually guarantee the client the best market price on every single order"},{"it":"Eseguire tutti gli ordini esclusivamente su mercati regolamentati e mai su MTF o internalizzatori","en":"To execute all orders exclusively on regulated markets and never on MTFs or systematic internalisers"}],"correct":1,"explanation":{"it":"In sintesi: la `best execution` obbliga l\u0027intermediario ad adottare tutte le misure sufficienti per ottenere il miglior risultato possibile per il cliente, bilanciando piu\u0027 fattori: prezzo, costi, rapidita\u0027, probabilita\u0027 di esecuzione e di regolamento, dimensione e natura dell\u0027ordine. Per il retail il best result si misura sul corrispettivo totale, cioe\u0027 prezzo piu\u0027 costi, ma resta un obbligo di mezzi sulla policy, non un risultato garantito.\nLe altre opzioni: sbagliano perche\u0027 non basta il prezzo piu\u0027 basso ignorando gli altri fattori, non e\u0027 una garanzia contrattuale sul singolo ordine e le sedi ammesse includono mercati regolamentati, `MTF`, `OTF` e internalizzatori sistematici, non solo i mercati regolamentati.","en":"In summary: `best execution` requires the intermediary to take all sufficient steps to obtain the best possible result for the client, balancing several factors: price, costs, speed, likelihood of execution and settlement, and the size and nature of the order. For retail clients the best result is measured by the total consideration, i.e. price plus costs, but it remains a best-efforts obligation on the policy, not a guaranteed outcome.\nThe other options: are wrong because the lowest price alone is not enough while ignoring the other factors, it is not a contractual guarantee on the single order, and the eligible venues include regulated markets, `MTF`, `OTF` and systematic internalisers, not just regulated markets."}},{"type":"mcq","prompt":{"it":"Qual è la differenza tra informativa sui costi ex-ante ed ex-post in MiFID II?","en":"What is the difference between ex-ante and ex-post cost disclosure under MiFID II?"},"code":"","options":[{"it":"L\u0027ex-ante è fornita prima della prestazione del servizio con costi stimati aggregati; l\u0027ex-post è fornita periodicamente (almeno annualmente) con i costi effettivamente sostenuti","en":"Ex-ante is provided before the service is performed with aggregated estimated costs; ex-post is provided periodically (at least annually) with the costs actually incurred"},{"it":"L\u0027ex-ante riguarda solo i costi dello strumento, l\u0027ex-post solo quelli del servizio","en":"Ex-ante concerns only the costs of the instrument, ex-post only those of the service"},{"it":"L\u0027ex-ante è opzionale, l\u0027ex-post è obbligatoria solo per i clienti professionali","en":"Ex-ante is optional, ex-post is mandatory only for professional clients"},{"it":"Sono identiche ma con destinatari diversi: ex-ante per il retail, ex-post per le controparti qualificate","en":"They are identical but with different recipients: ex-ante for retail clients, ex-post for eligible counterparties"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027informativa `ex-ante` e\u0027 fornita prima della prestazione del servizio e presenta una stima aggregata di tutti i costi e oneri, sia del servizio sia dello strumento, con l\u0027effetto cumulativo sul rendimento; l\u0027informativa `ex-post` e\u0027 fornita periodicamente, almeno annualmente, e riporta i costi effettivamente sostenuti dal cliente. Entrambe aggregano costo del servizio e costo dello strumento.\nLe altre opzioni: sbagliano perche\u0027 non c\u0027e\u0027 una separazione servizio/strumento tra ex-ante ed ex-post, l\u0027ex-ante non e\u0027 opzionale per il retail e la disciplina non riguarda solo i clienti professionali o le controparti qualificate.","en":"In summary: `ex-ante` disclosure is provided before the service is performed and presents an aggregated estimate of all costs and charges, both of the service and of the instrument, together with their cumulative effect on the return; `ex-post` disclosure is provided periodically, at least annually, and reports the costs actually incurred by the client. Both aggregate the cost of the service and the cost of the instrument.\nThe other options: are wrong because there is no service/instrument split between ex-ante and ex-post, ex-ante disclosure is not optional for retail clients, and the rules do not apply only to professional clients or eligible counterparties."}},{"type":"mcq","prompt":{"it":"Come classifica MiFID II le categorie di clientela in ordine crescente di livello di protezione (dalla minore alla maggiore)?","en":"How does MiFID II classify client categories in ascending order of protection (from lowest to highest)?"},"code":"","options":[{"it":"Cliente al dettaglio (retail), cliente professionale, controparte qualificata","en":"Retail client, professional client, eligible counterparty"},{"it":"Controparte qualificata, cliente professionale, cliente al dettaglio (retail)","en":"Eligible counterparty, professional client, retail client"},{"it":"Cliente professionale, cliente al dettaglio, controparte qualificata","en":"Professional client, retail client, eligible counterparty"},{"it":"Le categorie garantiscono tutte lo stesso livello di protezione","en":"The categories all provide the same level of protection"}],"correct":1,"explanation":{"it":"In sintesi: in ordine crescente di protezione la gerarchia e\u0027 controparte qualificata, cliente professionale, cliente al dettaglio. Il retail gode del massimo grado di tutela, il professionale di una protezione intermedia perche\u0027 si presume abbia esperienza e conoscenze, la controparte qualificata (`eligible counterparty`), tipicamente banche e fondi nell\u0027operativita\u0027 all\u0027ingrosso, ha il livello piu\u0027 basso.\nLe altre opzioni: invertono la gerarchia delle tutele o negano che esista una differenziazione: la prima elenca in ordine decrescente, non crescente.","en":"In summary: in ascending order of protection the hierarchy is eligible counterparty, professional client, retail client. Retail clients enjoy the highest degree of protection, professional clients an intermediate level because they are presumed to have experience and knowledge, and the `eligible counterparty`, typically banks and funds in wholesale dealing, has the lowest level.\nThe other options: reverse the hierarchy of protections or deny that any differentiation exists: the first lists them in descending, not ascending, order."}},{"type":"truefalse","prompt":{"it":"Un cliente classificato come controparte qualificata può richiedere un trattamento come cliente professionale o retail per ottenere un maggior livello di protezione.","en":"A client classified as an eligible counterparty may request to be treated as a professional or retail client in order to obtain a higher level of protection."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero. La classificazione `MiFID II` non e\u0027 rigida: una controparte qualificata puo\u0027 chiedere di essere trattata come cliente professionale o retail, cosi\u0027 come un professionale puo\u0027 chiedere il trattamento retail, per ottenere maggiori tutele. Esiste anche il movimento inverso, il retail che diventa professionale su richiesta, ma solo al ricorrere di requisiti quantitativi e qualitativi.\nLe altre opzioni: l\u0027errore tipico e\u0027 credere che la categoria sia immodificabile: l\u0027opt-in verso una protezione piu\u0027 elevata e\u0027 un principio cardine della direttiva.","en":"In summary: it is true. `MiFID II` classification is not rigid: an eligible counterparty may ask to be treated as a professional or retail client, just as a professional client may request retail treatment, in order to obtain greater protection. The reverse move also exists, a retail client becoming professional on request, but only where quantitative and qualitative requirements are met.\nThe other options: the typical mistake is to believe that the category is unchangeable: opting in to a higher level of protection is a cornerstone principle of the directive."}},{"type":"mcq","prompt":{"it":"Nell\u0027ambito della IDD (Insurance Distribution Directive), cosa indica l\u0027acronimo POG?","en":"In the context of the IDD (Insurance Distribution Directive), what does the acronym POG stand for?"},"code":"","options":[{"it":"Policy Onboarding Guidelines: le linee guida per l\u0027apertura di una polizza","en":"Policy Onboarding Guidelines: the guidelines for opening a policy"},{"it":"Product Oversight and Governance: i requisiti di governo e controllo del prodotto assicurativo lungo il suo ciclo di vita","en":"Product Oversight and Governance: the oversight and governance requirements for an insurance product throughout its life cycle"},{"it":"Premium Optimization Grid: la griglia di ottimizzazione del premio","en":"Premium Optimization Grid: the premium optimisation grid"},{"it":"Personal Obligation Guarantee: la garanzia di obbligo personale del distributore","en":"Personal Obligation Guarantee: the distributor\u0027s personal obligation guarantee"}],"correct":1,"explanation":{"it":"In sintesi: `POG` sta per `Product Oversight and Governance`, i requisiti introdotti dalla `IDD` che impongono a produttori e distributori di prodotti assicurativi di definire un processo di approvazione del prodotto, individuare un target market, testare il prodotto e monitorarlo lungo tutto il ciclo di vita, in analogia con la product governance della `MiFID II`.\nLe altre opzioni: sono acronimi inventati che non esistono nella normativa IDD: \u0027Policy Onboarding Guidelines\u0027, \u0027Premium Optimization Grid\u0027 e \u0027Personal Obligation Guarantee\u0027 sono distrattori privi di fondamento.","en":"In summary: `POG` stands for `Product Oversight and Governance`, the requirements introduced by the `IDD` that require manufacturers and distributors of insurance products to define a product approval process, identify a target market, and test and monitor the product throughout its life cycle, by analogy with `MiFID II` product governance.\nThe other options: are made-up acronyms that do not exist in the IDD legislation: \u0027Policy Onboarding Guidelines\u0027, \u0027Premium Optimization Grid\u0027 and \u0027Personal Obligation Guarantee\u0027 are baseless distractors."}},{"type":"mcq","prompt":{"it":"Che cos\u0027è l\u0027IPID previsto dalla IDD?","en":"What is the IPID provided for by the IDD?"},"code":"","options":[{"it":"Un identificativo univoco dell\u0027intermediario assicurativo","en":"A unique identifier of the insurance intermediary"},{"it":"L\u0027Insurance Product Information Document: un documento standardizzato e sintetico che illustra le caratteristiche principali di un prodotto assicurativo danni (non-life)","en":"The Insurance Product Information Document: a standardised, concise document that sets out the main features of a non-life insurance product"},{"it":"Un registro europeo dei sinistri","en":"A European register of claims"},{"it":"Il codice fiscale internazionale del contraente della polizza","en":"The international tax code of the policyholder"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027`IPID` e\u0027 l\u0027`Insurance Product Information Document`, un documento precontrattuale standardizzato e sintetico introdotto dalla `IDD` per i prodotti assicurativi non-vita (danni), che illustra in modo chiaro e comparabile coperture, esclusioni, obblighi e modalita\u0027. E\u0027 l\u0027analogo, per i danni, del `KID` per i prodotti d\u0027investimento.\nLe altre opzioni: sbagliano perche\u0027 l\u0027IPID non e\u0027 un identificativo dell\u0027intermediario, ne\u0027 un registro europeo dei sinistri, ne\u0027 un codice fiscale del contraente.","en":"In summary: the `IPID` is the `Insurance Product Information Document`, a standardised, concise pre-contractual document introduced by the `IDD` for non-life (general) insurance products, which sets out coverage, exclusions, obligations and terms in a clear and comparable way. It is the non-life equivalent of the `KID` for investment products.\nThe other options: are wrong because the IPID is neither an identifier of the intermediary, nor a European register of claims, nor the policyholder\u0027s tax code."}},{"type":"mcq","prompt":{"it":"Cosa impone il \u0027demands and needs test\u0027 (test di richieste ed esigenze) della IDD?","en":"What does the IDD\u0027s \u0027demands and needs test\u0027 require?"},"code":"","options":[{"it":"Che ogni contratto assicurativo proposto sia coerente con le richieste ed esigenze del cliente, individuate prima della conclusione del contratto","en":"That every proposed insurance contract is consistent with the client\u0027s demands and needs, identified before the contract is concluded"},{"it":"Che il cliente compili obbligatoriamente un questionario di gradimento dopo la vendita","en":"That the client must complete a satisfaction questionnaire after the sale"},{"it":"Che il distributore verifichi solo la solvibilità economica del cliente","en":"That the distributor verifies only the client\u0027s financial solvency"},{"it":"Che venga calcolato il premio minimo di mercato per il prodotto","en":"That the minimum market premium for the product is calculated"}],"correct":0,"explanation":{"it":"In sintesi: il `demands and needs test` impone che, prima della conclusione di qualsiasi contratto assicurativo, il distributore individui, sulla base delle informazioni ottenute dal cliente, le sue richieste ed esigenze e proponga un contratto coerente con esse. E\u0027 un requisito minimo che si applica a ogni vendita, anche in assenza di consulenza, a tutela dell\u0027adeguatezza della copertura.\nLe altre opzioni: non e\u0027 un questionario di gradimento post-vendita, non si limita alla verifica della solvibilita\u0027 del cliente e non e\u0027 un calcolo del premio minimo di mercato.","en":"In summary: the `demands and needs test` requires that, before concluding any insurance contract, the distributor identifies, on the basis of information obtained from the client, the client\u0027s demands and needs and proposes a contract consistent with them. It is a minimum requirement that applies to every sale, even in the absence of advice, to safeguard the adequacy of the cover.\nThe other options: it is not a post-sale satisfaction questionnaire, it is not limited to checking the client\u0027s solvency, and it is not a calculation of the minimum market premium."}},{"type":"mcq","prompt":{"it":"Cosa sono i prodotti IBIP nella normativa assicurativa/finanziaria?","en":"What are IBIP products in insurance/financial regulation?"},"code":"","options":[{"it":"Prodotti bancari a capitale garantito","en":"Capital-guaranteed banking products"},{"it":"Insurance-Based Investment Products: prodotti assicurativi con una componente di investimento il cui valore è esposto a fluttuazioni di mercato (es. polizze unit-linked)","en":"Insurance-Based Investment Products: insurance products with an investment component whose value is exposed to market fluctuations (e.g. unit-linked policies)"},{"it":"Prodotti interbancari di pagamento istantaneo","en":"Interbank instant payment products"},{"it":"Fondi comuni monetari a breve termine","en":"Short-term money market funds"}],"correct":1,"explanation":{"it":"In sintesi: gli `IBIP` sono gli `Insurance-Based Investment Products`, prodotti assicurativi con una componente di investimento il cui valore a scadenza o di riscatto e\u0027 esposto alle fluttuazioni dei mercati, tipicamente le polizze `unit-linked` e `index-linked`. Per la natura ibrida sono soggetti a regole rafforzate, tra cui test di adeguatezza di derivazione MiFID e `KID PRIIPs`.\nLe altre opzioni: sbagliano perche\u0027 gli IBIP non sono prodotti bancari a capitale garantito, non sono strumenti di pagamento interbancario e non sono fondi comuni monetari.","en":"In summary: `IBIP` are `Insurance-Based Investment Products`, insurance products with an investment component whose maturity or surrender value is exposed to market fluctuations, typically `unit-linked` and `index-linked` policies. Because of their hybrid nature they are subject to reinforced rules, including MiFID-derived suitability tests and the `KID PRIIPs`.\nThe other options: are wrong because IBIPs are not capital-guaranteed banking products, not interbank payment instruments, and not money market funds."}},{"type":"mcq","prompt":{"it":"Quale delle seguenti NON è una base giuridica valida per il trattamento di dati personali ai sensi dell\u0027art. 6 GDPR?","en":"Which of the following is NOT a valid legal basis for processing personal data under Article 6 GDPR?"},"code":"","options":[{"it":"Il consenso dell\u0027interessato","en":"The data subject\u0027s consent"},{"it":"L\u0027esecuzione di un contratto di cui l\u0027interessato è parte","en":"Performance of a contract to which the data subject is party"},{"it":"Il legittimo interesse del titolare del trattamento","en":"The legitimate interest of the controller"},{"it":"Il semplice fatto che i dati siano tecnicamente disponibili e accessibili al titolare","en":"The mere fact that the data is technically available and accessible to the controller"}],"correct":3,"explanation":{"it":"In sintesi: la mera disponibilita\u0027 tecnica del dato NON e\u0027 una base giuridica valida. L\u0027art. 6 `GDPR` elenca in modo tassativo sei basi: consenso, esecuzione di un contratto, obbligo legale, interessi vitali, compito di interesse pubblico e legittimo interesse. Trattare un dato solo perche\u0027 e\u0027 accessibile viola il principio di liceita\u0027.\nLe altre opzioni: consenso, esecuzione del contratto e legittimo interesse sono tre delle sei basi valide espressamente previste dall\u0027art. 6, quindi sono risposte corrette e non l\u0027eccezione cercata.","en":"In summary: the mere technical availability of the data is NOT a valid legal basis. Article 6 `GDPR` sets out an exhaustive list of six bases: consent, performance of a contract, legal obligation, vital interests, public interest task, and legitimate interest. Processing data solely because it is accessible breaches the lawfulness principle.\nThe other options: consent, performance of a contract and legitimate interest are three of the six valid bases expressly provided for by Article 6, so they are correct answers and not the exception being sought."}},{"type":"mcq","prompt":{"it":"Quale tra i seguenti è un diritto dell\u0027interessato espressamente riconosciuto dal GDPR?","en":"Which of the following is a data subject right expressly recognised by the GDPR?"},"code":"","options":[{"it":"Il diritto alla portabilità dei dati (art. 20)","en":"The right to data portability (Article 20)"},{"it":"Il diritto a ottenere un risarcimento automatico per ogni accesso ai propri dati","en":"The right to automatic compensation for every access to one\u0027s own data"},{"it":"Il diritto a impedire a chiunque, incluse le autorità giudiziarie, di trattare i propri dati","en":"The right to prevent anyone, including the judicial authorities, from processing one\u0027s own data"},{"it":"Il diritto a essere pagato dal titolare per l\u0027uso commerciale dei propri dati","en":"The right to be paid by the controller for the commercial use of one\u0027s own data"}],"correct":0,"explanation":{"it":"In sintesi: il `GDPR` riconosce espressamente il diritto alla portabilita\u0027 dei dati all\u0027art. 20: l\u0027interessato puo\u0027 ricevere i dati che lo riguardano in un formato strutturato, di uso comune e leggibile da dispositivo automatico, e trasmetterli ad altro titolare.\nLe altre opzioni: sbagliano perche\u0027 non esiste un risarcimento automatico (l\u0027art. 82 presuppone un danno), non c\u0027e\u0027 un diritto assoluto di bloccare i trattamenti necessari per obblighi legali o giudiziari e il GDPR non prevede un diritto a essere remunerati per l\u0027uso dei propri dati.","en":"In summary: the `GDPR` expressly recognises the right to data portability in Article 20: the data subject may receive the data concerning them in a structured, commonly used and machine-readable format, and transmit it to another controller.\nThe other options: are wrong because there is no automatic compensation (Article 82 requires that damage has occurred), there is no absolute right to block processing that is necessary for legal or judicial obligations, and the GDPR does not provide for a right to be remunerated for the use of one\u0027s own data."}},{"type":"mcq","prompt":{"it":"In quale caso il GDPR rende obbligatoria la nomina di un DPO (Data Protection Officer)?","en":"In which case does the GDPR make the appointment of a DPO (Data Protection Officer) mandatory?"},"code":"","options":[{"it":"Sempre, per qualunque azienda che tratti anche un solo dato personale","en":"Always, for any company that processes even a single item of personal data"},{"it":"Quando il trattamento è effettuato da un\u0027autorità pubblica, oppure le attività principali del titolare richiedono monitoraggio regolare e sistematico su larga scala, oppure il trattamento su larga scala di categorie particolari di dati","en":"When the processing is carried out by a public authority, or the controller\u0027s core activities require regular and systematic large-scale monitoring, or the large-scale processing of special categories of data"},{"it":"Solo per le aziende con più di 250 dipendenti","en":"Only for companies with more than 250 employees"},{"it":"Mai: la nomina del DPO è sempre facoltativa","en":"Never: the appointment of a DPO is always optional"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027art. 37 `GDPR` rende obbligatoria la nomina del `DPO` in tre casi: trattamento svolto da un\u0027autorita\u0027 o organismo pubblico; attivita\u0027 principali che consistono in un monitoraggio regolare e sistematico degli interessati su larga scala; attivita\u0027 principali che consistono nel trattamento su larga scala di categorie particolari di dati (art. 9) o di dati giudiziari.\nLe altre opzioni: non e\u0027 sempre obbligatorio ne\u0027 sempre facoltativo, e la soglia non e\u0027 il numero di dipendenti: il criterio dei 250 dipendenti riguarda l\u0027art. 30 sul registro dei trattamenti, un obbligo diverso.","en":"In summary: Article 37 `GDPR` makes the appointment of a `DPO` mandatory in three cases: processing carried out by a public authority or body; core activities consisting of regular and systematic monitoring of data subjects on a large scale; and core activities consisting of the large-scale processing of special categories of data (Article 9) or data relating to criminal convictions.\nThe other options: it is neither always mandatory nor always optional, and the threshold is not the number of employees: the 250-employee criterion relates to Article 30 on the record of processing activities, a different obligation."}},{"type":"truefalse","prompt":{"it":"Ai sensi del GDPR, in caso di violazione dei dati personali (data breach) che presenti un rischio per i diritti e le libertà delle persone fisiche, il titolare deve notificare l\u0027autorità di controllo senza ingiustificato ritardo e, ove possibile, entro 72 ore da quando ne è venuto a conoscenza.","en":"Under the GDPR, in the event of a personal data breach that poses a risk to the rights and freedoms of natural persons, the controller must notify the supervisory authority without undue delay and, where feasible, within 72 hours of becoming aware of it."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero. L\u0027art. 33 `GDPR` impone al titolare di notificare il `data breach` all\u0027autorita\u0027 di controllo senza ingiustificato ritardo e, ove possibile, entro 72 ore da quando ne e\u0027 venuto a conoscenza, salvo che sia improbabile un rischio per i diritti e le liberta\u0027 delle persone fisiche. Oltre le 72 ore la notifica va corredata delle ragioni del ritardo.\nLe altre opzioni: l\u0027errore tipico e\u0027 confondere la notifica all\u0027autorita\u0027 con la comunicazione agli interessati (art. 34), che scatta solo in caso di rischio elevato.","en":"In summary: it is true. Article 33 `GDPR` requires the controller to notify the `data breach` to the supervisory authority without undue delay and, where feasible, within 72 hours of becoming aware of it, unless the breach is unlikely to result in a risk to the rights and freedoms of natural persons. Where notification is made after 72 hours, it must be accompanied by the reasons for the delay.\nThe other options: the typical mistake is to confuse notification to the authority with communication to the data subjects (Article 34), which is triggered only in the event of a high risk."}},{"type":"mcq","prompt":{"it":"Cosa stabilisce il principio di minimizzazione dei dati (data minimisation) del GDPR?","en":"What does the GDPR\u0027s data minimisation principle establish?"},"code":"","options":[{"it":"Che i dati vanno conservati per il minor tempo tecnicamente possibile, indipendentemente dalla finalità","en":"That data must be kept for the shortest time technically possible, regardless of the purpose"},{"it":"Che i dati personali devono essere adeguati, pertinenti e limitati a quanto necessario rispetto alle finalità del trattamento","en":"That personal data must be adequate, relevant and limited to what is necessary in relation to the purposes of the processing"},{"it":"Che occorre raccogliere il maggior numero di dati possibile per poterli minimizzare in seguito","en":"That as much data as possible must be collected so that it can be minimised later"},{"it":"Che i dati devono essere sempre anonimizzati prima della raccolta","en":"That data must always be anonymised before collection"}],"correct":1,"explanation":{"it":"In sintesi: il principio di minimizzazione (art. 5.1.c `GDPR`) impone che i dati personali siano adeguati, pertinenti e limitati a quanto necessario rispetto alle finalita\u0027 del trattamento: si raccoglie solo cio\u0027 che serve allo scopo.\nLe altre opzioni: il tempo di conservazione e\u0027 oggetto del distinto principio di limitazione della conservazione (art. 5.1.e), raccogliere il massimo dei dati contraddice apertamente la minimizzazione e l\u0027anonimizzazione preventiva non e\u0027 richiesta, perche\u0027 i dati servono proprio identificabili per la finalita\u0027.","en":"In summary: the data minimisation principle (Article 5(1)(c) `GDPR`) requires that personal data be adequate, relevant and limited to what is necessary in relation to the purposes of the processing: only what is needed for the purpose is collected.\nThe other options: the retention period is the subject of the separate storage limitation principle (Article 5(1)(e)), collecting the maximum amount of data openly contradicts minimisation, and prior anonymisation is not required, because the data is needed precisely in identifiable form for the purpose."}},{"type":"mcq","prompt":{"it":"Quando è obbligatorio svolgere una DPIA (Data Protection Impact Assessment) secondo il GDPR?","en":"When is it mandatory to carry out a DPIA (Data Protection Impact Assessment) under the GDPR?"},"code":"","options":[{"it":"Per ogni trattamento di dati personali, senza eccezioni","en":"For every processing of personal data, without exception"},{"it":"Quando un tipo di trattamento, tenuto conto di natura, oggetto, contesto e finalità, può presentare un rischio elevato per i diritti e le libertà delle persone fisiche","en":"When a type of processing, taking into account its nature, scope, context and purposes, is likely to result in a high risk to the rights and freedoms of natural persons"},{"it":"Solo dopo che si è verificato un data breach","en":"Only after a data breach has occurred"},{"it":"Solo se lo richiede espressamente l\u0027interessato","en":"Only if the data subject expressly requests it"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027art. 35 `GDPR` rende obbligatoria la `DPIA` quando un tipo di trattamento, tenuto conto di natura, oggetto, contesto e finalita\u0027 e spesso in presenza di nuove tecnologie, puo\u0027 presentare un rischio elevato per i diritti e le liberta\u0027 delle persone fisiche: casi tipici sono profilazione su larga scala, trattamento su larga scala di dati particolari e monitoraggio sistematico di zone pubbliche.\nLe altre opzioni: la DPIA e\u0027 una valutazione preventiva, non richiesta per ogni trattamento, non successiva a un breach e non dipendente dalla richiesta dell\u0027interessato.","en":"In summary: Article 35 `GDPR` makes a `DPIA` mandatory when a type of processing, taking into account its nature, scope, context and purposes and often where new technologies are involved, is likely to result in a high risk to the rights and freedoms of natural persons: typical cases are large-scale profiling, large-scale processing of special-category data, and systematic monitoring of public areas.\nThe other options: the DPIA is a prior assessment, not required for every processing, not carried out after a breach, and not dependent on a request from the data subject."}},{"type":"truefalse","prompt":{"it":"Ai sensi del GDPR il consenso, per essere valido, deve essere libero, specifico, informato e inequivocabile, e l\u0027interessato deve poterlo revocare in qualsiasi momento con la stessa facilità con cui lo ha prestato.","en":"Under the GDPR, to be valid, consent must be freely given, specific, informed and unambiguous, and the data subject must be able to withdraw it at any time as easily as it was given."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero. Gli artt. 4(11) e 7 `GDPR` definiscono il consenso come manifestazione di volonta\u0027 libera, specifica, informata e inequivocabile, espressa con una dichiarazione o un\u0027azione positiva inequivocabile: niente caselle preselezionate ne\u0027 silenzio. L\u0027art. 7.3 aggiunge il diritto di revoca in qualsiasi momento, con la stessa facilita\u0027 con cui il consenso e\u0027 stato prestato, senza pregiudicare la liceita\u0027 del trattamento gia\u0027 svolto.\nLe altre opzioni: l\u0027errore tipico e\u0027 trattare questi requisiti come alternativi: sono invece cumulativi e devono ricorrere tutti insieme.","en":"In summary: it is true. Articles 4(11) and 7 `GDPR` define consent as a freely given, specific, informed and unambiguous indication of the data subject\u0027s wishes, expressed by a statement or a clear affirmative action: no pre-ticked boxes and no silence. Article 7(3) adds the right to withdraw consent at any time, as easily as it was given, without affecting the lawfulness of processing already carried out.\nThe other options: the typical mistake is to treat these requirements as alternatives: they are instead cumulative and must all be met together."}},{"type":"mcq","prompt":{"it":"Il diritto alla cancellazione (\u0027diritto all\u0027oblio\u0027, art. 17 GDPR) è un diritto assoluto?","en":"Is the right to erasure (\u0027right to be forgotten\u0027, Article 17 GDPR) an absolute right?"},"code":"","options":[{"it":"Sì, il titolare deve sempre cancellare i dati su richiesta, senza eccezioni","en":"Yes, the controller must always erase the data on request, without exception"},{"it":"No: incontra eccezioni, ad esempio quando il trattamento è necessario per adempiere un obbligo legale o per l\u0027accertamento/esercizio/difesa di un diritto in sede giudiziaria","en":"No: it is subject to exceptions, for example where the processing is necessary to comply with a legal obligation or for the establishment/exercise/defence of a legal claim"},{"it":"Sì, ma solo per i dati trattati sulla base del legittimo interesse","en":"Yes, but only for data processed on the basis of legitimate interest"},{"it":"No, perché il diritto all\u0027oblio non è previsto dal GDPR ma solo dalla giurisprudenza","en":"No, because the right to be forgotten is not provided for by the GDPR but only by case law"}],"correct":1,"explanation":{"it":"In sintesi: il diritto alla cancellazione (`diritto all\u0027oblio`, art. 17 `GDPR`) non e\u0027 assoluto. L\u0027art. 17.3 elenca eccezioni in cui non si applica, tra cui l\u0027adempimento di un obbligo legale, rilevante in ambito bancario per la conservazione documentale `AML`, la liberta\u0027 di espressione, motivi di interesse pubblico e l\u0027accertamento, esercizio o difesa di un diritto in sede giudiziaria.\nLe altre opzioni: sbagliano perche\u0027 il titolare non deve cancellare sempre e senza eccezioni, il diritto e\u0027 espressamente codificato nel GDPR e non solo giurisprudenziale, e le eccezioni non si limitano al legittimo interesse.","en":"In summary: the right to erasure (`right to be forgotten`, Article 17 `GDPR`) is not absolute. Article 17(3) lists exceptions where it does not apply, including compliance with a legal obligation, relevant in the banking sphere for `AML` record retention, freedom of expression, reasons of public interest, and the establishment, exercise or defence of a legal claim.\nThe other options: are wrong because the controller does not always have to erase data without exception, the right is expressly codified in the GDPR and not merely a matter of case law, and the exceptions are not limited to legitimate interest."}},{"type":"mcq","prompt":{"it":"A quali trattamenti si applica il diritto alla portabilità dei dati (art. 20 GDPR)?","en":"To which processing does the right to data portability (Article 20 GDPR) apply?"},"code":"","options":[{"it":"A tutti i trattamenti, qualunque sia la base giuridica e la modalità","en":"To all processing, whatever the legal basis and the method"},{"it":"Solo ai trattamenti basati sul consenso o su un contratto e effettuati con mezzi automatizzati","en":"Only to processing based on consent or on a contract and carried out by automated means"},{"it":"Solo ai dati trattati per obbligo legale","en":"Only to data processed for a legal obligation"},{"it":"Solo ai dati particolari (categorie speciali) dell\u0027art. 9","en":"Only to special-category data under Article 9"}],"correct":1,"explanation":{"it":"In sintesi: il diritto alla portabilita\u0027 (art. 20 `GDPR`) si applica solo ai trattamenti che soddisfano due condizioni cumulative: la base giuridica e\u0027 il consenso (art. 6.1.a o 9.2.a) oppure un contratto (art. 6.1.b), e il trattamento e\u0027 effettuato con mezzi automatizzati.\nLe altre opzioni: sono quindi esclusi i trattamenti fondati su obbligo legale o legittimo interesse; il diritto non si applica indistintamente a tutti i trattamenti e non e\u0027 ristretto ai soli dati particolari dell\u0027art. 9.","en":"In summary: the right to data portability (Article 20 `GDPR`) applies only to processing that meets two cumulative conditions: the legal basis is consent (Article 6(1)(a) or 9(2)(a)) or a contract (Article 6(1)(b)), and the processing is carried out by automated means.\nThe other options: processing based on a legal obligation or legitimate interest is therefore excluded; the right does not apply indiscriminately to all processing and is not restricted to the special-category data under Article 9."}},{"type":"mcq","prompt":{"it":"Nell\u0027ambito AML/KYC, cosa si intende per \u0027adeguata verifica della clientela rafforzata\u0027 (Enhanced Due Diligence)?","en":"In the AML/KYC context, what is meant by \u0027Enhanced Due Diligence\u0027?"},"code":"","options":[{"it":"Un livello di verifica ridotto applicato ai clienti abituali per velocizzare l\u0027onboarding","en":"A reduced level of verification applied to regular clients to speed up onboarding"},{"it":"Un insieme di misure di verifica più stringenti applicate in situazioni a maggior rischio di riciclaggio, come rapporti con PEP o con paesi terzi ad alto rischio","en":"A set of more stringent verification measures applied in situations of higher money-laundering risk, such as relationships with PEPs or with high-risk third countries"},{"it":"La verifica svolta esclusivamente al momento della chiusura del rapporto","en":"Verification carried out exclusively when the relationship is closed"},{"it":"Un controllo che sostituisce del tutto l\u0027identificazione del titolare effettivo","en":"A check that entirely replaces the identification of the beneficial owner"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027`Enhanced Due Diligence` (adeguata verifica rafforzata) e\u0027 l\u0027insieme di misure piu\u0027 stringenti applicate nelle situazioni a maggior rischio di riciclaggio: approfondimento sull\u0027origine dei fondi e del patrimonio, autorizzazione di livello dirigenziale e monitoraggio rafforzato, in casi come rapporti con `PEP`, clientela di paesi terzi ad alto rischio e operazioni complesse o anomale.\nLe altre opzioni: e\u0027 l\u0027opposto della verifica semplificata, non si svolge solo alla chiusura del rapporto e non sostituisce ma rafforza l\u0027identificazione del titolare effettivo.","en":"In summary: `Enhanced Due Diligence` is the set of more stringent measures applied in situations of higher money-laundering risk: in-depth checks on the source of funds and wealth, senior management approval and enhanced monitoring, in cases such as relationships with `PEP`, clients from high-risk third countries, and complex or unusual transactions.\nThe other options: it is the opposite of simplified due diligence, it is not carried out only when the relationship is closed, and it does not replace but reinforces the identification of the beneficial owner."}},{"type":"mcq","prompt":{"it":"Chi è una PEP (Persona Esposta Politicamente) nella normativa antiriciclaggio?","en":"Who is a PEP (Politically Exposed Person) under anti-money-laundering legislation?"},"code":"","options":[{"it":"Qualsiasi cliente con un patrimonio elevato","en":"Any client with substantial wealth"},{"it":"Una persona fisica che occupa o ha occupato importanti cariche pubbliche, e per estensione i suoi familiari e soggetti notoriamente legati","en":"A natural person who holds or has held a prominent public office, and by extension their family members and persons known to be closely associated"},{"it":"Solo il cliente residente in un paese terzo ad alto rischio","en":"Only a client resident in a high-risk third country"},{"it":"Un dipendente della banca con accesso ai dati dei clienti","en":"A bank employee with access to client data"}],"correct":1,"explanation":{"it":"In sintesi: una `PEP` e\u0027 una persona fisica che occupa o ha occupato importanti cariche pubbliche, come capi di Stato, ministri, parlamentari, alti magistrati o vertici di enti e societa\u0027 partecipate, e la definizione si estende ai familiari e ai soggetti notoriamente legati. Lo status comporta un maggior rischio di corruzione e riciclaggio e impone l\u0027adeguata verifica rafforzata.\nLe altre opzioni: non dipende dal solo patrimonio elevato, non coincide con la residenza in un paese terzo ad alto rischio e non riguarda i dipendenti della banca con accesso ai dati.","en":"In summary: a `PEP` is a natural person who holds or has held a prominent public office, such as heads of state, ministers, members of parliament, senior judges or the top management of public bodies and state-owned companies, and the definition extends to family members and persons known to be closely associated. This status entails a higher risk of corruption and money laundering and requires enhanced due diligence.\nThe other options: it does not depend on substantial wealth alone, it does not coincide with residence in a high-risk third country, and it does not concern bank employees with access to data."}},{"type":"truefalse","prompt":{"it":"In caso di segnalazione di operazione sospetta (SOS) di riciclaggio, il soggetto obbligato deve informare il cliente interessato che la segnalazione è stata effettuata, per trasparenza.","en":"In the event of a suspicious transaction report (STR) for money laundering, the obligated entity must inform the client concerned that the report has been filed, for the sake of transparency."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: e\u0027 falso. Vige il divieto di divulgazione (`tipping-off`): il soggetto obbligato non deve comunicare al cliente ne\u0027 a terzi che e\u0027 stata effettuata, o e\u0027 in corso di valutazione, una segnalazione di operazione sospetta all\u0027`UIF`, perche\u0027 cio\u0027 comprometterebbe le indagini e consentirebbe l\u0027occultamento dei fondi.\nLe altre opzioni: l\u0027errore tipico e\u0027 scambiare la trasparenza verso il cliente con un obbligo: la riservatezza della `SOS` e\u0027 un principio cardine dell\u0027antiriciclaggio, non un dovere informativo.","en":"In summary: it is false. The prohibition on disclosure (`tipping-off`) applies: the obligated entity must not inform the client or any third party that a suspicious transaction report has been filed, or is being considered for filing, with the `UIF`, because doing so would compromise the investigations and enable the funds to be concealed.\nThe other options: the typical mistake is to swap transparency towards the client for an obligation: the confidentiality of the `STR` is a cornerstone principle of anti-money-laundering law, not a disclosure duty."}},{"type":"mcq","prompt":{"it":"Qual è l\u0027obiettivo principale delle procedure KYC (Know Your Customer)?","en":"What is the main objective of KYC (Know Your Customer) procedures?"},"code":"","options":[{"it":"Massimizzare la vendita di prodotti finanziari al cliente","en":"To maximise the sale of financial products to the client"},{"it":"Identificare e verificare l\u0027identità del cliente e del titolare effettivo, comprendere la natura e lo scopo del rapporto per prevenire riciclaggio e finanziamento del terrorismo","en":"To identify and verify the identity of the client and the beneficial owner, and to understand the nature and purpose of the relationship in order to prevent money laundering and terrorist financing"},{"it":"Determinare il rating creditizio del cliente ai fini della concessione di un mutuo","en":"To determine the client\u0027s credit rating for the purpose of granting a mortgage"},{"it":"Raccogliere dati di marketing per profilare le abitudini di spesa","en":"To collect marketing data to profile spending habits"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027obiettivo del `KYC` (`Know Your Customer`) e\u0027 identificare e verificare l\u0027identita\u0027 del cliente e dell\u0027eventuale titolare effettivo e comprendere natura, scopo e profilo di rischio del rapporto, per prevenire il riciclaggio e il finanziamento del terrorismo (`AML/CFT`).\nLe altre opzioni: il KYC non e\u0027 finalizzato a massimizzare le vendite ne\u0027 alla profilazione di marketing, e sebbene alcune informazioni si sovrappongano, resta concettualmente distinto dalla valutazione del merito creditizio (credit scoring).","en":"In summary: the objective of `KYC` (`Know Your Customer`) is to identify and verify the identity of the client and of any beneficial owner and to understand the nature, purpose and risk profile of the relationship, in order to prevent money laundering and terrorist financing (`AML/CFT`).\nThe other options: KYC is not aimed at maximising sales or at marketing profiling, and although some information overlaps, it remains conceptually distinct from creditworthiness assessment (credit scoring)."}},{"type":"mcq","prompt":{"it":"In finanza, cosa descrive l\u0027asset allocation di un portafoglio?","en":"In finance, what does a portfolio\u0027s asset allocation describe?"},"code":"","options":[{"it":"La ripartizione del capitale tra diverse classi di attività (es. azioni, obbligazioni, liquidità, immobiliare) in funzione di obiettivi e profilo di rischio","en":"The split of capital across different asset classes (e.g. equities, bonds, cash, real estate) according to objectives and risk profile"},{"it":"La singola azione con il rendimento più alto degli ultimi 12 mesi","en":"The single stock with the highest return over the last 12 months"},{"it":"Il numero totale di titoli detenuti, indipendentemente dalla loro tipologia","en":"The total number of securities held, regardless of their type"},{"it":"La commissione applicata dal gestore sul portafoglio","en":"The fee charged by the manager on the portfolio"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027`asset allocation` e\u0027 la ripartizione strategica del capitale tra le diverse classi di attivita\u0027 (azioni, obbligazioni, liquidita\u0027, immobiliare, materie prime), coerente con obiettivi, orizzonte temporale e profilo di rischio del cliente. E\u0027 il principale determinante del profilo rischio/rendimento del portafoglio.\nLe altre opzioni: non coincide con la singola azione piu\u0027 performante, non e\u0027 il mero numero di titoli detenuti e non e\u0027 la commissione applicata dal gestore.","en":"In summary: `asset allocation` is the strategic split of capital across the different asset classes (equities, bonds, cash, real estate, commodities), consistent with the client\u0027s objectives, time horizon and risk profile. It is the main driver of a portfolio\u0027s risk/return profile.\nThe other options: it is not the same as the single best-performing stock, it is not the mere number of securities held, and it is not the fee charged by the manager."}},{"type":"mcq","prompt":{"it":"Cosa rappresenta il \u0027profilo di rischio\u0027 di un investitore?","en":"What does an investor\u0027s \u0027risk profile\u0027 represent?"},"code":"","options":[{"it":"Esclusivamente la percentuale di perdita che ha già subito in passato","en":"Exclusively the percentage loss they have already suffered in the past"},{"it":"La combinazione tra la tolleranza al rischio (propensione soggettiva) e la capacità di sostenere perdite (situazione finanziaria oggettiva), insieme all\u0027orizzonte temporale","en":"The combination of risk tolerance (subjective willingness) and the ability to bear losses (objective financial situation), together with the time horizon"},{"it":"Il rendimento medio garantito dai suoi investimenti","en":"The average return guaranteed by their investments"},{"it":"La sola età anagrafica del cliente","en":"The client\u0027s age alone"}],"correct":1,"explanation":{"it":"In sintesi: il profilo di rischio combina due dimensioni distinte: la tolleranza al rischio, cioe\u0027 la propensione soggettiva e psicologica ad accettare oscillazioni di valore, e la capacita\u0027 di sostenere perdite, cioe\u0027 la situazione finanziaria oggettiva che determina quanto il cliente puo\u0027 permettersi di perdere; vi concorre anche l\u0027orizzonte temporale. E\u0027 un input chiave della valutazione di adeguatezza `MiFID II`.\nLe altre opzioni: non si riduce alle perdite gia\u0027 subite, non e\u0027 un rendimento medio garantito (inesistente) e non coincide con la sola eta\u0027 anagrafica.","en":"In summary: the risk profile combines two distinct dimensions: risk tolerance, i.e. the subjective, psychological willingness to accept swings in value, and the ability to bear losses, i.e. the objective financial situation that determines how much the client can afford to lose; the time horizon also contributes. It is a key input of the `MiFID II` suitability assessment.\nThe other options: it does not come down to losses already suffered, it is not a guaranteed average return (which does not exist), and it does not coincide with the client\u0027s age alone."}},{"type":"mcq","prompt":{"it":"Perché la diversificazione riduce il rischio complessivo di un portafoglio?","en":"Why does diversification reduce a portfolio\u0027s overall risk?"},"code":"","options":[{"it":"Perché elimina completamente ogni tipo di rischio, incluso quello di mercato","en":"Because it completely eliminates every type of risk, including market risk"},{"it":"Perché combinando attività i cui rendimenti non sono perfettamente correlati si riduce il rischio specifico (idiosincratico), pur restando il rischio sistematico di mercato","en":"Because combining assets whose returns are not perfectly correlated reduces specific (idiosyncratic) risk, while systematic market risk remains"},{"it":"Perché aumenta automaticamente il rendimento atteso senza alcun costo","en":"Because it automatically increases the expected return at no cost"},{"it":"Perché concentra gli investimenti sui titoli più performanti","en":"Because it concentrates the investments in the best-performing securities"}],"correct":1,"explanation":{"it":"In sintesi: la diversificazione riduce il rischio perche\u0027, combinando attivita\u0027 i cui rendimenti non sono perfettamente correlati, le oscillazioni tendono a compensarsi e si abbatte il rischio specifico (idiosincratico), legato al singolo emittente. Resta invece il rischio sistematico di mercato, che colpisce l\u0027intero mercato e non e\u0027 diversificabile.\nLe altre opzioni: non elimina ogni tipo di rischio incluso quello di mercato, non aumenta il rendimento atteso a costo zero e per definizione e\u0027 l\u0027opposto della concentrazione sui pochi titoli migliori.","en":"In summary: diversification reduces risk because, by combining assets whose returns are not perfectly correlated, the swings tend to offset one another and specific (idiosyncratic) risk, tied to the individual issuer, is cut down. Systematic market risk, on the other hand, remains: it affects the entire market and cannot be diversified away.\nThe other options: it does not eliminate every type of risk, including market risk, it does not increase the expected return at zero cost, and by definition it is the opposite of concentrating in a few top securities."}},{"type":"truefalse","prompt":{"it":"Secondo il principio del rapporto rischio/rendimento (risk-return trade-off), a un maggiore rendimento atteso corrisponde generalmente un maggiore rischio che l\u0027investitore deve essere disposto ad assumere.","en":"According to the risk-return trade-off principle, a higher expected return generally corresponds to a higher risk that the investor must be willing to take on."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero. Il `risk-return trade-off` e\u0027 un principio fondamentale: gli investitori, mediamente avversi al rischio, richiedono un premio per il rischio, cioe\u0027 un extra rendimento atteso, per detenere attivita\u0027 piu\u0027 rischiose, quindi a un rendimento atteso piu\u0027 elevato corrisponde normalmente una maggiore volatilita\u0027 e incertezza dei risultati.\nLe altre opzioni: l\u0027errore tipico e\u0027 leggerlo come garanzia: e\u0027 il rendimento atteso a crescere, non quello garantito, e un rischio elevato non implica automaticamente un rendimento elevato effettivamente realizzato.","en":"In summary: it is true. The `risk-return trade-off` is a fundamental principle: investors, being on average risk-averse, demand a risk premium, i.e. an extra expected return, to hold riskier assets, so a higher expected return normally corresponds to greater volatility and uncertainty of outcomes.\nThe other options: the typical mistake is to read it as a guarantee: it is the expected return that rises, not the guaranteed one, and high risk does not automatically imply a high return actually realised."}},{"type":"mcq","prompt":{"it":"Cosa introduce la Strong Customer Authentication (SCA) prevista dalla PSD2?","en":"What does the Strong Customer Authentication (SCA) required by PSD2 introduce?"},"code":"","options":[{"it":"Un\u0027autenticazione basata su almeno due fattori indipendenti tra le categorie conoscenza, possesso e inerenza (biometria)","en":"Authentication based on at least two independent factors from the categories knowledge, possession and inherence (biometrics)"},{"it":"Un\u0027unica password complessa condivisa tra banca e cliente","en":"A single complex password shared between the bank and the client"},{"it":"L\u0027obbligo di autenticare il cliente solo tramite impronta digitale","en":"The obligation to authenticate the client only via fingerprint"},{"it":"L\u0027eliminazione di qualsiasi autenticazione per i pagamenti sotto i 1000 euro","en":"The removal of any authentication for payments below 1,000 euros"}],"correct":0,"explanation":{"it":"In sintesi: la `Strong Customer Authentication` (`SCA`) prevista dalla `PSD2` richiede almeno due fattori indipendenti appartenenti a categorie diverse: conoscenza (qualcosa che l\u0027utente sa, es. il PIN), possesso (qualcosa che l\u0027utente ha, es. lo smartphone o un token) e inerenza (qualcosa che l\u0027utente e\u0027, es. l\u0027impronta o il riconoscimento facciale). L\u0027indipendenza dei fattori garantisce che la compromissione di uno non comprometta gli altri.\nLe altre opzioni: non e\u0027 un\u0027unica password condivisa ne\u0027 un solo fattore biometrico, ed esistono esenzioni per operazioni a basso rischio o importo (es. la soglia dei 30 euro), ma non un\u0027esenzione fissa e generalizzata a 1000 euro.","en":"In summary: the `Strong Customer Authentication` (`SCA`) required by `PSD2` calls for at least two independent factors belonging to different categories: knowledge (something the user knows, e.g. the PIN), possession (something the user has, e.g. a smartphone or a token) and inherence (something the user is, e.g. a fingerprint or facial recognition). The independence of the factors ensures that the compromise of one does not compromise the others.\nThe other options: it is neither a single shared password nor a single biometric factor, and there are exemptions for low-risk or low-value transactions (e.g. the 30-euro threshold), but not a fixed, blanket exemption at 1,000 euros."}},{"type":"mcq","prompt":{"it":"Nella PSD2, qual è la differenza tra un AISP e un PISP?","en":"In PSD2, what is the difference between an AISP and a PISP?"},"code":"","options":[{"it":"L\u0027AISP (Account Information Service Provider) aggrega e fornisce informazioni sui conti; il PISP (Payment Initiation Service Provider) dispone/inizia pagamenti per conto dell\u0027utente","en":"The AISP (Account Information Service Provider) aggregates and provides account information; the PISP (Payment Initiation Service Provider) initiates payments on the user\u0027s behalf"},{"it":"Sono due nomi per lo stesso servizio di custodia titoli","en":"They are two names for the same securities custody service"},{"it":"L\u0027AISP emette carte di credito, il PISP gestisce i mutui","en":"The AISP issues credit cards, the PISP manages mortgages"},{"it":"Entrambi possono detenere i fondi del cliente sui propri conti","en":"Both may hold the client\u0027s funds in their own accounts"}],"correct":0,"explanation":{"it":"In sintesi: nella `PSD2` l\u0027`AISP` (`Account Information Service Provider`) aggrega e fornisce informazioni sui conti dell\u0027utente, mentre il `PISP` (`Payment Initiation Service Provider`) dispone e inizia pagamenti dal conto dell\u0027utente per suo conto. Entrambi operano nell\u0027`open banking` come terze parti (`TPP`), previa autorizzazione dell\u0027utente, e non entrano mai in possesso dei fondi del cliente.\nLe altre opzioni: non sono lo stesso servizio di custodia titoli, non riguardano emissione di carte o gestione di mutui e, soprattutto, non possono detenere i fondi del cliente sui propri conti.","en":"In summary: in `PSD2` the `AISP` (`Account Information Service Provider`) aggregates and provides information on the user\u0027s accounts, while the `PISP` (`Payment Initiation Service Provider`) initiates payments from the user\u0027s account on their behalf. Both operate in `open banking` as third parties (`TPP`), subject to the user\u0027s authorisation, and never take possession of the client\u0027s funds.\nThe other options: they are not the same securities custody service, they do not involve card issuing or mortgage servicing, and, above all, they cannot hold the client\u0027s funds in their own accounts."}},{"type":"mcq","prompt":{"it":"Un cliente retail acquista, di propria iniziativa e senza consulenza, uno strumento finanziario complesso (es. un certificate a leva) tramite l\u0027home banking. Quale valutazione deve svolgere l\u0027intermediario secondo MiFID II?","en":"A retail client, on their own initiative and without advice, buys a complex financial instrument (e.g. a leveraged certificate) through home banking. Which assessment must the intermediary carry out under MiFID II?"},"code":"","options":[{"it":"Nessuna valutazione, perché l\u0027operazione è su iniziativa del cliente","en":"No assessment, because the transaction is at the client\u0027s initiative"},{"it":"La valutazione di adeguatezza completa (conoscenza, situazione finanziaria e obiettivi)","en":"The full suitability assessment (knowledge, financial situation and objectives)"},{"it":"La valutazione di appropriatezza, verificando conoscenza ed esperienza del cliente rispetto allo strumento complesso, con eventuale avvertenza in caso di esito negativo","en":"The appropriateness assessment, checking the client\u0027s knowledge and experience in relation to the complex instrument, with a warning where the outcome is negative"},{"it":"Solo la verifica antiriciclaggio KYC, senza alcuna valutazione MiFID","en":"Only the AML KYC check, without any MiFID assessment"}],"correct":2,"explanation":{"it":"In sintesi: qui va svolta la valutazione di appropriatezza. L\u0027esenzione `execution only` richiede tra l\u0027altro che lo strumento sia non complesso: un `certificate a leva` e\u0027 complesso, quindi l\u0027esenzione non si applica anche se l\u0027operazione e\u0027 su iniziativa del cliente. Non essendoci consulenza ne\u0027 gestione non scatta l\u0027adeguatezza, ma l\u0027appropriatezza, che verifica conoscenza ed esperienza rispetto al prodotto; in caso di esito negativo o di mancata informazione l\u0027intermediario deve avvertire il cliente.\nLe altre opzioni: non e\u0027 corretto non fare nulla per via dell\u0027iniziativa del cliente, non serve l\u0027adeguatezza completa (mancano consulenza e gestione) e il `KYC` `AML` e\u0027 un obbligo distinto che non sostituisce la valutazione `MiFID`.","en":"In summary: here the appropriateness assessment must be carried out. The `execution only` exemption requires, among other things, that the
