n l\u0027intero body vanificherebbe il caching condizionale; `412 Precondition Failed` è la risposta tipica di `If-Match` su metodi non-safe quando la precondizione non è soddisfatta, non di una `GET` con `If-None-Match`; `204` non è la semantica del not-modified."}]},{"id":"testing","title":"Testing (JUnit / Mockito / TDD)","questions":[{"type":"mcq","prompt":"Secondo la piramide dei test, come dovrebbe essere distribuita la suite?","code":"","options":["Molti unit test veloci alla base, meno integration test nel mezzo, pochi E2E in cima","Molti test E2E alla base, pochi unit test in cima","Stesso numero di test a ogni livello per garantire equilibrio","Solo integration test, perche\u0027 coprono sia le unita\u0027 sia il flusso completo"],"correct":0,"explanation":"In sintesi: la piramide dice di avere tanti unit test alla base, perche\u0027 sono veloci, isolati ed economici da mantenere, un numero medio di integration test nel mezzo, e pochi E2E in cima, perche\u0027 sono lenti, fragili e costosi. L\u0027obiettivo e\u0027 spostare il grosso della verifica verso il basso, dove il feedback e\u0027 immediato.\nLe altre opzioni: invertire la piramide (tanti E2E) e\u0027 l\u0027anti-pattern del \u0027gelato\u0027; distribuzione uguale ignora costo/velocita\u0027; solo integration test perde granularita\u0027 e feedback rapido."},{"type":"truefalse","prompt":"Un test end-to-end e\u0027 tipicamente piu\u0027 veloce e piu\u0027 isolato di uno unit test.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: l\u0027affermazione e\u0027 falsa perche\u0027 un E2E attraversa l\u0027intero sistema (UI, rete, DB, servizi esterni), quindi e\u0027 intrinsecamente lento e poco isolato, esposto a flakiness; lo unit test gira in memoria su una singola unita\u0027 isolata ed e\u0027 l\u0027opposto, veloce e deterministico.\nLe altre opzioni: l\u0027errore tipico e\u0027 confondere \u0027copre piu\u0027 cose\u0027 con \u0027e\u0027 migliore/piu\u0027 veloce\u0027; l\u0027ampiezza di copertura di un E2E si paga proprio in velocita\u0027 e isolamento."},{"type":"mcq","prompt":"In JUnit 5, con il lifecycle di default (PER_METHOD), come deve essere un metodo annotato con @BeforeAll?","code":"","options":["static","Eseguito prima di ogni singolo @Test","Un metodo di istanza qualsiasi, senza configurazione aggiuntiva","Eseguito dopo tutti i @Test della classe"],"correct":0,"explanation":"In sintesi: con il lifecycle di default `PER_METHOD` JUnit crea una nuova istanza per ogni test, quindi `@BeforeAll` deve essere `static` per girare una sola volta prima di tutti i test; diventa non static solo se attivo `@TestInstance(PER_CLASS)`.\nLe altre opzioni: \u0027prima di ogni test\u0027 descrive `@BeforeEach`, non `@BeforeAll`; il metodo di istanza senza config non compila/e\u0027 rifiutato in PER_METHOD; \u0027dopo tutti i test\u0027 e\u0027 `@AfterAll`."},{"type":"code","prompt":"Cosa succede eseguendo questo test?","code":"@Test\nvoid test() {\n    assertThrows(ArithmeticException.class,\n        () -\u003e Integer.parseInt(\"abc\"));\n}","options":["Il test passa perche\u0027 parseInt lancia comunque un\u0027eccezione","Il test fallisce: viene lanciata NumberFormatException, non ArithmeticException","Il test non compila","Il test viene ignorato perche\u0027 manca il messaggio atteso"],"correct":1,"explanation":"In sintesi: `assertThrows` verifica che l\u0027eccezione lanciata sia del tipo atteso o di una sua sottoclasse; qui `Integer.parseInt(\"abc\")` lancia `NumberFormatException` (sottoclasse di `IllegalArgumentException`), che NON e\u0027 un\u0027`ArithmeticException`, quindi l\u0027assertion fallisce riportando il mismatch di tipo.\nLe altre opzioni: \u0027passa perche\u0027 lancia comunque\u0027 ignora che il tipo deve corrispondere; il codice compila; non c\u0027e\u0027 alcun meccanismo che ignori il test."},{"type":"mcq","prompt":"Qual e\u0027 la differenza principale tra un mock e uno spy in Mockito?","code":"","options":["Il mock ha tutti i metodi stubbati e ritorna valori di default; lo spy avvolge un oggetto reale e chiama i metodi reali salvo stubbing esplicito","Lo spy non puo\u0027 mai essere verificato con verify()","Il mock chiama sempre i metodi reali dell\u0027oggetto originale","Mock e spy sono sinonimi, cambia solo il nome dell\u0027annotazione"],"correct":0,"explanation":"In sintesi: un `mock` e\u0027 un doppio completo, tutti i metodi restituiscono i valori di default (null, 0, false, Optional vuoto) finche\u0027 non li stubbo; uno `spy` invece avvolge un\u0027istanza reale e delega ai metodi reali, tranne quelli che stubbo esplicitamente, tipicamente con `doReturn().when()`.\nLe altre opzioni: anche lo spy si verifica con `verify()`; il mock non chiama mai il codice reale; non sono sinonimi, hanno semantiche opposte sulla delega."},{"type":"code","prompt":"Cosa accade eseguendo questo codice?","code":"List\u003cString\u003e spy = spy(new ArrayList\u003c\u003e());\nwhen(spy.get(0)).thenReturn(\"A\");","options":["spy.get(0) restituira\u0027 correttamente \"A\"","Lancia IndexOutOfBoundsException: when(spy.get(0)) chiama il metodo reale get(0) su una lista vuota","Il codice non compila","Restituisce null senza errori"],"correct":1,"explanation":"In sintesi: con uno `spy` la sintassi `when(spy.get(0))` valuta prima l\u0027argomento, cioe\u0027 invoca davvero `get(0)` sull\u0027`ArrayList` vuoto, lanciando subito `IndexOutOfBoundsException`; e\u0027 il classico tranello dello spy, che si evita con la forma `doReturn(\"A\").when(spy).get(0)` che non esegue il metodo reale.\nLe altre opzioni: non arriva a restituire \"A\" ne\u0027 null perche\u0027 esplode allo stubbing; il codice compila regolarmente."},{"type":"mcq","prompt":"A quante invocazioni corrisponde verify(mock).save(entity); senza specificare un VerificationMode?","code":"","options":["Esattamente una, equivale a verify(mock, times(1)).save(entity)","Almeno una invocazione","Qualsiasi numero di invocazioni, incluso zero","Esattamente zero invocazioni"],"correct":0,"explanation":"In sintesi: `verify(mock)` senza modalita\u0027 usa il default `times(1)`, quindi verifica che il metodo sia stato invocato esattamente una volta, ne\u0027 di piu\u0027 ne\u0027 di meno.\nLe altre opzioni: \u0027almeno una\u0027 e\u0027 `atLeastOnce()`; \u0027qualsiasi numero\u0027 non e\u0027 il default e comunque si esprime con `atLeast(0)`; \u0027esattamente zero\u0027 e\u0027 `never()`."},{"type":"truefalse","prompt":"Una code coverage del 100% garantisce che il codice sia privo di bug.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: l\u0027affermazione e\u0027 falsa perche\u0027 la coverage misura solo quali righe/rami vengono eseguiti dai test, non se le asserzioni verificano il comportamento giusto; posso avere 100% di copertura con test senza assert, o che non coprono i casi limite e i dati che scatenano il bug.\nLe altre opzioni: l\u0027errore tipico e\u0027 trattare la coverage come metrica di qualita\u0027 anziche\u0027 di esecuzione; e\u0027 una condizione necessaria ma non sufficiente."},{"type":"mcq","prompt":"Nel pattern AAA (Arrange-Act-Assert), in cosa consiste la fase \u0027Act\u0027?","code":"","options":["Nell\u0027invocazione del metodo o comportamento sotto test","Nella preparazione di dati, dipendenze e stubbing","Nella verifica del risultato atteso","Nella pulizia delle risorse dopo il test"],"correct":0,"explanation":"In sintesi: nel pattern AAA la fase \u0027Act\u0027 e\u0027 l\u0027azione centrale del test, cioe\u0027 la singola invocazione del metodo sotto test; idealmente e\u0027 una sola riga, netta e ben separata da preparazione e verifica.\nLe altre opzioni: la preparazione e\u0027 \u0027Arrange\u0027; la verifica del risultato e\u0027 \u0027Assert\u0027; la pulizia risorse e\u0027 teardown (`@AfterEach`), fuori dal ciclo AAA."},{"type":"code","prompt":"A cosa serve principalmente ArgumentCaptor in questo test?","code":"ArgumentCaptor\u003cUser\u003e captor = ArgumentCaptor.forClass(User.class);\nservice.register(\"mario\");\nverify(repository).save(captor.capture());\nassertEquals(\"mario\", captor.getValue().getName());","options":["A catturare l\u0027argomento realmente passato al mock per poterci fare asserzioni","A definire il valore di ritorno del metodo save","A contare quante volte save e\u0027 stato invocato","A creare automaticamente un nuovo mock del repository"],"correct":0,"explanation":"In sintesi: `ArgumentCaptor` cattura l\u0027oggetto effettivamente passato al mock durante la verifica, cosi\u0027 con `getValue()` posso ispezionarlo e asserire sui suoi campi; e\u0027 utile quando l\u0027argomento e\u0027 costruito internamente al metodo sotto test e non lo conosco a priori.\nLe altre opzioni: il valore di ritorno si definisce con `thenReturn`; il conteggio si fa con `times(n)`; il captor non crea mock, li crea `mock()`/`@Mock`."},{"type":"mcq","prompt":"Cosa fa l\u0027annotazione @InjectMocks di Mockito?","code":"","options":["Crea un\u0027istanza della classe sotto test e vi inietta i campi annotati con @Mock","Trasforma la classe annotata in un mock","Inietta i mock nel contesto di Spring al posto dei bean reali","Verifica automaticamente tutte le interazioni sui mock"],"correct":0,"explanation":"In sintesi: `@InjectMocks` istanzia la classe reale sotto test e vi inietta le dipendenze dichiarate con `@Mock`, tramite costruttore, setter o field injection; e\u0027 il modo per assemblare il SUT con i suoi doppi senza wiring manuale.\nLe altre opzioni: non crea un mock della classe, la istanzia davvero; non ha nulla a che fare con il contesto Spring (li\u0027 si usa `@MockBean`); non verifica interazioni, quello e\u0027 `verify`."},{"type":"truefalse","prompt":"Un test che dipende da LocalDateTime.now() o da Math.random() rispetta il principio di determinismo/ripetibilita\u0027 dei test.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: l\u0027affermazione e\u0027 falsa perche\u0027 `now()` e `random()` introducono non-determinismo: lo stesso test puo\u0027 passare o fallire in run diversi, violando la \u0027R\u0027 di Repeatable in FIRST; la soluzione e\u0027 iniettare un `Clock` o un generatore controllabile cosi\u0027 da fissare l\u0027input.\nLe altre opzioni: l\u0027errore tipico e\u0027 pensare che \u0027di solito passa\u0027 basti; un test deve dare lo stesso esito a ogni esecuzione, indipendentemente da orario o caso."},{"type":"mcq","prompt":"Nell\u0027acronimo FIRST dei test, cosa rappresenta la lettera \u0027I\u0027?","code":"","options":["Isolated/Independent: i test non dipendono l\u0027uno dall\u0027altro ne\u0027 dall\u0027ordine di esecuzione","Integrated: ogni test deve integrare piu\u0027 componenti reali","Immutable: i test non devono mai essere modificati","Interactive: i test richiedono input dall\u0027utente"],"correct":0,"explanation":"In sintesi: in FIRST la \u0027I\u0027 sta per Isolated/Independent, cioe\u0027 ogni test e\u0027 autonomo, non condivide stato con gli altri e da\u0027 lo stesso risultato a prescindere dall\u0027ordine di esecuzione; le altre lettere sono Fast, Repeatable, Self-validating, Timely.\nLe altre opzioni: \u0027Integrated\u0027 e\u0027 l\u0027opposto dell\u0027isolamento voluto; \u0027Immutable\u0027 e \u0027Interactive\u0027 non fanno parte dell\u0027acronimo e contraddicono la natura automatica dei test."},{"type":"mcq","prompt":"Nel ciclo TDD red-green-refactor, cosa si fa nella fase \u0027green\u0027?","code":"","options":["Si scrive il codice di produzione minimo necessario per far passare il test","Si scrive un nuovo test che fallisce","Si migliora il design del codice senza cambiarne il comportamento","Si eliminano i test che rallentano la build"],"correct":0,"explanation":"In sintesi: nel ciclo TDD si parte da \u0027red\u0027 scrivendo un test che fallisce, poi in \u0027green\u0027 si aggiunge il codice minimo che lo fa passare (anche brutto), e infine in \u0027refactor\u0027 si migliora il design con la rete di sicurezza dei test verdi.\nLe altre opzioni: scrivere un test che fallisce e\u0027 \u0027red\u0027; migliorare il design a comportamento invariato e\u0027 \u0027refactor\u0027; eliminare test non fa parte del ciclo."},{"type":"code","prompt":"Quante volte viene eseguito questo test e come?","code":"@ParameterizedTest\n@ValueSource(ints = {2, 4, 6})\nvoid isEven(int n) {\n    assertTrue(n % 2 == 0);\n}","options":["Tre volte, una per ogni valore della sorgente (2, 4, 6)","Una sola volta, usando solo l\u0027ultimo valore","Non compila perche\u0027 manca anche @Test","Tre volte, ma condividendo lo stesso valore per tutte le esecuzioni"],"correct":0,"explanation":"In sintesi: `@ParameterizedTest` con `@ValueSource(ints = {2,4,6})` esegue il metodo una volta per ogni valore, quindi tre invocazioni distinte, ciascuna con il proprio `n`; ogni ripetizione appare come caso separato nel report.\nLe altre opzioni: non usa solo l\u0027ultimo valore; `@ParameterizedTest` sostituisce `@Test`, quindi non serve aggiungerlo (anzi non va messo); i valori non sono condivisi, cambiano a ogni run."},{"type":"mcq","prompt":"Secondo la classificazione di Fowler/Meszaros, qual e\u0027 la differenza tra uno stub e un mock?","code":"","options":["Lo stub fornisce risposte predefinite (state verification); il mock verifica le interazioni attese (behavior verification)","Lo stub verifica le chiamate ricevute, il mock si limita a fornire dati","Sono esattamente la stessa cosa con due nomi diversi","Lo stub e\u0027 sempre piu\u0027 veloce del mock a runtime"],"correct":0,"explanation":"In sintesi: lo stub e\u0027 un doppio che fornisce risposte \u0027pilotate\u0027 per far procedere il test, e si verifica lo stato del risultato; il mock ha invece aspettative sulle interazioni e fallisce se le chiamate attese non avvengono come previsto, quindi fa behavior verification.\nLe altre opzioni: \u0027stub verifica le chiamate\u0027 inverte i ruoli; non sono sinonimi (sono test double diversi); la differenza e\u0027 concettuale, non di performance."},{"type":"truefalse","prompt":"@DataJpaTest carica l\u0027intero contesto applicativo di Spring Boot, inclusi i bean @Service e @Controller.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: l\u0027affermazione e\u0027 falsa perche\u0027 `@DataJpaTest` e\u0027 uno slice test che configura solo il layer di persistenza JPA (repository, `EntityManager`, DataSource, di default un DB in-memory) e non registra `@Service` o `@Controller`; per l\u0027intero contesto serve `@SpringBootTest`.\nLe altre opzioni: l\u0027errore tipico e\u0027 confondere gli slice test con il full context; gli slice caricano deliberatamente solo una fetta dell\u0027applicazione per restare rapidi e mirati."},{"type":"code","prompt":"Entrambi i test passano? Il lifecycle e\u0027 quello di default di JUnit 5.","code":"class CounterTest {\n    int counter = 0;\n    @BeforeEach void setup() { counter++; }\n    @Test void a() { assertEquals(1, counter); }\n    @Test void b() { assertEquals(1, counter); }\n}","options":["Si\u0027: JUnit crea una nuova istanza per ogni test, quindi counter vale sempre 1","No: nel secondo test counter vale 2","No: counter resta 0 perche\u0027 setup non viene eseguito","Il codice non compila"],"correct":0,"explanation":"In sintesi: con il lifecycle di default `PER_METHOD` JUnit 5 istanzia una nuova copia della classe di test per ogni metodo, quindi `counter` riparte da 0 e `@BeforeEach` lo porta a 1 prima di ciascun test; entrambe le asserzioni passano. E\u0027 proprio questo isolamento tra istanze a garantire l\u0027indipendenza dei test.\nLe altre opzioni: \u0027counter vale 2\u0027 assume un\u0027istanza condivisa, vero solo con `@TestInstance(PER_CLASS)`; `@BeforeEach` viene eseguito; il codice compila."},{"type":"mcq","prompt":"Vuoi verificare che un metodo del mock NON sia mai stato invocato. Quale forma usi?","code":"","options":["verify(mock, never()).method()","verify(mock, times(1)).method()","verifyZero(mock).method()","assertFalse(mock.method())"],"correct":0,"explanation":"In sintesi: per asserire zero invocazioni si usa `verify(mock, never()).method()`, equivalente a `times(0)`; in alternativa, per tutto il mock, `verifyNoInteractions(mock)`.\nLe altre opzioni: `times(1)` verifica esattamente una chiamata; `verifyZero(...)` non esiste in Mockito; `assertFalse(mock.method())` invoca davvero il metodo e testa il valore, non l\u0027assenza di interazione."},{"type":"code","prompt":"Qual e\u0027 il comportamento risultante da questo stubbing?","code":"when(repo.findById(1L)).thenThrow(new EntityNotFoundException());\n// ...\nOptional\u003cUser\u003e u = repo.findById(1L);","options":["La chiamata a repo.findById(1L) lancia EntityNotFoundException","repo.findById(1L) restituisce Optional vuoto senza eccezioni","L\u0027eccezione viene lanciata subito alla riga di stubbing, non alla chiamata","Non compila: non si possono stubbare eccezioni con thenThrow"],"correct":0,"explanation":"In sintesi: `thenThrow` configura il mock affinche\u0027, quando viene chiamato `findById(1L)` con quell\u0027argomento, lanci l\u0027eccezione indicata; l\u0027eccezione scatta all\u0027invocazione stubbata, non prima. E\u0027 il modo standard per simulare percorsi di errore delle dipendenze.\nLe altre opzioni: non ritorna un Optional vuoto perche\u0027 e\u0027 stubbato a lanciare; l\u0027eccezione non viene lanciata alla riga di setup ma alla chiamata; `thenThrow` esiste ed e\u0027 proprio per questo."},{"type":"mcq","prompt":"Quale di questi e\u0027 propriamente uno unit test?","code":"","options":["Testa una singola classe isolando le sue dipendenze con dei mock","Testa il flusso completo dal controller fino al database reale","Avvia l\u0027intero contesto Spring Boot e chiama endpoint REST via HTTP","Chiama un servizio esterno di terze parti attraverso la rete"],"correct":0,"explanation":"In sintesi: uno unit test esercita una singola unita\u0027 (tipicamente una classe) in isolamento, sostituendo le collaborazioni con doppi come i mock, cosi\u0027 resta veloce, deterministico e mirato sul comportamento di quella logica.\nLe altre opzioni: flusso controller-DB reale e contesto Spring completo sono integration/E2E; la chiamata a un servizio esterno via rete introduce dipendenze non isolate, tipiche dei test di integrazione."},{"type":"truefalse","prompt":"In Mockito, when(mock.metodoVoid()).thenReturn(...) non compila per un metodo void; per i metodi void si usano forme come doThrow/doNothing/doAnswer.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: l\u0027affermazione e\u0027 vera perche\u0027 `when(...)` richiede un\u0027espressione con valore, ma un metodo `void` non ne produce, quindi non lo si puo\u0027 passare come argomento e il codice non compila; per stubbare i void si usa la famiglia `doNothing()/doThrow()/doAnswer().when(mock).metodo()`.\nLe altre opzioni: l\u0027errore tipico e\u0027 provare la sintassi `when(...).thenReturn()` sui void; per i void serve la forma `do*().when()` che stubba senza invocare realmente il metodo."},{"type":"code","prompt":"Cosa succede eseguendo questa asserzione in JUnit 5?","code":"@Test\nvoid sum() {\n    assertEquals(0.3, 0.1 + 0.2);\n}","options":["Il test fallisce per l\u0027errore di arrotondamento in virgola mobile; serve la variante con delta","Il test passa perche\u0027 0.1 + 0.2 e\u0027 esattamente 0.3","Il codice non compila","Il test viene ignorato perche\u0027 i double non sono confrontabili"],"correct":0,"explanation":"In sintesi: in aritmetica IEEE 754 `0.1 + 0.2` da\u0027 `0.30000000000000004`, quindi `assertEquals(double, double)` senza tolleranza confronta valori diversi e il test fallisce; per i double si usa l\u0027overload con `delta`, es. `assertEquals(0.3, 0.1 + 0.2, 1e-9)`.\nLe altre opzioni: non passa perche\u0027 la somma non e\u0027 esattamente 0.3; il codice compila (l\u0027overload double esiste); il test non viene affatto ignorato."},{"type":"mcq","prompt":"Per cosa e\u0027 indicato lo slice test @WebMvcTest?","code":"","options":["Testare il layer web (controller) in isolamento, con MockMvc e i @Service mockati","Testare il layer di persistenza JPA con un database in-memory","Testare l\u0027intera applicazione end-to-end con un server reale","Testare classi di pura utilita\u0027 senza alcun contesto Spring"],"correct":0,"explanation":"In sintesi: `@WebMvcTest` carica solo il layer MVC (controller, filtri, converter, `@ControllerAdvice`) e mette a disposizione `MockMvc`, mentre le dipendenze di servizio si forniscono come mock (`@MockBean`); e\u0027 lo slice giusto per testare routing, serializzazione e validazione delle richieste.\nLe altre opzioni: la persistenza JPA e\u0027 `@DataJpaTest`; l\u0027E2E con server reale e\u0027 `@SpringBootTest` con `RANDOM_PORT`; per classi pure senza Spring basta un plain unit test."},{"type":"code","prompt":"Ogni chiamata a service.process() invoca logger.log(...) una volta. Qual e\u0027 l\u0027esito del test?","code":"service.process();\nservice.process();\nverify(logger, times(1)).log(anyString());","options":["Il test fallisce: log e\u0027 stato invocato 2 volte ma se ne attendeva 1","Il test passa: verify controlla solo che ci sia almeno una chiamata","Il codice non compila per l\u0027uso di anyString()","Il test passa: verify ignora il numero effettivo di invocazioni"],"correct":0,"explanation":"In sintesi: `process()` chiamato due volte produce due invocazioni di `logger.log(...)`, ma `times(1)` pretende esattamente una chiamata, quindi Mockito fallisce segnalando \u0027Wanted 1 time but was 2 times\u0027.\nLe altre opzioni: \u0027almeno una\u0027 sarebbe `atLeastOnce()`, non `times(1)`; `anyString()` e\u0027 un matcher valido e compila; `times(n)` verifica il conteggio esatto, non lo ignora."},{"type":"mcq","prompt":"Cosa misura effettivamente la line/branch coverage?","code":"","options":["Quali righe e rami del codice vengono eseguiti dai test, non la correttezza delle asserzioni","Il numero stimato di bug ancora presenti nel codice","La qualita\u0027 e la significativita\u0027 delle asserzioni scritte","Il tempo di esecuzione complessivo della suite di test"],"correct":0,"explanation":"In sintesi: la coverage misura quali istruzioni (line) e quali diramazioni condizionali (branch) sono state percorse durante l\u0027esecuzione dei test; e\u0027 un indicatore di cosa e\u0027 stato esercitato, non se il test verifica il risultato corretto ne\u0027 se coglie il caso limite giusto.\nLe altre opzioni: non stima i bug residui; non giudica la bonta\u0027 delle asserzioni (posso avere 100% senza un solo assert); non ha a che vedere col tempo di esecuzione."},{"type":"truefalse","prompt":"Uno unit test ben scritto dovrebbe poter essere eseguito senza database, rete o filesystem.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: l\u0027affermazione e\u0027 vera perche\u0027 lo unit test isola l\u0027unita\u0027 sostituendo le risorse esterne (DB, rete, disco) con doppi di test; questo lo rende veloce, deterministico e indipendente dall\u0027ambiente, coerente con i principi FIRST.\nLe altre opzioni: l\u0027errore tipico e\u0027 chiamare \u0027unit test\u0027 qualcosa che tocca il DB reale; quel test esiste ma e\u0027 un integration test, con velocita\u0027 e isolamento diversi."},{"type":"code","prompt":"Senza alcuno stubbing, quale valore ha result?","code":"UserRepository repo = mock(UserRepository.class);\n// firma: Optional\u003cUser\u003e findByEmail(String email)\nOptional\u003cUser\u003e result = repo.findByEmail(\"x@y.z\");","options":["Optional.empty(): di default Mockito ritorna un Optional vuoto, non null","null, che provochera\u0027 NullPointerException al primo utilizzo","Lancia un\u0027eccezione perche\u0027 il metodo non e\u0027 stato stubbato","Un Optional contenente un oggetto User vuoto"],"correct":0,"explanation":"In sintesi: con l\u0027answer di default `RETURNS_DEFAULTS`, Mockito per i tipi \u0027contenitore\u0027 restituisce valori vuoti sensati, quindi per un metodo che ritorna `Optional\u003cUser\u003e` da\u0027 `Optional.empty()`, non `null`; allo stesso modo darebbe liste/insiemi vuoti per le collezioni.\nLe altre opzioni: non e\u0027 null (proprio per evitare NPE su Optional/collections); un metodo non stubbato non lancia, ritorna il default; non c\u0027e\u0027 alcun User avvolto, l\u0027Optional e\u0027 vuoto."},{"type":"mcq","prompt":"Perche\u0027 i campi annotati @Mock restano null se non si fa altro?","code":"","options":["Vanno inizializzati con MockitoAnnotations.openMocks(this) o abilitando @ExtendWith(MockitoExtension.class)","@Mock non esiste in Mockito, e\u0027 un\u0027annotazione di JUnit","Manca l\u0027annotazione @Autowired sopra i campi","Perche\u0027 i campi @Mock devono essere dichiarati static"],"correct":0,"explanation":"In sintesi: `@Mock` e\u0027 dichiarativa: i mock vengono creati e iniettati solo quando qualcosa processa le annotazioni, cioe\u0027 `MockitoAnnotations.openMocks(this)` (di solito in `@BeforeEach`) oppure l\u0027estensione JUnit 5 `@ExtendWith(MockitoExtension.class)`; senza uno dei due i campi restano null.\nLe altre opzioni: `@Mock` esiste ed e\u0027 di Mockito; `@Autowired` riguarda Spring, non l\u0027inizializzazione dei mock; non devono essere static."},{"type":"code","prompt":"Cosa verifica esattamente questo blocco di test?","code":"Exception ex = assertThrows(\n    IllegalArgumentException.class,\n    () -\u003e service.withdraw(-10));\nassertEquals(\"Amount must be positive\", ex.getMessage());","options":["Che venga lanciata IllegalArgumentException e che il suo messaggio sia esattamente quello atteso","Solo che il metodo withdraw non lanci alcuna eccezione","Che il metodo withdraw restituisca il valore -10","Nulla di utile: assertThrows non restituisce l\u0027eccezione, quindi non compila"],"correct":0,"explanation":"In sintesi: `assertThrows` verifica che l\u0027esecuzione del lambda lanci `IllegalArgumentException` e restituisce l\u0027istanza catturata, cosi\u0027 con `getMessage()` e un secondo assert si controlla anche che il messaggio sia esattamente \u0027Amount must be positive\u0027; e\u0027 il pattern per validare tipo e contenuto dell\u0027errore.\nLe altre opzioni: non verifica l\u0027assenza di eccezioni, anzi ne pretende una; non controlla alcun valore di ritorno; `assertThrows` restituisce eccome l\u0027eccezione, quindi compila."},{"type":"mcq","prompt":"Cosa consente di fare InOrder in Mockito?","code":"","options":["Verificare che alcune interazioni siano avvenute in un ordine specifico","Ordinare alfabeticamente i mock prima dell\u0027esecuzione","Eseguire i test in parallelo su piu\u0027 thread","Sostituire @InjectMocks nell\u0027assemblaggio delle dipendenze"],"correct":0,"explanation":"In sintesi: `InOrder` permette la verifica ordinata delle interazioni: creo `InOrder inOrder = inOrder(mockA, mockB)` e poi chiamo i `verify` nella sequenza attesa, cosi\u0027 il test fallisce se le chiamate avvengono in ordine diverso da quello dichiarato.\nLe altre opzioni: non ordina i mock; non gestisce parallelismo; non c\u0027entra con l\u0027iniezione delle dipendenze di `@InjectMocks`."},{"type":"truefalse","prompt":"Con @SpringBootTest(webEnvironment = RANDOM_PORT) viene avviato un servlet container reale su una porta casuale, utile per test di integrazione con TestRestTemplate/WebTestClient.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: l\u0027affermazione e\u0027 vera perche\u0027 `webEnvironment = RANDOM_PORT` fa partire un embedded server reale su una porta libera casuale (iniettabile con `@LocalServerPort`), permettendo test HTTP end-to-end sul contesto completo tramite `TestRestTemplate` o `WebTestClient`.\nLe altre opzioni: l\u0027errore tipico e\u0027 confonderlo con `MOCK`, che invece non avvia un server reale ma un ambiente web fittizio da usare con `MockMvc`; `RANDOM_PORT` serve proprio quando si vuole il traffico HTTP vero."}]},{"id":"devops","title":"Build \u0026 DevOps (Maven/Gradle/Git/SVN/Jenkins)","questions":[{"type":"mcq","prompt":"In quale ordine Maven esegue le fasi del default lifecycle quando lanci `mvn install`?","code":"","options":["compile -\u003e validate -\u003e package -\u003e test -\u003e install","compile -\u003e test -\u003e package -\u003e deploy -\u003e install","validate -\u003e compile -\u003e test -\u003e package -\u003e install","validate -\u003e test -\u003e compile -\u003e package -\u003e install"],"correct":2,"explanation":"In sintesi: il default lifecycle di Maven procede in ordine `validate`, `compile`, `test`, `package`, `install`, `deploy`, e lanciando una fase Maven esegue automaticamente tutte quelle precedenti; quindi `mvn install` passa da validate fino a package prima di installare l\u0027artifact nel repository locale.\nLe altre opzioni: mettere `compile` prima di `validate` o `test` prima di `compile` inverte l\u0027ordine reale, e `deploy` viene dopo `install`, non prima."},{"type":"mcq","prompt":"Quale scope Maven useresti per una dipendenza come le Servlet API, necessaria in compilazione ma fornita a runtime dall\u0027application server?","code":"","options":["compile","runtime","provided","test"],"correct":2,"explanation":"In sintesi: lo scope `provided` indica che la dipendenza serve per compilare ma è fornita a runtime dall\u0027ambiente (container/app server), quindi non viene impacchettata nell\u0027artifact finale: è il caso classico delle Servlet API.\nLe altre opzioni: `compile` la includerebbe nel pacchetto duplicandola, `runtime` la esclude dalla compilazione (qui serve compilare), `test` la limiterebbe alla sola fase di test."},{"type":"code","prompt":"Data questa gerarchia di dipendenze, quale versione di `C` risolve Maven applicando la strategia nearest-wins?","code":"Project\n├── A:1.0\n│   └── C:1.2\n└── B:1.0\n    └── E:1.0\n        └── C:1.5","options":["nessuna: build fallita per conflitto","C:1.2","C:1.5","entrambe, una per ciascun ramo"],"correct":1,"explanation":"In sintesi: Maven risolve i conflitti con la strategia nearest-wins, cioè vince la dipendenza più vicina alla radice nell\u0027albero; `C:1.2` è a profondità 2 mentre `C:1.5` è a profondità 3, quindi prevale `C:1.2`.\nLe altre opzioni: `C:1.5` è più profonda e perde, Maven non tiene due versioni della stessa dipendenza nello stesso classpath, e un conflitto di versioni non blocca la build (a differenza di un enforcer configurato apposta)."},{"type":"truefalse","prompt":"Una dipendenza `1.0.0-SNAPSHOT` può cambiare contenuto binario nel tempo mantenendo la stessa versione, mentre una release come `1.0.0` è considerata immutabile.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: l\u0027affermazione è vera perché una `-SNAPSHOT` è una versione in sviluppo che Maven ri-scarica periodicamente dal repository remoto potendo cambiare a parità di nome, mentre una release è pubblicata una sola volta e trattata come immutabile.\nLe altre opzioni: dire il contrario è l\u0027errore tipico: confondere il comportamento mutevole degli SNAPSHOT con l\u0027immutabilità delle release."},{"type":"mcq","prompt":"Qual è la differenza tra `mvn install` e `mvn deploy`?","code":"","options":["install compila soltanto, deploy esegue anche i test","install copia l\u0027artifact nel repository locale (~/.m2), deploy lo pubblica anche sul repository remoto","sono sinonimi con nomi diversi","deploy installa in locale, install pubblica sul remoto"],"correct":1,"explanation":"In sintesi: `install` è la fase che copia l\u0027artifact nel repository locale `~/.m2` rendendolo disponibile agli altri progetti sulla stessa macchina, mentre `deploy` è la fase finale che lo pubblica sul repository remoto condiviso (es. Nexus/Artifactory).\nLe altre opzioni: entrambe eseguono compilazione e test come fasi precedenti, non sono sinonimi, e i ruoli locale/remoto non vanno invertiti."},{"type":"mcq","prompt":"Una dipendenza dichiarata con scope `test` (es. JUnit) dove è disponibile?","code":"","options":["nell\u0027artifact finale distribuito","a runtime in produzione ma non durante i test","solo per compilazione ed esecuzione dei test, non nel classpath di produzione","fornita dal container a runtime"],"correct":2,"explanation":"In sintesi: lo scope `test` limita la dipendenza al classpath di compilazione ed esecuzione dei test e la esclude dall\u0027artifact di produzione, ideale per framework come JUnit o Mockito.\nLe altre opzioni: non finisce nel pacchetto finale né è disponibile a runtime in produzione, e `provided` (non `test`) è lo scope per le dipendenze fornite dal container."},{"type":"truefalse","prompt":"Il repository locale Maven (di default `~/.m2/repository`) funge da cache delle dipendenze scaricate dai repository remoti.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: l\u0027affermazione è vera: il repository locale in `~/.m2/repository` conserva le dipendenze scaricate e gli artifact installati, così Maven le riusa senza riscaricarle a ogni build.\nLe altre opzioni: negarlo è l\u0027errore tipico di chi pensa che Maven contatti il remoto a ogni build ignorando il ruolo di cache del repository locale."},{"type":"mcq","prompt":"Devi impedire che una dipendenza transitiva indesiderata (es. una vecchia `commons-logging` portata da una libreria) finisca nel classpath. Cosa usi nel pom.xml?","code":"","options":["lo scope `provided` sull\u0027intero progetto","il tag `\u003coptional\u003etrue\u003c/optional\u003e` sul progetto","cancellare manualmente il jar dal repository locale","il tag `\u003cexclusions\u003e` all\u0027interno della dipendenza che la trascina"],"correct":3,"explanation":"In sintesi: per tagliare una dipendenza transitiva indesiderata si usa `\u003cexclusions\u003e` dentro la dipendenza diretta che la porta, indicando `groupId`/`artifactId` da escludere dal grafo.\nLe altre opzioni: `provided` cambia solo dove la dipendenza è disponibile, `\u003coptional\u003e` riguarda ciò che il tuo progetto NON propaga ai consumatori, e cancellare il jar dalla cache locale è inutile perché verrebbe riscaricato."},{"type":"mcq","prompt":"Quale affermazione descrive correttamente una differenza tra Gradle e Maven?","code":"","options":["Gradle non gestisce le dipendenze, ci pensa solo Maven","Gradle usa uno script basato su DSL (Groovy/Kotlin) con build incrementali e cache, mentre Maven usa un pom.xml dichiarativo in XML","Maven supporta build incrementali mentre Gradle ricompila sempre tutto da zero","Gradle non conosce il concetto di dipendenze transitive"],"correct":1,"explanation":"In sintesi: Gradle definisce la build con uno script in un DSL Groovy o Kotlin ed è ottimizzato per build incrementali e caching, mentre Maven è dichiarativo con `pom.xml` in XML e un lifecycle a fasi fisse.\nLe altre opzioni: entrambi gestiscono dipendenze e transitività, ed è Gradle (non Maven) a puntare sulle build incrementali evitando di ricompilare ciò che non è cambiato."},{"type":"mcq","prompt":"In Gradle, cosa rappresenta un `task`?","code":"","options":["un repository remoto di dipendenze","un file di configurazione in formato XML","l\u0027unità di lavoro elementare di una build (es. `compileJava`, `test`, `jar`)","un branch del progetto in versione"],"correct":2,"explanation":"In sintesi: in Gradle il `task` è l\u0027unità atomica di lavoro della build, come `compileJava`, `test` o `jar`, e i task compongono un grafo di dipendenze (DAG) che Gradle esegue nell\u0027ordine corretto.\nLe altre opzioni: un repository è la fonte delle dipendenze, il file di build Gradle non è XML ma un DSL, e un branch è un concetto di version control, non di Gradle."},{"type":"code","prompt":"Nel seguente `build.gradle`, dove è disponibile `junit-jupiter`?","code":"dependencies {\n    implementation \u0027org.springframework:spring-core:6.1.0\u0027\n    testImplementation \u0027org.junit.jupiter:junit-jupiter:5.10.0\u0027\n}","options":["anche nell\u0027artifact di produzione, come spring-core","solo nel classpath di compilazione ed esecuzione dei test","a runtime in produzione ma non nei test","non è una dichiarazione valida"],"correct":1,"explanation":"In sintesi: la configuration `testImplementation` mette `junit-jupiter` solo nel classpath di compilazione ed esecuzione dei test, senza esporlo al codice di produzione né includerlo nell\u0027artifact; è l\u0027equivalente Gradle dello scope `test` di Maven.\nLe altre opzioni: `spring-core` è in `implementation` quindi disponibile in produzione, ma la dipendenza di test non lo è né a runtime né nel pacchetto, e la sintassi è perfettamente valida."},{"type":"mcq","prompt":"A cosa serve l\u0027area di staging (index) in Git?","code":"","options":["a inviare automaticamente i commit al server remoto","a memorizzare i branch remoti tracciati","a comporre e preparare esattamente l\u0027insieme di modifiche che finiranno nel prossimo commit","a risolvere automaticamente i conflitti di merge"],"correct":2,"explanation":"In sintesi: l\u0027area di staging (o index) è lo spazio intermedio dove con `git add` selezioni con precisione quali modifiche entreranno nel prossimo commit, separando ciò che è pronto da ciò che è ancora in lavorazione nella working directory.\nLe altre opzioni: l\u0027invio al remoto è `push`, i branch remoti sono tracciati altrove, e la risoluzione dei conflitti è manuale, non un compito dello staging."},{"type":"truefalse","prompt":"`git pull` per default si limita a scaricare i commit dal remoto con `git fetch`, senza fonderli nel branch locale.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: l\u0027affermazione è falsa: `git pull` di default esegue `git fetch` seguito da `git merge`, quindi scarica E integra nel branch locale i commit del branch remoto tracciato (opzionalmente `rebase` se configurato con `pull.rebase`).\nLe altre opzioni: crederla vera significa confondere `pull` con il solo `git fetch`, che aggiorna i riferimenti remoti senza toccare il branch corrente."},{"type":"mcq","prompt":"Qual è la differenza principale tra `git merge` e `git rebase`?","code":"","options":["merge riscrive la storia dei commit, rebase la lascia intatta","sono identici, cambia solo il nome del comando","rebase va usato solo su branch remoti condivisi","merge crea un commit di merge unendo le storie e preservandole; rebase riapplica i tuoi commit sopra una nuova base ottenendo una storia lineare"],"correct":3,"explanation":"In sintesi: `merge` integra due branch creando un commit di merge e mantiene entrambe le storie così come sono, mentre `rebase` riscrive i tuoi commit riapplicandoli sopra un\u0027altra base per ottenere una storia lineare senza commit di merge.\nLe altre opzioni: è il rebase (non il merge) a riscrivere la storia, i due comandi non sono equivalenti, e il rebase va evitato proprio sui branch già condivisi/pubblicati."},{"type":"mcq","prompt":"Quando `git merge` produce un fast-forward?","code":"","options":["sempre: ogni merge è per definizione un fast-forward","quando il branch corrente non ha commit nuovi rispetto a quello da unire, così Git sposta solo il puntatore in avanti senza commit di merge","quando ci sono conflitti da risolvere manualmente","quando si passa l\u0027opzione `--no-ff`"],"correct":1,"explanation":"In sintesi: il fast-forward avviene quando il branch corrente non è divergente, cioè non ha commit propri oltre al punto di partenza dell\u0027altro branch: Git si limita a spostare il puntatore in avanti senza creare un commit di merge.\nLe altre opzioni: se le storie sono divergenti serve un vero merge, i conflitti implicano proprio divergenza, e `--no-ff` forza l\u0027opposto creando comunque un commit di merge."},{"type":"mcq","prompt":"Qual è la differenza tra `git reset` e `git revert`?","code":"","options":["sono sinonimi con effetti identici","revert cancella fisicamente i commit, reset li preserva","reset sposta HEAD/branch indietro potendo alterare la storia; revert crea un NUOVO commit che annulla un commit precedente preservando la storia","revert funziona solo sui repository remoti"],"correct":2,"explanation":"In sintesi: `reset` riposiziona HEAD e il branch su un commit precedente e può riscrivere la storia locale, mentre `revert` è non distruttivo perché aggiunge un nuovo commit che inverte le modifiche di uno precedente, ideale su branch condivisi.\nLe altre opzioni: non sono sinonimi, è il reset (non il revert) a poter rimuovere commit dalla storia, e revert opera in locale come qualsiasi commit."},{"type":"mcq","prompt":"Cosa fa `git cherry-pick \u003ccommit\u003e`?","code":"","options":["unisce due branch interi in un solo passaggio","elimina definitivamente un commit dalla storia","crea un nuovo branch a partire dal commit indicato","applica al branch corrente le modifiche introdotte da uno specifico commit, creando un nuovo commit"],"correct":3,"explanation":"In sintesi: `cherry-pick` prende le modifiche di uno specifico commit e le riapplica sul branch corrente generando un nuovo commit (con un nuovo hash), utile per portare selettivamente una singola fix da un branch all\u0027altro.\nLe altre opzioni: non unisce interi branch (è merge), non elimina commit, e non crea branch (è `git branch`/`checkout -b`)."},{"type":"mcq","prompt":"In Git, cosa rappresenta `HEAD`?","code":"","options":["sempre e solo l\u0027ultimo commit del branch main","un puntatore al commit corrente, di norma attraverso il branch attualmente in checkout","il repository remoto configurato di default","l\u0027area di staging in cui prepari il commit"],"correct":1,"explanation":"In sintesi: `HEAD` è il riferimento al commit su cui sei posizionato, normalmente in modo simbolico puntando al branch corrente; nuovi commit avanzano HEAD e il branch insieme.\nLe altre opzioni: non è legato a main in particolare, non indica il remoto, e lo staging è l\u0027index, non HEAD."},{"type":"code","prompt":"Hai già committato `config.log` e solo dopo lo aggiungi a `.gitignore`. Cosa mostra l\u0027ultimo `git status`?","code":"$ git add config.log\n$ git commit -m \"add config\"\n$ echo \"config.log\" \u003e\u003e .gitignore\n$ echo \"new line\" \u003e\u003e config.log\n$ git status","options":["Git ignora subito il file e `git status` non mostra alcuna modifica","Git rimuove automaticamente il file dal repository","Git continua a tracciare `config.log` e ne mostra le modifiche: `.gitignore` non ignora i file già tracciati","`git status` termina con errore per conflitto con `.gitignore`"],"correct":2,"explanation":"In sintesi: `.gitignore` agisce solo sui file untracked, quindi un file già tracciato come `config.log` continua a essere versionato e `git status` mostra le sue modifiche; per smettere di tracciarlo servirebbe `git rm --cached config.log`.\nLe altre opzioni: il file non viene ignorato retroattivamente né rimosso automaticamente, e `git status` non va in errore."},{"type":"truefalse","prompt":"Nel modello distribuito di Git ogni clone contiene l\u0027intera storia del repository, permettendo commit e consultazione della storia anche offline.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: l\u0027affermazione è vera: Git è distribuito, quindi ogni clone è un repository completo con tutta la storia, e puoi committare, creare branch e navigare la history senza connessione al server.\nLe altre opzioni: negarlo confonde Git con un sistema centralizzato come SVN, dove per molte operazioni serve il server."},{"type":"code","prompt":"Esegui il comando seguente usando un hash di commit (non un nome di branch). In quale stato si trova il repository?","code":"$ git checkout a1b2c3d","options":["HEAD punta comunque al branch main","detached HEAD: HEAD punta direttamente a un commit e non a un branch; nuovi commit non apparterrebbero ad alcun branch","errore: non è possibile fare checkout di un commit specifico","Git crea automaticamente un branch chiamato a1b2c3d"],"correct":1,"explanation":"In sintesi: fare checkout diretto di un hash porta in detached HEAD, cioè HEAD punta a quel commit senza passare per un branch; eventuali nuovi commit sarebbero raggiungibili solo dall\u0027hash e rischierebbero di andare persi se non li salvi su un branch.\nLe altre opzioni: HEAD non resta agganciato a main, il checkout di un commit è lecito, e Git non crea alcun branch automatico."},{"type":"mcq","prompt":"Qual è la differenza tra `git reset --soft`, `--mixed` e `--hard` rispetto a un commit precedente?","code":"","options":["sono tre alias equivalenti dello stesso comportamento","--hard è il più sicuro perché preserva sempre le modifiche non committate","--soft cancella il contenuto della working directory","--soft sposta solo HEAD; --mixed (default) resetta anche lo staging ma non il working dir; --hard resetta anche il working dir scartando le modifiche"],"correct":3,"explanation":"In sintesi: `--soft` sposta solo HEAD lasciando staging e working directory intatti (le modifiche restano in staging), `--mixed` è il default e resetta anche lo staging ma conserva i file di lavoro, `--hard` allinea tutto scartando le modifiche non committate.\nLe altre opzioni: non sono equivalenti, `--hard` è il più distruttivo (non il più sicuro), ed è `--hard` non `--soft` a toccare la working directory."},{"type":"mcq","prompt":"In SVN, la convenzione `trunk/branches/tags` cosa rappresenta?","code":"","options":["sono tre server SVN distinti da configurare separatamente","trunk è la linea principale di sviluppo, branches contiene le linee parallele, tags contiene snapshot immutabili (es. release)","trunk contiene i tag e tags contiene i branch","è una struttura esclusiva di Git non presente in SVN"],"correct":1,"explanation":"In sintesi: in SVN `trunk`, `branches` e `tags` sono directory convenzionali del repository: `trunk` è la linea principale di sviluppo, `branches` ospita le linee parallele, e `tags` conserva snapshot immutabili tipicamente usati per le release.\nLe altre opzioni: sono directory dello stesso repository (non server distinti), i ruoli non vanno invertiti, ed è una convenzione tipica di SVN, non di Git."},{"type":"truefalse","prompt":"In SVN, come in Git, un `commit` è un\u0027operazione locale e serve un comando di `push` separato per inviarlo al server centrale.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: l\u0027affermazione è falsa: SVN è centralizzato e il `commit` scrive subito sul repository centrale del server, senza alcun `push`; è Git, distribuito, a separare `commit` (locale) da `push` (invio al remoto).\nLe altre opzioni: crederla vera significa attribuire a SVN il modello distribuito di Git, in cui commit e pubblicazione sono passi distinti."},{"type":"mcq","prompt":"Cos\u0027è una pipeline di CI/CD?","code":"","options":["un repository dedicato all\u0027archiviazione degli artifact","un branch protetto su cui è vietato committare direttamente","una sequenza automatizzata di fasi (es. build, test, package, deploy) eseguite a ogni cambiamento del codice","un particolare tipo di merge tra branch"],"correct":2,"explanation":"In sintesi: una pipeline CI/CD è una catena automatizzata di fasi, tipicamente build, test, package e deploy, che si attiva ai cambiamenti del codice per verificare e rilasciare le modifiche in modo ripetibile e rapido.\nLe altre opzioni: un repository di artifact, un branch protetto e un merge sono concetti correlati ma diversi dal flusso automatizzato che definisce una pipeline."},{"type":"mcq","prompt":"Cos\u0027è un `Jenkinsfile`?","code":"","options":["un plugin da installare sul controller Jenkins","un file di testo versionato nel repository che definisce la pipeline come codice (pipeline as code)","il file di log generato da ogni build","l\u0027artifact binario prodotto dalla build"],"correct":1,"explanation":"In sintesi: il `Jenkinsfile` è un file di testo versionato insieme al codice che descrive la pipeline (stage e step) secondo l\u0027approccio pipeline as code, permettendo di tracciare e rivedere la definizione della build come qualsiasi sorgente.\nLe altre opzioni: non è un plugin, non è il log di build, e non è l\u0027artifact prodotto ma la definizione del processo che lo produce."},{"type":"mcq","prompt":"Nel contesto di CI/CD, cos\u0027è un artifact?","code":"","options":["un errore di compilazione registrato nei log","un branch dedicato ai soli rilasci","un test che fallisce in modo intermittente","l\u0027output prodotto da una build (es. un JAR/WAR) archiviato per essere distribuito o deployato"],"correct":3,"explanation":"In sintesi: un artifact è il prodotto tangibile di una build, come un JAR o un WAR, che la pipeline archivia (spesso in un artifact repository) per poterlo poi distribuire o deployare negli ambienti.\nLe altre opzioni: non è un errore di compilazione, non è un branch, e non è un test instabile (quello è un test flaky)."},{"type":"truefalse","prompt":"L\u0027integrazione continua (CI) prevede che le modifiche siano integrate frequentemente nel branch condiviso, con build e test automatici che segnalano rapidamente le regressioni.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: l\u0027affermazione è vera: la CI si basa su integrazioni frequenti nel branch condiviso accompagnate da build e test automatici, così le regressioni emergono presto e il feedback verso lo sviluppatore è rapido.\nLe altre opzioni: negarlo trascura il cuore della CI, cioè automazione e integrazione frequente per ridurre il costo di trovare i problemi tardi."},{"type":"code","prompt":"Cosa descrive questa pipeline dichiarativa di Jenkins?","code":"pipeline {\n    agent any\n    stages {\n        stage(\u0027Build\u0027) {\n            steps { sh \u0027mvn clean package\u0027 }\n        }\n        stage(\u0027Test\u0027) {\n            steps { sh \u0027mvn test\u0027 }\n        }\n    }\n}","options":["una pipeline che esegue Build e Test in parallelo tra loro","un Jenkinsfile non valido perché manca il blocco `node`","una pipeline con due stage sequenziali (Build e Test) eseguiti su un agent qualsiasi disponibile","una semplice configurazione Maven senza relazione con Jenkins"],"correct":2,"explanation":"In sintesi: è una declarative pipeline con `agent any` che esegue su un qualsiasi executor disponibile e due `stage`, Build e Test, eseguiti in sequenza; ciascuno lancia il rispettivo comando `mvn` tramite lo step `sh`.\nLe altre opzioni: gli stage sono sequenziali non paralleli (servirebbe un blocco `parallel`), la declarative pipeline non richiede `node` (è tipico della scripted), e il blocco `pipeline {}` è proprio sintassi Jenkins."},{"type":"mcq","prompt":"Nel Semantic Versioning `MAJOR.MINOR.PATCH`, quando incrementi il numero MAJOR?","code":"","options":["quando correggi un bug in modo retrocompatibile","quando introduci modifiche incompatibili con le versioni precedenti (breaking changes)","quando aggiungi una funzionalità retrocompatibile","a ogni build automatica sul server CI"],"correct":1,"explanation":"In sintesi: nel semantic versioning si incrementa il MAJOR quando si introducono breaking changes, cioè modifiche incompatibili con l\u0027API precedente che possono rompere i consumatori esistenti.\nLe altre opzioni: un bugfix retrocompatibile alza il PATCH, una nuova funzionalità retrocompatibile alza il MINOR, e il numero di versione non cambia a ogni build."},{"type":"mcq","prompt":"Secondo il Semantic Versioning, passando da `2.4.1` a `2.5.0`, cosa è cambiato?","code":"","options":["sono state introdotte modifiche incompatibili (breaking changes)","è stata rilasciata solo una correzione di bug","è stata aggiunta almeno una funzionalità retrocompatibile (MINOR incrementato) e il PATCH è azzerato","la versione è regredita a uno stato precedente"],"correct":2,"explanation":"In sintesi: l\u0027incremento del MINOR da `2.4.1` a `2.5.0` indica l\u0027aggiunta di funzionalità retrocompatibili, e per regola il PATCH si azzera quando cambia il MINOR.\nLe altre opzioni: i breaking changes avrebbero alzato il MAJOR a 3.x, un semplice bugfix avrebbe toccato solo il PATCH, e non c\u0027è alcuna regressione perché il numero cresce."},{"type":"code","prompt":"Durante un merge trovi questo nel file sorgente. Cosa devi fare per completare correttamente il merge?","code":"\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD\nint timeout = 30;\n=======\nint timeout = 60;\n\u003e\u003e\u003e\u003e\u003e\u003e\u003e feature-branch","options":["Git risolverà da solo scegliendo il valore numerico più grande","è un conflitto di merge: modifichi il file scegliendo/combinando le versioni, rimuovi i marker, poi `git add` e commit","devi eliminare il file per far procedere il merge","basta eseguire `git push --force` per superare il conflitto"],"correct":1,"explanation":"In sintesi: quei marker `\u003c\u003c\u003c\u003c\u003c\u003c\u003c`, `=======` e `\u003e\u003e\u003e\u003e\u003e\u003e\u003e` segnalano un conflitto di merge che Git non può risolvere da solo; devi editare il file scegliendo o combinando le due versioni, togliere i marker, marcarlo risolto con `git add` e concludere con il commit.\nLe altre opzioni: Git non sceglie automaticamente per valore, non serve eliminare il file, e un `push --force` non c\u0027entra con la risoluzione del conflitto locale."}]},{"id":"design-patterns","title":"Design Pattern \u0026 SOLID","questions":[{"type":"mcq","prompt":"Secondo il Single Responsibility Principle (SRP), quando una classe dovrebbe avere motivo di cambiare?","code":"","options":["Per una sola ragione, cioè deve rispondere a un solo attore/motivo di cambiamento","Solo quando cambia il database sottostante","Mai: una classe ben scritta non cambia più nel tempo","Quando i suoi metodi pubblici superano una certa soglia numerica"],"correct":0,"explanation":"In sintesi: l\u0027SRP dice che una classe deve avere una sola responsabilità, ovvero un solo motivo per cambiare; nella formulazione di Uncle Bob significa rispondere a un solo attore/stakeholder. Se logiche che servono attori diversi (persistenza, formattazione, regole di business) convivono nella stessa classe, un cambiamento per uno rischia di rompere gli altri: vanno separate.\nLe altre opzioni: il DB è solo uno dei possibili motivi; \"non cambia mai\" è irrealistico; il numero di metodi non c\u0027entra, conta la coesione delle responsabilità."},{"type":"mcq","prompt":"Cosa afferma l\u0027Open/Closed Principle (OCP)?","code":"","options":["Le entità software devono essere aperte all\u0027estensione ma chiuse alla modifica","Le entità devono essere aperte alla modifica ma chiuse all\u0027estensione","Ogni classe deve essere `final` per impedire l\u0027ereditarietà","Le entità devono essere aperte sia all\u0027estensione sia alla modifica, senza vincoli"],"correct":0,"explanation":"In sintesi: l\u0027OCP dice che si deve poter estendere il comportamento di un modulo senza modificarne il codice già scritto e testato, tipicamente introducendo nuove implementazioni di un\u0027astrazione (interfacce, polimorfismo, `Strategy`) invece di aggiungere `if/switch` alla classe esistente.\nLe altre opzioni: la seconda inverte il principio; `final` ovunque nega proprio l\u0027estensione; \"aperte a tutto senza vincoli\" svuota di significato il principio."},{"type":"code","prompt":"Cosa stampa il seguente codice e quale principio SOLID mette in luce?","code":"class Rectangle {\n    protected int width, height;\n    void setWidth(int w) { this.width = w; }\n    void setHeight(int h) { this.height = h; }\n    int getArea() { return width * height; }\n}\nclass Square extends Rectangle {\n    @Override void setWidth(int w) { this.width = w; this.height = w; }\n    @Override void setHeight(int h) { this.width = h; this.height = h; }\n}\n\nRectangle r = new Square();\nr.setWidth(5);\nr.setHeight(4);\nSystem.out.println(r.getArea());","options":["16","20","25","Errore di compilazione"],"correct":0,"explanation":"In sintesi: `setWidth(5)` su `Square` porta width e height a 5, poi `setHeight(4)` li porta entrambi a 4, quindi l\u0027area è 4*4 = 16. Il client che usa un `Rectangle` si aspetta area 5*4=20: è il classico esempio di violazione del Liskov Substitution Principle, perché `Square` non è sostituibile a `Rectangle` senza rompere il contratto.\nLe altre opzioni: 20 sarebbe l\u0027area attesa da un vero rettangolo, 25 ignora la seconda `setHeight`, e non c\u0027è alcun errore di compilazione: `Square` estende correttamente `Rectangle`."},{"type":"mcq","prompt":"Cosa suggerisce l\u0027Interface Segregation Principle (ISP)?","code":"","options":["Preferire molte interfacce piccole e coese invece di una singola interfaccia generica e voluminosa che costringe i client a dipendere da metodi che non usano","Usare una sola grande interfaccia marker per tutto il dominio","Non usare mai interfacce, solo classi astratte","Segregare i dati dell\u0027applicazione in database fisicamente separati"],"correct":0,"explanation":"In sintesi: l\u0027ISP dice che un client non deve essere costretto a dipendere da metodi che non usa; meglio interfacce piccole e role-specific (es. `Readable`, `Closeable`) che un\u0027unica \"fat interface\", così le implementazioni non sono obbligate a fornire metodi inutili o a lanciare `UnsupportedOperationException`.\nLe altre opzioni: l\u0027interfaccia unica è proprio l\u0027anti-pattern che l\u0027ISP combatte; \"mai interfacce\" è irrilevante; la segregazione dei database è tema di persistenza, non di ISP."},{"type":"mcq","prompt":"Quale enunciato descrive correttamente il Dependency Inversion Principle (DIP)?","code":"","options":["I moduli di alto livello non devono dipendere da quelli di basso livello: entrambi devono dipendere da astrazioni, e le astrazioni non devono dipendere dai dettagli","I moduli di alto livello devono dipendere direttamente dalle implementazioni concrete di basso livello","Le astrazioni devono dipendere dai dettagli concreti per essere efficienti","Ogni classe deve sempre avere un\u0027interfaccia dedicata, in ogni caso"],"correct":0,"explanation":"In sintesi: il DIP inverte la direzione della dipendenza: la logica di alto livello e i dettagli di basso livello dipendono entrambi da un\u0027astrazione (interfaccia) definita in base ai bisogni dell\u0027alto livello, così le implementazioni diventano intercambiabili e testabili.\nLe altre opzioni: la seconda descrive l\u0027accoppiamento tradizionale che il DIP vuole evitare; la terza rovescia la regola \"i dettagli dipendono dalle astrazioni\"; \"un\u0027interfaccia sempre\" è una regola meccanica, non ciò che afferma il DIP."},{"type":"code","prompt":"Qual è il problema principale di questo Singleton in un contesto multi-thread?","code":"public class Config {\n    private static Config instance;\n    private Config() {}\n    public static Config getInstance() {\n        if (instance == null) {\n            instance = new Config();\n        }\n        return instance;\n    }\n}","options":["Non è thread-safe: due thread possono superare insieme il check `instance == null` e creare due istanze distinte","Il costruttore privato impedisce del tutto l\u0027istanziazione, quindi non compila","`instance` deve essere `final`, altrimenti il codice non compila","Nessun problema: `static` garantisce di per sé la thread-safety"],"correct":0,"explanation":"In sintesi: è lazy initialization senza sincronizzazione, quindi una race condition: due thread possono valutare `instance == null` come vero contemporaneamente e costruire due oggetti diversi, rompendo l\u0027unicità. Si risolve con metodo `synchronized`, double-checked locking con `volatile`, holder class idiom o `enum`.\nLe altre opzioni: il costruttore privato è proprio il modo con cui il Singleton controlla la creazione; `final` non è richiesto e non c\u0027è errore di compilazione; `static` riguarda lo storage, non la mutua esclusione tra thread."},{"type":"mcq","prompt":"Qual è la differenza chiave tra Factory Method e Abstract Factory?","code":"","options":["Factory Method crea un singolo prodotto tramite un metodo sovrascrivibile dalle sottoclassi; Abstract Factory crea famiglie di prodotti correlati tramite un oggetto factory con più metodi di creazione","Sono sinonimi: cambia solo il nome nel catalogo dei pattern","Abstract Factory crea un solo oggetto, mentre Factory Method crea sempre famiglie di oggetti","Factory Method usa la composizione, Abstract Factory usa esclusivamente ereditarietà statica"],"correct":0,"explanation":"In sintesi: il Factory Method definisce un metodo (spesso astratto) che le sottoclassi sovrascrivono per decidere quale singolo prodotto istanziare; l\u0027Abstract Factory è un oggetto che espone più metodi factory per creare intere famiglie di prodotti coerenti tra loro (es. widget di uno stesso tema).\nLe altre opzioni: non sono sinonimi; la terza inverte i ruoli; la quarta confonde i meccanismi, dato che l\u0027Abstract Factory si basa proprio sulla composizione con l\u0027oggetto factory."},{"type":"mcq","prompt":"Quale problema risolve principalmente il pattern Builder?","code":"","options":["La costruzione di oggetti complessi con molti parametri, spesso opzionali, evitando i costruttori telescopici e migliorando la leggibilità","Garantire l\u0027esistenza di una sola istanza della classe nell\u0027applicazione","Convertire l\u0027interfaccia di una classe in un\u0027altra attesa dal client","Notificare automaticamente più osservatori al cambiare dello stato"],"correct":0,"explanation":"In sintesi: il Builder separa la costruzione di un oggetto dalla sua rappresentazione e permette di assemblarlo passo-passo con un\u0027API fluente, risolvendo il problema dei costruttori telescopici e dei tanti parametri opzionali/obbligatori; spesso produce oggetti immutabili con validazione nel metodo `build()`.\nLe altre opzioni: l\u0027unicità è del `Singleton`, la conversione di interfaccia è dell\u0027`Adapter`, la notifica agli osservatori è dell\u0027`Observer`."},{"type":"code","prompt":"Cosa stampa il codice? (attenzione al tipo di clonazione)","code":"class Address { String city; Address(String c){ this.city = c; } }\nclass Person implements Cloneable {\n    String name;\n    Address address;\n    Person(String n, Address a){ this.name = n; this.address = a; }\n    @Override protected Person clone() throws CloneNotSupportedException {\n        return (Person) super.clone();\n    }\n}\n\nAddress a = new Address(\"Roma\");\nPerson p1 = new Person(\"Anna\", a);\nPerson p2 = p1.clone();\np2.address.city = \"Milano\";\nSystem.out.println(p1.address.city);","options":["Milano","Roma","null","Errore a runtime"],"correct":0,"explanation":"In sintesi: `super.clone()` (che invoca `Object.clone()`) esegue una shallow copy: `p1` e `p2` sono oggetti distinti ma condividono lo stesso riferimento ad `Address`, quindi modificare `p2.address.city` cambia anche quello visto da `p1` e stampa \"Milano\". Nel `Prototype`, per campi mutabili serve una deep copy clonando anche gli oggetti annidati.\nLe altre opzioni: \"Roma\" varrebbe solo con una deep copy; non c\u0027è `null` perché l\u0027address è inizializzato; nessuna eccezione perché `Person` implementa `Cloneable`."},{"type":"mcq","prompt":"A cosa serve il pattern Adapter?","code":"","options":["A far collaborare due interfacce incompatibili, convertendo l\u0027interfaccia di una classe esistente in quella attesa dal client","Ad aggiungere responsabilità a un oggetto dinamicamente, a runtime","A fornire un\u0027interfaccia semplificata a un sottosistema complesso","A controllare e mediare l\u0027accesso a un altro oggetto"],"correct":0,"explanation":"In sintesi: l\u0027Adapter fa da \"traduttore\" tra due interfacce incompatibili, avvolgendo una classe esistente (adaptee) ed esponendo l\u0027interfaccia che il client si aspetta (target), utile per integrare librerie o codice legacy senza modificarli.\nLe altre opzioni: aggiungere responsabilità a runtime è il `Decorator`; semplificare un sottosistema è la `Facade`; controllare l\u0027accesso è il `Proxy`."},{"type":"code","prompt":"Quanto vale il costo stampato da questa catena di Decorator?","code":"interface Coffee { double cost(); }\nclass SimpleCoffee implements Coffee {\n    public double cost() { return 2.0; }\n}\nclass MilkDecorator implements Coffee {\n    private final Coffee c;\n    MilkDecorator(Coffee c) { this.c = c; }\n    public double cost() { return c.cost() + 0.5; }\n}\nclass SugarDecorator implements Coffee {\n    private final Coffee c;\n    SugarDecorator(Coffee c) { this.c = c; }\n    public double cost() { return c.cost() + 0.2; }\n}\n\nCoffee coffee = new SugarDecorator(new MilkDecorator(new SimpleCoffee()));\nSystem.out.println(coffee.cost());","options":["2.7","2.5","2.2","2.0"],"correct":0,"explanation":"In sintesi: i Decorator si compongono \"a cipolla\" delegando al wrappato: `SimpleCoffee` è 2.0, `MilkDecorator` aggiunge 0.5, `SugarDecorator` aggiunge 0.2, quindi 2.0 + 0.5 + 0.2 = 2.7. Ogni decorator implementa la stessa interfaccia e ne estende il comportamento senza toccare la classe base.\nLe altre opzioni: 2.5 e 2.2 considerano un solo decorator, 2.0 ignora entrambi i wrapper."},{"type":"mcq","prompt":"Cosa fornisce il pattern Facade?","code":"","options":["Un\u0027interfaccia unificata e semplificata verso un insieme di interfacce di un sottosistema complesso","La creazione di famiglie di oggetti correlati e intercambiabili","La possibilità di trattare in modo uniforme oggetti singoli e loro composizioni","L\u0027incapsulamento di una richiesta come oggetto per accodarla o annullarla"],"correct":0,"explanation":"In sintesi: la Facade offre un punto d\u0027accesso di alto livello che nasconde la complessità di più classi/sottosistemi, riducendo l\u0027accoppiamento del client con i dettagli interni; non impedisce di usare le API di basso livello, ne semplifica solo l\u0027uso comune.\nLe altre opzioni: le famiglie di oggetti sono l\u0027`Abstract Factory`, il trattamento uniforme di singoli e composizioni è il `Composite`, l\u0027incapsulamento della richiesta è il `Command`."},{"type":"mcq","prompt":"Quale delle seguenti NON è una variante/uso tipico del pattern Proxy?","code":"","options":["Aggiungere dinamicamente nuove responsabilità impilando più wrapper sullo stesso oggetto","Virtual proxy per il lazy loading di un oggetto costoso da creare","Protection proxy per il controllo degli accessi","Remote proxy per rappresentare localmente un oggetto remoto"],"correct":0,"explanation":"In sintesi: aggiungere responsabilità impilando wrapper è l\u0027intento del `Decorator`, non del Proxy; il Proxy mantiene la stessa interfaccia dell\u0027oggetto reale per controllarne l\u0027accesso (virtual, protection, remote, caching) senza cambiarne le funzionalità visibili.\nLe altre opzioni: virtual, protection e remote proxy sono tutte varianti canoniche descritte dal GoF."},{"type":"mcq","prompt":"Quando è indicato il pattern Composite?","code":"","options":["Quando si vogliono trattare in modo uniforme oggetti singoli (foglie) e loro composizioni (nodi) in una struttura ad albero","Quando si vuole garantire una sola istanza globale condivisa","Quando si vuole scambiare a runtime l\u0027algoritmo usato da un oggetto","Quando si vuole convertire un\u0027interfaccia in un\u0027altra incompatibile"],"correct":0,"explanation":"In sintesi: il Composite rappresenta gerarchie parte-tutto con un\u0027interfaccia comune tra foglie e contenitori, così il client tratta un singolo elemento e un\u0027intera composizione allo stesso modo (es. file/cartelle, componenti UI, voci di menu).\nLe altre opzioni: l\u0027unicità è del `Singleton`, lo scambio di algoritmo è lo `Strategy`, la conversione di interfaccia è l\u0027`Adapter`."},{"type":"code","prompt":"Cosa stampa questo codice che usa il pattern Strategy?","code":"interface DiscountStrategy { double apply(double amount); }\nclass NoDiscount implements DiscountStrategy {\n    public double apply(double a) { return a; }\n}\nclass PercentDiscount implements DiscountStrategy {\n    private final double pct;\n    PercentDiscount(double pct) { this.pct = pct; }\n    public double apply(double a) { return a * (1 - pct); }\n}\nclass Cart {\n    private DiscountStrategy strategy = new NoDiscount();\n    void setStrategy(DiscountStrategy s) { this.strategy = s; }\n    double checkout(double amount) { return strategy.apply(amount); }\n}\n\nCart cart = new Cart();\ncart.setStrategy(new PercentDiscount(0.2));\nSystem.out.println(cart.checkout(100));","options":["80.0","100.0","20.0","120.0"],"correct":0,"explanation":"In sintesi: dopo `setStrategy` il `Cart` delega a `PercentDiscount(0.2)`, quindi `apply(100)` calcola 100 * (1 - 0.2) = 80.0. È l\u0027essenza dello Strategy: il comportamento è cambiato a runtime per composizione, senza `if` sul tipo di sconto e senza modificare `Cart`.\nLe altre opzioni: 100.0 sarebbe la strategia `NoDiscount` iniziale, 20.0 è l\u0027importo scontato (non il totale), 120.0 sommerebbe invece di sottrarre."},{"type":"mcq","prompt":"Come funziona il pattern Observer?","code":"","options":["Un Subject mantiene una lista di Observer e li notifica automaticamente quando il suo stato cambia, realizzando una relazione uno-a-molti a basso accoppiamento","Un oggetto delega un algoritmo a una strategia intercambiabile fornita per composizione","Si garantisce che esista una sola istanza condivisa del soggetto","Si incapsula una richiesta come comando eseguibile e annullabile"],"correct":0,"explanation":"In sintesi: nell\u0027Observer un Subject (observable) tiene un elenco di subscriber e, quando cambia stato, invoca il loro metodo di aggiornamento; gli observer dipendono dall\u0027interfaccia di notifica e non l\u0027uno dall\u0027altro, restando debolmente accoppiati e aggiungibili/removibili a runtime.\nLe altre opzioni: la delega dell\u0027algoritmo è lo `Strategy`, l\u0027istanza unica è il `Singleton`, l\u0027incapsulamento della richiesta è il `Command`."},{"type":"mcq","prompt":"Cosa definisce il pattern Template Method?","code":"","options":["Lo scheletro di un algoritmo in un metodo della classe base, delegando alcuni passi variabili all\u0027override delle sottoclassi","Una famiglia di algoritmi intercambiabili incapsulati e scelti per composizione a runtime","Un meccanismo per aggiungere responsabilità a un oggetto a runtime","Il disaccoppiamento tra mittente e ricevente di una richiesta lungo una catena"],"correct":0,"explanation":"In sintesi: il Template Method fissa in un metodo (spesso `final`) la sequenza invariante di un algoritmo e lascia alle sottoclassi il compito di implementare i passi \"hook\" che variano; sfrutta l\u0027ereditarietà e il principio di Hollywood \"non chiamarci, ti chiamiamo noi\".\nLe altre opzioni: gli algoritmi intercambiabili per composizione sono lo `Strategy`, l\u0027aggiunta di responsabilità è il `Decorator`, la catena mittente-ricevente è il `Chain of Responsibility`."},{"type":"mcq","prompt":"Qual è l\u0027intento del pattern Command?","code":"","options":["Incapsulare una richiesta come oggetto, così da parametrizzare, accodare, loggare le operazioni e supportare l\u0027undo","Fornire un\u0027interfaccia semplificata verso un sottosistema complesso","Garantire una sola istanza della classe di comando","Adattare interfacce reciprocamente incompatibili"],"correct":0,"explanation":"In sintesi: il Command trasforma un\u0027azione in un oggetto con un metodo `execute()` (ed eventualmente `undo()`), disaccoppiando chi invoca l\u0027azione (invoker) da chi la esegue (receiver); abilita code di comandi, logging, macro e annullamento.\nLe altre opzioni: la semplificazione del sottosistema è la `Facade`, l\u0027istanza unica è il `Singleton`, l\u0027adattamento di interfacce è l\u0027`Adapter`."},{"type":"mcq","prompt":"Come opera il pattern Chain of Responsibility?","code":"","options":["Una richiesta viene passata lungo una catena di handler finché uno la gestisce, oppure la catena si esaurisce","Ogni richiesta viene sempre gestita in parallelo da tutti gli handler della catena","Si garantisce che esista un solo handler istanziato a livello globale","Si converte l\u0027interfaccia di un handler in quella attesa dal client"],"correct":0,"explanation":"In sintesi: il Chain of Responsibility disaccoppia mittente e ricevente facendo scorrere la richiesta tra handler concatenati; ciascuno decide se gestirla o passarla al successore. È il modello dei filter chain (es. servlet filter) e degli interceptor.\nLe altre opzioni: gli handler non lavorano in parallelo ma in sequenza; l\u0027istanza unica è il `Singleton`; la conversione di interfaccia è l\u0027`Adapter`."},{"type":"truefalse","prompt":"Il pattern Iterator permette di accedere sequenzialmente agli elementi di una collezione senza esporne la rappresentazione interna.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: l\u0027Iterator fornisce un modo uniforme (`hasNext()`/`next()`) per scorrere gli elementi di un aggregato senza rivelare se sotto c\u0027è un array, una lista collegata o un albero; in Java è incarnato da `Iterator` e dall\u0027interfaccia `Iterable` usata dal for-each.\nLe altre opzioni: l\u0027affermazione è vera; l\u0027errore tipico è pensare che l\u0027Iterator obblighi a conoscere la struttura interna, mentre proprio la incapsula."},{"type":"mcq","prompt":"Quando è preferibile un Builder rispetto a un Factory Method?","code":"","options":["Quando l\u0027oggetto richiede molti passi di costruzione o molti parametri opzionali e si vuole un\u0027API fluente e leggibile, spesso per creare istanze immutabili","Quando serve solo scegliere quale sottotipo istanziare in base a un parametro di input","Quando si deve garantire una singola istanza condivisa","Builder e Factory sono equivalenti, la scelta è puramente stilistica"],"correct":0,"explanation":"In sintesi: il Builder brilla quando la costruzione è complessa e configurabile (molti campi opzionali, validazione finale, immutabilità), offrendo leggibilità con la fluent API; il Factory Method invece si concentra sul decidere quale tipo/sottotipo creare, tipicamente in un solo passo.\nLe altre opzioni: la seconda descrive esattamente il caso d\u0027uso del Factory; l\u0027istanza unica è il `Singleton`; non sono equivalenti perché risolvono problemi di costruzione diversi."},{"type":"mcq","prompt":"Qual è la differenza chiave tra Strategy e Template Method?","code":"","options":["Strategy fa variare il comportamento per composizione, con delega a un oggetto scambiabile a runtime; Template Method lo fa variare per ereditarietà, con l\u0027override dei passi nelle sottoclassi","Strategy usa l\u0027ereditarietà, Template Method usa la composizione","Sono identici: cambia solo il nome del pattern","Solo Template Method può cambiare algoritmo a runtime, Strategy no"],"correct":0,"explanation":"In sintesi: entrambi variano un algoritmo, ma con meccanismi diversi: lo Strategy incapsula l\u0027algoritmo in un oggetto iniettato e sostituibile a runtime (composition over inheritance), mentre il Template Method fissa lo scheletro nella superclasse e delega i passi alle sottoclassi tramite override (ereditarietà, scelta a compile-time).\nLe altre opzioni: la seconda inverte i meccanismi; non sono identici; è lo `Strategy`, non il Template Method, a permettere il cambio a runtime."},{"type":"mcq","prompt":"In che rapporto stanno Dependency Injection (DI) e Dependency Inversion Principle (DIP)?","code":"","options":["La DI è una tecnica per realizzare il DIP: le dipendenze (astrazioni) sono fornite dall\u0027esterno, invertendo il controllo sulla loro creazione","Sono esattamente la stessa cosa con due nomi diversi","La DI viola il DIP perché accoppia le classi alle implementazioni concrete","Il DIP è un framework, mentre la DI è un principio teorico"],"correct":0,"explanation":"In sintesi: il DIP è il principio (dipendere da astrazioni), la DI è una delle tecniche che lo attuano: invece di creare con `new` le proprie dipendenze concrete, una classe le riceve dall\u0027esterno (costruttore/setter), tipicamente tramite un container IoC come Spring, riferendosi a interfacce.\nLe altre opzioni: non sono la stessa cosa (uno è principio, l\u0027altra tecnica); la DI ben fatta riduce l\u0027accoppiamento anziché aumentarlo; l\u0027inversione di ruoli tra framework e principio è errata."},{"type":"truefalse","prompt":"Favorire la composizione rispetto all\u0027ereditarietà aiuta a evitare gerarchie rigide e il fragile base class problem, aumentando la flessibilità del comportamento a runtime.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: la composizione delega a collaboratori intercambiabili (come in `Strategy` o `Decorator`) permettendo di combinare e sostituire comportamenti a runtime, mentre l\u0027ereditarietà lega la sottoclasse ai dettagli della superclasse e può rompersi quando la base cambia (fragile base class).\nLe altre opzioni: l\u0027affermazione è vera; l\u0027errore tipico è credere che l\u0027ereditarietà sia sempre la via di riuso preferibile, quando spesso introduce accoppiamento rigido."},{"type":"mcq","prompt":"Perché il \u0027God Object\u0027 è considerato un anti-pattern?","code":"","options":["Concentra troppe responsabilità e troppo stato in un\u0027unica classe, violando l\u0027SRP e rendendo il codice difficile da capire, testare e mantenere","Usa troppe interfacce minuscole, violando l\u0027ISP","Clona gli oggetti invece di crearli da zero, sprecando memoria","Espone un\u0027interfaccia troppo semplice verso un sottosistema"],"correct":0,"explanation":"In sintesi: il God Object (o God Class) accentra logica, dati e responsabilità che dovrebbero stare in più classi coese; viola l\u0027SRP, crea alto accoppiamento, diventa un collo di bottiglia per le modifiche e ostacola i test. Si bonifica scomponendolo per responsabilità.\nLe altre opzioni: le interfacce troppo piccole non sono il difetto qui; la clonazione riguarda il `Prototype`; l\u0027interfaccia semplice verso un sottosistema è una `Facade`, che è un pattern utile, non l\u0027anti-pattern descritto."},{"type":"truefalse","prompt":"Usare il Singleton in modo pervasivo è spesso considerato un anti-pattern perché introduce stato globale, nasconde le dipendenze e ostacola i test (ad esempio il mocking).","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: il Singleton usato ovunque diventa una variabile globale mascherata, crea dipendenze implicite non visibili nella firma dei metodi, complica i test perché è difficile sostituirlo con un mock e introduce accoppiamento nascosto. Spesso è meglio un normale bean a scope singleton gestito dal container e iniettato via DI.\nLe altre opzioni: l\u0027affermazione è vera; l\u0027errore tipico è considerare il Singleton sempre innocuo, ignorando l\u0027impatto su testabilità e stato globale."},{"type":"mcq","prompt":"Come implementa Spring, di default, l\u0027AOP (ad esempio `@Transactional`) sui bean?","code":"","options":["Tramite Proxy (JDK dynamic proxy se il bean implementa un\u0027interfaccia, altrimenti CGLIB) che intercetta le chiamate ai metodi e applica gli advice","Riscrivendo obbligatoriamente il bytecode di ogni classe a compile-time","Applicando il pattern Observer a ogni metodo del bean","Copiando manualmente il codice transazionale dentro ciascun metodo"],"correct":0,"explanation":"In sintesi: Spring AOP è proxy-based: crea un proxy del bean e intercetta le invocazioni per eseguire gli advice, come apertura/commit di transazione in `@Transactional`. Nello Spring Framework classico il default è JDK dynamic proxy quando il bean implementa un\u0027interfaccia e CGLIB altrimenti (Spring Boot invece forza CGLIB per default anche con interfacce). Da qui deriva an
