":"Nessun problema: synchronized previene automaticamente il deadlock","en":"No problem: synchronized automatically prevents deadlock"}],"correct":0,"explanation":{"it":"In sintesi: è un classico deadlock da lock ordering: se Thread 1 tiene `lockA` e attende `lockB` mentre Thread 2 tiene `lockB` e attende `lockA`, nessuno dei due procede; la prevenzione standard è acquisire i lock sempre nello stesso ordine globale.\nLe altre opzioni: nel livelock i thread restano attivi ma reagendo l\u0027uno all\u0027altro (qui invece sono bloccati); non è una race benigna e `synchronized` non previene affatto il deadlock, anzi qui lo causa.","en":"In summary: this is a classic lock-ordering deadlock: if Thread 1 holds `lockA` and waits for `lockB` while Thread 2 holds `lockB` and waits for `lockA`, neither can proceed; the standard prevention is to always acquire the locks in the same global order.\nThe other options: in a livelock the threads stay active but keep reacting to each other (here they are blocked); it is not a benign race, and `synchronized` does not prevent deadlock at all — here it actually causes it."}},{"type":"mcq","prompt":{"it":"Perché wait() va invocato dentro un blocco synchronized e tipicamente in un ciclo while sulla condizione?","en":"Why must wait() be invoked inside a synchronized block and typically within a while loop on the condition?"},"code":"","options":[{"it":"Perché richiede di possedere il monitor dell\u0027oggetto e il while protegge da spurious wakeup e ricontrolla la condizione dopo il risveglio","en":"Because it requires holding the object\u0027s monitor, and the while loop guards against spurious wakeups and re-checks the condition after waking up"},{"it":"Solo per motivi di performance del context switch","en":"Only for context-switch performance reasons"},{"it":"Perché wait() cede la CPU ma non rilascia il lock","en":"Because wait() yields the CPU but does not release the lock"},{"it":"Perché notify() sveglia sempre tutti i thread in attesa","en":"Because notify() always wakes up all waiting threads"}],"correct":0,"explanation":{"it":"In sintesi: `wait()` deve essere chiamato mentre si detiene il monitor dell\u0027oggetto (altrimenti `IllegalMonitorStateException`), e va racchiuso in un `while` perché al risveglio la condizione va rivalutata: possono verificarsi spurious wakeup o un altro thread può aver già cambiato lo stato.\nLe altre opzioni: non è una questione di performance; `wait()` in realtà rilascia il lock durante l\u0027attesa; `notify()` sveglia un solo thread, è `notifyAll()` a svegliarli tutti.","en":"In summary: `wait()` must be called while holding the object\u0027s monitor (otherwise `IllegalMonitorStateException`), and it must be wrapped in a `while` because the condition has to be re-evaluated on wakeup: spurious wakeups can occur, or another thread may have already changed the state.\nThe other options: it is not a performance matter; `wait()` actually releases the lock while waiting; `notify()` wakes a single thread — it is `notifyAll()` that wakes them all."}},{"type":"mcq","prompt":{"it":"Qual è la differenza tra shutdown() e shutdownNow() su un ExecutorService?","en":"What is the difference between shutdown() and shutdownNow() on an ExecutorService?"},"code":"","options":[{"it":"shutdown() rifiuta nuovi task ma completa quelli già inviati; shutdownNow() tenta di interrompere i task in esecuzione e restituisce quelli pendenti non avviati","en":"shutdown() rejects new tasks but completes already submitted ones; shutdownNow() attempts to interrupt running tasks and returns the pending tasks that were never started"},{"it":"Sono sinonimi con lo stesso comportamento","en":"They are synonyms with the same behavior"},{"it":"shutdown() interrompe immediatamente tutti i thread in esecuzione","en":"shutdown() immediately interrupts all running threads"},{"it":"shutdownNow() attende sempre la fine di tutti i task prima di tornare","en":"shutdownNow() always waits for all tasks to finish before returning"}],"correct":0,"explanation":{"it":"In sintesi: `shutdown()` avvia una chiusura ordinata (niente nuovi task, ma quelli in coda vengono eseguiti), mentre `shutdownNow()` prova a interrompere i task attivi via `interrupt()` e ritorna la lista dei task pendenti mai avviati.\nLe altre opzioni: non sono sinonimi, `shutdown()` non interrompe l\u0027esecuzione in corso e `shutdownNow()` non attende il completamento (per attendere serve `awaitTermination`).","en":"In summary: `shutdown()` initiates an orderly shutdown (no new tasks, but queued ones are executed), whereas `shutdownNow()` tries to interrupt active tasks via `interrupt()` and returns the list of pending tasks that were never started.\nThe other options: they are not synonyms, `shutdown()` does not interrupt work already in progress, and `shutdownNow()` does not wait for completion (to wait you need `awaitTermination`)."}},{"type":"mcq","prompt":{"it":"Con Executors.newFixedThreadPool(4), cosa succede se vengono inviati più task dei thread disponibili?","en":"With Executors.newFixedThreadPool(4), what happens if more tasks are submitted than there are available threads?"},"code":"","options":[{"it":"I task in eccesso vengono accodati in una LinkedBlockingQueue non limitata in attesa di un thread libero","en":"The excess tasks are queued in an unbounded LinkedBlockingQueue, waiting for a free thread"},{"it":"Vengono creati nuovi thread senza limite finché servono","en":"New threads are created without limit as needed"},{"it":"I task vengono subito rifiutati con RejectedExecutionException","en":"The tasks are immediately rejected with RejectedExecutionException"},{"it":"I task in eccesso vengono eseguiti nel thread chiamante","en":"The excess tasks are executed on the calling thread"}],"correct":0,"explanation":{"it":"In sintesi: un fixed thread pool ha un numero fisso di worker e una coda `LinkedBlockingQueue` di fatto illimitata, quindi i task in più restano accodati finché un thread si libera; il rischio è l\u0027accumulo in memoria della coda sotto carico.\nLe altre opzioni: il numero di thread è fisso (non cresce), il rifiuto avviene solo con code/pool limitati e la CallerRunsPolicy va configurata esplicitamente, non è il default qui.","en":"In summary: a fixed thread pool has a fixed number of workers and an effectively unbounded `LinkedBlockingQueue`, so the extra tasks stay queued until a thread becomes free; the risk is the queue accumulating in memory under load.\nThe other options: the number of threads is fixed (it does not grow), rejection only happens with bounded queues/pools, and the CallerRunsPolicy must be configured explicitly — it is not the default here."}},{"type":"code","prompt":{"it":"Cosa stampa questo codice?","en":"What does this code print?"},"code":"ExecutorService ex = Executors.newSingleThreadExecutor();\nFuture\u003cInteger\u003e f = ex.submit(() -\u003e 21 * 2);\nSystem.out.println(f.get());","options":[{"it":"42","en":"42"},{"it":"Non compila: submit non accetta una Callable","en":"Does not compile: submit does not accept a Callable"},{"it":"Stampa un oggetto Future non ancora risolto","en":"Prints an unresolved Future object"},{"it":"Lancia ExecutionException","en":"Throws ExecutionException"}],"correct":0,"explanation":{"it":"In sintesi: la lambda `() -\u003e 21 * 2` è una `Callable\u003cInteger\u003e`; `submit` restituisce un `Future` e `f.get()` blocca finché il risultato non è pronto, restituendo `42`.\nLe altre opzioni: `submit` accetta `Callable`, `get()` restituisce il valore (non l\u0027oggetto `Future`) e non c\u0027è alcuna eccezione perché il task termina normalmente.","en":"In summary: the lambda `() -\u003e 21 * 2` is a `Callable\u003cInteger\u003e`; `submit` returns a `Future` and `f.get()` blocks until the result is ready, returning `42`.\nThe other options: `submit` accepts `Callable`, `get()` returns the value (not the `Future` object), and there is no exception because the task completes normally."}},{"type":"code","prompt":{"it":"1000 thread eseguono ciascuno a.incrementAndGet(). Quale valore ha a alla fine?","en":"1000 threads each run a.incrementAndGet(). What value does a have at the end?"},"code":"AtomicInteger a = new AtomicInteger(0);\n// ogni thread:\na.incrementAndGet();","options":[{"it":"Sempre 1000: incrementAndGet è atomico grazie al CAS","en":"Always 1000: incrementAndGet is atomic thanks to CAS"},{"it":"Spesso meno di 1000 per race condition","en":"Often less than 1000 due to a race condition"},{"it":"Sempre 0","en":"Always 0"},{"it":"Indefinito, perché manca volatile sul campo","en":"Undefined, because the field lacks volatile"}],"correct":0,"explanation":{"it":"In sintesi: `incrementAndGet()` è un\u0027operazione atomica implementata con Compare-And-Swap (CAS) lock-free, quindi 1000 incrementi concorrenti danno sempre esattamente 1000, senza aggiornamenti persi.\nLe altre opzioni: il valore non scende sotto 1000 proprio perché il CAS elimina la race, non resta 0 e `AtomicInteger` gestisce internamente la visibilità (nessun `volatile` mancante).","en":"In summary: `incrementAndGet()` is an atomic, lock-free operation implemented with Compare-And-Swap (CAS), so 1000 concurrent increments always yield exactly 1000, with no lost updates.\nThe other options: the value never drops below 1000 precisely because CAS eliminates the race, it does not stay at 0, and `AtomicInteger` handles visibility internally (no missing `volatile`)."}},{"type":"mcq","prompt":{"it":"Quale affermazione descrive correttamente ConcurrentHashMap?","en":"Which statement correctly describes ConcurrentHashMap?"},"code":"","options":[{"it":"Permette letture concorrenti e aggiornamenti a granularità fine senza bloccare l\u0027intera mappa, e non ammette chiavi o valori null","en":"It allows concurrent reads and fine-grained updates without locking the entire map, and it does not permit null keys or values"},{"it":"Sincronizza ogni operazione su un unico lock globale come Hashtable","en":"It synchronizes every operation on a single global lock, like Hashtable"},{"it":"Ammette chiavi null esattamente come HashMap","en":"It permits null keys exactly like HashMap"},{"it":"Le sue iterazioni lanciano ConcurrentModificationException se la mappa cambia durante l\u0027iterazione","en":"Its iterations throw ConcurrentModificationException if the map changes during iteration"}],"correct":0,"explanation":{"it":"In sintesi: `ConcurrentHashMap` consente letture non bloccanti e scritture concorrenti a granularità fine (per bin/nodo), offrendo alto throughput multi-thread, e vieta chiavi e valori `null` per evitare ambiguità con `get`.\nLe altre opzioni: non usa un lock globale unico come `Hashtable`, non accetta chiavi `null` e i suoi iteratori sono weakly consistent, quindi non lanciano `ConcurrentModificationException`.","en":"In summary: `ConcurrentHashMap` allows non-blocking reads and fine-grained concurrent writes (per bin/node), delivering high multi-threaded throughput, and it forbids `null` keys and values to avoid ambiguity with `get`.\nThe other options: it does not use a single global lock like `Hashtable`, it does not accept `null` keys, and its iterators are weakly consistent, so they do not throw `ConcurrentModificationException`."}},{"type":"mcq","prompt":{"it":"A cosa serve tipicamente CountDownLatch?","en":"What is CountDownLatch typically used for?"},"code":"","options":[{"it":"Far attendere uno o più thread finché un insieme di operazioni non è completato; il contatore non è riutilizzabile","en":"To make one or more threads wait until a set of operations is complete; the counter is not reusable"},{"it":"È riutilizzabile e resetta automaticamente il contatore a ogni ciclo","en":"It is reusable and automatically resets the counter on each cycle"},{"it":"Limitare il numero di thread che accedono contemporaneamente a una risorsa","en":"To limit the number of threads accessing a resource simultaneously"},{"it":"Sostituire synchronized fornendo mutua esclusione","en":"To replace synchronized by providing mutual exclusion"}],"correct":0,"explanation":{"it":"In sintesi: `CountDownLatch` fa attendere i thread su `await()` finché il contatore, decrementato con `countDown()`, non raggiunge zero; è un dispositivo monouso (una volta a zero non si resetta).\nLe altre opzioni: la riusabilità con reset descrive `CyclicBarrier`, il limite di accessi concorrenti descrive `Semaphore` e non fornisce mutua esclusione come `synchronized`.","en":"In summary: `CountDownLatch` makes threads wait on `await()` until the counter, decremented with `countDown()`, reaches zero; it is a one-shot device (once at zero it does not reset).\nThe other options: reusability with reset describes `CyclicBarrier`, limiting concurrent access describes `Semaphore`, and it does not provide mutual exclusion like `synchronized`."}},{"type":"mcq","prompt":{"it":"Qual è lo scopo principale di un Semaphore?","en":"What is the main purpose of a Semaphore?"},"code":"","options":[{"it":"Limitare il numero di thread che accedono contemporaneamente a una risorsa tramite un insieme di permessi","en":"To limit the number of threads accessing a resource simultaneously through a set of permits"},{"it":"Far attendere un thread su un singolo evento una sola volta","en":"To make a thread wait on a single event exactly once"},{"it":"Fornire mutua esclusione utilizzabile da un solo thread e mai da più di uno","en":"To provide mutual exclusion usable by only one thread and never more than one"},{"it":"Garantire sempre un ordine di sblocco FIFO tra i thread","en":"To always guarantee FIFO unlock ordering among threads"}],"correct":0,"explanation":{"it":"In sintesi: un `Semaphore` gestisce un numero di permessi con `acquire()`/`release()`, limitando quanti thread possono accedere insieme a una risorsa (es. un pool di N connessioni); con 1 permesso funge da mutex.\nLe altre opzioni: l\u0027attesa monouso di un evento è di `CountDownLatch`, il semaforo può ammettere più thread contemporaneamente e l\u0027ordine equo (fairness) non è garantito di default.","en":"In summary: a `Semaphore` manages a number of permits with `acquire()`/`release()`, limiting how many threads can access a resource together (e.g., a pool of N connections); with 1 permit it acts as a mutex.\nThe other options: one-shot waiting on an event belongs to `CountDownLatch`, a semaphore can admit multiple threads at once, and fair ordering (fairness) is not guaranteed by default."}},{"type":"mcq","prompt":{"it":"Quale vantaggio offre ReentrantLock rispetto a synchronized?","en":"What advantage does ReentrantLock offer over synchronized?"},"code":"","options":[{"it":"tryLock, acquisizione interrompibile, fairness opzionale e più Condition, al costo di un unlock() esplicito da mettere in finally","en":"tryLock, interruptible acquisition, optional fairness and multiple Conditions, at the cost of an explicit unlock() that must go in a finally block"},{"it":"È sempre più veloce di synchronized in ogni scenario","en":"It is always faster than synchronized in every scenario"},{"it":"Non è rientrante, a differenza di synchronized","en":"It is not reentrant, unlike synchronized"},{"it":"Rilascia il lock automaticamente all\u0027uscita del metodo","en":"It releases the lock automatically when the method exits"}],"correct":0,"explanation":{"it":"In sintesi: `ReentrantLock` aggiunge flessibilità che `synchronized` non ha: `tryLock` (anche con timeout), `lockInterruptibly`, fairness configurabile e più `Condition`; in cambio richiede di chiamare `unlock()` in un blocco `finally`.\nLe altre opzioni: non è categoricamente più veloce, è rientrante come il lock intrinseco e non rilascia il lock da solo a fine metodo (a differenza di `synchronized`).","en":"In summary: `ReentrantLock` adds flexibility that `synchronized` lacks: `tryLock` (with timeout too), `lockInterruptibly`, configurable fairness, and multiple `Condition`s; in exchange it requires calling `unlock()` in a `finally` block.\nThe other options: it is not categorically faster, it is reentrant just like the intrinsic lock, and it does not release the lock on its own at method exit (unlike `synchronized`)."}},{"type":"mcq","prompt":{"it":"Cosa fornisce ThreadLocal e quale accortezza richiede nei thread pool?","en":"What does ThreadLocal provide, and what precaution does it require in thread pools?"},"code":"","options":[{"it":"Una copia della variabile indipendente per ciascun thread; nei pool va ripulita con remove() per evitare leak e valori residui","en":"An independent copy of the variable for each thread; in pools it must be cleared with remove() to avoid leaks and stale values"},{"it":"Una singola variabile condivisa tra tutti i thread in modo sincronizzato","en":"A single variable shared across all threads in a synchronized way"},{"it":"Rende automaticamente volatile la variabile","en":"It automatically makes the variable volatile"},{"it":"Serve esclusivamente per costanti immutabili","en":"It is meant exclusively for immutable constants"}],"correct":0,"explanation":{"it":"In sintesi: `ThreadLocal` dà a ogni thread la propria copia isolata del valore, evitando condivisione e sincronizzazione; nei thread pool i worker vengono riutilizzati, quindi va chiamato `remove()` per evitare memory leak e leakage del valore tra task diversi.\nLe altre opzioni: non condivide un unico valore tra i thread, non ha relazione con `volatile` e non è limitato alle costanti immutabili.","en":"In summary: `ThreadLocal` gives each thread its own isolated copy of the value, avoiding sharing and synchronization; in thread pools workers are reused, so `remove()` must be called to avoid memory leaks and value leakage between different tasks.\nThe other options: it does not share a single value across threads, it has no relation to `volatile`, and it is not limited to immutable constants."}},{"type":"mcq","prompt":{"it":"Perché un oggetto immutabile è intrinsecamente thread-safe?","en":"Why is an immutable object inherently thread-safe?"},"code":"","options":[{"it":"Perché il suo stato non cambia dopo la costruzione, quindi la lettura concorrente non richiede lock né sincronizzazione","en":"Because its state does not change after construction, so concurrent reads require no lock or synchronization"},{"it":"Perché la JVM lo sincronizza automaticamente a ogni accesso","en":"Because the JVM automatically synchronizes it on every access"},{"it":"Perché internamente rende volatile ogni campo","en":"Because it internally makes every field volatile"},{"it":"Perché ogni thread ne riceve una copia separata","en":"Because each thread receives a separate copy"}],"correct":0,"explanation":{"it":"In sintesi: se lo stato è fissato alla costruzione e non muta, non esistono scritture concorrenti da coordinare; tutti i thread osservano lo stesso stato coerente senza bisogno di lock (a patto di pubblicazione sicura, es. campi `final`).\nLe altre opzioni: la JVM non sincronizza automaticamente gli oggetti, l\u0027immutabilità non implica `volatile` sui campi e non viene creata una copia per thread.","en":"In summary: if the state is fixed at construction and never mutates, there are no concurrent writes to coordinate; all threads observe the same consistent state without needing a lock (provided safe publication, e.g., `final` fields).\nThe other options: the JVM does not synchronize objects automatically, immutability does not imply `volatile` on the fields, and no per-thread copy is created."}},{"type":"mcq","prompt":{"it":"Quale delle seguenti stabilisce una relazione happens-before nel Java Memory Model?","en":"Which of the following establishes a happens-before relationship in the Java Memory Model?"},"code":"","options":[{"it":"Il rilascio di un lock happens-before la successiva acquisizione dello stesso lock","en":"The release of a lock happens-before the subsequent acquisition of the same lock"},{"it":"Due letture di variabili diverse effettuate da thread diversi","en":"Two reads of different variables performed by different threads"},{"it":"L\u0027ordine di dichiarazione dei metodi nel file sorgente","en":"The declaration order of methods in the source file"},{"it":"L\u0027invocazione di run() al posto di start()","en":"Invoking run() instead of start()"}],"correct":0,"explanation":{"it":"In sintesi: tra le regole del Java Memory Model, l\u0027`unlock` di un monitor happens-before il successivo `lock` dello stesso monitor, garantendo la visibilità delle scritture fatte nella sezione critica; altre regole sono la scrittura/lettura `volatile` e `start()`/`join()`.\nLe altre opzioni: letture indipendenti in thread diversi non sono ordinate, l\u0027ordine sintattico dei metodi è irrilevante e `run()` esegue nello stesso thread, senza creare relazioni tra thread.","en":"In summary: among the Java Memory Model rules, the `unlock` of a monitor happens-before the subsequent `lock` of the same monitor, guaranteeing visibility of the writes made in the critical section; other rules are the `volatile` write/read and `start()`/`join()`.\nThe other options: independent reads in different threads are not ordered, the syntactic order of methods is irrelevant, and `run()` executes on the same thread, creating no cross-thread relationship."}},{"type":"truefalse","prompt":{"it":"Chiamare start() due volte sullo stesso oggetto Thread lancia IllegalThreadStateException.","en":"Calling start() twice on the same Thread object throws IllegalThreadStateException."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: un `Thread` non è riavviabile: dopo il primo `start()` una seconda invocazione lancia `IllegalThreadStateException`; per rieseguire il task occorre creare un nuovo `Thread` o usare un `ExecutorService`.\nLe altre opzioni: è Vero; l\u0027errore tipico è credere che si possa \"riusare\" lo stesso oggetto Thread, oppure confondere `start()` con `run()` (che invece si può chiamare più volte, ma nel thread corrente).","en":"In summary: a `Thread` is not restartable: after the first `start()`, a second invocation throws `IllegalThreadStateException`; to re-run the task you must create a new `Thread` or use an `ExecutorService`.\nThe other options: it is True; the typical mistake is believing you can \"reuse\" the same Thread object, or confusing `start()` with `run()` (which can indeed be called multiple times, but on the current thread)."}},{"type":"truefalse","prompt":{"it":"La keyword volatile garantisce l\u0027atomicità dell\u0027operazione i++.","en":"The volatile keyword guarantees the atomicity of the operation i++."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027affermazione è falsa: `volatile` assicura visibilità e ordinamento, ma `i++` è una read-modify-write composta da più passi, quindi resta soggetta a race condition; per l\u0027atomicità servono `AtomicInteger` o la sincronizzazione.\nLe altre opzioni: l\u0027errore classico è pensare che `volatile` renda \"sicuri\" i contatori; in realtà elimina i problemi di visibilità ma non quelli di atomicità.","en":"In summary: the statement is false: `volatile` ensures visibility and ordering, but `i++` is a read-modify-write made of several steps, so it remains subject to race conditions; for atomicity you need `AtomicInteger` or synchronization.\nThe other options: the classic mistake is thinking `volatile` makes counters \"safe\"; in reality it eliminates visibility problems but not atomicity ones."}},{"type":"truefalse","prompt":{"it":"notifyAll() sveglia tutti i thread in attesa sul monitor, ma solo uno alla volta potrà riacquisire il lock per proseguire.","en":"notifyAll() wakes up all threads waiting on the monitor, but only one at a time will be able to reacquire the lock and proceed."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: `notifyAll()` sposta tutti i waiter dallo stato di attesa a quello di contesa per il monitor, ma il lock è uno solo, quindi lo riacquisiscono in sequenza, uno per volta.\nLe altre opzioni: è Vero; l\u0027errore tipico è immaginare che i thread risvegliati procedano davvero in parallelo, ignorando che devono comunque riottenere il lock intrinseco.","en":"In summary: it is true: `notifyAll()` moves all waiters from the waiting state to contending for the monitor, but there is only one lock, so they reacquire it in sequence, one at a time.\nThe other options: it is True; the typical mistake is imagining that the awakened threads actually proceed in parallel, ignoring that they must still reacquire the intrinsic lock."}},{"type":"truefalse","prompt":{"it":"wait() rilascia il lock dell\u0027oggetto durante l\u0027attesa, mentre Thread.sleep() mantiene i lock posseduti.","en":"wait() releases the object\u0027s lock during the wait, whereas Thread.sleep() keeps any locks it holds."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: `wait()` rilascia il monitor su cui è invocato per permettere ad altri thread di modificare la condizione e notificare; `sleep()` invece non rilascia alcun lock, si limita a sospendere il thread.\nLe altre opzioni: è Vero; l\u0027errore comune è pensare che anche `sleep()` liberi il lock, causando in pratica blocchi e ritardi se usato dentro una sezione critica.","en":"In summary: it is true: `wait()` releases the monitor it is invoked on to let other threads change the condition and notify; `sleep()`, on the other hand, does not release any lock — it merely suspends the thread.\nThe other options: it is True; the common mistake is thinking `sleep()` also frees the lock, which in practice causes blocking and delays when used inside a critical section."}},{"type":"truefalse","prompt":{"it":"Un ExecutorService creato con la factory Executors, se non viene chiuso, può impedire alla JVM di terminare perché usa thread non-daemon.","en":"An ExecutorService created with the Executors factory, if not shut down, can prevent the JVM from terminating because it uses non-daemon threads."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: è vero: i pool creati da `Executors` usano di default una `ThreadFactory` con thread non-daemon, quindi senza `shutdown()`/`shutdownNow()` questi thread restano vivi e mantengono la JVM in esecuzione.\nLe altre opzioni: è Vero; l\u0027errore tipico è dimenticare la chiusura del pool, lasciando l\u0027applicazione \"appesa\" al termine del main.","en":"In summary: it is true: pools created by `Executors` use by default a `ThreadFactory` with non-daemon threads, so without `shutdown()`/`shutdownNow()` these threads stay alive and keep the JVM running.\nThe other options: it is True; the typical mistake is forgetting to shut down the pool, leaving the application \"hanging\" after main ends."}},{"type":"truefalse","prompt":{"it":"HashMap è thread-safe per operazioni concorrenti di put da più thread.","en":"HashMap is thread-safe for concurrent put operations from multiple threads."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027affermazione è falsa: `HashMap` non è thread-safe; put concorrenti possono corrompere la struttura interna (in passato causando cicli infiniti durante il resize) o perdere aggiornamenti; per l\u0027uso concorrente si usa `ConcurrentHashMap`.\nLe altre opzioni: l\u0027errore tipico è confondere `HashMap` con `ConcurrentHashMap` o con una `Collections.synchronizedMap`, oppure assumere che letture/scritture siano protette dalla JVM.","en":"In summary: the statement is false: `HashMap` is not thread-safe; concurrent puts can corrupt the internal structure (in the past causing infinite loops during resize) or lose updates; for concurrent use you use `ConcurrentHashMap`.\nThe other options: the typical mistake is confusing `HashMap` with `ConcurrentHashMap` or with a `Collections.synchronizedMap`, or assuming that reads/writes are protected by the JVM."}},{"type":"code","prompt":{"it":"Qual è il difetto di concorrenza in questa classe?","en":"What is the concurrency flaw in this class?"},"code":"class Worker {\n    private boolean running = true; // senza volatile\n    void loop() {\n        while (running) { /* lavoro */ }\n    }\n    void stop() { running = false; }\n}","options":[{"it":"Senza volatile, il thread che esegue loop() potrebbe non vedere mai running=false e ciclare all\u0027infinito","en":"Without volatile, the thread running loop() might never see running=false and loop forever"},{"it":"Il codice non compila","en":"The code does not compile"},{"it":"stop() lancia un\u0027eccezione a runtime","en":"stop() throws an exception at runtime"},{"it":"Il ciclo termina sempre correttamente grazie alla cache coerente","en":"The loop always terminates correctly thanks to cache coherence"}],"correct":0,"explanation":{"it":"In sintesi: senza `volatile` il JMM non garantisce la visibilità della scrittura `running = false` fatta da un altro thread; il thread del `loop()` può leggere un valore cachato e non uscire mai; dichiarare `running` `volatile` risolve stabilendo l\u0027happens-before.\nLe altre opzioni: il codice compila, `stop()` non lancia nulla e non c\u0027è alcuna garanzia di terminazione senza `volatile` o sincronizzazione.","en":"In summary: without `volatile`, the JMM does not guarantee visibility of the write `running = false` made by another thread; the `loop()` thread may read a cached value and never exit; declaring `running` as `volatile` fixes it by establishing the happens-before.\nThe other options: the code compiles, `stop()` throws nothing, and there is no termination guarantee without `volatile` or synchronization."}},{"type":"code","prompt":{"it":"Un thread è dentro a() su un\u0027istanza, un altro dentro b(). Si escludono a vicenda?","en":"One thread is inside a() on an instance, another inside b(). Do they exclude each other?"},"code":"class C {\n    synchronized void a() { /* ... */ }        // lock su this\n    static synchronized void b() { /* ... */ } // lock su C.class\n}","options":[{"it":"No: usano monitor diversi (this vs C.class), quindi possono eseguire in parallelo","en":"No: they use different monitors (this vs C.class), so they can run in parallel"},{"it":"Sì: entrambi acquisiscono lo stesso monitor","en":"Yes: both acquire the same monitor"},{"it":"No, perché b() in realtà non è sincronizzato","en":"No, because b() is not actually synchronized"},{"it":"Sì, perché synchronized agisce su un lock globale","en":"Yes, because synchronized acts on a global lock"}],"correct":0,"explanation":{"it":"In sintesi: `a()` è un metodo di istanza e blocca il monitor di `this`, mentre `b()` è `static synchronized` e blocca il monitor dell\u0027oggetto `Class` (`C.class`): essendo lock distinti, i due thread non si escludono e procedono in parallelo.\nLe altre opzioni: non condividono lo stesso monitor, `b()` è effettivamente sincronizzato (sul `Class`) e `synchronized` non è un lock globale di JVM.","en":"In summary: `a()` is an instance method and locks the monitor of `this`, while `b()` is `static synchronized` and locks the monitor of the `Class` object (`C.class`): being distinct locks, the two threads do not exclude each other and proceed in parallel.\nThe other options: they do not share the same monitor, `b()` is indeed synchronized (on the `Class`), and `synchronized` is not a global JVM lock."}},{"type":"code","prompt":{"it":"Più thread eseguono questa istruzione su a. È corretta dal punto di vista della concorrenza?","en":"Multiple threads run this statement on a. Is it correct from a concurrency standpoint?"},"code":"AtomicInteger a = new AtomicInteger();\n// ogni thread:\na.set(a.get() + 1);","options":[{"it":"No: get() e set() sono due operazioni separate, quindi c\u0027è race condition; serve incrementAndGet() o un ciclo con compareAndSet","en":"No: get() and set() are two separate operations, so there is a race condition; you need incrementAndGet() or a loop with compareAndSet"},{"it":"Sì: usando AtomicInteger l\u0027intera espressione è atomica","en":"Yes: using AtomicInteger makes the whole expression atomic"},{"it":"No, perché il codice non compila","en":"No, because the code does not compile"},{"it":"No, perché set() blocca gli altri thread","en":"No, because set() blocks the other threads"}],"correct":0,"explanation":{"it":"In sintesi: sebbene `AtomicInteger` renda atomici `get()` e `set()` singolarmente, la sequenza get-poi-set è un check-then-act non atomico: due thread possono leggere lo stesso valore e sovrascriversi, perdendo incrementi; la forma corretta è `incrementAndGet()` (o un loop di `compareAndSet`).\nLe altre opzioni: l\u0027atomicità vale sulle singole operazioni, non sulla loro composizione; il codice compila e `set()` non è un\u0027operazione bloccante.","en":"In summary: although `AtomicInteger` makes `get()` and `set()` atomic individually, the get-then-set sequence is a non-atomic check-then-act: two threads can read the same value and overwrite each other, losing increments; the correct form is `incrementAndGet()` (or a `compareAndSet` loop).\nThe other options: atomicity applies to the individual operations, not to their composition; the code compiles and `set()` is not a blocking operation."}},{"type":"code","prompt":{"it":"Cosa stampa questo blocco?","en":"What does this block print?"},"code":"Future\u003cString\u003e f = executor.submit(() -\u003e {\n    throw new IllegalStateException(\"boom\");\n});\ntry {\n    f.get();\n} catch (Exception e) {\n    System.out.println(e.getClass().getSimpleName());\n}","options":[{"it":"ExecutionException","en":"ExecutionException"},{"it":"IllegalStateException","en":"IllegalStateException"},{"it":"InterruptedException","en":"InterruptedException"},{"it":"RuntimeException","en":"RuntimeException"}],"correct":0,"explanation":{"it":"In sintesi: se il task lanciato via `submit` termina con un\u0027eccezione, questa viene catturata e incapsulata; `Future.get()` la rilancia come `ExecutionException`, e la causa originale è recuperabile con `getCause()`.\nLe altre opzioni: `IllegalStateException` è solo la causa incapsulata; `InterruptedException` si ha se il thread in attesa viene interrotto; `RuntimeException` non è il tipo concreto restituito da `get()`.","en":"In summary: if the task submitted via `submit` ends with an exception, it is caught and wrapped; `Future.get()` rethrows it as an `ExecutionException`, and the original cause is retrievable with `getCause()`.\nThe other options: `IllegalStateException` is just the wrapped cause; `InterruptedException` occurs if the waiting thread is interrupted; `RuntimeException` is not the concrete type returned by `get()`."}},{"type":"code","prompt":{"it":"Cosa succede invocando outer() da un singolo thread?","en":"What happens when outer() is invoked from a single thread?"},"code":"class R {\n    synchronized void outer() { inner(); }\n    synchronized void inner() { System.out.println(\"ok\"); }\n}","options":[{"it":"Stampa \"ok\": il lock intrinseco è rientrante, lo stesso thread può riacquisirlo","en":"Prints \"ok\": the intrinsic lock is reentrant, the same thread can reacquire it"},{"it":"Deadlock: outer() detiene il lock e inner() non può acquisirlo","en":"Deadlock: outer() holds the lock and inner() cannot acquire it"},{"it":"Non compila","en":"Does not compile"},{"it":"Lancia IllegalMonitorStateException","en":"Throws IllegalMonitorStateException"}],"correct":0,"explanation":{"it":"In sintesi: il monitor intrinseco di Java è rientrante: il thread che possiede già il lock di `this` in `outer()` può rientrare in `inner()` senza bloccarsi, quindi stampa `ok`; la JVM tiene un contatore di rientri.\nLe altre opzioni: proprio per la rientranza non c\u0027è deadlock, il codice compila e `IllegalMonitorStateException` si ha usando `wait/notify` senza possedere il monitor, non qui.","en":"In summary: Java\u0027s intrinsic monitor is reentrant: the thread that already holds the lock on `this` in `outer()` can re-enter `inner()` without blocking, so it prints `ok`; the JVM keeps a reentrancy counter.\nThe other options: precisely because of reentrancy there is no deadlock, the code compiles, and `IllegalMonitorStateException` occurs when using `wait/notify` without owning the monitor, not here."}},{"type":"code","prompt":{"it":"Più thread eseguono questa sequenza su una ConcurrentHashMap. Il conteggio è affidabile?","en":"Multiple threads run this sequence on a ConcurrentHashMap. Is the count reliable?"},"code":"ConcurrentHashMap\u003cString,Integer\u003e m = new ConcurrentHashMap\u003c\u003e();\n// ogni thread:\nif (!m.containsKey(\"k\")) {\n    m.put(\"k\", 0);\n}\nm.put(\"k\", m.get(\"k\") + 1);","options":[{"it":"No: le singole operazioni sono thread-safe, ma il check-then-act e il get+put compongono operazioni non atomiche, causando conteggi errati; usare merge/compute o valori atomici","en":"No: the individual operations are thread-safe, but the check-then-act and the get+put form non-atomic compound operations, causing incorrect counts; use merge/compute or atomic values"},{"it":"Sì: ConcurrentHashMap rende automaticamente atomica l\u0027intera sequenza","en":"Yes: ConcurrentHashMap automatically makes the entire sequence atomic"},{"it":"No, perché lancia ConcurrentModificationException","en":"No, because it throws ConcurrentModificationException"},{"it":"No, perché il codice non compila a causa dei null","en":"No, because the code does not compile due to the nulls"}],"correct":0,"explanation":{"it":"In sintesi: `ConcurrentHashMap` garantisce l\u0027atomicità delle singole operazioni, non della loro composizione: sia il `containsKey`+`put` sia il `get`+`put` sono sequenze read-then-act interlacciabili, quindi si perdono incrementi; la soluzione idiomatica è `merge(\"k\", 1, Integer::sum)` o `compute`, oppure un `AtomicInteger` come valore.\nLe altre opzioni: la mappa non atomizza l\u0027intera sequenza, i suoi iteratori non lanciano `ConcurrentModificationException` e il codice compila correttamente.","en":"In summary: `ConcurrentHashMap` guarantees the atomicity of individual operations, not of their composition: both the `containsKey`+`put` and the `get`+`put` are interleavable read-then-act sequences, so increments are lost; the idiomatic solution is `merge(\"k\", 1, Integer::sum)` or `compute`, or an `AtomicInteger` as the value.\nThe other options: the map does not atomize the entire sequence, its iterators do not throw `ConcurrentModificationException`, and the code compiles correctly."}},{"type":"code","prompt":{"it":"Se il Thread B stampa, quale valore di data è garantito dal Java Memory Model?","en":"If Thread B prints, which value of data is guaranteed by the Java Memory Model?"},"code":"int data = 0;\nvolatile boolean ready = false;\n\n// Thread A\ndata = 42;\nready = true;\n\n// Thread B\nif (ready) {\n    System.out.println(data);\n}","options":[{"it":"42: la scrittura di data happens-before la scrittura del volatile ready, che happens-before la sua lettura, rendendo visibile data","en":"42: the write to data happens-before the write to the volatile ready, which happens-before its read, making data visible"},{"it":"Può stampare 0 nonostante ready sia volatile","en":"It may print 0 even though ready is volatile"},{"it":"Nessuna garanzia: serve rendere volatile anche data","en":"No guarantee: data must be made volatile too"},{"it":"Il codice non compila senza synchronized","en":"The code does not compile without synchronized"}],"correct":0,"explanation":{"it":"In sintesi: la scrittura `volatile` di `ready` funziona da barriera: tutto ciò che A scrive prima (incluso `data = 42`) è visibile a B non appena B legge `ready == true`, per la catena happens-before tra scrittura e lettura del volatile; questo è il pattern di safe publication tramite flag.\nLe altre opzioni: proprio grazie al volatile B non può vedere `data == 0` quando `ready` è vero; non serve rendere `data` volatile e il codice compila senza `synchronized`.","en":"In summary: the `volatile` write of `ready` acts as a barrier: everything A writes before it (including `data = 42`) is visible to B as soon as B reads `ready == true`, thanks to the happens-before chain between the write and read of the volatile; this is the safe-publication pattern via flag.\nThe other options: precisely because of the volatile, B cannot see `data == 0` when `ready` is true; there is no need to make `data` volatile, and the code compiles without `synchronized`."}}]},{"id":"jvm","title":"JVM, Memoria \u0026 Eccezioni","questions":[{"type":"mcq","prompt":{"it":"In un metodo, dove risiedono le variabili locali di tipo primitivo (es. un `int`)?","en":"In a method, where do local variables of primitive type (e.g. an `int`) reside?"},"code":"","options":[{"it":"Sullo stack, nel frame del metodo","en":"On the stack, in the method\u0027s frame"},{"it":"Sull\u0027heap, insieme agli oggetti","en":"On the heap, together with objects"},{"it":"Nel metaspace","en":"In the metaspace"},{"it":"Nel program counter register","en":"In the program counter register"}],"correct":0,"explanation":{"it":"In sintesi: le variabili locali di tipo primitivo vivono nel frame del metodo sullo stack del thread; ogni invocazione crea un frame che contiene i primitivi e i riferimenti locali, distrutto all\u0027uscita del metodo. Sull\u0027heap finiscono gli oggetti, non i primitivi locali.\nLe altre opzioni: l\u0027heap ospita gli oggetti non i primitivi locali; il metaspace tiene i metadati delle classi; il program counter e\u0027 solo un puntatore all\u0027istruzione corrente.","en":"In summary: local variables of primitive type live in the method\u0027s frame on the thread\u0027s stack; each invocation creates a frame holding the primitives and local references, which is destroyed when the method exits. Objects go on the heap, not local primitives.\nThe other options: the heap hosts objects, not local primitives; the metaspace holds class metadata; the program counter is just a pointer to the current instruction."}},{"type":"mcq","prompt":{"it":"Nel Java moderno (Java 8+), cosa contiene il metaspace?","en":"In modern Java (Java 8+), what does the metaspace contain?"},"code":"","options":[{"it":"I metadati delle classi (strutture runtime, bytecode dei metodi, informazioni sui tipi), in memoria nativa off-heap","en":"Class metadata (runtime structures, method bytecode, type information), in native off-heap memory"},{"it":"Gli oggetti di grandi dimensioni, per evitare la frammentazione dell\u0027heap","en":"Large objects, to avoid heap fragmentation"},{"it":"Le variabili locali e i frame dei metodi di ogni thread","en":"The local variables and method frames of each thread"},{"it":"Il pool delle stringhe interned e nient\u0027altro","en":"The interned string pool and nothing else"}],"correct":0,"explanation":{"it":"In sintesi: dal Java 8 il metaspace ha sostituito il PermGen e vive in memoria nativa off-heap; contiene i metadati delle classi caricate, cioe\u0027 strutture runtime, bytecode dei metodi e informazioni sui tipi. Cresce dinamicamente ed e\u0027 limitabile con `-XX:MaxMetaspaceSize`.\nLe altre opzioni: gli oggetti grandi stanno comunque sull\u0027heap; frame e variabili locali stanno sullo stack; lo string pool interned dal Java 7 e\u0027 sull\u0027heap, non nel metaspace.","en":"In summary: since Java 8 the metaspace has replaced PermGen and lives in native off-heap memory; it holds the metadata of loaded classes, i.e. runtime structures, method bytecode and type information. It grows dynamically and can be capped with `-XX:MaxMetaspaceSize`.\nThe other options: large objects still live on the heap; frames and local variables live on the stack; the interned string pool has been on the heap since Java 7, not in the metaspace."}},{"type":"truefalse","prompt":{"it":"Ogni thread della JVM ha il proprio stack privato, mentre l\u0027heap e\u0027 condiviso tra tutti i thread.","en":"Each JVM thread has its own private stack, while the heap is shared among all threads."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero. Ogni thread ha uno stack privato con i propri frame di metodo, mentre l\u0027heap (e il metaspace) e\u0027 condiviso; per questo l\u0027accesso concorrente all\u0027heap richiede sincronizzazione, mentre le variabili sullo stack sono per definizione thread-confined.\nLe altre opzioni: negarlo significherebbe ignorare che i primitivi/riferimenti locali sono isolati per thread mentre gli oggetti condivisi vivono nell\u0027heap comune.","en":"In summary: it\u0027s true. Each thread has a private stack with its own method frames, while the heap (and the metaspace) is shared; that\u0027s why concurrent access to the heap requires synchronization, whereas variables on the stack are by definition thread-confined.\nThe other options: denying it would ignore that local primitives/references are isolated per thread while shared objects live in the common heap."}},{"type":"mcq","prompt":{"it":"Che cos\u0027e\u0027 il program counter (PC) register nella JVM?","en":"What is the program counter (PC) register in the JVM?"},"code":"","options":[{"it":"Un registro per-thread che contiene l\u0027indirizzo dell\u0027istruzione bytecode in esecuzione","en":"A per-thread register that holds the address of the bytecode instruction being executed"},{"it":"Un contatore globale condiviso che conta gli oggetti allocati sull\u0027heap","en":"A shared global counter that counts the objects allocated on the heap"},{"it":"Il registro che memorizza il valore di ritorno di ogni metodo","en":"The register that stores the return value of each method"},{"it":"Una struttura nel metaspace che conta i riferimenti a ciascuna classe","en":"A structure in the metaspace that counts the references to each class"}],"correct":0,"explanation":{"it":"In sintesi: il program counter register e\u0027 per-thread e contiene l\u0027indirizzo dell\u0027istruzione bytecode attualmente in esecuzione da quel thread; permette alla JVM di riprendere il thread nel punto giusto dopo uno switch di contesto (per i metodi native il valore e\u0027 indefinito).\nLe altre opzioni: non conta oggetti sull\u0027heap, non memorizza valori di ritorno e non sta nel metaspace.","en":"In summary: the program counter register is per-thread and holds the address of the bytecode instruction the thread is currently executing; it lets the JVM resume the thread at the right point after a context switch (for native methods the value is undefined).\nThe other options: it does not count objects on the heap, does not store return values and does not live in the metaspace."}},{"type":"code","prompt":{"it":"Considerando questo codice, dove risiedono `x`, il riferimento `s` e l\u0027oggetto `String`?","en":"Given this code, where do `x`, the reference `s` and the `String` object reside?"},"code":"public class Demo {\n    public static void main(String[] args) {\n        int x = 42;\n        String s = new String(\"hi\");\n    }\n}","options":[{"it":"`x` e il riferimento `s` stanno sullo stack (frame di `main`); l\u0027oggetto `String` sta sull\u0027heap","en":"`x` and the reference `s` are on the stack (`main`\u0027s frame); the `String` object is on the heap"},{"it":"Tutto (`x`, `s` e l\u0027oggetto) sta sull\u0027heap perche\u0027 sono dentro un metodo","en":"Everything (`x`, `s` and the object) is on the heap because they are inside a method"},{"it":"`x` sta sull\u0027heap, mentre `s` e l\u0027oggetto stanno sullo stack","en":"`x` is on the heap, while `s` and the object are on the stack"},{"it":"Tutto sta sullo stack perche\u0027 sono variabili locali","en":"Everything is on the stack because they are local variables"}],"correct":0,"explanation":{"it":"In sintesi: `x` e\u0027 un primitivo locale e sta nel frame di `main` sullo stack; anche il riferimento `s` e\u0027 una variabile locale sullo stack, ma l\u0027oggetto `String` a cui punta e\u0027 allocato sull\u0027heap. La regola chiave: il riferimento sta sullo stack, l\u0027oggetto sull\u0027heap.\nLe altre opzioni: non tutto sta sull\u0027heap ne\u0027 tutto sullo stack; e `x`, essendo primitivo locale, non finisce sull\u0027heap.","en":"In summary: `x` is a local primitive and lives in `main`\u0027s frame on the stack; the reference `s` is also a local variable on the stack, but the `String` object it points to is allocated on the heap. The key rule: the reference is on the stack, the object on the heap.\nThe other options: not everything is on the heap nor everything on the stack; and `x`, being a local primitive, does not end up on the heap."}},{"type":"truefalse","prompt":{"it":"Grazie all\u0027escape analysis, il JIT puo\u0027 allocare sullo stack (o eliminare del tutto tramite scalar replacement) oggetti che non sfuggono all\u0027ambito del metodo.","en":"Thanks to escape analysis, the JIT can allocate on the stack (or eliminate entirely via scalar replacement) objects that do not escape the method\u0027s scope."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero, ed e\u0027 una domanda stretch. L\u0027escape analysis del JIT determina se un oggetto \u0027sfugge\u0027 al metodo; se non sfugge, puo\u0027 applicare scalar replacement decomponendone i campi in registri o sullo stack, evitando l\u0027allocazione sull\u0027heap e riducendo la pressione sul GC.\nLe altre opzioni: negarlo ignorerebbe un\u0027ottimizzazione reale di HotSpot; resta vero che, concettualmente, il modello di memoria colloca gli oggetti sull\u0027heap.","en":"In summary: it\u0027s true, and it\u0027s a stretch question. The JIT\u0027s escape analysis determines whether an object \u0027escapes\u0027 the method; if it doesn\u0027t, it can apply scalar replacement, decomposing its fields into registers or onto the stack, avoiding heap allocation and reducing GC pressure.\nThe other options: denying it would ignore a real HotSpot optimization; it remains true that, conceptually, the memory model places objects on the heap."}},{"type":"code","prompt":{"it":"Cosa produce l\u0027esecuzione di questo programma?","en":"What does running this program produce?"},"code":"public class Recurse {\n    static int depth(int n) {\n        return depth(n + 1);\n    }\n    public static void main(String[] args) {\n        System.out.println(depth(0));\n    }\n}","options":[{"it":"Stampa un numero molto grande","en":"Prints a very large number"},{"it":"Lancia `StackOverflowError`","en":"Throws `StackOverflowError`"},{"it":"Lancia `OutOfMemoryError`","en":"Throws `OutOfMemoryError`"},{"it":"Va in loop infinito senza errori","en":"Loops forever with no error"}],"correct":1,"explanation":{"it":"In sintesi: `depth` si richiama senza caso base, quindi ogni chiamata aggiunge un frame allo stack finche\u0027 lo spazio si esaurisce: la JVM lancia `StackOverflowError`. E\u0027 il sintomo tipico di ricorsione infinita o troppo profonda.\nLe altre opzioni: non c\u0027e\u0027 un valore stampato perche\u0027 non si ritorna mai; non e\u0027 `OutOfMemoryError` (riguarda l\u0027heap) ne\u0027 un loop silenzioso: lo stack e\u0027 finito e l\u0027errore arriva.","en":"In summary: `depth` calls itself with no base case, so each call pushes a frame onto the stack until the space runs out: the JVM throws `StackOverflowError`. It\u0027s the typical symptom of infinite or excessively deep recursion.\nThe other options: no value is printed because it never returns; it\u0027s not `OutOfMemoryError` (which concerns the heap) nor a silent loop: the stack is finite and the error arrives."}},{"type":"mcq","prompt":{"it":"Secondo il modello di HotSpot, quando un oggetto diventa idoneo alla garbage collection?","en":"According to the HotSpot model, when does an object become eligible for garbage collection?"},"code":"","options":[{"it":"Quando non e\u0027 piu\u0027 raggiungibile tramite una catena di riferimenti a partire da un GC root","en":"When it is no longer reachable through a chain of references starting from a GC root"},{"it":"Quando il suo contatore di riferimenti (reference count) arriva a zero","en":"When its reference count reaches zero"},{"it":"Immediatamente dopo l\u0027uscita dal metodo in cui e\u0027 stato creato","en":"Immediately after exiting the method in which it was created"},{"it":"Quando il programmatore chiama esplicitamente `free()` o `delete`","en":"When the programmer explicitly calls `free()` or `delete`"}],"correct":0,"explanation":{"it":"In sintesi: nel modello di HotSpot un oggetto e\u0027 idoneo al GC quando diventa non raggiungibile, cioe\u0027 non esiste piu\u0027 alcuna catena di riferimenti che parte da un GC root e arriva a lui. Il GC lavora sulla reachability, non sul conteggio dei riferimenti.\nLe altre opzioni: il reference counting non e\u0027 usato da HotSpot (non gestirebbe i cicli); l\u0027uscita dal metodo non basta se l\u0027oggetto e\u0027 ancora riferito; in Java non esiste `free()`/`delete` manuale.","en":"In summary: in the HotSpot model an object is eligible for GC when it becomes unreachable, i.e. there is no longer any chain of references that starts from a GC root and reaches it. The GC works on reachability, not on reference counting.\nThe other options: reference counting is not used by HotSpot (it wouldn\u0027t handle cycles); exiting the method isn\u0027t enough if the object is still referenced; in Java there is no manual `free()`/`delete`."}},{"type":"mcq","prompt":{"it":"Quale dei seguenti NON e\u0027 un GC root?","en":"Which of the following is NOT a GC root?"},"code":"","options":[{"it":"Un oggetto raggiungibile solo tramite un altro oggetto a sua volta non raggiungibile","en":"An object reachable only through another object that is itself unreachable"},{"it":"Le variabili locali nello stack di un thread attivo","en":"Local variables in the stack of an active thread"},{"it":"I riferimenti dai campi statici delle classi caricate","en":"References from the static fields of loaded classes"},{"it":"Gli oggetti riferiti da variabili JNI native","en":"Objects referenced by native JNI variables"}],"correct":0,"explanation":{"it":"In sintesi: un GC root e\u0027 un punto d\u0027ingresso \u0027vivo\u0027 della reachability: variabili locali sullo stack di thread attivi, campi statici delle classi caricate, riferimenti JNI nativi, thread attivi. Un oggetto raggiungibile solo tramite un altro oggetto gia\u0027 non raggiungibile e\u0027 invece spazzatura, non un root.\nLe altre opzioni: locali sullo stack, campi statici e riferimenti JNI sono GC root autentici.","en":"In summary: a GC root is a \u0027live\u0027 entry point for reachability: local variables on the stack of active threads, static fields of loaded classes, native JNI references, active threads. An object reachable only through another already-unreachable object is itself garbage, not a root.\nThe other options: locals on the stack, static fields and JNI references are genuine GC roots."}},{"type":"mcq","prompt":{"it":"Qual e\u0027 la differenza tra minor GC e major/full GC?","en":"What is the difference between a minor GC and a major/full GC?"},"code":"","options":[{"it":"Il minor GC ripulisce la young generation; il major/full GC coinvolge anche la old generation","en":"The minor GC cleans up the young generation; the major/full GC also involves the old generation"},{"it":"Il minor GC gira solo in fase di startup, il major GC solo allo shutdown","en":"The minor GC runs only at startup, the major GC only at shutdown"},{"it":"Il minor GC libera il metaspace, il major GC libera l\u0027heap","en":"The minor GC frees the metaspace, the major GC frees the heap"},{"it":"Il minor GC e\u0027 manuale via `System.gc()`, il major e\u0027 automatico","en":"The minor GC is manual via `System.gc()`, the major is automatic"}],"correct":0,"explanation":{"it":"In sintesi: il minor GC ripulisce la young generation (Eden e survivor), dove muoiono in fretta la maggior parte degli oggetti secondo la weak generational hypothesis; il major/full GC coinvolge anche la old generation ed e\u0027 piu\u0027 costoso e con pause maggiori.\nLe altre opzioni: il GC non gira solo a startup/shutdown, il minor non tocca il metaspace e non e\u0027 pilotato manualmente da `System.gc()`.","en":"In summary: the minor GC cleans up the young generation (Eden and survivor spaces), where most objects die quickly according to the weak generational hypothesis; the major/full GC also involves the old generation and is more expensive, with longer pauses.\nThe other options: the GC does not run only at startup/shutdown, the minor one does not touch the metaspace and is not driven manually by `System.gc()`."}},{"type":"truefalse","prompt":{"it":"La chiamata `System.gc()` garantisce l\u0027esecuzione immediata e completa del garbage collector.","en":"Calling `System.gc()` guarantees the immediate and complete execution of the garbage collector."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: e\u0027 falso. `System.gc()` e\u0027 soltanto un suggerimento (hint) alla JVM: non garantisce quando ne\u0027 se il GC verra\u0027 eseguito, e puo\u0027 essere disabilitato con `-XX:+DisableExplicitGC`. Affidarsi ad esso e\u0027 un anti-pattern.\nLe altre opzioni: crederlo garantito porta a codice fragile che \u0027sembra\u0027 liberare memoria ma dipende dalla politica del collector.","en":"In summary: it\u0027s false. `System.gc()` is only a hint to the JVM: it guarantees neither when nor whether the GC will run, and it can be disabled with `-XX:+DisableExplicitGC`. Relying on it is an anti-pattern.\nThe other options: believing it guaranteed leads to fragile code that \u0027appears\u0027 to free memory but actually depends on the collector\u0027s policy."}},{"type":"code","prompt":{"it":"Dopo l\u0027assegnazione `o = null`, l\u0027oggetto creato e\u0027 idoneo alla garbage collection?","en":"After the assignment `o = null`, is the created object eligible for garbage collection?"},"code":"class Holder {\n    static Object ref;\n}\npublic class Main {\n    public static void main(String[] args) {\n        Object o = new Object();\n        Holder.ref = o;\n        o = null;\n    }\n}","options":[{"it":"No: l\u0027oggetto resta raggiungibile tramite il campo statico `Holder.ref` (un GC root), quindi non e\u0027 idoneo","en":"No: the object stays reachable through the static field `Holder.ref` (a GC root), so it is not eligible"},{"it":"Si\u0027: dopo `o = null` non esistono piu\u0027 riferimenti, quindi e\u0027 immediatamente raccolto","en":"Yes: after `o = null` there are no references left, so it is collected immediately"},{"it":"Si\u0027, ma solo dopo aver chiamato `System.gc()`","en":"Yes, but only after calling `System.gc()`"},{"it":"No, perche\u0027 in Java gli oggetti non vengono mai raccolti finche\u0027 il programma e\u0027 in esecuzione","en":"No, because in Java objects are never collected while the program is running"}],"correct":0,"explanation":{"it":"In sintesi: no. Dopo `o = null` il riferimento locale sparisce, ma l\u0027oggetto resta raggiungibile tramite il campo statico `Holder.ref`, che e\u0027 un GC root: quindi non e\u0027 idoneo alla raccolta. Per liberarlo bisognerebbe azzerare anche `Holder.ref`.\nLe altre opzioni: non basta annullare la sola variabile locale; `System.gc()` e\u0027 irrilevante finche\u0027 l\u0027oggetto e\u0027 raggiungibile; e gli oggetti irraggiungibili in Java vengono eccome raccolti.","en":"In summary: no. After `o = null` the local reference disappears, but the object stays reachable through the static field `Holder.ref`, which is a GC root: so it is not eligible for collection. To free it you would also have to null out `Holder.ref`.\nThe other options: nulling just the local variable isn\u0027t enough; `System.gc()` is irrelevant while the object is reachable; and unreachable objects in Java are indeed collected."}},{"type":"code","prompt":{"it":"Chiamando `add()` ripetutamente senza mai svuotare la lista, cosa succede?","en":"Calling `add()` repeatedly without ever emptying the list, what happens?"},"code":"public class Cache {\n    private static final List\u003cbyte[]\u003e CACHE = new ArrayList\u003c\u003e();\n    public static void add() {\n        CACHE.add(new byte[1024 * 1024]);\n    }\n}","options":[{"it":"Nessun problema: il GC liberera\u0027 gli array quando la memoria scarseggia, perche\u0027 sono in una cache","en":"No problem: the GC will free the arrays when memory runs low, because they are in a cache"},{"it":"Memory leak: gli array restano raggiungibili dalla lista statica e non vengono mai raccolti, fino a `OutOfMemoryError`","en":"Memory leak: the arrays stay reachable from the static list and are never collected, up to `OutOfMemoryError`"},{"it":"`StackOverflowError` dopo molte chiamate ad `add()`","en":"`StackOverflowError` after many calls to `add()`"},{"it":"Gli array vengono deallocati automaticamente all\u0027uscita del metodo `add()`","en":"The arrays are deallocated automatically when the `add()` method exits"}],"correct":1,"explanation":{"it":"In sintesi: e\u0027 un memory leak classico. La lista e\u0027 `static` (raggiungibile da un GC root per tutta la vita della classe) e accumula riferimenti forti agli array, che quindi non diventano mai irraggiungibili: la memoria cresce senza limiti fino a `OutOfMemoryError: Java heap space`.\nLe altre opzioni: il GC non puo\u0027 liberare oggetti ancora raggiungibili; non e\u0027 uno `StackOverflowError`; e in Java non c\u0027e\u0027 deallocazione manuale a fine metodo.","en":"In summary: it\u0027s a classic memory leak. The list is `static` (reachable from a GC root for the entire lifetime of the class) and accumulates strong references to the arrays, which therefore never become unreachable: memory grows without limit until `OutOfMemoryError: Java heap space`.\nThe other options: the GC cannot free objects that are still reachable; it\u0027s not a `StackOverflowError`; and in Java there is no manual deallocation at method exit."}},{"type":"mcq","prompt":{"it":"Registrare un listener/observer su un componente a vita lunga senza mai deregistrarlo, in genere, cosa comporta?","en":"Registering a listener/observer on a long-lived component without ever deregistering it generally leads to what?"},"code":"","options":[{"it":"E\u0027 un classico memory leak: il componente a vita lunga mantiene un riferimento forte al listener, impedendo la raccolta sua e degli oggetti che referenzia","en":"It\u0027s a classic memory leak: the long-lived component keeps a strong reference to the listener, preventing the collection of both it and the objects it references"},{"it":"Non puo\u0027 causare leak: i listener sono sempre riferimenti deboli in Java","en":"It cannot cause a leak: listeners are always weak references in Java"},{"it":"Causa uno `StackOverflowError` alla prima notifica","en":"It causes a `StackOverflowError` on the first notification"},{"it":"Il GC rimuove automaticamente i listener non piu\u0027 usati dal codice applicativo","en":"The GC automatically removes listeners no longer used by the application code"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 il tipico leak da listener/observer. Il componente a vita lunga (il subject) tiene un riferimento forte al listener; se non lo si deregistra, il listener e tutto cio\u0027 che referenzia restano raggiungibili e non vengono raccolti. La soluzione e\u0027 deregistrarlo o usare weak references.\nLe altre opzioni: i listener non sono weak per default; non e\u0027 uno `StackOverflowError`; il GC non \u0027indovina\u0027 quali listener togliere.","en":"In summary: it\u0027s the typical listener/observer leak. The long-lived component (the subject) holds a strong reference to the listener; if you don\u0027t deregister it, the listener and everything it references stay reachable and are not collected. The fix is to deregister it or use weak references.\nThe other options: listeners are not weak by default; it\u0027s not a `StackOverflowError`; the GC does not \u0027guess\u0027 which listeners to remove."}},{"type":"mcq","prompt":{"it":"In un\u0027applicazione con thread pool, usare `ThreadLocal` e non chiamare mai `remove()` cosa comporta?","en":"In an application with a thread pool, using `ThreadLocal` and never calling `remove()` leads to what?"},"code":"","options":[{"it":"Rischio di memory leak: i thread del pool vivono a lungo e trattengono i valori nella `ThreadLocalMap`, non rilasciati finche\u0027 non si chiama `remove()`","en":"Risk of memory leak: the pool\u0027s threads are long-lived and retain the values in the `ThreadLocalMap`, which are not released until `remove()` is called"},{"it":"Nessun rischio: alla fine di ogni task il valore `ThreadLocal` viene azzerato automaticamente","en":"No risk: at the end of each task the `ThreadLocal` value is cleared automatically"},{"it":"Causa sempre un `OutOfMemoryError` alla prima esecuzione","en":"It always causes an `OutOfMemoryError` on the first run"},{"it":"I `ThreadLocal` non sono utilizzabili nei thread pool: il compilatore lo impedisce","en":"`ThreadLocal`s cannot be used in thread pools: the compiler prevents it"}],"correct":0,"explanation":{"it":"In sintesi: si\u0027, e\u0027 un leak insidioso e stretch. Nei thread pool i worker vivono a lungo e riusano gli stessi thread; i valori restano nella `ThreadLocalMap` del thread finche\u0027 non si chiama `remove()`. Va sempre ripulito, tipicamente in un `finally`, a fine task.\nLe altre opzioni: il valore non si azzera da solo a fine task; non causa OOM immediato; e i `ThreadLocal` sono perfettamente usabili nei pool, semplicemente vanno gestiti con cura.","en":"In summary: yes, it\u0027s an insidious and stretch leak. In thread pools the workers are long-lived and reuse the same threads; the values stay in the thread\u0027s `ThreadLocalMap` until `remove()` is called. It should always be cleaned up, typically in a `finally` block, at the end of the task.\nThe other options: the value does not clear itself at the end of the task; it does not cause an immediate OOM; and `ThreadLocal`s are perfectly usable in pools, they just need to be handled with care."}},{"type":"mcq","prompt":{"it":"Nella gerarchia delle eccezioni, cosa sono `OutOfMemoryError` e `StackOverflowError`?","en":"In the exception hierarchy, what are `OutOfMemoryError` and `StackOverflowError`?"},"code":"","options":[{"it":"Sono entrambi sottoclassi di `Error`: condizioni gravi normalmente non gestibili dall\u0027applicazione","en":"They are both subclasses of `Error`: serious conditions normally not handleable by the application"},{"it":"Sono entrambi sottoclassi di `RuntimeException`","en":"They are both subclasses of `RuntimeException`"},{"it":"`OutOfMemoryError` e\u0027 un `Error`, `StackOverflowError` e\u0027 una `Exception`","en":"`OutOfMemoryError` is an `Error`, `StackOverflowError` is an `Exception`"},{"it":"Sono entrambi checked exception e vanno dichiarati con `throws`","en":"They are both checked exceptions and must be declared with `throws`"}],"correct":0,"explanation":{"it":"In sintesi: `OutOfMemoryError` e `StackOverflowError` sono entrambi sottoclassi di `Error` (via `VirtualMachineError`), quindi condizioni gravi che l\u0027applicazione di norma non dovrebbe tentare di gestire. Il primo riguarda l\u0027esaurimento dell\u0027heap, il secondo l\u0027esaurimento dello stack.\nLe altre opzioni: non sono `RuntimeException` ne\u0027 checked exception, e nessuno dei due e\u0027 una `Exception`.","en":"In summary: `OutOfMemoryError` and `StackOverflowError` are both subclasses of `Error` (via `VirtualMachineError`), so serious conditions that the application normally should not try to handle. The former concerns heap exhaustion, the latter stack exhaustion.\nThe other options: they are neither `RuntimeException` nor checked exceptions, and neither of them is an `Exception`."}},{"type":"mcq","prompt":{"it":"Cosa intercetta un blocco `catch (Throwable t)` e qual e\u0027 la posizione di `Throwable`?","en":"What does a `catch (Throwable t)` block intercept, and where is `Throwable` positioned?"},"code":"","options":[{"it":"`Throwable` e\u0027 la radice della gerarchia: `catch (Throwable t)` intercetta sia le `Exception` sia gli `Error`","en":"`Throwable` is the root of the hierarchy: `catch (Throwable t)` intercepts both `Exception`s and `Error`s"},{"it":"`Throwable` sta sotto `Exception`, quindi non intercetta gli `Error`","en":"`Throwable` is below `Exception`, so it does not intercept `Error`s"},{"it":"Non e\u0027 possibile fare `catch (Throwable t)`: non compila","en":"You cannot write `catch (Throwable t)`: it does not compile"},{"it":"`catch (Throwable t)` intercetta solo le unchecked exception","en":"`catch (Throwable t)` intercepts only unchecked exceptions"}],"correct":0,"explanation":{"it":"In sintesi: `Throwable` e\u0027 la radice comune di `Error` ed `Exception`; un `catch (Throwable t)` intercetta davvero entrambi, inclusi gli `Error`. E\u0027 valido sintatticamente ma sconsigliato, perche\u0027 catturare gli `Error` (es. `OutOfMemoryError`) di solito e\u0027 controproducente.\nLe altre opzioni: `Throwable` e\u0027 sopra `Exception`, il catch compila, e non si limita alle unchecked.","en":"In summary: `Throwable` is the common root of `Error` and `Exception`; a `catch (Throwable t)` really does intercept both, including `Error`s. It is syntactically valid but discouraged, because catching `Error`s (e.g. `OutOfMemoryError`) is usually counterproductive.\nThe other options: `Throwable` sits above `Exception`, the catch compiles, and it is not limited to unchecked exceptions."}},{"type":"truefalse","prompt":{"it":"In Java, `RuntimeException` e\u0027 una sottoclasse di `Exception`.","en":"In Java, `RuntimeException` is a subclass of `Exception`."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero. La gerarchia e\u0027 `Throwable` -\u003e `Exception` -\u003e `RuntimeException`: quindi `RuntimeException` estende `Exception`, ma e\u0027 unchecked. Le altre `Exception` non-runtime sono checked.\nLe altre opzioni: negarlo confonderebbe la posizione di `RuntimeException`, che sta sotto `Exception`, non parallela ad essa.","en":"In summary: it\u0027s true. The hierarchy is `Throwable` -\u003e `Exception` -\u003e `RuntimeException`: so `RuntimeException` extends `Exception`, but it is unchecked. The other, non-runtime `Exception`s are checked.\nThe other options: denying it would confuse the position of `RuntimeException`, which sits below `Exception`, not parallel to it."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"public class Catch {\n    public static void main(String[] args) {\n        try {\n            String s = null;\n            s.length();\n        } catch (Exception e) {\n            System.out.println(\"catturata\");\n        }\n    }\n}","options":[{"it":"Stampa `catturata`","en":"Prints `catturata`"},{"it":"Errore di compilazione","en":"Compilation error"},{"it":"L\u0027eccezione non viene catturata e il programma termina con stack trace","en":"The exception is not caught and the program terminates with a stack trace"},{"it":"Non stampa nulla e termina normalmente","en":"Prints nothing and terminates normally"}],"correct":0,"explanation":{"it":"In sintesi: stampa `catturata`. Il `NullPointerException` e\u0027 una `RuntimeException`, quindi una `Exception`: il `catch (Exception e)` la intercetta senza problemi. Le unchecked sono catturabili esattamente come le checked.\nLe altre opzioni: non c\u0027e\u0027 errore di compilazione, l\u0027eccezione non sfugge al catch e qualcosa viene stampato.","en":"In summary: it prints `catturata`. `NullPointerException` is a `RuntimeException`, hence an `Exception`: the `catch (Exception e)` intercepts it without issue. Unchecked exceptions are catchable exactly like checked ones.\nThe other options: there is no compilation error, the exception does not escape the catch and something is printed."}},{"type":"mcq","prompt":{"it":"Quale delle seguenti e\u0027 una checked exception?","en":"Which of the following is a checked exception?"},"code":"","options":[{"it":"`IOException`","en":"`IOException`"},{"it":"`NullPointerException`","en":"`NullPointerException`"},{"it":"`IllegalArgumentException`","en":"`IllegalArgumentException`"},{"it":"`ArrayIndexOutOfBoundsException`","en":"`ArrayIndexOutOfBoundsException`"}],"correct":0,"explanation":{"it":"In sintesi: `IOException` e\u0027 una checked exception: eredita da `Exception` (non da `RuntimeException`), quindi va dichiarata con `throws` o catturata, altrimenti il codice non compila. Le altre tre sono unchecked.\nLe altre opzioni: `NullPointerException`, `IllegalArgumentException` e `ArrayIndexOutOfBoundsException` estendono `RuntimeException` e sono unchecked.","en":"In summary: `IOException` is a checked exception: it inherits from `Exception` (not from `RuntimeException`), so it must be declared with `throws` or caught, otherwise the code does not compile. The other three are unchecked.\nThe other options: `NullPointerException`, `IllegalArgumentException` and `ArrayIndexOutOfBoundsException` extend `RuntimeException` and are unchecked."}},{"type":"truefalse","prompt":{"it":"Le `RuntimeException` e le loro sottoclassi (unchecked) non devono essere obbligatoriamente dichiarate con `throws` ne\u0027 catturate.","en":"`RuntimeException`s and their subclasses (unchecked) do not have to be mandatorily declared with `throws` nor caught."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero. Le `RuntimeException` e sottoclassi sono unchecked: il compilatore non obbliga a dichiararle ne\u0027 a catturarle, perche\u0027 rappresentano tipicamente errori di programmazione. Le checked, invece, vanno gestite o propagate esplicitamente.\nLe altre opzioni: crederlo falso porterebbe a `throws` inutili su NPE e simili, che non sono richiesti.","en":"In summary: it\u0027s true. `RuntimeException`s and their subclasses are unchecked: the compiler does not force you to declare or catch them, because they typically represent programming errors. Checked ones, by contrast, must be handled or propagated explicitly.\nThe other options: believing it false would lead to pointless `throws` clauses on NPE and the like, which are not required."}},{"type":"code","prompt":{"it":"Qual e\u0027 l\u0027output di questo programma?","en":"What is the output of this program?"},"code":"public class F {\n    public static void main(String[] args) {\n        try {\n            System.out.println(\"A\");\n            throw new RuntimeException(\"x\");\n        } catch (RuntimeException e) {\n            System.out.println(\"B\");\n        } finally {\n            System.out.println(\"C\");\n        }\n        System.out.println(\"D\");\n    }\n}","options":[{"it":"A B C D","en":"A B C D"},{"it":"A B D","en":"A B D"},{"it":"A C D (senza B)","en":"A C D (without B)"},{"it":"A B C (senza D)","en":"A B C (without D)"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027output e\u0027 `A B C D`. Si stampa A, l\u0027eccezione viene lanciata e catturata (B), il `finally` esegue sempre (C) e, poiche\u0027 l\u0027eccezione e\u0027 stata gestita, l\u0027esecuzione prosegue dopo il try/catch (D).\nLe altre opzioni: B non viene saltato (l\u0027eccezione e\u0027 catturata), il finally non viene omesso e D viene raggiunto normalmente.","en":"In summary: the output is `A B C D`. A is printed, the exception is thrown and caught (B), the `finally` always runs (C) and, since the exception was handled, execution continues after the try/catch (D).\nThe other options: B is not skipped (the exception is caught), the finally is not omitted and D is reached normally."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"public class R {\n    static int f() {\n        try {\n            return 1;\n        } finally {\n            return 2;\n        }\n    }\n    public static void main(String[] args) {\n        System.out.println(f());\n    }\n}","options":[{"it":"2","en":"2"},{"it":"1","en":"1"},{"it":"Prima 1 poi 2","en":"First 1 then 2"},{"it":"Errore di compilazione","en":"Compilation error"}],"correct":0,"explanation":{"it":"In sintesi: stampa `2`. Un `return` dentro il `finally` sovrascrive il `return 1` del `try`: il valore del try viene scartato. E\u0027 comportamento corretto ma un anti-pattern, perche\u0027 un return (o un throw) nel finally nasconde il flusso.\nLe altre opzioni: non e\u0027 1 (il finally vince), non si stampano due valori e il codice compila (al piu\u0027 con warning).","en":"In summary: it prints `2`. A `return` inside the `finally` overrides the `return 1` of the `try`: the try\u0027s value is discarded. It\u0027s correct behavior but an anti-pattern, because a return (or a throw) in the finally hides the control flow.\nThe other options: it\u0027s not 1 (the finally wins), two values are not printed and the code compiles (at most with a warning)."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"public class S {\n    static int f() {\n        try {\n            throw new RuntimeException(\"boom\");\n        } finally {\n            return 42;\n        }\n    }\n    public static void main(String[] args) {\n        System.out.println(f());\n    }\n}","options":[{"it":"Stampa `42`; l\u0027eccezione viene scartata (soppressa dal `return` nel finally)","en":"Prints `42`; the exception is discarded (suppressed by the `return` in the finally)"},{"it":"Propaga la `RuntimeException` e il programma termina con stack trace","en":"Propagates the `RuntimeException` and the program terminates with a stack trace"},{"it":"Errore di compilazione","en":"Compilation error"},{"it":"Stampa `42` e poi lo stack trace dell\u0027eccezione","en":"Prints `42` and then the exception\u0027s stack trace"}],"correct":0,"explanation":{"it":"In sintesi: stampa `42`. Il `return` nel `finally` prende il sopravvento e fa uscire il metodo normalmente, scartando la `RuntimeException` lanciata nel try: l\u0027eccezione viene silenziosamente soppressa. E\u0027 uno dei motivi per cui non si mette un return nel finally.\nLe altre opzioni: l\u0027eccezione non si propaga proprio perche\u0027 il finally ritorna, il codice compila e non viene stampato alcuno stack trace.","en":"In summary: it prints `42`. The `return` in the `finally` takes over and makes the method exit normally, discarding the `RuntimeException` thrown in the try: the exception is silently suppressed. It\u0027s one of the reasons you don\u0027t put a return in the finally.\nThe other options: the exception does not propagate precisely because the finally returns, the code compiles and no stack trace is printed."}},{"type":"truefalse","prompt":{"it":"Se nel blocco `try` viene chiamato `System.exit(0)`, il blocco `finally` NON viene eseguito.","en":"If `System.exit(0)` is called in the `try` block, the `finally` block is NOT executed."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero. `System.exit()` termina la JVM invocando l\u0027halt del runtime: i blocchi `finally` in sospeso NON vengono eseguiti perche\u0027 il thread non \u0027esce\u0027 normalmente dal try. E\u0027 l\u0027eccezio
