"it":"{a=[apple, avocado], b=[banana], c=[cherry]}","en":"{a=[apple, avocado], b=[banana], c=[cherry]}"},{"it":"{a=2, b=1, c=1}","en":"{a=2, b=1, c=1}"},{"it":"{apple=a, banana=b, avocado=a, cherry=c}","en":"{apple=a, banana=b, avocado=a, cherry=c}"}],"correct":1,"explanation":{"it":"In sintesi: `groupingBy(classifier)` raggruppa per la chiave prodotta dal classifier (qui la prima lettera con `charAt(0)`) e, senza downstream esplicito, raccoglie ogni gruppo in una `List` (il `toList()` implicito) preservando l\u0027ordine di incontro; \u0027apple\u0027 e \u0027avocado\u0027 finiscono entrambe sotto \u0027a\u0027, dando {a=[apple, avocado], b=[banana], c=[cherry]}.\nLe altre opzioni: {a=apple, ..., a=avocado, ...} e\u0027 impossibile perche\u0027 una `Map` non ha chiavi duplicate; {a=2, b=1, c=1} richiederebbe il downstream `Collectors.counting()`; l\u0027ultima inverte chiavi e valori.","en":"In summary: `groupingBy(classifier)` groups by the key produced by the classifier (here the first letter via `charAt(0)`) and, with no explicit downstream, collects each group into a `List` (the implicit `toList()`) preserving encounter order; \u0027apple\u0027 and \u0027avocado\u0027 both end up under \u0027a\u0027, giving {a=[apple, avocado], b=[banana], c=[cherry]}.\nThe other options: {a=apple, ..., a=avocado, ...} is impossible because a `Map` cannot have duplicate keys; {a=2, b=1, c=1} would require the `Collectors.counting()` downstream; the last one swaps keys and values."}},{"type":"code","prompt":{"it":"Cosa succede eseguendo questo codice?","en":"What happens when this code runs?"},"code":"Map\u003cInteger, String\u003e m = Stream.of(\"a\", \"bb\", \"cc\", \"d\")\n    .collect(Collectors.toMap(String::length, s -\u003e s));\nSystem.out.println(m);","options":[{"it":"{1=a, 2=bb}","en":"{1=a, 2=bb}"},{"it":"Lancia IllegalStateException per chiave duplicata","en":"Throws IllegalStateException for a duplicate key"},{"it":"{1=d, 2=cc}","en":"{1=d, 2=cc}"},{"it":"{2=[bb, cc], 1=[a, d]}","en":"{2=[bb, cc], 1=[a, d]}"}],"correct":1,"explanation":{"it":"In sintesi: `toMap(keyMapper, valueMapper)` senza mergeFunction lancia `IllegalStateException` con messaggio \u0027Duplicate key\u0027 quando due elementi producono la stessa chiave; le lunghezze sono 1, 2, 2, 1, quindi collidono \u0027a\u0027/\u0027d\u0027 (lunghezza 1) e \u0027bb\u0027/\u0027cc\u0027 (lunghezza 2). Per gestire i duplicati serve il terzo argomento (mergeFunction), es. `(a, b) -\u003e a`.\nLe altre opzioni: {1=a, 2=bb} e {1=d, 2=cc} assumono che una collisione venga risolta silenziosamente; {2=[bb, cc], 1=[a, d]} confonde `toMap` con `groupingBy`.","en":"In summary: `toMap(keyMapper, valueMapper)` without a mergeFunction throws `IllegalStateException` with the message \u0027Duplicate key\u0027 when two elements produce the same key; the lengths are 1, 2, 2, 1, so \u0027a\u0027/\u0027d\u0027 (length 1) and \u0027bb\u0027/\u0027cc\u0027 (length 2) collide. To handle duplicates you need the third argument (mergeFunction), e.g. `(a, b) -\u003e a`.\nThe other options: {1=a, 2=bb} and {1=d, 2=cc} assume a collision is resolved silently; {2=[bb, cc], 1=[a, d]} confuses `toMap` with `groupingBy`."}},{"type":"code","prompt":{"it":"Quale Map produce questo codice?","en":"Which Map does this code produce?"},"code":"Map\u003cBoolean, List\u003cInteger\u003e\u003e m = Stream.of(1, 2, 3, 4, 5)\n    .collect(Collectors.partitioningBy(n -\u003e n % 2 == 0));\nSystem.out.println(m);","options":[{"it":"{false=[1, 3, 5], true=[2, 4]}","en":"{false=[1, 3, 5], true=[2, 4]}"},{"it":"{true=[2, 4], false=[1, 3, 5]}","en":"{true=[2, 4], false=[1, 3, 5]}"},{"it":"{even=[2, 4], odd=[1, 3, 5]}","en":"{even=[2, 4], odd=[1, 3, 5]}"},{"it":"{2=[2], 4=[4]}","en":"{2=[2], 4=[4]}"}],"correct":0,"explanation":{"it":"In sintesi: `partitioningBy(predicate)` divide lo stream in esattamente due gruppi con chiavi `Boolean`, false (predicato non soddisfatto) e true (soddisfatto); la Partition interna garantisce SEMPRE entrambe le chiavi anche se un gruppo e\u0027 vuoto e nella `toString` itera false prima di true, dando {false=[1, 3, 5], true=[2, 4]}.\nLe altre opzioni: {true=[2, 4], false=[1, 3, 5]} ha l\u0027ordine di stampa invertito; le chiavi String sono impossibili con `partitioningBy` che accetta solo un `Predicate`; {2=[2], 4=[4]} confonde con `groupingBy` sul valore.","en":"In summary: `partitioningBy(predicate)` splits the stream into exactly two groups with `Boolean` keys, false (predicate not satisfied) and true (satisfied); the internal Partition ALWAYS guarantees both keys even if a group is empty, and in its `toString` it iterates false before true, giving {false=[1, 3, 5], true=[2, 4]}.\nThe other options: {true=[2, 4], false=[1, 3, 5]} has the print order reversed; String keys are impossible with `partitioningBy`, which accepts only a `Predicate`; {2=[2], 4=[4]} confuses it with `groupingBy` on the value."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"String r = Stream.of(\"a\", \"b\", \"c\")\n    .collect(Collectors.joining(\", \", \"[\", \"]\"));\nSystem.out.println(r);","options":[{"it":"a, b, c","en":"a, b, c"},{"it":"[a, b, c]","en":"[a, b, c]"},{"it":"[a][b][c]","en":"[a][b][c]"},{"it":"[, a, b, c, ]","en":"[, a, b, c, ]"}],"correct":1,"explanation":{"it":"In sintesi: `joining(delimiter, prefix, suffix)` concatena gli elementi separandoli con il delimitatore e racchiudendo l\u0027intero risultato tra prefix e suffix; qui prefix \u0027[\u0027, elementi separati da \u0027, \u0027, suffix \u0027]\u0027, quindi \u0027[a, b, c]\u0027. Il delimitatore va solo TRA gli elementi.\nLe altre opzioni: \u0027a, b, c\u0027 e\u0027 `joining(\", \")` senza prefix/suffix; \u0027[a][b][c]\u0027 tratta prefix/suffix come se avvolgessero ogni elemento; \u0027[, a, b, c, ]\u0027 aggiunge il delimitatore anche dopo il prefix e prima del suffix.","en":"In summary: `joining(delimiter, prefix, suffix)` concatenates the elements separating them with the delimiter and wrapping the whole result between prefix and suffix; here prefix \u0027[\u0027, elements separated by \u0027, \u0027, suffix \u0027]\u0027, giving \u0027[a, b, c]\u0027. The delimiter goes only BETWEEN the elements.\nThe other options: \u0027a, b, c\u0027 is `joining(\", \")` without prefix/suffix; \u0027[a][b][c]\u0027 treats prefix/suffix as if they wrapped each element; \u0027[, a, b, c, ]\u0027 adds the delimiter after the prefix and before the suffix too."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"Stream.of(1, 2, 3)\n    .peek(n -\u003e System.out.println(\"peek \" + n))\n    .map(n -\u003e n * 2);\nSystem.out.println(\"fine\");","options":[{"it":"peek 1\npeek 2\npeek 3\nfine","en":"peek 1\npeek 2\npeek 3\nfine"},{"it":"fine","en":"fine"},{"it":"fine\npeek 1\npeek 2\npeek 3","en":"fine\npeek 1\npeek 2\npeek 3"},{"it":"Errore di compilazione","en":"Compilation error"}],"correct":1,"explanation":{"it":"In sintesi: `peek` e `map` sono operazioni INTERMEDIE e lazy: non fanno nulla finche\u0027 non viene invocata un\u0027operazione TERMINALE (`forEach`, `collect`, `count`, ...). Qui manca del tutto la terminale, quindi la pipeline non viene mai eseguita, i `peek` non stampano e l\u0027output e\u0027 solo \u0027fine\u0027.\nLe altre opzioni: \u0027peek 1\\npeek 2\\npeek 3\\nfine\u0027 e la variante che stampa i peek dopo \u0027fine\u0027 assumono un\u0027esecuzione eager che gli stream non hanno; il codice compila, la pipeline semplicemente non produce effetti.","en":"In summary: `peek` and `map` are INTERMEDIATE, lazy operations: they do nothing until a TERMINAL operation (`forEach`, `collect`, `count`, ...) is invoked. Here the terminal operation is missing entirely, so the pipeline is never executed, the `peek`s print nothing, and the output is just \u0027fine\u0027.\nThe other options: \u0027peek 1\\npeek 2\\npeek 3\\nfine\u0027 and the variant that prints the peeks after \u0027fine\u0027 both assume an eager execution that streams do not have; the code compiles, the pipeline simply produces no effects."}},{"type":"code","prompt":{"it":"Cosa succede eseguendo questo codice?","en":"What happens when this code runs?"},"code":"Stream\u003cInteger\u003e s = Stream.of(1, 2, 3);\ns.forEach(System.out::println);\ns.forEach(System.out::println);","options":[{"it":"Stampa 1 2 3 una sola volta","en":"Prints 1 2 3 once"},{"it":"Stampa 1 2 3 due volte","en":"Prints 1 2 3 twice"},{"it":"Lancia IllegalStateException al secondo forEach","en":"Throws IllegalStateException on the second forEach"},{"it":"Errore di compilazione","en":"Compilation error"}],"correct":2,"explanation":{"it":"In sintesi: uno `Stream` si consuma UNA SOLA VOLTA: dopo un\u0027operazione terminale e\u0027 considerato usato/chiuso. Il primo `forEach` stampa 1 2 3, il secondo lancia `IllegalStateException` con messaggio \u0027stream has already been operated upon or closed\u0027. Per iterare due volte occorre ricreare lo stream dalla sorgente.\nLe altre opzioni: \u0027stampa una/due volte\u0027 e\u0027 l\u0027errore concettuale piu\u0027 comune, credere che uno stream sia riutilizzabile come una `Collection`; il codice compila, l\u0027errore e\u0027 a runtime.","en":"In summary: a `Stream` can be consumed ONLY ONCE: after a terminal operation it is considered used/closed. The first `forEach` prints 1 2 3, the second throws `IllegalStateException` with the message \u0027stream has already been operated upon or closed\u0027. To iterate twice you must recreate the stream from its source.\nThe other options: \u0027prints once/twice\u0027 is the most common conceptual mistake, believing a stream is reusable like a `Collection`; the code compiles, the error occurs at runtime."}},{"type":"code","prompt":{"it":"Quale affermazione descrive correttamente il comportamento di questo codice?","en":"Which statement correctly describes the behavior of this code?"},"code":"Stream.of(1, 2, 3, 4, 5)\n    .parallel()\n    .forEach(System.out::print);","options":[{"it":"Stampa sempre 12345 nell\u0027ordine di incontro","en":"It always prints 12345 in encounter order"},{"it":"L\u0027ordine di stampa non e garantito","en":"The print order is not guaranteed"},{"it":"Lancia un\u0027eccezione perche forEach non e thread-safe","en":"It throws an exception because forEach is not thread-safe"},{"it":"Non compila su uno stream parallelo","en":"It does not compile on a parallel stream"}],"correct":1,"explanation":{"it":"In sintesi: su uno stream parallelo `forEach` NON garantisce l\u0027encounter order, perche\u0027 gli elementi sono processati da thread diversi e stampati nell\u0027ordine in cui i task completano; l\u0027output puo\u0027 essere ad esempio 34125. Per preservare l\u0027ordine si usa `forEachOrdered`, che pero\u0027 serializza in parte e riduce il vantaggio del parallelismo.\nLe altre opzioni: \u0027sempre 12345\u0027 e\u0027 l\u0027insidia classica; non lancia eccezioni qui e `forEach` e\u0027 progettato per essere non ordinato; il codice compila ed esegue.","en":"In summary: on a parallel stream `forEach` does NOT guarantee encounter order, because the elements are processed by different threads and printed in the order in which the tasks complete; the output could be, for example, 34125. To preserve order use `forEachOrdered`, which, however, partially serializes and reduces the benefit of parallelism.\nThe other options: \u0027always 12345\u0027 is the classic trap; it throws no exception here and `forEach` is designed to be unordered; the code compiles and runs."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"record Point(int x, int y) {}\n\npublic static void main(String[] args) {\n    Point a = new Point(1, 2);\n    Point b = new Point(1, 2);\n    System.out.println(a.equals(b) + \" \" + (a == b));\n}","options":[{"it":"true true","en":"true true"},{"it":"true false","en":"true false"},{"it":"false false","en":"false false"},{"it":"false true","en":"false true"}],"correct":1,"explanation":{"it":"In sintesi: un `record` genera automaticamente un `equals()` value-based che confronta TUTTI i componenti (x e y), quindi con gli stessi valori `a.equals(b)` e\u0027 true; l\u0027operatore `==` confronta i riferimenti e a e b sono due oggetti distinti, quindi `a == b` e\u0027 false, dando \u0027true false\u0027. La regola: `equals` dei record = uguaglianza strutturale, `==` = identita\u0027 del riferimento.\nLe altre opzioni: \u0027true true\u0027 confonde `equals` con `==`; \u0027false false\u0027 ignora l\u0027`equals` generato dal record; \u0027false true\u0027 inverte entrambi.","en":"In summary: a `record` automatically generates a value-based `equals()` that compares ALL components (x and y), so with the same values `a.equals(b)` is true; the `==` operator compares references and a and b are two distinct objects, so `a == b` is false, giving \u0027true false\u0027. The rule: a record\u0027s `equals` = structural equality, `==` = reference identity.\nThe other options: \u0027true true\u0027 confuses `equals` with `==`; \u0027false false\u0027 ignores the `equals` generated by the record; \u0027false true\u0027 inverts both."}},{"type":"mcq","prompt":{"it":"Quale affermazione sui record Java e CORRETTA?","en":"Which statement about Java records is CORRECT?"},"code":"","options":[{"it":"Un record puo dichiarare campi di istanza aggiuntivi oltre ai suoi componenti","en":"A record can declare additional instance fields beyond its components"},{"it":"I record sono implicitamente final e non possono estendere altre classi","en":"Records are implicitly final and cannot extend other classes"},{"it":"Un record puo estendere una classe astratta ma non implementare interfacce","en":"A record can extend an abstract class but not implement interfaces"},{"it":"I componenti di un record sono mutabili tramite i setter generati","en":"A record\u0027s components are mutable through generated setters"}],"correct":1,"explanation":{"it":"In sintesi: i record sono implicitamente `final` ed estendono implicitamente `java.lang.Record`, quindi NON possono estendere altre classi (Java non ha ereditarieta\u0027 multipla di classi): l\u0027opzione corretta e\u0027 proprio questa.\nLe altre opzioni: un record non puo\u0027 dichiarare campi di ISTANZA aggiuntivi oltre ai componenti dell\u0027header (solo campi statici); i record NON estendono classi ma POSSONO implementare interfacce; sono immutabili e generano solo accessor (es. `x()`), mai setter.","en":"In summary: records are implicitly `final` and implicitly extend `java.lang.Record`, so they CANNOT extend other classes (Java has no multiple inheritance of classes): this is exactly the correct option.\nThe other options: a record cannot declare additional INSTANCE fields beyond the components in its header (only static fields); records do NOT extend classes but CAN implement interfaces; they are immutable and generate only accessors (e.g. `x()`), never setters."}},{"type":"code","prompt":{"it":"Cosa succede eseguendo new Range(5, 2)?","en":"What happens when new Range(5, 2) runs?"},"code":"record Range(int lo, int hi) {\n    Range {\n        if (lo \u003e hi) {\n            throw new IllegalArgumentException(\"lo \u003e hi\");\n        }\n    }\n}\n\n// new Range(5, 2);","options":[{"it":"Crea un Range con lo=5, hi=2","en":"Creates a Range with lo=5, hi=2"},{"it":"Lancia IllegalArgumentException","en":"Throws IllegalArgumentException"},{"it":"Errore di compilazione: manca l\u0027assegnazione dei campi","en":"Compilation error: the field assignment is missing"},{"it":"Crea un Range con i valori scambiati lo=2, hi=5","en":"Creates a Range with the values swapped, lo=2, hi=5"}],"correct":1,"explanation":{"it":"In sintesi: quello mostrato e\u0027 un compact constructor, usato per validare o normalizzare i parametri prima dell\u0027assegnazione automatica ai campi; poiche\u0027 5 \u003e 2 la condizione e\u0027 vera e viene lanciata `IllegalArgumentException`.\nLe altre opzioni: nel compact constructor NON si scrivono le assegnazioni `this.lo = lo`, aggiunte automaticamente dal compilatore in coda, quindi ometterle e\u0027 corretto; il codice non riassegna i parametri, quindi non li scambia; e non ignora la validazione creando comunque il Range.","en":"In summary: what is shown is a compact constructor, used to validate or normalize the parameters before their automatic assignment to the fields; since 5 \u003e 2 the condition is true and `IllegalArgumentException` is thrown.\nThe other options: in a compact constructor you do NOT write the `this.lo = lo` assignments, which the compiler adds automatically at the end, so omitting them is correct; the code does not reassign the parameters, so it does not swap them; nor does it skip validation and create the Range anyway."}},{"type":"mcq","prompt":{"it":"In una sealed class con clausola permits, quale vincolo devono rispettare le sottoclassi dirette permesse?","en":"In a sealed class with a permits clause, what constraint must the permitted direct subclasses satisfy?"},"code":"","options":[{"it":"Devono essere tutte final, altrimenti il codice non compila","en":"They must all be final, otherwise the code does not compile"},{"it":"Devono essere dichiarate final, sealed oppure non-sealed","en":"They must be declared final, sealed, or non-sealed"},{"it":"Possono essere qualsiasi classe, senza vincoli aggiuntivi","en":"They can be any class, with no additional constraints"},{"it":"Devono trovarsi obbligatoriamente in un package diverso","en":"They must necessarily be in a different package"}],"correct":1,"explanation":{"it":"In sintesi: ogni sottoclasse diretta elencata in `permits` deve dichiarare esplicitamente il proprio grado di apertura: `final` (chiude la gerarchia), `sealed` (continua a controllare i propri sottotipi con un altro `permits`) oppure `non-sealed` (riapre l\u0027ereditarieta\u0027); cosi\u0027 la gerarchia resta nota e controllata, abilitando il pattern matching esaustivo.\nLe altre opzioni: imporre solo `final` e\u0027 troppo restrittivo, e\u0027 una delle tre scelte; \u0027qualsiasi classe senza vincoli\u0027 nega il senso di `sealed`; le sottoclassi devono stare nello stesso modulo (o package se il modulo e\u0027 unnamed), non in uno diverso.","en":"In summary: each direct subclass listed in `permits` must explicitly declare its degree of openness: `final` (closes the hierarchy), `sealed` (continues to control its own subtypes with another `permits`), or `non-sealed` (reopens inheritance); this keeps the hierarchy known and controlled, enabling exhaustive pattern matching.\nThe other options: requiring only `final` is too restrictive, it is just one of the three choices; \u0027any class with no constraints\u0027 negates the purpose of `sealed`; the subclasses must be in the same module (or package if the module is unnamed), not in a different one."}},{"type":"truefalse","prompt":{"it":"Una sealed interface puo essere implementata o estesa soltanto dai tipi elencati nella sua clausola permits.","en":"A sealed interface can be implemented or extended only by the types listed in its permits clause."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vera. Il meccanismo `sealed` vale sia per le classi sia per le interfacce: una sealed interface limita i tipi che possono implementarla o estenderla a quelli dichiarati in `permits` (o dedotti se nello stesso file sorgente), cosi\u0027 il compilatore conosce l\u0027intera gerarchia e abilita ad esempio `switch` esaustivi senza ramo `default`.\nLe altre opzioni: \u0027Falso\u0027 e\u0027 l\u0027errore di chi trascura che `sealed` si applichi anche alle interfacce; e\u0027 proprio questa chiusura controllata a distinguerla da una normale interfaccia, che chiunque puo\u0027 implementare.","en":"In summary: it is true. The `sealed` mechanism applies to both classes and interfaces: a sealed interface restricts the types that can implement or extend it to those declared in `permits` (or inferred if in the same source file), so the compiler knows the entire hierarchy and enables, for example, exhaustive `switch`es with no `default` branch.\nThe other options: \u0027False\u0027 is the mistake of those who overlook that `sealed` also applies to interfaces; it is precisely this controlled closure that distinguishes it from a normal interface, which anyone can implement."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"int day = 3;\nString type = switch (day) {\n    case 1, 2, 3, 4, 5 -\u003e \"weekday\";\n    case 6, 7 -\u003e \"weekend\";\n    default -\u003e \"unknown\";\n};\nSystem.out.println(type);","options":[{"it":"weekday","en":"weekday"},{"it":"weekend","en":"weekend"},{"it":"unknown","en":"unknown"},{"it":"weekdayweekend","en":"weekdayweekend"}],"correct":0,"explanation":{"it":"In sintesi: nella switch expression con sintassi a freccia `-\u003e`, day vale 3 e rientra nell\u0027etichetta `case 1, 2, 3, 4, 5`, quindi type diventa \u0027weekday\u0027; la freccia NON ha fall-through, esegue solo il ramo corrispondente e non serve `break`, e ogni `case` puo\u0027 elencare piu\u0027 costanti separate da virgola.\nLe altre opzioni: \u0027weekdayweekend\u0027 simula un fall-through che con `-\u003e` non esiste (ci sarebbe solo con la vecchia sintassi `case:` senza break); \u0027weekend\u0027 e \u0027unknown\u0027 non corrispondono al valore 3.","en":"In summary: in the switch expression with arrow syntax `-\u003e`, day is 3 and falls under the label `case 1, 2, 3, 4, 5`, so type becomes \u0027weekday\u0027; the arrow has NO fall-through, it executes only the matching branch and needs no `break`, and each `case` can list several comma-separated constants.\nThe other options: \u0027weekdayweekend\u0027 simulates a fall-through that does not exist with `-\u003e` (it would only occur with the old `case:` syntax without break); \u0027weekend\u0027 and \u0027unknown\u0027 do not match the value 3."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"int n = 2;\nint r = switch (n) {\n    case 1 -\u003e 10;\n    case 2 -\u003e {\n        int x = 5;\n        yield x * 4;\n    }\n    default -\u003e 0;\n};\nSystem.out.println(r);","options":[{"it":"2","en":"2"},{"it":"10","en":"10"},{"it":"20","en":"20"},{"it":"0","en":"0"}],"correct":2,"explanation":{"it":"In sintesi: quando un ramo di una switch expression a freccia contiene un blocco `{ }`, il valore va restituito con `yield` (non con `return`); per n=2 si entra nel blocco, x=5 e `yield x * 4` produce 20, quindi r=20. `yield` serve solo nei rami a blocco; nei rami a espressione singola (`case 1 -\u003e 10`) il valore e\u0027 implicito.\nLe altre opzioni: 10 e\u0027 il `case 1`, non selezionato; 0 e\u0027 il `default`, non raggiunto; 2 confonde il valore di n con il risultato.","en":"In summary: when a branch of an arrow switch expression contains a block `{ }`, the value must be returned with `yield` (not with `return`); for n=2 it enters the block, x=5 and `yield x * 4` produces 20, so r=20. `yield` is needed only in block branches; in single-expression branches (`case 1 -\u003e 10`) the value is implicit.\nThe other options: 10 is `case 1`, not selected; 0 is the `default`, not reached; 2 confuses the value of n with the result."}},{"type":"mcq","prompt":{"it":"Quale di questi usi di var e ILLEGALE e provoca un errore di compilazione?","en":"Which of these uses of var is ILLEGAL and causes a compilation error?"},"code":"","options":[{"it":"var i = 0; come variabile locale in un metodo","en":"var i = 0; as a local variable in a method"},{"it":"for (var s : list) { ... } in un for-each","en":"for (var s : list) { ... } in a for-each"},{"it":"private var count = 0; come campo di istanza di una classe","en":"private var count = 0; as an instance field of a class"},{"it":"var list = new ArrayList\u003cString\u003e();","en":"var list = new ArrayList\u003cString\u003e();"}],"correct":2,"explanation":{"it":"In sintesi: `var` (local variable type inference, Java 10) e\u0027 consentito SOLO per variabili locali con inizializzatore, incluse le variabili di ciclo for/for-each; NON e\u0027 ammesso per campi di istanza o di classe, quindi `private var count = 0;` non compila. `var` non introduce tipizzazione dinamica: il tipo resta statico, solo inferito.\nLe altre opzioni: `var i = 0;`, il for-each `for (var s : list)` e `var list = new ArrayList\u003cString\u003e();` sono usi locali validi, con tipo inferito rispettivamente a int, al tipo degli elementi e ad `ArrayList\u003cString\u003e`.","en":"In summary: `var` (local variable type inference, Java 10) is allowed ONLY for local variables with an initializer, including for/for-each loop variables; it is NOT permitted for instance or class fields, so `private var count = 0;` does not compile. `var` does not introduce dynamic typing: the type stays static, it is merely inferred.\nThe other options: `var i = 0;`, the for-each `for (var s : list)` and `var list = new ArrayList\u003cString\u003e();` are valid local uses, with the type inferred as int, the element type, and `ArrayList\u003cString\u003e` respectively."}},{"type":"code","prompt":{"it":"Cosa succede compilando questo codice?","en":"What happens when this code is compiled?"},"code":"var x = null;\nSystem.out.println(x);","options":[{"it":"Compila e stampa null","en":"Compiles and prints null"},{"it":"Errore di compilazione: impossibile inferire il tipo","en":"Compilation error: cannot infer the type"},{"it":"Compila e x ha tipo Object","en":"Compiles and x has type Object"},{"it":"Errore di compilazione: var richiede un tipo esplicito","en":"Compilation error: var requires an explicit type"}],"correct":1,"explanation":{"it":"In sintesi: con `var` il tipo si inferisce dall\u0027inizializzatore, ma `null` da solo non ha un tipo determinabile, quindi il compilatore fallisce con \u0027cannot infer type for local variable x\u0027. `var` richiede un inizializzatore da cui inferire un tipo concreto.\nLe altre opzioni: \u0027compila e stampa null\u0027 e\u0027 escluso perche\u0027 il codice non compila; `var` NON assume `Object` di default, rifiuta l\u0027inferenza; e non richiede un \u0027tipo esplicito\u0027, richiede un inizializzatore tipizzabile (`Object x = null;` sarebbe valido, ma li\u0027 `var` non servirebbe).","en":"In summary: with `var` the type is inferred from the initializer, but `null` alone has no determinable type, so the compiler fails with \u0027cannot infer type for local variable x\u0027. `var` requires an initializer from which to infer a concrete type.\nThe other options: \u0027compiles and prints null\u0027 is ruled out because the code does not compile; `var` does NOT default to `Object`, it rejects the inference; and it does not require an \u0027explicit type\u0027, it requires a typeable initializer (`Object x = null;` would be valid, but there `var` would be pointless)."}},{"type":"mcq","prompt":{"it":"Riguardo ai text block (\"\"\" ... \"\"\"), quale affermazione e CORRETTA?","en":"Regarding text blocks (\"\"\" ... \"\"\"), which statement is CORRECT?"},"code":"","options":[{"it":"Il compilatore rimuove l\u0027incidental whitespace (indentazione comune) determinato dalla posizione delle righe e del delimitatore di chiusura","en":"The compiler removes the incidental whitespace (common indentation) determined by the position of the lines and of the closing delimiter"},{"it":"Il testo viene preso letteralmente carattere per carattere, inclusa tutta l\u0027indentazione del codice sorgente","en":"The text is taken literally character by character, including all the indentation of the source code"},{"it":"I text block introducono un nuovo tipo diverso da String","en":"Text blocks introduce a new type distinct from String"},{"it":"I text block non permettono sequenze di escape come \\n o \\t","en":"Text blocks do not allow escape sequences such as \\n or \\t"}],"correct":0,"explanation":{"it":"In sintesi: i text block (definitivi in Java 15) applicano un algoritmo di re-indentazione che rimuove l\u0027incidental whitespace: si calcola l\u0027indentazione minima comune tra le righe non vuote e la posizione del delimitatore di chiusura `\"\"\"`, e quella quantita\u0027 viene tolta da ogni riga, preservando solo l\u0027indentazione essenziale.\nLe altre opzioni: l\u0027indentazione del sorgente NON e\u0027 presa letteralmente carattere per carattere; un text block e\u0027 a tutti gli effetti una `String`, non un nuovo tipo; le escape classiche (`\\n`, `\\t`) e le nuove `\\s` e `\\` (line continuation) sono supportate.","en":"In summary: text blocks (finalized in Java 15) apply a re-indentation algorithm that removes the incidental whitespace: the minimum common indentation among the non-blank lines and the position of the closing delimiter `\"\"\"` is computed, and that amount is stripped from every line, preserving only the essential indentation.\nThe other options: the source indentation is NOT taken literally character by character; a text block is in every respect a `String`, not a new type; the classic escapes (`\\n`, `\\t`) and the new `\\s` and `\\` (line continuation) are supported."}},{"type":"code","prompt":{"it":"Cosa stampa questo programma?","en":"What does this program print?"},"code":"String s = \"\"\"\n        Hello\n        World\"\"\";\nSystem.out.println(s.lines().count());\nSystem.out.println(s.startsWith(\" \"));","options":[{"it":"3\ntrue","en":"3\ntrue"},{"it":"2\nfalse","en":"2\nfalse"},{"it":"2\ntrue","en":"2\ntrue"},{"it":"3\nfalse","en":"3\nfalse"}],"correct":1,"explanation":{"it":"In sintesi: il delimitatore di chiusura `\"\"\"` e\u0027 sulla stessa riga di \u0027World\u0027, quindi il text block NON ha newline finale e il contenuto e\u0027 esattamente \u0027Hello\\nWorld\u0027: `lines().count()` vale 2; l\u0027indentazione comune di 8 spazi viene rimossa come incidental whitespace, quindi s inizia con \u0027H\u0027 e `startsWith(\" \")` e\u0027 false. Output \u00272\u0027 e \u0027false\u0027.\nLe altre opzioni: \u00273\\ntrue\u0027 assume newline finale e indentazione residua; \u00272\\ntrue\u0027 sbaglia sull\u0027indentazione; \u00273\\nfalse\u0027 sbaglia sul conteggio righe.","en":"In summary: the closing delimiter `\"\"\"` is on the same line as \u0027World\u0027, so the text block has NO trailing newline and the content is exactly \u0027Hello\\nWorld\u0027: `lines().count()` is 2; the common indentation of 8 spaces is removed as incidental whitespace, so s starts with \u0027H\u0027 and `startsWith(\" \")` is false. Output \u00272\u0027 and \u0027false\u0027.\nThe other options: \u00273\\ntrue\u0027 assumes a trailing newline and residual indentation; \u00272\\ntrue\u0027 is wrong about the indentation; \u00273\\nfalse\u0027 is wrong about the line count."}},{"type":"mcq","prompt":{"it":"Una classe implementa due interfacce che dichiarano entrambe un metodo default con la stessa firma. Cosa deve fare la classe per compilare?","en":"A class implements two interfaces that both declare a default method with the same signature. What must the class do to compile?"},"code":"","options":[{"it":"Nulla: il compilatore sceglie automaticamente il primo default dichiarato","en":"Nothing: the compiler automatically picks the first default declared"},{"it":"Deve fare l\u0027override del metodo per risolvere l\u0027ambiguita (potendo richiamare Interfaccia.super.metodo())","en":"It must override the method to resolve the ambiguity (and may call Interface.super.method())"},{"it":"Non compila mai: due interfacce non possono avere default con la stessa firma","en":"It never compiles: two interfaces cannot have defaults with the same signature"},{"it":"Eredita entrambi i metodi e li esegue in sequenza","en":"It inherits both methods and runs them in sequence"}],"correct":1,"explanation":{"it":"In sintesi: quando due interfacce forniscono un metodo default con la stessa firma nasce un conflitto (una forma del diamond problem) che il compilatore NON risolve da solo: la classe che le implementa e\u0027 OBBLIGATA a fare l\u0027override, e dentro l\u0027override puo\u0027 delegare a una implementazione specifica con `NomeInterfaccia.super.metodo()`.\nLe altre opzioni: non c\u0027e\u0027 scelta implicita del primo default; le due interfacce possono coesistere e l\u0027errore emerge solo nella classe che le combina senza override; ereditare entrambi ed eseguirli in sequenza e\u0027 concettualmente impossibile in Java.","en":"In summary: when two interfaces provide a default method with the same signature, a conflict arises (a form of the diamond problem) that the compiler does NOT resolve on its own: the implementing class is REQUIRED to override it, and inside the override it can delegate to a specific implementation with `InterfaceName.super.method()`.\nThe other options: there is no implicit choice of the first default; the two interfaces can coexist and the error emerges only in the class that combines them without an override; inheriting both and running them in sequence is conceptually impossible in Java."}},{"type":"code","prompt":{"it":"Quale riga fa compilare correttamente il main? (Impl NON dichiara square)","en":"Which line makes the main compile correctly? (Impl does NOT declare square)"},"code":"interface Calc {\n    static int square(int x) { return x * x; }\n}\nclass Impl implements Calc {}\n\n// Nel main, quale invocazione e valida?","options":[{"it":"new Impl().square(5)","en":"new Impl().square(5)"},{"it":"Impl.square(5)","en":"Impl.square(5)"},{"it":"Calc.square(5)","en":"Calc.square(5)"},{"it":"((Calc) new Impl()).square(5)","en":"((Calc) new Impl()).square(5)"}],"correct":2,"explanation":{"it":"In sintesi: i metodi `static` di un\u0027interfaccia NON vengono ereditati dalle classi che la implementano ne\u0027 dalle sotto-interfacce, e sono accessibili solo tramite il nome dell\u0027interfaccia, quindi solo `Calc.square(5)` compila. E\u0027 una differenza netta rispetto ai metodi default, ereditati dalle istanze.\nLe altre opzioni: `new Impl().square(5)` e\u0027 invalida perche\u0027 un metodo statico d\u0027interfaccia non e\u0027 visibile sull\u0027istanza; `Impl.square(5)` perche\u0027 `Impl` non eredita i metodi statici di `Calc`; il cast `((Calc) new Impl()).square(5)` perche\u0027 un metodo statico non si invoca su un riferimento di istanza.","en":"In summary: `static` methods of an interface are NOT inherited by the classes that implement it nor by sub-interfaces, and are accessible only through the interface name, so only `Calc.square(5)` compiles. This is a clear difference from default methods, which are inherited by instances.\nThe other options: `new Impl().square(5)` is invalid because a static interface method is not visible on the instance; `Impl.square(5)` because `Impl` does not inherit `Calc`\u0027s static methods; the cast `((Calc) new Impl()).square(5)` because a static method is not invoked on an instance reference."}},{"type":"mcq","prompt":{"it":"Quale differenza tra Iterable.forEach(...) e un classico ciclo for e CORRETTA?","en":"Which difference between Iterable.forEach(...) and a classic for loop is CORRECT?"},"code":"","options":[{"it":"Nel forEach non si possono usare break/continue e le variabili locali catturate dalla lambda devono essere effectively final","en":"In forEach you cannot use break/continue, and local variables captured by the lambda must be effectively final"},{"it":"Il forEach e sempre piu veloce del ciclo for tradizionale","en":"forEach is always faster than the traditional for loop"},{"it":"Il ciclo for non puo iterare su una List, solo su array","en":"The for loop cannot iterate over a List, only over arrays"},{"it":"Nel forEach si puo modificare la collezione durante l\u0027iterazione senza rischi","en":"In forEach you can modify the collection during iteration without any risk"}],"correct":0,"explanation":{"it":"In sintesi: `forEach` riceve una lambda (un `Consumer`), quindi al suo interno non esistono `break`/`continue` del linguaggio (al massimo un `return` simula il continue terminando la sola iterazione corrente) e ogni variabile locale esterna usata nella lambda deve essere effectively final; un ciclo `for` non ha questi vincoli e consente controllo di flusso completo.\nLe altre opzioni: `forEach` non e\u0027 sempre piu\u0027 veloce, le prestazioni sono comparabili; il for-each itera qualsiasi `Iterable`, non solo array; modificare la collezione durante `forEach` causa tipicamente `ConcurrentModificationException`.","en":"In summary: `forEach` takes a lambda (a `Consumer`), so inside it there are no language-level `break`/`continue` (at most a `return` simulates continue by ending only the current iteration), and every external local variable used in the lambda must be effectively final; a `for` loop has none of these constraints and allows full flow control.\nThe other options: `forEach` is not always faster, performance is comparable; the for-each iterates any `Iterable`, not just arrays; modifying the collection during `forEach` typically causes `ConcurrentModificationException`."}},{"type":"mcq","prompt":{"it":"Quale interfaccia funzionale ha un metodo astratto che NON accetta argomenti e RESTITUISCE un valore?","en":"Which functional interface has an abstract method that takes NO arguments and RETURNS a value?"},"code":"","options":[{"it":"Consumer\u003cT\u003e con void accept(T t)","en":"Consumer\u003cT\u003e with void accept(T t)"},{"it":"Supplier\u003cT\u003e con T get()","en":"Supplier\u003cT\u003e with T get()"},{"it":"Function\u003cT, R\u003e con R apply(T t)","en":"Function\u003cT, R\u003e with R apply(T t)"},{"it":"Predicate\u003cT\u003e con boolean test(T t)","en":"Predicate\u003cT\u003e with boolean test(T t)"}],"correct":1,"explanation":{"it":"In sintesi: `Supplier\u003cT\u003e` rappresenta un fornitore di valori: il suo metodo `T get()` non prende argomenti e produce un risultato di tipo T (usato ad esempio in `orElseGet`). Riepilogo: Supplier = 0 input/1 output, Consumer = 1 input/0 output, Function = 1 input/1 output, Predicate = 1 input/boolean.\nLe altre opzioni: `Consumer\u003cT\u003e` con `void accept(T)` e\u0027 l\u0027opposto, prende un input e non ritorna nulla; `Function\u003cT, R\u003e` prende un argomento e ritorna un valore; `Predicate\u003cT\u003e` prende un argomento e ritorna un boolean.","en":"In summary: `Supplier\u003cT\u003e` represents a provider of values: its method `T get()` takes no arguments and produces a result of type T (used, for example, in `orElseGet`). Recap: Supplier = 0 input/1 output, Consumer = 1 input/0 output, Function = 1 input/1 output, Predicate = 1 input/boolean.\nThe other options: `Consumer\u003cT\u003e` with `void accept(T)` is the opposite, it takes an input and returns nothing; `Function\u003cT, R\u003e` takes an argument and returns a value; `Predicate\u003cT\u003e` takes an argument and returns a boolean."}},{"type":"code","prompt":{"it":"Perche questo codice parallelo e SBAGLIATO e puo produrre risultati errati?","en":"Why is this parallel code WRONG and can it produce incorrect results?"},"code":"List\u003cInteger\u003e result = new ArrayList\u003c\u003e();\nIntStream.range(0, 1000)\n    .parallel()\n    .forEach(result::add);\nSystem.out.println(result.size());","options":[{"it":"E corretto: stampa sempre 1000","en":"It is correct: it always prints 1000"},{"it":"ArrayList non e thread-safe: piu thread la modificano concorrentemente, con perdita di elementi, size \u003c 1000 o ArrayIndexOutOfBoundsException","en":"ArrayList is not thread-safe: multiple threads modify it concurrently, causing lost elements, size \u003c 1000, or ArrayIndexOutOfBoundsException"},{"it":"Non compila perche forEach non accetta method reference","en":"It does not compile because forEach does not accept a method reference"},{"it":"Stampa 0 perche lo stream parallelo non esegue forEach","en":"It prints 0 because the parallel stream does not run forEach"}],"correct":1,"explanation":{"it":"In sintesi: `ArrayList` non e\u0027 thread-safe; in uno stream parallelo piu\u0027 thread invocano `result.add()` contemporaneamente senza sincronizzazione, generando una race condition con elementi persi, size finale minore di 1000, o eccezioni come `ArrayIndexOutOfBoundsException`/`NullPointerException` durante la crescita interna dell\u0027array. La soluzione corretta e\u0027 `.collect(Collectors.toList())` o `toArray`, che gestiscono il merge in modo sicuro senza shared mutable state.\nLe altre opzioni: \u0027e\u0027 corretto, stampa sempre 1000\u0027 e\u0027 l\u0027errore classico di chi lo giudica funzionante perche\u0027 a volte da\u0027 1000; il codice compila ed esegue realmente `forEach`, non stampa 0.","en":"In summary: `ArrayList` is not thread-safe; in a parallel stream multiple threads call `result.add()` simultaneously without synchronization, creating a race condition with lost elements, a final size less than 1000, or exceptions such as `ArrayIndexOutOfBoundsException`/`NullPointerException` during the array\u0027s internal growth. The correct solution is `.collect(Collectors.toList())` or `toArray`, which handle the merge safely without shared mutable state.\nThe other options: \u0027it is correct, it always prints 1000\u0027 is the classic mistake of judging it functional because it sometimes gives 1000; the code compiles and actually runs `forEach`, it does not print 0."}},{"type":"code","prompt":{"it":"Quale Map produce questo codice?","en":"Which Map does this code produce?"},"code":"Map\u003cInteger, Long\u003e m = Stream.of(\"a\", \"bb\", \"cc\", \"ddd\", \"ee\")\n    .collect(Collectors.groupingBy(\n        String::length,\n        Collectors.counting()));\nSystem.out.println(m);","options":[{"it":"{1=[a], 2=[bb, cc, ee], 3=[ddd]}","en":"{1=[a], 2=[bb, cc, ee], 3=[ddd]}"},{"it":"{1=1, 2=3, 3=1}","en":"{1=1, 2=3, 3=1}"},{"it":"{1=1, 2=2, 3=1}","en":"{1=1, 2=2, 3=1}"},{"it":"{a=1, bb=2, cc=2, ddd=3, ee=2}","en":"{a=1, bb=2, cc=2, ddd=3, ee=2}"}],"correct":1,"explanation":{"it":"In sintesi: `groupingBy` con un secondo argomento (downstream collector) applica quel collector a ciascun gruppo invece della `List` di default; qui `Collectors.counting()` conta gli elementi per gruppo: lunghezza 1 -\u003e \u0027a\u0027 (1), lunghezza 2 -\u003e \u0027bb\u0027,\u0027cc\u0027,\u0027ee\u0027 (3), lunghezza 3 -\u003e \u0027ddd\u0027 (1), dando {1=1, 2=3, 3=1}. `counting()` restituisce `Long`, coerente con `Map\u003cInteger, Long\u003e`.\nLe altre opzioni: {1=[a], 2=[bb, cc, ee], 3=[ddd]} e\u0027 il risultato senza downstream (le List); {1=1, 2=2, 3=1} conta solo 2 elementi per la lunghezza 2 dimenticando \u0027ee\u0027; l\u0027ultima confonde le chiavi.","en":"In summary: `groupingBy` with a second argument (downstream collector) applies that collector to each group instead of the default `List`; here `Collectors.counting()` counts the elements per group: length 1 -\u003e \u0027a\u0027 (1), length 2 -\u003e \u0027bb\u0027,\u0027cc\u0027,\u0027ee\u0027 (3), length 3 -\u003e \u0027ddd\u0027 (1), giving {1=1, 2=3, 3=1}. `counting()` returns `Long`, consistent with `Map\u003cInteger, Long\u003e`.\nThe other options: {1=[a], 2=[bb, cc, ee], 3=[ddd]} is the result without a downstream (the Lists); {1=1, 2=2, 3=1} counts only 2 elements for length 2, forgetting \u0027ee\u0027; the last one confuses the keys."}}]},{"id":"spring","title":"Spring \u0026 Spring Boot","questions":[{"type":"mcq","prompt":{"it":"Cos\u0027e l\u0027Inversion of Control (IoC) su cui si basa Spring?","en":"What is the Inversion of Control (IoC) that Spring is based on?"},"code":"","options":[{"it":"Il container crea e gestisce il ciclo di vita degli oggetti e ne inietta le dipendenze, invece che l\u0027oggetto crearle da se con new","en":"The container creates and manages the lifecycle of objects and injects their dependencies, instead of the object creating them itself with new"},{"it":"Il pattern con cui un bean invoca direttamente il costruttore delle proprie dipendenze usando new","en":"The pattern by which a bean directly invokes the constructor of its own dependencies using new"},{"it":"Un meccanismo che inverte l\u0027ordine di esecuzione dei metodi all\u0027interno di una classe","en":"A mechanism that inverts the execution order of methods within a class"},{"it":"La capacita di Spring di invertire la gerarchia di ereditarieta tra classi e interfacce","en":"Spring\u0027s ability to invert the inheritance hierarchy between classes and interfaces"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027Inversion of Control significa che il controllo sulla creazione e sull\u0027assemblaggio degli oggetti passa dal codice applicativo al container Spring: non e piu l\u0027oggetto a costruirsi da solo le dipendenze con `new`, ma e il container a istanziare i bean, gestirne il ciclo di vita e iniettarne le dipendenze. La Dependency Injection ne e l\u0027implementazione concreta principale.\nLe altre opzioni: l\u0027opzione con `new` descrive l\u0027esatto opposto dell\u0027IoC (l\u0027oggetto si procura da se le dipendenze); le altre due confondono l\u0027IoC con l\u0027ordine di esecuzione dei metodi o con l\u0027ereditarieta, che non c\u0027entrano nulla con chi controlla creazione e wiring.","en":"In summary: Inversion of Control means that control over the creation and assembly of objects passes from the application code to the Spring container: it is no longer the object that builds its own dependencies with `new`, but the container that instantiates the beans, manages their lifecycle and injects their dependencies. Dependency Injection is its main concrete implementation.\nThe other options: the option with `new` describes the exact opposite of IoC (the object obtains its own dependencies); the other two confuse IoC with method execution order or with inheritance, which have nothing to do with who controls creation and wiring."}},{"type":"mcq","prompt":{"it":"Qual e lo scope di default di un bean in Spring e cosa comporta?","en":"What is the default scope of a bean in Spring and what does it entail?"},"code":"","options":[{"it":"singleton: una sola istanza per definizione di bean nel container Spring, condivisa tra tutti gli utilizzatori","en":"singleton: a single instance per bean definition in the Spring container, shared among all consumers"},{"it":"singleton: una sola istanza per l\u0027intera JVM, come il pattern Singleton classico della GoF","en":"singleton: a single instance for the entire JVM, like the classic GoF Singleton pattern"},{"it":"prototype: una nuova istanza viene creata a ogni iniezione o richiesta","en":"prototype: a new instance is created on every injection or request"},{"it":"request: una istanza per ogni richiesta HTTP","en":"request: one instance per HTTP request"}],"correct":0,"explanation":{"it":"In sintesi: lo scope di default e `singleton`, cioe Spring crea una sola istanza per ogni definizione di bean all\u0027interno di quel container e la riusa ovunque venga iniettata. Attenzione a non confonderlo con il Singleton della GoF: qui l\u0027unicita e per-container, non per-JVM, quindi con piu container avrei piu istanze dello stesso bean.\nLe altre opzioni: la seconda descrive il Singleton classico (una per JVM), imprecisa; `prototype` crea una nuova istanza a ogni richiesta e `request` la lega alla richiesta HTTP, ma sono scope diversi, non quello di default.","en":"In summary: the default scope is `singleton`, meaning Spring creates a single instance per bean definition within that container and reuses it wherever it is injected. Be careful not to confuse it with the GoF Singleton: here uniqueness is per-container, not per-JVM, so with multiple containers you would have multiple instances of the same bean.\nThe other options: the second describes the classic Singleton (one per JVM), which is inaccurate; `prototype` creates a new instance on every request and `request` ties it to the HTTP request, but these are different scopes, not the default one."}},{"type":"truefalse","prompt":{"it":"Con scope prototype Spring gestisce la fase di distruzione del bean chiamandone i metodi @PreDestroy.","en":"With prototype scope, Spring manages the bean\u0027s destruction phase by calling its @PreDestroy methods."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027affermazione e falsa. Per i bean `prototype` Spring gestisce creazione, injection delle dipendenze e inizializzazione, incluso `@PostConstruct`, ma non traccia il ciclo di vita completo: non invoca i metodi di distruzione come `@PreDestroy` o `destroy()`. Il rilascio delle risorse resta a carico del codice client che ha ottenuto l\u0027istanza.\nLe altre opzioni: dire Vero e l\u0027errore tipico, cioe assumere che il container gestisca la distruzione come fa per i `singleton`; per i prototype il container \"dimentica\" l\u0027istanza dopo averla consegnata.","en":"In summary: the statement is false. For `prototype` beans Spring manages creation, dependency injection and initialization, including `@PostConstruct`, but it does not track the full lifecycle: it does not invoke destruction methods such as `@PreDestroy` or `destroy()`. Releasing the resources is left to the client code that obtained the instance.\nThe other options: saying True is the typical mistake, that is, assuming the container manages destruction as it does for `singleton` beans; for prototypes the container \"forgets\" the instance once it has handed it over."}},{"type":"mcq","prompt":{"it":"Oltre a marcare un bean come componente, cosa aggiunge specificamente @Repository rispetto a un generico @Component?","en":"Beyond marking a bean as a component, what does @Repository specifically add compared to a generic @Component?"},"code":"","options":[{"it":"Abilita la traduzione automatica delle eccezioni di persistenza (specifiche del provider JPA/JDBC) nella gerarchia DataAccessException di Spring","en":"It enables automatic translation of persistence exceptions (specific to the JPA/JDBC provider) into Spring\u0027s DataAccessException hierarchy"},{"it":"Rende automaticamente transazionali tutti i metodi del bean","en":"It automatically makes all of the bean\u0027s methods transactional"},{"it":"Genera automaticamente le query CRUD per l\u0027entita associata","en":"It automatically generates the CRUD queries for the associated entity"},{"it":"Registra il bean con scope prototype invece che singleton","en":"It registers the bean with prototype scope instead of singleton"}],"correct":0,"explanation":{"it":"In sintesi: `@Repository` e uno stereotipo specializzato che, oltre a rendere la classe candidata al component scanning, abilita l\u0027exception translation: tramite il `PersistenceExceptionTranslationPostProcessor` le eccezioni proprietarie del provider JPA/JDBC vengono tradotte nella gerarchia unificata `DataAccessException` di Spring, disaccoppiando il codice dalla tecnologia di persistenza.\nLe altre opzioni: non rende i metodi transazionali (serve `@Transactional`); non genera query CRUD (quello e Spring Data, non l\u0027annotazione in se); e non cambia lo scope, che resta `singleton`.","en":"In summary: `@Repository` is a specialized stereotype that, besides making the class a candidate for component scanning, enables exception translation: through the `PersistenceExceptionTranslationPostProcessor`, the JPA/JDBC provider\u0027s proprietary exceptions are translated into Spring\u0027s unified `DataAccessException` hierarchy, decoupling the code from the persistence technology.\nThe other options: it does not make methods transactional (that requires `@Transactional`); it does not generate CRUD queries (that is Spring Data, not the annotation itself); and it does not change the scope, which remains `singleton`."}},{"type":"mcq","prompt":{"it":"Perche la constructor injection e generalmente preferita alla field injection?","en":"Why is constructor injection generally preferred over field injection?"},"code":"","options":[{"it":"Permette campi final e immutabilita, rende esplicite e obbligatorie le dipendenze e consente di istanziare la classe nei test senza il container","en":"It allows final fields and immutability, makes dependencies explicit and mandatory, and lets you instantiate the class in tests without the container"},{"it":"E piu veloce a runtime perche evita completamente l\u0027uso della reflection","en":"It is faster at runtime because it completely avoids the use of reflection"},{"it":"Consente le dipendenze circolari che la field injection invece vieta","en":"It allows the circular dependencies that field injection instead forbids"},{"it":"E l\u0027unico meccanismo di iniezione realmente supportato da Spring","en":"It is the only injection mechanism actually supported by Spring"}],"correct":0,"explanation":{"it":"In sintesi: la constructor injection e preferita perche permette campi `final` e quindi l\u0027immutabilita, rende esplicite e obbligatorie tutte le dipendenze gia in firma del costruttore, e consente di istanziare la classe nei test passando i mock direttamente al costruttore senza avviare il container.\nLe altre opzioni: non e piu veloce perche anche il costruttore usa reflection; e rovesciata l\u0027idea sulle dipendenze circolari (e la field injection a nasconderle, la constructor injection le fa fallire subito all\u0027avvio); e non e l\u0027unico meccanismo, dato che field e setter injection sono comunque supportate.","en":"In summary: constructor injection is preferred because it allows `final` fields and therefore immutability, makes all dependencies explicit and mandatory right in the constructor signature, and lets you instantiate the class in tests by passing the mocks directly to the constructor without starting the container.\nThe other options: it is not faster, because the constructor also uses reflection; the idea about circular dependencies is reversed (it is field injection that hides them, while constructor injection makes them fail immediately at startup); and it is not the only mechanism, since field and setter injection are supported as well."}},{"type":"code","prompt":{"it":"Considerando questo bean, quale affermazione e corretta?","en":"Considering this bean, which statement is correct?"},"code":"@Service\npublic class PaymentService {\n\n    private final AccountRepository repo;\n\n    public PaymentService(AccountRepository repo) {\n        this.repo = repo;\n    }\n}","options":[{"it":"Con un solo costruttore, da Spring 4.3 l\u0027annotazione @Autowired e opzionale: Spring usa quel costruttore automaticamente per l\u0027iniezione","en":"With a single constructor, since Spring 4.3 the @Autowired annotation is optional: Spring uses that constructor automatically for injection"},{"it":"Il bean non verra creato perche manca @Autowired sul costruttore","en":"The bean will not be created because @Autowired is missing on the constructor"},{"it":"E necessario anche un costruttore no-args, altrimenti Spring lancia un\u0027eccezione all\u0027avvio","en":"A no-args constructor is also required, otherwise Spring throws an exception at startup"},{"it":"Il campo repo restera null perche i campi final non possono essere iniettati via costruttore","en":"The repo field will remain null because final fields cannot be injected via the constructor"}],"correct":0,"explanation":{"it":"In sintesi: da Spring 4.3, se la classe ha un solo costruttore, `@Autowired` e opzionale: il container seleziona automaticamente quel costruttore e ne risolve i parametri. Quindi il bean viene creato correttamente e `repo` viene iniettato.\nLe altre opzioni: non serve `@Autowired` per farlo funzionare; non occorre un costruttore no-args, che anzi impedirebbe l\u0027immutabilita; e i campi `final` sono il caso ideale della constructor injection, valorizzati una sola volta nel costruttore, quindi non restano null.","en":"In summary: since Spring 4.3, if the class has a single constructor, `@Autowired` is optional: the container automatically selects that constructor and resolves its parameters. So the bean is created correctly and `repo` is injected.\nThe other options: `@Autowired` is not needed to make it work; a no-args constructor is not required, and would in fact prevent immutability; and `final` fields are the ideal case for constructor injection, set exactly once in the constructor, so they do not remain null."}},{"type":"code","prompt":{"it":"Quante istanze di B esistono nel container e perche?","en":"How many instances of B exist in the container and why?"},"code":"@Configuration\npublic class AppConfig {\n\n    @Bean\n    public A a() {\n        return new A(b());\n    }\n\n    @Bean\n    public B b() {\n        return new B();\n    }\n}","options":[{"it":"Una sola: le classi @Configuration (full mode) sono proxate via CGLIB, quindi la chiamata b() dentro a() viene intercettata e restituisce il bean singleton","en":"Just one: @Configuration classes (full mode) are proxied via CGLIB, so the b() call inside a() is intercepted and returns the singleton bean"},{"it":"Due: una creata dalla chiamata b() dentro a() e una registrata separatamente come bean b()","en":"Two: one created by the b() call inside a() and one registered separately as bean b()"},{"it":"Nessuna: b() non viene mai registrato come bean perche invocato manualmente","en":"None: b() is never registered as a bean because it is invoked manually"},{"it":"Dipende: di default sono due, a meno di annotare B con @Scope(singleton)","en":"It depends: by default there are two, unless B is annotated with @Scope(singleton)"}],"correct":0,"explanation":{"it":"In sintesi: esiste una sola istanza di `B`. Le classi `@Configuration` in full mode (`proxyBeanMethods=true`, il default) sono avvolte da un proxy CGLIB che intercetta le chiamate ai metodi `@Bean`: quando `a()` chiama `b()`, il proxy non esegue davvero `new B()` una seconda volta ma restituisce il singleton gia gestito dal container.\nLe altre opzioni: due istanze si otterrebbero solo in lite mode (`proxyBeanMethods=false`) o se fosse un `@Component`, dove `b()` sarebbe una normale invocazione di metodo; `B` e comunque registrato come bean perche annotato `@Bean`, e lo scope di default e gia `singleton`, quindi non serve dichiararlo.","en":"In summary: there is a single instance of `B`. `@Configuration` classes in full mode (`proxyBeanMethods=true`, the default) are wrapped by a CGLIB proxy that intercepts calls to `@Bean` methods: when `a()` calls `b()`, the proxy does not actually run `new B()` a second time but returns the singleton already managed by the container.\nThe other options: two instances would result only in lite mode (`proxyBeanMethods=false`) or if it were a `@Component`, where `b()` would be an ordinary method call; `B` is registered as a bean anyway because it is annotated `@Bean`, and the default scope is already `singleton`, so there is no need to declare it."}},{"type":"mcq","prompt":{"it":"Con @SpringBootApplication, quali package vengono scansionati di default alla ricerca di componenti?","en":"With @SpringBootApplication, which packages are scanned by default when looking for components?"},"code":"","options":[{"it":"Il package della classe annotata e tutti i suoi sotto-package","en":"The package of the annotated class and all its sub-packages"},{"it":"L\u0027intero classpath dell\u0027applicazione, incluse tutte le librerie","en":"The entire application classpath, including all libraries"},{"it":"Solo il package esatto della classe annotata, escludendo i sotto-package","en":"Only the exact package of the annotated class, excluding sub-packages"},{"it":"Solo i package elencati esplicitamente in application.properties","en":"Only the packages explicitly listed in application.properties"}],"correct":0,"explanation":{"it":"In sintesi: `@SpringBootApplication` include `@ComponentScan` che, senza `basePackages` espliciti, prende come radice il package della classe annotata e scansiona ricorsivamente tutti i suoi sotto-package. Per questo la classe main va collocata nel package radice del progetto.\nLe altre opzioni: non viene scansionato l\u0027intero classpath ne le librerie di terze parti; i sotto-package sono inclusi, non esclusi; e `application.properties` non serve a elencare i package da scansionare.","en":"In summary: `@SpringBootApplication` includes `@ComponentScan`, which, without explicit `basePackages`, takes the package of the annotated class as its root and recursively scans all its sub-packages. This is why the main class should be placed in the project\u0027s root package.\nThe other options: the entire classpath is not scanned, nor are third-party libraries; the sub-packages are included, not excluded; and `application.properties` is not used to list the packages to scan."}},{"type":"mcq","prompt":{"it":"Come funziona in sostanza l\u0027auto-configuration di Spring Boot?","en":"How does Spring Boot\u0027s auto-configuration essentially work?"},"code":"","options":[{"it":"Configura automaticamente i bean in base a cio che e presente nel classpath e ai bean gia definiti, valutando condizioni come @ConditionalOnClass e @ConditionalOnMissingBean","en":"It automatically configures beans based on what is present on the classpath and on the beans already defined, evaluating conditions such as @ConditionalOnClass and @ConditionalOnMissingBean"},{"it":"Genera il codice sorgente delle classi di configurazione durante la compilazione","en":"It generates the source code of the configuration classes during compilation"},{"it":"Sostituisce sempre i bean definiti dall\u0027utente con quelli di default forniti da Spring","en":"It always replaces user-defined beans with the defaults provided by Spring"},{"it":"Richiede di elencare manualmente ogni classe di auto-configurazione dentro @SpringBootApplication","en":"It requires manually listing every auto-configuration class inside @SpringBootApplication"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027auto-configuration attiva classi di configurazione condizionali, dichiarate negli starter (oggi nei file `META-INF/spring/...AutoConfiguration.imports`), che si applicano solo se certe condizioni sono soddisfatte: presenza di una classe nel classpath con `@ConditionalOnClass`, assenza di un bean gia definito con `@ConditionalOnMissingBean`, proprieta impostate, e cosi via.\nLe altre opzioni: non c\u0027e generazione di sorgente a compile-time; non sovrascrive i bean dell\u0027utente, anzi grazie a `@ConditionalOnMissingBean` i tuoi bean hanno la precedenza; e non devi elencare a mano le auto-configurazioni.","en":"In summary: auto-configuration activates conditional configuration classes, declared in the starters (today in the `META-INF/spring/...AutoConfiguration.imports` files), that apply only if certain conditions are met: the presence of a class on the classpath with `@ConditionalOnClass`, the absence of an already-defined bean with `@ConditionalOnMissingBean`, properties being set, and so on.\nThe other options: there is no source generation at compile time; it does not override the user\u0027s beans, in fact thanks to `@ConditionalOnMissingBean` your beans take precedence; and you do not have to list the auto-configurations by hand."}},{"type":"truefalse","prompt":{"it":"Uno starter come spring-boot-starter-web e essenzialmente un insieme coordinato di dipendenze (una sorta di aggregatore), non un modulo che contiene logica di business.","en":"A starter such as spring-boot-starter-web is essentially a coordinated set of dependencies (a kind of aggregator), not a module containing business logic."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027affermazione e vera. Uno starter come `spring-boot-starter-web` e un artifact quasi privo di codice il cui scopo e dichiarare, con versioni gia allineate tra loro, il set di dipendenze necessarie per un certo ambito. Aggiungendone uno solo si portano transitivamente tutte le librerie coordinate, evitando conflitti di versione.\nLe altre opzioni: dire Falso e l\u0027errore tipico, cioe pensare che lo starter contenga la logica applicativa; quella risiede nelle librerie sottostanti e nell\u0027auto-configuration, non nello starter in se.","en":"In summary: the statement is true. A starter such as `spring-boot-starter-web` is an artifact with almost no code whose purpose is to declare, with versions already aligned with one another, the set of dependencies needed for a given area. Adding just one transitively pulls in all the coordinated libraries, avoiding version conflicts.\nThe other options: saying False is the typical mistake, that is, thinking the starter contains the application logic; that lives in the underlying libraries and in the auto-configuration, not in the starter itself."}},{"type":"mcq","prompt":{"it":"Quale affermazione sui profili e sui file di properties per profilo e corretta?","en":"Which statement about profiles and per-profile properties files is correct?"},"code":"","options":[{"it":"application-{profile}.properties viene caricato solo quando quel profilo e attivo e le sue proprieta sovrascrivono quelle di application.properties","en":"application-{profile}.properties is loaded only when that profile is active, and its properties override those in application.properties"},{"it":"I file per profilo vengono sempre caricati tutti insieme, indipendentemente dal profilo attivo","en":"Per-profile files are always all loaded together, regardless of the active profile"},{"it":"Un bean annotato @Profile(\"prod\") viene comunque creato anche se il profilo prod non e attivo","en":"A bean annotated @Profile(\"prod\") is created anyway even if the prod profile is not active"},{"it":"I profili possono essere definiti solo tramite application.yml, non tramite file .properties","en":"Profiles can only be defined via application.yml, not via .properties files"}],"correct":0,"explanation":{"it":"In sintesi: `application-{profile}.properties` viene caricato solo quando quel profilo e attivo, e i suoi valori hanno precedenza su `application.properties`, che funge da base comune. E il meccanismo standard per differenziare la configurazione tra ambienti.\nLe altre opzioni: non vengono caricati tutti i file per profilo insieme, solo quelli dei profili attivi; un bean `@Profile(\"prod\")` viene registrato esclusivamente se `prod` e attivo; e i profili funzionano identicamente con `.properties` e `.yml`, non solo con YAML.","en":"In summary: `application-{profile}.properties` is loaded only when that profile is active, and its values take precedence over `application.properties`, which serves as the common base. It is the standard mechanism for differentiating configuration across environments.\nThe other options: per-profile files are not all loaded together, only those of the active profiles; a `@Profile(\"prod\")` bean is registered exclusively if `prod` is active; and profiles work identically with `.properties` and `.yml`, not only with YAML."}},{"type":"mcq","prompt":{"it":"Qual e la differenza tra @RestController e @Controller?","en":"What is the difference between @RestController and @Controller?"},"code":"","options":[{"it":"@RestController equivale a @Controller + @ResponseBody: i valori restituiti dai metodi vengono serializzati nel body della risposta invece di essere interpretati come nomi di view","en":"@RestController is equivalent to @Controller + @ResponseBody: the values returned by the methods are serialized into the response body instead of being interpreted as view names"},{"it":"@RestController serve solo per endpoint che ritornano XML, mentre @Controller solo per HTML","en":"@RestController is only for endpoints that return XML, while @Controller is only for HTML"},{"it":"@Controller non puo gestire richieste HTTP: serve solo per registrare bean interni","en":"@Controller cannot handle HTTP requests: it only serves to register internal beans"},{"it":"Non c\u0027e alcuna differenza, sono semplici sinonimi","en":"There is no difference, they are simply synonyms"}],"correct":0,"explanation":{"it":"In sintesi: `@RestController` equivale a `@Controller` piu `@ResponseBody`: ogni valore restituito dai metodi viene passato agli `HttpMessageConverter` e scritto nel body della risposta, tipicamente come JSON, invece di essere interpretato come nome logico di view. `@Controller` da solo interpreta le `String` restituite come nomi di view da risolvere.\nLe altre opzioni: la distinzione non e XML vs HTML (il formato dipende dai converter e dalla content negotiation); `@Controller` gestisce eccome le richieste HTTP; e le due annotazioni non sono sinonimi.","en":"In summary: `@RestController` is equivalent to `@Controller` plus `@ResponseBody`: every value returned by the methods is passed to the `HttpMessageConverter`s and written into the response body, typically as JSON, instead of being interpreted as a logical view name. `@Controller` on its own interprets the returned `String`s as view names to be resolved.\nThe other options: the distinction is not XML vs HTML (the format depends on the converters and content negotiation); `@Controller` most certainly does handle HTTP requests; and the two annotations are not synonyms."}},{"type":"code","prompt":{"it":"Cosa rappresenta il valore \"greeting\" restituito da questo metodo?","en":"What does the value \"greeting\" returned by this method represent?"},"code":"@Controller\npublic class HomeController {\n\n    @GetMapping(\"/hello\")\n    public String hello() {\n        return \"greeting\";\n    }\n}","options":[{"it":"Il nome logico di una view, che il ViewResolver risolvera in un template (es. greeting.html)","en":"The logical name of a view, which the ViewResolver will resolve into a template (e.g. greeting.html)"},{"it":"Il corpo della risposta HTTP, ossia il testo \"greeting\" inviato al client","en":"The body of the HTTP response, i.e. the text \"greeting\" sent to the client"},{"it":"Un redirect verso l\u0027URL /greeting","en":"A redirect to the URL /greeting"},{"it":"Il nome del bean da restituire come body della risposta","en":"The name of the bean to return as the response body"}],"correct":0,"explanation":{"it":"In sintesi: con `@Controller` e senza `@ResponseBody`, la `String` restituita da un handler e interpretata come nome logico di view e passata al `ViewResolver`, che la mappa su un template come `greeting.html`. Non e il contenuto della risposta, ma un riferimento simbolico alla vista.\nLe altre opzioni: per restituire il testo \"greeting\" nel body servirebbe `@ResponseBody` o `@RestController`; non e un redirect, che richiederebbe il prefisso `redirect:`; e non e un nome di bean.","en":"In summary: with `@Controller` and without `@ResponseBody`, the `String` returned by a handler is interpreted as a logical view name and passed to the `ViewResolver`, which maps it to a template such as `greeting.html`. It is not the response content, but a symbolic reference to the view.\nThe other options: to return the text \"greeting\" in the body you would need `@ResponseBody` or `@RestController`; it is not a redirect, which would require the `redirect:` prefix; and it is not a bean name."}},{"type":"code","prompt":{"it":"Con la richiesta GET /users/42?full=true, quale stringa viene restituita?","en":"With the request GET /users/42?full=true, which string is returned?"},"code":"@GetMapping(\"/users/{id}\")\npublic String get(@PathVariable Long id,\n                  @RequestParam(defaultValue = \"false\") boolean full) {\n    return id + \"-\" + full;\n}","options":[{"it":"\"42-true\"","en":"\"42-true\""},{"it":"\"42-false\"","en":"\"42-false\""},{"it":"\"null-true\"","en":"\"null-true\""},{"it":"Errore 400 perche full non e presente nel path","en":"400 error because full is not present in the path"}],"correct":0,"explanation":{"it":"In sintesi: viene restituita \"42-true\". `@PathVariable` lega `id` al segmento `{id}` dell\u0027URL, quindi `id` vale 42; `@RequestParam` lega `full` al parametro di query `full=true`, quindi `full` e true. La concatenazione produce \"42-true\".\nLe altre opzioni: il `defaultValue = \"false\"` si applicherebbe solo se `full` mancasse dalla query, ma qui e presente; `full` non deve stare nel path, quindi nessun errore 400; e `id` non e null perche il path lo valorizza.","en":"In summary: \"42-true\" is returned. `@PathVariable` binds `id` to the `{id}` segment of the URL, so `id` is 42; `@RequestParam` binds `full` to the query parameter `full=true`, so `full` is true. The concatenation produces \"42-true\".\nThe other options: the `defaultValue = \"false\"` would apply only if `full` were missing from the query, but here it is present; `full` does not need to be in the path, so there is no 400 error; and `id` is not null because the path provides its value."}},{"type":"mcq","prompt":{"it":"Cosa fa @RequestBody su un parametro di un metodo handler?","en":"What does @RequestBody do on a handler method parameter?"},"code":"","options":[{"it":"Deserializza il corpo della richiesta (es. JSON) in un oggetto Java tramite un HttpMessageConverter","en":"It deserializes the request body (e.g. JSON) into a Java object via an HttpMessageConverter"},{"it":"Legge un singolo parametro dalla query string dell\u0027URL","en":"It reads a single parameter from the URL query string"},{"it":"Estrae un segmento variabile dal path dell\u0027URL","en":"It extracts a variable segment from the URL path"},{"it":"Imposta il corpo della risposta HTTP che verra inviata al client","en":"It sets the body of the HTTP response that will be sent to the client"}],"correct":0,"explanation":{"it":"In sintesi: `@RequestBody` dice a Spring di prendere il corpo della richiesta in ingresso, per esempio un JSON, e deserializzarlo nell\u0027oggetto del parametro usando l\u0027`HttpMessageConverter` appropriato, tipicamente Jackson. Riguarda l\u0027input della richiesta.\nLe altre opzioni: leggere dalla query string e compito di `@RequestParam`; estrarre un segmento del path e compito di `@PathVariable`; e impostare il corpo della risposta e cio che fa `@ResponseBody`, sul lato output, non `@RequestBody`.","en":"In summary: `@RequestBody` tells Spring to take the incoming request body, for example a JSON, and deserialize it into the parameter\u0027s object using the appropriate `HttpMessageConverter`, typically Jackson. It concerns the request input.\nThe other options: reading from the query string is the job of `@RequestParam`; extracting a path segment is the job of `@PathVariable`; and setting the response body is what `@ResponseBody` does, on the output side, not `@RequestBody`."}},{"type":"code","prompt":{"it":"In caso di successo, quale status HTTP restituisce questo metodo?","en":"On success, which HTTP status does this method return?"},"code":"@PostMapping(\"/orders\")\npublic ResponseEntity\u003cOrder\u003e create(@RequestBody Order o) {\n    Order saved = service.save(o);\n    return ResponseEntity.status(HttpStatus.CREATED).body(saved);\n}","options":[{"it":"201 Created","en":"201 Created"},{"it":"200 OK","en":"200 OK"},{"it":"204 No Content","en":"204 No Content"},{"it":"202 Accepted","en":"202 Accepted"}],"correct":0,"explanation":{"it":"In sintesi: lo status e 201 Created. `ResponseEntity.status(HttpStatus.CREATED)` imposta esplicitamente il codice a 201, che e quello appropriato per un POST che crea una risorsa, e `body(saved)` inserisce la risorsa creata nel corpo della risposta.\nLe altre opzioni: 200 sarebbe il default di un ritorno diretto senza `ResponseEntity`; 204 si usa quando non c\u0027e body; 202 indica una richiesta accettata ma non ancora processata. Qui lo status e quello dichiarato esplicitamente, 201.","en":"In summary: the status is 201 Created. `ResponseEntity.status(HttpStatus.CREATED)` explicitly sets the code to 201, which is the appropriate one for a POST that creates a resource, and `body(saved)` places the created resource in the response body.\nThe other options: 200 would be the default of a direct return without `ResponseEntity`; 204 is used when there is no body; 202 indicates a request that has been accepted but not yet processed. Here the status is the one explicitly declared, 201."}},{"type":"mcq","prompt":{"it":"Un metodo di un @RestController che ritorna direttamente un oggetto (non un ResponseEntity) e non lancia eccezioni, quale status HTTP produce di default?","en":"A method of a @RestController that returns an object directly (not a ResponseEntity) and does not throw exceptions produces which HTTP status by default?"},"code":"","options":[{"it":"200 OK","en":"200 OK"},{"it":"201 Created","en":"201 Created"},{"it":"204 No Content","en":"204 No Content"},{"it":"Nessuno status: lo decide il client","en":"No status: the client decides it"}],"correct":0,"explanation":{"it":"In sintesi: in assenza di `ResponseEntity`, di `@ResponseStatus` o di eccezioni, Spring MVC risponde con lo status di default 200 OK e serializza l\u0027oggetto restituito nel body. E il comportamento standard per un handler che ritorna direttamente un oggetto.\nLe altre opzioni: 201 va impostato esplicitamente, tipicamente per le creazioni; 204 si usa quando non si restituisce alcun body; e lo status non e mai deciso dal client, e sempre il server a impostarlo. Per uno status diverso da 200 servono `ResponseEntity` o `@ResponseStatus`.","en":"In summary: in the absence of `ResponseEntity`, `@ResponseStatus` or exceptions, Spring MVC responds with the default status 200 OK and serializes the returned object into the body. This is the standard behavior for a handler that returns an object directly.\nThe other options: 201 must be set explicitly, typically for creations; 204 is used when no body is returned; and the status is never decided by the client, it is always the server that sets it. For a status other than 200 you need `ResponseEntity` or `@ResponseStatus`."}},{"type":"mcq","prompt":{"it":"A cosa servono @ControllerAdvice e @ExceptionHandler?","en":"What are @ControllerAdvice and @ExceptionHandler for?"},"code":"","options":[{"it":"@ControllerAdvice centralizza in un unico punto la gestione delle eccezioni (e altri aspetti) per piu controller; @ExceptionHandler mappa un tipo di eccezione al metodo che la gestisce","en":"@ControllerAdvice centralizes exception handling (and other concerns) for multiple controllers in one place; @ExceptionHandler maps an exception type to the method that handles it"},{"it":"@ControllerAdvice intercetta solo le eccezioni sollevate all\u0027interno della classe in cui e dichiarato","en":"@ControllerAdvice intercepts only the exceptions raised within the class in which it is declared"},{"it":"@ExceptionHandler puo essere usato esclusivamente all\u0027interno di una classe @ControllerAdvice, mai dentro un controller","en":"@ExceptionHandler can be used exclusively inside a @ControllerAdvice class, never inside a controller"},{"it":"@ControllerAdvice sostituisce il DispatcherServlet nel gestire il routing delle richieste","en":"@ControllerAdvice replaces the DispatcherServlet in handling request routing"}],"correct":0,"explanation":{"it":"In sintesi: `@ControllerAdvice` centralizza in un unico punto la gestione trasversale delle eccezioni, e di altri aspetti, per piu controller, per default tutti; al suo interno i metodi `@ExceptionHandler` mappano un tipo di eccezione al metodo che lo gestisce. E il modo idiomatico per una gestione degli errori uniforme.\nLe altre opzioni: non e limitato alla singola classe in cui e dichiarato, quello sarebbe un `@ExceptionHandler` locale al controller; `@ExceptionHandler` funziona sia in un `@Cont
