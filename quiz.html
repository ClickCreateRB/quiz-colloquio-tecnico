rollerAdvice` sia direttamente in un controller; e `@ControllerAdvice` non sostituisce il `DispatcherServlet`, che resta il front controller del routing.","en":"In summary: `@ControllerAdvice` centralizes cross-cutting exception handling, and other concerns, for multiple controllers in one place, by default all of them; within it, `@ExceptionHandler` methods map an exception type to the method that handles it. It is the idiomatic way to achieve uniform error handling.\nThe other options: it is not limited to the single class in which it is declared, that would be an `@ExceptionHandler` local to the controller; `@ExceptionHandler` works both in a `@ControllerAdvice` and directly in a controller; and `@ControllerAdvice` does not replace the `DispatcherServlet`, which remains the front controller for routing."}},{"type":"code","prompt":{"it":"Con questa configurazione, cosa accade quando un qualsiasi controller lancia una EntityNotFoundException?","en":"With this configuration, what happens when any controller throws an EntityNotFoundException?"},"code":"@RestControllerAdvice\npublic class GlobalHandler {\n\n    @ExceptionHandler(EntityNotFoundException.class)\n    public ResponseEntity\u003cString\u003e handle(EntityNotFoundException ex) {\n        return ResponseEntity.status(HttpStatus.NOT_FOUND)\n                             .body(ex.getMessage());\n    }\n}","options":[{"it":"Viene invocato handle() e il client riceve una risposta 404 con il messaggio dell\u0027eccezione nel body","en":"handle() is invoked and the client receives a 404 response with the exception message in the body"},{"it":"L\u0027eccezione si propaga come 500 perche @RestControllerAdvice non e globale","en":"The exception propagates as a 500 because @RestControllerAdvice is not global"},{"it":"Vengono gestiti solo i controller che si trovano nello stesso package della classe advice","en":"Only the controllers located in the same package as the advice class are handled"},{"it":"Il body risulta vuoto perche ResponseEntity ignora body() quando lo status e di errore","en":"The body ends up empty because ResponseEntity ignores body() when the status is an error"}],"correct":0,"explanation":{"it":"In sintesi: viene invocato `handle()` e il client riceve un 404 con il messaggio dell\u0027eccezione nel body. `@RestControllerAdvice`, che equivale a `@ControllerAdvice` piu `@ResponseBody`, applica il gestore a tutti i controller dell\u0027applicazione, quindi qualunque `EntityNotFoundException` non gestita localmente finisce li.\nLe altre opzioni: non diventa un 500 perche l\u0027advice e effettivamente globale; non e limitato al package della classe advice; e `ResponseEntity` scrive regolarmente il body anche con status di errore, quindi `body()` non viene ignorato.","en":"In summary: `handle()` is invoked and the client receives a 404 with the exception message in the body. `@RestControllerAdvice`, which is equivalent to `@ControllerAdvice` plus `@ResponseBody`, applies the handler to all of the application\u0027s controllers, so any `EntityNotFoundException` not handled locally ends up there.\nThe other options: it does not become a 500 because the advice is indeed global; it is not limited to the advice class\u0027s package; and `ResponseEntity` writes the body normally even with an error status, so `body()` is not ignored."}},{"type":"mcq","prompt":{"it":"Definendo un\u0027interfaccia che estende JpaRepository\u003cUser, Long\u003e, chi ne fornisce l\u0027implementazione?","en":"When defining an interface that extends JpaRepository\u003cUser, Long\u003e, who provides its implementation?"},"code":"","options":[{"it":"Spring Data genera a runtime un proxy che implementa i metodi dell\u0027interfaccia","en":"Spring Data generates a proxy at runtime that implements the interface\u0027s methods"},{"it":"Devi scrivere manualmente una classe che implementa quell\u0027interfaccia","en":"You have to manually write a class that implements that interface"},{"it":"Hibernate genera una classe concreta a compile-time durante la build","en":"Hibernate generates a concrete class at compile time during the build"},{"it":"Il metodo resta astratto e lancia UnsupportedOperationException se invocato","en":"The method stays abstract and throws UnsupportedOperationException if invoked"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027implementazione la fornisce Spring Data JPA, che a runtime genera un proxy dinamico dell\u0027interfaccia repository: espone le operazioni CRUD ereditate da `JpaRepository`, delegando a un\u0027implementazione di base come `SimpleJpaRepository`, e deriva le query dai nomi dei metodi. E il vantaggio chiave del pattern, non scrivere codice di implementazione.\nLe altre opzioni: non devi scrivere tu una classe che implementa l\u0027interfaccia; la generazione non avviene a compile-time da parte di Hibernate; e i metodi non restano astratti ne lanciano `UnsupportedOperationException`, li risolve il proxy.","en":"In summary: the implementation is provided by Spring Data JPA, which at runtime generates a dynamic proxy of the repository interface: it exposes the CRUD operations inherited from `JpaRepository`, delegating to a base implementation such as `SimpleJpaRepository`, and derives the queries from the method names. This is the key advantage of the pattern, not writing implementation code.\nThe other options: you do not have to write a class that implements the interface yourself; the generation does not happen at compile time by Hibernate; and the methods do not stay abstract nor throw `UnsupportedOperationException`, the proxy resolves them."}},{"type":"code","prompt":{"it":"Cosa fa questo metodo di repository derivato dal nome?","en":"What does this repository method derived from its name do?"},"code":"public interface UserRepository extends JpaRepository\u003cUser, Long\u003e {\n    List\u003cUser\u003e findByAgeGreaterThanAndActiveTrue(int age);\n}","options":[{"it":"Restituisce gli User con age strettamente maggiore del valore passato e con active = true","en":"It returns the Users with age strictly greater than the passed value and with active = true"},{"it":"Restituisce gli User con age maggiore o uguale al valore, indipendentemente da active","en":"It returns the Users with age greater than or equal to the value, regardless of active"},{"it":"Va in errore: i query method derivati non supportano condizioni multiple","en":"It fails: derived query methods do not support multiple conditions"},{"it":"Restituisce tutti gli User ordinati per age crescente","en":"It returns all the Users ordered by ascending age"}],"correct":0,"explanation":{"it":"In sintesi: il nome del metodo viene interpretato da Spring Data come una query derivata: `GreaterThan` impone `age` strettamente maggiore del valore passato, `And` combina piu condizioni, e `ActiveTrue` e una scorciatoia per `active = true`. Quindi restituisce gli `User` con `age` maggiore del parametro e `active` a true.\nLe altre opzioni: per il maggiore-o-uguale servirebbe `GreaterThanEqual`; i query method supportano piu condizioni con `And`/`Or`, quindi nessun errore; e non c\u0027e ordinamento implicito, servirebbe un suffisso `OrderBy`.","en":"In summary: the method name is interpreted by Spring Data as a derived query: `GreaterThan` requires `age` to be strictly greater than the passed value, `And` combines multiple conditions, and `ActiveTrue` is shorthand for `active = true`. So it returns the `User`s with `age` greater than the parameter and `active` set to true.\nThe other options: for greater-than-or-equal you would need `GreaterThanEqual`; query methods do support multiple conditions with `And`/`Or`, so there is no error; and there is no implicit ordering, that would require an `OrderBy` suffix."}},{"type":"mcq","prompt":{"it":"Qual e il comportamento della propagazione REQUIRED (default di @Transactional)?","en":"What is the behavior of REQUIRED propagation (the default of @Transactional)?"},"code":"","options":[{"it":"Se esiste gia una transazione la riutilizza, altrimenti ne crea una nuova","en":"If a transaction already exists it reuses it, otherwise it creates a new one"},{"it":"Crea sempre una nuova transazione, sospendendo quella eventualmente in corso","en":"It always creates a new transaction, suspending any one currently in progress"},{"it":"Non apre mai una transazione: si limita a partecipare a una gia esistente, altrimenti fallisce","en":"It never opens a transaction: it only participates in an existing one, otherwise it fails"},{"it":"E equivalente a REQUIRES_NEW e apre sempre una transazione indipendente","en":"It is equivalent to REQUIRES_NEW and always opens an independent transaction"}],"correct":0,"explanation":{"it":"In sintesi: `REQUIRED`, la propagazione di default, riusa la transazione corrente se ne esiste gia una, altrimenti ne avvia una nuova. E il comportamento piu comune: il metodo si aggancia al contesto transazionale esistente per far parte della stessa unita di lavoro.\nLe altre opzioni: creare sempre una transazione nuova sospendendo quella in corso e `REQUIRES_NEW`; partecipare solo a una transazione esistente e fallire se non c\u0027e e `MANDATORY`; e `REQUIRES_NEW` non e equivalente a `REQUIRED`, apre invece una transazione indipendente.","en":"In summary: `REQUIRED`, the default propagation, reuses the current transaction if one already exists, otherwise it starts a new one. It is the most common behavior: the method hooks into the existing transactional context to be part of the same unit of work.\nThe other options: always creating a new transaction while suspending the current one is `REQUIRES_NEW`; only participating in an existing transaction and failing if there is none is `MANDATORY`; and `REQUIRES_NEW` is not equivalent to `REQUIRED`, it instead opens an independent transaction."}},{"type":"code","prompt":{"it":"La transazione su save() viene attivata quando process() chiama save() internamente?","en":"Is the transaction on save() activated when process() calls save() internally?"},"code":"@Service\npublic class OrderService {\n\n    public void process() {\n        save();   // chiamata interna allo stesso bean\n    }\n\n    @Transactional\n    public void save() {\n        // ...\n    }\n}","options":[{"it":"No: la chiamata interna (self-invocation) non passa dal proxy, quindi @Transactional viene ignorata","en":"No: the internal call (self-invocation) does not pass through the proxy, so @Transactional is ignored"},{"it":"Si: @Transactional funziona sempre, indipendentemente da chi chiama il metodo","en":"Yes: @Transactional always works, regardless of who calls the method"},{"it":"No, ma solo perche save() dovrebbe essere dichiarato private","en":"No, but only because save() should be declared private"},{"it":"Si, ma soltanto se anche process() e annotato @Transactional","en":"Yes, but only if process() is also annotated @Transactional"}],"correct":0,"explanation":{"it":"In sintesi: no, la transazione su `save()` non si attiva. L\u0027AOP di Spring per `@Transactional` e proxy-based: l\u0027aspetto scatta solo quando la chiamata passa attraverso il proxy, cioe arriva da un chiamante esterno al bean. Nella self-invocation `process()` chiama `save()` tramite `this`, bypassando il proxy, quindi l\u0027annotazione viene ignorata.\nLe altre opzioni: non e vero che `@Transactional` funzioni sempre a prescindere dal chiamante; il problema non e la visibilita, `save()` e gia public; e annotare anche `process()` non risolve la self-invocation su `save()`. Le soluzioni tipiche sono separare i metodi in due bean, auto-iniettare il proxy o usare AspectJ weaving.","en":"In summary: no, the transaction on `save()` is not activated. Spring\u0027s AOP for `@Transactional` is proxy-based: the aspect only fires when the call passes through the proxy, that is, when it comes from a caller external to the bean. In self-invocation, `process()` calls `save()` via `this`, bypassing the proxy, so the annotation is ignored.\nThe other options: it is not true that `@Transactional` always works regardless of the caller; the problem is not visibility, `save()` is already public; and annotating `process()` as well does not fix the self-invocation on `save()`. The typical solutions are to split the methods into two beans, self-inject the proxy, or use AspectJ weaving."}},{"type":"mcq","prompt":{"it":"Su un bean gestito con i proxy standard di Spring, su quali metodi @Transactional viene tipicamente ignorata?","en":"On a bean managed with Spring\u0027s standard proxies, on which methods is @Transactional typically ignored?"},"code":"","options":[{"it":"Sui metodi non public (private, protected, package-private) con la configurazione a proxy di default","en":"On non-public methods (private, protected, package-private) with the default proxy configuration"},{"it":"Sui metodi public, che non possono essere intercettati","en":"On public methods, which cannot be intercepted"},{"it":"Solo sui metodi static","en":"Only on static methods"},{"it":"Su nessuno: @Transactional funziona sempre su qualsiasi visibilita","en":"On none: @Transactional always works at any visibility"}],"correct":0,"explanation":{"it":"In sintesi: con i proxy standard di Spring, `@Transactional` viene rispettata solo sui metodi public; applicarla a metodi non public, quindi private, protected o package-private, di norma non ha effetto perche non vengono intercettati nella semantica prevista.\nLe altre opzioni: e rovesciata l\u0027idea che i public non possano essere intercettati, sono proprio quelli correttamente proxati; non e una questione di `static`; e non e vero che funzioni sempre a qualsiasi visibilita. Per intercettare metodi non public serve una configurazione diversa, come AspectJ weaving.","en":"In summary: with Spring\u0027s standard proxies, `@Transactional` is honored only on public methods; applying it to non-public methods, that is private, protected or package-private, normally has no effect because they are not intercepted with the intended semantics.\nThe other options: the idea that public methods cannot be intercepted is reversed, they are exactly the ones that are correctly proxied; it is not a matter of `static`; and it is not true that it always works at any visibility. To intercept non-public methods you need a different configuration, such as AspectJ weaving."}},{"type":"mcq","prompt":{"it":"Qual e l\u0027ordine corretto delle fasi di inizializzazione di un bean singleton?","en":"What is the correct order of the initialization phases of a singleton bean?"},"code":"","options":[{"it":"Istanziazione (costruttore) -\u003e dependency injection delle proprieta -\u003e @PostConstruct -\u003e afterPropertiesSet() di InitializingBean","en":"Instantiation (constructor) -\u003e dependency injection of the properties -\u003e @PostConstruct -\u003e afterPropertiesSet() of InitializingBean"},{"it":"@PostConstruct -\u003e costruttore -\u003e dependency injection","en":"@PostConstruct -\u003e constructor -\u003e dependency injection"},{"it":"Dependency injection -\u003e costruttore -\u003e @PostConstruct","en":"Dependency injection -\u003e constructor -\u003e @PostConstruct"},{"it":"@PreDestroy -\u003e costruttore -\u003e @PostConstruct","en":"@PreDestroy -\u003e constructor -\u003e @PostConstruct"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027ordine e istanziazione col costruttore, poi dependency injection delle proprieta, poi `@PostConstruct`, e infine `afterPropertiesSet()` di `InitializingBean`. Il container prima crea l\u0027oggetto, poi ne popola le dipendenze, esegue le callback Aware e i BeanPostProcessor, tra cui quello che invoca `@PostConstruct`, e da ultimo gli hook di inizializzazione.\nLe altre opzioni: `@PostConstruct` non puo precedere il costruttore ne l\u0027iniezione, quindi le opzioni che lo mettono per primo sono errate; e `@PreDestroy` appartiene alla fase di distruzione, non a quella di inizializzazione.","en":"In summary: the order is instantiation with the constructor, then dependency injection of the properties, then `@PostConstruct`, and finally `afterPropertiesSet()` of `InitializingBean`. The container first creates the object, then populates its dependencies, runs the Aware callbacks and the BeanPostProcessors, among them the one that invokes `@PostConstruct`, and lastly the initialization hooks.\nThe other options: `@PostConstruct` cannot precede the constructor or the injection, so the options that put it first are wrong; and `@PreDestroy` belongs to the destruction phase, not the initialization one."}},{"type":"code","prompt":{"it":"Se la proprieta mail.port non e definita in application.properties, quanto vale il campo port?","en":"If the mail.port property is not defined in application.properties, what is the value of the port field?"},"code":"@Component\npublic class MailConfig {\n\n    @Value(\"${mail.port:25}\")\n    private int port;\n}","options":[{"it":"25, grazie al valore di default indicato dopo i due punti nel placeholder","en":"25, thanks to the default value indicated after the colon in the placeholder"},{"it":"0, il valore di default di un int in Java","en":"0, the default value of an int in Java"},{"it":"null, e viene sollevata una NullPointerException","en":"null, and a NullPointerException is thrown"},{"it":"L\u0027applicazione non si avvia per proprieta mancante","en":"The application does not start because of the missing property"}],"correct":0,"explanation":{"it":"In sintesi: `port` vale 25, grazie al valore di default indicato dopo i due punti nel placeholder. La sintassi `${chiave:default}` fornisce un fallback usato quando la proprieta non e definita: mancando `mail.port`, viene iniettato 25, convertito in `int`.\nLe altre opzioni: non si applica lo 0 di default del primitivo perche il placeholder fornisce esplicitamente 25; un `int` non puo valere null, quindi nessuna NPE; e l\u0027app parte regolarmente proprio perche il default evita l\u0027errore che si avrebbe con `${mail.port}` senza fallback.","en":"In summary: `port` is 25, thanks to the default value indicated after the colon in the placeholder. The `${key:default}` syntax provides a fallback used when the property is not defined: since `mail.port` is missing, 25 is injected, converted to `int`.\nThe other options: the primitive\u0027s default of 0 does not apply because the placeholder explicitly provides 25; an `int` cannot be null, so there is no NPE; and the app starts normally precisely because the default avoids the error you would get with `${mail.port}` without a fallback."}},{"type":"code","prompt":{"it":"Cosa inietta questa espressione in @Value?","en":"What does this expression inject in @Value?"},"code":"@Value(\"#{systemProperties[\u0027user.name\u0027]}\")\nprivate String user;","options":[{"it":"Il valore della system property user.name, valutato come espressione SpEL (#{...})","en":"The value of the user.name system property, evaluated as a SpEL expression (#{...})"},{"it":"La stringa letterale \"#{systemProperties[\u0027user.name\u0027]}\"","en":"The literal string \"#{systemProperties[\u0027user.name\u0027]}\""},{"it":"Una proprieta di nome user.name letta da application.properties","en":"A property named user.name read from application.properties"},{"it":"Un errore: #{} non e una sintassi valida dentro @Value","en":"An error: #{} is not valid syntax inside @Value"}],"correct":0,"explanation":{"it":"In sintesi: la sintassi `#{...}` in `@Value` indica una Spring Expression Language: qui l\u0027espressione legge la system property `user.name` dalla mappa predefinita `systemProperties` e ne inietta il valore. E il modo per valutare espressioni a runtime, non semplici placeholder.\nLe altre opzioni: non e trattata come stringa letterale perche riconosciuta come SpEL; per leggere da `application.properties` si usa `${...}`, che e cosa diversa da `#{...}`; e la sintassi `#{}` e pienamente valida, quindi nessun errore.","en":"In summary: the `#{...}` syntax in `@Value` denotes a Spring Expression Language expression: here it reads the `user.name` system property from the predefined `systemProperties` map and injects its value. It is the way to evaluate expressions at runtime, not simple placeholders.\nThe other options: it is not treated as a literal string because it is recognized as SpEL; to read from `application.properties` you use `${...}`, which is different from `#{...}`; and the `#{}` syntax is fully valid, so there is no error."}},{"type":"mcq","prompt":{"it":"Su cosa si basa principalmente l\u0027AOP di Spring per applicare aspetti come @Transactional?","en":"What does Spring\u0027s AOP mainly rely on to apply aspects such as @Transactional?"},"code":"","options":[{"it":"Su proxy (JDK dynamic proxy o CGLIB) che avvolgono il bean e intercettano le chiamate ai suoi metodi","en":"On proxies (JDK dynamic proxy or CGLIB) that wrap the bean and intercept calls to its methods"},{"it":"Sulla modifica del bytecode di tutte le classi a compile-time, come il weaving statico di AspectJ","en":"On modifying the bytecode of all classes at compile time, like AspectJ\u0027s static weaving"},{"it":"Sull\u0027ereditarieta multipla delle classi target","en":"On multiple inheritance of the target classes"},{"it":"Sull\u0027uso della reflection a ogni chiamata di metodo senza alcun proxy","en":"On the use of reflection on every method call without any proxy"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027AOP di Spring e proxy-based: il container crea un proxy attorno al bean, un JDK dynamic proxy se il bean implementa interfacce altrimenti una sottoclasse CGLIB, e intercetta le invocazioni dei metodi per applicare gli aspetti prima e dopo l\u0027esecuzione, come apertura e commit della transazione per `@Transactional`.\nLe altre opzioni: non usa il weaving statico del bytecode a compile-time, tipico di AspectJ nativo; non si fonda sull\u0027ereditarieta multipla, che Java non ha; e non e semplice reflection a ogni chiamata. E proprio il meccanismo a proxy a spiegare limiti come la self-invocation.","en":"In summary: Spring\u0027s AOP is proxy-based: the container creates a proxy around the bean, a JDK dynamic proxy if the bean implements interfaces, otherwise a CGLIB subclass, and intercepts method invocations to apply the aspects before and after execution, such as opening and committing the transaction for `@Transactional`.\nThe other options: it does not use static compile-time bytecode weaving, typical of native AspectJ; it is not based on multiple inheritance, which Java does not have; and it is not plain reflection on every call. It is precisely the proxy mechanism that explains limitations such as self-invocation."}},{"type":"truefalse","prompt":{"it":"Con i proxy CGLIB, i metodi dichiarati final non possono essere intercettati dall\u0027AOP di Spring.","en":"With CGLIB proxies, methods declared final cannot be intercepted by Spring\u0027s AOP."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027affermazione e vera. CGLIB crea il proxy estendendo la classe target e facendo override dei suoi metodi per inserire la logica dell\u0027aspetto. Un metodo `final` non puo essere sottoposto a override, quindi non puo essere intercettato, e eventuali annotazioni AOP come `@Transactional` su metodi `final` vengono di fatto ignorate.\nLe altre opzioni: dire Falso e l\u0027errore tipico; analogamente anche una classe `final` non puo essere proxata da CGLIB. E un limite intrinseco dell\u0027approccio a proxy per sottoclasse.","en":"In summary: the statement is true. CGLIB creates the proxy by extending the target class and overriding its methods to insert the aspect\u0027s logic. A `final` method cannot be overridden, so it cannot be intercepted, and any AOP annotations such as `@Transactional` on `final` methods are effectively ignored.\nThe other options: saying False is the typical mistake; likewise, a `final` class cannot be proxied by CGLIB either. It is an inherent limitation of the subclass-based proxy approach."}},{"type":"mcq","prompt":{"it":"Qual e la differenza corretta tra @Component e @Bean?","en":"What is the correct difference between @Component and @Bean?"},"code":"","options":[{"it":"@Component annota una classe rilevata dal component scanning; @Bean annota un metodo dentro una classe di configurazione per registrare un oggetto, utile soprattutto quando la classe e di terze parti e non e annotabile","en":"@Component annotates a class detected by component scanning; @Bean annotates a method inside a configuration class to register an object, useful especially when the class is third-party and cannot be annotated"},{"it":"@Bean si usa sulle classi, mentre @Component si usa sui metodi","en":"@Bean is used on classes, while @Component is used on methods"},{"it":"@Component e @Bean sono intercambiabili e si applicano entrambi ai metodi","en":"@Component and @Bean are interchangeable and both apply to methods"},{"it":"@Bean richiede necessariamente il component scanning attivo per poter funzionare","en":"@Bean necessarily requires component scanning to be active in order to work"}],"correct":0,"explanation":{"it":"In sintesi: `@Component`, e i suoi stereotipi, si mette su una classe di cui abbiamo il sorgente per farla rilevare dal component scanning; `@Bean` si mette su un metodo di una classe di configurazione `@Configuration` per registrare esplicitamente un oggetto come bean. Quest\u0027ultimo e lo scenario tipico quando la classe viene da una libreria di terze parti e non possiamo annotarla.\nLe altre opzioni: le collocazioni sono opposte a quanto dice la seconda opzione, `@Component` va sulle classi e `@Bean` sui metodi; le due annotazioni non sono intercambiabili; e `@Bean` funziona tramite l\u0027elaborazione della classe di configurazione, indipendentemente dal component scanning.","en":"In summary: `@Component`, and its stereotypes, is placed on a class whose source we own to have it detected by component scanning; `@Bean` is placed on a method of a `@Configuration` configuration class to explicitly register an object as a bean. The latter is the typical scenario when the class comes from a third-party library and we cannot annotate it.\nThe other options: the placements are the opposite of what the second option says, `@Component` goes on classes and `@Bean` on methods; the two annotations are not interchangeable; and `@Bean` works through the processing of the configuration class, independently of component scanning."}},{"type":"code","prompt":{"it":"Cosa succede all\u0027avvio dell\u0027applicazione con queste due classi?","en":"What happens at application startup with these two classes?"},"code":"@Service\nclass A {\n    A(B b) { }\n}\n\n@Service\nclass B {\n    B(A a) { }\n}","options":[{"it":"L\u0027avvio fallisce: Spring rileva una dipendenza circolare tra costruttori e solleva un\u0027eccezione (es. BeanCurrentlyInCreationException)","en":"Startup fails: Spring detects a circular dependency between constructors and throws an exception (e.g. BeanCurrentlyInCreationException)"},{"it":"Funziona senza problemi: Spring risolve automaticamente qualsiasi dipendenza circolare","en":"It works without problems: Spring automatically resolves any circular dependency"},{"it":"A e B vengono creati ma con i riferimenti null, e l\u0027app parte comunque","en":"A and B are created but with null references, and the app starts anyway"},{"it":"Spring crea due container separati per rompere il ciclo","en":"Spring creates two separate containers to break the cycle"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027avvio fallisce. Con la constructor injection, per creare `A` serve gia `B` e per creare `B` serve gia `A`: nessuno dei due puo essere istanziato per primo, quindi Spring non riesce a risolvere il ciclo e solleva un\u0027eccezione, tipicamente `BeanCurrentlyInCreationException`.\nLe altre opzioni: non risolve automaticamente qualsiasi ciclo, la risoluzione e possibile solo con field o setter injection tramite riferimenti anticipati, non con i costruttori; i bean non partono con riferimenti null; e non vengono creati container separati. Da Spring Boot 2.6, inoltre, i riferimenti circolari sono vietati per default con `spring.main.allow-circular-references=false`.","en":"In summary: startup fails. With constructor injection, creating `A` already requires `B` and creating `B` already requires `A`: neither can be instantiated first, so Spring cannot resolve the cycle and throws an exception, typically `BeanCurrentlyInCreationException`.\nThe other options: it does not automatically resolve every cycle, resolution is possible only with field or setter injection through early references, not with constructors; the beans do not start with null references; and no separate containers are created. Moreover, since Spring Boot 2.6 circular references are forbidden by default with `spring.main.allow-circular-references=false`."}},{"type":"mcq","prompt":{"it":"Per default, su quali tipi di eccezione @Transactional esegue il rollback automatico?","en":"By default, on which types of exception does @Transactional perform an automatic rollback?"},"code":"","options":[{"it":"Solo su RuntimeException (unchecked) ed Error; le checked exception non provocano rollback automatico","en":"Only on RuntimeException (unchecked) and Error; checked exceptions do not trigger an automatic rollback"},{"it":"Su qualsiasi eccezione lanciata, sia checked sia unchecked","en":"On any thrown exception, both checked and unchecked"},{"it":"Non esegue mai rollback automatico: va sempre invocato manualmente","en":"It never performs an automatic rollback: it must always be invoked manually"},{"it":"Solo sulle checked exception, non sulle RuntimeException","en":"Only on checked exceptions, not on RuntimeExceptions"}],"correct":0,"explanation":{"it":"In sintesi: per default `@Transactional` fa rollback solo sulle eccezioni unchecked, cioe `RuntimeException` e sottoclassi, e sugli `Error`; per le checked exception, invece, esegue comunque il commit. E un default che sorprende chi si aspetta il rollback su qualsiasi errore.\nLe altre opzioni: non fa rollback su qualsiasi eccezione, per le checked serve configurare `rollbackFor`; il comportamento e opposto a quello che limita il rollback alle sole checked; e il rollback avviene automaticamente, non solo manualmente. Per cambiare la regola si usano gli attributi `rollbackFor` e `noRollbackFor`.","en":"In summary: by default `@Transactional` rolls back only on unchecked exceptions, that is `RuntimeException` and its subclasses, and on `Error`s; for checked exceptions, instead, it still commits. It is a default that surprises those who expect a rollback on any error.\nThe other options: it does not roll back on any exception, for checked ones you need to configure `rollbackFor`; the behavior is the opposite of limiting rollback to checked exceptions only; and rollback happens automatically, not only manually. To change the rule you use the `rollbackFor` and `noRollbackFor` attributes."}}]},{"id":"sql","title":"Database \u0026 SQL","questions":[{"type":"mcq","prompt":{"it":"Devi restituire tutti i clienti della tabella `customers`, includendo anche quelli che non hanno alcun record in `orders` (con le colonne di `orders` a NULL). Quale operazione e corretta?","en":"You need to return all customers from the `customers` table, including those that have no records in `orders` (with the `orders` columns set to NULL). Which operation is correct?"},"code":"","options":[{"it":"INNER JOIN tra customers e orders","en":"INNER JOIN between customers and orders"},{"it":"LEFT JOIN con customers come tabella di sinistra","en":"LEFT JOIN with customers as the left table"},{"it":"RIGHT JOIN con customers come tabella di sinistra","en":"RIGHT JOIN with customers as the left table"},{"it":"CROSS JOIN tra customers e orders","en":"CROSS JOIN between customers and orders"}],"correct":1,"explanation":{"it":"In sintesi: mi serve preservare TUTTE le righe di `customers` anche senza corrispondenza in `orders`, quindi uso un `LEFT JOIN` con `customers` come tabella di sinistra; il join mantiene ogni cliente e riempie con `NULL` le colonne di `orders` dove non c\u0027e match. E il pattern classico per trovare i clienti senza ordini (`WHERE orders.id IS NULL`).\nLe altre opzioni: l\u0027`INNER JOIN` scarta i clienti senza ordini; il `RIGHT JOIN` con `customers` a sinistra preserverebbe `orders` (la destra), perdendo i clienti orfani; il `CROSS JOIN` produce il prodotto cartesiano senza condizione di match.","en":"In summary: I need to preserve ALL rows in `customers` even without a match in `orders`, so I use a `LEFT JOIN` with `customers` as the left table; the join keeps every customer and fills the `orders` columns with `NULL` where there is no match. This is the classic pattern for finding customers with no orders (`WHERE orders.id IS NULL`).\nThe other options: an `INNER JOIN` drops customers with no orders; a `RIGHT JOIN` with `customers` on the left would preserve `orders` (the right side), losing the orphan customers; a `CROSS JOIN` produces the Cartesian product with no match condition."}},{"type":"code","prompt":{"it":"Quante righe restituisce questa query?","en":"How many rows does this query return?"},"code":"-- t1.id = {1, 2, 3}\n-- t2.id = {2, 2, 4}\n\nSELECT COUNT(*)\nFROM t1\nINNER JOIN t2 ON t1.id = t2.id;","options":[{"it":"1","en":"1"},{"it":"2","en":"2"},{"it":"3","en":"3"},{"it":"5","en":"5"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027`INNER JOIN` accoppia solo le righe con `id` coincidente e MOLTIPLICA in base al numero di corrispondenze. L\u0027unico valore comune e `id=2`: compare una volta in `t1` e due volte in `t2`, quindi genera 1x2 = 2 righe. Gli `id` 1 e 3 non hanno match in `t2`, il 4 non ha match in `t1`.\nLe altre opzioni: `1` ignora la moltiplicazione contando solo la riga di `t1`; `3` conta erroneamente le righe di `t1`; `5` sommerebbe cose senza senso rispetto alla semantica del join.","en":"In summary: the `INNER JOIN` pairs only rows with matching `id` and MULTIPLIES based on the number of matches. The only common value is `id=2`: it appears once in `t1` and twice in `t2`, so it produces 1x2 = 2 rows. `id`s 1 and 3 have no match in `t2`, and 4 has no match in `t1`.\nThe other options: `1` ignores the multiplication and counts only the `t1` row; `3` wrongly counts the `t1` rows; `5` would add up things that make no sense given the join semantics."}},{"type":"code","prompt":{"it":"Cosa restituisce la query, nell\u0027ordine COUNT(*), COUNT(bonus), SUM(bonus)?","en":"What does the query return, in the order COUNT(*), COUNT(bonus), SUM(bonus)?"},"code":"-- employees.bonus = {100, NULL, 200, NULL, 50}\n\nSELECT COUNT(*), COUNT(bonus), SUM(bonus)\nFROM employees;","options":[{"it":"5, 5, 350","en":"5, 5, 350"},{"it":"5, 3, 350","en":"5, 3, 350"},{"it":"3, 3, 350","en":"3, 3, 350"},{"it":"5, 3, NULL","en":"5, 3, NULL"}],"correct":1,"explanation":{"it":"In sintesi: `COUNT(*)` conta tutte le righe fisiche, `NULL` inclusi, quindi 5; `COUNT(bonus)` conta solo i valori NON NULL della colonna, quindi 3; `SUM(bonus)` ignora i `NULL` e somma 100+200+50 = 350. La regola chiave e che tutte le funzioni di aggregazione TRANNE `COUNT(*)` scartano i `NULL` prima del calcolo.\nLe altre opzioni: `5,5,350` sbaglia `COUNT(bonus)` credendo che conti anche i `NULL`; `3,3,350` sbaglia `COUNT(*)`; `5,3,NULL` presume erroneamente che un `NULL` propaghi `NULL` nella somma.","en":"In summary: `COUNT(*)` counts all physical rows, `NULL`s included, so 5; `COUNT(bonus)` counts only the NON-NULL values of the column, so 3; `SUM(bonus)` ignores the `NULL`s and adds 100+200+50 = 350. The key rule is that every aggregate function EXCEPT `COUNT(*)` discards `NULL`s before computing.\nThe other options: `5,5,350` gets `COUNT(bonus)` wrong by assuming it also counts the `NULL`s; `3,3,350` gets `COUNT(*)` wrong; `5,3,NULL` wrongly assumes that a `NULL` propagates `NULL` into the sum."}},{"type":"mcq","prompt":{"it":"Qual e la differenza corretta tra WHERE e HAVING?","en":"What is the correct difference between WHERE and HAVING?"},"code":"","options":[{"it":"WHERE filtra le righe PRIMA del raggruppamento; HAVING filtra i gruppi DOPO il GROUP BY e puo usare funzioni di aggregazione","en":"WHERE filters rows BEFORE grouping; HAVING filters groups AFTER the GROUP BY and can use aggregate functions"},{"it":"Sono equivalenti, HAVING e solo sintassi piu recente","en":"They are equivalent, HAVING is just more recent syntax"},{"it":"HAVING filtra le righe prima del GROUP BY, WHERE dopo","en":"HAVING filters rows before the GROUP BY, WHERE after"},{"it":"WHERE puo usare funzioni di aggregazione come SUM, HAVING no","en":"WHERE can use aggregate functions like SUM, HAVING cannot"}],"correct":0,"explanation":{"it":"In sintesi: `WHERE` filtra a livello di riga PRIMA del raggruppamento, quindi non puo referenziare le aggregazioni; `HAVING` agisce DOPO il `GROUP BY`, sui gruppi gia formati, e puo usare condizioni su aggregati come `HAVING SUM(amount) \u003e 100`. Riflette l\u0027ordine logico della pipeline: `FROM` -\u003e `WHERE` -\u003e `GROUP BY` -\u003e `HAVING` -\u003e `SELECT`.\nLe altre opzioni: non sono equivalenti perche operano in fasi diverse; l\u0027opzione che li inverte sbaglia l\u0027ordine; e attribuire a `WHERE` l\u0027uso di aggregati e falso, e prerogativa esclusiva di `HAVING`.","en":"In summary: `WHERE` filters at the row level BEFORE grouping, so it cannot reference aggregates; `HAVING` acts AFTER the `GROUP BY`, on the already-formed groups, and can use conditions on aggregates such as `HAVING SUM(amount) \u003e 100`. This reflects the logical order of the pipeline: `FROM` -\u003e `WHERE` -\u003e `GROUP BY` -\u003e `HAVING` -\u003e `SELECT`.\nThe other options: they are not equivalent because they operate at different stages; the option that swaps them gets the order wrong; and attributing the use of aggregates to `WHERE` is false, that is the exclusive prerogative of `HAVING`."}},{"type":"truefalse","prompt":{"it":"In SQL standard e lecito scrivere `SELECT region FROM sales WHERE SUM(amount) \u003e 100 GROUP BY region`, cioe usare una funzione di aggregazione nella clausola WHERE.","en":"In standard SQL it is valid to write `SELECT region FROM sales WHERE SUM(amount) \u003e 100 GROUP BY region`, that is, to use an aggregate function in the WHERE clause."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: Falso. `WHERE` viene valutato riga per riga PRIMA del raggruppamento, quando le aggregazioni non esistono ancora, quindi mettere `SUM()` nella `WHERE` genera errore. La condizione su un aggregato va spostata in `HAVING`: `... GROUP BY region HAVING SUM(amount) \u003e 100`. E l\u0027ordine logico `FROM` -\u003e `WHERE` -\u003e `GROUP BY` -\u003e `HAVING` -\u003e `SELECT` a imporlo.\nLe altre opzioni: l\u0027errore tipico e credere che `WHERE` e `HAVING` siano intercambiabili; in realta solo `HAVING` vede i risultati delle aggregazioni.","en":"In summary: False. `WHERE` is evaluated row by row BEFORE grouping, when the aggregates do not yet exist, so putting `SUM()` in the `WHERE` raises an error. The condition on an aggregate must be moved to `HAVING`: `... GROUP BY region HAVING SUM(amount) \u003e 100`. It is the logical order `FROM` -\u003e `WHERE` -\u003e `GROUP BY` -\u003e `HAVING` -\u003e `SELECT` that enforces this.\nThe other options: the typical mistake is believing that `WHERE` and `HAVING` are interchangeable; in reality only `HAVING` sees the results of the aggregates."}},{"type":"code","prompt":{"it":"Qual e l\u0027output della query (ordinato per region)?","en":"What is the output of the query (ordered by region)?"},"code":"-- sales(region, amount):\n-- (\u0027EU\u0027, 10), (\u0027EU\u0027, 20), (\u0027US\u0027, 30), (\u0027US\u0027, NULL)\n\nSELECT region, SUM(amount) AS tot\nFROM sales\nGROUP BY region\nORDER BY region;","options":[{"it":"EU 30, US 30","en":"EU 30, US 30"},{"it":"EU 30, US NULL","en":"EU 30, US NULL"},{"it":"EU 30, US 30, piu una riga separata per il NULL","en":"EU 30, US 30, plus a separate row for the NULL"},{"it":"EU 30","en":"EU 30"}],"correct":0,"explanation":{"it":"In sintesi: il `GROUP BY` crea un gruppo per ogni valore distinto di `region`. Per `EU`: 10+20 = 30. Per `US`: `SUM` ignora il `NULL` e somma il solo 30, dando 30 (non `NULL`). Il `NULL` non forma un gruppo a se: appartiene alla riga con region `US`.\nLe altre opzioni: `US NULL` e l\u0027errore classico di chi crede che un `NULL` nella somma propaghi `NULL`, mentre `SUM` lo scarta; la riga separata per il `NULL` confonde il valore della colonna aggregata con la chiave di raggruppamento; `EU 30` da sola dimentica il gruppo `US`.","en":"In summary: the `GROUP BY` creates one group for each distinct value of `region`. For `EU`: 10+20 = 30. For `US`: `SUM` ignores the `NULL` and adds only the 30, giving 30 (not `NULL`). The `NULL` does not form a group of its own: it belongs to the row with region `US`.\nThe other options: `US NULL` is the classic mistake of thinking that a `NULL` in the sum propagates `NULL`, whereas `SUM` discards it; the separate row for the `NULL` confuses the value of the aggregated column with the grouping key; `EU 30` on its own forgets the `US` group."}},{"type":"mcq","prompt":{"it":"Quale caratteristica distingue una subquery CORRELATA da una non correlata?","en":"Which characteristic distinguishes a CORRELATED subquery from a non-correlated one?"},"code":"","options":[{"it":"La subquery correlata referenzia una colonna della query esterna e viene (logicamente) rivalutata per ogni riga esterna","en":"The correlated subquery references a column from the outer query and is (logically) re-evaluated for each outer row"},{"it":"La subquery correlata restituisce sempre una sola riga","en":"The correlated subquery always returns a single row"},{"it":"La subquery correlata non puo essere usata con EXISTS","en":"The correlated subquery cannot be used with EXISTS"},{"it":"La subquery correlata viene eseguita una sola volta prima della query esterna","en":"The correlated subquery is executed only once, before the outer query"}],"correct":0,"explanation":{"it":"In sintesi: una subquery CORRELATA referenzia una colonna della query esterna (es. `WHERE e.dept_id = d.id`), quindi logicamente viene rivalutata per ogni riga esterna; questa dipendenza dall\u0027esterno E la sua definizione. E l\u0027uso tipico di `EXISTS`.\nLe altre opzioni: la subquery NON correlata e autonoma e si valuta una sola volta; `EXISTS` e proprio il costrutto piu usato con le correlate; e il numero di righe restituite non discrimina la correlazione, dipende dalla logica della query.","en":"In summary: a CORRELATED subquery references a column from the outer query (e.g. `WHERE e.dept_id = d.id`), so logically it is re-evaluated for each outer row; this dependency on the outer query IS its definition. It is the typical use of `EXISTS`.\nThe other options: a NON-correlated subquery is self-contained and is evaluated only once; `EXISTS` is precisely the construct most used with correlated subqueries; and the number of rows returned does not determine correlation, it depends on the query logic."}},{"type":"code","prompt":{"it":"Cosa stampa la query?","en":"What does the query print?"},"code":"SELECT\n  CASE\n    WHEN NULL = NULL  THEN \u0027uguale\u0027\n    WHEN NULL \u003c\u003e NULL THEN \u0027diverso\u0027\n    ELSE \u0027sconosciuto\u0027\n  END AS risultato;","options":[{"it":"uguale","en":"uguale"},{"it":"diverso","en":"diverso"},{"it":"sconosciuto","en":"sconosciuto"},{"it":"errore di sintassi","en":"syntax error"}],"correct":2,"explanation":{"it":"In sintesi: nella logica a tre valori di SQL qualsiasi confronto con `NULL` tramite `=` o `\u003c\u003e` restituisce `UNKNOWN`, non `TRUE` ne `FALSE`. Percio ne il primo ne il secondo `WHEN` sono soddisfatti (`UNKNOWN` non e `TRUE`) e il `CASE` ricade sull\u0027`ELSE`, dando \u0027sconosciuto\u0027. Per testare i `NULL` si usa `IS NULL` / `IS NOT NULL`.\nLe altre opzioni: \u0027uguale\u0027 e \u0027diverso\u0027 presumono che `NULL = NULL` o `NULL \u003c\u003e NULL` diano `TRUE`, cosa impossibile; non e un errore di sintassi, la query e valida.","en":"In summary: in SQL\u0027s three-valued logic, any comparison with `NULL` using `=` or `\u003c\u003e` returns `UNKNOWN`, neither `TRUE` nor `FALSE`. Therefore neither the first nor the second `WHEN` is satisfied (`UNKNOWN` is not `TRUE`) and the `CASE` falls through to the `ELSE`, giving \u0027sconosciuto\u0027. To test for `NULL`s you use `IS NULL` / `IS NOT NULL`.\nThe other options: \u0027uguale\u0027 and \u0027diverso\u0027 assume that `NULL = NULL` or `NULL \u003c\u003e NULL` yield `TRUE`, which is impossible; it is not a syntax error, the query is valid."}},{"type":"mcq","prompt":{"it":"Cosa restituisce `SELECT * FROM t WHERE id NOT IN (1, 2, NULL)`?","en":"What does `SELECT * FROM t WHERE id NOT IN (1, 2, NULL)` return?"},"code":"","options":[{"it":"Le righe con id diverso da 1 e 2, ignorando il NULL","en":"The rows with id other than 1 and 2, ignoring the NULL"},{"it":"Sempre zero righe: nessuna riga puo soddisfare il predicato","en":"Always zero rows: no row can satisfy the predicate"},{"it":"Un errore, perche NULL non e ammesso dentro IN","en":"An error, because NULL is not allowed inside IN"},{"it":"Tutte le righe della tabella","en":"All the rows in the table"}],"correct":1,"explanation":{"it":"In sintesi: `NOT IN (1,2,NULL)` viene espanso in `id \u003c\u003e 1 AND id \u003c\u003e 2 AND id \u003c\u003e NULL`; il termine `id \u003c\u003e NULL` vale sempre `UNKNOWN`, e `qualcosa AND UNKNOWN` non puo mai diventare `TRUE`. Quindi la query non restituisce MAI righe: e il classico bug del `NOT IN` con un `NULL` nella lista (o proveniente da una subquery). La soluzione e filtrare i `NULL` o usare `NOT EXISTS`.\nLe altre opzioni: non ignora il `NULL` come farebbe un `IN` positivo; non e un errore di sintassi, `NULL` e ammesso in `IN`; e non restituisce tutte le righe.","en":"In summary: `NOT IN (1,2,NULL)` expands to `id \u003c\u003e 1 AND id \u003c\u003e 2 AND id \u003c\u003e NULL`; the term `id \u003c\u003e NULL` is always `UNKNOWN`, and `something AND UNKNOWN` can never become `TRUE`. So the query NEVER returns rows: this is the classic `NOT IN` bug with a `NULL` in the list (or coming from a subquery). The fix is to filter out the `NULL`s or use `NOT EXISTS`.\nThe other options: it does not ignore the `NULL` the way a positive `IN` would; it is not a syntax error, `NULL` is allowed in `IN`; and it does not return all the rows."}},{"type":"code","prompt":{"it":"Quali righe restituisce la query?","en":"Which rows does the query return?"},"code":"-- t.val = {1, NULL, 3}\n\nSELECT val FROM t WHERE val \u003c\u003e 1;","options":[{"it":"3","en":"3"},{"it":"NULL, 3","en":"NULL, 3"},{"it":"1, NULL, 3","en":"1, NULL, 3"},{"it":"nessuna riga","en":"no rows"}],"correct":0,"explanation":{"it":"In sintesi: il predicato `val \u003c\u003e 1` e `TRUE` solo per `val=3`. Per `val=1` e `FALSE`; per `val=NULL` il confronto `NULL \u003c\u003e 1` da `UNKNOWN`, e la `WHERE` conserva solo le righe in cui il predicato e `TRUE`, quindi il `NULL` viene scartato. Risultato: solo 3.\nLe altre opzioni: \u0027NULL, 3\u0027 nasce dal credere che `\u003c\u003e` includa i `NULL`, ma la logica a tre valori li esclude sia da `= 1` sia da `\u003c\u003e 1`; le altre ignorano che `val=1` e escluso o che il `NULL` non passa la `WHERE`.","en":"In summary: the predicate `val \u003c\u003e 1` is `TRUE` only for `val=3`. For `val=1` it is `FALSE`; for `val=NULL` the comparison `NULL \u003c\u003e 1` yields `UNKNOWN`, and the `WHERE` keeps only the rows where the predicate is `TRUE`, so the `NULL` is discarded. Result: just 3.\nThe other options: \u0027NULL, 3\u0027 comes from thinking that `\u003c\u003e` includes `NULL`s, but three-valued logic excludes them from both `= 1` and `\u003c\u003e 1`; the others ignore that `val=1` is excluded or that the `NULL` does not pass the `WHERE`."}},{"type":"mcq","prompt":{"it":"Con un indice composito su `(last_name, first_name)`, quale predicato PUO sfruttare l\u0027indice per la ricerca?","en":"With a composite index on `(last_name, first_name)`, which predicate CAN leverage the index for the search?"},"code":"","options":[{"it":"WHERE first_name = \u0027Mario\u0027","en":"WHERE first_name = \u0027Mario\u0027"},{"it":"WHERE last_name = \u0027Rossi\u0027","en":"WHERE last_name = \u0027Rossi\u0027"},{"it":"WHERE first_name = \u0027Mario\u0027 AND YEAR(hire_date) = 2020","en":"WHERE first_name = \u0027Mario\u0027 AND YEAR(hire_date) = 2020"},{"it":"WHERE last_name LIKE \u0027%ossi\u0027","en":"WHERE last_name LIKE \u0027%ossi\u0027"}],"correct":1,"explanation":{"it":"In sintesi: vale la regola del prefisso piu a sinistra (leftmost prefix): l\u0027indice composito e ordinato prima per `last_name` e poi per `first_name`, quindi puo essere sfruttato solo se il filtro parte da `last_name`. `WHERE last_name = \u0027Rossi\u0027` usa il prefisso e beneficia dell\u0027indice.\nLe altre opzioni: filtrare solo su `first_name` salta la prima colonna e non permette la ricerca ordinata; combinare `first_name` con `YEAR(hire_date)` ha lo stesso problema; il wildcard iniziale `LIKE \u0027%ossi\u0027` su `last_name` impedisce lo scan del prefisso ordinato.","en":"In summary: the leftmost-prefix rule applies: the composite index is sorted first by `last_name` and then by `first_name`, so it can be leveraged only if the filter starts from `last_name`. `WHERE last_name = \u0027Rossi\u0027` uses the prefix and benefits from the index.\nThe other options: filtering only on `first_name` skips the first column and does not allow an ordered search; combining `first_name` with `YEAR(hire_date)` has the same problem; the leading wildcard `LIKE \u0027%ossi\u0027` on `last_name` prevents scanning the sorted prefix."}},{"type":"mcq","prompt":{"it":"Cosa si intende per covering index rispetto a una specifica query?","en":"What is meant by a covering index with respect to a specific query?"},"code":"","options":[{"it":"Un indice che contiene tutte le colonne necessarie alla query, permettendo di rispondere senza accedere alla tabella (index-only scan)","en":"An index that contains all the columns the query needs, allowing it to be answered without accessing the table (index-only scan)"},{"it":"Un indice che include tutte le colonne della tabella","en":"An index that includes all the columns of the table"},{"it":"Un indice unico che impedisce i duplicati","en":"A unique index that prevents duplicates"},{"it":"Un indice che si aggiorna automaticamente a ogni commit","en":"An index that updates automatically on every commit"}],"correct":0,"explanation":{"it":"In sintesi: un covering index e relativo a una query specifica: se l\u0027indice contiene sia le colonne del filtro sia quelle proiettate nella `SELECT`, il motore risponde leggendo SOLO l\u0027indice (index-only scan), evitando il lookup sulla tabella/heap e riducendo l\u0027I/O.\nLe altre opzioni: non significa includere tutte le colonne della tabella (sarebbe uno spreco); l\u0027unicita e un\u0027altra proprieta (indice UNIQUE); e l\u0027aggiornamento automatico a ogni modifica vale per qualsiasi indice, non definisce il covering.","en":"In summary: a covering index is relative to a specific query: if the index contains both the filter columns and those projected in the `SELECT`, the engine answers by reading ONLY the index (index-only scan), avoiding the lookup on the table/heap and reducing I/O.\nThe other options: it does not mean including all the columns of the table (that would be wasteful); uniqueness is a different property (a `UNIQUE` index); and automatic updating on every change applies to any index, it does not define a covering index."}},{"type":"truefalse","prompt":{"it":"Creare un indice su una colonna a bassissima cardinalita (es. un flag attivo/non attivo con distribuzione circa 50/50) e in genere molto efficace per velocizzare le SELECT che filtrano su quella colonna.","en":"Creating an index on a very low-cardinality column (e.g. an active/inactive flag with a roughly 50/50 distribution) is generally very effective at speeding up SELECTs that filter on that column."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: Falso. Un indice conviene quando ha alta selettivita, cioe filtra una piccola frazione delle righe. Con una colonna a bassa cardinalita che seleziona circa meta tabella, l\u0027ottimizzatore preferisce spesso un full table scan, perche seguire l\u0027indice e poi fare tantissimi lookup costa piu della scansione sequenziale; l\u0027indice aggiunge overhead di scrittura senza reale beneficio in lettura.\nLe altre opzioni: l\u0027errore tipico e assumere che un indice velocizzi SEMPRE le SELECT; conta la selettivita, salvo casi particolari come indici parziali o covering.","en":"In summary: False. An index pays off when it has high selectivity, that is, it filters out a small fraction of the rows. With a low-cardinality column that selects about half the table, the optimizer often prefers a full table scan, because following the index and then doing a huge number of lookups costs more than a sequential scan; the index adds write overhead with no real read benefit.\nThe other options: the typical mistake is assuming that an index ALWAYS speeds up SELECTs; what matters is selectivity, except in special cases such as partial or covering indexes."}},{"type":"mcq","prompt":{"it":"Perche `WHERE UPPER(email) = \u0027X@Y.COM\u0027` spesso NON usa l\u0027indice B-tree su `email`?","en":"Why does `WHERE UPPER(email) = \u0027X@Y.COM\u0027` often NOT use the B-tree index on `email`?"},"code":"","options":[{"it":"Applicare una funzione alla colonna rende il predicato non-sargable: l\u0027indice e sui valori di email, non su UPPER(email)","en":"Applying a function to the column makes the predicate non-sargable: the index is on the values of email, not on UPPER(email)"},{"it":"Gli indici B-tree non supportano il tipo stringa","en":"B-tree indexes do not support the string type"},{"it":"La funzione UPPER disabilita sempre l\u0027ottimizzatore per l\u0027intera query","en":"The UPPER function always disables the optimizer for the entire query"},{"it":"Un indice B-tree puo essere usato solo con LIKE","en":"A B-tree index can only be used with LIKE"}],"correct":0,"explanation":{"it":"In sintesi: applicare una funzione alla colonna rende il predicato non-sargable. L\u0027indice B-tree memorizza i valori grezzi di `email` in ordine, non i valori di `UPPER(email)`; percio con `WHERE UPPER(email) = \u0027X@Y.COM\u0027` il motore dovrebbe conoscere `UPPER(email)` di ogni riga, informazione che l\u0027indice non contiene, e ripiega sul table scan. Si risolve con un indice funzionale su `UPPER(email)` o una colonna normalizzata.\nLe altre opzioni: i B-tree supportano benissimo le stringhe e funzionano con match esatti e range (non solo `LIKE`); e `UPPER` non disabilita l\u0027ottimizzatore per l\u0027intera query, impedisce solo l\u0027uso di quello specifico indice.","en":"In summary: applying a function to the column makes the predicate non-sargable. The B-tree index stores the raw values of `email` in order, not the values of `UPPER(email)`; so with `WHERE UPPER(email) = \u0027X@Y.COM\u0027` the engine would need to know `UPPER(email)` for every row, information the index does not contain, and it falls back to a table scan. This is solved with a function-based index on `UPPER(email)` or a normalized column.\nThe other options: B-trees support strings just fine and work with exact matches and ranges (not only `LIKE`); and `UPPER` does not disable the optimizer for the entire query, it only prevents the use of that specific index."}},{"type":"code","prompt":{"it":"Considerando l\u0027indice B-tree su customers(name), quale affermazione e corretta?","en":"Considering the B-tree index on customers(name), which statement is correct?"},"code":"-- indice B-tree su customers(name)\nSELECT * FROM customers WHERE name LIKE \u0027%rossi\u0027;","options":[{"it":"L\u0027indice B-tree non puo essere usato per una ricerca efficiente: il wildcard iniziale impedisce di sfruttare l\u0027ordinamento del prefisso","en":"The B-tree index cannot be used for an efficient search: the leading wildcard prevents leveraging the prefix ordering"},{"it":"L\u0027indice viene usato normalmente, come per un match esatto","en":"The index is used normally, as for an exact match"},{"it":"L\u0027indice viene usato solo se name e la chiave primaria","en":"The index is used only if name is the primary key"},{"it":"La query e sintatticamente invalida","en":"The query is syntactically invalid"}],"correct":0,"explanation":{"it":"In sintesi: un B-tree ordina le stringhe da sinistra a destra e puo saltare a un prefisso noto. Con il wildcard INIZIALE (`\u0027%rossi\u0027`) il prefisso e sconosciuto, quindi il motore deve esaminare tutte le voci e ripiega su un full scan: l\u0027indice non e utile per una ricerca efficiente. Al contrario `LIKE \u0027rossi%\u0027` (wildcard finale) usa l\u0027indice come un range sul prefisso.\nLe altre opzioni: non viene usato come per un match esatto proprio per il wildcard iniziale; non dipende dall\u0027essere chiave primaria; e la sintassi e perfettamente valida.","en":"In summary: a B-tree sorts strings from left to right and can jump to a known prefix. With the LEADING wildcard (`\u0027%rossi\u0027`) the prefix is unknown, so the engine must examine all entries and falls back to a full scan: the index is not useful for an efficient search. Conversely, `LIKE \u0027rossi%\u0027` (trailing wildcard) uses the index as a range on the prefix.\nThe other options: it is not used as for an exact match, precisely because of the leading wildcard; it does not depend on being the primary key; and the syntax is perfectly valid."}},{"type":"mcq","prompt":{"it":"Quale situazione viola la Prima Forma Normale (1NF)?","en":"Which situation violates First Normal Form (1NF)?"},"code":"","options":[{"it":"Una colonna `phone_numbers` che contiene la stringa \u0027333-111, 340-222\u0027 con piu numeri in un solo campo","en":"A `phone_numbers` column containing the string \u0027333-111, 340-222\u0027 with multiple numbers in a single field"},{"it":"Una tabella priva di chiave esterna","en":"A table without a foreign key"},{"it":"Una colonna non-chiave che dipende solo da parte di una chiave primaria composita","en":"A non-key column that depends on only part of a composite primary key"},{"it":"Una colonna non-chiave che dipende da un\u0027altra colonna non-chiave","en":"A non-key column that depends on another non-key column"}],"correct":0,"explanation":{"it":"In sintesi: la 1NF richiede valori ATOMICI (indivisibili) in ogni cella e vieta i gruppi ripetuti; una colonna `phone_numbers` che stipa piu numeri come \u0027333-111, 340-222\u0027 in un solo campo la viola, perche il valore non e atomico. La correzione e scomporre i numeri in righe/tabella dedicata.\nLe altre opzioni: l\u0027assenza di chiave esterna non riguarda la normalizzazione; la dipendenza da parte di una chiave composita e una violazione di 2NF; la dipendenza tra colonne non-chiave e una violazione di 3NF, ed entrambe presuppongono la 1NF gia rispettata.","en":"In summary: 1NF requires ATOMIC (indivisible) values in every cell and forbids repeating groups; a `phone_numbers` column that crams multiple numbers such as \u0027333-111, 340-222\u0027 into a single field violates it, because the value is not atomic. The fix is to break the numbers out into separate rows/a dedicated table.\nThe other options: the absence of a foreign key has nothing to do with normalization; a dependency on part of a composite key is a 2NF violation; a dependency between non-key columns is a 3NF violation, and both presuppose that 1NF is already satisfied."}},{"type":"mcq","prompt":{"it":"In una tabella con chiave primaria composita `(order_id, product_id)`, la colonna `product_name` dipende solo da `product_id`. Quale forma normale e violata?","en":"In a table with composite primary key `(order_id, product_id)`, the column `product_name` depends only on `product_id`. Which normal form is violated?"},"code":"","options":[{"it":"2NF: dipendenza parziale dalla chiave primaria","en":"2NF: partial dependency on the primary key"},{"it":"1NF: valori non atomici","en":"1NF: non-atomic values"},{"it":"3NF: dipendenza transitiva","en":"3NF: transitive dependency"},{"it":"Nessuna, la tabella e gia in forma normale","en":"None, the table is already in normal form"}],"correct":0,"explanation":{"it":"In sintesi: la 2NF richiede che ogni attributo non-chiave dipenda dall\u0027INTERA chiave primaria, non da una sua parte. Qui `product_name` dipende solo da `product_id`, cioe da meta della chiave composita `(order_id, product_id)`: e una dipendenza parziale, la tipica violazione di 2NF. Si risolve spostando `product_name` in una tabella `products`.\nLe altre opzioni: non e 1NF perche i valori sono atomici; non e 3NF perche la dipendenza problematica e da una parte della chiave, non transitiva tra due attributi non-chiave; e una violazione c\u0027e, quindi non e gia normalizzata.","en":"In summary: 2NF requires that every non-key attribute depend on the ENTIRE primary key, not on a part of it. Here `product_name` depends only on `product_id`, that is, on half of the composite key `(order_id, product_id)`: this is a partial dependency, the typical 2NF violation. It is solved by moving `product_name` into a `products` table.\nThe other options: it is not 1NF because the values are atomic; it is not 3NF because the problematic dependency is on part of the key, not transitive between two non-key attributes; and there is a violation, so it is not already normalized."}},{"type":"mcq","prompt":{"it":"Tabella `employees(emp_id PK, dept_id, dept_name)` dove `dept_name` dipende da `dept_id`. Quale problema e quale forma e violata?","en":"Table `employees(emp_id PK, dept_id, dept_name)` where `dept_name` depends on `dept_id`. What is the problem and which normal form is violated?"},"code":"","options":[{"it":"Dipendenza transitiva (emp_id -\u003e dept_id -\u003e dept_name): viola la 3NF","en":"Transitive dependency (emp_id -\u003e dept_id -\u003e dept_name): violates 3NF"},{"it":"Dipendenza parziale: viola la 2NF","en":"Partial dependency: violates 2NF"},{"it":"Valori non atomici: viola la 1NF","en":"Non-atomic values: violates 1NF"},{"it":"Nessuna violazione","en":"No violation"}],"correct":0,"explanation":{"it":"In sintesi: la chiave primaria e la sola `emp_id` (non composita), quindi non esistono dipendenze parziali e la 2NF e automaticamente soddisfatta. Il problema e che `dept_name` dipende da `dept_id`, che a sua volta dipende da `emp_id`: una dipendenza TRANSITIVA tra attributi non-chiave (`emp_id -\u003e dept_id -\u003e dept_name`), che viola la 3NF. Si normalizza spostando `dept_id`/`dept_name` in una tabella `departments`, evitando anomalie di update.\nLe altre opzioni: non e 2NF perche la chiave non e composita; non e 1NF perche i valori sono atomici; e una violazione esiste eccome.","en":"In summary: the primary key is `emp_id` alone (not composite), so there are no partial dependencies and 2NF is automatically satisfied. The problem is that `dept_name` depends on `dept_id`, which in turn depends on `emp_id`: a TRANSITIVE dependency between non-key attributes (`emp_id -\u003e dept_id -\u003e dept_name`), which violates 3NF. You normalize it by moving `dept_id`/`dept_name` into a `departments` table, avoiding update anomalies.\nThe other options: it is not 2NF because the key is not composite; it is not 1NF because the values are atomic; and there most certainly is a violation."}},{"type":"mcq","prompt":{"it":"Un utente riceve la conferma di COMMIT; subito dopo il server subisce un blackout. Al riavvio la transazione confermata e ancora presente e integra. Quale proprieta ACID lo garantisce?","en":"A user receives the COMMIT confirmation; immediately afterwards the server suffers a power outage. On restart, the confirmed transaction is still present and intact. Which ACID property guarantees this?"},"code":"","options":[{"it":"Durability (Durabilita)","en":"Durability"},{"it":"Atomicity (Atomicita)","en":"Atomicity"},{"it":"Isolation (Isolamento)","en":"Isolation"},{"it":"Consistency (Consistenza)","en":"Consistency"}],"correct":0,"explanation":{"it":"In sintesi: e la Durability (Durabilita): una volta confermato il `COMMIT`, gli effetti sopravvivono a crash, riavvii e cadute di corrente, tipicamente grazie al write-ahead log (WAL) persistito su disco prima della conferma. E esattamente lo scenario \u0027commit confermato, poi blackout, dati ancora integri al riavvio\u0027.\nLe altre opzioni: l\u0027Atomicity riguarda il tutto-o-niente dentro la transazione; l\u0027Isolation l\u0027interferenza tra transazioni concorrenti; la Consistency il rispetto di vincoli e invarianti. Nessuna descrive la persistenza dopo il crash.","en":"In summary: it is Durability: once the `COMMIT` is confirmed, its effects survive crashes, restarts and power failures, typically thanks to the write-ahead log (WAL) persisted to disk before the confirmation. This is exactly the scenario \u0027commit confirmed, then outage, data still intact on restart\u0027.\nThe other options: Atomicity concerns the all-or-nothing within a transaction; Isolation the interference between concurrent transactions; Consistency the enforcement of constraints and invariants. None describes persistence after a crash."}},{"type":"mcq","prompt":{"it":"Un bonifico sottrae 100 dal conto A e aggiunge 100 al conto B. Se il secondo UPDATE fallisce, entrambe le modifiche vengono annullate. Quale proprieta ACID e in gioco?","en":"A transfer subtracts 100 from account A and adds 100 to account B. If the second UPDATE fails, both changes are rolled back. Which ACID property is at play?"},"code":"","options":[{"it":"Atomicity: la transazione e tutto-o-niente, quindi si esegue un rollback completo","en":"Atomicity: the transaction is all-or-nothing, so a complete rollback is performed"},{"it":"Durability","en":"Durability"},{"it":"Isolation","en":"Isolation"},{"it":"Consistency","en":"Consistency"}],"correct":0,"explanation":{"it":"In sintesi: e l\u0027Atomicity: una transazione e tutto-o-niente, tutte le operazioni riescono insieme o vengono annullate insieme. Il fallimento del secondo `UPDATE` innesca il rollback anche del primo, evitando lo stato incoerente in cui A e addebitato ma B non accreditato.\nLe altre opzioni: la Durability riguarda la persistenza dopo il commit; l\u0027Isolation la concorrenza; la Consistency il rispetto dei vincoli. Attenzione a non confondere Atomicity con Consistency: qui il punto e il rollback dell\u0027unita atomica, non la validazione di un vincolo.","en":"In summary: it is Atomicity: a transaction is all-or-nothing, all operations succeed together or are rolled back together. The failure of the second `UPDATE` triggers a rollback of the first one as well, avoiding the inconsistent state in which A is debited but B is not credited.\nThe other options: Durability concerns persistence after the commit; Isolation concurrency; Consistency the enforcement of constraints. Be careful not to confuse Atomicity with Consistency: here the point is the rollback of the atomic unit, not the validation of a constraint."}},{"type":"mcq","prompt":{"it":"Qual e il livello di isolamento MINIMO che previene il dirty read (lettura di dati non ancora committati da un\u0027altra transazione)?","en":"What is the MINIMUM isolation level that prevents a dirty read (reading data not yet committed by another transaction)?"},"code":"","options":[{"it":"READ COMMITTED","en":"READ COMMITTED"},{"it":"READ UNCOMMITTED","en":"READ UNCOMMITTED"},{"it":"SERIALIZABLE, che e l\u0027unico a prevenirlo","en":"SERIALIZABLE, which is the only one that prevents it"},{"it":"Nessun livello previene il dirty read","en":"No level prevents the dirty read"}],"correct":0,"explanation":{"it":"In sintesi: e READ COMMITTED. `READ UNCOMMITTED` e l\u0027unico livello standard che PERMETTE il dirty read; salendo a `READ COMMITTED` ogni lettura vede solo dati gia committati, quindi e il livello MINIMO che elimina il dirty read. La gerarchia standard e `READ UNCOMMITTED` \u003c `READ COMMITTED` \u003c `REPEATABLE READ` \u003c `SERIALIZABLE`.\nLe altre opzioni: `READ UNCOMMITTED` lo consente; `SERIALIZABLE` lo previene ma non e ne l\u0027unico ne il minimo; ed e falso che nessun livello lo prevenga.","en":"In summary: it is READ COMMITTED. `READ UNCOMMITTED` is the only standard level that ALLOWS dirty reads; moving up to `READ COMMITTED`, every read sees only already-committed data, so it is the MINIMUM level that eliminates the dirty read. The standard hierarchy is `READ UNCOMMITTED` \u003c `READ COMMITTED` \u003c `REPEATABLE READ` \u003c `SERIALIZABLE`.\nThe other options: `READ UNCOMMITTED` allows it; `SERIALIZABLE` prevents it but is neither the only one nor the minimum; and it is false that no level prevents it."}},{"type":"mcq","prompt":{"it":"Nello standard SQL, quale anomalia e prevenuta SOLO dal livello SERIALIZABLE e NON garantita da REPEATABLE READ?","en":"In the SQL standard, which anomaly is prevented ONLY by the SERIALIZABLE level and NOT guaranteed by REPEATABLE READ?"},"code":"","options":[{"it":"Phantom read","en":"Phantom read"},{"it":"Dirty read","en":"Dirty read"},{"it":"Non-repeatable read","en":"Non-repeatable read"},{"it":"Nessuna: REPEATABLE READ e SERIALIZABLE sono equivalenti","en":"None: REPEATABLE READ and SERIALIZABLE are equivalent"}],"correct":0,"explanation":{"it":"In sintesi: e il Phantom read. Nello standard SQL `REPEATABLE READ` blocca dirty read e non-repeatable read (le righe gia lette restano stabili), ma consente ancora i phantom: rieseguendo lo stesso predicato di range possono comparire NUOVE righe inserite da un\u0027altra transazione. Solo `SERIALIZABLE` elimina anche questi.\nLe altre opzioni: il dirty read e gia bloccato da `READ COMMITTED`, il non-repeatable read gia da `REPEATABLE READ`, quindi non sono esclusivi di `SERIALIZABLE`; e i due livelli non sono equivalenti. (Nota: InnoDB con next-key lock riduce i phantom gia in `REPEATABLE READ`, ma lo standard non lo garantisce.)","en":"In summary: it is the Phantom read. In the SQL standard, `REPEATABLE READ` blocks dirty reads and non-repeatable reads (rows already read stay stable), but still allows phantoms: re-running the same range predicate, NEW rows inserted by another transaction may appear. Only `SERIALIZABLE` eliminates these too.\nThe other options: the dirty read is already blocked by `READ COMMITTED`, the non-repeatable read already by `REPEATABLE READ`, so they are not exclusive to `SERIALIZABLE`; and the two levels are not equivalent. (Note: InnoDB with next-key locks reduces phantoms already at `REPEATABLE READ`, but the standard does not guarantee it.)"}},{"type":"truefalse","prompt":{"it":"Un non-repeatable read si verifica quando, all\u0027interno della stessa transazione, due letture della STESSA riga restituiscono valori diversi perche un\u0027altra transazione l\u0027ha modificata e committata nel frattempo.","en":"A non-repeatable read occurs when, within the same transaction, two reads of the SAME row return different values because another transaction modified and committed it in the meantime."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: Vero. Il non-repeatable read e proprio la ri-lettura della STESSA riga che cambia valore tra due `SELECT` nella medesima transazione, perche un\u0027altra transazione l\u0027ha modificata (`UPDATE`/`DELETE`) e committata nel frattempo. `REPEATABLE READ` lo previene.\nLe altre opzioni: l\u0027errore tipico e confonderlo con il phantom read, che riguarda invece la comparsa/scomparsa di INTERE righe che soddisfano un predicato di range (per `INSERT`/`DELETE`), non la modifica di una riga gia letta; quello lo previene solo `SERIALIZABLE`.","en":"In summary: True. A non-repeatable read is precisely the re-reading of the SAME row whose value changes between two `SELECT`s in the same transaction, because another transaction modified it (`UPDATE`/`DELETE`) and committed in the meantime. `REPEATABLE READ` prevents it.\nThe other options: the typical mistake is confusing it with the phantom read, which instead concerns the appearance/disappearance of ENTIRE rows matching a range predicate (due to `INSERT`/`DELETE`), not the modification of an already-read row; that one is prevented only by `SERIALIZABLE`."}},{"type":"code","prompt":{"it":"Quali valori assumono le colonne rn (ROW_NUMBER) e rk (RANK) per ogni riga?","en":"What values do the rn (ROW_NUMBER) and rk (RANK) columns take for each row?"},"code":"-- scores(name, pts):\n-- (\u0027A\u0027, 90), (\u0027B\u0027, 90), (\u0027C\u0027, 80)\n\nSELECT name, pts,\n  ROW_NUMBER() OVER (ORDER BY pts DESC) AS rn,\n  RANK()       OVER (ORDER BY pts DESC) AS rk\nFROM scores;","options":[{"it":"A(rn1,rk1), B(rn2,rk1), C(rn3,rk3)","en":"A(rn1,rk1), B(rn2,rk1), C(rn3,rk3)"},{"it":"A(rn1,rk1), B(rn2,rk2), C(rn3,rk3)","en":"A(rn1,rk1), B(rn2,rk2), C(rn3,rk3)"},{"it":"A(rn1,rk1), B(rn1,rk1), C(rn3,rk3)","en":"A(rn1,rk1), B(rn1,rk1), C(rn3,rk3)"},{"it":"A(rn1,rk1), B(rn2,rk1), C(rn3,rk2)","en":"A(rn1,rk1), B(rn2,rk1), C(rn3,rk2)"}],"correct":0,"explanation":{"it":"In sintesi: `ROW_NUMBER` assegna un progressivo sempre univoco (1,2,3) anche in caso di parita, mentre `RANK` da lo stesso rango ai pari-merito e poi SALTA i valori consumati. A e B sono entrambi 90, quindi `rk=1` per entrambi, e C (80) riceve `rk=3`, lasciando il buco del 2. I `rn` restano distinti: A(rn1,rk1), B(rn2,rk1), C(rn3,rk3).\nLe altre opzioni: `B(rn2,rk2)` sbaglia perche i pari-merito condividono il rango; `B(rn1,rk1)` e impossibile, `ROW_NUMBER` non produce mai duplicati; `C(rn3,rk2)` darebbe il comportamento di `DENSE_RANK`, non di `RANK`.","en":"In summary: `ROW_NUMBER` assigns an always-unique sequential number (1,2,3) even in case of ties, while `RANK` gives the same rank to tied rows and then SKIPS the consumed values. A and B are both 90, so `rk=1` for both, and C (80) gets `rk=3`, leaving a gap at 2. The `rn`s stay distinct: A(rn1,rk1), B(rn2,rk1), C(rn3,rk3).\nThe other options: `B(rn2,rk2)` is wrong because ties share the rank; `B(rn1,rk1)` is impossible, `ROW_NUMBER` never produces duplicates; `C(rn3,rk2)` would be the behavior of `DENSE_RANK`, not `RANK`."}},{"type":"mcq","prompt":{"it":"In presenza di valori a pari merito, qual e la differenza tra RANK e DENSE_RANK?","en":"In the presence of tied values, what is the difference between RANK and DENSE_RANK?"},"code":"","options":[{"it":"RANK lascia un buco dopo i pari-merito (es. 1,1,3), DENSE_RANK no (es. 1,1,2)","en":"RANK leaves a gap after ties (e.g. 1,1,3), DENSE_RANK does not (e.g. 1,1,2)"},{"it":"Sono funzionalmente identiche","en":"They are functionally identical"},{"it":"DENSE_RANK lascia il buco, RANK non lo lascia","en":"DENSE_RANK leaves the gap, RANK does not"},{"it":"RANK non ammette la clausola ORDER BY nella window","en":"RANK does not allow the ORDER BY clause in the window"}],"correct":0,"explanation":{"it":"In sintesi: entrambe assegnano lo stesso rango alle righe a pari merito, ma differiscono sul valore successivo: `RANK` lascia un BUCO saltando tanti valori quanti sono i pari-merito (es. 1,1,3), mentre `DENSE_RANK` prosegue senza salti (1,1,2). Se serve il conteggio \u0027denso\u0027 delle posizioni si usa `DENSE_RANK`.\nLe altre opzioni: non sono identiche, differiscono proprio sul gap; l\u0027opzione che dice \u0027DENSE_RANK lascia il buco\u0027 inverte i comportamenti; ed entrambe richiedono un `ORDER BY` nella clausola `OVER` per definire l\u0027ordinamento del ranking.","en":"In summary: both assign the same rank to tied rows, but they differ on the next value: `RANK` leaves a GAP, skipping as many values as there are ties (e.g. 1,1,3), while `DENSE_RANK` continues without skips (1,1,2). If you need a \u0027dense\u0027 count of positions you use `DENSE_RANK`.\nThe other options: they are not identical, they differ precisely on the gap; the option saying \u0027DENSE_RANK leaves the gap\u0027 swaps the behaviors; and both require an `ORDER BY` in the `OVER` clause to define the ranking order."}},{"type":"code","prompt":{"it":"Quante righe restituisce la query e quali?","en":"How many rows does the query return, and which ones?"},"code":"-- t(a, b):\n-- (1, \u0027x\u0027), (1, \u0027y\u0027), (1, \u0027x\u0027)\n\nSELECT DISTINCT a, b FROM t;","options":[{"it":"2 righe: (1,\u0027x\u0027) e (1,\u0027y\u0027)","en":"2 rows: (1,\u0027x\u0027) and (1,\u0027y\u0027)"},{"it":"1 riga: (1,\u0027x\u0027)","en":"1 row: (1,\u0027x\u0027)"},{"it":"3 righe: DISTINCT non elimina nulla qui","en":"3 rows: DISTINCT eliminates nothing here"},{"it":"1 riga con a=1","en":"1 row with a=1"}],"correct":0,"explanation":{"it":"In sintesi: `DISTINCT` si applica alla COMBINAZIONE di tutte le colonne proiettate, non alla sola prima. Le tuple distinte sono `(1,\u0027x\u0027)` e `(1,\u0027y\u0027)`; la seconda occorrenza di `(1,\u0027x\u0027)` e un duplicato esatto e viene eliminata, dando 2 righe. Equivale a un `GROUP BY a, b`.\nLe altre opzioni: \u00271 riga con a=1\u0027 e l\u0027errore comune di credere che `DISTINCT` operi solo su `a`; \u00273 righe\u0027 ignora che una tupla e duplicata; e \u00271 riga (1,x)\u0027 collassa erroneamente anche la coppia con `b=\u0027y\u0027`.","en":"In summary: `DISTINCT` applies to the COMBINATION of all the projected columns, not just the first one. The distinct tuples are `(1,\u0027x\u0027)` and `(1,\u0027y\u0027)`; the second occurrence of `(1,\u0027x\u0027)` is an exact duplicate and is removed, giving 2 rows. It is equivalent to a `GROUP BY a, b`.\nThe other options: \u00271 row with a=1\u0027 is the common mistake of believing that `DISTINCT` operates only on `a`; \u00273 rows\u0027 ignores that one tuple is a duplicate; and \u00271 row (1,x)\u0027 wrongly collapses the pair with `b=\u0027y\u0027` too."}},{"type":"mcq","prompt":{"it":"Che cos\u0027e il problema N+1, tipico degli ORM?","en":"What is the N+1 problem, typical of ORMs?"},"code":"","options":[{"it":"Si esegue 1 query per caricare N entita padre e poi N query aggiuntive (una per ciascun padre) per caricarne le relazioni, invece di un\u0027unica query con JOIN","en":"You run 1 query to load N parent entities and then N additional queries (one per parent) to load their relations, instead of a single query with a JOIN"},{"it":"Una query che per un errore di JOIN restituisce N+1 righe invece di N","en":"A query that, due to a JOIN error, returns N+1 rows instead of N"},{"it":"Un indice mancante che raddoppia i tempi di esecuzione","en":"A missing index that doubles the execution time"},{"it":"Un deadlock che coinvolge N transazioni concorrenti","en":"A deadlock involving N concurrent transactions"}],"correct":0,"explanation":{"it":"In sintesi: il problema N+1 nasce quando si esegue 1 query per caricare N entita padre e poi, accedendo pigramente (lazy) a un\u0027associazione di ciascuna, si scatena 1 query per ogni padre: totale 1+N query invece di un\u0027unica `SELECT` con `JOIN`. E un forte degrado di performance dovuto all\u0027eccesso di round-trip verso il database.\nLe altre opzioni: non e un errore di conteggio righe da `JOIN`; non e un semplice indice mancante; e non e un deadlock tra transazioni concorrenti.","en":"In summary: the N+1 problem arises when you run 1 qu
