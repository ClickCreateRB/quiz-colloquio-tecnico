che il noto limite delle chiamate self-invocation che bypassano il proxy.\nLe altre opzioni: il weaving a compile-time è di AspectJ, non il default di Spring; l\u0027Observer non c\u0027entra; l\u0027idea di duplicare il codice è proprio ciò che l\u0027AOP evita."},{"type":"mcq","prompt":"Quale pattern applica principalmente l\u0027ApplicationContext di Spring per creare e fornire i bean?","code":"","options":["Un pattern Factory (creazione centralizzata degli oggetti) combinato con Inversion of Control / Dependency Injection","Il pattern Decorator applicato a ogni bean","Il pattern Chain of Responsibility per istanziare i bean","Il pattern Prototype come unica strategia di creazione possibile"],"correct":0,"explanation":"In sintesi: il container Spring (`BeanFactory`/`ApplicationContext`) è essenzialmente una factory centralizzata che istanzia, configura e assembla i bean e ne inietta le dipendenze, applicando l\u0027Inversion of Control: è il framework a creare e collegare gli oggetti, non il codice applicativo.\nLe altre opzioni: il `Decorator` non è il meccanismo di creazione; il `Chain of Responsibility` non descrive l\u0027istanziazione; il prototype è solo uno degli scope disponibili, non l\u0027unica strategia (il default è singleton)."},{"type":"mcq","prompt":"`JdbcTemplate` di Spring è un esempio classico di quale pattern?","code":"","options":["Template Method: gestisce il boilerplate (connessione, statement, chiusura risorse, traduzione delle eccezioni) e delega i passi variabili tramite callback","Singleton puro, senza altri pattern coinvolti","Adapter tra due database differenti","Observer applicato all\u0027esecuzione delle query"],"correct":0,"explanation":"In sintesi: `JdbcTemplate` incarna il Template Method: fissa la sequenza invariante di accesso ai dati (ottieni connessione, prepara statement, esegui, chiudi, traduci le `SQLException` in `DataAccessException`) e lascia al chiamante solo i passi variabili tramite callback come `RowMapper` o `PreparedStatementCreator`, eliminando il boilerplate JDBC.\nLe altre opzioni: pur essendo usato come bean singleton, il pattern che lo caratterizza è il Template Method; non adatta database né notifica osservatori."},{"type":"mcq","prompt":"Decorator e Proxy hanno struttura simile (entrambi avvolgono un oggetto con la stessa interfaccia): qual è la differenza concettuale principale?","code":"","options":["Il Decorator aggiunge/estende responsabilità all\u0027oggetto; il Proxy ne controlla l\u0027accesso (lazy loading, sicurezza, oggetto remoto) mantenendone l\u0027interfaccia","Il Proxy aggiunge sempre nuove funzionalità, mentre il Decorator serve solo per il logging","Sono lo stesso identico pattern con due nomi diversi","Il Decorator controlla l\u0027accesso all\u0027oggetto, mentre il Proxy ne estende le funzionalità"],"correct":0,"explanation":"In sintesi: strutturalmente simili, differiscono per intento: il Decorator arricchisce dinamicamente il comportamento (aggiunge responsabilità componibili), mentre il Proxy fa da intermediario per gestire l\u0027accesso all\u0027oggetto reale senza alterarne le funzionalità (virtual/protection/remote proxy).\nLe altre opzioni: la seconda riduce il Decorator al solo logging ed è imprecisa; non sono lo stesso pattern; la quarta inverte esattamente i due intenti."},{"type":"code","prompt":"Questa implementazione di double-checked locking del Singleton è corretta in Java? Perché?","code":"public class Registry {\n    private static Registry instance;   // NB: non volatile\n    private Registry() {}\n    public static Registry getInstance() {\n        if (instance == null) {\n            synchronized (Registry.class) {\n                if (instance == null) {\n                    instance = new Registry();\n                }\n            }\n        }\n        return instance;\n    }\n}","options":["No: senza `volatile` su `instance`, per via del riordino delle istruzioni un thread può leggere un riferimento a un oggetto non ancora completamente inizializzato","Sì, così com\u0027è è pienamente corretta e thread-safe","No, perché `synchronized` su un oggetto `Class` non è consentito dal linguaggio","No, perché il costruttore deve essere `public` per funzionare"],"correct":0,"explanation":"In sintesi: il double-checked locking è corretto solo se `instance` è `volatile`. `instance = new Registry()` non è atomico (allocazione, costruzione, assegnazione del riferimento) e senza `volatile` il JMM permette che l\u0027assegnazione del riferimento diventi visibile prima del completamento del costruttore, così un altro thread vede un oggetto parzialmente costruito. `volatile` impedisce quel riordino e garantisce la visibilità.\nLe altre opzioni: non è corretta com\u0027è; `synchronized` su `Registry.class` è perfettamente lecito; il costruttore privato è anzi necessario al Singleton."},{"type":"code","prompt":"Perché questo design viola il Liskov Substitution Principle (LSP)?","code":"class Bird {\n    void fly() { /* vola */ }\n}\nclass Ostrich extends Bird {\n    @Override\n    void fly() {\n        throw new UnsupportedOperationException(\"Gli struzzi non volano\");\n    }\n}\n\nvoid makeItFly(Bird b) {\n    b.fly();   // il client si aspetta un Bird che vola\n}","options":["Perché `Ostrich`, sostituito a `Bird`, rompe il contratto: dove il client si aspetta un `fly()` valido riceve invece un\u0027eccezione a runtime","Perché `Ostrich` non sovrascrive un numero sufficiente di metodi della superclasse","Perché il metodo `fly()` dovrebbe essere dichiarato `static`","Non lo viola affatto: lanciare un\u0027eccezione in un override è sempre lecito"],"correct":0,"explanation":"In sintesi: l\u0027LSP richiede che un sottotipo sia usabile ovunque al posto del supertipo senza rompere le aspettative del client; qui `Ostrich` indebolisce/annulla il contratto di `fly()` lanciando `UnsupportedOperationException`, quindi `makeItFly(new Ostrich())` fallisce a runtime. Il fix è ripensare la gerarchia, ad esempio separando `FlyingBird` da `Bird` (segnale di ISP/composizione).\nLe altre opzioni: il numero di metodi sovrascritti è irrilevante; `static` non c\u0027entra con la sostituibilità; lanciare eccezioni non previste dal contratto del supertipo è proprio ciò che viola l\u0027LSP."}]},{"id":"frontend","title":"Front-end (JavaScript \u0026 React)","questions":[{"type":"code","prompt":"Qual è l\u0027output di questo snippet?","code":"for (var i = 0; i \u003c 3; i++) {\n  setTimeout(() =\u003e console.log(i), 0);\n}","options":["0 1 2","0 0 0","3 3 3","1 2 3"],"correct":2,"explanation":"In sintesi: `var` ha function scope, non block scope, quindi esiste una sola variabile `i` condivisa da tutte le callback; i `setTimeout` sono asincroni e girano dopo la fine del loop, quando `i` vale già 3, perciò stampano 3 3 3. Con `let`, che ha block scope, si crea un binding per iterazione e stamperebbe 0 1 2.\nLe altre opzioni: 0 1 2 vale solo con `let` (binding per iterazione); 0 0 0 e 1 2 3 ignorano la natura asincrona o il valore finale di `i`."},{"type":"code","prompt":"Cosa stampano le due `console.log`?","code":"console.log(foo);\nconsole.log(bar);\nvar foo = 1;\nfunction bar() { return 2; }","options":["`ReferenceError` su `foo`","`undefined` e la funzione `bar`","`undefined` e `undefined`","`1` e la funzione `bar`"],"correct":1,"explanation":"In sintesi: le dichiarazioni `var` sono hoisted ma inizializzate a `undefined`, quindi `foo` esiste ma vale `undefined`; le function declaration sono hoisted per intero, corpo compreso, perciò `bar` è già la funzione.\nLe altre opzioni: nessun `ReferenceError` perché `var foo` è dichiarata (la TDZ vale solo per `let`/`const`); `foo` non è ancora 1 perché l\u0027assegnazione resta alla sua riga; `bar` non è `undefined` perché la function declaration è completamente hoisted."},{"type":"code","prompt":"Qual è l\u0027output?","code":"function makeCounter() {\n  let count = 0;\n  return () =\u003e ++count;\n}\nconst c = makeCounter();\nconsole.log(c(), c(), c());","options":["3 3 3","1 1 1","0 1 2","1 2 3"],"correct":3,"explanation":"In sintesi: la funzione ritornata è una closure che cattura la variabile `count` dello scope di `makeCounter`, che persiste tra le chiamate; `++count` la pre-incrementa e restituisce 1, poi 2, poi 3 (gli argomenti di `console.log` sono valutati da sinistra a destra).\nLe altre opzioni: 3 3 3 confonde con il caso `var`/`setTimeout`; 1 1 1 assumerebbe un `count` re-inizializzato a ogni chiamata; 0 1 2 userebbe il post-incremento `count++`."},{"type":"code","prompt":"Cosa stampa `console.log(obj.getValue())`?","code":"const obj = {\n  value: 42,\n  getValue: function () {\n    const inner = () =\u003e this.value;\n    return inner();\n  }\n};\nconsole.log(obj.getValue());","options":["42","undefined","TypeError","la funzione inner"],"correct":0,"explanation":"In sintesi: `inner` è una arrow function e non ha un proprio `this`: lo eredita lessicalmente da `getValue`, che essendo chiamata come metodo `obj.getValue()` ha `this` uguale a `obj`; quindi `this.value` è 42.\nLe altre opzioni: sarebbe `undefined` (o `TypeError` in strict mode) solo se `inner` fosse una funzione normale chiamata senza receiver, perché lì `this` non punterebbe a `obj`."},{"type":"code","prompt":"Qual è l\u0027output?","code":"console.log(0 == \u0027\u0027);\nconsole.log(null == undefined);\nconsole.log(NaN === NaN);","options":["false, true, false","true, false, true","true, true, false","false, false, false"],"correct":2,"explanation":"In sintesi: `0 == \u0027\u0027` è `true` perché con `==` entrambi vengono coerciti a numero (`\u0027\u0027` diventa 0); `null == undefined` è `true` per una regola speciale della loose equality; `NaN === NaN` è `false` perché `NaN` non è uguale a nulla, nemmeno a sé stesso.\nLe altre opzioni: invertono la coercion di `0 == \u0027\u0027` o assumono erroneamente che `NaN === NaN` sia `true`."},{"type":"code","prompt":"Cosa stampa lo snippet?","code":"const vals = [0, \u0027\u0027, \u0027false\u0027, [], null, undefined, NaN];\nconsole.log(vals.filter(Boolean).length);","options":["3","2","4","7"],"correct":1,"explanation":"In sintesi: `filter(Boolean)` tiene solo i valori truthy; qui restano `\u0027false\u0027` (stringa non vuota, quindi truthy) e `[]` (ogni oggetto/array è truthy), mentre `0`, `\u0027\u0027`, `null`, `undefined` e `NaN` sono falsy e vengono scartati: totale 2.\nLe altre opzioni: 3 o 4 contano per errore qualche falsy come `0` o `\u0027\u0027`, dimenticando che `\u0027false\u0027` e `[]` sono truthy."},{"type":"truefalse","prompt":"In JavaScript ogni oggetto ha un collegamento interno (`[[Prototype]]`) a un altro oggetto da cui eredita proprietà, e la ricerca di una proprietà risale la prototype chain finché la trova o raggiunge `null`.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: ogni oggetto ha un link interno `[[Prototype]]` (accessibile via `Object.getPrototypeOf`) e l\u0027accesso a una proprietà risale la prototype chain finché la trova o raggiunge `null`; questa è l\u0027ereditarietà prototipale, diversa dalle classi basate su copia.\nLe altre opzioni: sarebbe falso solo se JS copiasse le proprietà nelle istanze, ma la ricerca è dinamica lungo la catena."},{"type":"code","prompt":"In quale ordine vengono stampati i log?","code":"console.log(\u0027A\u0027);\nsetTimeout(() =\u003e console.log(\u0027B\u0027), 0);\nPromise.resolve().then(() =\u003e console.log(\u0027C\u0027));\nconsole.log(\u0027D\u0027);","options":["A B C D","A D B C","A C D B","A D C B"],"correct":3,"explanation":"In sintesi: prima gira il codice sincrono, quindi `A` e `D`; poi si svuota la coda dei microtask (la callback di `Promise.then`), quindi `C`; infine i macrotask come `setTimeout`, quindi `B`. I microtask hanno priorità sui macrotask alla fine di ogni tick dell\u0027event loop.\nLe altre opzioni: mettere `B` prima di `C` ignora la priorità dei microtask sui macrotask."},{"type":"code","prompt":"Qual è l\u0027ordine dei log?","code":"async function f() {\n  console.log(1);\n  await null;\n  console.log(2);\n}\nconsole.log(3);\nf();\nconsole.log(4);","options":["3 1 2 4","3 1 4 2","1 2 3 4","3 4 1 2"],"correct":1,"explanation":"In sintesi: `console.log(3)` è sincrono; poi `f()` parte ed esegue in modo sincrono fino a `await`, stampando `1`; l\u0027`await` sospende la funzione e schedula la continuazione come microtask restituendo il controllo, quindi si stampa `4`; a fine tick il microtask riprende e stampa `2`. Ordine: 3 1 4 2.\nLe altre opzioni: il codice dopo `await` non è sincrono (non 3 1 2 4), e `1` esce prima di `4` perché precede l\u0027`await`."},{"type":"code","prompt":"Qual è il valore di `r`?","code":"const r = [1, 2, 3, 4].reduce((acc, n) =\u003e n % 2 === 0 ? acc + n : acc, 0);\nconsole.log(r);","options":["6","10","4","0"],"correct":0,"explanation":"In sintesi: `reduce` accumula partendo da 0; il callback aggiunge `n` solo se `n % 2 === 0`, quindi somma i pari 2 e 4 e ignora 1 e 3: risultato 6.\nLe altre opzioni: 10 somma tutti gli elementi, 4 dimentica un pari, 0 ignora l\u0027accumulo."},{"type":"code","prompt":"Cosa stampa lo snippet?","code":"const { a, b = 5, c } = { a: 1, c: null };\nconsole.log(a, b, c);","options":["1 undefined null","1 5 undefined","1 5 null","undefined 5 null"],"correct":2,"explanation":"In sintesi: `a` prende 1; `b` non è presente nell\u0027oggetto quindi vale `undefined` e scatta il default 5; `c` è presente con valore `null`, e i default nel destructuring si applicano solo a `undefined`, non a `null`, quindi `c` resta `null`.\nLe altre opzioni: dare `undefined` a `b` ignora il default; dare il default a `c` confonde `null` con `undefined`."},{"type":"code","prompt":"Qual è l\u0027output?","code":"function sum(...args) {\n  return args.reduce((a, b) =\u003e a + b, 0);\n}\nconst arr = [1, 2, 3];\nconsole.log(sum(...arr, 4));","options":["6","[1, 2, 3, 4]","NaN","10"],"correct":3,"explanation":"In sintesi: lo spread `...arr` espande `[1, 2, 3]` come argomenti separati e vi si aggiunge `4`, quindi `sum` riceve 1, 2, 3, 4; il rest `...args` li raccoglie in un array e `reduce` li somma: 10.\nLe altre opzioni: 6 dimentica il `4` aggiunto dopo lo spread; l\u0027array o `NaN` fraintendono spread e rest."},{"type":"code","prompt":"Cosa stampano le tre `console.log`?","code":"const user = { profile: { name: \u0027Ada\u0027 }, age: 0 };\nconsole.log(user.profile?.name ?? \u0027anon\u0027);\nconsole.log(user.contact?.email ?? \u0027no email\u0027);\nconsole.log(user.age ?? 99);","options":["Ada, no email, 99","Ada, no email, 0","Ada, undefined, 0","undefined, no email, 99"],"correct":1,"explanation":"In sintesi: `?.` corto-circuita restituendo `undefined` quando l\u0027oggetto è `null`/`undefined`, quindi `user.contact?.email` è `undefined`; `??` fornisce il fallback solo per `null`/`undefined`, perciò `email` diventa `\u0027no email\u0027`, mentre `age` vale 0 e 0 non è nullish, quindi `??` NON applica il default e resta 0.\nLe altre opzioni: dare 99 ad `age` confonde `??` con `||`, che invece scatterebbe su 0 perché falsy."},{"type":"truefalse","prompt":"L\u0027event delegation sfrutta il bubbling: si registra un solo listener sull\u0027elemento antenato comune invece di uno per ogni figlio, e si usa `event.target` per identificare l\u0027elemento che ha originato l\u0027evento.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: l\u0027event delegation sfrutta il bubbling degli eventi, registrando un solo listener sull\u0027antenato comune e usando `event.target` per capire quale figlio ha originato l\u0027evento; è efficiente e funziona anche per elementi aggiunti dinamicamente.\nLe altre opzioni: sarebbe falso solo se gli eventi non risalissero la gerarchia, ma la maggior parte fa bubbling fino al contenitore."},{"type":"code","prompt":"Qual è l\u0027output?","code":"function greet(greeting) {\n  return greeting + \u0027, \u0027 + this.name;\n}\nconst p = { name: \u0027Sam\u0027 };\nconsole.log(greet.call(p, \u0027Hi\u0027));","options":["Hi, Sam","Hi, undefined","undefined, Sam","TypeError"],"correct":0,"explanation":"In sintesi: `call` invoca subito la funzione impostando `this` al primo argomento (`p`) e passando gli altri come argomenti singoli, quindi `greeting` è `\u0027Hi\u0027` e `this.name` è `\u0027Sam\u0027`: risultato `\u0027Hi, Sam\u0027`. Ricorda: `apply` è come `call` ma con gli argomenti in un array, mentre `bind` restituisce una nuova funzione senza chiamarla.\nLe altre opzioni: `Hi, undefined` ignorerebbe il binding di `this` a `p`."},{"type":"code","prompt":"Cosa stampano le due righe?","code":"console.log(\u00275\u0027 + 2);\nconsole.log(\u00275\u0027 - 2);","options":["7 e 3","\"52\" e \"3\"","\"52\" e 3","7 e \"52\""],"correct":2,"explanation":"In sintesi: con `+`, se un operando è una stringa avviene la concatenazione, quindi `\u00275\u0027 + 2` produce `\u002752\u0027`; l\u0027operatore `-` non ha semantica di stringa e forza la coercion numerica, quindi `\u00275\u0027 - 2` diventa `5 - 2 = 3` (number).\nLe altre opzioni: `7` per la prima confonde `+` con la somma numerica; il risultato di `-` è il number `3`, non la stringa `\u00273\u0027`."},{"type":"mcq","prompt":"Quale affermazione su JSX è corretta?","code":"","options":["JSX è HTML valido interpretato direttamente dal browser senza alcuna compilazione","In JSX si usa l\u0027attributo `class` esattamente come in HTML","JSX permette di restituire più elementi fratelli senza alcun wrapper o Fragment","JSX è sintassi che un transpiler compila in chiamate come `React.createElement` (o nel JSX runtime), e un componente deve restituire un singolo nodo radice (eventualmente un Fragment)"],"correct":3,"explanation":"In sintesi: JSX non è HTML: è sintassi che un transpiler (Babel/tsc) trasforma in `React.createElement` o nelle chiamate del JSX runtime; per questo un componente deve avere un unico nodo radice, e per raggruppare fratelli senza aggiungere markup si usa un `Fragment` (`\u003c\u003e...\u003c/\u003e`). In JSX inoltre si scrive `className`, non `class`.\nLe altre opzioni: il browser non capisce JSX senza build; `class` è una keyword riservata in JS; servono un wrapper o un Fragment per più fratelli."},{"type":"truefalse","prompt":"Le props sono di sola lettura per il componente che le riceve, mentre lo state è gestito internamente e può cambiare nel tempo, provocando un re-render.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: le props seguono il flusso unidirezionale dall\u0027alto verso il basso e sono immutabili dentro il componente che le riceve, mentre lo state è locale, mutabile tramite il suo setter, e ogni suo aggiornamento programma un re-render.\nLe altre opzioni: sarebbe falso solo se un componente potesse riassegnare le proprie props, ma modificarle è un anti-pattern e non propaga nulla."},{"type":"code","prompt":"Cliccando UNA sola volta il bottone, quale valore mostra alla fine?","code":"function Counter() {\n  const [count, setCount] = useState(0);\n  const handle = () =\u003e {\n    setCount(count + 1);\n    setCount(count + 1);\n    setCount(count + 1);\n  };\n  return \u003cbutton onClick={handle}\u003e{count}\u003c/button\u003e;\n}","options":["1","3","0","2"],"correct":0,"explanation":"In sintesi: le tre `setCount(count + 1)` leggono lo stesso `count` catturato dalla closure di questo render (0), quindi calcolano tutte 1; React fa il batching degli aggiornamenti nello stesso handler e applica l\u0027ultimo valore, perciò dopo il click `count` è 1. Per sommare +3 servirebbe la updater function `setCount(c =\u003e c + 1)`.\nLe altre opzioni: 3 assume che ogni `setCount` veda il valore già aggiornato (non è così con il valore diretto); 0 e 2 fraintendono batching e closure."},{"type":"code","prompt":"Con questo handler, cliccando UNA volta, di quanto aumenta `count` partendo da 0?","code":"const handle = () =\u003e {\n  setCount(c =\u003e c + 1);\n  setCount(c =\u003e c + 1);\n  setCount(c =\u003e c + 1);\n};","options":["di 1 (da 0 a 1)","di 3 (da 0 a 3)","di 0","di 3 ma solo dopo due click"],"correct":1,"explanation":"In sintesi: passando una updater function `c =\u003e c + 1`, React invoca ogni aggiornamento sull\u0027ultimo state in coda (non sulla variabile catturata dalla closure), quindi le tre chiamate si compongono: 0→1→2→3; dopo un solo click `count` vale 3. È il pattern corretto quando il nuovo stato dipende dal precedente.\nLe altre opzioni: +1 sarebbe il caso con il valore diretto `count + 1`; 0 o \u0027due click\u0027 ignorano il funzionamento delle updater function."},{"type":"mcq","prompt":"Cosa determina l\u0027array delle dipendenze di `useEffect`?","code":"","options":["L\u0027array delle dipendenze decide l\u0027ordine di esecuzione tra più effect","Con `[]` l\u0027effect gira dopo ogni render; senza array gira una sola volta","Con `[]` l\u0027effect gira una sola volta dopo il primo render; con `[a, b]` rigira quando `a` o `b` cambiano; senza array gira dopo ogni render","Le dipendenze servono solo a evitare i warning del linter, senza effetto sul comportamento"],"correct":2,"explanation":"In sintesi: l\u0027array di dipendenze controlla QUANDO l\u0027effect viene rieseguito: `[]` significa solo dopo il mount (con cleanup all\u0027unmount), un array con valori lo rilancia quando una dipendenza cambia (confronto per identità), e l\u0027assenza dell\u0027array lo fa girare dopo ogni render.\nLe altre opzioni: l\u0027ordine degli effect dipende dalla loro posizione nel codice, non dalle deps; le deps hanno un effetto reale sul comportamento, non sono cosmesi del linter."},{"type":"code","prompt":"A cosa serve la funzione ritornata dall\u0027effect e quando viene eseguita?","code":"useEffect(() =\u003e {\n  const id = setInterval(() =\u003e console.log(\u0027tick\u0027), 1000);\n  return () =\u003e clearInterval(id);\n}, []);","options":["Viene eseguita a ogni render, subito dopo il corpo dell\u0027effect","È un valore restituito a React per calcolare le dipendenze","Non viene mai chiamata perché l\u0027array è vuoto","È la funzione di cleanup: React la esegue all\u0027unmount del componente (e prima di ogni ri-esecuzione dell\u0027effect) per liberare risorse, qui l\u0027interval"],"correct":3,"explanation":"In sintesi: la funzione ritornata è il cleanup dell\u0027effect; React la chiama quando il componente si smonta e, se l\u0027effect si riesegue, anche prima della ri-esecuzione, così da rimuovere subscription o timer ed evitare leak: qui fa `clearInterval`. Con `[]` l\u0027effect gira una volta e il cleanup scatta all\u0027unmount.\nLe altre opzioni: non gira a ogni render (deps vuote), non serve a calcolare le deps, e viene eccome chiamata all\u0027unmount."},{"type":"truefalse","prompt":"È lecito chiamare `useState` dentro un blocco `if`, purché la condizione cambi raramente.","code":"","options":["Vero","Falso"],"correct":1,"explanation":"In sintesi: è falso: le Rules of Hooks impongono di chiamare gli hook sempre al top level del componente, mai dentro `if`, loop o funzioni annidate, perché React li identifica in base all\u0027ordine di chiamata a ogni render; una chiamata condizionale altera quell\u0027ordine e rompe l\u0027associazione tra hook e stato.\nLe altre opzioni: pensare che basti una condizione \u0027stabile\u0027 è l\u0027errore tipico: anche così l\u0027ordine delle chiamate può cambiare tra i render."},{"type":"mcq","prompt":"Perché in una lista è sconsigliato usare l\u0027indice dell\u0027array come `key`?","code":"","options":["Perché le `key` devono essere numeri e l\u0027indice è comunque un numero","Perché se la lista viene riordinata, filtrata o riceve inserimenti/rimozioni, gli indici non identificano stabilmente gli elementi e React può riusare i nodi/lo stato sbagliati, causando UI incoerente","Perché l\u0027indice come `key` provoca sempre un errore a runtime","Perché le `key` vengono mostrate nel DOM e l\u0027indice sarebbe visibile all\u0027utente"],"correct":1,"explanation":"In sintesi: le `key` servono alla reconciliation per stabilire l\u0027identità stabile di ogni elemento tra un render e l\u0027altro; usare l\u0027indice va bene solo per liste statiche, ma se si riordina, inserisce o rimuove, l\u0027associazione indice→elemento cambia e React può riciclare il componente o lo stato sbagliato (es. input con valori scambiati). Meglio un id stabile.\nLe altre opzioni: le `key` non devono essere numeri, non causano sempre errori, e non finiscono nel DOM visibile."},{"type":"mcq","prompt":"Qual è la differenza tra un input controlled e uno uncontrolled in React?","code":"","options":["Il controlled usa un `ref`, l\u0027uncontrolled usa lo state","Sono sinonimi: cambia solo il nome a seconda della versione di React","Nel controlled il valore è guidato dallo state React (`value` + `onChange`); nell\u0027uncontrolled è il DOM a tenere il valore, che si legge quando serve tramite un `ref` (o `defaultValue`)","Il controlled funziona solo con `\u003cinput\u003e`, l\u0027uncontrolled solo con `\u003ctextarea\u003e`"],"correct":2,"explanation":"In sintesi: in un componente controlled il valore del campo è la single source of truth nello state e si aggiorna via `value`/`onChange`, così React controlla ogni carattere; in uno uncontrolled è il DOM a possedere il valore (spesso con `defaultValue`) e lo si legge on demand tramite un `ref`.\nLe altre opzioni: invertono ref e state, o inventano vincoli sui tag e sulla versione di React."},{"type":"mcq","prompt":"Due componenti fratelli devono condividere e sincronizzare lo stesso dato. Qual è l\u0027approccio idiomatico in React?","code":"","options":["Far scrivere a un fratello direttamente nello state dell\u0027altro tramite un `ref`","Duplicare lo state in entrambi i fratelli e sincronizzarli manualmente","Usare una variabile globale mutabile esterna a React","Sollevare lo state (lifting state up) nell\u0027antenato comune più vicino e passarlo ai figli via props, con callback per aggiornarlo"],"correct":3,"explanation":"In sintesi: quando più componenti devono condividere un dato si fa lifting state up: si sposta lo state nell\u0027antenato comune più vicino, che lo passa ai figli come props e fornisce callback per modificarlo, mantenendo un\u0027unica source of truth e il flusso unidirezionale.\nLe altre opzioni: scrivere nello state altrui via ref, duplicare lo state o usare globali mutabili rompono la prevedibilità e portano a stati disallineati."},{"type":"truefalse","prompt":"Quando il `value` di un Context Provider cambia, tutti i componenti che consumano quel context con `useContext` si ri-renderizzano.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: i consumer registrati con `useContext` si ri-renderizzano quando cambia il `value` del Provider (confronto per identità del valore); per questo conviene memoizzare gli oggetti passati come `value`, per evitare re-render inutili quando il riferimento cambia a ogni render.\nLe altre opzioni: sarebbe falso solo se il context non notificasse i consumer, ma è proprio il suo scopo."},{"type":"mcq","prompt":"Quando `useMemo`/`useCallback` sono davvero utili?","code":"","options":["Per evitare ricalcoli costosi e per preservare l\u0027identità referenziale di valori/funzioni passati a figli memoizzati (`React.memo`) o usati come dipendenze di altri hook","Sempre, su ogni funzione e valore, perché rendono l\u0027app più veloce a prescindere","Per impedire del tutto i re-render del componente in cui sono usati","Per sostituire `useState` quando non si vuole un re-render"],"correct":0,"explanation":"In sintesi: `useMemo` memoizza il risultato di un calcolo costoso e `useCallback` memoizza l\u0027identità di una funzione; servono davvero quando quel valore/funzione è passato a un figlio avvolto in `React.memo` o è una dipendenza di `useEffect`/`useMemo`, dove l\u0027identità referenziale conta. Usarli ovunque aggiunge overhead senza guadagno.\nLe altre opzioni: non velocizzano a prescindere, non bloccano il re-render del componente che li ospita e non sostituiscono `useState`."},{"type":"code","prompt":"Cosa succede cliccando ripetutamente il bottone?","code":"function Box() {\n  const countRef = useRef(0);\n  const handleClick = () =\u003e {\n    countRef.current += 1;\n    console.log(countRef.current);\n  };\n  return \u003cbutton onClick={handleClick}\u003e{countRef.current}\u003c/button\u003e;\n}","options":["Il bottone si aggiorna a ogni click mostrando 1, 2, 3, come con `useState`","La console logga 1, 2, 3... ma il testo del bottone resta 0 finché non avviene un re-render per altri motivi, perché mutare `ref.current` non provoca un re-render","Viene lanciato un errore perché non si può mutare `ref.current`","Il valore si resetta a 0 a ogni click perché `useRef(0)` rigira"],"correct":1,"explanation":"In sintesi: `useRef` restituisce un oggetto mutabile e persistente tra i render il cui `.current` si può cambiare, ma mutarlo NON schedula un re-render; quindi la console mostra i valori incrementati mentre il testo del bottone, renderizzato con il valore precedente, resta 0 finché un re-render causato da altro non lo rilegge.\nLe altre opzioni: non si comporta come `useState` (che ri-renderizza), mutare `.current` è lecito, e `useRef(0)` non re-inizializza a ogni render."},{"type":"mcq","prompt":"Cos\u0027è il Virtual DOM e come lo usa React nella reconciliation?","code":"","options":["Una copia del DOM reale che React aggiorna elemento per elemento a ogni keystroke, senza confronti","Un secondo DOM del browser, più veloce, fornito dalle API native","Una rappresentazione in memoria dell\u0027UI; a ogni render React costruisce il nuovo albero, lo confronta (diffing) con il precedente e applica al DOM reale solo le differenze minime","Un meccanismo che elimina completamente la necessità di manipolare il DOM reale"],"correct":2,"explanation":"In sintesi: il Virtual DOM è una struttura leggera in memoria che descrive l\u0027UI; a ogni render React genera il nuovo albero e nella reconciliation lo confronta con il precedente (diffing, guidato da tipo di elemento e `key`), calcolando il set minimo di mutazioni da applicare al DOM reale, che è l\u0027operazione costosa.\nLe altre opzioni: non è una API del browser né un secondo DOM nativo, non aggiorna tutto senza confronto, e alla fine il DOM reale va comunque toccato."},{"type":"truefalse","prompt":"Quando un componente si ri-renderizza, di default React ri-renderizza anche tutti i suoi figli, indipendentemente dal fatto che le loro props siano cambiate.","code":"","options":["Vero","Falso"],"correct":0,"explanation":"In sintesi: è vero: per default il re-render di un componente propaga il re-render ai suoi discendenti anche se le loro props non sono cambiate; per saltare questo lavoro si può avvolgere un figlio in `React.memo`, che lo rende \u0027puro\u0027 facendogli confrontare le props (shallow compare) ed evitare il re-render quando sono uguali.\nLe altre opzioni: sarebbe falso solo se React memoizzasse tutto di default, ma la memoizzazione è opt-in."},{"type":"mcq","prompt":"Cosa significa \u0027unidirectional data flow\u0027 in React?","code":"","options":["I dati fluiscono liberamente in entrambe le direzioni tra genitori e figli tramite two-way binding automatico","Ogni componente può modificare direttamente lo state di qualsiasi altro componente","I dati fluiscono solo dai figli verso i genitori","I dati scendono dai genitori ai figli tramite props; i figli comunicano verso l\u0027alto invocando callback ricevute come props, senza modificare direttamente i dati del genitore"],"correct":3,"explanation":"In sintesi: unidirectional data flow significa che i dati viaggiano in una sola direzione, dall\u0027alto verso il basso via props; quando un figlio deve provocare un cambiamento non tocca lo state del genitore ma chiama una callback ricevuta come prop, e il genitore aggiorna il proprio state (single source of truth). Questo rende il flusso prevedibile e tracciabile.\nLe altre opzioni: React non ha two-way binding automatico, i componenti non modificano lo state altrui, e il flusso principale dei dati è verso il basso, non verso l\u0027alto."}]}]}</script>

<script>
(function(){
  const el = document.getElementById('quiz-data');
  let DATA;
  try { DATA = JSON.parse(el.textContent); } catch(e){ DATA = {modules:[]}; }
  const MODULES = DATA.modules || [];
  const app = document.getElementById('app');

  const settings = { mode:'esame', shuffleQuestions:true, shuffleOptions:true, count:'all' };
  let session = null;
  let resultsFilter = 'all';

  // storage
  function getBest(){ try { return JSON.parse(localStorage.getItem('quizBest')||'{}'); } catch(e){ return {}; } }
  function setBest(id,pct){ const b=getBest(); if(!(id in b)||pct>b[id]){ b[id]=pct; localStorage.setItem('quizBest',JSON.stringify(b)); } }

  // utils
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
  function fmt(s){ let t=esc(s); t=t.replace(/`([^`]+)`/g,'<code class="ic">$1</code>'); t=t.replace(/\n/g,'<br>'); t=t.replace(/(In sintesi:|Le altre opzioni:)/g,'<strong>$1</strong>'); return t; }
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  function buildItems(questions){
    return questions.map(q=>{
      const base = q.options.map((_,i)=>i);
      const order = settings.shuffleOptions ? shuffle(base) : base;
      return { q, order, selected:null };
    });
  }

  function startModule(m){
    let qs = m.questions.slice();
    if(settings.shuffleQuestions) qs = shuffle(qs);
    if(settings.count!=='all') qs = qs.slice(0, settings.count);
    resultsFilter='all';
    session = { title:m.title, id:m.id, items:buildItems(qs), index:0 };
    renderQuiz();
  }
  function startMixed(){
    let all=[]; MODULES.forEach(m=>{ all=all.concat(m.questions); });
    all = shuffle(all);
    const n = settings.count==='all' ? Math.min(30, all.length) : Math.min(settings.count, all.length);
    resultsFilter='all';
    session = { title:'Esame misto', id:'__mixed__', items:buildItems(all.slice(0,n)), index:0 };
    renderQuiz();
  }

  function renderHome(){
    session=null;
    if(!MODULES.length){ app.innerHTML='<p class="empty">Nessun modulo caricato.</p>'; return; }
    const best=getBest();
    const cards = MODULES.map(m=>{
      const b = best[m.id]!=null ? `<span class="badge">best ${best[m.id]}%</span>` : '';
      return `<button class="card" data-id="${esc(m.id)}"><div class="card-t">${esc(m.title)}</div><div class="card-m">${m.questions.length} domande ${b}</div></button>`;
    }).join('');
    app.innerHTML = `
      <div class="hero"><h1>Quiz Colloquio Tecnico</h1><p class="sub">Preparazione mid-level &middot; Java &middot; Spring &middot; SQL &middot; Banking</p></div>
      <div class="panel"><div class="opt-row">
        <label>Modalita<select id="s-mode">
          <option value="esame">Esame (spiegazioni a fine test)</option>
          <option value="studio">Studio (feedback immediato)</option>
        </select></label>
        <label>N. domande<select id="s-count">
          <option value="all">Tutte</option><option value="10">10</option><option value="20">20</option><option value="30">30</option>
        </select></label>
        <label class="chk"><input type="checkbox" id="s-sq"> Mescola domande</label>
        <label class="chk"><input type="checkbox" id="s-so"> Mescola opzioni</label>
      </div></div>
      <div class="cards">${cards}</div>
      <div class="mixed"><button class="btn-mixed" id="mixed">Esame misto (tutti i moduli)</button></div>
      <div class="foot">I risultati restano solo sul tuo PC (localStorage del browser).</div>`;
    const mode=document.getElementById('s-mode'); mode.value=settings.mode; mode.onchange=()=>settings.mode=mode.value;
    const cnt=document.getElementById('s-count'); cnt.value=String(settings.count); cnt.onchange=()=>settings.count=(cnt.value==='all'?'all':parseInt(cnt.value,10));
    const sq=document.getElementById('s-sq'); sq.checked=settings.shuffleQuestions; sq.onchange=()=>settings.shuffleQuestions=sq.checked;
    const so=document.getElementById('s-so'); so.checked=settings.shuffleOptions; so.onchange=()=>settings.shuffleOptions=so.checked;
    document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{ const m=MODULES.find(x=>x.id===c.dataset.id); if(m) startModule(m); });
    document.getElementById('mixed').onclick=startMixed;
  }

  function renderQuiz(){
    const it=session.items[session.index], q=it.q, n=session.items.length;
    const reveal = settings.mode==='studio' && it.selected!=null;
    const opts = it.order.map((orig,disp)=>{
      const sel = it.selected===disp;
      let cls='opt'; if(sel) cls+=' sel';
      if(reveal){ if(orig===q.correct) cls+=' correct'; else if(sel) cls+=' wrong'; }
      return `<button class="${cls}" data-i="${disp}" ${reveal?'disabled':''}><span class="mark">${String.fromCharCode(65+disp)}</span><span class="otext">${esc(q.options[orig])}</span></button>`;
    }).join('');
    const code = q.code && q.code.trim() ? `<pre class="code"><code>${esc(q.code)}</code></pre>` : '';
    const expl = reveal ? `<div class="expl"><strong>${it.order[it.selected]===q.correct?'✓ Corretto':'✗ Sbagliato'}</strong><p>${fmt(q.explanation)}</p></div>` : '';
    const answered = session.items.filter(x=>x.selected!=null).length;
    const typeLbl = q.type==='code'?'Codice':(q.type==='truefalse'?'Vero / Falso':'Risposta singola');
    app.innerHTML = `
      <div class="quiz-top"><button class="link" id="home">&larr; Home</button><div class="qtitle">${esc(session.title)}</div><div class="qcount">${session.index+1} / ${n}</div></div>
      <div class="bar"><div class="bar-fill" style="width:${((session.index+1)/n)*100}%"></div></div>
      <div class="qcard">
        <span class="qtype">${typeLbl}</span>
        <div class="qprompt">${fmt(q.prompt)}</div>
        ${code}
        <div class="opts">${opts}</div>
        ${expl}
      </div>
      <div class="nav">
        <button class="btn" id="prev" ${session.index===0?'disabled':''}>&larr; Indietro</button>
        <div class="spacer"></div>
        ${session.index<n-1 ? `<button class="btn primary" id="next">Avanti &rarr;</button>` : `<button class="btn primary" id="finish">Termina (${answered}/${n})</button>`}
      </div>`;
    document.getElementById('home').onclick=()=>{ renderHome(); };
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ it.selected=parseInt(b.dataset.i,10); renderQuiz(); });
    const prev=document.getElementById('prev'); if(prev) prev.onclick=()=>{ session.index--; renderQuiz(); };
    const next=document.getElementById('next'); if(next) next.onclick=()=>{ session.index++; renderQuiz(); };
    const fin=document.getElementById('finish'); if(fin) fin.onclick=finish;
  }

  function finish(){
    const n=session.items.length;
    const correct = session.items.filter(x=>x.selected!=null && x.order[x.selected]===x.q.correct).length;
    const pct = Math.round((correct/n)*100);
    if(session.id!=='__mixed__') setBest(session.id,pct);
    renderResults(correct,n,pct);
  }

  function renderResults(correct,n,pct){
    const wrong=n-correct;
    const rows = session.items.map((it,idx)=>({it,idx})).filter(({it})=>{
      const ok = it.selected!=null && it.order[it.selected]===it.q.correct;
      return resultsFilter==='wrong' ? !ok : true;
    }).map(({it,idx})=>{
      const q=it.q;
      const userIdx = it.selected!=null ? it.order[it.selected] : null;
      const ok = userIdx===q.correct;
      const userTxt = it.selected==null ? '<em>Nessuna risposta</em>' : esc(q.options[userIdx]);
      const code = q.code && q.code.trim() ? `<pre class="code"><code>${esc(q.code)}</code></pre>` : '';
      const your = ok ? `<div class="r-line ok">La tua risposta: ${userTxt} ✓</div>` : `<div class="r-line ko">La tua risposta: ${userTxt} ✗</div>`;
      const corr = !ok ? `<div class="r-line good">Risposta corretta: ${esc(q.options[q.correct])}</div>` : '';
      return `<div class="rev ${ok?'is-ok':'is-ko'}"><div class="rev-h"><span class="rev-n">${idx+1}</span><span class="rev-q">${fmt(q.prompt)}</span></div>${code}${your}${corr}<div class="r-expl">${fmt(q.explanation)}</div></div>`;
    }).join('');
    const cls = pct>=70?'good':(pct>=50?'mid':'bad');
    app.innerHTML = `
      <div class="res-hero"><div class="score ${cls}">${pct}%</div><div class="score-d">${correct} corrette &middot; ${wrong} sbagliate &middot; ${n} totali</div></div>
      <div class="res-actions">
        <button class="btn" id="filter">${resultsFilter==='wrong'?'Mostra tutte':'Mostra solo sbagliate'}</button>
        ${wrong>0?`<button class="btn" id="retry">Rifai solo le sbagliate</button>`:''}
        <button class="btn" id="again">Rifai il modulo</button>
        <button class="btn primary" id="home">Home</button>
      </div>
      <div class="review">${rows||'<p class="empty">Nessuna domanda da mostrare.</p>'}</div>`;
    document.getElementById('filter').onclick=()=>{ resultsFilter=resultsFilter==='wrong'?'all':'wrong'; renderResults(correct,n,pct); };
    const rt=document.getElementById('retry'); if(rt) rt.onclick=()=>{
      const wq = session.items.filter(x=>!(x.selected!=null && x.order[x.selected]===x.q.correct)).map(x=>x.q);
      resultsFilter='all';
      session = { title:session.title+' (ripasso errori)', id:session.id, items:buildItems(settings.shuffleQuestions?shuffle(wq):wq), index:0 };
      renderQuiz();
    };
    document.getElementById('again').onclick=()=>{ const m=MODULES.find(x=>x.id===session.id); resultsFilter='all'; if(m) startModule(m); else startMixed(); };
    document.getElementById('home').onclick=()=>{ resultsFilter='all'; renderHome(); };
  }

  renderHome();
})();
</script>
