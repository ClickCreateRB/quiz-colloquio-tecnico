ne classica alla regola \u0027finally esegue sempre\u0027.\nLe altre opzioni: pensare che il finally giri comunque ignora che `System.exit` arresta la VM, saltando lo stack unwinding.","en":"In summary: it\u0027s true. `System.exit()` terminates the JVM by invoking the runtime\u0027s halt: pending `finally` blocks are NOT executed, because the thread does not \u0027exit\u0027 the try normally. It\u0027s the classic exception to the \u0027finally always runs\u0027 rule.\nThe other options: assuming the finally runs anyway ignores that `System.exit` halts the VM, skipping stack unwinding."}},{"type":"code","prompt":{"it":"Qual e\u0027 l\u0027output di questo programma?","en":"What is the output of this program?"},"code":"class Res implements AutoCloseable {\n    final String name;\n    Res(String name) { this.name = name; System.out.println(\"open \" + name); }\n    public void close() { System.out.println(\"close \" + name); }\n}\npublic class T {\n    public static void main(String[] args) {\n        try (Res a = new Res(\"A\"); Res b = new Res(\"B\")) {\n            System.out.println(\"body\");\n        }\n    }\n}","options":[{"it":"open A / open B / body / close B / close A","en":"open A / open B / body / close B / close A"},{"it":"open A / open B / body / close A / close B","en":"open A / open B / body / close A / close B"},{"it":"open A / open B / body (le risorse non vengono chiuse automaticamente)","en":"open A / open B / body (the resources are not closed automatically)"},{"it":"open A / close A / open B / close B / body","en":"open A / close A / open B / close B / body"}],"correct":0,"explanation":{"it":"In sintesi: l\u0027output e\u0027 open A / open B / body / close B / close A. Nel try-with-resources le risorse vengono chiuse in ordine inverso rispetto all\u0027apertura (LIFO), cosi\u0027 le dipendenze aperte per prime si chiudono per ultime.\nLe altre opzioni: la chiusura non e\u0027 nello stesso ordine di apertura, le risorse vengono chiuse automaticamente e il body viene eseguito prima delle close.","en":"In summary: the output is open A / open B / body / close B / close A. In try-with-resources the resources are closed in reverse order to their opening (LIFO), so the dependencies opened first are closed last.\nThe other options: closing is not in the same order as opening, the resources are closed automatically and the body runs before the close calls."}},{"type":"mcq","prompt":{"it":"Cosa deve implementare una risorsa per poter essere usata in un try-with-resources?","en":"What must a resource implement to be usable in a try-with-resources?"},"code":"","options":[{"it":"`AutoCloseable` (o `Closeable`); il suo `close()` viene invocato automaticamente a fine blocco","en":"`AutoCloseable` (or `Closeable`); its `close()` is invoked automatically at the end of the block"},{"it":"La classe astratta `Resource`","en":"The abstract class `Resource`"},{"it":"Nulla di particolare: la JVM chiama `finalize()` a fine blocco","en":"Nothing in particular: the JVM calls `finalize()` at the end of the block"},{"it":"L\u0027interfaccia `Serializable`","en":"The `Serializable` interface"}],"correct":0,"explanation":{"it":"In sintesi: per il try-with-resources la risorsa deve implementare `AutoCloseable` (o `Closeable`, che lo estende); il suo `close()` viene invocato automaticamente all\u0027uscita del blocco, anche in caso di eccezione. E\u0027 il pattern moderno che sostituisce il finally manuale.\nLe altre opzioni: non serve una classe `Resource`, non ci si affida a `finalize()`, e `Serializable` non c\u0027entra con la chiusura.","en":"In summary: for try-with-resources the resource must implement `AutoCloseable` (or `Closeable`, which extends it); its `close()` is invoked automatically on exiting the block, even in case of an exception. It\u0027s the modern pattern that replaces the manual finally.\nThe other options: no `Resource` class is needed, you don\u0027t rely on `finalize()`, and `Serializable` has nothing to do with closing."}},{"type":"code","prompt":{"it":"Cosa succede compilando questo multi-catch?","en":"What happens when compiling this multi-catch?"},"code":"try {\n    // ...\n} catch (IOException | FileNotFoundException e) {\n    // ...\n}","options":[{"it":"Errore di compilazione: `FileNotFoundException` e\u0027 sottoclasse di `IOException`, quindi e\u0027 ridondante nel multi-catch","en":"Compilation error: `FileNotFoundException` is a subclass of `IOException`, so it is redundant in the multi-catch"},{"it":"Compila e cattura solo `FileNotFoundException`","en":"Compiles and catches only `FileNotFoundException`"},{"it":"Compila normalmente: il multi-catch accetta qualsiasi combinazione di tipi","en":"Compiles normally: the multi-catch accepts any combination of types"},{"it":"Errore a runtime al primo lancio di `IOException`","en":"Runtime error on the first throw of `IOException`"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 un errore di compilazione. In un multi-catch le alternative non possono essere in relazione di sottotipo: `FileNotFoundException` e\u0027 gia\u0027 una `IOException`, quindi elencarle insieme e\u0027 ridondante e il compilatore lo rifiuta. Basterebbe catturare la sola `IOException`.\nLe altre opzioni: non compila affatto, quindi non cattura selettivamente ne\u0027 va in errore a runtime.","en":"In summary: it\u0027s a compilation error. In a multi-catch the alternatives cannot be in a subtype relationship: `FileNotFoundException` is already an `IOException`, so listing them together is redundant and the compiler rejects it. Catching just `IOException` would suffice.\nThe other options: it does not compile at all, so it neither catches selectively nor fails at runtime."}},{"type":"mcq","prompt":{"it":"Come si preserva l\u0027eccezione originale quando la si rilancia incapsulata in un\u0027altra?","en":"How do you preserve the original exception when rethrowing it wrapped in another one?"},"code":"","options":[{"it":"Passando la causa al costruttore, es. `throw new ServiceException(\"...\", e)`, recuperabile poi con `getCause()`","en":"By passing the cause to the constructor, e.g. `throw new ServiceException(\"...\", e)`, retrievable afterwards with `getCause()`"},{"it":"Concatenando i messaggi con `+` nella nuova eccezione","en":"By concatenating the messages with `+` in the new exception"},{"it":"Chiamando `e.printStackTrace()` prima di rilanciare","en":"By calling `e.printStackTrace()` before rethrowing"},{"it":"Non e\u0027 possibile: la causa originale va sempre persa quando si rilancia","en":"It\u0027s not possible: the original cause is always lost when rethrowing"}],"correct":0,"explanation":{"it":"In sintesi: si preserva la causa con l\u0027exception chaining, passandola al costruttore, es. `throw new ServiceException(\"messaggio\", e)`; l\u0027originale resta accessibile con `getCause()` e compare nello stack trace come \u0027Caused by\u0027. Questo mantiene il contesto senza perdere la radice del problema.\nLe altre opzioni: concatenare messaggi con `+` perde lo stack trace originale; `printStackTrace()` non collega le eccezioni; e la causa non va affatto persa.","en":"In summary: you preserve the cause with exception chaining, passing it to the constructor, e.g. `throw new ServiceException(\"message\", e)`; the original stays accessible via `getCause()` and appears in the stack trace as \u0027Caused by\u0027. This keeps the context without losing the root of the problem.\nThe other options: concatenating messages with `+` loses the original stack trace; `printStackTrace()` does not link the exceptions; and the cause is not lost at all."}},{"type":"mcq","prompt":{"it":"Qual e\u0027 la differenza tra `throw` e `throws`?","en":"What is the difference between `throw` and `throws`?"},"code":"","options":[{"it":"`throw` lancia effettivamente un\u0027istanza di eccezione; `throws` nella firma dichiara che il metodo puo\u0027 propagare quel tipo","en":"`throw` actually throws an exception instance; `throws` in the signature declares that the method may propagate that type"},{"it":"`throw` si usa nella firma del metodo, `throws` dentro il corpo","en":"`throw` is used in the method signature, `throws` inside the body"},{"it":"Sono sinonimi intercambiabili","en":"They are interchangeable synonyms"},{"it":"`throw` e\u0027 per le checked, `throws` per le unchecked","en":"`throw` is for checked exceptions, `throws` for unchecked ones"}],"correct":0,"explanation":{"it":"In sintesi: `throw` e\u0027 l\u0027istruzione che lancia effettivamente un\u0027istanza di eccezione (`throw new IllegalStateException()`); `throws` compare nella firma del metodo e dichiara i tipi di (checked) exception che il metodo puo\u0027 propagare al chiamante. Uno esegue, l\u0027altro documenta/obbliga.\nLe altre opzioni: non sono invertiti, non sono sinonimi e la distinzione non e\u0027 tra checked e unchecked.","en":"In summary: `throw` is the statement that actually throws an exception instance (`throw new IllegalStateException()`); `throws` appears in the method signature and declares the types of (checked) exception the method may propagate to the caller. One executes, the other documents/mandates.\nThe other options: they are not swapped, they are not synonyms and the distinction is not between checked and unchecked."}},{"type":"mcq","prompt":{"it":"Progettando eccezioni personalizzate, quando conviene estendere `RuntimeException` invece di `Exception`?","en":"When designing custom exceptions, when is it better to extend `RuntimeException` instead of `Exception`?"},"code":"","options":[{"it":"`RuntimeException` (unchecked) per errori di programmazione/non recuperabili; `Exception` (checked) quando il chiamante puo\u0027 ragionevolmente reagire e vuoi obbligarlo a gestirla","en":"`RuntimeException` (unchecked) for programming/unrecoverable errors; `Exception` (checked) when the caller can reasonably react and you want to force them to handle it"},{"it":"Estendere sempre `Error`, cosi\u0027 l\u0027eccezione e\u0027 piu\u0027 veloce","en":"Always extend `Error`, so the exception is faster"},{"it":"Estendere sempre `Throwable` direttamente per massima flessibilita\u0027","en":"Always extend `Throwable` directly for maximum flexibility"},{"it":"Non ha alcun impatto: checked e unchecked sono equivalenti a runtime e in compilazione","en":"It has no impact: checked and unchecked are equivalent at runtime and at compile time"}],"correct":0,"explanation":{"it":"In sintesi: la scelta di design e\u0027: estendere `RuntimeException` (unchecked) per errori di programmazione o non recuperabili, evitando di inquinare le firme; estendere `Exception` (checked) quando il chiamante puo\u0027 ragionevolmente reagire e vuoi costringerlo a gestire il caso. La regola e\u0027 checked per condizioni recuperabili e prevedibili.\nLe altre opzioni: estendere `Error` e\u0027 riservato a problemi gravi della VM, `Throwable` diretto e\u0027 sconsigliato, e checked/unchecked non sono equivalenti (cambiano gli obblighi a compile-time).","en":"In summary: the design choice is this: extend `RuntimeException` (unchecked) for programming errors or unrecoverable ones, avoiding polluting the signatures; extend `Exception` (checked) when the caller can reasonably react and you want to force them to handle the case. The rule is checked for recoverable and predictable conditions.\nThe other options: extending `Error` is reserved for serious VM problems, extending `Throwable` directly is discouraged, and checked/unchecked are not equivalent (they change the compile-time obligations)."}},{"type":"truefalse","prompt":{"it":"Catturare un\u0027eccezione con un blocco `catch` vuoto (swallow) e\u0027 un anti-pattern perche\u0027 nasconde l\u0027errore e complica il debug.","en":"Catching an exception with an empty `catch` block (swallowing it) is an anti-pattern because it hides the error and complicates debugging."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e\u0027 vero. Un `catch` vuoto \u0027ingoia\u0027 l\u0027eccezione: nasconde l\u0027errore, rende il bug invisibile e complica enormemente il debug. La best practice e\u0027 almeno loggare con contesto, rilanciare incapsulando (chaining) o gestire davvero il caso.\nLe altre opzioni: considerarlo accettabile porta a fallimenti silenziosi che si manifestano lontano dalla causa reale.","en":"In summary: it\u0027s true. An empty `catch` \u0027swallows\u0027 the exception: it hides the error, makes the bug invisible and greatly complicates debugging. The best practice is at least to log with context, rethrow it wrapped (chaining) or genuinely handle the case.\nThe other options: considering it acceptable leads to silent failures that surface far from the real cause."}}]},{"id":"jpa-hibernate","title":"JPA / Hibernate","questions":[{"type":"mcq","prompt":{"it":"Qual e il problema fondamentale che un ORM come Hibernate mira a risolvere?","en":"What is the fundamental problem that an ORM like Hibernate aims to solve?"},"code":"","options":[{"it":"L\u0027object-relational impedance mismatch tra modello a oggetti e modello relazionale","en":"The object-relational impedance mismatch between the object model and the relational model"},{"it":"L\u0027assenza di un connection pool nel driver JDBC","en":"The lack of a connection pool in the JDBC driver"},{"it":"La generazione automatica degli indici sul database","en":"The automatic generation of database indexes"},{"it":"La replica dei dati tra piu istanze di database","en":"Data replication across multiple database instances"}],"correct":0,"explanation":{"it":"In sintesi: un ORM colma l\u0027object-relational impedance mismatch, cioe la distanza strutturale tra il mondo a oggetti (ereditarieta, associazioni, identita per riferimento) e quello relazionale (tabelle, righe, foreign key, identita per chiave primaria); mappa entita a tabelle e rende la persistenza trasparente allo sviluppatore.\nLe altre opzioni: connection pool, indici e replica sono responsabilita di driver, DBA o infrastruttura, non il nucleo del problema che un ORM affronta.","en":"In summary: an ORM bridges the object-relational impedance mismatch, that is, the structural gap between the object world (inheritance, associations, identity by reference) and the relational world (tables, rows, foreign keys, identity by primary key); it maps entities to tables and makes persistence transparent to the developer.\nThe other options: connection pooling, indexes and replication are the responsibility of the driver, the DBA or the infrastructure, not the core problem an ORM addresses."}},{"type":"mcq","prompt":{"it":"Quale strategia di @GeneratedValue delega la generazione della chiave primaria a una colonna auto-increment/identity del database?","en":"Which @GeneratedValue strategy delegates primary key generation to a database auto-increment/identity column?"},"code":"","options":[{"it":"GenerationType.IDENTITY","en":"GenerationType.IDENTITY"},{"it":"GenerationType.SEQUENCE","en":"GenerationType.SEQUENCE"},{"it":"GenerationType.TABLE","en":"GenerationType.TABLE"},{"it":"GenerationType.AUTO","en":"GenerationType.AUTO"}],"correct":0,"explanation":{"it":"In sintesi: `GenerationType.IDENTITY` affida la generazione della PK a una colonna auto-increment/identity del database, quindi il valore e disponibile solo dopo l\u0027esecuzione dell\u0027INSERT.\nLe altre opzioni: `SEQUENCE` usa una sequence del DB, `TABLE` una tabella di supporto dedicata, `AUTO` lascia al provider la scelta della strategia in base al dialect.","en":"In summary: `GenerationType.IDENTITY` delegates PK generation to a database auto-increment/identity column, so the value is only available after the INSERT is executed.\nThe other options: `SEQUENCE` uses a database sequence, `TABLE` a dedicated support table, `AUTO` lets the provider choose the strategy based on the dialect."}},{"type":"code","prompt":{"it":"Le due find vengono eseguite nello stesso EntityManager/transazione. Cosa stampa e quante SELECT vengono eseguite?","en":"The two find calls run in the same EntityManager/transaction. What does it print and how many SELECTs are executed?"},"code":"Long id = 1L;\nCustomer c1 = em.find(Customer.class, id);\nCustomer c2 = em.find(Customer.class, id);\nSystem.out.println(c1 == c2);","options":[{"it":"true, ed e stata eseguita una sola SELECT","en":"true, and a single SELECT was executed"},{"it":"false, sono due istanze distinte con due SELECT","en":"false, they are two distinct instances with two SELECTs"},{"it":"true, ma sono state eseguite due SELECT","en":"true, but two SELECTs were executed"},{"it":"false, la seconda find restituisce null","en":"false, the second find returns null"}],"correct":0,"explanation":{"it":"In sintesi: il persistence context e una cache di primo livello con garanzia di identita: per una data chiave nello stesso contesto esiste una sola istanza gestita, quindi la seconda `find` la restituisce dalla cache senza andare al DB e `c1 == c2` e true con una sola SELECT.\nLe altre opzioni: presuppongono due istanze o due query, ignorando l\u0027identita garantita dal first-level cache, oppure un null che non ha ragione di esistere se la riga c\u0027e.","en":"In summary: the persistence context is a first-level cache with an identity guarantee: for a given key within the same context there is a single managed instance, so the second `find` returns it from the cache without hitting the database and `c1 == c2` is true with a single SELECT.\nThe other options: they assume two instances or two queries, ignoring the identity guaranteed by the first-level cache, or a null that has no reason to exist if the row is there."}},{"type":"mcq","prompt":{"it":"Un\u0027entita persistent viene rimossa dal persistence context tramite em.detach() oppure alla chiusura dell\u0027EntityManager. In quale stato transita?","en":"A persistent entity is removed from the persistence context via em.detach() or when the EntityManager is closed. Into which state does it transition?"},"code":"","options":[{"it":"detached","en":"detached"},{"it":"removed","en":"removed"},{"it":"transient","en":"transient"},{"it":"persistent","en":"persistent"}],"correct":0,"explanation":{"it":"In sintesi: un\u0027entita che ha un\u0027identita persistente ma non e piu tracciata da un persistence context e detached; le modifiche successive non vengono piu rilevate dal dirty checking finche non si fa `merge`.\nLe altre opzioni: `removed` si ha dopo `remove`, `transient` e un\u0027istanza nuova mai associata a un contesto e senza identita nel DB, `persistent` e proprio lo stato che si perde detachando.","en":"In summary: an entity that has a persistent identity but is no longer tracked by a persistence context is detached; subsequent changes are no longer picked up by dirty checking until you call `merge`.\nThe other options: `removed` occurs after `remove`, `transient` is a new instance never associated with a context and without an identity in the database, `persistent` is precisely the state that is lost when detaching."}},{"type":"mcq","prompt":{"it":"In una relazione bidirezionale @OneToMany/@ManyToOne, dove risiede tipicamente la foreign key nello schema del database?","en":"In a bidirectional @OneToMany/@ManyToOne relationship, where does the foreign key typically reside in the database schema?"},"code":"","options":[{"it":"Nella tabella del lato @ManyToOne, che e l\u0027owning side","en":"In the table of the @ManyToOne side, which is the owning side"},{"it":"Nella tabella del lato @OneToMany","en":"In the table of the @OneToMany side"},{"it":"In una tabella di join dedicata","en":"In a dedicated join table"},{"it":"Duplicata in entrambe le tabelle","en":"Duplicated in both tables"}],"correct":0,"explanation":{"it":"In sintesi: nel classico uno-a-molti bidirezionale l\u0027owning side e il @ManyToOne (il lato molti), ed e li che vive la foreign key; il @OneToMany e il lato inverso e usa `mappedBy`.\nLe altre opzioni: mettere la FK sul lato @OneToMany o duplicarla e strutturalmente sbagliato, e la join table appartiene di norma al @ManyToMany, non a un @OneToMany standard.","en":"In summary: in the classic bidirectional one-to-many, the owning side is the @ManyToOne (the many side), and that is where the foreign key lives; the @OneToMany is the inverse side and uses `mappedBy`.\nThe other options: putting the FK on the @OneToMany side or duplicating it is structurally wrong, and a join table normally belongs to a @ManyToMany, not to a standard @OneToMany."}},{"type":"truefalse","prompt":{"it":"In JPA, le associazioni @ManyToOne e @OneToOne hanno fetch EAGER per default, mentre @OneToMany e @ManyToMany sono LAZY.","en":"In JPA, @ManyToOne and @OneToOne associations are EAGER by default, whereas @OneToMany and @ManyToMany are LAZY."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: la specifica JPA definisce EAGER il default per `@ManyToOne` e `@OneToOne`, LAZY per `@OneToMany` e `@ManyToMany`; per questo si consiglia spesso di forzare `fetch = LAZY` anche sui to-one per evitare caricamenti impliciti.\nLe altre opzioni: dire Falso e l\u0027errore tipico di chi crede che tutto sia LAZY di default, dimenticando che i to-one sono EAGER salvo override esplicito.","en":"In summary: the JPA specification defines EAGER as the default for `@ManyToOne` and `@OneToOne`, and LAZY for `@OneToMany` and `@ManyToMany`; this is why it is often recommended to force `fetch = LAZY` on to-one associations as well, to avoid implicit loading.\nThe other options: answering False is the typical mistake of those who believe everything is LAZY by default, forgetting that to-one associations are EAGER unless explicitly overridden."}},{"type":"code","prompt":{"it":"La collezione orders di Customer e mappata LAZY. Cosa accade eseguendo loadOrders()?","en":"The orders collection of Customer is mapped LAZY. What happens when loadOrders() runs?"},"code":"public List\u003cOrder\u003e loadOrders() {\n    Customer c;\n    try (EntityManager em = emf.createEntityManager()) {\n        c = em.find(Customer.class, 1L);\n    } // persistence context chiuso qui\n    return c.getOrders(); // orders e LAZY\n}","options":[{"it":"Lancia LazyInitializationException: la collezione LAZY viene acceduta a persistence context chiuso","en":"It throws LazyInitializationException: the LAZY collection is accessed after the persistence context is closed"},{"it":"Carica gli ordini con una SELECT aggiuntiva e li restituisce","en":"It loads the orders with an additional SELECT and returns them"},{"it":"Restituisce null","en":"It returns null"},{"it":"Restituisce una lista vuota","en":"It returns an empty list"}],"correct":0,"explanation":{"it":"In sintesi: la collezione LAZY e un proxy che ha bisogno di una sessione aperta per inizializzarsi; qui l\u0027EntityManager e gia chiuso quando si chiama `getOrders()`, quindi Hibernate lancia `LazyInitializationException`. La cura corretta e caricare i dati dentro la transazione con JOIN FETCH, `@EntityGraph` o mappandoli in un DTO.\nLe altre opzioni: senza sessione attiva Hibernate non puo emettere la SELECT tardiva, e non restituisce ne null ne lista vuota: fallisce esplicitamente.","en":"In summary: the LAZY collection is a proxy that needs an open session to initialize; here the EntityManager is already closed when `getOrders()` is called, so Hibernate throws `LazyInitializationException`. The correct fix is to load the data within the transaction using JOIN FETCH, `@EntityGraph`, or by mapping it into a DTO.\nThe other options: without an active session Hibernate cannot issue the deferred SELECT, and it returns neither null nor an empty list: it fails explicitly."}},{"type":"mcq","prompt":{"it":"Carichi 100 Customer e poi in un ciclo accedi a customer.getOrders() (LAZY). Nel caso peggiore quante query vengono eseguite?","en":"You load 100 Customers and then, in a loop, access customer.getOrders() (LAZY). In the worst case, how many queries are executed?"},"code":"","options":[{"it":"101: una per i customer piu una per ciascun customer (problema N+1)","en":"101: one for the customers plus one for each customer (the N+1 problem)"},{"it":"1: una sola query con join automatico","en":"1: a single query with an automatic join"},{"it":"100: una query per customer","en":"100: one query per customer"},{"it":"2: una per i customer e una per tutti gli orders","en":"2: one for the customers and one for all the orders"}],"correct":0,"explanation":{"it":"In sintesi: e il classico problema N+1: una query per caricare gli N customer piu una query per inizializzare la collezione LAZY di ognuno, per un totale di N+1 (qui 101). Si risolve con JOIN FETCH, `@EntityGraph` o batch fetching.\nLe altre opzioni: una sola query o due query descrivono gia lo scenario ottimizzato, mentre 100 dimentica la query iniziale sui customer.","en":"In summary: this is the classic N+1 problem: one query to load the N customers plus one query to initialize each one\u0027s LAZY collection, for a total of N+1 (here 101). It is solved with JOIN FETCH, `@EntityGraph` or batch fetching.\nThe other options: a single query or two queries already describe the optimized scenario, while 100 forgets the initial query on the customers."}},{"type":"mcq","prompt":{"it":"Quale tecnica risolve alla radice il problema N+1 caricando le entita e la loro associazione in un\u0027unica query?","en":"Which technique solves the N+1 problem at its root by loading the entities and their association in a single query?"},"code":"","options":[{"it":"Usare JOIN FETCH in JPQL (o un @EntityGraph)","en":"Using JOIN FETCH in JPQL (or an @EntityGraph)"},{"it":"Impostare fetch = FetchType.EAGER sulla collezione","en":"Setting fetch = FetchType.EAGER on the collection"},{"it":"Aumentare la dimensione del connection pool","en":"Increasing the connection pool size"},{"it":"Disabilitare la cache di primo livello","en":"Disabling the first-level cache"}],"correct":0,"explanation":{"it":"In sintesi: `JOIN FETCH` (o l\u0027equivalente dichiarativo `@EntityGraph`) istruisce Hibernate a recuperare padre e associazione in una singola query, eliminando le N query aggiuntive.\nLe altre opzioni: EAGER sulla collezione non elimina l\u0027N+1 (spesso lo sposta o genera comunque select multiple), e pool e first-level cache non c\u0027entrano con il numero di query di fetch.","en":"In summary: `JOIN FETCH` (or its declarative equivalent `@EntityGraph`) instructs Hibernate to retrieve the parent and the association in a single query, eliminating the N additional queries.\nThe other options: EAGER on the collection does not eliminate the N+1 (it often just moves it or still generates multiple selects), and the pool and the first-level cache have nothing to do with the number of fetch queries."}},{"type":"mcq","prompt":{"it":"Con cascade = CascadeType.PERSIST su un @OneToMany, cosa succede quando persisti l\u0027entita padre contenente figli nuovi (transient) nella collezione?","en":"With cascade = CascadeType.PERSIST on a @OneToMany, what happens when you persist the parent entity containing new (transient) children in the collection?"},"code":"","options":[{"it":"Anche i figli vengono persistiti automaticamente insieme al padre","en":"The children are also persisted automatically along with the parent"},{"it":"I figli restano transient finche non li persisti singolarmente","en":"The children stay transient until you persist them individually"},{"it":"Viene lanciata un\u0027eccezione perche i figli sono transient","en":"An exception is thrown because the children are transient"},{"it":"I figli vengono aggiornati ma non inseriti","en":"The children are updated but not inserted"}],"correct":0,"explanation":{"it":"In sintesi: `CascadeType.PERSIST` propaga l\u0027operazione di persist dal padre ai figli, quindi persistendo il padre vengono inseriti anche i figli nuovi presenti nella collezione, senza chiamare `persist` su ciascuno.\nLe altre opzioni: senza cascade i figli transient darebbero errore al flush, ma proprio la presenza del cascade PERSIST evita sia l\u0027eccezione sia la necessita di persist manuale.","en":"In summary: `CascadeType.PERSIST` propagates the persist operation from the parent to the children, so persisting the parent also inserts the new children present in the collection, without calling `persist` on each of them.\nThe other options: without cascade the transient children would cause an error at flush, but it is precisely the presence of cascade PERSIST that avoids both the exception and the need for a manual persist."}},{"type":"code","prompt":{"it":"L\u0027entita non viene mai passata a persist/merge/save. Cosa accade al commit?","en":"The entity is never passed to persist/merge/save. What happens on commit?"},"code":"em.getTransaction().begin();\nProduct p = em.find(Product.class, 1L);\np.setPrice(new BigDecimal(\"99.99\"));\n// nessuna chiamata a persist / merge / save\nem.getTransaction().commit();","options":[{"it":"Al commit Hibernate rileva la modifica con il dirty checking e genera un UPDATE","en":"On commit Hibernate detects the change via dirty checking and generates an UPDATE"},{"it":"Nessun UPDATE: serve chiamare em.merge() esplicitamente","en":"No UPDATE: you need to call em.merge() explicitly"},{"it":"Nessun UPDATE: serve chiamare em.persist()","en":"No UPDATE: you need to call em.persist()"},{"it":"Viene lanciata un\u0027eccezione perche l\u0027entita non e stata salvata","en":"An exception is thrown because the entity was not saved"}],"correct":0,"explanation":{"it":"In sintesi: `p` e un\u0027entita managed; il persistence context ne conserva uno snapshot e al flush/commit confronta lo stato corrente con lo snapshot (dirty checking), rilevando il prezzo cambiato ed emettendo l\u0027UPDATE senza alcuna chiamata esplicita di salvataggio.\nLe altre opzioni: `merge` serve per entita detached e `persist` per le transient; su un\u0027entita gia gestita non servono, e non c\u0027e nessuna eccezione.","en":"In summary: `p` is a managed entity; the persistence context keeps a snapshot of it and, at flush/commit, compares the current state with the snapshot (dirty checking), detecting the changed price and issuing the UPDATE without any explicit save call.\nThe other options: `merge` is for detached entities and `persist` is for transient ones; on an already-managed entity neither is needed, and there is no exception."}},{"type":"mcq","prompt":{"it":"Con @Transactional di Spring e configurazione di default, per quale tipo di eccezione avviene il rollback automatico?","en":"With Spring\u0027s @Transactional and the default configuration, for which type of exception does automatic rollback occur?"},"code":"","options":[{"it":"Solo per RuntimeException ed Error (unchecked); le checked exception non causano rollback di default","en":"Only for RuntimeException and Error (unchecked); checked exceptions do not trigger a rollback by default"},{"it":"Per qualsiasi eccezione, checked e unchecked","en":"For any exception, checked and unchecked"},{"it":"Solo per le checked exception","en":"Only for checked exceptions"},{"it":"Per nessuna eccezione: il rollback e sempre manuale","en":"For no exception: rollback is always manual"}],"correct":0,"explanation":{"it":"In sintesi: il default di Spring fa rollback solo su `RuntimeException` ed `Error` (unchecked); per far scattare il rollback anche su una checked exception occorre configurarlo con `rollbackFor`. E una fonte classica di bug: un metodo che lancia una checked exception ma committa comunque.\nLe altre opzioni: rollback su tutto, solo su checked, o mai, descrivono comportamenti diversi da quello di default di Spring.","en":"In summary: Spring\u0027s default rolls back only on `RuntimeException` and `Error` (unchecked); to trigger a rollback on a checked exception as well you must configure it with `rollbackFor`. It is a classic source of bugs: a method that throws a checked exception but commits anyway.\nThe other options: rollback on everything, only on checked, or never, describe behaviors different from Spring\u0027s default."}},{"type":"mcq","prompt":{"it":"Quale affermazione su JPQL e corretta?","en":"Which statement about JPQL is correct?"},"code":"","options":[{"it":"JPQL opera su entita e loro attributi, non direttamente su tabelle e colonne","en":"JPQL operates on entities and their attributes, not directly on tables and columns"},{"it":"JPQL e identico all\u0027SQL nativo e lavora su tabelle e colonne","en":"JPQL is identical to native SQL and works on tables and columns"},{"it":"JPQL non supporta i join","en":"JPQL does not support joins"},{"it":"JPQL restituisce sempre dati non gestiti, bypassando il persistence context","en":"JPQL always returns unmanaged data, bypassing the persistence context"}],"correct":0,"explanation":{"it":"In sintesi: JPQL e un linguaggio orientato all\u0027object model: le query si scrivono su nomi di entita e loro attributi, e il provider le traduce nell\u0027SQL del dialect specifico. Le entita restituite sono gestite dal persistence context.\nLe altre opzioni: non e SQL nativo, supporta pienamente i join (anche JOIN FETCH), e le entita selezionate risultano managed, non detached.","en":"In summary: JPQL is a language oriented to the object model: queries are written against entity names and their attributes, and the provider translates them into the SQL of the specific dialect. The returned entities are managed by the persistence context.\nThe other options: it is not native SQL, it fully supports joins (including JOIN FETCH), and the selected entities are managed, not detached."}},{"type":"mcq","prompt":{"it":"In una relazione bidirezionale, dove va posto l\u0027attributo mappedBy e cosa indica?","en":"In a bidirectional relationship, where should the mappedBy attribute be placed and what does it indicate?"},"code":"","options":[{"it":"Sul lato inverso (non-owning); indica il campo che possiede la relazione sull\u0027owning side","en":"On the inverse (non-owning) side; it names the field that owns the relationship on the owning side"},{"it":"Sull\u0027owning side, per indicare la colonna foreign key","en":"On the owning side, to indicate the foreign key column"},{"it":"Su entrambi i lati della relazione","en":"On both sides of the relationship"},{"it":"Solo nelle relazioni @ManyToMany","en":"Only in @ManyToMany relationships"}],"correct":0,"explanation":{"it":"In sintesi: `mappedBy` si mette sul lato inverso (non-owning) e nomina il campo dell\u0027owning side che gestisce la foreign key; cosi si dichiara che quel lato non possiede la relazione e non deve generare una seconda colonna o join table.\nLe altre opzioni: sull\u0027owning side si usa invece `@JoinColumn`, metterlo su entrambi i lati e un errore, e `mappedBy` vale anche per @OneToMany/@OneToOne, non solo @ManyToMany.","en":"In summary: `mappedBy` goes on the inverse (non-owning) side and names the field on the owning side that manages the foreign key; this declares that this side does not own the relationship and must not generate a second column or join table.\nThe other options: on the owning side you use `@JoinColumn` instead, putting it on both sides is a mistake, and `mappedBy` also applies to @OneToMany/@OneToOne, not just @ManyToMany."}},{"type":"mcq","prompt":{"it":"Perche usare l\u0027ID generato dal database dentro equals() e hashCode() di un\u0027entita e considerato problematico?","en":"Why is using the database-generated ID inside an entity\u0027s equals() and hashCode() considered problematic?"},"code":"","options":[{"it":"Prima del persist l\u0027ID e null e cambia dopo l\u0027insert, violando il contratto in HashSet/HashMap","en":"Before persist the ID is null and changes after the insert, violating the contract in a HashSet/HashMap"},{"it":"Perche l\u0027ID non e mai garantito univoco","en":"Because the ID is never guaranteed to be unique"},{"it":"Perche Hibernate vieta di usare l\u0027ID in equals","en":"Because Hibernate forbids using the ID in equals"},{"it":"Perche l\u0027ID non e serializzabile","en":"Because the ID is not serializable"}],"correct":0,"explanation":{"it":"In sintesi: un ID generato dal DB e null finche l\u0027entita e transient e cambia dopo il persist; se e usato in `hashCode`, l\u0027hash dell\u0027oggetto muta dopo l\u0027inserimento e l\u0027istanza gia messa in un `HashSet` finisce nel bucket sbagliato, rompendo `contains`. Meglio una business key stabile o un hashCode costante.\nLe altre opzioni: l\u0027ID e univoco, Hibernate non lo vieta e la serializzabilita non c\u0027entra: il vero problema e la mutabilita dell\u0027ID nel ciclo di vita.","en":"In summary: a database-generated ID is null while the entity is transient and changes after persist; if it is used in `hashCode`, the object\u0027s hash mutates after the insert and an instance already placed in a `HashSet` ends up in the wrong bucket, breaking `contains`. It is better to use a stable business key or a constant hashCode.\nThe other options: the ID is unique, Hibernate does not forbid it, and serializability is irrelevant: the real problem is the ID\u0027s mutability across the lifecycle."}},{"type":"code","prompt":{"it":"Tx A e Tx B leggono la stessa riga con version=5. Tx A aggiorna e committa (version diventa 6). Poi Tx B, che aveva letto version=5, prova a committare il proprio update. Cosa accade?","en":"Tx A and Tx B read the same row with version=5. Tx A updates and commits (version becomes 6). Then Tx B, which had read version=5, tries to commit its own update. What happens?"},"code":"@Entity\nclass Account {\n  @Id Long id;\n  @Version Long version;\n  BigDecimal balance;\n}","options":[{"it":"Tx B fallisce con OptimisticLockException perche la version attesa non corrisponde a quella su DB","en":"Tx B fails with OptimisticLockException because the expected version does not match the one in the database"},{"it":"Tx B sovrascrive senza problemi i dati di Tx A","en":"Tx B overwrites Tx A\u0027s data without any problem"},{"it":"Tx B attende finche Tx A rilascia un lock pessimistico","en":"Tx B waits until Tx A releases a pessimistic lock"},{"it":"Entrambe committano e la version diventa 7","en":"Both commit and the version becomes 7"}],"correct":0,"explanation":{"it":"In sintesi: con `@Version` l\u0027UPDATE di Tx B include un WHERE su version=5; poiche Tx A l\u0027ha gia portata a 6, l\u0027UPDATE aggiorna zero righe e Hibernate lancia `OptimisticLockException`, prevenendo il lost update. E locking ottimistico, senza lock fisici sul DB.\nLe altre opzioni: nessuna sovrascrittura silenziosa, nessuna attesa su lock (quello sarebbe pessimistico) e la version non arriva a 7 perche il secondo commit fallisce.","en":"In summary: with `@Version`, Tx B\u0027s UPDATE includes a WHERE on version=5; since Tx A has already advanced it to 6, the UPDATE affects zero rows and Hibernate throws `OptimisticLockException`, preventing the lost update. This is optimistic locking, with no physical locks on the database.\nThe other options: there is no silent overwrite, no waiting on a lock (that would be pessimistic), and the version does not reach 7 because the second commit fails."}},{"type":"mcq","prompt":{"it":"[Stretch] Perche GenerationType.IDENTITY puo penalizzare le performance di inserimenti massivi in Hibernate?","en":"[Stretch] Why can GenerationType.IDENTITY hurt the performance of bulk inserts in Hibernate?"},"code":"","options":[{"it":"Impedisce il JDBC batch insert: per ottenere la chiave Hibernate deve eseguire subito ogni INSERT","en":"It prevents JDBC batch inserts: to obtain the key, Hibernate must execute each INSERT immediately"},{"it":"Richiede una SELECT sulla sequence prima di ogni INSERT","en":"It requires a SELECT on the sequence before every INSERT"},{"it":"Blocca l\u0027intera tabella durante gli insert","en":"It locks the entire table during the inserts"},{"it":"Disabilita la cache di secondo livello","en":"It disables the second-level cache"}],"correct":0,"explanation":{"it":"In sintesi: con IDENTITY la chiave e nota solo dopo l\u0027INSERT, quindi Hibernate non puo accodare le INSERT in un batch JDBC (avrebbe bisogno dell\u0027id prima) e le esegue una a una, perdendo il vantaggio del batching. SEQUENCE, potendo pre-allocare gli id, consente il batch.\nLe altre opzioni: la SELECT-prima-dell\u0027insert e semmai il costo (mitigabile) di SEQUENCE, e IDENTITY non blocca la tabella ne tocca la cache di secondo livello.","en":"In summary: with IDENTITY the key is known only after the INSERT, so Hibernate cannot queue the INSERTs into a JDBC batch (it would need the id beforehand) and executes them one by one, losing the benefit of batching. SEQUENCE, being able to pre-allocate ids, allows batching.\nThe other options: the SELECT-before-insert is, if anything, the (mitigable) cost of SEQUENCE, and IDENTITY neither locks the table nor touches the second-level cache."}},{"type":"truefalse","prompt":{"it":"La cache di primo livello (persistence context) e condivisa tra tutti gli EntityManager/sessioni dell\u0027applicazione.","en":"The first-level cache (persistence context) is shared across all the EntityManagers/sessions in the application."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027affermazione e falsa: il first-level cache e strettamente legato al singolo persistence context/sessione e vive quanto quello; e la cache di secondo livello (opzionale) a essere condivisa a livello di SessionFactory tra piu sessioni.\nLe altre opzioni: rispondere Vero e l\u0027errore classico di chi confonde la cache di primo livello con quella di secondo livello.","en":"In summary: the statement is false: the first-level cache is strictly tied to the individual persistence context/session and lives only as long as it does; it is the (optional) second-level cache that is shared at the SessionFactory level across multiple sessions.\nThe other options: answering True is the classic mistake of confusing the first-level cache with the second-level cache."}},{"type":"code","prompt":{"it":"detached e un\u0027entita staccata con id=1. Quale valore del nome viene salvato sul DB al commit?","en":"detached is a detached entity with id=1. Which value of the name is saved to the database on commit?"},"code":"Customer detached = ...; // detached, id=1, name=\"Anna\"\ndetached.setName(\"Mario\");\nem.getTransaction().begin();\nCustomer managed = em.merge(detached);\nmanaged.setName(\"Luigi\");\ndetached.setName(\"Peach\");\nem.getTransaction().commit();","options":[{"it":"Luigi: merge restituisce un\u0027istanza managed distinta e solo le modifiche a quella vengono tracciate","en":"Luigi: merge returns a distinct managed instance and only changes to that one are tracked"},{"it":"Peach: detached e managed sono lo stesso oggetto","en":"Peach: detached and managed are the same object"},{"it":"Mario: conta solo lo stato al momento della merge","en":"Mario: only the state at the time of the merge counts"},{"it":"Viene lanciata un\u0027eccezione per modifica concorrente","en":"An exception is thrown due to concurrent modification"}],"correct":0,"explanation":{"it":"In sintesi: `merge` copia lo stato dell\u0027entita detached in una nuova istanza managed che restituisce; il dirty checking traccia solo quella. `managed.setName(\"Luigi\")` viene quindi persistito, mentre il successivo `detached.setName(\"Peach\")` agisce su un\u0027istanza non gestita e viene ignorato. Il bug tipico e continuare a usare il riferimento originale dopo la merge.\nLe altre opzioni: detached e managed sono oggetti distinti (quindi non Peach), lo stato al momento della merge sarebbe Mario ma poi Luigi lo sovrascrive, e non c\u0027e alcun conflitto di versione.","en":"In summary: `merge` copies the state of the detached entity into a new managed instance that it returns; dirty checking tracks only that one. `managed.setName(\"Luigi\")` is therefore persisted, while the subsequent `detached.setName(\"Peach\")` acts on an unmanaged instance and is ignored. The typical bug is to keep using the original reference after the merge.\nThe other options: detached and managed are distinct objects (so not Peach), the state at the time of the merge would be Mario but Luigi then overwrites it, and there is no version conflict."}},{"type":"mcq","prompt":{"it":"Come viene mappata tipicamente una @ManyToMany bidirezionale a livello di schema del database?","en":"How is a bidirectional @ManyToMany typically mapped at the database schema level?"},"code":"","options":[{"it":"Con una tabella di join (join table) che contiene le due foreign key","en":"With a join table that holds the two foreign keys"},{"it":"Con una foreign key duplicata in entrambe le tabelle","en":"With a foreign key duplicated in both tables"},{"it":"Con una singola foreign key sull\u0027owning side","en":"With a single foreign key on the owning side"},{"it":"Con una colonna di tipo array","en":"With a column of array type"}],"correct":0,"explanation":{"it":"In sintesi: una @ManyToMany richiede una join table intermedia con le due FK verso le tabelle collegate, perche una relazione molti-a-molti non e rappresentabile con una semplice colonna FK.\nLe altre opzioni: la singola FK e la FK duplicata descrivono relazioni to-one, e le colonne array non sono il modello relazionale standard usato da JPA per il many-to-many.","en":"In summary: a @ManyToMany requires an intermediate join table with the two FKs pointing to the linked tables, because a many-to-many relationship cannot be represented with a simple FK column.\nThe other options: a single FK and a duplicated FK describe to-one relationships, and array columns are not the standard relational model used by JPA for many-to-many."}},{"type":"mcq","prompt":{"it":"Qual e la differenza tra orphanRemoval = true e CascadeType.REMOVE su un @OneToMany?","en":"What is the difference between orphanRemoval = true and CascadeType.REMOVE on a @OneToMany?"},"code":"","options":[{"it":"orphanRemoval elimina il figlio anche solo rimuovendolo dalla collezione; REMOVE cancella i figli quando si rimuove il padre","en":"orphanRemoval deletes the child even when it is merely removed from the collection; REMOVE deletes the children when the parent is removed"},{"it":"Sono sinonimi e producono lo stesso SQL","en":"They are synonyms and produce the same SQL"},{"it":"orphanRemoval agisce sull\u0027owning side, REMOVE sul lato inverso","en":"orphanRemoval acts on the owning side, REMOVE on the inverse side"},{"it":"orphanRemoval disabilita il cascade REMOVE","en":"orphanRemoval disables cascade REMOVE"}],"correct":0,"explanation":{"it":"In sintesi: `orphanRemoval = true` cancella il figlio quando viene sganciato dalla collezione del padre (diventa orfano), anche senza cancellare il padre; `CascadeType.REMOVE` propaga la cancellazione solo quando si rimuove il padre stesso. Il primo copre quindi anche il de-associamento, il secondo no.\nLe altre opzioni: non sono sinonimi, non si distinguono per owning/inverse side, e orphanRemoval non disabilita il cascade REMOVE: sono comportamenti complementari.","en":"In summary: `orphanRemoval = true` deletes the child when it is detached from the parent\u0027s collection (it becomes an orphan), even without deleting the parent; `CascadeType.REMOVE` propagates the deletion only when the parent itself is removed. The former therefore also covers de-association, the latter does not.\nThe other options: they are not synonyms, they are not distinguished by owning/inverse side, and orphanRemoval does not disable cascade REMOVE: they are complementary behaviors."}},{"type":"mcq","prompt":{"it":"A cosa serve @EntityGraph in JPA?","en":"What is @EntityGraph used for in JPA?"},"code":"","options":[{"it":"A definire dichiarativamente quali associazioni caricare EAGER per una specifica query, evitando l\u0027N+1","en":"To declaratively define which associations to load EAGERLY for a specific query, avoiding the N+1"},{"it":"A creare indici sul database","en":"To create database indexes"},{"it":"A sostituire il persistence context con una cache distribuita","en":"To replace the persistence context with a distributed cache"},{"it":"A forzare tutte le associazioni globalmente a LAZY","en":"To force all associations globally to LAZY"}],"correct":0,"explanation":{"it":"In sintesi: `@EntityGraph` permette di specificare per singola query quale grafo di associazioni pre-caricare (fetch plan), ottenendo l\u0027effetto di un JOIN FETCH in modo dichiarativo e mitigando l\u0027N+1 senza cambiare il mapping di default.\nLe altre opzioni: non genera indici, non e una cache distribuita e non modifica globalmente le strategie di fetch: agisce a livello di singola operazione.","en":"In summary: `@EntityGraph` lets you specify, per query, which graph of associations to preload (a fetch plan), achieving the effect of a JOIN FETCH declaratively and mitigating the N+1 without changing the default mapping.\nThe other options: it does not generate indexes, it is not a distributed cache, and it does not globally change fetch strategies: it acts at the level of a single operation."}},{"type":"truefalse","prompt":{"it":"Con FlushMode AUTO (il default), Hibernate puo eseguire un flush automatico prima di una query per garantire che questa veda le modifiche pendenti nel persistence context.","en":"With FlushMode AUTO (the default), Hibernate can perform an automatic flush before a query to ensure it sees the pending changes in the persistence context."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: e vero: con `FlushMode.AUTO` Hibernate, prima di eseguire una query che potrebbe essere influenzata da modifiche in sospeso, effettua un flush automatico sincronizzando lo stato SQL, cosi la query restituisce dati coerenti con le modifiche non ancora committate.\nLe altre opzioni: rispondere Falso ignora questo comportamento del default AUTO, che con `FlushMode.COMMIT` sarebbe invece diverso (flush solo al commit).","en":"In summary: it is true: with `FlushMode.AUTO` Hibernate, before running a query that could be affected by pending changes, performs an automatic flush that synchronizes the SQL state, so the query returns data consistent with the not-yet-committed changes.\nThe other options: answering False ignores this behavior of the AUTO default, which with `FlushMode.COMMIT` would instead be different (flush only at commit)."}},{"type":"truefalse","prompt":{"it":"Chiamare em.flush() esegue anche il commit della transazione corrente.","en":"Calling em.flush() also commits the current transaction."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: e falso: `flush()` sincronizza le modifiche pendenti del persistence context con il database emettendo le istruzioni SQL, ma resta tutto dentro la transazione; senza `commit` le modifiche non sono rese definitive e un rollback le annulla comunque.\nLe altre opzioni: rispondere Vero confonde flush con commit, un errore frequente: sono due operazioni distinte.","en":"In summary: it is false: `flush()` synchronizes the pending changes of the persistence context with the database by issuing the SQL statements, but everything stays within the transaction; without `commit` the changes are not made permanent and a rollback still undoes them.\nThe other options: answering True confuses flush with commit, a frequent mistake: they are two distinct operations."}},{"type":"code","prompt":{"it":"[Stretch] La query fa JOIN FETCH di una collezione e applica setMaxResults. Qual e il comportamento reale di Hibernate?","en":"[Stretch] The query does a JOIN FETCH of a collection and applies setMaxResults. What is Hibernate\u0027s actual behavior?"},"code":"List\u003cAuthor\u003e authors = em.createQuery(\n    \"SELECT a FROM Author a JOIN FETCH a.books\", Author.class)\n    .setFirstResult(0)\n    .setMaxResults(10)\n    .getResultList();","options":[{"it":"Applica la paginazione in memoria (carica tutte le righe e poi taglia), con warning HHH000104","en":"It applies pagination in memory (loads all the rows and then trims), with warning HHH000104"},{"it":"Applica correttamente LIMIT/OFFSET in SQL sulle entita distinte","en":"It correctly applies LIMIT/OFFSET in SQL on the distinct entities"},{"it":"Lancia un\u0027eccezione a runtime","en":"It throws an exception at runtime"},{"it":"Ignora silenziosamente setMaxResults","en":"It silently ignores setMaxResults"}],"correct":0,"explanation":{"it":"In sintesi: quando si combina JOIN FETCH di una collezione con la paginazione, Hibernate non puo tradurre `setMaxResults` in un LIMIT SQL affidabile, perche il join moltiplica le righe per elemento della collezione; percio carica l\u0027intero result set e pagina in memoria, emettendo il noto warning HHH000104. Per paginare correttamente si usa un fetch a due step o si pagina sugli id.\nLe altre opzioni: non c\u0027e un LIMIT corretto sulle entita, non viene lanciata un\u0027eccezione e setMaxResults non viene ignorato: viene applicato, ma lato applicazione.","en":"In summary: when you combine a JOIN FETCH of a collection with pagination, Hibernate cannot translate `setMaxResults` into a reliable SQL LIMIT, because the join multiplies the rows per collection element; therefore it loads the entire result set and paginates in memory, emitting the well-known warning HHH000104. To paginate correctly, use a two-step fetch or paginate on the ids.\nThe other options: there is no correct LIMIT on the entities, no exception is thrown, and setMaxResults is not ignored: it is applied, but on the application side."}},{"type":"truefalse","prompt":{"it":"Il campo annotato con @Version deve essere incrementato manualmente dallo sviluppatore a ogni update dell\u0027entita.","en":"The field annotated with @Version must be incremented manually by the developer on every update of the entity."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: e falso: il campo `@Version` e gestito interamente dal provider, che lo confronta nel WHERE dell\u0027UPDATE e lo incrementa automaticamente a ogni modifica; incrementarlo a mano interferirebbe con il meccanismo di optimistic locking.\nLe altre opzioni: rispondere Vero e l\u0027errore di chi pensa alla version come a un campo applicativo qualunque anziche a un contatore gestito da Hibernate.","en":"In summary: it is false: the `@Version` field is managed entirely by the provider, which compares it in the UPDATE\u0027s WHERE clause and increments it automatically on every change; incrementing it by hand would interfere with the optimistic locking mechanism.\nThe other options: answering True is the mistake of those who think of the version as just an ordinary application field rather than a counter managed by Hibernate."}},{"type":"code","prompt":{"it":"[Stretch] hashCode ed equals dell\u0027entita si basano sull\u0027id @GeneratedValue. Quale valore assume found?","en":"[Stretch] The entity\u0027s hashCode and equals are based on the @GeneratedValue id. What value does found take?"},"code":"@Entity\nclass Tag {\n  @Id @GeneratedValue Long id;\n  @Override public int hashCode() { return Objects.hash(id); }\n  @Override public boolean equals(Object o) {\n    return (o instanceof Tag t) \u0026\u0026 Objects.equals(id, t.id);\n  }\n}\n\nSet\u003cTag\u003e set = new HashSet\u003c\u003e();\nTag t = new Tag();   // id == null\nset.add(t);\nem.persist(t);       // ora id valorizzato dal DB\nboolean found = set.contains(t);","options":[{"it":"false: dopo il persist l\u0027hashCode cambia (id da null a valore) e l\u0027elemento finisce in un bucket diverso da quello di inserimento","en":"false: after persist the hashCode changes (id from null to a value) and the element ends up in a different bucket than the one it was inserted into"},{"it":"true: HashSet ricalcola automaticamente i bucket","en":"true: HashSet automatically recomputes the buckets"},{"it":"true: contains usa equals che confronta lo stesso riferimento","en":"true: contains uses equals, which compares the same reference"},{"it":"Lancia NullPointerException","en":"It throws NullPointerException"}],"correct":0,"explanation":{"it":"In sintesi: al momento dell\u0027`add` l\u0027id e null e l\u0027oggetto viene collocato nel bucket corrispondente a quell\u0027hash; dopo il `persist` l\u0027id cambia, quindi cambia l\u0027hashCode, ma l\u0027`HashSet` non ripartiziona gli elementi gia inseriti e `contains` cerca nel bucket sbagliato restituendo false. E esattamente il motivo per cui non si usa un id generato in hashCode.\nLe altre opzioni: l\u0027HashSet non ricalcola i bucket, `contains` usa prima l\u0027hashCode (non solo equals sul riferimento) e `Objects.hash(null)` non lancia NPE.","en":"In summary: at the time of the `add` the id is null and the object is placed in the bucket corresponding to that hash; after `persist` the id changes, so the hashCode changes, but the `HashSet` does not re-partition the already-inserted elements and `contains` looks in the wrong bucket, returning false. This is exactly why you do not use a generated id in hashCode.\nThe other options: the HashSet does not recompute the buckets, `contains` uses the hashCode first (not just equals on the reference), and `Objects.hash(null)` does not throw an NPE."}},{"type":"code","prompt":{"it":"Il @OneToMany verso lines NON ha cascade. line e un\u0027entita nuova (transient). Cosa accade?","en":"The @OneToMany to lines has NO cascade. line is a new (transient) entity. What happens?"},"code":"Order order = new Order();\nOrderLine line = new OrderLine();\norder.getLines().add(line); // @OneToMany senza cascade\nem.persist(order);\nem.getTransaction().commit();","options":[{"it":"Al flush viene lanciata un\u0027eccezione perche line e transient e manca il cascade PERSIST","en":"At flush an exception is thrown because line is transient and cascade PERSIST is missing"},{"it":"Sia order sia line vengono inseriti correttamente","en":"Both order and line are inserted correctly"},{"it":"Solo order viene inserito e line viene ignorata senza errori","en":"Only order is inserted and line is ignored without errors"},{"it":"Solo line viene inserita","en":"Only line is inserted"}],"correct":0,"explanation":{"it":"In sintesi: persistendo `order` senza `CascadeType.PERSIST`, l\u0027operazione non si propaga a `line`, che resta transient ma e referenziata da un\u0027entita managed; al flush Hibernate lo segnala con una eccezione tipo `TransientObjectException`/`TransientPropertyValueException`. Serve il cascade oppure persistere anche la line.\nLe altre opzioni: senza cascade line non viene inserita ne silenziosamente ignorata, e non e vero che solo line venga salvata: e proprio la line transient a provocare l\u0027errore.","en":"In summary: persisting `order` without `CascadeType.PERSIST`, the operation does not propagate to `line`, which remains transient but is referenced by a managed entity; at flush Hibernate flags it with an exception such as `TransientObjectException`/`TransientPropertyValueException`. You need the cascade, or you must persist the line as well.\nThe other options: without cascade, line is neither inserted nor silently ignored, and it is not true that only line is saved: it is precisely the transient line that causes the error."}},{"type":"code","prompt":{"it":"La relazione e @OneToMany(mappedBy=\"customer\") sul lato Customer e @ManyToOne su Order; la colonna customer_id e nullable. Viene aggiornata solo la collezione inversa. Quale valore ha customer_id nella riga order salvata?","en":"The relationship is @OneToMany(mappedBy=\"customer\") on the Customer side and @ManyToOne on Order; the customer_id column is nullable. Only the inverse collection is updated. What value does customer_id have in the saved order row?"},"code":"Customer c = em.find(Customer.class, 1L);\nOrder o = new Order();\nc.getOrders().add(o);   // solo lato inverso @OneToMany(mappedBy=\"customer\")\n// o.setCustomer(c) NON viene chiamato\nem.persist(o);\nem.getTransaction().commit();","options":[{"it":"customer_id resta NULL: la FK dipende dall\u0027owning side (Order.customer), non dalla collezione inversa","en":"customer_id stays NULL: the FK depends on the owning side (Order.customer), not on the inverse collection"},{"it":"customer_id viene valorizzato correttamente dalla collezione","en":"customer_id is set correctly from the collection"},{"it":"Viene lanciata un\u0027eccezione di violazione di vincolo","en":"A constraint violation exception is thrown"},{"it":"Vengono inserite due righe order","en":"Two order rows are inserted"}],"correct":0,"explanation":{"it":"In sintesi: la foreign key e gestita dall\u0027owning side, cioe `Order.customer`; poiche non e stato chiamato `o.setCustomer(c)`, Hibernate ignora l\u0027aggiunta alla collezione inversa (`mappedBy`) e persiste `customer_id` a NULL. Per questo nelle relazioni bidirezionali serve un helper che sincronizzi entrambi i lati.\nLe altre opzioni: la collezione inversa non valorizza la FK, non c\u0027e violazione di vincolo perche la colonna e nullable, e non vengono inserite righe duplicate.","en":"In summary: the foreign key is managed by the owning side, that is `Order.customer`; since `o.setCustomer(c)` was not called, Hibernate ignores the addition to the inverse collection (`mappedBy`) and persists `customer_id` as NULL. This is why bidirectional relationships need a helper that synchronizes both sides.\nThe other options: the inverse collection does not set the FK, there is no constraint violation because the column is nullable, and no duplicate rows are inserted."}},{"type":"code","prompt":{"it":"Cosa restituisce questa query JPQL?","en":"What does this JPQL query return?"},"code":"List\u003cObject[]\u003e rows = em.createQuery(\n    \"SELECT c.name, COUNT(o) FROM Customer c JOIN c.orders o \" +\n    \"GROUP BY c.name HAVING COUNT(o) \u003e 5\").getResultList();","options":[{"it":"Una lista di Object[] con nome cliente e numero di ordini, per i clienti con piu di 5 ordini","en":"A list of Object[] with the customer name and the order count, for customers with more than 5 orders"},{"it":"Una lista di entita Customer gestite dal persistence context","en":"A list of Customer entities managed by the persistence context"},{"it":"Un errore: JPQL non supporta GROUP BY/HAVING","en":"An error: JPQL does not support GROUP BY/HAVING"},{"it":"Una lista di Customer con la collezione orders gia inizializzata","en":"A list of Customers with the orders collection already initialized"}],"correct":0,"explanation":{"it":"In sintesi: la SELECT proietta due espressioni scalari (`c.name` e `COUNT(o)`), quindi ogni riga e un `Object[]` con nome e conteggio; il JOIN sull\u0027associazione, il GROUP BY e l\u0027HAVING sono JPQL pienamente validi e filtrano i clienti con piu di 5 ordini.\nLe altre opzioni: non si ottengono entita Customer managed perche e una proiezione, JPQL supporta GROUP BY/HAVING, e non c\u0027e alcun fetch della collezione.","en":"In summary: the SELECT projects two scalar expressions (`c.name` and `COUNT(o)`), so each row is an `Object[]` with the name and the count; the JOIN on the association, the GROUP BY and the HAVING are perfectly valid JPQL and filter the customers with more than 5 orders.\nThe other options: you do not get managed Customer entities because it is a projection, JPQL does support GROUP BY/HAVING, and there is no fetch of the collection."}},{"type":"mcq","prompt":{"it":"[Stretch] In un\u0027app Spring a layer ottieni LazyInitializationException nel layer di presentazione (es. serializzazione JSON). Qual e la soluzione architetturalmente piu corretta?","en":"[Stretch] In a layered Spring app you get a LazyInitializationException in the presentation layer (e.g. JSON serialization). What is the architecturally soundest solution?"},"code":"","options":[{"it":"Caricare i dati necessari dentro la transazione (JOIN FETCH/@EntityGraph/DTO) prima di uscire dal service","en":"Load the needed data within the transaction (JOIN FETCH/@EntityGraph/DTO) before leaving the service"},{"it":"Rendere tutte le associazioni EAGER","en":"Make all associations EAGER"},{"it":"Aumentare il timeout della transazione","en":"Increase the transaction timeout"},{"it":"Affidarsi a Open Session In View come pratica di default in produzione","en":"Rely on Open Session In View as a default practice in production"}],"correct":0,"explanation":{"it":"In sintesi: la soluzione pulita e definire esplicitamente cosa serve e caricarlo entro i confini transazionali del service, con JOIN FETCH, `@EntityGraph` o mappando su DTO, cosi il layer di presentazione riceve dati gia inizializzati e non tocca proxy LAZY.\nLe altre opzioni: EAGER globale genera over-fetch e N+1, il timeout non c\u0027entra con la sessione chiusa, e Open Session In View e generalmente considerato un anti-pattern in produzione perche tiene la sessione aperta fino alla view e nasconde le query.","en":"In summary: the clean solution is to explicitly define what is needed and load it within the service\u0027s transactional boundaries, using JOIN FETCH, `@EntityGraph`, or by mapping to a DTO, so the presentation layer receives already-initialized data and never touches LAZY proxies.\nThe other options: global EAGER causes over-fetching and N+1, the timeout has nothing to do with the closed session, and Open Session In View is generally considered an anti-pattern in production because it keeps the session open all the way to the view and hides the queries."}},{"type":"mcq","prompt":{"it":"A cosa serve la proprieta hibernate.default_batch_fetch_size (o l\u0027annotazione @BatchSize)?","en":"What is the hibernate.default_batch_fetch_size property (or the @BatchSize annotation) used for?"},"code":"","options":[{"it":"A caricare le associazioni LAZY di piu entita in poche query con IN (...), mitigando l\u0027N+1","en":"To load the LAZY associations of multiple entities in a few queries using IN (...), mitigating the N+1"},{"it":"A limitare il numero di righe restituite da ogni query","en":"To limit the number of rows returned by each query"},{"it":"A definire la dimensione del connection pool","en":"To define the connection pool size"},{"it":"A impostare la paginazione di default delle query JPQL","en":"To set the default pagination of JPQL queries"}],"correct":0,"explanation":{"it":"In sintesi: il batch fetching raggruppa l\u0027inizializzazione di piu proxy/collezioni LAZY in poche query che usano una clausola `IN (...)`, riducendo drasticamente il numero di round-trip rispetto al caricamento uno-per-uno: e un rimedio complementare a JOIN FETCH ed `@EntityGraph` contro l\u0027N+1.\nLe altre opzioni: non limita le righe di una query, non dimensiona il pool e non definisce la paginazione: agisce sul modo in cui vengono inizializzate le associazioni pigre.","en":"In summary: batch fetching groups the initialization of multiple LAZY proxies/collections into a few queries that use an `IN (...)` clause, drastically reducing the number of round-trips compared to loading them one by one: it is a complementary remedy to JOIN FETCH and `@EntityGraph` against the N+1.\nThe other options: it does not limit the rows of a query, it does not size the pool, and it does not define pagination: it acts on the way lazy associations are initialized."}}]},{"id":"rest","title":"REST \u0026 Web Services / API design","questions":[{"type":"truefalse","prompt":{"it":"In un\u0027architettura REST il server deve mantenere lo stato di sessione del client tra una richiesta e l\u0027altra.","en":"In a REST architecture, the server must maintain the client\u0027s session state between one request and the next."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":1,"explanation":{"it":"In sintesi: uno dei vincoli fondanti di REST è lo statelessness: ogni richiesta è autosufficiente e trasporta tutto il contesto necessario (credenziali, parametri), quindi il server non conserva stato di sessione tra chiamate. Questo abilita scalabilità orizzontale e load balancing perché qualsiasi nodo può servire qualsiasi richiesta.\nLe altre opzioni: l\u0027affermazione è falsa perché conservare la sessione lato server viola lo statelessness; lo stato applicativo vive sul client (es. il token), lo stato delle risorse nel database. L\u0027errore tipico è confondere sessione HTTP e persistenza dei dati.","en":"In summary: one of REST\u0027s founding constraints is statelessness: each request is self-contained and carries all the context it needs (credentials, parameters), so the server keeps no session state between calls. This enables horizontal scalability and load balancing, because any node can serve any request.\nThe other options: the statement is false because keeping the session on the server side violates statelessness; application state lives on the client (e.g. the token), and resource state lives in the database. The typical mistake is confusing the HTTP session with data persistence."}},{"type":"mcq","prompt":{"it":"In REST, qual è la relazione corretta tra risorsa e rappresentazione?","en":"In REST, what is the correct relationship between a resource and its representation?"},"code":"","options":[{"it":"La risorsa è il JSON restituito; la rappresentazione è l\u0027oggetto Java sul server","en":"The resource is the returned JSON; the representation is the Java object on the server"},{"it":"La risorsa è un concetto/entità identificato da un URI; la rappresentazione è una sua forma concreta serializzata (es. JSON, XML)","en":"The resource is a concept/entity identified by a URI; the representation is a concrete serialized form of it (e.g. JSON, XML)"},{"it":"Risorsa e rappresentazione sono sinonimi: entrambe indicano il payload della risposta","en":"Resource and representation are synonyms: both refer to the response payload"},{"it":"La rappresentazione è l\u0027URI; la risorsa è l\u0027insieme dei metodi HTTP disponibili","en":"The representation is the URI; the resource is the set of available HTTP methods"}],"correct":1,"explanation":{"it":"In sintesi: la risorsa è l\u0027entità astratta identificata da un URI (es. l\u0027utente 42), mentre la rappresentazione è una sua forma concreta e serializzata scambiata sul filo, tipicamente `application/json`. La stessa risorsa può avere più rappresentazioni (JSON, XML) negoziate via content negotiation.\nLe altre opzioni: confondere risorsa e payload JSON, trattarle come sinonimi o invertirle con l\u0027URI sono errori concettuali; l\u0027URI identifica, non rappresenta, e i metodi HTTP definiscono le operazioni, non la risorsa.","en":"In summary: the resource is the abstract entity identified by a URI (e.g. user 42), whereas the representation is a concrete, serialized form of it exchanged over the wire, typically `application/json`. The same resource can have multiple representations (JSON, XML) negotiated through content negotiation.\nThe other options: confusing the resource with the JSON payload, treating them as synonyms, or swapping them with the URI are conceptual errors; the URI identifies, it does not represent, and HTTP methods define the operations, not the resource."}},{"type":"mcq","prompt":{"it":"Cosa intende REST con \u0027uniform interface\u0027 (interfaccia uniforme)?","en":"What does REST mean by \u0027uniform interface\u0027?"},"code":"","options":[{"it":"Tutti gli endpoint devono usare lo stesso metodo HTTP","en":"All endpoints must use the same HTTP method"},{"it":"Un insieme uniforme di vincoli: identificazione delle risorse via URI, manipolazione tramite rappresentazioni, messaggi self-descriptive e uso dei metodi HTTP standard","en":"A uniform set of constraints: identifying resources via URIs, manipulation through representations, self-descriptive messages, and use of the standard HTTP methods"},{"it":"Le risposte devono avere sempre lo stesso Content-Type","en":"Responses must always have the same Content-Type"},{"it":"L\u0027interfaccia utente del client deve essere identica su tutti i dispositivi","en":"The client\u0027s user interface must be identical across all devices"}],"correct":1,"explanation":{"it":"In sintesi: l\u0027uniform interface è il vincolo che dà a REST la sua uniformità: risorse identificate da URI, manipolazione tramite rappresentazioni, messaggi self-descriptive (metodo, header, media type parlano da soli) e, opzionalmente, HATEOAS. È ciò che rende l\u0027API prevedibile e disaccoppia client e server.\nLe altre opzioni: non riguarda usare un solo metodo HTTP né un unico Content-Type (anzi la content negotiation è prevista), e non ha nulla a che vedere con la UI del client, che è un fraintendimento del termine \u0027interface\u0027.","en":"In summary: the uniform interface is the constraint that gives REST its uniformity: resources identified by URIs, manipulation through representations, self-descriptive messages (the method, headers and media type speak for themselves) and, optionally, HATEOAS. It is what makes the API predictable and decouples client and server.\nThe other options: it is not about using a single HTTP method or a single Content-Type (content negotiation is in fact expected), and it has nothing to do with the client\u0027s UI, which is a misreading of the term \u0027interface\u0027."}},{"type":"mcq","prompt":{"it":"Cosa aggiunge HATEOAS a una risposta REST?","en":"What does HATEOAS add to a REST response?"},"code":"","options":[{"it":"La compressione gzip del payload","en":"gzip compression of the payload"},{"it":"Link ipermediali che descrivono le transizioni di stato e le azioni disponibili sulla risorsa, così il client naviga senza URL hard-coded","en":"Hypermedia links that describe the available state transitions and actions on the resource, so the client navigates without hard-coded URLs"},{"it":"La firma digitale del payload per garantirne l\u0027integrità","en":"A digital signature of the payload to guarantee its integrity"},{"it":"Un header di versione per il controllo di compatibilità","en":"A version header for compatibility control"}],"correct":1,"explanation":{"it":"In sintesi: HATEOAS (Hypermedia As The Engine Of Application State) è il livello più maturo di REST: la risposta include link ipermediali (es. campi `_links` con rel e href) che indicano al client quali transizioni di stato può compiere, riducendo l\u0027accoppiamento e la necessità di URL cablati nel codice.\nLe altre opzioni: gzip è compressione a livello di trasporto, la firma riguarda l\u0027integrità/sicurezza e l\u0027header di versione è versioning: nessuna descrive gli hyperlink che guidano la navigazione dell\u0027applicazione.","en":"In summary: HATEOAS (Hypermedia As The Engine Of Application State) is REST\u0027s most mature level: the response includes hypermedia links (e.g. `_links` fields with rel and href) that tell the client which state transitions it can perform, reducing coupling and the need for URLs hard-wired into the code.\nThe other options: gzip is transport-level compression, the signature concerns integrity/security, and the version header is versioning: none of them describes the hyperlinks that drive the application\u0027s navigation."}},{"type":"mcq","prompt":{"it":"Quale metodo HTTP è semanticamente corretto per creare una nuova risorsa il cui identificativo è generato dal server?","en":"Which HTTP method is semantically correct for creating a new resource whose identifier is generated by the server?"},"code":"","options":[{"it":"GET","en":"GET"},{"it":"POST","en":"POST"},{"it":"PUT","en":"PUT"},{"it":"HEAD","en":"HEAD"}],"correct":1,"explanation":{"it":"In sintesi: `POST` è il metodo giusto quando si crea una risorsa subordinata a una collection e l\u0027id lo assegna il server; si fa `POST /orders` e la risposta è `201 Created` con header `Location`. `PUT` si usa invece quando è il client a conoscere in anticipo l\u0027URI finale della risorsa.\nLe altre opzioni: `GET` e `HEAD` sono safe e non modificano lo stato, quindi non creano nulla; `PUT` crea/sostituisce a un URI noto, non è il caso di id generato dal server.","en":"In summary: `POST` is the right method when you create a resource subordinate to a collection and the id is assigned by the server; you do `POST /orders` and the response is `201 Created` with a `Location` header. `PUT`, by contrast, is used when the client knows the resource\u0027s final URI in advance.\nThe other options: `GET` and `HEAD` are safe and do not modify state, so they create nothing; `PUT` creates/replaces at a known URI, which is not the case for a server-generated id."}},{"type":"truefalse","prompt":{"it":"Il metodo GET è considerato \u0027safe\u0027 perché non deve produrre effetti collaterali osservabili sullo stato del server.","en":"The GET method is considered \u0027safe\u0027 because it must not produce observable side effects on the server\u0027s state."},"code":"","options":[{"it":"Vero","en":"True"},{"it":"Falso","en":"False"}],"correct":0,"explanation":{"it":"In sintesi: `GET` è un metodo safe: la sua semantica è di sola lettura e non deve modificare lo stato osservabile della risorsa. Questo permette a proxy, browser e crawler di ripetere e mettere in cache le GET senza rischio di effetti collaterali.\nLe altre opzioni: l\u0027affermazione è vera; l\u0027errore tipico è nascondere operazioni di scrittura dietro una GET (es. `GET /deleteUser?id=5`), che viola il contratto safe e può causare cancellazioni involontarie da parte di crawler o prefetch.","en":"In summary: `GET` is a safe method: its semantics are read-only and it must not change the resource\u0027s observable state. This lets proxies, browsers and crawlers repeat and cache GETs with no risk of side effects.\nThe other options: the statement is true; the typical mistake is hiding write operations behind a GET (e.g. `GET /deleteUser?id=5`), which violates the safe contract and can cause unintended deletions by crawlers or prefetching."}},{"type":"mcq","prompt":{"it":"Quale gruppo di metodi HTTP è idempotente?","en":"Which group of HTTP methods is idempotent?"},"code":"","options":[{"it":"GET, POST, DELETE","en":"GET, POST, DELETE"},{"it":"GET, PUT, DELETE","en":"GET, PUT, DELETE"},{"it":"POST, PATCH, PUT","en":"POST, PATCH, PUT"},{"it":"POST, PUT, DELETE","en":"POST, PUT, DELETE"}],"correct":1,"explanation":{"it":"In sintesi: `GET`, `PUT` e `DELETE` sono idempotenti: ripetere la stessa richiesta N volte lascia il server nello stesso stato di una singola esecuzione. Idempotente non significa \u0027stessa risposta\u0027, ma \u0027stesso effetto sullo stato\u0027: un secondo `DELETE` può dare `404`, ma la risorsa resta cancellata.\nLe altre opzioni: tutte includono `POST`, che non è idempotente (ogni chiamata crea una nuova risorsa); `PATCH` in generale non è garantito idempotente, quindi va escluso dai gruppi che lo contengono.","en":"In summary: `GET`, `PUT` and `DELETE` are idempotent: repeating the same request N times leaves the server in the same state as a single execution. Idempotent does not mean \u0027same response\u0027, but \u0027same effect on state\u0027: a second `DELETE` may return `404`, yet the resource stays deleted.\nThe other options: all of them include `POST`, which is not idempotent (each call creates a new resource); `PATCH` is generally not guaranteed to be idempotent, so it is excluded from the groups that contain it."}},{"type":"truefalse","prompt":{"it":"Ripetere due volte la stessa richiesta POST per creare una risorsa produce sempre lo stesso identico risultato di una singola richiesta (idempotenza).","en":"Repeating the same POST request twice to create a resource alw
